<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Face Landmarker 3D Head Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#cameraCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#start{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:20;

    padding:16px 25px;
    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;
}

#status{
    position:fixed;
    left:50%;
    top:18px;
    transform:translateX(-50%);

    z-index:20;

    padding:10px 15px;
    border-radius:10px;

    background:rgba(0,0,0,.75);
    color:white;

    font-family:Arial,sans-serif;
    font-size:15px;
    text-align:center;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline
       muted
       style="display:none">
</video>

<canvas id="cameraCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div id="status">READY</div>

<button id="start">START FACE 3D</button>


<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   MEDIAPIPE FACE LANDMARKER
   Bundled ESM loader - avoids the old vision_bundle.mjs path
========================================================= */

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://esm.sh/@mediapipe/tasks-vision@0.10.22?bundle";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("video");

const cameraCanvas =
document.getElementById("cameraCanvas");

const threeCanvas =
document.getElementById("threeCanvas");

const startButton =
document.getElementById("start");

const status =
document.getElementById("status");

const cameraCtx =
cameraCanvas.getContext("2d");


/* =========================================================
   THREE SCENE
========================================================= */

const scene =
new THREE.Scene();


/*
   Orthographic camera.

   We use screen-like coordinates here.
   This makes it easier to see whether the
   3D head anchor is actually moving with
   the detected face.
*/

const camera3D =
new THREE.OrthographicCamera(
    -1,
     1,
     1,
    -1,
    0.01,
    100
);

camera3D.position.z = 5;


const renderer =
new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/* =========================================================
   LIGHT
========================================================= */

const ambient =
new THREE.AmbientLight(
    0xffffff,
    2.5
);

scene.add(ambient);


const directional =
new THREE.DirectionalLight(
    0xffffff,
    4
);

directional.position.set(
    2,
    3,
    5
);

scene.add(directional);


/* =========================================================
   3D HEAD ANCHOR
========================================================= */

const headAnchor =
new THREE.Group();

scene.add(headAnchor);


/*
   THIS IS THE IMPORTANT PART.

   The cube is NOT independently positioned
   on the screen.

   It belongs to headAnchor.

   Face Landmarker transformation matrix
   controls headAnchor.
*/

const cubeGroup =
new THREE.Group();

headAnchor.add(cubeGroup);


/* =========================================================
   CUBE
========================================================= */

const cubeGeometry =
new THREE.BoxGeometry(
    0.38,
    0.38,
    0.38
);

const cubeMaterial =
new THREE.MeshNormalMaterial();

const cube =
new THREE.Mesh(
    cubeGeometry,
    cubeMaterial
);

cubeGroup.add(cube);


/*
   Slight offset from the face.

   This is the model offset.

   Later GLB mask will replace this cube.
*/

cubeGroup.position.set(
    0,
    0,
    0
);


/* =========================================================
   FACE LANDMARKER
========================================================= */

let faceLandmarker = null;

let running = false;

let lastVideoTime = -1;


/* =========================================================
   CREATE FACE LANDMARKER
========================================================= */

async function createFaceLandmarker(){

    status.innerText =
    "LOADING FACE LANDMARKER...";


    const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"
            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:0.5,

            minFacePresenceConfidence:0.5,

            minTrackingConfidence:0.5,

            outputFaceBlendshapes:false,

            outputFacialTransformationMatrixes:true
        }
    );


    status.innerText =
    "FACE LANDMARKER READY ✓";
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    const stream =
    await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:"user",

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            }
        },

        audio:false
    });


    video.srcObject =
    stream;

    await video.play();


    resizeCanvases();


    startButton.style.display =
    "none";


    status.innerText =
    "CAMERA ON • LOADING TRACKING...";
}


/* =========================================================
   CAMERA DISPLAY
========================================================= */

function drawCamera(){

    if(
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){
        requestAnimationFrame(drawCamera);
        return;
    }


    const cw =
    cameraCanvas.width;

    const ch =
    cameraCanvas.height;


    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    if(!vw || !vh){

        requestAnimationFrame(drawCamera);
        return;
    }


    /*
       EXACT MIRRORED CAMERA DISPLAY.

       This keeps the camera orientation
       that was already working.
    */

    const scale =
    Math.max(
        cw / vw,
        ch / vh
    );


    const drawW =
    vw * scale;

    const drawH =
    vh * scale;


    const x =
    (cw - drawW) / 2;

    const y =
    (ch - drawH) / 2;


    cameraCtx.save();


    cameraCtx.clearRect(
        0,
        0,
        cw,
        ch
    );


    cameraCtx.translate(
        cw,
        0
    );

    cameraCtx.scale(
        -1,
        1
    );


    cameraCtx.drawImage(
        video,
        0,
        0,
        vw,
        vh,
        x,
        y,
        drawW,
        drawH
    );


    cameraCtx.restore();


    requestAnimationFrame(drawCamera);
}


/* =========================================================
   FACE TRACKING
========================================================= */

function trackFace(){

    if(
        !running ||
        !faceLandmarker ||
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){
        requestAnimationFrame(trackFace);
        return;
    }


    /*
       IMPORTANT:

       MediaPipe receives the RAW video.

       We do NOT give it the mirrored canvas.
    */


    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );


        if(
            result &&
            result.facialTransformationMatrixes &&
            result.facialTransformationMatrixes.length > 0
        ){

            const matrixData =
            result.facialTransformationMatrixes[0].data;


            /*
               MediaPipe's actual facial
               transformation matrix.
            */

            const faceMatrix =
            new THREE.Matrix4();

            faceMatrix.fromArray(
                matrixData
            );


            /*
               Extract:

               POSITION
               ROTATION
               SCALE

               from the facial transformation
               matrix.
            */

            const position =
            new THREE.Vector3();

            const rotation =
            new THREE.Quaternion();

            const scale =
            new THREE.Vector3();


            faceMatrix.decompose(
                position,
                rotation,
                scale
            );


            /*
               Apply the actual 3D head pose.
            */

            headAnchor.position.copy(
                position
            );

            headAnchor.quaternion.copy(
                rotation
            );


            /*
               Keep cube visible at a
               useful test scale.
            */

            cubeGroup.scale.set(
                1,
                1,
                1
            );


            status.innerText =
            "3D FACE TRACKING ✓";


        }else{

            status.innerText =
            "FACE NOT FOUND";

        }
    }


    requestAnimationFrame(
        trackFace
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    requestAnimationFrame(
        render
    );

    renderer.render(
        scene,
        camera3D
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvases(){

    const w =
    window.innerWidth;

    const h =
    window.innerHeight;


    cameraCanvas.width =
    w;

    cameraCanvas.height =
    h;


    threeCanvas.width =
    w;

    threeCanvas.height =
    h;


    renderer.setSize(
        w,
        h
    );


    /*
       Orthographic screen coordinates.
    */

    camera3D.left =
    -w / h;

    camera3D.right =
     w / h;

    camera3D.top =
     1;

    camera3D.bottom =
    -1;

    camera3D.updateProjectionMatrix();
}


/* =========================================================
   START
========================================================= */

startButton.onclick =
async function(){

    try{

        startButton.disabled =
        true;

        await createFaceLandmarker();

        await startCamera();

        running =
        true;

        drawCamera();

        trackFace();

        status.innerText =
        "LOOK AT CAMERA";

    }catch(error){

        console.error(error);

        status.innerText =
        "ERROR";

        alert(
            "FACE 3D ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

        startButton.disabled =
        false;
    }
};


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvases();

render();


window.addEventListener(
    "resize",
    resizeCanvases
);

</script>

</body>
</html>
