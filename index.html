<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azeez AR - Universal 3D</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#cameraStream{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#fff;
    background:rgba(0,0,0,.65);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    padding:10px;
    background:rgba(0,0,0,.72);
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
}

button,
label{
    border:0;
    border-radius:9px;
    padding:10px 13px;
    background:#fff;
    color:#111;
    font-size:13px;
    font-weight:bold;
}

button:active,
label:active{
    transform:scale(.96);
}

input[type=file]{
    display:none;
}

.sliderBox{
    width:100%;
    max-width:420px;
    color:white;
    font-size:12px;
}

.sliderBox input{
    width:100%;
}

#loading{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.65);
    color:#fff;
    align-items:center;
    justify-content:center;
    font-size:18px;
}
</style>

<!-- THREE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- THREE LOADERS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>

<body>

<video id="cameraStream" autoplay muted playsinline></video>
<canvas id="threeCanvas"></canvas>

<div id="status">Starting...</div>
<div id="loading">Loading 3D Character...</div>

<div id="controls">

    <label>
        Import 3D
        <input
            id="modelInput"
            type="file"
            accept=".glb,.gltf,.obj,.fbx"
        >
    </label>

    <button id="flipBtn">Flip Camera</button>
    <button id="resetBtn">Reset</button>

    <div class="sliderBox">
        Character Size
        <input id="scaleSlider"
               type="range"
               min="0.4"
               max="2.5"
               step="0.01"
               value="1">
    </div>

    <div class="sliderBox">
        X Position
        <input id="xSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
    </div>

    <div class="sliderBox">
        Y Position
        <input id="ySlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
    </div>

    <div class="sliderBox">
        Z Position
        <input id="zSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
    </div>

    <button id="snapshotBtn">Snapshot</button>
    <button id="recordBtn">Rec</button>
    <button id="stopBtn">Stop</button>
    <button id="downloadBtn">Download</button>

</div>

<script>

/* =========================================================
   UNIVERSAL 3D AR SYSTEM
   ========================================================= */

const video = document.getElementById("cameraStream");
const canvas = document.getElementById("threeCanvas");
const statusEl = document.getElementById("status");
const loadingEl = document.getElementById("loading");

let scene;
let renderer;
let arCamera;
let faceMesh;
let cameraController;

let currentModel = null;
let modelContainer = null;

let useFrontCamera = true;

/* User adjustments */
let userScale = 1;
let userX = 0;
let userY = 0;
let userZ = 0;

/* Smooth tracking */
const smooth = {
    x:0,
    y:0,
    z:0,
    yaw:0,
    pitch:0,
    roll:0,
    scale:1
};

let faceVisible = false;


/* =========================================================
   THREE.JS INIT
   ========================================================= */

function init3D(){

    scene = new THREE.Scene();

    /*
       Perspective camera.
       Character stays in front of the camera.
    */
    arCamera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    arCamera.position.set(0,0,3);

    renderer = new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true,
        preserveDrawingBuffer:true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    /* Lights */

    const ambient = new THREE.AmbientLight(
        0xffffff,
        1.4
    );

    scene.add(ambient);

    const light1 = new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    light1.position.set(
        2,
        3,
        5
    );

    scene.add(light1);

    const light2 = new THREE.DirectionalLight(
        0xffffff,
        0.7
    );

    light2.position.set(
        -3,
        1,
        2
    );

    scene.add(light2);


    /*
       Container is important.

       We don't directly move the imported model.
       We move this container.

       Therefore GLB / GLTF / OBJ / FBX can all
       use the same face-tracking system.
    */

    modelContainer = new THREE.Group();

    modelContainer.visible = false;

    scene.add(modelContainer);


    /*
       Render loop
    */

    function render(){

        requestAnimationFrame(render);

        if(currentModel){

            /*
               Extra user controls
            */

            currentModel.scale.setScalar(
                userScale
            );

        }

        renderer.render(
            scene,
            arCamera
        );
    }

    render();


    window.addEventListener(
        "resize",
        resizeRenderer
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeRenderer(){

    if(!renderer || !arCamera) return;

    arCamera.aspect =
        window.innerWidth /
        window.innerHeight;

    arCamera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   MEDIAPIPE FACE MESH
   ========================================================= */

function initFaceTracking(){

    faceMesh = new FaceMesh({
        locateFile: function(file){

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
            + file;
        }
    });

    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.55,

        minTrackingConfidence:0.55

    });


    faceMesh.onResults(
        onFaceResults
    );
}


/* =========================================================
   FACE RESULT
   ========================================================= */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        faceVisible = false;

        if(modelContainer){

            modelContainer.visible = false;

        }

        statusEl.innerText =
            "Face not detected";

        return;
    }


    faceVisible = true;

    if(modelContainer){

        modelContainer.visible = true;

    }


    const lm =
        results.multiFaceLandmarks[0];


    /*
       Important face points
    */

    const nose = lm[1];

    const forehead = lm[10];

    const chin = lm[152];

    const leftFace = lm[234];

    const rightFace = lm[454];

    const leftEye = lm[33];

    const rightEye = lm[263];


    /*
       Face center

       We use forehead + chin instead of
       only nose. This makes character placement
       much more stable.
    */

    const centerX =
        (
            forehead.x +
            chin.x +
            nose.x
        ) / 3;

    const centerY =
        (
            forehead.y +
            chin.y +
            nose.y
        ) / 3;


    /*
       Face width
    */

    const faceWidth =
        Math.abs(
            rightFace.x -
            leftFace.x
        );


    /*
       Face height
    */

    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    /*
       Convert mirrored screen coordinates
       to Three.js coordinates.
    */

    const targetX =
        (0.5 - centerX) * 3.2
        + userX;

    const targetY =
        (0.5 - centerY) * 2.6
        + userY;


    /*
       Stable depth.

       We DO NOT use raw MediaPipe nose.z
       directly because that causes the model
       to jump around.

       Instead face size controls depth.
    */

    const sizeFactor =
        THREE.MathUtils.clamp(
            faceWidth,
            0.05,
            0.55
        );

    const targetZ =
        userZ;


    /*
       =====================================================
       YAW
       =====================================================

       Compare nose position with eye center.

       This is much more stable than using only
       nose.z.
    */

    const eyeCenterX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    const yawRaw =
        (
            nose.x -
            eyeCenterX
        ) /
        Math.max(
            faceWidth,
            0.001
        );


    const targetYaw =
        THREE.MathUtils.clamp(
            yawRaw * 2.2,
            -0.9,
            0.9
        );


    /*
       =====================================================
       ROLL
       =====================================================
    */

    const eyeDX =
        rightEye.x -
        leftEye.x;

    const eyeDY =
        rightEye.y -
        leftEye.y;

    const targetRoll =
        -Math.atan2(
            eyeDY,
            eyeDX
        );


    /*
       =====================================================
       PITCH
       =====================================================
    */

    const verticalFace =
        Math.max(
            chin.y -
            forehead.y,
            0.001
        );

    const noseVertical =
        nose.y -
        forehead.y;

    const pitchRatio =
        noseVertical /
        verticalFace;


    const targetPitch =
        THREE.MathUtils.clamp(
            (pitchRatio - 0.48) * 2.5,
            -0.7,
            0.7
        );


    /*
       =====================================================
       AUTOMATIC CHARACTER SCALE
       =====================================================

       This is the important universal part.

       Different characters can have different
       original sizes.

       We normalize their bounding box when imported,
       then face width controls their size.
    */

    const targetScale =
        THREE.MathUtils.clamp(
            sizeFactor * 7.0,
            0.35,
            3.0
        ) * userScale;


    /*
       =====================================================
       SMOOTHING
       =====================================================
    */

    const speed = 0.28;

    smooth.x +=
        (targetX - smooth.x) *
        speed;

    smooth.y +=
        (targetY - smooth.y) *
        speed;

    smooth.z +=
        (targetZ - smooth.z) *
        speed;

    smooth.yaw +=
        (targetYaw - smooth.yaw) *
        speed;

    smooth.pitch +=
        (targetPitch - smooth.pitch) *
        speed;

    smooth.roll +=
        (targetRoll - smooth.roll) *
        speed;

    smooth.scale +=
        (targetScale - smooth.scale) *
        speed;


    /*
       Apply tracking to container.
    */

    modelContainer.position.set(
        smooth.x,
        smooth.y,
        smooth.z
    );

    modelContainer.rotation.order =
        "YXZ";

    modelContainer.rotation.y =
        smooth.yaw;

    modelContainer.rotation.x =
        smooth.pitch;

    modelContainer.rotation.z =
        smooth.roll;


    /*
       Current model itself stays centered
       inside the container.
    */

    statusEl.innerText =
        "Face Tracking ON";
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera(){

    try{

        statusEl.innerText =
            "Starting camera...";


        if(cameraController){

            try{
                cameraController.stop();
            }catch(e){}

            cameraController = null;
        }


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            video.srcObject = null;
        }


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:
                        useFrontCamera
                        ? "user"
                        : "environment",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false
            });


        video.srcObject = stream;

        await video.play();


        cameraController =
            new Camera(
                video,
                {
                    onFrame:async function(){

                        await faceMesh.send({
                            image:video
                        });

                    },

                    width:640,

                    height:480
                }
            );


        cameraController.start();


        statusEl.innerText =
            "Camera ON - Show your face";


    }catch(error){

        console.error(error);

        statusEl.innerText =
            "Camera error: " +
            error.message;
    }
}


/* =========================================================
   FLIP CAMERA
   ========================================================= */

document
.getElementById("flipBtn")
.addEventListener(
    "click",
    async function(){

        useFrontCamera =
            !useFrontCamera;

        await startCamera();
    }
);


/* =========================================================
   SLIDERS
   ========================================================= */

document
.getElementById("scaleSlider")
.addEventListener(
    "input",
    function(){

        userScale =
            parseFloat(this.value);
    }
);


document
.getElementById("xSlider")
.addEventListener(
    "input",
    function(){

        userX =
            parseFloat(this.value);
    }
);


document
.getElementById("ySlider")
.addEventListener(
    "input",
    function(){

        userY =
            parseFloat(this.value);
    }
);


document
.getElementById("zSlider")
.addEventListener(
    "input",
    function(){

        userZ =
            parseFloat(this.value);
    }
);


/* =========================================================
   RESET
   ========================================================= */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    function(){

        userScale = 1;
        userX = 0;
        userY = 0;
        userZ = 0;

        document
        .getElementById("scaleSlider")
        .value = 1;

        document
        .getElementById("xSlider")
        .value = 0;

        document
        .getElementById("ySlider")
        .value = 0;

        document
        .getElementById("zSlider")
        .value = 0;
    }
);/* =========================================================
   UNIVERSAL MODEL NORMALIZATION
   ========================================================= */

function normalizeModel(object){

    /*
       Remove old model
    */

    if(currentModel){

        modelContainer.remove(
            currentModel
        );

        currentModel = null;
    }


    /*
       Put imported object into container
    */

    currentModel = object;


    /*
       Calculate original bounding box
    */

    const box =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );


    const size =
        new THREE.Vector3();

    const center =
        new THREE.Vector3();


    box.getSize(size);

    box.getCenter(center);


    /*
       Find biggest dimension.
    */

    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        !isFinite(maxDimension) ||
        maxDimension <= 0
    ){

        console.warn(
            "Invalid 3D model size"
        );

        return;
    }


    /*
       Normalize every model to approximately
       the same base size.

       This is what makes GLB / GLTF / OBJ / FBX
       interchangeable.
    */

    const normalizedSize = 2.0;

    const factor =
        normalizedSize /
        maxDimension;


    currentModel.scale.setScalar(
        factor
    );


    /*
       Recalculate center after scaling.
    */

    const scaledBox =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );

    const scaledCenter =
        new THREE.Vector3();

    scaledBox.getCenter(
        scaledCenter
    );


    /*
       Move model so its center is at
       container origin.
    */

    currentModel.position.sub(
        scaledCenter
    );


    /*
       Add model to tracking container.
    */

    modelContainer.add(
        currentModel
    );


    /*
       Enable shadows where possible.
    */

    currentModel.traverse(
        function(child){

            if(child.isMesh){

                child.frustumCulled = false;

                child.castShadow = true;

                child.receiveShadow = true;


                /*
                   Some imported models have
                   no material. Give them a basic
                   material so they remain visible.
                */

                if(!child.material){

                    child.material =
                        new THREE.MeshStandardMaterial({
                            color:0xffffff,
                            roughness:0.7,
                            metalness:0.05
                        });
                }
            }
        }
    );


    /*
       Show model.
    */

    modelContainer.visible =
        faceVisible;


    statusEl.innerText =
        "3D Character Loaded";


    console.log(
        "Universal model loaded:",
        currentModel
    );
}


/* =========================================================
   GLB / GLTF
   ========================================================= */

function loadGLTF(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const loader =
                        new THREE.GLTFLoader();


                    loader.parse(

                        event.target.result,

                        "",

                        function(gltf){

                            resolve(
                                gltf.scene
                            );

                        },

                        function(error){

                            reject(error);

                        }
                    );
                };


            reader.onerror =
                reject;


            reader.readAsArrayBuffer(
                file
            );
        }
    );
}


/* =========================================================
   OBJ
   ========================================================= */

function loadOBJ(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    try{

                        const loader =
                            new THREE.OBJLoader();


                        const object =
                            loader.parse(
                                event.target.result
                            );


                        resolve(object);

                    }catch(error){

                        reject(error);
                    }
                };


            reader.onerror =
                reject;


            reader.readAsText(
                file
            );
        }
    );
}


/* =========================================================
   FBX
   ========================================================= */

function loadFBX(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    try{

                        const loader =
                            new THREE.FBXLoader();


                        const object =
                            loader.parse(
                                event.target.result,
                                ""
                            );


                        resolve(object);

                    }catch(error){

                        reject(error);
                    }
                };


            reader.onerror =
                reject;


            reader.readAsArrayBuffer(
                file
            );
        }
    );
}


/* =========================================================
   IMPORT 3D
   ========================================================= */

document
.getElementById("modelInput")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;
        }


        const name =
            file.name.toLowerCase();


        loadingEl.style.display =
            "flex";

        statusEl.innerText =
            "Loading " + file.name;


        try{

            let object = null;


            /*
               GLB / GLTF
            */

            if(
                name.endsWith(".glb") ||
                name.endsWith(".gltf")
            ){

                object =
                    await loadGLTF(file);
            }


            /*
               OBJ
            */

            else if(
                name.endsWith(".obj")
            ){

                object =
                    await loadOBJ(file);
            }


            /*
               FBX
            */

            else if(
                name.endsWith(".fbx")
            ){

                object =
                    await loadFBX(file);
            }


            else{

                throw new Error(
                    "Unsupported 3D format"
                );
            }


            /*
               Universal normalization
            */

            normalizeModel(
                object
            );


        }catch(error){

            console.error(
                "3D LOAD ERROR:",
                error
            );

            statusEl.innerText =
                "Model loading failed";


            alert(
                "3D model load nahi hua.\n\n" +
                "GLB format sabse reliable hai."
            );

        }finally{

            loadingEl.style.display =
                "none";
        }
    }
);


/* =========================================================
   SNAPSHOT
   ========================================================= */

document
.getElementById("snapshotBtn")
.addEventListener(
    "click",
    function(){

        /*
           Create final image canvas.
        */

        const output =
            document.createElement(
                "canvas"
            );

        output.width =
            video.videoWidth ||
            window.innerWidth;

        output.height =
            video.videoHeight ||
            window.innerHeight;


        const ctx =
            output.getContext("2d");


        /*
           Mirror camera so snapshot
           looks like the screen.
        */

        ctx.save();

        ctx.translate(
            output.width,
            0
        );

        ctx.scale(
            -1,
            1
        );


        ctx.drawImage(
            video,
            0,
            0,
            output.width,
            output.height
        );

        ctx.restore();


        /*
           Draw Three.js character
           on top.
        */

        ctx.drawImage(
            canvas,
            0,
            0,
            output.width,
            output.height
        );


        const link =
            document.createElement(
                "a"
            );

        link.download =
            "azeez-ar.jpg";

        link.href =
            output.toDataURL(
                "image/jpeg",
                0.95
            );

        link.click();
    }
);


/* =========================================================
   VIDEO RECORDING
   ========================================================= */

let mediaRecorder = null;
let recordedChunks = [];


document
.getElementById("recordBtn")
.addEventListener(
    "click",
    function(){

        if(
            !canvas.captureStream
        ){

            alert(
                "Video recording is not supported."
            );

            return;
        }


        recordedChunks = [];


        const stream =
            canvas.captureStream(30);


        /*
           Add camera stream to recording.
        */

        const tracks =
            stream.getVideoTracks();


        const cameraTracks =
            video.srcObject
            ? video.srcObject.getVideoTracks()
            : [];


        cameraTracks.forEach(
            function(track){

                /*
                   We use canvas video composition.
                   Camera itself is not added because
                   canvas is transparent.

                   For best browser compatibility,
                   recording will capture the 3D layer.
                */
            }
        );


        try{

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            "video/webm"
                    }
                );

        }catch(error){

            mediaRecorder =
                new MediaRecorder(
                    stream
                );
        }


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            function(){

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                "video/webm"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );

                a.href = url;

                a.download =
                    "azeez-ar-recording.webm";

                a.click();


                setTimeout(
                    function(){

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );
            };


        mediaRecorder.start();

        statusEl.innerText =
            "Recording ON";
    }
);


/* =========================================================
   STOP RECORDING
   ========================================================= */

document
.getElementById("stopBtn")
.addEventListener(
    "click",
    function(){

        if(
            mediaRecorder &&
            mediaRecorder.state !== "inactive"
        ){

            mediaRecorder.stop();

            statusEl.innerText =
                "Recording saved";
        }
    }
);


/* =========================================================
   START EVERYTHING
   ========================================================= */

async function startApp(){

    init3D();

    initFaceTracking();

    await startCamera();
}


startApp();

</script>

</body>
</html>
