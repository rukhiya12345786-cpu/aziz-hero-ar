<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Azeez AR Head Filter</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* Camera */

#camera {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    transform: scaleX(-1);
}

/* 3D layer */

#threeCanvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/* Face landmark layer */

#landmarkCanvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    transform: scaleX(-1);
}

/* Top status */

#topBar {
    position: absolute;

    top: env(safe-area-inset-top, 8px);
    left: 12px;
    right: 12px;

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 9px 12px;

    border-radius: 14px;

    background: rgba(0,0,0,0.42);

    color: #fff;

    backdrop-filter: blur(10px);
}

#appName {
    font-size: 14px;
    font-weight: 700;
}

#status {
    font-size: 11px;
    color: #00ff66;
}

/* Bottom filter panel */

#bottomPanel {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 30;

    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));

    border-radius: 24px 24px 0 0;

    background: rgba(12,12,12,0.90);

    backdrop-filter: blur(18px);

    color: #fff;
}

/* Drag handle */

#panelHandle {
    width: 42px;
    height: 5px;

    margin: 0 auto 10px;

    border-radius: 10px;

    background: rgba(255,255,255,0.45);
}

/* Filter title */

#filterTitle {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 8px;
}

#filterTitle strong {
    font-size: 14px;
}

#filterState {
    font-size: 10px;
    color: #00ff66;
}

/* Main buttons */

.buttonRow {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 6px;

    margin-bottom: 8px;
}

.arButton {
    min-height: 38px;

    border: 0;
    border-radius: 10px;

    background: #252525;

    color: #fff;

    font-size: 10px;
    font-weight: 700;

    touch-action: manipulation;
}

.arButton:active {
    transform: scale(0.96);
}

/* Active button */

.arButton.active {
    background: #00d95f;
    color: #000;
}

/* Slider section */

#controls {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

    max-height: 220px;

    overflow-y: auto;

    padding-right: 2px;
}

/* Individual control */

.control {
    padding: 7px 8px;

    border-radius: 12px;

    background: rgba(255,255,255,0.055);
}

.controlTop {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 5px;
}

.controlName {
    font-size: 10px;
    font-weight: 700;
    color: #ddd;
}

.controlValue {
    min-width: 38px;

    text-align: right;

    font-size: 10px;

    color: #00ff66;
}

/* Real slider */

.control input[type="range"] {
    display: block;

    width: 100%;
    height: 24px;

    margin: 0;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    touch-action: pan-x;
}

/* Track */

.control input[type="range"]::-webkit-slider-runnable-track {
    height: 5px;

    border-radius: 10px;

    background: #555;
}

/* Slider thumb */

.control input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 20px;
    height: 20px;

    margin-top: -7.5px;

    border-radius: 50%;

    border: 2px solid #fff;

    background: #00ff66;

    box-shadow:
        0 0 0 3px rgba(0,255,102,0.18);

}

/* Firefox */

.control input[type="range"]::-moz-range-track {
    height: 5px;

    border-radius: 10px;

    background: #555;
}

.control input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;

    border-radius: 50%;

    border: 2px solid #fff;

    background: #00ff66;
}

/* Import */

#importFile {
    display: none;
}

/* Bottom action row */

#actionRow {
    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 6px;

    margin-top: 8px;
}

.actionButton {
    min-height: 38px;

    border: 0;
    border-radius: 10px;

    background: #303030;

    color: #fff;

    font-size: 10px;
    font-weight: 700;
}

/* Mobile */

@media (max-width: 500px) {

    #controls {
        grid-template-columns: 1fr 1fr;
        max-height: 205px;
    }

    .buttonRow {
        grid-template-columns:
            repeat(4, 1fr);
    }

}

/* Very small screens */

@media (max-height: 650px) {

    #controls {
        max-height: 150px;
    }

    #bottomPanel {
        padding-top: 7px;
    }

    .control {
        padding: 5px 7px;
    }

}

/* Landscape */

@media (orientation: landscape) {

    #bottomPanel {
        left: auto;
        width: 330px;

        max-height: 100vh;

        border-radius: 20px 0 0 20px;

        overflow-y: auto;
    }

    #controls {
        grid-template-columns: 1fr;
        max-height: none;
    }

}

</style>

    <canvas id="threeCanvas"></canvas>

    <!-- Top status -->

    <div id="topBar">

        <div id="appName">

        </div>

        <div id="status">

        </div>

    </div>


    <!-- Bottom TikTok-style control panel -->

    <div id="bottomPanel">

        <div id="panelHandle"></div>


        <div id="filterTitle">

            <strong>
                HEAD FILTER
            </strong>

            <span id="filterState">

        <!-- Main controls -->

            >

            <div class="control">

                        0
                    </span>

                <input

            <div class="control">

            <div class="control">

        <!-- Bottom actions -->

        <div id="actionRow">

            <button

            <button

</div>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


const video =
    document.getElementById("camera");

const threeCanvas =
    document.getElementById("threeCanvas");

const landmarkCanvas =
    document.getElementById("landmarkCanvas");

const landmarkCtx =
    landmarkCanvas.getContext("2d");


const status =
    document.getElementById("status");

const filterState =
    document.getElementById("filterState");


const cameraButton =
    document.getElementById("cameraButton");

const switchButton =
    document.getElementById("switchButton");

const mirrorButton =
    document.getElementById("mirrorButton");

const trackingButton =
    document.getElementById("trackingButton");

const importButton =
    document.getElementById("importButton");

const resetButton =
    document.getElementById("resetButton");

const hidePanelButton =
    document.getElementById("hidePanelButton");

const importFile =
    document.getElementById("importFile");


const xSlider =
    document.getElementById("xSlider");

const ySlider =
    document.getElementById("ySlider");

const zSlider =
    document.getElementById("zSlider");

const scaleSlider =
    document.getElementById("scaleSlider");

const rotXSlider =
    document.getElementById("rotXSlider");

const rotYSlider =
    document.getElementById("rotYSlider");

const rotZSlider =
    document.getElementById("rotZSlider");

const fitSlider =
    document.getElementById("fitSlider");


const xValue =
    document.getElementById("xValue");

const yValue =
    document.getElementById("yValue");

const zValue =
    document.getElementById("zValue");

const scaleValue =
    document.getElementById("scaleValue");

const rotXValue =
    document.getElementById("rotXValue");

const rotYValue =
    document.getElementById("rotYValue");

const rotZValue =
    document.getElementById("rotZValue");

const fitValue =
    document.getElementById("fitValue");


let renderer = null;

let scene = null;

let camera3D = null;

let headAnchor = null;

let modelRoot = null;

let dummyHead = null;

let occlusionHead = null;

let faceLandmarker = null;

let stream = null;

let currentFacing =
    "user";

let trackingEnabled =
    true;

let mirrorEnabled =
    true;

let lastVideoTime =
    -1;

let faceDetected =
    false;


const loader =
    new GLTFLoader();


const settings = {

    x: 0,

    y: 0,

    z: 0,

    scale: 1,

    rotX: 0,

    rotY: 0,

    rotZ: 0,

    fit: 1

};


function setStatus(text) {

    status.textContent =
        text;

}


function createScene() {

    renderer =
        new THREE.WebGLRenderer({

            canvas:
                threeCanvas,

            alpha:
                true,

            antialias:
                true,

            preserveDrawingBuffer:
                true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.OrthographicCamera(
            0,
            window.innerWidth,
            0,
            window.innerHeight,
            -5000,
            5000
        );


    camera3D.position.z =
        1000;


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2.5
        );


    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        0,
        300,
        500
    );


    scene.add(
        light
    );


    headAnchor =
        new THREE.Group();


    scene.add(
        headAnchor
    );


    createDummyHead();

    createOcclusionHead();

    resizeScene();

}


function createDummyHead() {

    if (dummyHead) {

        headAnchor.remove(
            dummyHead
        );

    }


    dummyHead =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x4da6ff,

            transparent:
                true,

            opacity:
                0.22,

            depthWrite:
                false

        });


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                105,
                48,
                48
            ),

            material

        );


    head.scale.set(
        1,
        1.18,
        0.9
    );


    dummyHead.add(
        head
    );


    headAnchor.add(
        dummyHead
    );


    dummyHead.visible =
        modelRoot === null;

}


function createOcclusionHead() {

    if (occlusionHead) {

        headAnchor.remove(
            occlusionHead
        );

    }


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xffffff,

            colorWrite:
                false,

            depthWrite:
                true,

            depthTest:
                true

        });


    occlusionHead =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                105,
                48,
                48
            ),

            material

        );


    occlusionHead.scale.set(
        1,
        1.18,
        0.9
    );


    occlusionHead.renderOrder =
        1;


    headAnchor.add(
        occlusionHead
    );

}function resizeScene() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    renderer.setSize(
        width,
        height
    );


    threeCanvas.width =
        width;

    threeCanvas.height =
        height;


    landmarkCanvas.width =
        width;

    landmarkCanvas.height =
        height;


    camera3D.left =
        0;

    camera3D.right =
        width;

    camera3D.top =
        0;

    camera3D.bottom =
        height;


    camera3D.near =
        -5000;

    camera3D.far =
        5000;


    camera3D.updateProjectionMatrix();

}


/* Camera */

async function startCamera() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            setStatus(
                "CAMERA NOT SUPPORTED"
            );

            return;

        }


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        setStatus(
            "STARTING CAMERA..."
        );


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                currentFacing
                        },

                        width: {
                            ideal:
                                1280
                        },

                        height: {
                            ideal:
                                720
                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        resizeScene();


        cameraButton.classList.add(
            "active"
        );


        setStatus(
            "CAMERA ON"
        );


        if (!faceLandmarker) {

            await setupFaceTracking();

        }

    } catch (error) {

        console.error(error);


        setStatus(
            "CAMERA ERROR"
        );

    }

}


/* Camera switch */

async function switchCamera() {

    currentFacing =
        currentFacing === "user"
            ? "environment"
            : "user";


    await startCamera();

}


/* Mirror */

function updateMirror() {

    const transform =
        mirrorEnabled
            ? "scaleX(-1)"
            : "scaleX(1)";


    video.style.transform =
        transform;


    landmarkCanvas.style.transform =
        transform;


    mirrorButton.textContent =
        mirrorEnabled
            ? "MIRROR"
            : "NORMAL";


    mirrorButton.classList.toggle(
        "active",
        mirrorEnabled
    );

}


/* Face tracking setup */

async function setupFaceTracking() {

    try {

        setStatus(
            "LOADING FACE TRACKER..."
        );


        const vision =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
            );


        const {
            FaceLandmarker,
            FilesetResolver
        } = vision;


        const fileset =
            await FilesetResolver
                .forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );


        faceLandmarker =
            await FaceLandmarker
                .createFromOptions(

                    fileset,

                    {

                        baseOptions: {

                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                            delegate:
                                "GPU"

                        },


                        runningMode:
                            "VIDEO",


                        numFaces:
                            1,


                        minFaceDetectionConfidence:
                            0.5,


                        minFacePresenceConfidence:
                            0.5,


                        minTrackingConfidence:
                            0.5,


                        outputFaceBlendshapes:
                            false,


                        outputFacialTransformationMatrixes:
                            true

                    }

                );


        setStatus(
            "FACE TRACKER READY"
        );


        requestAnimationFrame(
            trackFace
        );


    } catch (error) {

        console.error(error);


        setStatus(
            "TRACKER ERROR"
        );

    }

}


/* Face tracking */

function trackFace() {

    requestAnimationFrame(
        trackFace
    );


    if (
        !trackingEnabled ||
        !faceLandmarker ||
        video.readyState < 2
    ) {

        return;

    }


    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    try {

        const result =
            faceLandmarker
                .detectForVideo(
                    video,
                    performance.now()
                );


        if (
            result.faceLandmarks &&
            result.faceLandmarks.length > 0
        ) {

            const landmarks =
                result.faceLandmarks[0];


            updateHead(
                landmarks,
                result
            );


            drawLandmarks(
                landmarks
            );


            faceDetected =
                true;


            filterState.textContent =
                "FACE LOCKED";


            setStatus(
                "FACE TRACKING"
            );


        } else {

            faceDetected =
                false;


            clearLandmarks();


            filterState.textContent =
                "SEARCHING";


            setStatus(
                "LOOK AT CAMERA"
            );

        }

    } catch (error) {

        console.error(error);

    }

}


/* Head movement */

function updateHead(
    landmarks,
    result
) {

    if (
        !landmarks ||
        landmarks.length < 264
    ) {

        return;

    }


    const leftEye =
        landmarks[33];

    const rightEye =
        landmarks[263];

    const forehead =
        landmarks[10];

    const chin =
        landmarks[152];


    const centerX =
        (
            leftEye.x +
            rightEye.x
        ) *
        0.5;


    const centerY =
        (
            forehead.y +
            chin.y
        ) *
        0.5;


    const screenX =
        centerX *
        window.innerWidth;


    const screenY =
        centerY *
        window.innerHeight;


    headAnchor.position.x =
        screenX;


    headAnchor.position.y =
        screenY;


    headAnchor.position.z =
        0;


    const faceHeight =
        Math.sqrt(

            Math.pow(
                forehead.x -
                chin.x,
                2
            )

            +

            Math.pow(
                forehead.y -
                chin.y,
                2
            )

        ) *
        window.innerHeight;


    const safeHeight =
        Math.max(
            80,
            Math.min(
                faceHeight,
                900
            )
        );


    const automaticScale =
        (
            safeHeight /
            220
        ) *
        settings.fit;


    headAnchor.scale.set(
        automaticScale,
        automaticScale,
        automaticScale
    );


    /* Head rotation */

    if (
        result
            .facialTransformationMatrixes &&
        result
            .facialTransformationMatrixes
            .length > 0
    ) {

        const matrixData =
            result
                .facialTransformationMatrixes[0]
                .data;


        if (
            matrixData &&
            matrixData.length === 16
        ) {

            const matrix =
                new THREE.Matrix4();


            matrix.fromArray(
                matrixData
            );


            const position =
                new THREE.Vector3();


            const quaternion =
                new THREE.Quaternion();


            const scale =
                new THREE.Vector3();


            matrix.decompose(
                position,
                quaternion,
                scale
            );


            /*
             * Keep the MediaPipe
             * head rotation.
             */

            headAnchor.quaternion.copy(
                quaternion
            );

        }

    }


    updateModelTransform();

}


/* Green face dots */

function drawLandmarks(
    landmarks
) {

    landmarkCtx.clearRect(
        0,
        0,
        landmarkCanvas.width,
        landmarkCanvas.height
    );


    const points = [

        10,
        151,
        9,
        8,

        70,
        63,
        105,
        107,

        33,
        133,
        159,
        145,

        263,
        362,
        386,
        374,

        1,
        2,
        4,

        61,
        291,

        13,
        14,

        199,
        152

    ];


    landmarkCtx.fillStyle =
        "#00ff55";


    for (
        const index of points
    ) {

        const point =
            landmarks[index];


        if (!point) {
            continue;
        }


        const x =
            point.x *
            landmarkCanvas.width;


        const y =
            point.y *
            landmarkCanvas.height;


        landmarkCtx.beginPath();


        landmarkCtx.arc(
            x,
            y,
            5,
            0,
            Math.PI * 2
        );


        landmarkCtx.fill();

    }

}


/* Clear dots */

function clearLandmarks() {

    landmarkCtx.clearRect(
        0,
        0,
        landmarkCanvas.width,
        landmarkCanvas.height
    );

}

window.addEventListener(

/* Initial setup */

createScene();

updateMirror();

setStatus(
    "READY"
);function prepareModel(root) {

    root.updateMatrixWorld(true);


    const box =
        new THREE.Box3();


    box.setFromObject(
        root
    );


    if (box.isEmpty()) {

        throw new Error(
            "MODEL HAS NO MESH"
        );

    }


    const center =
        new THREE.Vector3();


    const size =
        new THREE.Vector3();


    box.getCenter(
        center
    );


    box.getSize(
        size
    );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if (
        !isFinite(maxSize) ||
        maxSize <= 0
    ) {

        throw new Error(
            "INVALID MODEL SIZE"
        );

    }


    /*
     * Move model center
     * to local origin.
     */

    root.position.x -=
        center.x;

    root.position.y -=
        center.y;

    root.position.z -=
        center.z;


    /*
     * Normalize model size.
     */

    const targetSize =
        220;


    const normalize =
        targetSize /
        maxSize;


    root.scale.multiplyScalar(
        normalize
    );


    root.traverse(
        function(object) {

            if (!object.isMesh) {
                return;
            }


            object.frustumCulled =
                false;


            object.renderOrder =
                2;


            if (object.material) {

                const materials =
                    Array.isArray(
                        object.material
                    )
                        ? object.material
                        : [object.material];


                materials.forEach(
                    function(material) {

                        material.depthTest =
                            true;

                        material.depthWrite =
                            true;

                        material.needsUpdate =
                            true;

                    }
                );

            }

        }
    );


    return root;

}


/* GLB import */

function importGLB(
    file
) {

    if (!file) {
        return;
    }


    setStatus(
        "LOADING MODEL..."
    );


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const buffer =
                event.target.result;


            loader.parse(

                buffer,

                "",

                function(gltf) {

                    try {

                        /*
                         * Remove old model.
                         */

                        if (modelRoot) {

                            headAnchor.remove(
                                modelRoot
                            );

                            modelRoot =
                                null;

                        }


                        /*
                         * Prepare new model.
                         */

                        modelRoot =
                            prepareModel(
                                gltf.scene
                            );


                        /*
                         * Add to head.
                         */

                        headAnchor.add(
                            modelRoot
                        );


                        /*
                         * Apply controls.
                         */

                        updateModelTransform();


                        /*
                         * Hide dummy.
                         */

                        if (dummyHead) {

                            dummyHead.visible =
                                false;

                        }


                        setStatus(
                            "GLB LOADED"
                        );


                    } catch (error) {

                        console.error(
                            error
                        );


                        modelRoot =
                            null;


                        if (dummyHead) {

                            dummyHead.visible =
                                true;

                        }


                        setStatus(
                            "MODEL ERROR"
                        );

                    }

                },

                function(error) {

                    console.error(
                        error
                    );


                    setStatus(
                        "GLB LOAD ERROR"
                    );

                }

            );

        };


    reader.onerror =
        function() {

            setStatus(
                "FILE READ ERROR"
            );

        };


    reader.readAsArrayBuffer(
        file
    );

}


/* Model transform */

function updateModelTransform() {

    if (!modelRoot) {
        return;
    }


    modelRoot.position.set(

        settings.x,

        settings.y,

        settings.z

    );


    modelRoot.rotation.set(

        THREE.MathUtils.degToRad(
            settings.rotX
        ),

        THREE.MathUtils.degToRad(
            settings.rotY
        ),

        THREE.MathUtils.degToRad(
            settings.rotZ
        )

    );


    modelRoot.scale.setScalar(
        settings.scale
    );


    modelRoot.updateMatrixWorld(
        true
    );

}


/* Slider helper */

function connectSlider(
    slider,
    valueElement,
    property,
    decimals
) {

    slider.addEventListener(
        "input",
        function() {

            settings[property] =
                Number(
                    slider.value
                );


            if (decimals) {

                valueElement.textContent =
                    settings[property]
                        .toFixed(2);

            } else {

                valueElement.textContent =
                    settings[property];

            }


            if (
                property === "fit"
            ) {

                return;

            }


            updateModelTransform();

        }
    );

}

            !file.name
                .toLowerCase()
                .endsWith(".glb")

            setStatus(
                "SELECT A GLB FILE"

        importGLB(
            file

    }
);
