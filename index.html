<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera + Face Mesh Test</title>


<!-- MediaPipe Face Mesh -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
crossorigin="anonymous">
</script>


<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    display:none;
}

#screen{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:1;
}

#status{
    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:10;

    width:90%;
    max-width:500px;

    padding:12px 16px;

    background:rgba(0,0,0,.8);

    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;

    font-size:16px;

    text-align:center;
}

#open{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:10;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<canvas id="screen"></canvas>


<div id="status">
READY
</div>


<button id="open">
OPEN CAMERA
</button>



<script>


const video =
document.getElementById("camera");

const canvas =
document.getElementById("screen");

const ctx =
canvas.getContext("2d");

const button =
document.getElementById("open");

const status =
document.getElementById("status");



let faceMesh = null;

let stream = null;



/* ================================
   RESIZE
================================ */

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();


window.addEventListener(
    "resize",
    resize
);



/* ================================
   DRAW CAMERA
================================ */

function drawCamera(){

    requestAnimationFrame(
        drawCamera
    );


    if(
        video.readyState < 2
    ){

        return;

    }


    const sw =
    canvas.width;

    const sh =
    canvas.height;


    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    if(
        !vw ||
        !vh
    ){

        return;

    }


    const scale =
    Math.max(
        sw / vw,
        sh / vh
    );


    const dw =
    vw * scale;

    const dh =
    vh * scale;


    const x =
    (sw - dw) / 2;

    const y =
    (sh - dh) / 2;


    ctx.clearRect(
        0,
        0,
        sw,
        sh
    );


    /*
       SELFIE MIRROR
    */

    ctx.save();

    ctx.translate(
        sw,
        0
    );

    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        video,

        x,
        y,

        dw,
        dh

    );


    ctx.restore();

}

drawCamera();



/* ================================
   OPEN CAMERA
================================ */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA OK — LOADING FACE MESH...";


        startFaceMesh();

    }

    catch(error){

        showError(
            "CAMERA ERROR",
            error
        );

    }

};



/* ================================
   MEDIAPIPE FACE MESH
================================ */

function startFaceMesh(){

    try{

        if(
            typeof FaceMesh ===
            "undefined"
        ){

            throw new Error(
                "FaceMesh library did not load."
            );

        }


        status.innerText =
        "FACE MESH LOADING...";


        faceMesh =
        new FaceMesh({

            locateFile:
            function(file){

                return
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" +
                file;

            }

        });


        faceMesh.setOptions({

            maxNumFaces:1,

            refineLandmarks:true,

            minDetectionConfidence:0.5,

            minTrackingConfidence:0.5

        });


        faceMesh.onResults(
            onFaceResults
        );


        sendFrames();

    }

    catch(error){

        showError(
            "FACE MODEL ERROR",
            error
        );

    }

}



/* ================================
   SEND CAMERA FRAMES
================================ */

async function sendFrames(){

    if(
        faceMesh &&
        video.readyState >= 2
    ){

        try{

            await faceMesh.send({

                image:video

            });

        }

        catch(error){

            showError(
                "FACE DETECTION ERROR",
                error
            );

            return;

        }

    }


    requestAnimationFrame(
        sendFrames
    );

}



/* ================================
   FACE RESULTS
================================ */

function onFaceResults(
    results
){

    if(

        results.multiFaceLandmarks &&

        results.multiFaceLandmarks.length > 0

    ){

        status.innerText =
        "FACE DETECTED ✓";

    }

    else{

        status.innerText =
        "FACE MESH ON — FACE NOT FOUND";

    }

}



/* ================================
   ERROR
================================ */

function showError(
    title,
    error
){

    console.error(
        title,
        error
    );


    status.innerText =
    title +
    "\n\n" +
    (
        error.message ||
        String(error)
    );

}

</script>


</body>

</html>
