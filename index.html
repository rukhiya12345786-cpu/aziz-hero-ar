<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

/* Camera video layer */
#container video {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 1 !important;
}

/* 3D overlay layer */
#container canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
  pointer-events: none;
}

#topbar {
  position: fixed;
  top: 12px;
  left: 10px;
  right: 10px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  gap: 8px;
}

#brand {
  background: #0009;
  padding: 10px;
  border-radius: 10px;
  font-weight: bold;
}

#status {
  background: #000b;
  padding: 9px;
  border-radius: 10px;
  font-size: 12px;
  color: #fff;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 10px;
  right: 10px;
  z-index: 20;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  color: white;
  background: #202020eF;
  font-weight: bold;
  font-size: 13px;
}

button:disabled {
  opacity: 0.45;
}

#message {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 90px;
  z-index: 15;
  color: white;
  background: #0009;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  text-align: center;
}

@media (orientation: landscape) {
  #controls {
    left: auto;
    right: 12px;
    bottom: 12px;
    width: 190px;
    flex-direction: column;
  }

  #message {
    bottom: 12px;
    left: 12px;
    right: 210px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<div id="topbar">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="message">
  Allow camera permission and keep your face in front of the camera.
</div>

<div id="controls">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");

const startBtn = document.querySelector("#startBtn");
const stopBtn = document.querySelector("#stopBtn");
const switchBtn = document.querySelector("#switchBtn");
const fullBtn = document.querySelector("#fullBtn");

let mindarThree = null;
let avatar = null;
let facingMode = "user";
let running = false;
let starting = false;

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const url =
      "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";

    const loader = new GLTFLoader();

    this.gltf = await new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });

    this.gltf.scene.traverse((object) => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }
    });
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes || !blendshapes.categories) return;

    const values = new Map();

    for (const item of blendshapes.categories) {
      values.set(item.categoryName, item.score);
    }

    for (const mesh of this.morphTargetMeshes) {
      const dictionary = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      for (const [name, value] of values) {
        const index = dictionary[name];

        if (index !== undefined) {
          influences[index] = value;
        }
      }
    }
  }
}

async function startCamera() {
  if (starting || running) return;

  starting = true;
  startBtn.disabled = true;

  try {
    statusBox.textContent = "Starting camera...";
    messageBox.textContent = "Please allow camera permission.";

    if (!avatar) {
      avatar = new Avatar();
      await avatar.init();
    }

    mindarThree = new MindARThree({
      container: container,
      faceCamera: facingMode,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    scene.background = null;

    const light = new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      1.5
    );
    scene.add(light);

    const anchor = mindarThree.addAnchor(1);

    avatar.gltf.scene.scale.set(2, 2, 2);
    anchor.group.add(avatar.gltf.scene);

    await mindarThree.start();

    running = true;

    statusBox.textContent = "Camera running";
    messageBox.textContent =
      "Camera is active. Keep your face in front of the camera.";

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();

      if (estimate && estimate.blendshapes) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);
    statusBox.textContent = "Camera error";
    messageBox.textContent = error.message || "Unable to start camera.";

    if (mindarThree) {
      try {
        mindarThree.stop();
      } catch (e) {}
    }

    mindarThree = null;
    running = false;

  } finally {
    starting = false;
    startBtn.disabled = false;
  }
}

async function stopCamera() {
  if (!mindarThree) return;

  try {
    mindarThree.renderer.setAnimationLoop(null);
    await mindarThree.stop();
  } catch (error) {
    console.error(error);
  }

  mindarThree = null;
  running = false;

  container.innerHTML = "";

  statusBox.textContent = "Camera stopped";
  messageBox.textContent = "Press START CAMERA to begin.";
}

startBtn.addEventListener("click", startCamera);

stopBtn.addEventListener("click", async () => {
  await stopCamera();
});

switchBtn.addEventListener("click", async () => {
  if (starting) return;

  const wasRunning = running;

  if (wasRunning) {
    await stopCamera();
  }

  facingMode = facingMode === "user" ? "environment" : "user";

  messageBox.textContent =
    facingMode === "user"
      ? "Front camera selected."
      : "Back camera selected.";

  if (wasRunning) {
    await startCamera();
  }
});

fullBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    messageBox.textContent = "Fullscreen is not supported here.";
  }
});

window.addEventListener("beforeunload", () => {
  if (mindarThree) {
    mindarThree.stop();
  }
});

</script>
</body>
</html>
