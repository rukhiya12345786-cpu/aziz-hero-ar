<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Face Tracking Adjuster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Top Control Bar */
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* Bottom Slider Panel */
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 20, 0.85);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            z-index: 10;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .slider-group {
            margin-bottom: 10px;
        }
        .slider-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ccc;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
        }
    </style>
</head>
<body>

    <!-- Canvas and Camera Container -->
    <div id="canvas-container"></div>

    <!-- Top Action Buttons -->
    <div class="top-bar">
        <button class="btn" id="import-btn">Import Model</button>
        <button class="btn" id="flip-cam-btn">Flip Cam</button>
        <button class="btn" id="record-btn">Record Video</button>
    </div>

    <!-- Adjustment Sliders Panel -->
    <div class="control-panel">
        <div class="slider-group">
            <label>Scale (Size)</label>
            <input type="range" id="scale-slider" min="0.5" max="3" step="0.05" value="1">
        </div>
        <div class="slider-group">
            <label>Position X (Left/Right)</label>
            <input type="range" id="pos-x-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Y (Up/Down)</label>
            <input type="range" id="pos-y-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Z (Depth)</label>
            <input type="range" id="pos-z-slider" min="-5" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate X</label>
            <input type="range" id="rot-x-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate Y</label>
            <input type="range" id="rot-y-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
    </div>

    <!-- Hidden File Input for VRM Import -->
    <input type="file" id="file-input" accept=".vrm" style="display: none;">

    <script>
        const importBtn = document.getElementById('import-btn');
        const fileInput = document.getElementById('file-input');

        importBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                console.log("Selected VRM file URL:", url);
            }
        });

        document.getElementById('scale-slider').addEventListener('input', (e) => {
            const scaleValue = e.target.value;
            console.log("Scale changed to:", scaleValue);
        });
    </script>
</body>
</html>
