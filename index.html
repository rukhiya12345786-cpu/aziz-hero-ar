<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    transform:scaleX(-1);
}

#threeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#landmarkCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
    pointer-events:none;
    transform:scaleX(-1);
}

#topBar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:10;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 11px;
    background:rgba(15,15,15,.88);
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

#status{
    position:absolute;
    top:62px;
    left:8px;
    z-index:10;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:12px;
}

#controls{
    position:absolute;
    left:7px;
    right:7px;
    bottom:7px;
    z-index:20;
    max-height:43vh;
    overflow-y:auto;
    padding:10px;
    border-radius:14px;
    background:rgba(0,0,0,.80);
    color:#fff;
}

.section{
    margin:3px 0 5px;
    font-size:13px;
    font-weight:bold;
}

.controlRow{
    display:grid;
    grid-template-columns:70px 1fr 52px;
    gap:7px;
    align-items:center;
    margin:7px 0;
}

.controlRow label{
    font-size:12px;
    font-weight:bold;
}

.controlRow input{
    width:100%;
}

.value{
    text-align:right;
    font-size:11px;
}

#hint{
    margin-top:7px;
    color:#bbb;
    font-size:10px;
    line-height:1.35;
}

#fileInput{
    display:none;
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="app">

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>
<canvas id="landmarkCanvas"></canvas>

<div id="topBar">
    <button id="startCamera">START CAMERA</button>
    <button id="switchCamera">SWITCH CAMERA</button>
    <button id="mirrorButton">MIRROR: ON</button>
    <button id="trackingButton">TRACKING: ON</button>
    <button id="importButton">IMPORT GLB</button>
    <button id="resetButton">RESET</button>
</div>

<div id="status">Ready</div>

<div id="controls">

<div class="section">MODEL POSITION</div>

<div class="controlRow">
<label>X</label>
<input id="xSlider" type="range" min="-250" max="250" value="0" step="1">
<span class="value" id="xValue">0</span>
</div>

<div class="controlRow">
<label>Y</label>
<input id="ySlider" type="range" min="-250" max="250" value="0" step="1">
<span class="value" id="yValue">0</span>
</div>

<div class="controlRow">
<label>Z DEPTH</label>
<input id="zSlider" type="range" min="-500" max="500" value="0" step="1">
<span class="value" id="zValue">0</span>
</div>

<div class="section">MODEL SIZE</div>

<div class="controlRow">
<label>SCALE</label>
<input id="scaleSlider" type="range" min="0.1" max="5" value="1" step="0.01">
<span class="value" id="scaleValue">1.00</span>
</div>

<div class="section">MODEL ROTATION</div>

<div class="controlRow">
<label>ROT X</label>
<input id="rotXSlider" type="range" min="-180" max="180" value="0">
<span class="value" id="rotXValue">0</span>
</div>

<div class="controlRow">
<label>ROT Y</label>
<input id="rotYSlider" type="range" min="-180" max="180" value="0">
<span class="value" id="rotYValue">0</span>
</div>

<div class="controlRow">
<label>ROT Z</label>
<input id="rotZSlider" type="range" min="-180" max="180" value="0">
<span class="value" id="rotZValue">0</span>
</div>

<div class="section">HEAD FIT</div>

<div class="controlRow">
<label>HEAD X</label>
<input id="headXSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headXValue">1.00</span>
</div>

<div class="controlRow">
<label>HEAD Y</label>
<input id="headYSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headYValue">1.00</span>
</div>

<div class="controlRow">
<label>HEAD Z</label>
<input id="headZSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headZValue">1.00</span>
</div>

<div id="hint">
Use X/Y to fit the model. Use Z DEPTH to move the model forward or deeper in 3D space. SCALE changes the model size.
</div>

</div>

<input id="fileInput" type="file" accept=".glb,.gltf">

</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const video=document.getElementById("camera");
const threeCanvas=document.getElementById("threeCanvas");
const landmarkCanvas=document.getElementById("landmarkCanvas");
const landmarkCtx=landmarkCanvas.getContext("2d");
const statusBox=document.getElementById("status");

let stream=null;
let currentFacing="user";
let mirrorOn=true;
let trackingOn=true;
let faceLandmarker=null;
let lastVideoTime=-1;
let modelRoot=null;
let dummyHead=null;

const headAnchor=new THREE.Group();

const settings={
    x:0,
    y:0,
    z:0,
    scale:1,
    rotX:0,
    rotY:0,
    rotZ:0,
    headX:1,
    headY:1,
    headZ:1
};

const scene=new THREE.Scene();

const renderer=new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(0x000000,0);

const camera3D=new THREE.OrthographicCamera(
    0,
    window.innerWidth,
    0,
    window.innerHeight,
    -5000,
    5000
);

camera3D.position.z=1000;

scene.add(headAnchor);

scene.add(
    new THREE.AmbientLight(0xffffff,2.4)
);

const light1=new THREE.DirectionalLight(
    0xffffff,
    3
);

light1.position.set(0,300,600);
scene.add(light1);

const light2=new THREE.DirectionalLight(
    0xffffff,
    2
);

light2.position.set(-300,-200,300);
scene.add(light2);


/* =========================
   MODEL TRANSFORM
========================= */

function updateModelTransform(){

    if(!modelRoot)return;

    modelRoot.position.set(
        settings.x,
        settings.y,
        settings.z
    );

    modelRoot.scale.setScalar(
        settings.scale
    );

    modelRoot.rotation.set(
        THREE.MathUtils.degToRad(settings.rotX),
        THREE.MathUtils.degToRad(settings.rotY),
        THREE.MathUtils.degToRad(settings.rotZ)
    );
}


/* =========================
   DUMMY HEAD
========================= */

function createDummyHead(){

    if(dummyHead){
        headAnchor.remove(dummyHead);
    }

    dummyHead=new THREE.Group();

    const headMaterial=
        new THREE.MeshStandardMaterial({
            color:0xaaaaaa,
            roughness:.65,
            metalness:.05,
            transparent:true,
            opacity:.32,
            depthWrite:false
        });

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(1,48,32),
        headMaterial
    );

    head.scale.set(
        105*settings.headX,
        125*settings.headY,
        100*settings.headZ
    );

    dummyHead.add(head);

    const white=
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            depthWrite:false
        });

    const black=
        new THREE.MeshStandardMaterial({
            color:0x111111,
            depthWrite:false
        });

    function makeEye(x){

        const eye=new THREE.Mesh(
            new THREE.SphereGeometry(15,24,16),
            white
        );

        eye.position.set(
            x,
            -38,
            82
        );

        const pupil=new THREE.Mesh(
            new THREE.SphereGeometry(6,20,12),
            black
        );

        pupil.position.set(
            x,
            -38,
            96
        );

        dummyHead.add(eye);
        dummyHead.add(pupil);
    }

    makeEye(-38);
    makeEye(38);

    const nose=new THREE.Mesh(
        new THREE.ConeGeometry(14,42,24),
        new THREE.MeshStandardMaterial({
            color:0xaaaaaa,
            depthWrite:false
        })
    );

    nose.rotation.x=Math.PI/2;
    nose.position.set(0,0,108);

    dummyHead.add(nose);

    const mouth=new THREE.Mesh(
        new THREE.TorusGeometry(
            25,
            5,
            12,
            32,
            Math.PI
        ),
        new THREE.MeshStandardMaterial({
            color:0x333333,
            depthWrite:false
        })
    );

    mouth.rotation.x=Math.PI;
    mouth.position.set(
        0,
        48,
        92
    );

    dummyHead.add(mouth);

    const earMaterial=
        new THREE.MeshStandardMaterial({
            color:0x999999,
            transparent:true,
            opacity:.5,
            depthWrite:false
        });

    const leftEar=new THREE.Mesh(
        new THREE.SphereGeometry(25,24,16),
        earMaterial
    );

    leftEar.scale.set(.55,1,.7);
    leftEar.position.set(-105,0,0);

    const rightEar=leftEar.clone();
    rightEar.position.x=105;

    dummyHead.add(leftEar);
    dummyHead.add(rightEar);

    headAnchor.add(dummyHead);
}

createDummyHead();


/* =========================
   GLB LOADER
========================= */

const loader=new GLTFLoader();

function prepareImportedModel(root){

    const box=new THREE.Box3()
        .setFromObject(root);

    const size=new THREE.Vector3();

    const center=new THREE.Vector3();

    box.getSize(size);
    box.getCenter(center);

    /*
       Center the imported model.
       This fixes models that arrive far away
       from their own origin.
    */

    root.position.set(
        -center.x,
        -center.y,
        -center.z
    );

    /*
       Normalize model size.
       This prevents a GLB from being invisible
       because it is extremely large or tiny.
    */

    const maxSize=Math.max(
        size.x,
        size.y,
        size.z
    );

    if(
        Number.isFinite(maxSize) &&
        maxSize>0
    ){

        const targetSize=220;

        const autoScale=
            targetSize/maxSize;

        root.scale.setScalar(
            autoScale
        );

    }

    root.traverse(function(obj){

        if(obj.isMesh){

            obj.frustumCulled=false;

            if(obj.material){

                obj.material.depthTest=true;
                obj.material.depthWrite=true;

            }

        }

    });

    /*
       Put the normalized model into
       the user's calibration transform.
    */

    const holder=new THREE.Group();

    holder.add(root);

    return holder;
}


function importGLB(file){

    if(!file)return;

    statusBox.textContent="LOADING GLB...";

    const objectURL=
        URL.createObjectURL(file);

    loader.load(
        objectURL,

        function(gltf){

            try{

                if(modelRoot){
                    headAnchor.remove(modelRoot);
                }

                modelRoot=
                    prepareImportedModel(
                        gltf.scene
                    );

                headAnchor.add(modelRoot);

                /*
                   Imported model starts at the
                   center of the head.
                */

                modelRoot.position.x=
                    settings.x;

                modelRoot.position.y=
                    settings.y;

                modelRoot.position.z=
                    settings.z;

                /*
                   Apply user scale on top of
                   automatic normalization.
                */

                modelRoot.scale.multiplyScalar(
                    settings.scale
                );

                modelRoot.rotation.set(
                    THREE.MathUtils.degToRad(
                        settings.rotX
                    ),
                    THREE.MathUtils.degToRad(
                        settings.rotY
                    ),
                    THREE.MathUtils.degToRad(
                        settings.rotZ
                    )
                );

                dummyHead.visible=false;

                statusBox.textContent=
                    "GLB LOADED";

            }catch(error){

                console.error(error);

                statusBox.textContent=
                    "GLB SETUP ERROR";

                if(dummyHead){
                    dummyHead.visible=true;
                }

            }

            URL.revokeObjectURL(
                objectURL
            );

        },

        undefined,

        function(error){

            console.error(error);

            statusBox.textContent=
                "GLB LOAD ERROR";

            if(dummyHead){
                dummyHead.visible=true;
            }

            URL.revokeObjectURL(
                objectURL
            );

        }
    );
}


/* =========================
   CAMERA
========================= */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks().forEach(
                track=>track.stop()
            );

            stream=null;
        }

        stream=
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:currentFacing
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });

        video.srcObject=stream;

        await video.play();

        statusBox.textContent=
            "CAMERA ON";

        resizeCanvas();

        await setupFaceTracking();

    }catch(error){

        console.error(error);

        statusBox.textContent=
            "CAMERA ERROR";
    }
}


/* =========================
   MEDIAPIPE
========================= */

async function setupFaceTracking(){

    try{

        if(faceLandmarker)return;

        statusBox.textContent=
            "LOADING FACE TRACKER...";

        const visionModule=
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
            );

        const {
            FaceLandmarker,
            FilesetResolver
        }=visionModule;

        const filesetResolver=
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );

        faceLandmarker=
            await FaceLandmarker.createFromOptions(
                filesetResolver,
                {
                    baseOptions:{
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                        delegate:"GPU"
                    },

                    runningMode:"VIDEO",

                    numFaces:1,

                    minFaceDetectionConfidence:.5,

                    minFacePresenceConfidence:.5,

                    minTrackingConfidence:.5,

                    outputFaceBlendshapes:false,

                    outputFacialTransformationMatrixes:true
                }
            );

        statusBox.textContent=
            "FACE TRACKER READY";

        requestAnimationFrame(
            trackFace
        );

    }catch(error){

        console.error(error);

        statusBox.textContent=
            "FACE TRACKER ERROR";
    }
}


/* =========================
   FACE TRACKING
========================= */

function trackFace(){

    requestAnimationFrame(
        trackFace
    );

    if(!faceLandmarker)return;

    if(video.readyState<2)return;

    if(video.currentTime===lastVideoTime)return;

    lastVideoTime=
        video.currentTime;

    if(!trackingOn)return;

    try{

        const result=
            faceLandmarker.detectForVideo(
                video,
                performance.now()
            );

        if(
            result.faceLandmarks &&
            result.faceLandmarks.length>0
        ){

            updateHeadFromFace(
                result.faceLandmarks[0],
                result.facialTransformationMatrixes
            );

            drawLandmarks(
                result.faceLandmarks[0]
            );

            statusBox.textContent=
                "FACE TRACKING ON";

        }else{

            clearLandmarks();

            statusBox.textContent=
                "SEARCHING FACE";
        }

    }catch(error){

        console.error(error);
    }
}


/* =========================
   HEAD ANCHOR
========================= */

function updateHeadFromFace(
    landmarks,
    matrices
){

    if(
        !landmarks ||
        landmarks.length<264
    )return;

    const leftEye=
        landmarks[33];

    const rightEye=
        landmarks[263];

    const centerX=
        (leftEye.x+rightEye.x)*.5;

    const centerY=
        (leftEye.y+rightEye.y)*.5;

    const eyeDistance=
        Math.sqrt(
            Math.pow(
                rightEye.x-leftEye.x,
                2
            )+
            Math.pow(
                rightEye.y-leftEye.y,
                2
            )
        );

    const faceScale=
        THREE.MathUtils.clamp(
            eyeDistance*2600,
            70,
            220
        );

    /*
       IMPORTANT:
       Only the head anchor receives
       the face position.

       X/Y model calibration is applied
       only to modelRoot.
       This prevents double movement.
    */

    headAnchor.position.x=
        centerX*
        window.innerWidth;

    headAnchor.position.y=
        centerY*
        window.innerHeight;

    headAnchor.position.z=0;

    const baseScale=
        faceScale/120;

    headAnchor.scale.set(
        baseScale*settings.headX,
        baseScale*settings.headY,
        baseScale*settings.headZ
    );

    if(
        matrices &&
        matrices.length>0 &&
        matrices[0].data
    ){

        try{

            const m=
                new THREE.Matrix4();

            m.fromArray(
                matrices[0].data
            );

            const rotationMatrix=
                new THREE.Matrix4();

            rotationMatrix.extractRotation(
                m
            );

            const euler=
                new THREE.Euler()
                .setFromRotationMatrix(
                    rotationMatrix,
                    "XYZ"
                );

            headAnchor.rotation.x=
                euler.x;

            headAnchor.rotation.y=
                -euler.y;

            headAnchor.rotation.z=
                -euler.z;

        }catch(error){

            console.warn(
                "Head rotation fallback",
                error
            );

            headAnchor.rotation.set(
                0,
                0,
                0
            );
        }

    }else{

        headAnchor.rotation.set(
            0,
            0,
            0
        );
    }

    updateModelTransform();
}


/* =========================
   GREEN FACE DOTS
========================= */

function drawLandmarks(landmarks){

    resizeCanvas();

    landmarkCtx.clearRect(
        0,
        0,
        landmarkCanvas.width,
        landmarkCanvas.height
    );

    landmarkCtx.fillStyle=
        "#00ff55";

    /*
       Forehead,
      eyebrows,
       eyes,
       nose,
       mouth,
       chin
    */

    const points=[

        10,151,9,8,

        70,63,105,107,

        33,133,159,145,

        263,362,386,374,

        1,2,4,

        61,291,13,14,

        199,152
    ];

    for(
        const index of points
    ){

        const p=landmarks[index];

        if(!p)continue;

        const x=
            p.x*
            landmarkCanvas.width;

        const y=
            p.y*
            landmarkCanvas.height;

        landmarkCtx.beginPath();

        landmarkCtx.arc(
            x,
            y,
            5,
            0,
            Math.PI*2
        );

        landmarkCtx.fill();
    }
}

function clearLandmarks(){

    landmarkCtx.clearRect(
        0,
        0,
        landmarkCanvas.width,
        landmarkCanvas.height
    );
}


/* =========================
   RESIZE
========================= */

function resizeCanvas(){

    const w=
        window.innerWidth;

    const h=
        window.innerHeight;

    threeCanvas.width=w;
    threeCanvas.height=h;

    landmarkCanvas.width=w;
    landmarkCanvas.height=h;

    renderer.setSize(
        w,
        h,
        false
    );

    camera3D.left=0;
    camera3D.right=w;
    camera3D.top=0;
    camera3D.bottom=h;

    camera3D.updateProjectionMatrix();
}function bindSlider(
    sliderId,
    valueId,
    property,
    decimals=0
){

    const slider=
        document.getElementById(sliderId);

    const value=
        document.getElementById(valueId);

    slider.addEventListener(
        "input",
        function(){

            settings[property]=
                Number(this.value);

            value.textContent=
                decimals>0
                ? settings[property].toFixed(decimals)
                : settings[property];

            updateModelTransform();

        }
    );
}


/* =========================
   MODEL CONTROLS
========================= */

bindSlider(
    "xSlider",
    "xValue",
    "x"
);

bindSlider(
    "ySlider",
    "yValue",
    "y"
);

bindSlider(
    "zSlider",
    "zValue",
    "z"
);

bindSlider(
    "scaleSlider",
    "scaleValue",
    "scale",
    2
);

bindSlider(
    "rotXSlider",
    "rotXValue",
    "rotX"
);

bindSlider(
    "rotYSlider",
    "rotYValue",
    "rotY"
);

bindSlider(
    "rotZSlider",
    "rotZValue",
    "rotZ"
);

bindSlider(
    "headXSlider",
    "headXValue",
    "headX",
    2
);

bindSlider(
    "headYSlider",
    "headYValue",
    "headY",
    2
);

bindSlider(
    "headZSlider",
    "headZValue",
    "headZ",
    2
);


/* =========================
   RESET
========================= */

function resetAll(){

    settings.x=0;
    settings.y=0;
    settings.z=0;
    settings.scale=1;

    settings.rotX=0;
    settings.rotY=0;
    settings.rotZ=0;

    settings.headX=1;
    settings.headY=1;
    settings.headZ=1;

    document.getElementById(
        "xSlider"
    ).value=0;

    document.getElementById(
        "ySlider"
    ).value=0;

    document.getElementById(
        "zSlider"
    ).value=0;

    document.getElementById(
        "scaleSlider"
    ).value=1;

    document.getElementById(
        "rotXSlider"
    ).value=0;

    document.getElementById(
        "rotYSlider"
    ).value=0;

    document.getElementById(
        "rotZSlider"
    ).value=0;

    document.getElementById(
        "headXSlider"
    ).value=1;

    document.getElementById(
        "headYSlider"
    ).value=1;

    document.getElementById(
        "headZSlider"
    ).value=1;


    document.getElementById(
        "xValue"
    ).textContent="0";

    document.getElementById(
        "yValue"
    ).textContent="0";

    document.getElementById(
        "zValue"
    ).textContent="0";

    document.getElementById(
        "scaleValue"
    ).textContent="1.00";

    document.getElementById(
        "rotXValue"
    ).textContent="0";

    document.getElementById(
        "rotYValue"
    ).textContent="0";

    document.getElementById(
        "rotZValue"
    ).textContent="0";

    document.getElementById(
        "headXValue"
    ).textContent="1.00";

    document.getElementById(
        "headYValue"
    ).textContent="1.00";

    document.getElementById(
        "headZValue"
    ).textContent="1.00";


    createDummyHead();


    if(modelRoot){

        modelRoot.position.set(
            0,
            0,
            0
        );

        modelRoot.scale.setScalar(
            1
        );

        modelRoot.rotation.set(
            0,
            0,
            0
        );

    }


    statusBox.textContent=
        "RESET COMPLETE";
}


/* =========================
   START CAMERA
========================= */

document
.getElementById("startCamera")
.addEventListener(
    "click",
    startCamera
);


/* =========================
   SWITCH CAMERA
========================= */

document
.getElementById("switchCamera")
.addEventListener(
    "click",
    async function(){

        currentFacing=
            currentFacing==="user"
            ? "environment"
            : "user";

        await startCamera();

    }
);


/* =========================
   MIRROR BUTTON
========================= */

document
.getElementById("mirrorButton")
.addEventListener(
    "click",
    function(){

        mirrorOn=!mirrorOn;

        if(mirrorOn){

            video.style.transform=
                "scaleX(-1)";

            landmarkCanvas.style.transform=
                "scaleX(-1)";

            this.textContent=
                "MIRROR: ON";

        }else{

            video.style.transform=
                "scaleX(1)";

            landmarkCanvas.style.transform=
                "scaleX(1)";

            this.textContent=
                "MIRROR: OFF";
        }

    }
);


/* =========================
   TRACKING BUTTON
========================= */

document
.getElementById("trackingButton")
.addEventListener(
    "click",
    function(){

        trackingOn=!trackingOn;

        this.textContent=
            trackingOn
            ? "TRACKING: ON"
            : "TRACKING: OFF";

        if(!trackingOn){

            clearLandmarks();

        }

    }
);


/* =========================
   RESET BUTTON
========================= */

document
.getElementById("resetButton")
.addEventListener(
    "click",
    resetAll
);


/* =========================
   IMPORT GLB BUTTON
========================= */

document
.getElementById("importButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("fileInput")
        .click();

    }
);


/* =========================
   GLB FILE
========================= */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(){

        const file=this.files[0];

        if(!file)return;

        importGLB(file);

    }
);


/* =========================
   RENDER
========================= */

function render(){

    requestAnimationFrame(
        render
    );

    renderer.render(
        scene,
        camera3D
    );
}

render();


/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

</script>

</body>
</html>
