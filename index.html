<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#container{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#container video,
#container canvas{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
}

#container canvas{
    pointer-events:none;
}

#ui{
    position:fixed;
    left:0;
    right:0;
    top:0;
    z-index:20;
    padding:8px;
    pointer-events:none;
}

#topBar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    pointer-events:auto;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 12px;
    background:#151515;
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

button.active{
    background:#0a8f45;
}

button.recording{
    background:#c40000;
}

#status{
    margin-top:6px;
    display:inline-block;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:11px;
}

#controlToggle{
    margin-top:6px;
    pointer-events:auto;
    background:#222;
}

#controls{
    display:none;
    position:fixed;
    left:8px;
    right:8px;
    bottom:8px;
    max-height:58vh;
    overflow-y:auto;
    padding:10px;
    border-radius:12px;
    background:rgba(0,0,0,.88);
    color:#fff;
    pointer-events:auto;
    -webkit-overflow-scrolling:touch;
}

#controls.open{
    display:block;
}

.sectionButton{
    width:100%;
    margin-top:6px;
    text-align:left;
    background:#252525;
}

.section{
    display:none;
    padding:8px 4px 4px;
}

.section.open{
    display:block;
}

.row{
    display:grid;
    grid-template-columns:55px 1fr 52px;
    gap:7px;
    align-items:center;
    margin:6px 0;
}

.row label{
    font-size:11px;
}

.row output{
    text-align:right;
    font-size:10px;
}

input[type="range"]{
    width:100%;
}

.quick{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin:5px 0 9px;
}

.quick button{
    padding:8px 3px;
    font-size:10px;
}

.smallTitle{
    font-size:10px;
    color:#aaa;
    margin:7px 0 3px;
}

#recordStatus{
    font-size:11px;
    color:#fff;
    margin-top:6px;
}

#recorderCanvas{
    display:none;
}

.hiddenInput{
    display:none;
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
}
</script>
</head>

<body>

<div id="container"></div>

<canvas id="recorderCanvas"></canvas>

<div id="ui">

<div id="topBar">
<button id="startButton">START CAMERA</button>
<button id="switchButton">SWITCH CAMERA</button>
<button id="mirrorButton">MIRROR OFF</button>
<button id="greenButton">GREEN FACE OFF</button>
<button id="importButton">IMPORT GLB</button>
<button id="recordButton">START RECORDING</button>
</div>

<div id="status">Ready</div>

<button id="controlToggle">OPEN CONTROLS</button>

</div>

<div id="controls">

<button class="sectionButton" data-section="positionSection">
MODEL POSITION
</button>

<div id="positionSection" class="section">

<div class="smallTitle">MODEL POSITION</div>

<div class="row">
<label>X</label>
<input id="posX" type="range" min="-3" max="3" step="0.005" value="0">
<output id="posXValue">0</output>
</div>

<div class="row">
<label>Y</label>
<input id="posY" type="range" min="-3" max="3" step="0.005" value="0">
<output id="posYValue">0</output>
</div>

<div class="row">
<label>Z</label>
<input id="posZ" type="range" min="-3" max="3" step="0.005" value="0">
<output id="posZValue">0</output>
</div>

<div class="quick">
<button data-action="left">LEFT</button>
<button data-action="right">RIGHT</button>
<button data-action="up">UP</button>
<button data-action="down">DOWN</button>
<button data-action="resetPos">RESET</button>
</div>

<div class="smallTitle">MODEL SCALE</div>

<div class="row">
<label>SCALE</label>
<input id="scale" type="range" min="0.02" max="4" step="0.005" value="1">
<output id="scaleValue">1</output>
</div>

<div class="quick">
<button data-action="scaleDown">SCALE -</button>
<button data-action="scaleUp">SCALE +</button>
<button data-action="resetScale">RESET</button>
</div>

</div>


<button class="sectionButton" data-section="rotationSection">
MODEL 360 ROTATION
</button>

<div id="rotationSection" class="section">

<div class="row">
<label>RX</label>
<input id="rotX" type="range" min="-180" max="180" step="0.5" value="0">
<output id="rotXValue">0</output>
</div>

<div class="row">
<label>RY</label>
<input id="rotY" type="range" min="-180" max="180" step="0.5" value="0">
<output id="rotYValue">0</output>
</div>

<div class="row">
<label>RZ</label>
<input id="rotZ" type="range" min="-180" max="180" step="0.5" value="0">
<output id="rotZValue">0</output>
</div>

<div class="quick">
<button data-action="rxMinus">RX -</button>
<button data-action="rxPlus">RX +</button>
<button data-action="ryMinus">RY -</button>
<button data-action="ryPlus">RY +</button>
<button data-action="resetRot">RESET</button>
</div>

<div class="quick">
<button data-action="rzMinus">RZ -</button>
<button data-action="rzPlus">RZ +</button>
<button data-action="turnLeft">360 L</button>
<button data-action="turnRight">360 R</button>
<button data-action="resetAllRot">RESET</button>
</div>

</div><button class="sectionButton" data-section="meshSection">
MESH ADJUSTMENT
</button>

<div id="meshSection" class="section">

<div class="smallTitle">MESH POSITION</div>

<div class="row">
<label>MX</label>
<input id="meshX" type="range" min="-3" max="3" step="0.005" value="0">
<output id="meshXValue">0</output>
</div>

<div class="row">
<label>MY</label>
<input id="meshY" type="range" min="-3" max="3" step="0.005" value="0">
<output id="meshYValue">0</output>
</div>

<div class="row">
<label>MZ</label>
<input id="meshZ" type="range" min="-3" max="3" step="0.005" value="0">
<output id="meshZValue">0</output>
</div>

<div class="quick">
<button data-action="meshLeft">LEFT</button>
<button data-action="meshRight">RIGHT</button>
<button data-action="meshUp">UP</button>
<button data-action="meshDown">DOWN</button>
<button data-action="meshResetPos">RESET</button>
</div>

<div class="smallTitle">MESH SIZE</div>

<div class="row">
<label>SIZE</label>
<input id="meshScale" type="range" min="0.02" max="4" step="0.005" value="1">
<output id="meshScaleValue">1</output>
</div>

<div class="row">
<label>MSX</label>
<input id="meshScaleX" type="range" min="0.02" max="4" step="0.005" value="1">
<output id="meshScaleXValue">1</output>
</div>

<div class="row">
<label>MSY</label>
<input id="meshScaleY" type="range" min="0.02" max="4" step="0.005" value="1">
<output id="meshScaleYValue">1</output>
</div>

<div class="row">
<label>MSZ</label>
<input id="meshScaleZ" type="range" min="0.02" max="4" step="0.005" value="1">
<output id="meshScaleZValue">1</output>
</div>

<div class="quick">
<button data-action="meshScaleDown">SIZE -</button>
<button data-action="meshScaleUp">SIZE +</button>
<button data-action="meshResetScale">RESET</button>
</div>

<div class="smallTitle">MESH 360 ROTATION</div>

<div class="row">
<label>MRX</label>
<input id="meshRotX" type="range" min="-180" max="180" step="0.5" value="0">
<output id="meshRotXValue">0</output>
</div>

<div class="row">
<label>MRY</label>
<input id="meshRotY" type="range" min="-180" max="180" step="0.5" value="0">
<output id="meshRotYValue">0</output>
</div>

<div class="row">
<label>MRZ</label>
<input id="meshRotZ" type="range" min="-180" max="180" step="0.5" value="0">
<output id="meshRotZValue">0</output>
</div>

<div class="quick">
<button data-action="meshRotXMinus">RX -</button>
<button data-action="meshRotXPlus">RX +</button>
<button data-action="meshRotYMinus">RY -</button>
<button data-action="meshRotYPlus">RY +</button>
<button data-action="meshResetRot">RESET</button>
</div>

<div class="quick">
<button data-action="meshRotZMinus">RZ -</button>
<button data-action="meshRotZPlus">RZ +</button>
<button data-action="meshTurnLeft">TURN L</button>
<button data-action="meshTurnRight">TURN R</button>
<button data-action="meshResetAll">RESET</button>
</div>

</div>


<button class="sectionButton" data-section="depthSection">
HEAD DEPTH / FIT
</button>

<div id="depthSection" class="section">

<div class="smallTitle">HEAD FIT</div>

<div class="row">
<label>DEPTH</label>
<input id="headDepth" type="range" min="-2" max="2" step="0.005" value="0">
<output id="headDepthValue">0</output>
</div>

<div class="row">
<label>WIDTH</label>
<input id="headWidth" type="range" min="0.5" max="2" step="0.005" value="1">
<output id="headWidthValue">1</output>
</div>

<div class="row">
<label>HEIGHT</label>
<input id="headHeight" type="range" min="0.5" max="2" step="0.005" value="1">
<output id="headHeightValue">1</output>
</div>

<div class="row">
<label>DEPTH S</label>
<input id="headSizeDepth" type="range" min="0.5" max="2" step="0.005" value="1">
<output id="headSizeDepthValue">1</output>
</div>

<div class="quick">
<button data-action="headForward">FRONT</button>
<button data-action="headBackward">BACK</button>
<button data-action="headReset">RESET</button>
</div>

</div>


<button class="sectionButton" data-section="recordSection">
RECORDING
</button>

<div id="recordSection" class="section">

<button id="recordButton2">
START VIDEO + AUDIO
</button>

<div id="recordStatus">
Recording ready
</div>

</div>


<button class="sectionButton" data-section="settingsSection">
SETTINGS
</button>

<div id="settingsSection" class="section">

<button id="resetButton">
RESET ALL MODEL
</button>

<button id="exportButton">
EXPORT SETTINGS
</button>

<button id="importSettingsButton">
IMPORT SETTINGS
</button>

</div>

</div>

<input
id="modelInput"
class="hiddenInput"
type="file"
accept=".glb,.gltf,model/gltf-binary,model/gltf+json"
>

<input
id="settingsInput"
class="hiddenInput"
type="file"
accept=".json"
>

<canvas id="recordCanvas"></canvas>

<script type="module">

import * as THREE from "three";

import {GLTFLoader}
from "three/addons/loaders/GLTFLoader.js";

import {MindARThree}
from "mindar-face-three";


const container =
document.getElementById("container");

const status =
document.getElementById("status");

const controls =
document.getElementById("controls");

const controlToggle =
document.getElementById("controlToggle");

const startButton =
document.getElementById("startButton");

const switchButton =
document.getElementById("switchButton");

const mirrorButton =
document.getElementById("mirrorButton");

const greenButton =
document.getElementById("greenButton");

const importButton =
document.getElementById("importButton");

const modelInput =
document.getElementById("modelInput");

const resetButton =
document.getElementById("resetButton");

const exportButton =
document.getElementById("exportButton");

const importSettingsButton =
document.getElementById("importSettingsButton");

const settingsInput =
document.getElementById("settingsInput");

const recordButton =
document.getElementById("recordButton");

const recordButton2 =
document.getElementById("recordButton2");

const recordStatus =
document.getElementById("recordStatus");

const recordCanvas =
document.getElementById("recordCanvas");


let mindar = null;

let faceAnchor = null;

let faceMesh = null;

let occlusionMesh = null;

let modelRoot = null;

let meshAdjust = null;

let currentModel = null;

let running = false;

let mirrored = false;

let greenFace = false;

let recorder = null;

let recorderStream = null;

let microphoneStream = null;

let recording = false;

let recordingFrame = null;

let recordingChunks = [];

let recordContext = null;

let recordWidth = 1280;

let recordHeight = 720;


const loader =
new GLTFLoader();


function setStatus(text){

status.textContent =
text;

}


function value(id){

return parseFloat(
document.getElementById(id).value
);

}


function setValue(id,val){

document.getElementById(id).value =
val;

}


function showValue(id,val){

document.getElementById(id).textContent =
Number(val).toFixed(3);

}


function radians(value){

return THREE.MathUtils.degToRad(
Number(value)
);

}


function setupMindAR(){

if(mindar){
return;
}

mindar =
new MindARThree({

container:container,

resolution:"720p",

uiLoading:"no",

uiScanning:"no",

uiError:"yes",

filterMinCF:0.001,

filterBeta:0.001,

filterDCutOff:0.001

});


const renderer =
mindar.renderer;

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio || 1,
2
)
);

renderer.setClearColor(
0x000000,
0
);


const scene =
mindar.scene;


scene.add(
new THREE.HemisphereLight(
0xffffff,
0x444444,
1.5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
2
);

light.position.set(
0,
2,
3
);

scene.add(
light
);


faceAnchor =
mindar.addAnchor(168);


modelRoot =
new THREE.Group();

faceAnchor.group.add(
modelRoot
);


meshAdjust =
new THREE.Group();

modelRoot.add(
meshAdjust
);


faceMesh =
mindar.addFaceMesh();


faceMesh.material =
new THREE.MeshBasicMaterial({

color:0x00ff44,

transparent:true,

opacity:0.25,

depthWrite:false,

depthTest:true,

side:THREE.DoubleSide

});


faceMesh.visible =
false;


faceMesh.renderOrder =
10;


occlusionMesh =
mindar.addFaceMesh();


occlusionMesh.material =
new THREE.MeshBasicMaterial({

colorWrite:false,

depthWrite:true,

depthTest:true,

side:THREE.DoubleSide

});


occlusionMesh.renderOrder =
0;


faceAnchor.onTargetFound =
()=>{
modelRoot.visible =
true;
};


faceAnchor.onTargetLost =
()=>{
modelRoot.visible =
false;
};


modelRoot.visible =
true;

}


async function startAR(){

try{

setupMindAR();

if(running){
return;
}

setStatus(
"Starting camera..."
);

await mindar.start();

running =
true;

mindar.renderer.setAnimationLoop(
()=>{
mindar.renderer.render(
mindar.scene,
mindar.camera
);
}
);

startButton.textContent =
"CAMERA ON";

startButton.classList.add(
"active"
);

setStatus(
"Face tracking ready"
);

}catch(error){

console.error(error);

setStatus(
"CAMERA ERROR"
);

}

}


startButton.addEventListener(
"click",
startAR
);


controlToggle.addEventListener(
"click",
()=>{

controls.classList.toggle(
"open"
);

controlToggle.textContent =
controls.classList.contains("open")
? "HIDE CONTROLS"
: "OPEN CONTROLS";

}
);


document
.querySelectorAll(".sectionButton")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

const section =
document.getElementById(
button.dataset.section
);

section.classList.toggle(
"open"
);

}
);

}
);switchButton.addEventListener(
"click",
()=>{

if(!mindar || !running){
setStatus(
"Start camera first"
);
return;
}

try{

mindar.switchCamera();

setStatus(
"Camera switched"
);

}catch(error){

console.error(error);

setStatus(
"Camera switch error"
);

}

}
);


mirrorButton.addEventListener(
"click",
()=>{

mirrored =
!mirrored;

container.style.transform =
mirrored
? "scaleX(-1)"
: "scaleX(1)";

mirrorButton.textContent =
mirrored
? "MIRROR ON"
: "MIRROR OFF";

mirrorButton.classList.toggle(
"active",
mirrored
);

}
);


greenButton.addEventListener(
"click",
()=>{

greenFace =
!greenFace;

if(faceMesh){
faceMesh.visible =
greenFace;
}

greenButton.textContent =
greenFace
? "GREEN FACE ON"
: "GREEN FACE OFF";

greenButton.classList.toggle(
"active",
greenFace
);

}
);


function fitModel(object){

const box =
new THREE.Box3()
.setFromObject(object);

const center =
box.getCenter(
new THREE.Vector3()
);

object.position.sub(
center
);

const size =
box.getSize(
new THREE.Vector3()
);

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

if(maxSize > 0){

object.scale.setScalar(
1 / maxSize
);

}

}


function prepareModel(object){

object.traverse(
child=>{

if(child.isMesh){

child.frustumCulled =
false;

child.renderOrder =
1;

if(child.material){

child.material.depthTest =
true;

child.material.depthWrite =
true;

}

}

}
);

}


function removeModel(){

if(!currentModel){
return;
}

meshAdjust.remove(
currentModel
);

currentModel.traverse(
child=>{

if(child.geometry){
child.geometry.dispose();
}

if(child.material){

if(
Array.isArray(
child.material
)
){

child.material.forEach(
material=>{
material.dispose();
}
);

}else{

child.material.dispose();

}

}

}
);

currentModel =
null;

}


function loadModel(file){

const url =
URL.createObjectURL(file);

setStatus(
"Loading 3D model..."
);


loader.load(

url,

gltf=>{

URL.revokeObjectURL(
url
);

removeModel();

currentModel =
gltf.scene;

fitModel(
currentModel
);

prepareModel(
currentModel
);

meshAdjust.add(
currentModel
);

currentModel.visible =
true;

resetControls();

setStatus(
"3D model loaded"
);

},

undefined,

error=>{

URL.revokeObjectURL(
url
);

console.error(error);

setStatus(
"MODEL ERROR"
);

}

);

}


importButton.addEventListener(
"click",
()=>{
modelInput.click();
}
);


modelInput.addEventListener(
"change",
()=>{

const file =
modelInput.files[0];

if(file){
loadModel(file);
}

modelInput.value =
"";

}
);


function applyMain(){

if(!modelRoot){
return;
}

modelRoot.position.set(
value("posX"),
value("posY"),
value("posZ")
);

modelRoot.scale.setScalar(
value("scale")
);

modelRoot.rotation.set(
radians(value("rotX")),
radians(value("rotY")),
radians(value("rotZ"))
);

}


function applyMesh(){

if(!meshAdjust){
return;
}

meshAdjust.position.set(
value("meshX"),
value("meshY"),
value("meshZ")
);

const s =
value("meshScale");

meshAdjust.scale.set(
s * value("meshScaleX"),
s * value("meshScaleY"),
s * value("meshScaleZ")
);

meshAdjust.rotation.set(
radians(value("meshRotX")),
radians(value("meshRotY")),
radians(value("meshRotZ"))
);

}


function applyHeadFit(){

if(!meshAdjust){
return;
}

meshAdjust.position.z =
value("meshZ") +
value("headDepth");

meshAdjust.scale.x =
value("meshScale") *
value("meshScaleX") *
value("headWidth");

meshAdjust.scale.y =
value("meshScale") *
value("meshScaleY") *
value("headHeight");

meshAdjust.scale.z =
value("meshScale") *
value("meshScaleZ") *
value("headSizeDepth");

}


const mainSliderIds = [
"posX",
"posY",
"posZ",
"scale",
"rotX",
"rotY",
"rotZ"
];


mainSliderIds.forEach(
id=>{

const input =
document.getElementById(id);

input.addEventListener(
"input",
()=>{

showValue(
id+"Value",
input.value
);

applyMain();

}
);

showValue(
id+"Value",
input.value
);

}
);


const meshSliderIds = [
"meshX",
"meshY",
"meshZ",
"meshScale",
"meshScaleX",
"meshScaleY",
"meshScaleZ",
"meshRotX",
"meshRotY",
"meshRotZ"
];


meshSliderIds.forEach(
id=>{

const input =
document.getElementById(id);

input.addEventListener(
"input",
()=>{

showValue(
id+"Value",
input.value
);

applyMesh();

applyHeadFit();

}
);

showValue(
id+"Value",
input.value
);

}
);


const headSliderIds = [
"headDepth",
"headWidth",
"headHeight",
"headSizeDepth"
];


headSliderIds.forEach(
id=>{

const input =
document.getElementById(id);

input.addEventListener(
"input",
()=>{

showValue(
id+"Value",
input.value
);

applyHeadFit();

}
);

showValue(
id+"Value",
input.value
);

}
);


function changeSlider(
id,
amount
){

const input =
document.getElementById(id);

let next =
parseFloat(input.value)
+
amount;

const min =
parseFloat(input.min);

const max =
parseFloat(input.max);

next =
Math.max(
min,
Math.min(
max,
next
)
);

input.value =
next;

input.dispatchEvent(
new Event("input")
);

}


function resetControls(){

const values = {

posX:0,
posY:0,
posZ:0,

scale:1,

rotX:0,
rotY:0,
rotZ:0,

meshX:0,
meshY:0,
meshZ:0,

meshScale:1,

meshScaleX:1,
meshScaleY:1,
meshScaleZ:1,

meshRotX:0,
meshRotY:0,
meshRotZ:0,

headDepth:0,
headWidth:1,
headHeight:1,

);

function getVideo(){

return container.querySelector(
"video"
);

}


function getMime(){

const types = [

"video/webm;codecs=vp9,opus",

"video/webm;codecs=vp8,opus",

"video/webm"

];

for(const type of types){

if(
MediaRecorder.isTypeSupported(
type
)
){

return type;

}

}

return "";

}


async function startRecording(){

if(!running){

setStatus(
"Start camera first"
);

return;

}


if(recording){

stopRecording();

return;

}


try{

const video =
getVideo();

if(!video){

setStatus(
"Camera video not found"
);

return;

}


recordWidth =
Math.min(
video.videoWidth || 1280,
1920
);

recordHeight =
Math.min(
video.videoHeight || 720,
1080
);


recordCanvas.width =
recordWidth;

recordCanvas.height =
recordHeight;


recordContext =
recordCanvas.getContext(
"2d"
);


const videoStream =
recordCanvas.captureStream(
30
);


microphoneStream =
await navigator.mediaDevices.getUserMedia(
{
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
}
);


recorderStream =
new MediaStream();


videoStream
.getVideoTracks()
.forEach(
track=>{
recorderStream.addTrack(
track
);
}
);


microphoneStream
.getAudioTracks()
.forEach(
track=>{
recorderStream.addTrack(
track
);
}
);


recordingChunks =
[];


const mime =
getMime();


recorder =
mime
? new MediaRecorder(
recorderStream,
{
mimeType:mime,
videoBitsPerSecond:12000000,
audioBitsPerSecond:128000
}
)
: new MediaRecorder(
recorderStream
);


recorder.ondataavailable =
event=>{

if(
event.data &&
event.data.size
){

recordingChunks.push(
event.data
);

}

};


recorder.onstop =
saveRecording;


recorder.start(
1000
);


recording =
true;


recordButton.textContent =
"STOP RECORDING";

recordButton2.textContent =
"STOP VIDEO + AUDIO";

recordButton.classList.add(
"recording"
);

recordButton2.classList.add(
"recording"
);

recordStatus.textContent =
"Recording video + audio";

setStatus(
"Recording started"
);


drawRecording();

}catch(error){

console.error(error);

setStatus(
"RECORDING ERROR"
);

cleanupRecording();

}

}


function drawRecording(){

if(!recording){
return;
}


const video =
getVideo();


if(
video &&
recordContext
){

recordContext.save();

recordContext.clearRect(
0,
0,
recordWidth,
recordHeight
);


const vw =
video.videoWidth ||
recordWidth;

const vh =
video.videoHeight ||
recordHeight;


const sourceRatio =
vw / vh;

const targetRatio =
recordWidth /
recordHeight;


let dw =
recordWidth;

let dh =
recordHeight;

let dx =
0;

let dy =
0;


if(
sourceRatio >
targetRatio
){

dh =
recordHeight;

dw =
dh *
sourceRatio;

dx =
(
recordWidth -
dw
) / 2;

}else{

dw =
recordWidth;

dh =
dw /
sourceRatio;

dy =
(
recordHeight -
dh
) / 2;

}


if(mirrored){

recordContext.translate(
recordWidth,
0
);

recordContext.scale(
-1,
1
);

}


recordContext.drawImage(
video,
dx,
dy,
dw,
dh
);


const arCanvas =
mindar &&
mindar.renderer &&
mindar.renderer.domElement;


if(arCanvas){

recordContext.drawImage(
arCanvas,
0,
0,
recordWidth,
recordHeight
);

}


recordContext.restore();

}


recordingFrame =
requestAnimationFrame(
drawRecording
);

}


function stopRecording(){

if(!recording){
return;
}


recording =
false;


if(recordingFrame){

cancelAnimationFrame(
recordingFrame
);

recordingFrame =
null;

}


if(
recorder &&
recorder.state !==
"inactive"
){

recorder.stop();

}else{

cleanupRecording();

}


recordButton.textContent =
"START RECORDING";

recordButton2.textContent =
"START VIDEO + AUDIO";

recordButton.classList.remove(
"recording"
);

recordButton2.classList.remove(
"recording"
);

recordStatus.textContent =
"Saving recording...";

}


function saveRecording(){

if(
recordingChunks.length === 0
){

cleanupRecording();

return;

}


const blob =
new Blob(
recordingChunks,
{
type:
recorder &&
recorder.mimeType
? recorder.mimeType
: "video/webm"
}
);


const url =
URL.createObjectURL(
blob
);


const link =
document.createElement("a");

link.href =
url;

link.download =
"aziz-ar-recording.webm";

document.body.appendChild(
link
);

link.click();

link.remove();


setTimeout(
()=>{
URL.revokeObjectURL(
url
);
},
2000
);


recordStatus.textContent =
"Recording saved";

setStatus(
"Recording saved"
);


cleanupRecording();

}


function cleanupRecording(){

if(microphoneStream){

microphoneStream
.getTracks()
.forEach(
track=>{
track.stop();
}
);

}


if(recorderStream){

recorderStream
.getTracks()
.forEach(
track=>{
track.stop();
}
);

}


microphoneStream =
null;

recorderStream =
null;

recorder =
null;

}
