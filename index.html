<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Azeez AR Head Tracker</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif
}
#container{
position:fixed;
inset:0;
width:100%;
height:100%;
overflow:hidden;
background:#000
}
#container canvas{
position:absolute!important;
inset:0!important;
width:100%!important;
height:100%!important;
display:block
}
#top{
position:fixed;
top:8px;
left:8px;
right:8px;
z-index:50;
display:flex;
flex-wrap:wrap;
gap:6px
}
button{
border:1px solid rgba(255,255,255,.3);
border-radius:8px;
background:rgba(0,0,0,.78);
color:#fff;
padding:9px 11px;
font-size:12px;
font-weight:bold
}
button:active{
transform:scale(.96)
}
#status{
position:fixed;
top:58px;
left:8px;
z-index:50;
padding:7px 10px;
border-radius:8px;
background:rgba(0,0,0,.72);
color:#00ff66;
font-size:12px
}
#panel{
position:fixed;
left:8px;
right:8px;
bottom:8px;
z-index:60;
max-height:48vh;
overflow-y:auto;
background:rgba(0,0,0,.84);
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
padding:10px
}
#panel.hidden{
display:none
}
.title{
color:#fff;
font-size:13px;
font-weight:bold;
margin-bottom:7px
}
.line{
display:grid;
grid-template-columns:50px 1fr 55px;
align-items:center;
gap:7px;
margin-bottom:7px
}
.line span{
color:#fff;
font-size:11px
}
input[type=range]{
width:100%
}
output{
color:#00ff66;
text-align:right;
font-size:11px
}
.arrows{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
margin:5px 0 9px
}
.arrows button{
padding:8px 2px;
font-size:14px
}
#fileModel,#fileSettings{
display:none
}
#meshButton{
color:#00ff66
}
</style>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
"mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
}
}
</script>
</head>

<body>

<div id="container"></div>

<div id="top">
<button id="start">START CAMERA</button>
<button id="switch">SWITCH CAMERA</button>
<button id="mirror">MIRROR OFF</button>
<button id="model">IMPORT GLB</button>
<button id="meshButton">GREEN FACE ON</button>
<button id="panelButton">HIDE CONTROLS</button>
<button id="reset">RESET</button>
</div>

<div id="status">Ready</div>

<div id="panel">

<div class="title">POSITION</div>

<div class="line">
<span>X</span>
<input id="x" type="range" min="-1" max="1" step="0.001" value="0">
<output id="xv">0</output>
</div>

<div class="arrows">
<button data-action="xminus">←</button>
<button data-action="xplus">→</button>
<button data-action="yplus">↑</button>
<button data-action="yminus">↓</button>
<button data-action="resetpos">●</button>
</div>

<div class="line">
<span>Y</span>
<input id="y" type="range" min="-1" max="1" step="0.001" value="0">
<output id="yv">0</output>
</div>

<div class="line">
<span>Z</span>
<input id="z" type="range" min="-1" max="1" step="0.001" value="0">
<output id="zv">0</output>
</div>

<div class="arrows">
<button data-action="zback">Z−</button>
<button data-action="zfront">Z+</button>
<button data-action="scaleDown">−</button>
<button data-action="scaleUp">+</button>
<button data-action="resetScale">S</button>
</div>

<div class="line">
<span>SCALE</span>
<input id="scale" type="range" min="0.05" max="5" step="0.01" value="1">
<output id="scalev">1</output>
</div>

<div class="title">ROTATION</div>

<div class="line">
<span>RX</span>
<input id="rx" type="range" min="-180" max="180" step="1" value="0">
<output id="rxv">0</output>
</div>

<div class="line">
<span>RY</span>
<input id="ry" type="range" min="-180" max="180" step="1" value="0">
<output id="ryv">0</output>
</div>

<div class="arrows">
<button data-action="ryminus">↶</button>
<button data-action="ryplus">↷</button>
<button data-action="rxminus">X−</button>
<button data-action="rxplus">X+</button>
<button data-action="resetrot">R</button>
</div>

<div class="line">
<span>RZ</span>
<input id="rz" type="range" min="-180" max="180" step="1" value="0">
<output id="rzv">0</output>
</div>

<div class="arrows">
<button data-action="rzminus">↺</button>
<button data-action="rzplus">↻</button>
<button data-action="rxminus">X−</button>
<button data-action="rxplus">X+</button>
<button data-action="resetrot">0</button>
</div>

<div class="arrows">
<button id="importSettings">IMPORT SETTINGS</button>
<button id="exportSettings">EXPORT SETTINGS</button>
</div>

</div>

<input id="fileModel" type="file" accept=".glb,.gltf">
<input id="fileSettings" type="file" accept=".json">

<script type="module">import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {MindARThree} from "mindar-face-three";

const container=document.getElementById("container");
const status=document.getElementById("status");
const panel=document.getElementById("panel");

const startButton=document.getElementById("start");
const switchButton=document.getElementById("switch");
const mirrorButton=document.getElementById("mirror");
const modelButton=document.getElementById("model");
const meshButton=document.getElementById("meshButton");
const panelButton=document.getElementById("panelButton");
const resetButton=document.getElementById("reset");

const fileModel=document.getElementById("fileModel");
const fileSettings=document.getElementById("fileSettings");

const x=document.getElementById("x");
const y=document.getElementById("y");
const z=document.getElementById("z");
const scale=document.getElementById("scale");
const rx=document.getElementById("rx");
const ry=document.getElementById("ry");
const rz=document.getElementById("rz");

const xv=document.getElementById("xv");
const yv=document.getElementById("yv");
const zv=document.getElementById("zv");
const scalev=document.getElementById("scalev");
const rxv=document.getElementById("rxv");
const ryv=document.getElementById("ryv");
const rzv=document.getElementById("rzv");

let mindar=null;
let faceAnchor=null;
let faceMesh=null;
let occlusionMesh=null;

let modelRoot=new THREE.Group();
let currentModel=null;

let running=false;
let mirrored=false;
let greenFace=true;

const loader=new GLTFLoader();

function setStatus(text){
    status.textContent=text;
}

function updateLabels(){
    xv.textContent=Number(x.value).toFixed(2);
    yv.textContent=Number(y.value).toFixed(2);
    zv.textContent=Number(z.value).toFixed(2);
    scalev.textContent=Number(scale.value).toFixed(2);
    rxv.textContent=rx.value;
    ryv.textContent=ry.value;
    rzv.textContent=rz.value;
}

function applyTransform(){
    if(!currentModel)return;

    currentModel.position.set(
        Number(x.value),
        Number(y.value),
        Number(z.value)
    );

    currentModel.scale.setScalar(
        Number(scale.value)
    );

    currentModel.rotation.set(
        THREE.MathUtils.degToRad(Number(rx.value)),
        THREE.MathUtils.degToRad(Number(ry.value)),
        THREE.MathUtils.degToRad(Number(rz.value))
    );
}

function setupMindAR(){
    if(mindar)return;

    mindar=new MindARThree({
        container:container,
        resolution:"720p",
        uiLoading:"no",
        uiScanning:"no",
        uiError:"yes",
        filterMinCF:0.001,
        filterBeta:0.001,
        filterDCutOff:0.001
    });

    const scene=mindar.scene;
    const renderer=mindar.renderer;

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    const ambient=new THREE.HemisphereLight(
        0xffffff,
        0x777777,
        2
    );

    scene.add(ambient);

    const light=new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    light.position.set(0,2,2);
    scene.add(light);

    faceAnchor=mindar.addAnchor(168);

    faceAnchor.group.add(modelRoot);

    modelRoot.visible=false;

    faceMesh=mindar.addFaceMesh();

    faceMesh.material.color.set(0x00ff44);
    faceMesh.material.transparent=true;
    faceMesh.material.opacity=0.3;
    faceMesh.material.depthWrite=false;
    faceMesh.renderOrder=3;
    faceMesh.visible=greenFace;

    scene.add(faceMesh);

    occlusionMesh=mindar.addFaceMesh();

    occlusionMesh.material=new THREE.MeshBasicMaterial({
        colorWrite:false,
        depthWrite:true,
        depthTest:true,
        side:THREE.DoubleSide
    });

    occlusionMesh.renderOrder=0;

    scene.add(occlusionMesh);

    modelRoot.renderOrder=1;

    faceAnchor.onTargetFound=()=>{
        if(currentModel){
            modelRoot.visible=true;
        }
    };

    faceAnchor.onTargetLost=()=>{
        modelRoot.visible=false;
    };

    setStatus("Face tracker ready");
}

async function startAR(){
    try{
        setupMindAR();

        if(running){
            setStatus("Camera already ON");
            return;
        }

        await mindar.start();

        running=true;

        mindar.renderer.setAnimationLoop(()=>{
            mindar.renderer.render(
                mindar.scene,
                mindar.camera
            );
        });

        startButton.textContent="CAMERA ON";
        setStatus("Camera ON - Face tracking ON");

    }catch(error){
        console.error(error);
        setStatus("CAMERA ERROR");
    }
}

async function switchCamera(){
    try{
        if(!mindar){
            setupMindAR();
        }

        if(!running){
            await mindar.start();
            running=true;

            mindar.renderer.setAnimationLoop(()=>{
                mindar.renderer.render(
                    mindar.scene,
                    mindar.camera
                );
            });
        }

        await mindar.switchCamera();

        setStatus("Camera switched");

    }catch(error){
        console.error(error);
        setStatus("CAMERA SWITCH ERROR");
    }
}

function toggleMirror(){
    mirrored=!mirrored;

    container.style.transform=
        mirrored?"scaleX(-1)":"scaleX(1)";

    mirrorButton.textContent=
        mirrored?"MIRROR ON":"MIRROR OFF";
}

function toggleGreenFace(){
    greenFace=!greenFace;

    if(faceMesh){
        faceMesh.visible=greenFace;
    }

    meshButton.textContent=
        greenFace?"GREEN FACE ON":"GREEN FACE OFF";
}

function resetAll(){
    x.value=0;
    y.value=0;
    z.value=0;
    scale.value=1;
    rx.value=0;
    ry.value=0;
    rz.value=0;

    applyTransform();
    updateLabels();

    setStatus("Controls reset");
}

function disposeMaterial(material){
    if(!material)return;

    if(material.map)material.map.dispose();
    if(material.normalMap)material.normalMap.dispose();
    if(material.roughnessMap)material.roughnessMap.dispose();
    if(material.metalnessMap)material.metalnessMap.dispose();
    if(material.emissiveMap)material.emissiveMap.dispose();

    material.dispose();
}

function removeModel(){
    if(!currentModel)return;

    modelRoot.remove(currentModel);

    currentModel.traverse(object=>{
        if(object.geometry){
            object.geometry.dispose();
        }

        if(object.material){
            const materials=Array.isArray(object.material)
                ?object.material
                :[object.material];

            materials.forEach(disposeMaterial);
        }
    });

    currentModel=null;
    modelRoot.visible=false;
}

function fitModel(object){
    const box=new THREE.Box3().setFromObject(object);
    const center=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());

    object.position.sub(center);

    const maxSize=Math.max(
        size.x,
        size.y,
        size.z
    );

    if(maxSize>0){
        object.scale.setScalar(1/maxSize);
    }
}

function loadModel(file){
    if(!file)return;

    const url=URL.createObjectURL(file);

    setStatus("Loading GLB...");

    loader.load(
        url,
        gltf=>{
            URL.revokeObjectURL(url);

            removeModel();

            currentModel=gltf.scene;

            fitModel(currentModel);

            currentModel.traverse(object=>{
                if(object.isMesh){
                    object.frustumCulled=false;

                    if(object.material){
                        object.material.side=THREE.DoubleSide;
                    }
                }
            });

            modelRoot.add(currentModel);

            resetAll();

            modelRoot.visible=true;

            setStatus("GLB loaded");
        },
        undefined,
        error=>{
            URL.revokeObjectURL(url);
            console.error(error);
            setStatus("GLB LOAD ERROR");
        }
    );
}

function changeValue(id,amount){
    const input=document.getElementById(id);

    if(!input)return;

    let value=Number(input.value)+amount;

    const min=Number(input.min);
    const max=Number(input.max);

    value=Math.max(
        min,
        Math.min(max,value)
    );

    input.value=value;

    applyTransform();
    updateLabels();
}

function saveSettings(){
    const data={
        x:Number(x.value),
        y:Number(y.value),
        z:Number(z.value),
        scale:Number(scale.value),
        rx:Number(rx.value),
        ry:Number(ry.value),
        rz:Number(rz.value),
        mirrored:mirrored,
        greenFace:greenFace
    };

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="azezz-ar-settings.json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);

    setStatus("Settings exported");
}

function loadSettings(file){
    if(!file)return;

    const reader=new FileReader();

    reader.onload=()=>{
        try{
            const data=JSON.parse(reader.result);

            if(typeof data.x==="number")x.value=data.x;
            if(typeof data.y==="number")y.value=data.y;
            if(typeof data.z==="number")z.value=data.z;
            if(typeof data.scale==="number")scale.value=data.scale;
            if(typeof data.rx==="number")rx.value=data.rx;
            if(typeof data.ry==="number")ry.value=data.ry;
            if(typeof data.rz==="number")rz.value=data.rz;

            if(typeof data.mirrored==="boolean"){
                mirrored=data.mirrored;

                container.style.transform=
                    mirrored?"scaleX(-1)":"scaleX(1)";

                mirrorButton.textContent=
                    mirrored?"MIRROR ON":"MIRROR OFF";
            }

            if(typeof data.greenFace==="boolean"){
                greenFace=data.greenFace;

                if(faceMesh){
                    faceMesh.visible=greenFace;
                }

                meshButton.textContent=
                    greenFace
                    ?"GREEN FACE ON"
                    :"GREEN FACE OFF";
            }

            applyTransform();
            updateLabels();

            setStatus("Settings imported");

        }catch(error){
            console.error(error);
            setStatus("SETTINGS ERROR");
        }
    };

    reader.readAsText(file);
}

startButton.addEventListener(
    "click",
    startAR
);

switchButton.addEventListener(
    "click",
    switchCamera
);

mirrorButton.addEventListener(
    "click",
    toggleMirror
);

meshButton.addEventListener(
    "click",
    toggleGreenFace
);

modelButton.addEventListener(
    "click",
    ()=>{
        fileModel.value="";
        fileModel.click();
    }
);

fileModel.addEventListener(
    "change",
    ()=>{
        loadModel(fileModel.files[0]);
    }
);

panelButton.addEventListener(
    "click",
    ()=>{
        panel.classList.toggle("hidden");

        panelButton.textContent=
            panel.classList.contains("hidden")
            ?"SHOW CONTROLS"
            :"HIDE CONTROLS";
    }
);

resetButton.addEventListener(
    "click",
    resetAll
);

document.querySelectorAll(
    "#panel input[type=range]"
).forEach(input=>{
    input.addEventListener(
        "input",
        ()=>{
            applyTransform();
            updateLabels();
        }
    );
});

document.querySelectorAll(
    "[data-action]"
).forEach(button=>{
    button.addEventListener(
        "click",
        ()=>{
            const action=button.dataset.action;

            if(action==="xminus")changeValue("x",-0.02);
            if(action==="xplus")changeValue("x",0.02);

            if(action==="yplus")changeValue("y",0.02);
            if(action==="yminus")changeValue("y",-0.02);

            if(action==="zfront")changeValue("z",0.02);
            if(action==="zback")changeValue("z",-0.02);

            if(action==="scaleUp")changeValue("scale",0.05);
            if(action==="scaleDown")changeValue("scale",-0.05);

            if(action==="resetScale"){
                scale.value=1;
                applyTransform();
                updateLabels();
            }

            if(action==="ryplus")changeValue("ry",5);
            if(action==="ryminus")changeValue("ry",-5);

            if(action==="rxplus")changeValue("rx",5);
            if(action==="rxminus")changeValue("rx",-5);

            if(action==="rzplus")changeValue("rz",5);
            if(action==="rzminus")changeValue("rz",-5);

            if(action==="resetpos"){
                x.value=0;
                y.value=0;
                z.value=0;
                applyTransform();
                updateLabels();
            }

            if(action==="resetrot"){
                rx.value=0;
                ry.value=0;
                rz.value=0;
                applyTransform();
                updateLabels();
            }
        }
    );
});

document.getElementById("importSettings")
.addEventListener(
    "click",
    ()=>{
        fileSettings.value="";
        fileSettings.click();
    }
);

document.getElementById("exportSettings")
.addEventListener(
    "click",
    saveSettings
);

fileSettings.addEventListener(
    "change",
    ()=>{
        loadSettings(fileSettings.files[0]);
    }
);

updateLabels();window.addEventListener(
    "resize",
    ()=>{
        if(mindar){
            mindar.renderer.setPixelRatio(
                Math.min(window.devicePixelRatio,2)
            );
        }
    }
);

window.addEventListener(
    "error",
    event=>{
        console.error(
            "AR ERROR:",
            event.error || event.message
        );

        if(!running){
            setStatus("ERROR: "+event.message);
        }
    }
);

window.addEventListener(
    "unhandledrejection",
    event=>{
        console.error(
            "AR PROMISE ERROR:",
            event.reason
        );

        if(!running){
            setStatus("AR LOAD ERROR");
        }
    }
);

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            !document.hidden &&
            running &&
            mindar
        ){
            try{
                mindar.renderer.setAnimationLoop(
                    ()=>{
                        mindar.renderer.render(
                            mindar.scene,
                            mindar.camera
                        );
                    }
                );
            }catch(error){
                console.error(error);
            }
        }
    }
);

window.addEventListener(
    "beforeunload",
    ()=>{
        try{
            if(
                mindar &&
                running
            ){
                mindar.stop();
            }
        }catch(error){}
    }
);

setStatus("Ready - press START CAMERA");

</script>
</body>
</html>
