<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aziz Hero AR</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    z-index:1;
}

#threeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#fff;
    background:rgba(0,0,0,.55);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

#sideControls{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.ctrl{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:rgba(20,20,20,.72);
    color:#fff;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
}

.ctrl:active{
    transform:scale(.92);
}

#modelPanel{
    position:absolute;
    right:64px;
    top:50%;
    transform:translateY(-50%);
    width:220px;
    max-width:calc(100vw - 85px);
    padding:12px;
    border-radius:16px;
    background:rgba(15,15,15,.92);
    color:#fff;
    z-index:29;
    display:none;
}

#modelPanel.show{
    display:block;
}

.sliderRow{
    margin-bottom:8px;
}

.sliderRow label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    margin-bottom:3px;
}

.sliderRow input{
    width:100%;
}

#bottomControls{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    display:flex;
    gap:8px;
}

.smallCtrl{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(20,20,20,.72);
    color:#fff;
    font-size:18px;
}

.hidden{
    display:none !important;
}

#fileInput{
    display:none;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        muted
        playsinline
    ></video>

    <canvas id="threeCanvas"></canvas>

    <div id="status">Ready</div>

    <div id="sideControls">

        <button class="ctrl" id="cameraButton" type="button">📷</button>

        <button class="ctrl" id="switchCameraButton" type="button">🔄</button>

        <button class="ctrl" id="photoButton" type="button">📸</button>

        <button class="ctrl" id="recordButton" type="button">🎥</button>

        <button class="ctrl" id="audioButton" type="button">🎙️</button>

        <button class="ctrl" id="import3DButton" type="button">📂</button>

        <button class="ctrl" id="modelButton" type="button">🧊</button>

        <button class="ctrl" id="export3DButton" type="button">💾</button>

        <button class="ctrl" id="resetButton" type="button">↩️</button>

    </div>    <div id="bottomControls">

        <button class="smallCtrl" id="zoomOutButton" type="button">−</button>

        <button class="smallCtrl" id="zoomInButton" type="button">+</button>

        <button class="smallCtrl" id="hideControlsButton" type="button">☰</button>

    </div>


    <div id="modelPanel">

        <div class="sliderRow">
            <label>
                <span>Position X</span>
                <span id="posXValue">0</span>
            </label>
            <input id="posX" type="range" min="-5" max="5" step="0.01" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Position Y</span>
                <span id="posYValue">0</span>
            </label>
            <input id="posY" type="range" min="-5" max="5" step="0.01" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Position Z</span>
                <span id="posZValue">0</span>
            </label>
            <input id="posZ" type="range" min="-10" max="5" step="0.01" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Rotate X</span>
                <span id="rotXValue">0°</span>
            </label>
            <input id="rotX" type="range" min="0" max="360" step="1" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Rotate Y</span>
                <span id="rotYValue">0°</span>
            </label>
            <input id="rotY" type="range" min="0" max="360" step="1" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Rotate Z</span>
                <span id="rotZValue">0°</span>
            </label>
            <input id="rotZ" type="range" min="0" max="360" step="1" value="0">
        </div>

        <div class="sliderRow">
            <label>
                <span>Scale</span>
                <span id="scaleValue">1.00</span>
            </label>
            <input id="scale" type="range" min="0.05" max="5" step="0.01" value="1">
        </div>

    </div>


    <input
    id="import3DInput"
    type="file"
    accept=".glb,.gltf,.obj,.fbx,.stl"
>

</div>


<script type="module" src="./js/app.js?v=6"></script>

</body>
</html>
