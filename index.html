<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azeez AR - Face Tracking Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: white;
      font: 16px Arial, sans-serif;
      text-align: center;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 75vh;
      background: #222;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: contain;
    }
    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }
    button {
      margin: 6px;
      padding: 12px 16px;
      font-size: 15px;
    }
    #status { padding: 12px; }
  </style>
</head>
<body>
  <h3>Azeez AR Face Tracking Test</h3>
  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Ready. Press START.</div>
  <button id="start">START CAMERA & TRACKING</button>
  <button id="stop">STOP CAMERA</button>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    let stream = null;
    let landmarker = null;
    let running = false;
    let lastVideoTime = -1;

    async function start() {
      try {
        status.textContent = "Opening camera...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        status.textContent = "Loading face tracking model...";
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        try {
          landmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          });
        } catch (gpuError) {
          landmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          });
        }

        running = true;
        status.textContent = "Tracking started. Look at the camera.";
        requestAnimationFrame(track);
      } catch (error) {
        status.textContent = "ERROR: " + error.message;
        console.error(error);
      }
    }

    function track() {
      if (!running || !landmarker || video.readyState < 2) return;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const result = landmarker.detectForVideo(
          video, performance.now()
        );

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (result.faceLandmarks.length > 0) {
          status.textContent = "FACE DETECTED ✓";
          ctx.fillStyle = "#00ff66";
          for (const point of result.faceLandmarks[0]) {
            ctx.beginPath();
            ctx.arc(
              point.x * canvas.width,
              point.y * canvas.height,
              2,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        } else {
          status.textContent = "Camera working — face not detected";
        }
      }

      requestAnimationFrame(track);
    }

    document.getElementById("start").addEventListener("click", start);

    document.getElementById("stop").addEventListener("click", () => {
      running = false;
      if (stream) stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      status.textContent = "Camera stopped.";
    });
  </script>
</body>
</html>
