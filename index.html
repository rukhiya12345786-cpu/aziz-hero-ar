<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Tracking 3D Model Mask</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* Mirror camera view for natural feel */
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1); /* Match mirrored camera */
        }
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            outline: none;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.96);
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(18, 18, 18, 0.9);
            padding: 14px 16px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            z-index: 100;
            color: #fff;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        .slider-group {
            margin-bottom: 8px;
        }
        .slider-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 2px;
            color: #ccc;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/libs/fflate.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="top-bar">
        <button class="btn" id="import-btn">Import Model</button>
        <button class="btn" id="flip-cam-btn">Flip Cam</button>
        <button class="btn" id="record-btn">Record</button>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label>Scale (Size)</label>
            <input type="range" id="scale-slider" min="0.1" max="5" step="0.05" value="1">
        </div>
        <div class="slider-group">
            <label>Position X</label>
            <input type="range" id="pos-x-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Y</label>
            <input type="range" id="pos-y-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Z (Depth)</label>
            <input type="range" id="pos-z-slider" min="-3" max="3" step="0.05" value="0">
        </div>
    </div>

    <input type="file" id="file-input" accept=".glb, .gltf, .obj, .fbx, .vrm" style="display: none;">

    <script>
        const videoElement = document.getElementById('webcam-video');
        let useFrontCamera = true;
        let currentModel = null;
        let manualScale = 1;
        let manualOffsetX = 0;
        let manualOffsetY = 0;
        let manualOffsetZ = 0;

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 0, 2);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(0, 1, 1).normalize();
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // File Import Handling
        const importBtn = document.getElementById('import-btn');
        const fileInput = document.getElementById('file-input');

        importBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            const fileName = file.name.toLowerCase();

            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            if (fileName.endsWith('.glb') || fileName.endsWith('.gltf') || fileName.endsWith('.vrm')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);
                    alert("Model loaded successfully: " + file.name);
                }, undefined, (err) => console.error(err));
            } 
            else if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (obj) => {
                    currentModel = obj;
                    scene.add(currentModel);
                    alert("Model loaded successfully: " + file.name);
                }, undefined, (err) => console.error(err));
            } 
            else if (fileName.endsWith('.fbx')) {
                const loader = new THREE.FBXLoader();
                loader.load(fileURL, (fbx) => {
                    currentModel = fbx;
                    scene.add(currentModel);
                    alert("Model loaded successfully: " + file.name);
                }, undefined, (err) => console.error(err));
            }
        });

        // Sliders Listeners
        document.getElementById('scale-slider').addEventListener('input', (e) => { manualScale = parseFloat(e.target.value); });
        document.getElementById('pos-x-slider').addEventListener('input', (e) => { manualOffsetX = parseFloat(e.target.value); });
        document.getElementById('pos-y-slider').addEventListener('input', (e) => { manualOffsetY = parseFloat(e.target.value); });
        document.getElementById('pos-z-slider').addEventListener('input', (e) => { manualOffsetZ = parseFloat(e.target.value); });

        // MediaPipe Face Mesh Initialization for AR Tracking
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && currentModel) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Get nose bridge landmark (index 1) to track head position
                const nose = landmarks[1];

                // Map screen coordinates to Three.js 3D space
                const x = (nose.x - 0.5) * -2.5 + manualOffsetX;
                const y = (nose.y - 0.5) * -2.5 + manualOffsetY;
                const z = -nose.z * 2 + manualOffsetZ;

                currentModel.position.set(x, y, z);
                currentModel.scale.set(manualScale, manualScale, manualScale);

                // Optional: Head rotation estimation based on key points (Left/Right cheek landmarks)
                const leftCheek = landmarks.get ? landmarks[234] : landmarks[234];
                const rightCheek = landmarks.get ? landmarks[454] : landmarks[454];
                if (leftCheek && rightCheek) {
                    const dx = rightCheek.x - leftCheek.x;
                    const dy = rightCheek.y - leftCheek.y;
                    const rotZ = Math.atan2(dy, dx);
                    currentModel.rotation.z = -rotZ;
                }
            }
        });

        // Start Camera Stream with MediaPipe Camera Utils
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        cameraUtils.start().catch(err => {
            console.error("Camera start error:", err);
            // Fallback manual camera start if needed
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                videoElement.srcObject = stream;
            });
        });

        document.getElementById('flip-cam-btn').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            // Toggle constraints if required
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
