<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Animoji Studio - Live Face Tracking</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .btn {
            background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 18px; font-size: 14px; border-radius: 25px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(5px);
        }

        /* Bottom Dock for Animoji Selection */
        .bottom-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 22px; border-radius: 40px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(10px);
        }
        .filter-switcher { display: flex; gap: 12px; align-items: center; }
        .filter-thumb {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            background-size: cover; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 22px; background-color: #222; transition: transform 0.2s;
        }
        .filter-thumb:active { transform: scale(0.9); }
        .filter-thumb.active { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }

        /* Start Screen */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #111, #222); z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
    </style>

    <!-- Three.js & MediaPipe Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px;">Aziz Animoji Studio</h1>
        <p style="color: #aaa; max-width: 320px;">Real-time 3D Emoji Face Tracking with expression mapping.</p>
        <button id="launch-btn">START ANIMOJI</button>
        <div id="error-log" style="color: #ff4444; font-size: 13px; margin-top: 15px; max-width: 300px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip Camera</button>
            <button id="take-snap" class="btn interactive">📸 Capture</button>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb active" id="btn-laugh" onclick="switchAnimoji('laugh')">😆</div>
                <div class="filter-thumb" id="btn-cool" onclick="switchAnimoji('cool')">😎</div>
                <div class="filter-thumb" id="btn-panda" onclick="switchAnimoji('panda')">🐼</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let animojiGroup = null;
        let currentType = 'laugh';
        let useFront = true;

        // Dynamic parts for expression mapping
        let jawPart = null, leftEyePart = null, rightEyePart = null;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Initializing...";
            btn.disabled = true;

            try {
                if (typeof THREE === 'undefined') throw new Error("Three.js failed to load.");
                if (typeof FaceMesh === 'undefined') throw new Error("MediaPipe failed to load.");

                await startCamera();
                document.getElementById('start-screen').style.display = 'none';

                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START ANIMOJI";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 2.0));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            buildAnimoji('laugh');
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', takeSnapshot);
            animateLoop();
        }

        function switchAnimoji(type) {
            currentType = type;
            document.querySelectorAll('.filter-thumb').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            buildAnimoji(type);
        }

        function buildAnimoji(type) {
            if (animojiGroup) scene.remove(animojiGroup);
            animojiGroup = new THREE.Group();

            if (type === 'laugh') {
                // Head (Yellow Sphere)
                const headGeo = new THREE.SphereGeometry(0.9, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                // Laughing Eyes (Crescents / Arcs)
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                const eyeGeo = new THREE.BoxGeometry(0.2, 0.08, 0.05);
                
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.3, 0.25, 0.8);
                animojiGroup.add(leftEye);

                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.3, 0.25, 0.8);
                animojiGroup.add(rightEye);

                // Open Smiling Mouth (Jaw)
                const mouthGeo = new THREE.BoxGeometry(0.4, 0.25, 0.1);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x8b0000 });
                jawPart = new THREE.Mesh(mouthGeo, mouthMat);
                jawPart.position.set(0, -0.25, 0.75);
                animojiGroup.add(jawPart);

            } else if (type === 'cool') {
                // Head
                const headGeo = new THREE.SphereGeometry(0.9, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                // Cool Sunglasses
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.1 });
                const glassGeo = new THREE.BoxGeometry(1.1, 0.35, 0.3);
                const glasses = new THREE.Mesh(glassGeo, glassMat);
                glasses.position.set(0, 0.2, 0.75);
                animojiGroup.add(glasses);

                // Smiling smirk mouth
                const mouthGeo = new THREE.BoxGeometry(0.35, 0.08, 0.05);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                jawPart = new THREE.Mesh(mouthGeo, mouthMat);
                jawPart.position.set(0, -0.3, 0.8);
                animojiGroup.add(jawPart);

            } else if (type === 'panda') {
                // Panda Head (White)
                const headGeo = new THREE.SphereGeometry(0.9, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                // Panda Ears (Black patches)
                const earGeo = new THREE.SphereGeometry(0.3, 16, 16);
                const earMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const leftEar = new THREE.Mesh(earGeo, earMat); leftEar.position.set(-0.7, 0.7, 0);
                const rightEar = new THREE.Mesh(earGeo, earMat); rightEar.position.set(0.7, 0.7, 0);
                animojiGroup.add(leftEar);
                animojiGroup.add(rightEar);

                // Panda Eyes patch + eyes
                const patchGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.05, 16);
                patchGeo.rotateX(Math.PI / 2);
                const patchMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const lPatch = new THREE.Mesh(patchGeo, patchMat); lPatch.position.set(-0.35, 0.2, 0.78);
                const rPatch = new THREE.Mesh(patchGeo, patchMat); rPatch.position.set(0.35, 0.2, 0.78);
                animojiGroup.add(lPatch);
                animojiGroup.add(rPatch);

                // Nose & Mouth
                const noseGeo = new THREE.BoxGeometry(0.2, 0.12, 0.05);
                const noseMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const nose = new THREE.Mesh(noseGeo, noseMat);
                nose.position.set(0, -0.05, 0.85);
                animojiGroup.add(nose);

                const mouthGeo = new THREE.BoxGeometry(0.3, 0.15, 0.05);
                jawPart = new THREE.Mesh(mouthGeo, patchMat);
                jawPart.position.set(0, -0.3, 0.8);
                animojiGroup.add(jawPart);
            }

            scene.add(animojiGroup);
        }

        function initTracking() {
            faceMesh = new FaceMesh({ 
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` 
            });
            faceMesh.setOptions({ 
                maxNumFaces: 1, 
                refineLandmarks: true, 
                minDetectionConfidence: 0.6, 
                minTrackingConfidence: 0.6 
            });
            
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && animojiGroup) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1];
                    const leftEye = lm[234];
                    const rightEye = lm[454];

                    // 1. Position mapping based on nose
                    const targetX = -(nose.x - 0.5) * 3.5;
                    const targetY = -(nose.y - 0.5) * 3.5 + 0.1;
                    const targetZ = nose.z * 1.2;

                    animojiGroup.position.x += (targetX - animojiGroup.position.x) * 0.4;
                    animojiGroup.position.y += (targetY - animojiGroup.position.y) * 0.4;
                    animojiGroup.position.z += (targetZ - animojiGroup.position.z) * 0.4;

                    // 2. Rotation mapping (Head tilt and roll)
                    const dx = rightEye.x - leftEye.x;
                    const dy = rightEye.y - leftEye.y;
                    const faceRotZ = Math.atan2(dy, dx);
                    const dz = rightEye.z - leftEye.z;
                    const faceRotY = Math.asin(Math.max(-1, Math.min(1, dz * 2.0)));

                    animojiGroup.rotation.set(0, faceRotY, faceRotZ);

                    // 3. Expression Mapping (Open mouth tracking: Upper lip index 13, Lower lip index 14)
                    if (jawPart) {
                        const upperLip = lm[13];
                        const lowerLip = lm[14];
                        const mouthOpenDist = Math.abs(upperLip.y - lowerLip.y);
                        // Scale mouth height based on user's mouth opening
                        const scaleY = Math.max(0.5, mouthOpenDist * 15.0);
                        jawPart.scale.set(1, scaleY, 1);
                    }

                    animojiGroup.visible = true;
                } else if (animojiGroup) {
                    animojiGroup.visible = false;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => {
                    if (videoEl && videoEl.readyState >= 2) {
                        await faceMesh.send({ image: videoEl });
                    }
                },
                width: 1280,
                height: 720
            });
            mpCamera.start();
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'animoji-snap.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
