<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    transform:scaleX(-1);
}

#threeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#landmarkCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
    pointer-events:none;
    transform:scaleX(-1);
}

#topBar{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 12px;
    background:rgba(20,20,20,.85);
    color:#fff;
    font-size:13px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

#status{
    position:absolute;
    top:65px;
    left:10px;
    z-index:10;
    padding:8px 11px;
    border-radius:8px;
    color:#fff;
    background:rgba(0,0,0,.65);
    font-size:13px;
}

#controls{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;
    z-index:20;
    max-height:45vh;
    overflow-y:auto;
    padding:12px;
    border-radius:14px;
    background:rgba(0,0,0,.78);
    color:#fff;
}

.controlRow{
    display:grid;
    grid-template-columns:75px 1fr 55px;
    gap:8px;
    align-items:center;
    margin:8px 0;
}

.controlRow label{
    font-size:13px;
    font-weight:bold;
}

.controlRow input{
    width:100%;
}

.value{
    text-align:right;
    font-size:12px;
}

.section{
    margin-top:4px;
    margin-bottom:5px;
    font-size:14px;
    font-weight:bold;
}

#fileInput{
    display:none;
}

#hint{
    margin-top:8px;
    font-size:11px;
    line-height:1.4;
    color:#ccc;
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="app">

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>
<canvas id="landmarkCanvas"></canvas>

<div id="topBar">
<button id="startCamera">START CAMERA</button>
<button id="switchCamera">SWITCH CAMERA</button>
<button id="mirrorButton">MIRROR: ON</button>
<button id="trackingButton">TRACKING: ON</button>
<button id="importButton">IMPORT GLB</button>
<button id="resetButton">RESET</button>
</div>

<div id="status">Ready</div>

<div id="controls">

<div class="section">HEAD FIT / MODEL POSITION</div>

<div class="controlRow">
<label>X</label>
<input id="xSlider" type="range" min="-250" max="250" value="0" step="1">
<span class="value" id="xValue">0</span>
</div>

<div class="controlRow">
<label>Y</label>
<input id="ySlider" type="range" min="-250" max="250" value="0" step="1">
<span class="value" id="yValue">0</span>
</div>

<div class="controlRow">
<label>Z DEPTH</label>
<input id="zSlider" type="range" min="-250" max="250" value="0" step="1">
<span class="value" id="zValue">0</span>
</div>

<div class="section">MODEL SIZE</div>

<div class="controlRow">
<label>SCALE</label>
<input id="scaleSlider" type="range" min="0.1" max="4" value="1" step="0.01">
<span class="value" id="scaleValue">1.00</span>
</div>

<div class="section">MODEL ROTATION</div>

<div class="controlRow">
<label>ROT X</label>
<input id="rotXSlider" type="range" min="-180" max="180" value="0" step="1">
<span class="value" id="rotXValue">0</span>
</div>

<div class="controlRow">
<label>ROT Y</label>
<input id="rotYSlider" type="range" min="-180" max="180" value="0" step="1">
<span class="value" id="rotYValue">0</span>
</div>

<div class="controlRow">
<label>ROT Z</label>
<input id="rotZSlider" type="range" min="-180" max="180" value="0" step="1">
<span class="value" id="rotZValue">0</span>
</div>

<div class="section">HEAD SIZE</div>

<div class="controlRow">
<label>HEAD X</label>
<input id="headXSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headXValue">1.00</span>
</div>

<div class="controlRow">
<label>HEAD Y</label>
<input id="headYSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headYValue">1.00</span>
</div>

<div class="controlRow">
<label>HEAD Z</label>
<input id="headZSlider" type="range" min="0.5" max="2" value="1" step="0.01">
<span class="value" id="headZValue">1.00</span>
</div>

<div id="hint">
Z DEPTH moves the model through head-space. Negative values move deeper and positive values move forward.
</div>

</div>

<input id="fileInput" type="file" accept=".glb,.gltf">

</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const video=document.getElementById("camera");
const threeCanvas=document.getElementById("threeCanvas");
const landmarkCanvas=document.getElementById("landmarkCanvas");
const landmarkCtx=landmarkCanvas.getContext("2d");
const statusBox=document.getElementById("status");

let stream=null;
let currentFacing="user";
let mirrorOn=true;
let trackingOn=true;
let faceLandmarker=null;
let lastVideoTime=-1;
let modelRoot=null;
let dummyHead=null;

const headAnchor=new THREE.Group();

const settings={
x:0,
y:0,
z:0,
scale:1,
rotX:0,
rotY:0,
rotZ:0,
headX:1,
headY:1,
headZ:1
};

const scene=new THREE.Scene();

const renderer=new THREE.WebGLRenderer({
canvas:threeCanvas,
alpha:true,
antialias:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000000,0);

const camera3D=new THREE.OrthographicCamera(
0,
window.innerWidth,
0,
window.innerHeight,
-5000,
5000
);

camera3D.position.z=1000;

scene.add(headAnchor);

scene.add(new THREE.AmbientLight(0xffffff,2.2));

const light1=new THREE.DirectionalLight(0xffffff,3);
light1.position.set(0,300,600);
scene.add(light1);

const light2=new THREE.DirectionalLight(0xffffff,2);
light2.position.set(-300,-200,300);
scene.add(light2);

function updateModelTransform(){

if(!modelRoot)return;

modelRoot.position.set(
settings.x,
settings.y,
settings.z
);

modelRoot.scale.setScalar(settings.scale);

modelRoot.rotation.set(
THREE.MathUtils.degToRad(settings.rotX),
THREE.MathUtils.degToRad(settings.rotY),
THREE.MathUtils.degToRad(settings.rotZ)
);

}

function createDummyHead(){

if(dummyHead){
headAnchor.remove(dummyHead);
}

dummyHead=new THREE.Group();

const headMaterial=new THREE.MeshStandardMaterial({
color:0xaaaaaa,
roughness:.65,
metalness:.05,
transparent:true,
opacity:.35
});

const head=new THREE.Mesh(
new THREE.SphereGeometry(1,48,32),
headMaterial
);

head.scale.set(
105*settings.headX,
125*settings.headY,
100*settings.headZ
);

dummyHead.add(head);

const eyeMaterial=new THREE.MeshStandardMaterial({
color:0xffffff
});

const pupilMaterial=new THREE.MeshStandardMaterial({
color:0x111111
});

function makeEye(x){

const eye=new THREE.Mesh(
new THREE.SphereGeometry(15,24,16),
eyeMaterial
);

eye.position.set(x,38,82);

const pupil=new THREE.Mesh(
new THREE.SphereGeometry(6,20,12),
pupilMaterial
);

pupil.position.set(x,38,94);

dummyHead.add(eye);
dummyHead.add(pupil);
}

makeEye(-38);
makeEye(38);

const nose=new THREE.Mesh(
new THREE.ConeGeometry(14,42,24),
new THREE.MeshStandardMaterial({
color:0xaaaaaa
})
);

nose.rotation.x=Math.PI/2;
nose.position.set(0,0,108);
dummyHead.add(nose);

const mouth=new THREE.Mesh(
new THREE.TorusGeometry(25,5,12,32,Math.PI),
new THREE.MeshStandardMaterial({
color:0x333333
})
);

mouth.rotation.x=Math.PI;
mouth.position.set(0,-48,92);
dummyHead.add(mouth);

const earMaterial=new THREE.MeshStandardMaterial({
color:0x999999,
transparent:true,
opacity:.5
});

const leftEar=new THREE.Mesh(
new THREE.SphereGeometry(25,24,16),
earMaterial
);

leftEar.scale.set(.55,1,.7);
leftEar.position.set(-105,0,0);

const rightEar=leftEar.clone();
rightEar.position.x=105;

dummyHead.add(leftEar);
dummyHead.add(rightEar);

headAnchor.add(dummyHead);
}

createDummyHead();

const loader=new GLTFLoader();

function importGLB(file){

const objectURL=URL.createObjectURL(file);

loader.load(
objectURL,
function(gltf){

if(modelRoot){
headAnchor.remove(modelRoot);
}

modelRoot=gltf.scene;

modelRoot.traverse(function(obj){

if(obj.isMesh){

obj.frustumCulled=false;

if(obj.material){

obj.material.depthWrite=true;
obj.material.depthTest=true;

}

}

});

headAnchor.add(modelRoot);

updateModelTransform();

dummyHead.visible=false;

statusBox.textContent="GLB LOADED";

URL.revokeObjectURL(objectURL);

},
undefined,
function(error){

console.error(error);
statusBox.textContent="GLB LOAD ERROR";

URL.revokeObjectURL(objectURL);

}
);

}

async function startCamera(){

try{

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

stream=null;

}

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:currentFacing
},
width:{
ideal:1280
},
height:{
ideal:720
}
},
audio:false
});

video.srcObject=stream;

await video.play();

statusBox.textContent="CAMERA ON";

resizeCanvas();

await setupFaceTracking();

}catch(error){

console.error(error);
statusBox.textContent="CAMERA ERROR";

}

}

async function setupFaceTracking(){

try{

if(faceLandmarker)return;

statusBox.textContent="LOADING FACE TRACKER...";

const visionModule=await import(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
);

const {
FaceLandmarker,
FilesetResolver
}=visionModule;

const filesetResolver=
await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

faceLandmarker=
await FaceLandmarker.createFromOptions(
filesetResolver,
{
baseOptions:{
modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
delegate:"GPU"
},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,
minFacePresenceConfidence:.5,
minTrackingConfidence:.5,

outputFaceBlendshapes:false,
outputFacialTransformationMatrixes:true
}
);

statusBox.textContent="FACE TRACKER READY";

requestAnimationFrame(trackFace);

}catch(error){

console.error(error);
statusBox.textContent="FACE TRACKER ERROR";

}

}

function trackFace(){

requestAnimationFrame(trackFace);

if(!faceLandmarker)return;

if(video.readyState<2)return;

if(video.currentTime===lastVideoTime)return;

lastVideoTime=video.currentTime;

if(!trackingOn)return;

const now=performance.now();

try{

const result=
faceLandmarker.detectForVideo(
video,
now
);

if(
result.faceLandmarks &&
result.faceLandmarks.length>0
){

updateHeadFromFace(
result.faceLandmarks[0],
result.facialTransformationMatrixes
);

drawLandmarks(
result.faceLandmarks[0]
);

statusBox.textContent="FACE TRACKING ON";

}else{

statusBox.textContent="SEARCHING FACE";

clearLandmarks();

}

}catch(error){

console.error(error);

}

}

function updateHeadFromFace(
landmarks,
matrices
){

if(!landmarks||landmarks.length<264)return;

const leftEye=landmarks[33];
const rightEye=landmarks[263];

const centerX=
(leftEye.x+rightEye.x)*.5;

const centerY=
(leftEye.y+rightEye.y)*.5;

const eyeDistance=Math.sqrt(
Math.pow(rightEye.x-leftEye.x,2)+
Math.pow(rightEye.y-leftEye.y,2)
);

const faceScale=
THREE.MathUtils.clamp(
eyeDistance*2600,
70,
220
);

const screenX=
centerX*window.innerWidth;

const screenY=
centerY*window.innerHeight;

headAnchor.position.x=
screenX+settings.x;

headAnchor.position.y=
screenY+settings.y;

headAnchor.position.z=
settings.z;

const baseScale=
faceScale/120;

headAnchor.scale.set(
baseScale*settings.headX,
baseScale*settings.headY,
baseScale*settings.headZ
);

if(
matrices&&
matrices.length>0
){

try{

const matrixData=matrices[0].data;

if(matrixData&&matrixData.length===16){

const m=new THREE.Matrix4();

m.fromArray(matrixData);

const rotationMatrix=new THREE.Matrix4();

rotationMatrix.extractRotation(m);

const euler=
new THREE.Euler()
.setFromRotationMatrix(
rotationMatrix,
"XYZ"
);

headAnchor.rotation.x=
euler.x+
THREE.MathUtils.degToRad(
settings.rotX
);

headAnchor.rotation.y=
-euler.y+
THREE.MathUtils.degToRad(
settings.rotY
);

headAnchor.rotation.z=
-euler.z+
THREE.MathUtils.degToRad(
settings.rotZ
);

}

}catch(error){

console.warn(
"Matrix rotation fallback",
error
);

}

}

if(!matrices||matrices.length===0){

headAnchor.rotation.set(
0,
0,
0
);

}

if(modelRoot){

modelRoot.position.set(
settings.x,
settings.y,
settings.z
);

modelRoot.scale.setScalar(
settings.scale
);

}

}

function drawLandmarks(landmarks){

resizeCanvas();

landmarkCtx.clearRect(
0,
0,
landmarkCanvas.width,
landmarkCanvas.height
);

landmarkCtx.fillStyle="#00ff55";

const points=[
1,
33,
133,
263,
362,
61,
291,
199,
10,
152
];

for(const index of points){

const p=landmarks[index];

if(!p)continue;

const x=p.x*landmarkCanvas.width;
const y=p.y*landmarkCanvas.height;

landmarkCtx.beginPath();

landmarkCtx.arc(
x,
y,
6,
0,
Math.PI*2
);

landmarkCtx.fill();

}

}

function clearLandmarks(){

landmarkCtx.clearRect(
0,
0,
landmarkCanvas.width,
landmarkCanvas.height
);

}

function resizeCanvas(){

const w=window.innerWidth;
const h=window.innerHeight;

threeCanvas.width=w;
threeCanvas.height=h;

landmarkCanvas.width=w;
landmarkCanvas.height=h;

renderer.setSize(w,h,false);

camera3D.left=0;
camera3D.right=w;
camera3D.top=0;
camera3D.bottom=h;

camera3D.updateProjectionMatrix();

}function bindSlider(
    sliderId,
    valueId,
    property,
    decimals=0
){

    const slider=document.getElementById(sliderId);
    const value=document.getElementById(valueId);

    slider.addEventListener(
        "input",
        function(){

            settings[property]=Number(this.value);

            value.textContent=
                decimals>0
                ? settings[property].toFixed(decimals)
                : settings[property];

            if(
                property==="headX" ||
                property==="headY" ||
                property==="headZ"
            ){

                createDummyHead();

            }

            updateModelTransform();
        }
    );
}


/* =========================
   SLIDERS
========================= */

bindSlider(
    "xSlider",
    "xValue",
    "x"
);

bindSlider(
    "ySlider",
    "yValue",
    "y"
);

bindSlider(
    "zSlider",
    "zValue",
    "z"
);

bindSlider(
    "scaleSlider",
    "scaleValue",
    "scale",
    2
);

bindSlider(
    "rotXSlider",
    "rotXValue",
    "rotX"
);

bindSlider(
    "rotYSlider",
    "rotYValue",
    "rotY"
);

bindSlider(
    "rotZSlider",
    "rotZValue",
    "rotZ"
);

bindSlider(
    "headXSlider",
    "headXValue",
    "headX",
    2
);

bindSlider(
    "headYSlider",
    "headYValue",
    "headY",
    2
);

bindSlider(
    "headZSlider",
    "headZValue",
    "headZ",
    2
);


/* =========================
   RESET
========================= */

function resetAll(){

    settings.x=0;
    settings.y=0;
    settings.z=0;
    settings.scale=1;

    settings.rotX=0;
    settings.rotY=0;
    settings.rotZ=0;

    settings.headX=1;
    settings.headY=1;
    settings.headZ=1;

    document.getElementById("xSlider").value=0;
    document.getElementById("ySlider").value=0;
    document.getElementById("zSlider").value=0;
    document.getElementById("scaleSlider").value=1;

    document.getElementById("rotXSlider").value=0;
    document.getElementById("rotYSlider").value=0;
    document.getElementById("rotZSlider").value=0;

    document.getElementById("headXSlider").value=1;
    document.getElementById("headYSlider").value=1;
    document.getElementById("headZSlider").value=1;

    document.getElementById("xValue").textContent="0";
    document.getElementById("yValue").textContent="0";
    document.getElementById("zValue").textContent="0";

    document.getElementById("scaleValue").textContent="1.00";

    document.getElementById("rotXValue").textContent="0";
    document.getElementById("rotYValue").textContent="0";
    document.getElementById("rotZValue").textContent="0";

    document.getElementById("headXValue").textContent="1.00";
    document.getElementById("headYValue").textContent="1.00";
    document.getElementById("headZValue").textContent="1.00";

    createDummyHead();

    if(modelRoot){

        modelRoot.position.set(
            0,
            0,
            0
        );

        modelRoot.scale.setScalar(1);

        modelRoot.rotation.set(
            0,
            0,
            0
        );

    }

    statusBox.textContent="RESET COMPLETE";
}


/* =========================
   CAMERA BUTTON
========================= */

document
.getElementById("startCamera")
.addEventListener(
    "click",
    startCamera
);


/* =========================
   SWITCH CAMERA
========================= */

document
.getElementById("switchCamera")
.addEventListener(
    "click",
    async function(){

        currentFacing=
            currentFacing==="user"
            ? "environment"
            : "user";

        await startCamera();

    }
);


/* =========================
   MIRROR
========================= */

document
.getElementById("mirrorButton")
.addEventListener(
    "click",
    function(){

        mirrorOn=!mirrorOn;

        if(mirrorOn){

            video.style.transform=
                "scaleX(-1)";

            landmarkCanvas.style.transform=
                "scaleX(-1)";

            this.textContent=
                "MIRROR: ON";

        }else{

            video.style.transform=
                "scaleX(1)";

            landmarkCanvas.style.transform=
                "scaleX(1)";

            this.textContent=
                "MIRROR: OFF";

        }

    }
);


/* =========================
   TRACKING
========================= */

document
.getElementById("trackingButton")
.addEventListener(
    "click",
    function(){

        trackingOn=!trackingOn;

        this.textContent=
            trackingOn
            ? "TRACKING: ON"
            : "TRACKING: OFF";

        if(!trackingOn){

            clearLandmarks();

        }

    }
);


/* =========================
   RESET BUTTON
========================= */

document
.getElementById("resetButton")
.addEventListener(
    "click",
    resetAll
);


/* =========================
   IMPORT BUTTON
========================= */

document
.getElementById("importButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("fileInput")
        .click();

    }
);


/* =========================
   FILE INPUT
========================= */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(){

        const file=this.files[0];

        if(!file)return;

        importGLB(file);

    }
);


/* =========================
   RENDER LOOP
========================= */

function render(){

    requestAnimationFrame(render);

    renderer.render(
        scene,
        camera3D
    );

}

render();


/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

</script>

</body>
</html>
