<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz True Helmet 360 Studio</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; gap: 6px; }
        
        .btn {
            background: rgba(0, 0, 0, 0.8); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 9px 14px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(6px);
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }

        .bottom-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(8px);
        }
        .filter-switcher { display: flex; gap: 12px; align-items: center; }
        .filter-thumb {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; background-color: rgba(34,34,34,0.8);
        }
        .filter-thumb.active { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
        }
    </style>

    <!-- Essential Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px;">Aziz True Helmet Studio</h1>
        <p style="color: #aaa; font-size: 14px;">Solid 360° Head Enclosure</p>
        <button id="launch-btn">START STUDIO</button>
        <div id="error-log" style="color: #ff4444; font-size: 12px; margin-top: 10px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="import-btn" class="btn interactive">📥 Import Model</button>
            <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf">
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb active" id="btn-helmet" onclick="switchAnimoji('helmet')">🪖</div>
                <div class="filter-thumb" id="btn-bubble" onclick="switchAnimoji('bubble')">🌐</div>
                <div class="filter-thumb" id="btn-skull" onclick="switchAnimoji('skull')">💀</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let helmetRoot = null;
        let useFront = true;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                await startCamera();
                document.getElementById('start-screen').style.display = 'none';
                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START STUDIO";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (object) => {
                    if (helmetRoot) scene.remove(helmetRoot);
                    helmetRoot = new THREE.Group();
                    object.traverse(child => {
                        if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.5, roughness: 0.2 });
                    });
                    object.scale.set(0.012, 0.012, 0.012);
                    object.position.set(0, 0, 0);
                    helmetRoot.add(object);
                    scene.add(helmetRoot);
                    alert("Model Imported Successfully!");
                });
            } else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    if (helmetRoot) scene.remove(helmetRoot);
                    helmetRoot = new THREE.Group();
                    const model = gltf.scene;
                    model.scale.set(1.1, 1.1, 1.1);
                    model.position.set(0, 0, 0);
                    helmetRoot.add(model);
                    scene.add(helmetRoot);
                    alert("Model Imported Successfully!");
                });
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(0, 10, 10);
            scene.add(light);

            buildHelmet('helmet');
            camera.position.z = 2.8;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
                const link = document.createElement('a');
                link.download = 'helmet_view.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            animateLoop();
        }

        function switchAnimoji(type) {
            document.querySelectorAll('.filter-thumb').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            buildHelmet(type);
        }

        function buildHelmet(type) {
            if (helmetRoot) scene.remove(helmetRoot);
            helmetRoot = new THREE.Group();

            if (type === 'helmet') {
                // Real 360 Full Motor Helmet Shell
                const shell = new THREE.Mesh(
                    new THREE.SphereGeometry(0.95, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.2 })
                );
                shell.position.set(0, 0.05, 0);
                helmetRoot.add(shell);

                // Visor Shield
                const visor = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.96, 0.96, 0.45, 32, 1, true, 0, Math.PI),
                    new THREE.MeshStandardMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.6, metalness: 0.9, roughness: 0.1, side: THREE.DoubleSide })
                );
                visor.rotation.y = Math.PI / 2;
                visor.position.set(0, 0.1, 0);
                helmetRoot.add(visor);

            } else if (type === 'bubble') {
                const bubble = new THREE.Mesh(
                    new THREE.SphereGeometry(1.0, 32, 32),
                    new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.05, transmission: 0.9, thickness: 0.5 })
                );
                helmetRoot.add(bubble);

            } else if (type === 'skull') {
                const skull = new THREE.Mesh(
                    new THREE.SphereGeometry(0.9, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.6 })
                );
                helmetRoot.add(skull);
            }

            scene.add(helmetRoot);
        }

        function initTracking() {
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            let smoothPos = new THREE.Vector3(0, 0, 0);
            let smoothRot = new THREE.Quaternion();

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && helmetRoot) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1], lEdge = lm[234], rEdge = lm[454], forehead = lm[10], chin = lm[152];

                    // Full head center estimation
                    const cx = (lEdge.x + rEdge.x) / 2;
                    const cy = (forehead.y + chin.y) / 2;
                    const cz = (lEdge.z + rEdge.z + nose.z) / 3;

                    const targetX = -(cx - 0.5) * 3.2;
                    const targetY = -(cy - 0.5) * 3.2 + 0.15;
                    const targetZ = cz * 1.2;

                    smoothPos.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.4);
                    helmetRoot.position.copy(smoothPos);

                    // Matrix / Rotation Calculation for full head tracking
                    const dx = rEdge.x - lEdge.x, dy = rEdge.y - lEdge.y;
                    const roll = Math.atan2(dy, dx);
                    const yaw = Math.asin(Math.max(-1, Math.min(1, (rEdge.z - lEdge.z) * 1.8)));
                    const pitch = ((chin.y - forehead.y) - 0.4) * -1.2;

                    let targetEuler = new THREE.Euler(pitch, yaw, roll, 'YXZ');
                    let targetQuat = new THREE.Quaternion().setFromEuler(targetEuler);
                    smoothRot.slerp(targetQuat, 0.4);
                    helmetRoot.quaternion.copy(smoothRot);

                    helmetRoot.visible = true;
                } else if (helmetRoot) {
                    helmetRoot.visible = false;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => { if (videoEl && videoEl.readyState >= 2) await faceMesh.send({ image: videoEl }); },
                width: 640, height: 480
            });
            mpCamera.start();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
                </html>
