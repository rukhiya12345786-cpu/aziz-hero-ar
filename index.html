function rad(value){
return value * Math.PI / 180;
}

function updateLabels(){
xValue.textContent =
state.x.toFixed(2);

yValue.textContent =
state.y.toFixed(2);

zValue.textContent =
state.z.toFixed(2);

scaleValue.textContent =
state.scale.toFixed(2);

rxValue.textContent =
Math.round(state.rx);

ryValue.textContent =
Math.round(state.ry);

rzValue.textContent =
Math.round(state.rz);
}

function updateModelTransform(){

if(!modelRoot){
return;
}

modelRoot.position.set(
state.x,
state.y,
state.z
);

modelRoot.scale.setScalar(
state.scale
);

modelRoot.rotation.set(
rad(state.rx),
rad(state.ry),
rad(state.rz)
);

updateLabels();
}

function resetModelState(){

state.x = 0;
state.y = 0;
state.z = 0;
state.scale = 1;
state.rx = 0;
state.ry = 0;
state.rz = 0;

ySlider.value = 0;
zSlider.value = 0;

rySlider.value = 0;

function setupAR(){

try{

mindar = new MindARThree({
  container: app,
  uiLoading: "no",
  uiScanning: "no",
  uiError: "no"

renderer = mindar.renderer;

renderer.domElement.style.height =

async function startCamera(){

if(running){
return;
}

loadingState(
true,
"Starting Camera..."
);

statusText(
"Starting Camera..."
);

try{

if(!mindar){

  const ready =
    setupAR();

  if(!ready){
    throw new Error(
      "AR setup failed"
    );
  }

}

await mindar.start();

running = true;

await new Promise(
  resolve =>
    setTimeout(
      resolve,
      300
    )
);

showCamera();

setTimeout(
  showCamera,
  500
);

setTimeout(
  showCamera,
  1000
);

loadingState(false);

startButton.style.display =
  "none";

statusText(

);

animate();

}catch(error){

console.error(
  error
);

loadingState(
  false
);

statusText(
  "Camera Error"
);

}

}

}

"Switching Camera..."

await new Promise(

getVideo();

if(!video){

video.style.transform =

if(

/* =========================
P3 - MODEL, RECORDING, SETTINGS
========================= */

function clearModel() {
while (modelRoot.children.length) {
const child = modelRoot.children[0];
modelRoot.remove(child);

child.traverse((obj) => {
  if (obj.geometry) obj.geometry.dispose();

  if (obj.material) {
    const materials = Array.isArray(obj.material)
      ? obj.material
      : [obj.material];

    materials.forEach((mat) => {
      if (mat.map) mat.map.dispose();
      if (mat.normalMap) mat.normalMap.dispose();
      if (mat.roughnessMap) mat.roughnessMap.dispose();
      if (mat.metalnessMap) mat.metalnessMap.dispose();
      mat.dispose();
    });
  }
});

}

currentModel = null;
}

function prepareModel(object) {
object.traverse((child) => {
if (!child.isMesh) return;

child.frustumCulled = false;

if (child.material) {
  const materials = Array.isArray(child.material)
    ? child.material
    : [child.material];

  materials.forEach((material) => {
    material.side = THREE.DoubleSide;
    material.depthTest = true;
    material.depthWrite = true;
  });
}

});

return object;
}

function loadGLTFFile(file) {
const url = URL.createObjectURL(file);

loadingState(true);

loader.load(
url,
(gltf) => {
clearModel();

  currentModel = prepareModel(gltf.scene);
  modelRoot.add(currentModel);

  currentModel.position.set(0, 0, 0);
  currentModel.rotation.set(0, 0, 0);
  currentModel.scale.set(1, 1, 1);

  URL.revokeObjectURL(url);

  updateModelTransform();
  statusText("3D Model Loaded");
  loadingState(false);
},
undefined,
() => {
  URL.revokeObjectURL(url);
  statusText("Model Load Error");
  loadingState(false);
}

);
}

modelFile.addEventListener("change", (event) => {
const file = event.target.files && event.target.files[0];

if (!file) return;

const name = file.name.toLowerCase();

if (name.endsWith(".glb") || name.endsWith(".gltf")) {
loadGLTFFile(file);
} else {
statusText("Use GLB or GLTF");
}

event.target.value = "";
});

function saveSettings() {
const data = {
version: 1,
model: {
x: state.x,
y: state.y,
z: state.z,
scale: state.scale,
rotX: state.rotX,
rotY: state.rotY,
rotZ: state.rotZ
},
mirror: mirrored,
faceMesh: meshVisible
};

const blob = new Blob(
[JSON.stringify(data, null, 2)],
{ type: "application/json" }
);

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download = "aziz-ar-settings.json";
link.click();

URL.revokeObjectURL(url);

statusText("Settings Exported");
}

function loadSettings(file) {
const reader = new FileReader();

reader.onload = () => {
try {
const data = JSON.parse(reader.result);

  if (data.model) {
    state.x = Number(data.model.x) || 0;
    state.y = Number(data.model.y) || 0;
    state.z = Number(data.model.z) || 0;
    state.scale = Number(data.model.scale) || 1;
    state.rotX = Number(data.model.rotX) || 0;
    state.rotY = Number(data.model.rotY) || 0;
    state.rotZ = Number(data.model.rotZ) || 0;
  }

  if (typeof data.mirror === "boolean") {
    mirrored = data.mirror;
    mirrorButton.textContent = "MIRROR: " + (mirrored ? "ON" : "OFF");
    applyMirror();
  }

  if (typeof data.faceMesh === "boolean") {
    meshVisible = data.faceMesh;

    if (faceMesh && faceMesh.material) {
      faceMesh.material.opacity = meshVisible ? 0.3 : 0;
    }

    meshButton.textContent =
      "FACE MESH: " + (meshVisible ? "ON" : "OFF");
  }

  updateLabels();
  updateModelTransform();

  statusText("Settings Imported");
} catch (error) {
  statusText("Invalid Settings");
}

};

reader.readAsText(file);
}

settingsFile.addEventListener("change", (event) => {
const file = event.target.files && event.target.files[0];

if (!file) return;

loadSettings(file);
event.target.value = "";
});

function startRecording() {
if (!running) {
statusText("Start Camera First");
return;
}

if (recorder && recorder.state === "recording") {
recorder.stop();
recordButton.textContent = "START RECORDING";
return;
}

const recordCanvas = document.createElement("canvas");
const recordContext = recordCanvas.getContext("2d");

const width = Math.max(
320,
Math.floor(window.innerWidth * Math.min(window.devicePixelRatio || 1, 2))
);

const height = Math.max(
240,
Math.floor(window.innerHeight * Math.min(window.devicePixelRatio || 1, 2))
);

recordCanvas.width = width;
recordCanvas.height = height;

const stream = recordCanvas.captureStream(30);

recordedChunks = [];

let mimeType = "video/webm;codecs=vp9";

if (!MediaRecorder.isTypeSupported(mimeType)) {
mimeType = "video/webm;codecs=vp8";
}

if (!MediaRecorder.isTypeSupported(mimeType)) {
mimeType = "video/webm";
}

recorder = new MediaRecorder(stream, {
mimeType
});

recorder.ondataavailable = (event) => {
if (event.data && event.data.size > 0) {
recordedChunks.push(event.data);
}
};

recorder.onstop = () => {
const blob = new Blob(
recordedChunks,
{ type: mimeType }
);

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download = "aziz-ar-recording.webm";
link.click();

setTimeout(() => {
  URL.revokeObjectURL(url);
}, 1000);

statusText("Recording Saved");

};

recorder.start();
recordButton.textContent = "STOP RECORDING";
statusText("Recording");

const drawRecording = () => {
if (!recorder || recorder.state !== "recording") return;

const video = getVideo();

recordContext.clearRect(
  0,
  0,
  recordCanvas.width,
  recordCanvas.height
);

if (video && video.readyState >= 2) {
  const vw = video.videoWidth || window.innerWidth;
  const vh = video.videoHeight || window.innerHeight;

  const videoRatio = vw / vh;
  const canvasRatio = recordCanvas.width / recordCanvas.height;

  let dw;
  let dh;
  let dx;
  let dy;

  if (videoRatio > canvasRatio) {
    dh = recordCanvas.height;
    dw = dh * videoRatio;
    dx = (recordCanvas.width - dw) / 2;
    dy = 0;
  } else {
    dw = recordCanvas.width;
    dh = dw / videoRatio;
    dx = 0;
    dy = (recordCanvas.height - dh) / 2;
  }

  recordContext.save();

  if (mirrored) {
    recordContext.translate(recordCanvas.width, 0);
    recordContext.scale(-1, 1);
  }

  recordContext.drawImage(
    video,
    dx,
    dy,
    dw,
    dh
  );

  recordContext.restore();
}

if (renderer && renderer.domElement) {
  recordContext.drawImage(
    renderer.domElement,
    0,
    0,
    recordCanvas.width,
    recordCanvas.height
  );
}

requestAnimationFrame(drawRecording);

};

drawRecording();
}

recordButton.addEventListener("click", startRecording);

function downloadCurrentSettings() {
saveSettings();
}

exportButton.addEventListener(
"click",
downloadCurrentSettings
);

function updateFaceMeshVisibility() {
if (!faceMesh || !faceMesh.material) return;

faceMesh.material.transparent = true;
faceMesh.material.opacity = meshVisible ? 0.3 : 0;
faceMesh.visible = true;
}

function toggleFaceMesh() {
meshVisible = !meshVisible;

updateFaceMeshVisibility();

meshButton.textContent =
"FACE MESH: " + (meshVisible ? "ON" : "OFF");

statusText(
meshVisible
? "Face Mesh On"
: "Face Mesh Off"
);
}

meshButton.addEventListener(
"click",
toggleFaceMesh
);

function updateTrackingStatus() {
if (!running) return;

if (faceAnchor && faceAnchor.group) {
const visible =
faceAnchor.group.visible !== false;

if (visible) {
  statusText("Face Tracking Active");
} else {
  statusText("Searching Face");
}

}
}

function applyModelVisibility() {
if (!modelRoot) return;

modelRoot.visible = true;
}

function animateFrame() {
if (!running) return;

requestAnimationFrame(animateFrame);

applyModelVisibility();
updateFaceMeshVisibility();
updateTrackingStatus();

if (renderer && scene && camera) {
renderer.render(scene, camera);
}
}

function startRenderLoop() {
animateFrame();
}

function fixVideoLayer() {
const video = getVideo();

if (!video) return;

video.style.position = "absolute";
video.style.left = "0";
video.style.top = "0";
video.style.width = "100%";
video.style.height = "100%";
video.style.objectFit = "cover";
video.style.zIndex = "1";
video.style.pointerEvents = "none";

applyMirror();
}

function finalResize() {
resize();
fixVideoLayer();

if (renderer) {
renderer.setPixelRatio(
Math.min(window.devicePixelRatio || 1, 2)
);
}
}

window.addEventListener(
"orientationchange",
() => {
setTimeout(finalResize, 400);
}
);

window.addEventListener(
"resize",
finalResize
);

importButton.addEventListener(
"click",
() => modelFile.click()
);

settingsButton.addEventListener(
"click",
() => settingsFile.click()
);

setInterval(() => {
if (running) {
fixVideoLayer();
updateFaceMeshVisibility();
}
}, 1000);

updateLabels();
loadingState(false);
statusText("Camera Off");

</script>
</body>
</html>
