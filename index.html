<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aijaz AR Memoji Studio - Ultimate</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Hidden or minimized tracking webcam feed */
        #webcam { position: absolute; top: -9999px; left: -9999px; width: 640px; height: 480px; opacity: 0; pointer-events: none; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; transform: scaleX(-1); }
        
        /* Transparent Glassmorphism UI */
        .top-panel {
            position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 8px 14px; font-size: 11px;
            border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .glass-btn:active { background: rgba(0, 255, 136, 0.4); color: #000; }
        .btn-red { background: rgba(255, 71, 87, 0.3); border-color: rgba(255, 71, 87, 0.6); }
        .btn-blue { background: rgba(30, 144, 255, 0.3); border-color: rgba(30, 144, 255, 0.6); }

        /* Transparent Adjustment Panel */
        .controls-panel {
            position: absolute; bottom: 15px; left: 15px; right: 15px; z-index: 20;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; gap: 8px; color: #fff; font-size: 11px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .control-row input { width: 70%; cursor: pointer; accent-color: #00ff88; }

        .status-bar {
            position: absolute; top: 15px; left: 15px; z-index: 20; color: #00ff88; font-size: 11px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 6px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>

    <!-- Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- MediaPipe & Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <div class="status-bar" id="status">Memoji Studio Ready</div>
    
    <div class="top-panel">
        <button id="upload-btn" class="glass-btn">📁 Import Model</button>
        <button id="flip-btn" class="glass-btn btn-blue">🔄 Flip Cam</button>
        <button id="record-btn" class="glass-btn btn-red">🔴 Record Video</button>
        <input type="file" id="file-input" style="display: none;" accept=".obj,.glb,.gltf,.fbx">
    </div>

    <!-- Transparent Adjustment Sliders -->
    <div class="controls-panel">
        <div class="control-row">
            <span>Avatar Scale:</span>
            <input type="range" id="scale-slider" min="0.5" max="4.0" step="0.1" value="1.8">
        </div>
        <div class="control-row">
            <span>Depth (Z Offset):</span>
            <input type="range" id="posz-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
        </div>
        <div class="control-row">
            <span>Manual Rotate Y:</span>
            <input type="range" id="roty-slider" min="-3.14" max="3.14" step="0.1" value="0.0">
        </div>
    </div>

    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, videoElement, mediaStream;
        let currentModel = null;
        
        // Tracking variables for full head locking
        let targetPosition = new THREE.Vector3(0, 0, 0);
        let currentPosition = new THREE.Vector3(0, 0, 0);
        let targetRotation = new THREE.Euler();
        let currentRotation = new THREE.Euler();
        
        let userScale = 1.8;
        let userPosZ = 0.0;
        let userRotY = 0.0;
        let baseScaleMultiplier = 1.0;
        let useFrontCamera = true;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.0;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            // Rich Studio Lighting for 3D textures
            scene.add(new THREE.AmbientLight(0xffffff, 2.2));
            const light1 = new THREE.DirectionalLight(0xffffff, 1.8);
            light1.position.set(0, 10, 10);
            scene.add(light1);
            const light2 = new THREE.DirectionalLight(0xffffff, 1.0);
            light2.position.set(0, -10, -10);
            scene.add(light2);

            loadDefaultMemojiHead();

            // UI Hooks
            document.getElementById('upload-btn').addEventListener('click', () => document.getElementById('file-input').click());
            document.getElementById('flip-btn').addEventListener('click', () => {
                useFrontCamera = !useFrontCamera;
                startCamera();
            });
            document.getElementById('record-btn').addEventListener('click', toggleRecording);

            document.getElementById('scale-slider').addEventListener('input', (e) => userScale = parseFloat(e.target.value));
            document.getElementById('posz-slider').addEventListener('input', (e) => userPosZ = parseFloat(e.target.value));
            document.getElementById('roty-slider').addEventListener('input', (e) => userRotY = parseFloat(e.target.value));

            // File Importer with Full Texture Support
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileURL = URL.createObjectURL(file);
                const ext = file.name.split('.').pop().toLowerCase();

                document.getElementById('status').innerText = "Loading 3D Avatar...";

                const setupModel = (object) => {
                    if (currentModel) scene.remove(currentModel);
                    
                    object.traverse((child) => {
                        if (child.isMesh) {
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                                if (child.material.map) child.material.map.encoding = THREE.sRGBEncoding;
                            }
                        }
                    });

                    // Center and normalize model bounds
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    object.position.sub(center);

                    const maxAxis = Math.max(size.x, size.y, size.z);
                    if (maxAxis > 0) {
                        baseScaleMultiplier = 1.2 / maxAxis;
                    }

                    currentModel = object;
                    scene.add(currentModel);
                    document.getElementById('status').innerText = "Avatar Loaded Successfully!";
                };

                if (ext === 'obj') {
                    new THREE.OBJLoader().load(fileURL, (obj) => setupModel(obj), undefined, () => alert("OBJ Load Error"));
                } else if (ext === 'glb' || ext === 'gltf') {
                    new THREE.GLTFLoader().load(fileURL, (gltf) => setupModel(gltf.scene), undefined, () => alert("GLB Load Error"));
                } else if (ext === 'fbx') {
                    new THREE.FBXLoader().load(fileURL, (obj) => setupModel(obj), undefined, () => alert("FBX Load Error"));
                }
            });

            startCameraAndTracking();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function loadDefaultMemojiHead() {
            const group = new THREE.Group();
            // Default placeholder sphere head mimicking a 3D avatar head
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.4 }); // Skin tone
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);
            currentModel = group;
            scene.add(currentModel);
        }

        function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 640, height: 480 }
            }).then(stream => {
                mediaStream = stream;
                videoElement.srcObject = stream;
            }).catch(err => {
                console.error(err);
                alert("Camera permission denied or unavailable.");
            });
        }

        function startCameraAndTracking() {
            videoElement = document.getElementById('webcam');
            startCamera();

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];
                    const riggedFace = Kalidokit.Face.solve(landmarks, {
                        runtime: "mediapipe",
                        video: videoElement
                    });

                    if (riggedFace) {
                        // Precise head mapping to lock avatar right onto the face position
                        targetPosition.x = riggedFace.position.x * 1.5;
                        targetPosition.y = -riggedFace.position.y * 1.5;
                        targetPosition.z = -riggedFace.position.z * 1.2;

                        targetRotation.x = riggedFace.head.x;
                        targetRotation.y = riggedFace.head.y;
                        targetRotation.z = riggedFace.head.z;
                    }
                }
            });

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    if (videoElement && videoElement.readyState >= 2) {
                        await faceMesh.send({ image: videoElement });
                    }
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function toggleRecording() {
            const recordBtn = document.getElementById('record-btn');
            if (!isRecording) {
                recordedChunks = [];
                const canvasStream = renderer.domElement.captureStream(30);
                try {
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(canvasStream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'aijaz-memoji-recording.webm';
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.getElementById('status').innerText = "Video Saved Successfully!";
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "⏹️ Stop Recording";
                document.getElementById('status').innerText = "Recording in progress...";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Record Video";
                document.getElementById('status').innerText = "Processing video...";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (currentModel) {
                // Smooth interpolation for fluid head movement
                currentPosition.x += (targetPosition.x - currentPosition.x) * 0.35;
                currentPosition.y += (targetPosition.y - currentPosition.y) * 0.35;
                currentPosition.z += (targetPosition.z - currentPosition.z) * 0.35;

                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.35;
                currentRotation.y += ((targetRotation.y + userRotY) - currentRotation.y) * 0.35;
                currentRotation.z += (targetRotation.z - currentRotation.z) * 0.35;

                // Apply correct scaling and positions to cover the face completely like Memoji
                currentModel.position.set(currentPosition.x, currentPosition.y, currentPosition.z + userPosZ);
                currentModel.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z, 'YXZ');
                
                const finalScale = baseScaleMultiplier * userScale;
                currentModel.scale.set(finalScale, finalScale, finalScale);
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
