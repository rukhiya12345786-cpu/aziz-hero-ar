<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalidokit + Custom Model Importer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        
        #webcam { position: absolute; top: 15px; left: 15px; width: 140px; height: 105px; transform: scaleX(-1); border-radius: 8px; z-index: 10; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vw; z-index: 1; }
        
        .ui-top {
            position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; gap: 10px;
        }
        .btn {
            background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88;
            padding: 10px 16px; font-size: 12px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .btn:active { background: #00ff88; color: #000; }

        .info-box {
            position: absolute; bottom: 20px; left: 15px; right: 15px; text-align: center;
            z-index: 20; color: #aaa; font-size: 12px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px;
        }
    </style>

    <!-- Required Libraries (Three.js, Loaders, MediaPipe, Kalidokit) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="ui-top">
        <button id="import-btn" class="btn">📥 Import 3D Model</button>
        <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf,.fbx">
    </div>

    <div id="webgl-container"></div>
    <div class="info-box" id="status-text">Status: Loading Camera & Kalidokit Tracking...</div>

    <script>
        let scene, camera, renderer, videoElement;
        let activeModel = null;
        let smoothRot = new THREE.Quaternion();

        function initApp() {
            // 1. Setup Three.js
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(0, 1, 2);
            scene.add(light);

            // Create a default placeholder head so screen isn't empty initially
            loadDefaultPlaceholder();

            // 2. Setup Importer Hook
            document.getElementById('import-btn').addEventListener('click', () => {
                document.getElementById('import-file').click();
            });

            document.getElementById('import-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileURL = URL.createObjectURL(file);
                const fileName = file.name.toLowerCase();

                document.getElementById('status-text').innerText = "Loading Model...";

                if (fileName.endsWith('.obj')) {
                    new THREE.OBJLoader().load(fileURL, (obj) => {
                        obj.traverse(child => {
                            if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
                        });
                        replaceModel(obj);
                    }, undefined, (err) => alert("Failed to load OBJ"));
                } else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                    new THREE.GLTFLoader().load(fileURL, (gltf) => {
                        replaceModel(gltf.scene);
                    }, undefined, (err) => alert("Failed to load GLB/GLTF"));
                } else if (fileName.endsWith('.fbx')) {
                    new THREE.FBXLoader().load(fileURL, (obj) => {
                        obj.traverse(child => {
                            if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
                        });
                        replaceModel(obj);
                    }, undefined, (err) => alert("Failed to load FBX"));
                }
            });

            // 3. Setup MediaPipe + Kalidokit Tracking
            initTracking();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function loadDefaultPlaceholder() {
            activeModel = new THREE.Group();
            const geometry = new THREE.BoxGeometry(0.6, 0.7, 0.6);
            const material = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
            const mesh = new THREE.Mesh(geometry, material);
            activeModel.add(mesh);
            scene.add(activeModel);
            document.getElementById('status-text').innerText = "Tracking Active! (Upload your own model anytime)";
        }

        function replaceModel(newObj) {
            if (activeModel) scene.remove(activeModel);
            
            // Auto-center and scale custom model
            const box = new THREE.Box3().setFromObject(newObj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            newObj.position.sub(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
                newObj.scale.multiplyScalar(1.2 / maxDim);
            }

            activeModel = new THREE.Group();
            activeModel.add(newObj);
            scene.add(activeModel);
            document.getElementById('status-text').innerText = "Custom Model Loaded Successfully!";
        }

        function initTracking() {
            videoElement = document.getElementById('webcam');

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && activeModel) {
                    const landmarks = results.multiFaceLandmarks[0];
                    
                    // Kalidokit Face Solver (Exact official logic)
                    const riggedFace = Kalidokit.Face.solve(landmarks, {
                        runtime: "mediapipe",
                        video: videoElement
                    });

                    if (riggedFace) {
                        const euler = riggedFace.head;
                        // Apply head rotation smoothly
                        let targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(euler.x, euler.y, euler.z, 'YXZ'));
                        smoothRot.slerp(targetQuat, 0.5);
                        activeModel.quaternion.copy(smoothRot);
                    }
                }
            });

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    if (videoElement && videoElement.readyState >= 2) {
                        await faceMesh.send({ image: videoElement });
                    }
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        initApp();
    </script>
</body>
</html>
