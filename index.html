
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeez AR - Face Tracking Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial;text-align:center}
h3{padding:12px;margin:0}
#stage{position:relative;width:100%;height:65vh;background:#222;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
button{padding:13px;margin:8px 4px;font-size:15px}
#status{padding:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<h3>AZEEZ AR — CAMERA + FACE TRACKING</h3>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="status">Press START TEST</div>
<button id="start">START CAMERA + TRACKING</button>
<button id="stop">STOP CAMERA</button>

<script type="module">
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

let stream=null;
let tracker=null;
let running=false;
let busy=false;

async function startTest(){
  if(busy||running)return;
  busy=true;

  try{
    status.textContent="STEP 1: Opening camera...";

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Camera unavailable. Open your HTTPS GitHub Pages website in Chrome.");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}
    });

    video.srcObject=stream;
    await video.play();
    status.textContent="STEP 2: Camera opened. Loading MediaPipe...";

    const mp=await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
    );

    status.textContent="STEP 3: Loading tracking engine...";

    const vision=await mp.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    const modelURL=
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    tracker=await mp.FaceLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:modelURL,delegate:"CPU"},
      runningMode:"VIDEO",
      numFaces:1
    });

    running=true;
    status.textContent="STEP 4: Tracking started. Looking for face...";
    requestAnimationFrame(detectFace);

  }catch(error){
    status.textContent="ERROR: "+(error.message||String(error));
    console.error(error);
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
      video.srcObject=null;
    }
  }finally{
    busy=false;
  }
}

function detectFace(){
  if(!running)return;

  try{
    if(video.readyState>=2&&video.videoWidth>0){
      if(canvas.width!==video.videoWidth||canvas.height!==video.videoHeight){
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
      }

      ctx.clearRect(0,0,canvas.width,canvas.height);
      const result=tracker.detectForVideo(video,performance.now());
      const faces=result.faceLandmarks||[];

      if(faces.length){
        status.textContent="FACE DETECTED ✓ — Green dots active";
        ctx.fillStyle="#00ff66";

        for(const p of faces[0]){
          ctx.beginPath();
          ctx.arc(p.x*canvas.width,p.y*canvas.height,2,0,Math.PI*2);
          ctx.fill();
        }
      }else{
        status.textContent="Tracking engine running — Face not detected yet";
      }
    }
  }catch(error){
    running=false;
    status.textContent="TRACKING ERROR: "+error.message;
    return;
  }

  requestAnimationFrame(detectFace);
}

document.getElementById("start").addEventListener("click",startTest);

document.getElementById("stop").addEventListener("click",()=>{
  running=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  if(tracker){
    tracker.close();
    tracker=null;
  }

  video.srcObject=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  status.textContent="Camera stopped.";
});
</script>
</body>
</html>
