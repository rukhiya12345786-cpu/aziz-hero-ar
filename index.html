<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Module Test</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#status{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    background:white;
    color:black;

    padding:25px;

    border-radius:15px;

    font-family:Arial;
    font-size:20px;

    text-align:center;
}

</style>

</head>

<body>

<div id="status">
LOADING MODULE...
</div>


<script type="module">

const status =
document.getElementById("status");


try{

    const THREE =
    await import(
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    );


    if(THREE){

        status.innerText =
        "MODULE TEST OK ✓\n\nTHREE.JS LOADED";

    }

}

catch(error){

    status.innerText =
    "MODULE TEST ERROR\n\n" +
    error.message;

    console.error(error);

}

</script>

</body>
</html>
