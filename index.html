<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Azeez AR Head Tracker</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arContainer video,
#arContainer canvas {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
}

#statusBar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 50;

    padding: 10px 13px;

    border-radius: 14px;

    background: rgba(0,0,0,0.62);

    color: #fff;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

#status {
    font-size: 13px;
    font-weight: 700;
    color: #5cff82;
}

#faceInfo {
    margin-top: 4px;
    font-size: 10px;
    color: #ddd;
}

#blendInfo {
    margin-top: 3px;
    font-size: 9px;
    color: #aaa;
}

#bottomPanel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 60;

    max-height: 58vh;

    overflow-y: auto;

    padding: 10px 12px 20px;

    border-radius: 22px 22px 0 0;

    background: rgba(12,12,12,0.92);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

#handle {
    width: 48px;
    height: 5px;

    margin: 0 auto 10px;

    border-radius: 10px;

    background: rgba(255,255,255,0.45);
}

.title {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 9px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
}

button {
    min-height: 40px;

    border: 0;
    border-radius: 11px;

    background: #292929;

    color: #fff;

    font-size: 10px;
    font-weight: 700;
}

button:active {
    transform: scale(0.97);
}

.green {
    background: #1caa4a;
}

.red {
    background: #b92828;
}

.section {
    margin-top: 12px;
    margin-bottom: 7px;

    color: #aaa;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 0.8px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.control {
    padding: 8px;

    border-radius: 11px;

    background: rgba(255,255,255,0.065);
}

.control label {
    display: flex;
    justify-content: space-between;

    margin-bottom: 5px;

    color: #fff;

    font-size: 10px;
    font-weight: 700;
}

.control label span {
    color: #5cff82;
}

input[type="range"] {
    width: 100%;
    height: 18px;
    margin: 0;
    accent-color: #39e96c;
}

input[type="file"] {
    display: none;
}

.smallButton {
    margin-top: 7px;
    width: 100%;
}

@media (orientation: landscape) {

    #bottomPanel {
        left: auto;
        width: 360px;
        max-height: 100vh;
        border-radius: 18px 0 0 18px;
    }

}

@media (max-width: 380px) {

    .grid {
        grid-template-columns: repeat(2,1fr);
    }

}

</style>

</head>

<body>

<div id="app">

    <div id="arContainer"></div>

    <div id="statusBar">

        <div id="status">
            READY
        </div>

                <input

                    min="-180"
                    max="180"
                    step="1"
                    value="0"
                >

            </div>

            <div class="control">

                <label>
                    ROT Z
                    <span id="rzText">0</span>
                </label>

                <input
                    id="rzSlider"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0"
                >

            <div class="control">

                <label>
                    HEAD FIT

        <div class="section">

        <button

        <button

            class="smallButton"
        >
            EXPORT SETTINGS
        </button>

        <button

            class="smallButton"
        >
            IMPORT SETTINGS
        </button>

        <input
            id="settingsInput"
            type="file"
            accept=".json"
        >

    </div>

</div>

    );

    );

    );

    );

    );

const scaleText =

    );

const rxText =
    document.getElementById(

    );

const ryText =

    );

const rzText =

        "rzText"
    );

const fitText =

    );


const recordButton =

    );

    );

    );


let mindarThree = null;

let renderer = null;

let scene = null;

let camera = null;

let faceMesh = null;

let modelRoot = null;

let loadedModel = null;

let loader = null;

let started = false;

let trackingVisible = true;

let mirrorEnabled = true;

let recording = false;

let mediaRecorder = null;

let recordingChunks = [];


const settings = {

    x: 0,

    y: 0,

    z: 0,

    scale: 1,

    rx: 0,

    ry: 0,

    rz: 0,

    fit: 1

};


function setStatus(
    value
) {

    status.textContent =
        value;

}


function setFaceInfo(
    value
) {

    faceInfo.textContent =
        value;

}


function setBlendInfo(
    value
) {

    blendInfo.textContent =
        value;

}


function createAR() {

    mindarThree =
        new MindARThree({

            container:
                arContainer,

            uiLoading:
                "no",

            uiScanning:
                "no",

            uiError:
                "no"

        });


    renderer =
        mindarThree.renderer;

    scene =
        mindarThree.scene;

    camera =
        mindarThree.camera;


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0xbbbbff,
            1.2
        );


    scene.add(
        light
    );


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );


    directionalLight.position.set(
        0,
        1,
        2
    );


    scene.add(
        directionalLight
    );


    faceMesh =
        mindarThree.addFaceMesh();


    faceMesh.material =
        new THREE.MeshBasicMaterial({

            color:
                0x35ff68,

            transparent:
                true,

            opacity:
                0.10,

            side:
                THREE.DoubleSide,

            depthWrite:
                false

        });


    scene.add(
        faceMesh
    );


    modelRoot =
        new THREE.Group();


    modelRoot.name =
        "HeadModel";


    faceMesh.add(
        modelRoot
    );


    loader =
        new GLTFLoader();


    setStatus(
        "READY"
    );

    setFaceInfo(
        "Press START CAMERA"
    );

    setBlendInfo(
        "Expressions: ready"
    );

}


createAR();


function degrees(
    value
) {

    return (
        value *
        Math.PI /
        180
    );

}


function applySettings() {

    if (
        !modelRoot
    ) {

        return;

    }


    modelRoot.position.set(
        settings.x,
        settings.y,
        settings.z
    );


    modelRoot.rotation.set(
        degrees(
            settings.rx
        ),
        degrees(
            settings.ry
        ),
        degrees(
            settings.rz
        )
    );


    modelRoot.scale.setScalar(
        settings.scale *
        settings.fit
    );

}


function updateLabels() {

    xText.textContent =
        settings.x.toFixed(2);

    yText.textContent =
        settings.y.toFixed(2);

    zText.textContent =
        settings.z.toFixed(2);

    scaleText.textContent =
        settings.scale.toFixed(2);

    rxText.textContent =
        settings.rx.toFixed(0);

    ryText.textContent =
        settings.ry.toFixed(0);

    rzText.textContent =
        settings.rz.toFixed(0);

    fitText.textContent =
        settings.fit.toFixed(2);

}


function connectSlider(
    slider,
    property
) {

    slider.addEventListener(
        "input",
        function () {

            settings[property] =
                Number(
                    slider.value
                );

            updateLabels();

            applySettings();

        }
    );

}


connectSlider(
    xSlider,
    "x"
);

connectSlider(
    ySlider,
    "y"
);

connectSlider(

    "z"
);

connectSlider(

);

connectSlider(

    "rx"
);

connectSlider(
    rySlider,
    "ry"
);

connectSlider(
    rzSlider,
    "rz"
);

connectSlider(
    fitSlider,
    "fit"
);


function removeLoadedModel() {

    if (
        !loadedModel
    ) {

        return;

    }


    modelRoot.remove(
        loadedModel
    );


    loadedModel.traverse(
        function (
            child
        ) {

            if (
                child.geometry
            ) {

                child.geometry.dispose();

            }


            if (
                child.material
            ) {

                if (
                    Array.isArray(
                        child.material
                    )
                ) {

                    child.material.forEach(
                        function (
                            material
                        ) {

                            material.dispose();

                        }
                    );

                } else {

                    child.material.dispose();

                }

            }

        }
    );


    loadedModel =
        null;

}


function prepareModel(
    object
) {

    const box =
        new THREE.Box3();


    box.setFromObject(
        object
    );


    const center =
        new THREE.Vector3();


    const size =
        new THREE.Vector3();


    box.getCenter(
        center
    );

    box.getSize(
        size
    );


    object.position.sub(
        center
    );


    const largest =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if (
        largest > 0
    ) {

        object.scale.setScalar(
            1 /
            largest
        );

    }


    object.traverse(
        function (
            child
        ) {

            if (
                child.isMesh
            ) {

                child.frustumCulled =
                    false;

                child.castShadow =
                    false;

                child.receiveShadow =
                    false;

                if (
                    child.material
                ) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material.forEach(
                            function (
                                material
                            ) {

                                material.side =
                                    THREE.DoubleSide;

                            }
                        );

                    } else {

                        child.material.side =
                            THREE.DoubleSide;

                    }

                }

            }

        }
    );

}


function loadModel(
    file
) {

    if (
        !file
    ) {

        return;

    }


    setStatus(
        "LOADING GLB..."
    );


    const reader =
        new FileReader();


    reader.onload =
        function (
            event
        ) {

            loader.parse(

                event.target.result,

                "",

                function (
                    gltf
                ) {

                    removeLoadedModel();


                    loadedModel =
                        gltf.scene;


                    prepareModel(
                        loadedModel
                    );


                    modelRoot.add(
                        loadedModel
                    );


                    applySettings();


                    setStatus(
                        "MODEL LOADED"
                    );

                    setFaceInfo(
                        "3D model follows the head"
                    );

                },

                function (
                    error
                ) {

                    console.error(
                        error
                    );

                    setStatus(
                        "MODEL ERROR"
                    );

                    setFaceInfo(
                        "GLB could not be loaded"
                    );

                }

            );

        };


    reader.onerror =
        function () {

            setStatus(
                "FILE ERROR"
            );

        };


    reader.readAsArrayBuffer(
        file
    );

}


function resetSettings() {

    settings.x =
        0;

    settings.y =
        0;

    settings.z =
        0;

    settings.scale =
        1;

    settings.rx =
        0;

    settings.ry =
        0;

    settings.rz =
        0;

    settings.fit =
        1;


    xSlider.value =
        0;

    ySlider.value =
        0;

    zSlider.value =
        0;

    scaleSlider.value =
        1;

    rxSlider.value =
        0;

    rySlider.value =
        0;

    rzSlider.value =
        0;

    fitSlider.value =
        1;


    updateLabels();

    applySettings();


    setStatus(
        "RESET"
    );

}


updateLabels();async function startCamera() {

    if (
        started
    ) {

        setStatus(
            "CAMERA ALREADY ON"
        );

        return;

    }


    try {

        setStatus(
            "STARTING CAMERA..."
        );


        await mindarThree.start();


        started =
            true;


        renderer.setAnimationLoop(
            function () {

                updateFaceData();

                renderer.render(
                    scene,
                    camera
                );

            }
        );


        applyMirror();


        startButton.textContent =
            "CAMERA ON";


        setStatus(
            "CAMERA ON"
        );


        setFaceInfo(
            "Move your head"
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(
            "CAMERA ERROR"
        );


        setFaceInfo(
            error.message ||
            "Camera permission failed"
        );

    }

}


function updateFaceData() {

    if (
        !started
    ) {

        return;

    }


    const estimate =
        mindarThree.getLatestEstimate();


    if (
        estimate &&
        estimate.blendshapes &&
        estimate.blendshapes.categories
    ) {

        const categories =
            estimate.blendshapes.categories;


        let active =
            null;

        let highest =
            0;


        for (
            let i = 0;
            i < categories.length;
            i++
        ) {

            const score =
                Number(
                    categories[i].score
                );


            if (
                score > highest
            ) {

                highest =
                    score;

                active =
                    categories[i].categoryName;

            }

        }


        if (
            active &&
            highest > 0.35
        ) {

            setBlendInfo(
                "Expression: " +
                active +
                " " +
                highest.toFixed(2)
            );

        } else {

            setBlendInfo(
                "Expressions: tracking"
            );

        }

    }

}


async function switchCamera() {

    if (
        !started
    ) {

        setStatus(
            "START CAMERA FIRST"
        );

        return;

    }


    try {

        setStatus(
            "SWITCHING CAMERA..."
        );


        await mindarThree.switchCamera();


        setTimeout(
            function () {

                applyMirror();

                setStatus(
                    "CAMERA SWITCHED"
                );

            },
            300
        );


    } catch (
        error
    ) {

        console.error(
            error
        );

        setStatus(
            "SWITCH ERROR"
        );

    }

}


function applyMirror() {

    const video =
        arContainer.querySelector(
            "video"
        );


    const canvas =
        arContainer.querySelector(
            "canvas"
        );


    const transform =
        mirrorEnabled
            ? "scaleX(-1)"
            : "scaleX(1)";


    if (
        video
    ) {

        video.style.transform =
            transform;

    }


    if (
        canvas
    ) {

        canvas.style.transform =
            transform;

    }


    mirrorButton.textContent =
        mirrorEnabled
            ? "MIRROR: ON"
            : "MIRROR: OFF";

}


function toggleTracking() {

    trackingVisible =
        !trackingVisible;


    if (
        faceMesh
    ) {

        faceMesh.visible =
            trackingVisible;

    }


    if (
        modelRoot
    ) {

        modelRoot.visible =
            trackingVisible;

    }


    trackingButton.textContent =
        trackingVisible
            ? "TRACKING: ON"
            : "TRACKING: OFF";

}


function exportSettings() {

    const data =
        JSON.stringify(
            {
                x:
                    settings.x,

                y:
                    settings.y,

                z:
                    settings.z,

                scale:
                    settings.scale,

                rx:
                    settings.rx,

                ry:
                    settings.ry,

                rz:
                    settings.rz,

                fit:
                    settings.fit,

                mirror:
                    mirrorEnabled
            },
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        "azeez-ar-settings.json";


    document.body.appendChild(
        link
    );

    link.click();

    link.remove();


    setTimeout(
        function () {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    setStatus(
        "SETTINGS EXPORTED"
    );

}


function importSettings(
    file
) {

    if (
        !file
    ) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function (
            event
        ) {

            try {

                const data =
                    JSON.parse(
                        event.target.result
                    );


                const values = [
                    "x",
                    "y",
                    "z",
                    "scale",
                    "rx",
                    "ry",
                    "rz",
                    "fit"
                ];


                values.forEach(
                    function (
                        key
                    ) {

                        if (
                            typeof data[key] ===
                            "number"
                        ) {

                            settings[key] =
                                data[key];

                        }

                    }
                );


                if (
                    typeof data.mirror ===
                    "boolean"
                ) {

                    mirrorEnabled =
                        data.mirror;

                }


                xSlider.value =
                    settings.x;

                ySlider.value =
                    settings.y;

                zSlider.value =
                    settings.z;

                scaleSlider.value =
                    settings.scale;

                rxSlider.value =
                    settings.rx;

                rySlider.value =
                    settings.ry;

                rzSlider.value =
                    settings.rz;

                fitSlider.value =
                    settings.fit;


                updateLabels();

                applySettings();

                applyMirror();


                setStatus(
                    "SETTINGS IMPORTED"
                );


            } catch (
                error
            ) {

                console.error(
                    error
                );

                setStatus(
                    "INVALID SETTINGS"
                );

            }

        };


    reader.readAsText(
        file
    );

}


function getRecordingSource() {

    const video =
        arContainer.querySelector(
            "video"
        );

    const sourceCanvas =
        arContainer.querySelector(
            "canvas"
        );


    if (
        !video ||
        !sourceCanvas
    ) {

        return null;

    }


    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        sourceCanvas.width;

    output.height =
        sourceCanvas.height;


    const context =
        output.getContext(
            "2d"
        );


    function drawFrame() {

        if (
            !recording
        ) {

            return;

        }


        context.save();


        if (
            mirrorEnabled
        ) {

            context.translate(
                output.width,
                0
            );

            context.scale(
                -1,
                1
            );

        }


        context.drawImage(
            video,
            0,
            0,
            output.width,
            output.height
        );


        context.restore();


        context.drawImage(
            sourceCanvas,
            0,
            0,
            output.width,
            output.height
        );


        requestAnimationFrame(
            drawFrame
        );

    }


    drawFrame();


    return output;

}


function startRecording() {

    if (
        !started
    ) {

        setStatus(
            "START CAMERA FIRST"
        );

        return;

    }


    const source =
        getRecordingSource();


    if (
        !source
    ) {

        setStatus(
            "RECORDING UNAVAILABLE"
        );

        return;

    }


    recordingChunks =
        [];


    let type =
        "video/webm";


    if (
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ) {

        type =
            "video/webm;codecs=vp9";

    }


    try {

        mediaRecorder =
            new MediaRecorder(
                source.captureStream(
                    30
                ),
                {
                    mimeType:
                        type
                }
            );


    } catch (
        error
    ) {

        console.error(
            error
        );

        setStatus(
            "RECORDER ERROR"
        );

        return;

    }


    mediaRecorder.ondataavailable =
        function (
            event
        ) {

            if (
                event.data &&
                event.data.size
            ) {

                recordingChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        function () {

            const blob =
                new Blob(
                    recordingChunks,
                    {
                        type:
                            "video/webm"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                "azeez-ar-recording.webm";


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            setTimeout(
                function () {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            setStatus(
                "VIDEO SAVED"
            );

        };


    mediaRecorder.start();


    recording =
        true;


    recordButton.textContent =
        "STOP RECORDING";


    recordButton.classList.add(
        "red"
    );


    setStatus(
        "RECORDING..."
    );

}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        mediaRecorder.stop();

    }


    recording =
        false;


    recordButton.textContent =
        "START RECORDING";


    recordButton.classList.remove(
        "red"
    );

}


startButton.addEventListener(
    "click",
    function () {

        startCamera();

    }
);


switchButton.addEventListener(
    "click",
    function () {

        switchCamera();

    }
);


mirrorButton.addEventListener(
    "click",
    function () {

        mirrorEnabled =
            !mirrorEnabled;

        applyMirror();

    }
);


trackingButton.addEventListener(
    "click",
    function () {

        toggleTracking();

    }
);


importModelButton.addEventListener(
    "click",
    function () {

        modelInput.click();

    }
);


modelInput.addEventListener(
    "change",
    function (
        event
    ) {

        const file =
            event.target.files[0];


        if (
            file
        ) {

            loadModel(
                file
            );

        }

    }
);


resetButton.addEventListener(
    "click",
    function () {

        resetSettings();

    }
);


recordButton.addEventListener(
    "click",
    function () {

        if (
            recording
        ) {

            stopRecording();

        } else {

            startRecording();

        }

    }
);


exportButton.addEventListener(
    "click",
    function () {

        exportSettings();

    }
);


importSettingsButton.addEventListener(
    "click",
    function () {

        settingsInput.click();

    }
);


settingsInput.addEventListener(
    "change",
    function (
        event
    ) {

        const file =
            event.target.files[0];


        if (
            file
        ) {

            importSettings(
                file
            );

        }

    }
);


window.addEventListener(
    "resize",
    function () {

        if (
            renderer
        ) {

            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                )
            );

        }

    }
);


window.addEventListener(
    "beforeunload",
    function () {

        try {

            if (
                mindarThree &&
                started
            ) {

                mindarThree.stop();

            }

        } catch (
            error
        ) {

            console.error(
                error
            );

        }

    }
);


setStatus(
    "READY"
);

setFaceInfo(
    "Press START CAMERA"
);

setBlendInfo(
    "Expressions: ready"
);

</script>
