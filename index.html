<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR - Face Detection</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#threeCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#status {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: white;
    background: rgba(0,0,0,.75);
    padding: 9px 14px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

#startButton {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    z-index: 20;
    padding: 15px 25px;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js?v=6"
  }
}
</script>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>

<div id="status">Ready</div>

<button id="startButton">OPEN CAMERA</button>

<script type="module">

import * as THREE from "three";

const video = document.getElementById("camera");
const canvas = document.getElementById("threeCanvas");
const status = document.getElementById("status");
const button = document.getElementById("startButton");

let faceLandmarker = null;
let lastVideoTime = -1;

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera3D.position.z = 5;

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

const light = new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(light);

const geometry = new THREE.BoxGeometry(
    0.7,
    0.7,
    0.7
);

const material = new THREE.MeshNormalMaterial();

const cube = new THREE.Mesh(
    geometry,
    material
);

scene.add(cube);

function animate() {

    requestAnimationFrame(animate);

    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;

    renderer.render(
        scene,
        camera3D
    );
}

animate();

async function openCamera() {

    try {

        status.textContent =
            "Opening camera...";

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user"
                },
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        button.style.display = "none";

        status.textContent =
            "Camera OK - Loading MediaPipe...";

        await loadMediaPipe();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Camera error: " + error.name;
    }
}

async function loadMediaPipe() {

    try {

        const mediaPipe =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
            );

        const FaceLandmarker =
            mediaPipe.FaceLandmarker;

        const FilesetResolver =
            mediaPipe.FilesetResolver;

        status.textContent =
            "MediaPipe library loaded";

        const vision =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
            );

        status.textContent =
            "Loading face model...";

        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                vision,
                {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                        delegate: "GPU"
                    },

                    runningMode: "VIDEO",

                    numFaces: 1,

                    outputFaceBlendshapes: false,

                    outputFacialTransformationMatrixes: true
                }
            );

        status.textContent =
            "Face model loaded";

        requestAnimationFrame(
            detectFace
        );

    } catch (error) {

        console.error(error);

        status.textContent =
            "Face model error";
    }
}

function detectFace() {

    if (
        faceLandmarker &&
        video.readyState >= 2
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;

            try {

                const result =
                    faceLandmarker.detectForVideo(
                        video,
                        performance.now()
                    );

                if (
                    result.faceLandmarks &&
                    result.faceLandmarks.length > 0
                ) {

                    status.textContent =
                        "FACE DETECTED";

                } else {

                    status.textContent =
                        "Looking for face...";
                }

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Detection error";
            }
        }
    }

    requestAnimationFrame(
        detectFace
    );
}

button.addEventListener(
    "click",
    openCamera
);

window.addEventListener(
    "resize",
    () => {

        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;

        camera3D.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
