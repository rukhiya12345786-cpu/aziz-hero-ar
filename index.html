
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

#container video {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 1 !important;
}

#container canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
}

#topbar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

#brand, #status {
  color: white;
  background: #000b;
  padding: 10px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: bold;
}

#controls {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: 12px;
  z-index: 30;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
}

button {
  background: #202020ee;
  color: white;
  border: 1px solid #555;
  border-radius: 9px;
  padding: 11px 12px;
  font-size: 12px;
  font-weight: bold;
}

button.active {
  background: #075fc5;
}

button:disabled {
  opacity: .45;
}

#message {
  position: fixed;
  z-index: 25;
  bottom: 92px;
  left: 10px;
  right: 10px;
  padding: 9px;
  background: #0009;
  color: white;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}

#fileInput {
  display: none;
}

#transformPanel {
  position: fixed;
  top: 62px;
  right: 10px;
  z-index: 35;
  display: flex;
  flex-direction: column;
  gap: 7px;
  width: 125px;
}

#transformPanel button {
  width: 100%;
}

#container.gizmo-hidden canvas {
  pointer-events: none;
}

#controls.hidden,
#transformPanel.hidden {
  display: none;
}

@media (orientation: landscape) {
  #controls {
    left: auto;
    right: 10px;
    bottom: 10px;
    width: 180px;
  }

  #controls button {
    flex: 1 1 75px;
  }

  #message {
    bottom: 10px;
    left: 10px;
    right: 200px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<div id="topbar">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="message">Press START CAMERA and allow camera permission.</div>

<div id="transformPanel">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
  <button id="scaleBtn">SCALE</button>
  <button id="hideGizmoBtn">HIDE GIZMO</button>
</div>

<div id="controls">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="importBtn">IMPORT 3D</button>
  <button id="disposeBtn">DISPOSE MODEL</button>
  <button id="hideControlsBtn">HIDE CONTROLS</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<input
  id="fileInput"
  type="file"
  accept=".glb,.gltf,.obj,.fbx"
>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");
const fileInput = document.querySelector("#fileInput");

const startBtn = document.querySelector("#startBtn");
const switchBtn = document.querySelector("#switchBtn");
const stopBtn = document.querySelector("#stopBtn");

let mindarThree = null;
let anchor = null;
let avatar = null;
let importedModel = null;
let transformControls = null;
let running = false;
let starting = false;
let gizmoVisible = true;
let controlsVisible = true;
let currentMode = "translate";

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const url =
      "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";

    const loader = new GLTFLoader();

    this.gltf = await new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });

    this.gltf.scene.traverse((object) => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }
    });
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes || !blendshapes.categories) return;

    const values = new Map();

    for (const item of blendshapes.categories) {
      values.set(item.categoryName, item.score);
    }

    for (const mesh of this.morphTargetMeshes) {
      const dictionary = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      for (const [name, value] of values) {
        const index = dictionary[name];

        if (index !== undefined) {
          influences[index] = value;
        }
      }
    }
  }
}

function setStatus(text) {
  statusBox.textContent = text;
}

function setMessage(text) {
  messageBox.textContent = text;
}

async function startCamera() {
  if (starting || running) return;

  starting = true;
  startBtn.disabled = true;
  setStatus("Starting...");
  setMessage("Loading face tracking. Please wait.");

  try {
    mindarThree = new MindARThree({
      container,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5)
    );

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 2);
    scene.add(light);

    anchor = mindarThree.addAnchor(1);

    if (!avatar) {
      avatar = new Avatar();
      await avatar.init();
    }

    avatar.gltf.scene.scale.set(2, 2, 2);
    anchor.group.add(avatar.gltf.scene);

    transformControls = new TransformControls(
      camera,
      renderer.domElement
    );

    transformControls.setMode(currentMode);
    transformControls.setSize(0.8);
    transformControls.enabled = false;

    scene.add(transformControls);

    await mindarThree.start();

    running = true;
    setStatus("Camera running");
    setMessage("Face tracking active.");

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();

      if (estimate && estimate.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);
    });

    attachGizmo(avatar.gltf.scene);

  } catch (error) {
    console.error(error);
    setStatus("Start error");
    setMessage(error.message || "Camera could not start.");

    if (mindarThree) {
      try {
        mindarThree.renderer?.setAnimationLoop(null);
        await mindarThree.stop();
      } catch (e) {}
    }

    mindarThree = null;
    running = false;

  } finally {
    starting = false;
    startBtn.disabled = false;
  }
}

function attachGizmo(object) {
  if (!transformControls || !object) return;

  transformControls.attach(object);
  transformControls.enabled = gizmoVisible;
  transformControls.visible = gizmoVisible;
}

async function stopCamera() {
  if (!mindarThree) return;

  try {
    transformControls?.detach();
    transformControls?.dispose();

    mindarThree.renderer?.setAnimationLoop(null);
    await mindarThree.stop();
  } catch (error) {
    console.error(error);
  }

  mindarThree = null;
  transformControls = null;
  anchor = null;
  running = false;

  container.innerHTML = "";

  setStatus("Camera stopped");
  setMessage("Press START CAMERA to begin.");
}

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);

switchBtn.addEventListener("click", async () => {
  if (!running || !mindarThree) {
    setMessage("Start the camera first.");
    return;
  }

  try {
    setMessage("Switching camera...");
    await mindarThree.switchCamera();
    setMessage("Camera switched.");
  } catch (error) {
    console.error(error);
    setMessage("Camera switch failed: " + error.message);
  }
});

document.querySelector("#moveBtn").addEventListener("click", () => {
  currentMode = "translate";
  transformControls?.setMode("translate");
  setActiveMode("moveBtn");
});

document.querySelector("#rotateBtn").addEventListener("click", () => {
  currentMode = "rotate";
  transformControls?.setMode("rotate");
  setActiveMode("rotateBtn");
});

document.querySelector("#scaleBtn").addEventListener("click", () => {
  currentMode = "scale";
  transformControls?.setMode("scale");
  setActiveMode("scaleBtn");
});

function setActiveMode(id) {
  ["moveBtn", "rotateBtn", "scaleBtn"].forEach((buttonId) => {
    document.getElementById(buttonId).classList.toggle(
      "active",
      buttonId === id
    );
  });
}

document.querySelector("#hideGizmoBtn").addEventListener("click", () => {
  gizmoVisible = !gizmoVisible;

  if (transformControls) {
    transformControls.enabled = gizmoVisible;
    transformControls.visible = gizmoVisible;
  }

  document.querySelector("#hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

document.querySelector("#hideControlsBtn").addEventListener("click", () => {
  controlsVisible = !controlsVisible;
  document.querySelector("#controls").classList.toggle(
    "hidden",
    !controlsVisible
  );

  document.querySelector("#hideControlsBtn").textContent =
    controlsVisible ? "HIDE CONTROLS" : "SHOW CONTROLS";
});

document.querySelector("#importBtn").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async (event) => {
  const file = event.target.files[0];

  if (!file) return;

  if (!running || !anchor) {
    setMessage("Start the camera before importing a model.");
    fileInput.value = "";
    return;
  }

  setMessage("Loading 3D model...");

  const extension = file.name.split(".").pop().toLowerCase();
  const objectURL = URL.createObjectURL(file);

  try {
    let model = null;

    if (extension === "glb" || extension === "gltf") {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(objectURL);
      model = gltf.scene;
    } else if (extension === "obj") {
      const loader = new OBJLoader();
      model = await loader.loadAsync(objectURL);
    } else if (extension === "fbx") {
      const loader = new FBXLoader();
      model = await loader.loadAsync(objectURL);
    } else {
      throw new Error("Unsupported model format.");
    }

    if (importedModel) {
      removeModel(importedModel);
    }

    if (avatar?.gltf?.scene) {
      avatar.gltf.scene.visible = false;
    }

    importedModel = model;
    anchor.add(importedModel);

    importedModel.position.set(0, 0, 0);
    importedModel.rotation.set(0, 0, 0);
    importedModel.scale.set(1, 1, 1);

    attachGizmo(importedModel);

    setMessage("3D model imported. Use Move, Rotate and Scale.");

  } catch (error) {
    console.error(error);
    setMessage("Import error: " + error.message);
  } finally {
    URL.revokeObjectURL(objectURL);
    fileInput.value = "";
  }
});

function removeModel(object) {
  if (!object) return;

  transformControls?.detach();

  object.traverse((child) => {
    if (child.geometry) {
      child.geometry.dispose();
    }

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach((material) => {
        for (const key in material) {
          const value = material[key];
          if (value && value.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });

  object.removeFromParent();
}

document.querySelector("#disposeBtn").addEventListener("click", () => {
  if (!importedModel) {
    setMessage("No imported model to dispose.");
    return;
  }

  removeModel(importedModel);
  importedModel = null;

  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = true;
    attachGizmo(avatar.gltf.scene);
  }

  setMessage("Imported model removed.");
});

document.querySelector("#fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen is not available.");
  }
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
  } catch (error) {}
});

</script>
</body>
</html>
