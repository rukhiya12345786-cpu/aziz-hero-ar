<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>3D Face AR Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#video{
    display:none;
}

#buttons{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    z-index:10;

    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-size:14px;
    font-weight:bold;
}

#start{
    background:white;
}

#rec{
    background:red;
    color:white;
}

#stop{
    background:#333;
    color:white;
}

#status{
    position:fixed;
    left:15px;
    right:15px;
    bottom:15px;

    z-index:10;

    padding:10px;

    border-radius:10px;

    background:rgba(0,0,0,.7);
    color:white;

    text-align:center;
    font-size:13px;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       muted
       playsinline></video>

<canvas id="screen"></canvas>

<div id="buttons">
    <button id="start">START CAMERA</button>
    <button id="rec">● REC</button>
    <button id="stop">■ STOP</button>
</div>

<div id="status">Ready</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("screen");

const status =
document.getElementById("status");

const startButton =
document.getElementById("start");

const recButton =
document.getElementById("rec");

const stopButton =
document.getElementById("stop");


/* =========================
   THREE
========================= */

const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    alpha:false
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
);


const scene =
new THREE.Scene();


const camera =
new THREE.PerspectiveCamera(
    50,
    window.innerWidth /
    window.innerHeight,
    0.01,
    100
);

camera.position.z = 4;


/* =========================
   3D OBJECT
========================= */

const geometry =
new THREE.BoxGeometry(
    1,
    1,
    1
);

const material =
new THREE.MeshNormalMaterial();

const cube =
new THREE.Mesh(
    geometry,
    material
);

cube.position.set(
    0,
    0,
    0
);

scene.add(cube);


/* =========================
   LIGHT
========================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


/* =========================
   CAMERA
========================= */

let cameraStream = null;

async function startCamera(){

    try{

        status.textContent =
        "Opening camera...";

        cameraStream =
        await navigator.mediaDevices
        .getUserMedia({
            video:{
                facingMode:"user",
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },
            audio:false
        });

        video.srcObject =
        cameraStream;

        await video.play();

        status.textContent =
        "Camera ON + 3D ON";

    }catch(error){

        console.error(error);

        status.textContent =
        "CAMERA ERROR: " +
        error.name;

        alert(
            "Camera open nahi hua.\n\n" +
            error.name +
            "\n\n" +
            error.message
        );
    }
}


/* =========================
   DRAW CAMERA
========================= */

function draw(){

    requestAnimationFrame(draw);


    /*
       Camera background
    */

    if(
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        const ctx =
        canvas.getContext("2d");

        const cw =
        canvas.width;

        const ch =
        canvas.height;

        const vw =
        video.videoWidth;

        const vh =
        video.videoHeight;


        const scale =
        Math.max(
            cw / vw,
            ch / vh
        );


        const drawW =
        vw * scale;

        const drawH =
        vh * scale;


        const x =
        (cw - drawW) / 2;

        const y =
        (ch - drawH) / 2;


        /*
           Front-camera mirror
        */

        ctx.save();

        ctx.translate(cw,0);

        ctx.scale(-1,1);

        ctx.drawImage(
            video,
            0,
            0,
            vw,
            vh,
            cw - x - drawW,
            y,
            drawW,
            drawH
        );

        ctx.restore();
    }


    /*
       3D render
    */

    cube.rotation.x += 0.01;

    cube.rotation.y += 0.015;


    renderer.render(
        scene,
        camera
    );
}


draw();


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

});


/* =========================
   START
========================= */

startButton.onclick =
startCamera;


/* =========================
   RECORD FINAL CANVAS
========================= */

let recorder = null;
let chunks = [];


recButton.onclick = ()=>{

    if(
        !cameraStream ||
        video.readyState < 2
    ){

        alert(
            "Pehle START CAMERA dabao."
        );

        return;
    }


    chunks = [];


    /*
       IMPORTANT:

       We record the FINAL canvas,
       not the raw camera.

       Therefore:
       CAMERA
       +
       3D
       =
       recorded video
    */

    const stream =
    canvas.captureStream(30);


    let mime =
    "video/webm";


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ){

        mime =
        "video/webm;codecs=vp9";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8"
        )
    ){

        mime =
        "video/webm;codecs=vp8";
    }


    recorder =
    new MediaRecorder(
        stream,
        {
            mimeType:mime
        }
    );


    recorder.ondataavailable =
    event=>{

        if(event.data.size > 0){

            chunks.push(
                event.data
            );
        }
    };


    recorder.onstop =
    ()=>{

        const blob =
        new Blob(
            chunks,
            {
                type:mime
            }
        );


        const url =
        URL.createObjectURL(blob);


        const a =
        document.createElement("a");

        a.href = url;

        a.download =
        "AR-3D-Recording.webm";

        a.click();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            2000
        );


        status.textContent =
        "Recording saved";
    };


    recorder.start();

    status.textContent =
    "🔴 RECORDING CAMERA + 3D";
};


/* =========================
   STOP
========================= */

stopButton.onclick =
()=>{

    if(
        recorder &&
        recorder.state ===
        "recording"
    ){

        recorder.stop();

        status.textContent =
        "Saving video...";
    }

};

</script>

</body>
</html>
