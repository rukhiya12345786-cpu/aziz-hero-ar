<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera Left Right Test</title>

<style>

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;
}

#camera{

    display:none;
}

#screen{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

#three{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

#info{

    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:10;

    padding:10px 16px;

    background:rgba(0,0,0,0.75);

    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;

    font-size:16px;

    text-align:center;
}

#open{

    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

</style>

</head>


<body>


<!-- REAL CAMERA -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- CAMERA DISPLAY CANVAS -->

<canvas id="screen"></canvas>


<!-- THREE.JS -->

<canvas id="three"></canvas>


<div id="info">
CAMERA TEST
</div>


<button id="open">
OPEN CAMERA
</button>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


const video =
document.getElementById("camera");


const screen =
document.getElementById("screen");


const ctx =
screen.getContext("2d");


const canvas3D =
document.getElementById("three");


const button =
document.getElementById("open");


const info =
document.getElementById("info");



/* =================================
   THREE.JS
================================= */


const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.1,

    100

);


camera3D.position.z = 4;



const renderer =
new THREE.WebGLRenderer({

    canvas:canvas3D,

    alpha:true,

    antialias:true

});


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);



/* LIGHT */

const light =
new THREE.DirectionalLight(

    0xffffff,
    3

);

light.position.set(

    2,
    3,
    5

);

scene.add(light);


const ambient =
new THREE.AmbientLight(

    0xffffff,
    2

);

scene.add(ambient);



/* =================================
   SMALL CUBE
================================= */


const geometry =
new THREE.BoxGeometry(

    0.65,
    0.65,
    0.65

);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(

    geometry,
    material

);


cube.position.set(

    0,
    0,
    0

);


scene.add(cube);



/* =================================
   3D ANIMATION
================================= */


function animate(){

    requestAnimationFrame(
        animate
    );


    cube.rotation.x +=
    0.01;


    cube.rotation.y +=
    0.015;


    renderer.render(

        scene,
        camera3D

    );

}


animate();



/* =================================
   CAMERA
================================= */


let cameraStream = null;


button.onclick =
async function(){

    try{

        info.innerText =
        "OPENING CAMERA...";


        cameraStream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        cameraStream;


        await video.play();


        button.style.display =
        "none";


        info.innerText =
        "CAMERA + SMALL 3D ON";


        drawCamera();


    }

    catch(error){

        info.innerText =
        "CAMERA ERROR";


        alert(

            "CAMERA ERROR\n\n" +

            error.name +

            "\n\n" +

            error.message

        );

    }

};



/* =================================
   CAMERA → CANVAS
   UNMIRROR HERE
================================= */


function drawCamera(){

    if(

        video.readyState >=
        video.HAVE_CURRENT_DATA

    ){

        const vw =
        video.videoWidth;

        const vh =
        video.videoHeight;


        if(vw && vh){

            const sw =
            screen.width =
            window.innerWidth *
            window.devicePixelRatio;


            const sh =
            screen.height =
            window.innerHeight *
            window.devicePixelRatio;


            /*
            Clear screen
            */

            ctx.clearRect(

                0,
                0,
                sw,
                sh

            );


            /*
            IMPORTANT

            Flip the camera image
            horizontally.

            This is the actual
            left/right correction.
            */


            ctx.save();


            ctx.translate(
                sw,
                0
            );


            ctx.scale(
                -1,
                1
            );


            /*
            COVER calculation
            */

            const scale =
            Math.max(

                sw / vw,
                sh / vh

            );


            const drawW =
            vw * scale;


            const drawH =
            vh * scale;


            const x =
            (sw - drawW) / 2;


            const y =
            (sh - drawH) / 2;


            ctx.drawImage(

                video,

                x,
                y,
                drawW,
                drawH

            );


            ctx.restore();

        }

    }


    requestAnimationFrame(
        drawCamera
    );

}



/* =================================
   RESIZE
================================= */


window.addEventListener(

    "resize",

    function(){

        camera3D.aspect =

        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


</script>


</body>

</html>
