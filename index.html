<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azeez AR Head Tracker</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#camera, #threeCanvas, #landmarkCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: center center;
}

#camera {
  z-index: 1;
  object-fit: cover;
}

#threeCanvas {
  z-index: 2;
  pointer-events: none;
}

#landmarkCanvas {
  z-index: 3;
  pointer-events: none;
}

#ui {
  position: fixed;
  z-index: 10;
  top: 12px;
  left: 12px;
  right: 12px;
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  padding-bottom: 20px;
}

#status {
  display: inline-block;
  color: #00ff00;
  background: rgba(0,0,0,.85);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
}

button {
  display: block;
  width: 220px;
  max-width: 100%;
  margin-top: 8px;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  color: #000;
  background: #fff;
}

#startButton { background: #00ff00; }
#switchCameraButton { background: #168cff; color: #fff; }
#mirrorButton { background: #ff9900; }
#recordButton { background: #ff1744; color: #fff; }
#modelButton { background: #fff; }
#fitButton { background: #9b59ff; color: #fff; }
#resetButton { background: #ffcc00; }
#importSettingsButton { background: #00b894; }
#exportSettingsButton { background: #6c5ce7; color: #fff; }

#modelInput, #settingsInput {
  display: none;
}

#controls {
  display: none;
  margin-top: 10px;
  padding: 12px;
  width: 300px;
  max-width: 100%;
  background: rgba(0,0,0,.82);
  border-radius: 10px;
  color: #fff;
}

.control {
  margin-top: 10px;
}

.control label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 4px;
}

.control output {
  color: #00ff00;
}

input[type="range"] {
  width: 100%;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="threeCanvas"></canvas>
<canvas id="landmarkCanvas"></canvas>

<div id="ui">
  <div id="status">READY</div>

  <button id="startButton">START CAMERA</button>
  <button id="switchCameraButton">SWITCH CAMERA</button>
  <button id="mirrorButton">MIRROR FLIP: OFF</button>
  <button id="recordButton">START RECORDING</button>
  <button id="modelButton">IMPORT GLB MODEL</button>
  <button id="importSettingsButton">IMPORT SETTINGS</button>
  <button id="exportSettingsButton">EXPORT SETTINGS</button>

  <input id="modelInput" type="file" accept=".glb">
  <input id="settingsInput" type="file" accept=".json">

  <div id="controls">
    <strong>MODEL ADJUSTMENT</strong>

    <button id="fitButton">HEAD FIT MODE</button>

    <div class="control">
      <label><span>X Position</span><output id="xValue">0</output></label>
      <input id="xSlider" type="range" min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="control">
      <label><span>Y Position</span><output id="yValue">0</output></label>
      <input id="ySlider" type="range" min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="control">
      <label><span>Z Position</span><output id="zValue">0</output></label>
      <input id="zSlider" type="range" min="-3" max="3" step="0.01" value="0">
    </div>

    <div class="control">
      <label><span>Scale</span><output id="scaleValue">1</output></label>
      <input id="scaleSlider" type="range" min="0.1" max="3" step="0.01" value="1">
    </div>

    <div class="control">
      <label><span>Rotate X</span><output id="rotXValue">0°</output></label>
      <input id="rotXSlider" type="range" min="-360" max="360" step="1" value="0">
    </div>

    <div class="control">
      <label><span>Rotate Y</span><output id="rotYValue">0°</output></label>
      <input id="rotYSlider" type="range" min="-360" max="360" step="1" value="0">
    </div>

    <div class="control">
      <label><span>Rotate Z</span><output id="rotZValue">0°</output></label>
      <input id="rotZSlider" type="range" min="-360" max="360" step="1" value="0">
    </div>

    <button id="resetButton">RESET MODEL</button>
  </div>
</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const video = document.getElementById("camera");
const threeCanvas = document.getElementById("threeCanvas");
const landmarkCanvas = document.getElementById("landmarkCanvas");
const status = document.getElementById("status");

const startButton = document.getElementById("startButton");
const switchCameraButton = document.getElementById("switchCameraButton");
const mirrorButton = document.getElementById("mirrorButton");
const recordButton = document.getElementById("recordButton");
const modelButton = document.getElementById("modelButton");
const importSettingsButton = document.getElementById("importSettingsButton");
const exportSettingsButton = document.getElementById("exportSettingsButton");
const fitButton = document.getElementById("fitButton");
const resetButton = document.getElementById("resetButton");

const modelInput = document.getElementById("modelInput");
const settingsInput = document.getElementById("settingsInput");
const controls = document.getElementById("controls");

const xSlider = document.getElementById("xSlider");
const ySlider = document.getElementById("ySlider");
const zSlider = document.getElementById("zSlider");
const scaleSlider = document.getElementById("scaleSlider");
const rotXSlider = document.getElementById("rotXSlider");
const rotYSlider = document.getElementById("rotYSlider");
const rotZSlider = document.getElementById("rotZSlider");

const xValue = document.getElementById("xValue");
const yValue = document.getElementById("yValue");
const zValue = document.getElementById("zValue");
const scaleValue = document.getElementById("scaleValue");
const rotXValue = document.getElementById("rotXValue");
const rotYValue = document.getElementById("rotYValue");
const rotZValue = document.getElementById("rotZValue");

let currentStream = null;
let currentFacingMode = "user";
let mirrorEnabled = false;
let faceLandmarker = null;
let trackingStarted = false;
let loadedModel = null;
let headFitEnabled = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordingAnimationId = null;

const renderer = new THREE.WebGLRenderer({
  canvas: threeCanvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

const threeCamera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

threeCamera.position.set(0, 0, 5);

const anchor = new THREE.Group();
scene.add(anchor);

const modelPivot = new THREE.Group();
anchor.add(modelPivot);

const cube = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.45, 0.45),
  new THREE.MeshNormalMaterial({
    transparent: true,
    opacity: 0.65
  })
);

modelPivot.add(cube);

const gltfLoader = new GLTFLoader();

const modelSize = new THREE.Vector3();
const modelCenter = new THREE.Vector3();

function setStatus(message) {
  status.textContent = message;
}

async function startCamera() {
  try {
    setStatus("OPENING CAMERA...");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("CAMERA NOT AVAILABLE");
      return;
    }

    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    currentStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: currentFacingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = currentStream;
    await video.play();

    startButton.style.display = "none";
    setStatus("CAMERA READY");

    if (!faceLandmarker) {
      await loadFaceTracker();
    } else {
      trackingStarted = true;
      requestAnimationFrame(trackFace);
    }
  } catch (error) {
    console.error("Camera error:", error);
    setStatus("CAMERA ERROR: CHECK PERMISSION");
  }
}

async function switchCamera() {
  currentFacingMode =
    currentFacingMode === "user" ? "environment" : "user";

  await startCamera();
}

function updateMirror() {
  const transform = mirrorEnabled ? "scaleX(-1)" : "scaleX(1)";
  video.style.transform = transform;
  threeCanvas.style.transform = transform;
  landmarkCanvas.style.transform = transform;

  mirrorButton.textContent = mirrorEnabled
    ? "MIRROR FLIP: ON"
    : "MIRROR FLIP: OFF";
}

startButton.addEventListener("click", startCamera);
switchCameraButton.addEventListener("click", switchCamera);

mirrorButton.addEventListener("click", () => {
  mirrorEnabled = !mirrorEnabled;
  updateMirror();
});

modelButton.addEventListener("click", () => modelInput.click());
importSettingsButton.addEventListener("click", () => settingsInput.click());

async function loadFaceTracker() {
  try {
    setStatus("LOADING FACE TRACKER...");

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
    );

    const { FaceLandmarker, FilesetResolver } = vision;

    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
    );

    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: false,
      outputFacialTransformationMatrixes: true
    });

    trackingStarted = true;
    setStatus("FACE TRACKER READY");
    requestAnimationFrame(trackFace);
  } catch (error) {
    console.error("Face tracker error:", error);
    setStatus("TRACKER ERROR - CAMERA MAY STILL WORK");
  }
}

function drawLandmarks(landmarks) {
  const width = window.innerWidth;
  const height = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  landmarkCanvas.width = Math.round(width * dpr);
  landmarkCanvas.height = Math.round(height * dpr);

  const ctx = landmarkCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  for (const point of landmarks) {
    const x = point.x * width;
    const y = point.y * height;

    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,255,0,0.25)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#00ff00";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
  }
}

modelInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  setStatus("LOADING GLB...");

  try {
    const data = await file.arrayBuffer();

    gltfLoader.parse(data, "", gltf => {
      modelPivot.clear();
      loadedModel = gltf.scene;
      modelPivot.add(loadedModel);

      const box = new THREE.Box3().setFromObject(loadedModel);
      box.getCenter(modelCenter);
      box.getSize(modelSize);

      loadedModel.position.sub(modelCenter);
      modelCenter.set(0, 0, 0);

      cube.visible = false;
      controls.style.display = "block";

      applyModelSettings();
      setStatus("GLB MODEL LOADED");
    }, error => {
      console.error("GLB parse error:", error);
      setStatus("GLB LOAD ERROR");
    });
  } catch (error) {
    console.error(error);
    setStatus("MODEL IMPORT ERROR");
  }
});

function updateControlValues() {
  xValue.textContent = Number(xSlider.value).toFixed(2);
  yValue.textContent = Number(ySlider.value).toFixed(2);
  zValue.textContent = Number(zSlider.value).toFixed(2);
  scaleValue.textContent = Number(scaleSlider.value).toFixed(2);
  rotXValue.textContent = rotXSlider.value + "°";
  rotYValue.textContent = rotYSlider.value + "°";
  rotZValue.textContent = rotZSlider.value + "°";
}

function applyModelSettings() {
  modelPivot.position.set(
    Number(xSlider.value),
    Number(ySlider.value),
    Number(zSlider.value)
  );

  let finalScale = Number(scaleSlider.value);

  if (headFitEnabled) {
    const largest = Math.max(modelSize.x, modelSize.y, modelSize.z);
    if (largest > 0) finalScale /= largest;
  }

  modelPivot.scale.setScalar(finalScale);

  modelPivot.rotation.set(
    THREE.MathUtils.degToRad(Number(rotXSlider.value)),
    THREE.MathUtils.degToRad(Number(rotYSlider.value)),
    THREE.MathUtils.degToRad(Number(rotZSlider.value))
  );

  updateControlValues();
}

[
  xSlider, ySlider, zSlider, scaleSlider,
  rotXSlider, rotYSlider, rotZSlider
].forEach(slider => {
  slider.addEventListener("input", applyModelSettings);
});

fitButton.addEventListener("click", () => {
  headFitEnabled = !headFitEnabled;
  fitButton.textContent = headFitEnabled ? "HEAD FIT: ON" : "HEAD FIT MODE";
  applyModelSettings();
});

resetButton.addEventListener("click", () => {
  xSlider.value = 0;
  ySlider.value = 0;
  zSlider.value = 0;
  scaleSlider.value = 1;
  rotXSlider.value = 0;
  rotYSlider.value = 0;
  rotZSlider.value = 0;
  headFitEnabled = false;
  fitButton.textContent = "HEAD FIT MODE";
  applyModelSettings();
});

function updateHeadAnchor(landmarks, transformationMatrix) {
  const nose = landmarks[1];
  const leftEye = landmarks[33];
  const rightEye = landmarks[263];

  if (!nose || !leftEye || !rightEye) return;

  const eyeDistance = Math.hypot(
    rightEye.x - leftEye.x,
    rightEye.y - leftEye.y
  );

  anchor.position.x = (nose.x - 0.5) * 2.25;
  anchor.position.y = (0.5 - nose.y) * 1.7;
  anchor.position.z = -eyeDistance * 1.5;

  const headScale = THREE.MathUtils.clamp(eyeDistance * 5.2, 0.45, 2.2);
  anchor.scale.setScalar(headScale);

  if (transformationMatrix && transformationMatrix.data) {
    const matrix = new THREE.Matrix4();
    matrix.fromArray(transformationMatrix.data);

    const position = new THREE.Vector3();
    const quaternion = new THREE.Quaternion();
    const scale = new THREE.Vector3();

    matrix.decompose(position, quaternion, scale);

    const euler = new THREE.Euler();
    euler.setFromQuaternion(quaternion, "YXZ");
    anchor.rotation.copy(euler);
  }
}

function trackFace() {
  if (trackingStarted && faceLandmarker && video.readyState >= 2) {
    try {
      const result = faceLandmarker.detectForVideo(video, performance.now());

      if (result.faceLandmarks && result.faceLandmarks.length > 0) {
        drawLandmarks(result.faceLandmarks[0]);

        const matrix =
          result.facialTransformationMatrixes &&
          result.facialTransformationMatrixes.length
            ? result.facialTransformationMatrixes[0]
            : null;

        updateHeadAnchor(result.faceLandmarks[0], matrix);
        setStatus("FACE TRACKING");
      }
    } catch (error) {
      console.error("Tracking error:", error);
    }
  }

  renderer.render(scene, threeCamera);

  if (trackingStarted) {
    requestAnimationFrame(trackFace);
  }
}

function resizeScene() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  renderer.setSize(width, height);
  threeCamera.aspect = width / height;
  threeCamera.updateProjectionMatrix();
}

window.addEventListener("resize", resizeScene);
resizeScene();
updateMirror();
updateControlValues();

/* PART 2 CONTINUES HERE. Do not close this script yet. */function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1500);
}


// Export current model adjustment settings as JSON.
function exportSettings() {
  const settings = {
    x: Number(xSlider.value),
    y: Number(ySlider.value),
    z: Number(zSlider.value),
    scale: Number(scaleSlider.value),
    rotX: Number(rotXSlider.value),
    rotY: Number(rotYSlider.value),
    rotZ: Number(rotZSlider.value),
    headFit: headFitEnabled
  };

  const blob = new Blob(
    [JSON.stringify(settings, null, 2)],
    { type: "application/json" }
  );

  downloadBlob(blob, "azeez-ar-settings.json");
  setStatus("SETTINGS EXPORTED");
}

exportSettingsButton.addEventListener("click", exportSettings);


// Import previously exported settings.
settingsInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const settings = JSON.parse(await file.text());

    if (Number.isFinite(settings.x)) xSlider.value = settings.x;
    if (Number.isFinite(settings.y)) ySlider.value = settings.y;
    if (Number.isFinite(settings.z)) zSlider.value = settings.z;
    if (Number.isFinite(settings.scale)) scaleSlider.value = settings.scale;
    if (Number.isFinite(settings.rotX)) rotXSlider.value = settings.rotX;
    if (Number.isFinite(settings.rotY)) rotYSlider.value = settings.rotY;
    if (Number.isFinite(settings.rotZ)) rotZSlider.value = settings.rotZ;

    if (typeof settings.headFit === "boolean") {
      headFitEnabled = settings.headFit;
      fitButton.textContent = headFitEnabled
        ? "HEAD FIT: ON"
        : "HEAD FIT MODE";
    }

    applyModelSettings();
    setStatus("SETTINGS IMPORTED");
  } catch (error) {
    console.error("Settings import error:", error);
    setStatus("SETTINGS IMPORT ERROR");
  }

  settingsInput.value = "";
});


// Export the loaded model with the current adjustment transforms.
function exportGLB() {
  if (!loadedModel) {
    setStatus("IMPORT A MODEL FIRST");
    return;
  }

  try {
    const exportScene = new THREE.Scene();
    const exportGroup = new THREE.Group();
    const modelClone = loadedModel.clone(true);

    exportGroup.position.copy(modelPivot.position);
    exportGroup.rotation.copy(modelPivot.rotation);
    exportGroup.scale.copy(modelPivot.scale);

    exportGroup.add(modelClone);
    exportScene.add(exportGroup);

    const exporter = new GLTFExporter();

    exporter.parse(
      exportScene,
      result => {
        if (result instanceof ArrayBuffer) {
          const blob = new Blob(
            [result],
            { type: "model/gltf-binary" }
          );

          downloadBlob(blob, "azeez-ar-model.glb");
          setStatus("GLB EXPORTED");
        } else {
          setStatus("GLB EXPORT FAILED");
        }
      },
      error => {
        console.error("GLB export error:", error);
        setStatus("GLB EXPORT ERROR");
      },
      {
        binary: true,
        trs: true
      }
    );
  } catch (error) {
    console.error("GLB export error:", error);
    setStatus("GLB EXPORT ERROR");
  }
}


// Add a dedicated model export button.
const exportModelButton = document.createElement("button");
exportModelButton.textContent = "EXPORT GLB MODEL";
exportModelButton.style.background = "#6c5ce7";
exportModelButton.style.color = "#fff";
document.getElementById("ui").insertBefore(
  exportModelButton,
  controls
);

exportModelButton.addEventListener("click", exportGLB);


// Recording combines the camera image and visible overlays.
const recordingCanvas = document.createElement("canvas");
const recordingContext = recordingCanvas.getContext("2d");

let recordingStream = null;

function drawVideoCover(ctx, source, width, height) {
  if (!source.videoWidth || !source.videoHeight) return;

  const scale = Math.max(
    width / source.videoWidth,
    height / source.videoHeight
  );

  const drawWidth = source.videoWidth * scale;
  const drawHeight = source.videoHeight * scale;
  const x = (width - drawWidth) / 2;
  const y = (height - drawHeight) / 2;

  ctx.drawImage(source, x, y, drawWidth, drawHeight);
}

function drawRecordingFrame() {
  if (!mediaRecorder || mediaRecorder.state !== "recording") return;

  const width = window.innerWidth;
  const height = window.innerHeight;

  if (
    recordingCanvas.width !== width ||
    recordingCanvas.height !== height
  ) {
    recordingCanvas.width = width;
    recordingCanvas.height = height;
  }

  const ctx = recordingContext;
  ctx.clearRect(0, 0, width, height);

  ctx.save();

  if (mirrorEnabled) {
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
  }

  drawVideoCover(ctx, video, width, height);
  ctx.drawImage(threeCanvas, 0, 0, width, height);
  ctx.drawImage(landmarkCanvas, 0, 0, width, height);

  ctx.restore();

  recordingAnimationId = requestAnimationFrame(drawRecordingFrame);
}

function getSupportedRecordingType() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) {
    return "";
  }

  const types = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];

  return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

function startRecording() {
  if (!currentStream || video.readyState < 2) {
    setStatus("START CAMERA FIRST");
    return;
  }

  if (!window.MediaRecorder) {
    setStatus("RECORDING NOT SUPPORTED");
    return;
  }

  recordedChunks = [];

  recordingCanvas.width = window.innerWidth;
  recordingCanvas.height = window.innerHeight;

  recordingStream = recordingCanvas.captureStream(30);

  try {
    const mimeType = getSupportedRecordingType();

    mediaRecorder = mimeType
      ? new MediaRecorder(recordingStream, { mimeType })
      : new MediaRecorder(recordingStream);
  } catch (error) {
    console.error("Recorder setup error:", error);
    setStatus("RECORDING ERROR");
    return;
  }

  mediaRecorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) {
      recordedChunks.push(event.data);
    }
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, {
      type: mediaRecorder.mimeType || "video/webm"
    });

    downloadBlob(blob, "azeez-ar-recording.webm");

    if (recordingStream) {
      recordingStream.getTracks().forEach(track => track.stop());
      recordingStream = null;
    }

    setStatus("VIDEO SAVED");
  };

  mediaRecorder.start();

  recordButton.textContent = "STOP RECORDING";
  setStatus("RECORDING");

  drawRecordingFrame();
}

function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state !== "recording") return;

  mediaRecorder.stop();

  if (recordingAnimationId !== null) {
    cancelAnimationFrame(recordingAnimationId);
    recordingAnimationId = null;
  }

  recordButton.textContent = "START RECORDING";
}

recordButton.addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  } else {
    startRecording();
  }
});


// Keep the 3D canvas rendering even if face tracking fails to load.
function renderContinuously() {
  renderer.render(scene, threeCamera);
  requestAnimationFrame(renderContinuously);
}

renderContinuously();

setStatus("READY");

</script>
</body>
</html>
