<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Azeez AR 3D Face Tracker</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}


/* CAMERA */

#cameraLayer{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
}

#video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform-origin:center;
}


/* 3D */

#threeLayer{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
}

#threeCanvas{
    width:100%;
    height:100%;
    display:block;
}


/* UI */

#uiLayer{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
}

button,
input{
    pointer-events:auto;
}

#topBar{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

#title{
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#status{
    color:#fff;
    font-size:13px;
    background:rgba(0,0,0,.55);
    padding:7px 10px;
    border-radius:10px;
}


/* MESSAGE */

#message{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.75);
    padding:10px 15px;
    border-radius:10px;
    opacity:0;
    transition:.25s;
    white-space:nowrap;
}

#message.show{
    opacity:1;
}


/* CONTROLS */

#controls{
    position:absolute;
    right:12px;
    top:65px;
    width:280px;
    max-height:75vh;
    overflow-y:auto;
    padding:15px;
    border-radius:16px;
    background:rgba(15,15,15,.88);
    color:white;
    transform:translateX(120%);
    transition:.3s;
    pointer-events:auto;
}

#controls.open{
    transform:translateX(0);
}

.controlRow{
    margin-bottom:13px;
}

.controlRow label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:5px;
}

input[type="range"]{
    width:100%;
}

.controlButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}


/* BOTTOM BAR */

#bottomBar{
    position:absolute;
    bottom:15px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.actionBtn{
    border:0;
    border-radius:12px;
    padding:11px 13px;
    background:rgba(20,20,20,.85);
    color:white;
    font-size:13px;
    cursor:pointer;
}

.actionBtn:active{
    transform:scale(.96);
}

.recordBtn{
    background:#b00020;
}

.hiddenInput{
    display:none;
}

#modelInfo{
    font-size:12px;
    color:#bbb;
    margin-bottom:10px;
    word-break:break-all;
}

</style>

</head>

<script type="module">

import * as THREE
from "three";/* =====================================================
   PART 2 / 6
   THREE.JS + MEDIAPIPE SETUP
===================================================== */

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    FBXLoader
} from "three/addons/loaders/FBXLoader.js";

import {
    OBJLoader
} from "three/addons/loaders/OBJLoader.js";

import {
    MTLLoader
} from "three/addons/loaders/MTLLoader.js";

import {
    GLTFExporter
} from "three/addons/exporters/GLTFExporter.js";


import {
    FaceLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("threeCanvas");

const statusText =
document.getElementById("status");

const message =
document.getElementById("message");

const controls =
document.getElementById("controls");

const modelInfo =
document.getElementById("modelInfo");


/* =====================================================
   APP VARIABLES
===================================================== */

let stream = null;

let facingMode = "user";

let mirror = true;

let faceLandmarker = null;

let trackingStarted = false;

let lastVideoTime = -1;

let currentModel = null;

let currentModelName = "";

let modelFiles = new Map();

let objectURLs = [];

let faceVisible = false;


/* =====================================================
   SMOOTH TRACKING
===================================================== */

let smoothX = 0;

let smoothY = 0;

let smoothZ = 0;

let smoothQuaternion =
new THREE.Quaternion();

let hasSmoothRotation = false;


/* =====================================================
   RECORDING VARIABLES
===================================================== */

let mediaRecorder = null;

let recordedChunks = [];

let isRecording = false;


/* =====================================================
   MODEL SETTINGS
===================================================== */

let modelSettings = {

    x: 0,

    y: 0,

    z: 0,

    scale: 1,

    rotX: 0,

    rotY: 0,

    rotZ: 0

};


/* =====================================================
   THREE.JS SCENE
===================================================== */

const scene =
new THREE.Scene();


/*
   Orthographic camera is used because
   we are placing the 3D head over
   the phone camera view.
*/

const camera =
new THREE.OrthographicCamera(
    -1,
    1,
    1,
    -1,
    0.01,
    100
);

camera.position.set(
    0,
    0,
    5
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({

    canvas: canvas,

    alpha: true,

    antialias: true,

    preserveDrawingBuffer: true

});


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.setClearColor(
    0x000000,
    0
);


/* =====================================================
   LIGHTS
===================================================== */

const ambientLight =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(
    ambientLight
);


const keyLight =
new THREE.DirectionalLight(
    0xffffff,
    2
);

keyLight.position.set(
    2,
    3,
    5
);

scene.add(
    keyLight
);


const fillLight =
new THREE.DirectionalLight(
    0xffffff,
    1
);

fillLight.position.set(
    -3,
    1,
    2
);

scene.add(
    fillLight
);


/* =====================================================
   HEAD TRACKING HIERARCHY
===================================================== */


/*
   IMPORTANT:

   Camera
      ↓
   Face tracking
      ↓
   headAnchor
      ↓
   modelOffset
      ↓
   3D Model

   This is NOT a 2D sticker.
*/

const headAnchor =
new THREE.Group();

scene.add(
    headAnchor
);


const modelOffset =
new THREE.Group();

headAnchor.add(
    modelOffset
);


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const width =
    window.innerWidth;

    const height =
    window.innerHeight;


    renderer.setSize(
        width,
        height,
        false
    );


    const aspect =
    width / height;


    camera.left =
    -aspect;

    camera.right =
    aspect;

    camera.top =
    1;

    camera.bottom =
    -1;


    camera.updateProjectionMatrix();

}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   CAMERA ERROR MESSAGE
===================================================== */

function cameraErrorMessage(
    error
){

    if(
        !window.isSecureContext
    ){

        return (
            "Camera के लिए HTTPS " +
            "या secure page चाहिए."
        );

    }


    if(
        error &&
        error.name ===
        "NotAllowedError"
    ){

        return (
            "Camera permission denied है. " +
            "Browser में Camera Allow करो."
        );

    }


    if(
        error &&
        error.name ===
        "NotFoundError"
    ){

        return (
            "इस device पर camera नहीं मिला."
        );

    }


    if(
        error &&
        error.name ===
        "NotReadableError"
    ){

        return (
            "Camera किसी दूसरे app में " +
            "इस्तेमाल हो रहा है."
        );

    }


    if(
        error &&
        error.name ===
        "OverconstrainedError"
    ){

        return (
            "Camera की requested setting " +
            "supported नहीं है."
        );

    }


    if(
        error &&
        error.name ===
        "SecurityError"
    ){

        return (
            "Browser ने camera access block किया है."
        );

    }


    return (
        "Camera error: " +
        (
            error?.message ||
            error?.name ||
            "Unknown error"
        )
    );

}


/* =====================================================
   MEDIAPIPE INITIALIZATION
===================================================== */

async function initFaceLandmarker(){

    if(faceLandmarker){

        return faceLandmarker;

    }


    setStatus(
        "Loading face tracker..."
    );


    const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(

        vision,

        {

            baseOptions: {

                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:
                "GPU"

            },

            runningMode:
            "VIDEO",

            numFaces:
            1,

            minFaceDetectionConfidence:
            0.5,

            minFacePresenceConfidence:
            0.5,

            minTrackingConfidence:
            0.5,

            outputFaceBlendshapes:
            false,

            outputFacialTransformationMatrixes:
            true

        }

    );


    setStatus(
        "Face tracker ready"
    );


    return faceLandmarker;

}


/* =====================================================
   CAMERA START
===================================================== */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia available नहीं है"
            );

        }


        setStatus(
            "Starting camera..."
        );


        /*
           Stop previous camera.
        */

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

            stream = null;

        }


        /*
           Camera request.
        */

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:
                facingMode,

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:true

        });


        video.srcObject =
        stream;


        /*
           Wait for video metadata.
        */

        await new Promise(
            resolve=>{

                if(
                    video.readyState >= 1
                ){

                    resolve();

                    return;

                }


                video.onloadedmetadata =
                ()=>{
                    resolve();
                };

            }
        );


        await video.play();


        /*
           Start face tracker.
        */

        await initFaceLandmarker();


        trackingStarted =
        true;


        lastVideoTime =
        -1;


        setStatus(
            "Camera ON — Face खोज रहा है..."
        );


        /*
           Start tracking loop.
        */

        requestAnimationFrame(
            trackFace
        );


        showMessage(
            "Camera started"
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        trackingStarted =
        false;


        setStatus(
            "Camera failed"
        );


        showMessage(
            cameraErrorMessage(
                error
            )
        );

    }

}


/* =====================================================
   CAMERA BUTTON
===================================================== */

document
.getElementById(
    "cameraButton"
)
.addEventListener(
    "click",
    async ()=>{

        /*
           First click:
           start front camera.

           Next click:
           switch front/back.
        */

        if(!stream){

            await startCamera();

            return;

        }


        facingMode =
        facingMode === "user"
        ? "environment"
        : "user";


        await startCamera();

    }
);


/* =====================================================
   MIRROR
===================================================== */

function updateMirror(){

    /*
       ONLY video is mirrored.

       UI is NEVER mirrored.
       3D canvas is NEVER mirrored.
    */

    video.style.transform =
    mirror
    ? "scaleX(-1)"
    : "scaleX(1)";

}


document
.getElementById(
    "mirrorButton"
)
.addEventListener(
    "click",
    ()=>{

        mirror =
        !mirror;

        updateMirror();

        showMessage(
            mirror
            ? "Mirror ON"
            : "Mirror OFF"
        );

    }
);


/* =====================================================
   INITIAL MIRROR
===================================================== */

updateMirror();/* =====================================================
   PART 3 / 6
   TRUE 3D FACE TRACKING
===================================================== */


/* =====================================================
   TRACKING LOOP
===================================================== */

function trackFace(){

    if(!trackingStarted){

        return;

    }


    if(
        !faceLandmarker ||
        video.readyState < 2
    ){

        requestAnimationFrame(
            trackFace
        );

        return;

    }


    /*
       Process each new video frame
    */

    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        try{

            const result =
            faceLandmarker.detectForVideo(
                video,
                performance.now()
            );


            processFaceResult(
                result
            );

        }catch(error){

            console.error(
                "FACE TRACK ERROR:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackFace
    );

}


/* =====================================================
   PROCESS FACE RESULT
===================================================== */

function processFaceResult(
    result
){

    if(
        !result ||
        !result.faceLandmarks ||
        result.faceLandmarks.length === 0
    ){

        faceVisible =
        false;

        /*
           Don't immediately hide model.
           Keep the last position for
           a smoother AR experience.
        */

        return;

    }


    faceVisible =
    true;


    const landmarks =
    result.faceLandmarks[0];


    /*
       -----------------------------------------------
       1. FIND FACE BOUNDING BOX
       -----------------------------------------------
    */

    let minX = 1;

    let maxX = 0;

    let minY = 1;

    let maxY = 0;


    for(
        const point of landmarks
    ){

        if(point.x < minX)
            minX = point.x;

        if(point.x > maxX)
            maxX = point.x;

        if(point.y < minY)
            minY = point.y;

        if(point.y > maxY)
            maxY = point.y;

    }


    const centerX =
    (minX + maxX) / 2;


    const centerY =
    (minY + maxY) / 2;


    const faceWidth =
    Math.max(
        maxX - minX,
        0.001
    );


    /*
       -----------------------------------------------
       2. CONVERT FACE POSITION TO 3D SPACE
       -----------------------------------------------

       The 2D landmarks are used only to
       determine where the head is in the
       camera frame.

       Rotation comes from the actual
       facial transformation matrix below.
    */


    const aspect =
    window.innerWidth /
    Math.max(
        window.innerHeight,
        1
    );


    const targetX =
    (
        0.5 -
        centerX
    )
    * 2
    * aspect;


    const targetY =
    (
        0.5 -
        centerY
    )
    * 2;


    /*
       Estimate depth from face size.

       Bigger face = closer.
       Smaller face = farther.
    */

    const targetZ =
    THREE.MathUtils.clamp(

        (
            0.18 /
            faceWidth
        ) - 1,

        -1.2,

        2.5

    );


    /*
       -----------------------------------------------
       3. SMOOTH POSITION
       -----------------------------------------------
    */

    const smoothing =
    0.28;


    smoothX +=
    (
        targetX -
        smoothX
    )
    * smoothing;


    smoothY +=
    (
        targetY -
        smoothY
    )
    * smoothing;


    smoothZ +=
    (
        targetZ -
        smoothZ
    )
    * smoothing;


    headAnchor.position.set(

        smoothX,

        smoothY,

        smoothZ

    );


    /*
       -----------------------------------------------
       4. TRUE 3D FACE ROTATION
       -----------------------------------------------
    */

    if(
        result.facialTransformationMatrixes &&
        result.facialTransformationMatrixes.length > 0
    ){

        const matrixData =
        result
        .facialTransformationMatrixes[0]
        .data;


        if(
            matrixData &&
            matrixData.length >= 16
        ){

            const faceMatrix =
            new THREE.Matrix4();


            faceMatrix.fromArray(
                matrixData
            );


            /*
               Extract actual 3D
               position / rotation / scale.
            */

            const facePosition =
            new THREE.Vector3();


            const faceQuaternion =
            new THREE.Quaternion();


            const faceScale =
            new THREE.Vector3();


            faceMatrix.decompose(

                facePosition,

                faceQuaternion,

                faceScale

            );


            /*
               MediaPipe and Three.js use
               different coordinate conventions.

               Apply a 180° Y correction
               so the character faces the
               camera instead of turning backward.
            */

            const correction =
            new THREE.Quaternion()
            .setFromEuler(

                new THREE.Euler(
                    0,
                    Math.PI,
                    0
                )

            );


            const targetQuaternion =
            faceQuaternion
            .clone()
            .multiply(
                correction
            );


            /*
               Smooth rotation using slerp.
            */

            if(
                !hasSmoothRotation
            ){

                smoothQuaternion.copy(
                    targetQuaternion
                );

                hasSmoothRotation =
                true;

            }else{

                smoothQuaternion.slerp(
                    targetQuaternion,
                    0.25
                );

            }


            headAnchor.quaternion.copy(
                smoothQuaternion
            );

        }

    }


    /*
       Make sure model stays attached
       to the tracked head.
    */

    if(currentModel){

        currentModel.visible =
        true;

    }


    setStatus(
        "Face tracked ✓"
    );

}


/* =====================================================
   RESET TRACKING SMOOTHING
===================================================== */

function resetTrackingSmoothing(){

    smoothX = 0;

    smoothY = 0;

    smoothZ = 0;

    smoothQuaternion.identity();

    hasSmoothRotation =
    false;

}


/* =====================================================
   FACE LOST HANDLING
===================================================== */

let lastFaceTime =
0;


function updateFaceVisibility(){

    if(
        faceVisible
    ){

        lastFaceTime =
        performance.now();

        return;

    }


    /*
       Keep model visible briefly
       when tracking is temporarily lost.
    */

    if(
        performance.now() -
        lastFaceTime >
        800
    ){

        if(currentModel){

            currentModel.visible =
            false;

        }

    }

}

/* =====================================================
   DISPOSE MODEL
===================================================== */

function disposeObject(object){

    if(!object) return;


    object.traverse(
        child=>{

            if(child.geometry){

                child.geometry.dispose();

            }


            if(child.material){

                const materials =
                Array.isArray(
                    child.material
                )
                ? child.material
                : [child.material];


                materials.forEach(
                    material=>{

                        if(material.map)
                            material.map.dispose();

                        if(material.normalMap)
                            material.normalMap.dispose();

                        if(material.roughnessMap)
                            material.roughnessMap.dispose();

                        if(material.metalnessMap)
                            material.metalnessMap.dispose();

                        if(material.emissiveMap)
                            material.emissiveMap.dispose();

                        material.dispose();

                    }
                );

            }

        }
    );

}


/* =====================================================
   REMOVE OLD MODEL
===================================================== */

function removeCurrentModel(){

    if(currentModel){

        modelOffset.remove(
            currentModel
        );


        disposeObject(
            currentModel
        );


        currentModel =
        null;

    }


    currentModelName =
    "";


    if(modelInfo){

        modelInfo.textContent =
        "No model loaded";

    }

}


/* =====================================================
   FILE MANAGER
===================================================== */

function createFileManager(){

    const manager =
    new THREE.LoadingManager();


    manager.setURLModifier(
        url=>{

            const cleanURL =
            url
            .split("?")[0]
            .split("#")[0];


            const fileName =
            decodeURIComponent(
                cleanURL
                .split("/")
                .pop()
            );


            /*
               Exact filename match
            */

            if(
                modelFiles.has(
                    fileName
                )
            ){

                const file =
                modelFiles.get(
                    fileName
                );


                const blobURL =
                URL.createObjectURL(
                    file
                );


                objectURLs.push(
                    blobURL
                );


                return blobURL;

            }


            /*
               Case-insensitive match
            */

            for(
                const [
                    name,
                    file
                ]
                of modelFiles
            ){

                if(
                    name.toLowerCase() ===
                    fileName.toLowerCase()
                ){

                    const blobURL =
                    URL.createObjectURL(
                        file
                    );


                    objectURLs.push(
                        blobURL
                    );


                    return blobURL;

                }

            }


            return url;

        }
    );


    return manager;

}


/* =====================================================
   NORMALIZE MODEL
===================================================== */

function normalizeModel(
    root
){

    root.updateMatrixWorld(
        true
    );


    const box =
    new THREE.Box3()
    .setFromObject(
        root
    );


    const size =
    box.getSize(
        new THREE.Vector3()
    );


    const largest =
    Math.max(
        size.x,
        size.y,
        size.z
    );


    /*
       Make every imported model
       approximately the same size.
    */

    if(
        largest > 0
    ){

        const targetSize =
        0.85;


        const factor =
        targetSize /
        largest;


        root.scale.multiplyScalar(
            factor
        );

    }


    root.updateMatrixWorld(
        true
    );


    /*
       Center model around origin.
    */

    const newBox =
    new THREE.Box3()
    .setFromObject(
        root
    );


    const center =
    newBox.getCenter(
        new THREE.Vector3()
    );


    root.position.x -=
    center.x;


    root.position.y -=
    center.y;


    root.position.z -=
    center.z;


    /*
       Enable rendering.
    */

    root.traverse(
        child=>{

            if(
                child.isMesh
            ){

                child.castShadow =
                true;

                child.receiveShadow =
                true;


                if(
                    child.material
                ){

                    const materials =
                    Array.isArray(
                        child.material
                    )
                    ? child.material
                    : [child.material];


                    materials.forEach(
                        material=>{

                            material.needsUpdate =
                            true;

                        }
                    );

                }

            }

        }
    );


    return root;

}


/* =====================================================
   LOAD GLB / GLTF
===================================================== */

async function loadGLTF(
    file
){

    const manager =
    createFileManager();


    const loader =
    new GLTFLoader(
        manager
    );


    const buffer =
    await file.arrayBuffer();


    const result =
    await loader.parseAsync(
        buffer,
        ""
    );


    if(
        !result ||
        !result.scene
    ){

        throw new Error(
            "GLB/GLTF scene नहीं मिली"
        );

    }


    return result.scene;

}


/* =====================================================
   LOAD FBX
===================================================== */

async function loadFBX(
    file
){

    const manager =
    createFileManager();


    const loader =
    new FBXLoader(
        manager
    );


    const buffer =
    await file.arrayBuffer();


    const object =
    loader.parse(
        buffer,
        ""
    );


    if(!object){

        throw new Error(
            "FBX model load नहीं हुआ"
        );

    }


    return object;

}


/* =====================================================
   LOAD OBJ
===================================================== */

async function loadOBJ(
    file
){

    const manager =
    createFileManager();


    let materials =
    null;


    /*
       Search for MTL file.
    */

    for(
        const [
            name,
            mtlFile
        ]
        of modelFiles
    ){

        if(
            /\.mtl$/i.test(
                name
            )
        ){

            try{

                const mtlLoader =
                new MTLLoader(
                    manager
                );


                const mtlText =
                await mtlFile.text();


                materials =
                mtlLoader.parse(
                    mtlText,
                    ""
                );


                materials.preload();


                break;

            }catch(error){

                console.warn(
                    "MTL load failed:",
                    error
                );

            }

        }

    }


    const loader =
    new OBJLoader(
        manager
    );


    if(materials){

        loader.setMaterials(
            materials
        );

    }


    const text =
    await file.text();


    const object =
    loader.parse(
        text
    );


    if(!object){

        throw new Error(
            "OBJ model load नहीं हुआ"
        );

    }


    return object;

}


/* =====================================================
   PREPARE MODEL
===================================================== */

function prepareModel(
    root,
    name
){

    /*
       Normalize first.
    */

    normalizeModel(
        root
    );


    /*
       Manual adjustment values.
    */

    root.position.set(

        modelSettings.x,

        modelSettings.y,

        modelSettings.z

    );


    root.scale.setScalar(

        modelSettings.scale

    );


    root.rotation.set(

        THREE.MathUtils.degToRad(
            modelSettings.rotX
        ),

        THREE.MathUtils.degToRad(
            modelSettings.rotY
        ),

        THREE.MathUtils.degToRad(
            modelSettings.rotZ
        )

    );


    /*
       Add model to tracking layer.
    */

    modelOffset.add(
        root
    );


    currentModel =
    root;


    currentModelName =
    name;


    currentModel.visible =
    true;


    if(modelInfo){

        modelInfo.textContent =
        "Loaded: " + name;

    }


    updateModelUI();

}


/* =====================================================
   IMPORT MODEL FILES
===================================================== */

async function importModelFiles(
    files
){

    if(
        !files ||
        files.length === 0
    ){

        return;

    }


    try{

        setStatus(
            "Loading 3D model..."
        );


        /*
           Remove previous model.
        */

        removeCurrentModel();


        /*
           Clear old file list.
        */

        modelFiles.clear();


        /*
           Release old blob URLs.
        */

        objectURLs.forEach(
            url=>{

                URL.revokeObjectURL(
                    url
                );

            }
        );


        objectURLs =
        [];


        /*
           Save ALL selected files.

           Example:

           character.glb

           OR

           character.gltf
           character.bin
           texture.png

           OR

           character.obj
           character.mtl
           texture.jpg
        */

        for(
            const file of files
        ){

            modelFiles.set(
                file.name,
                file
            );

        }


        /*
           Find main model file.
        */

        let mainFile =
        null;


        mainFile =
        [...files].find(
            file=>
            /\.glb$/i.test(
                file.name
            )
        );


        if(!mainFile){

            mainFile =
            [...files].find(
                file=>
                /\.gltf$/i.test(
                    file.name
                )
            );

        }


        if(!mainFile){

            mainFile =
            [...files].find(
                file=>
                /\.fbx$/i.test(
                    file.name
                )
            );

        }


        if(!mainFile){

            mainFile =
            [...files].find(
                file=>
                /\.obj$/i.test(
                    file.name
                )
            );

        }


        if(!mainFile){

            throw new Error(
                "GLB / GLTF / FBX / OBJ file नहीं मिला"
            );

        }


        let root =
        null;


        const extension =
        mainFile.name
        .toLowerCase();


        /*
           GLB / GLTF
        */

        if(
            extension.endsWith(
                ".glb"
            ) ||
            extension.endsWith(
                ".gltf"
            )
        ){

            root =
            await loadGLTF(
                mainFile
            );

        }


        /*
           FBX
        */

        else if(
            extension.endsWith(
                ".fbx"
            )
        ){

            root =
            await loadFBX(
                mainFile
            );

        }


        /*
           OBJ
        */

        else if(
            extension.endsWith(
                ".obj"
            )
        ){

            root =
            await loadOBJ(
                mainFile
            );

        }


        if(!root){

            throw new Error(
                "3D model तैयार नहीं हुआ"
            );

        }


        prepareModel(
            root,
            mainFile.name
        );


        setStatus(
            "3D Model Ready ✓"
        );


        showMessage(
            "3D model imported successfully"
        );


    }catch(error){

        console.error(
            "MODEL IMPORT ERROR:",
            error
        );


        setStatus(
            "3D Import Failed"
        );


        showMessage(
            "Import Error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}

                    ){

                        blob =
                        new Blob(
                            [result],
                            {

                            }
                        );

                    else{

/* =====================================================
   RECORDING
===================================================== */

function startRecording(){

    if(isRecording){

        stopRecording();

        return;

    }


    if(!stream){

        showMessage(
            "पहले Camera ON करो"
        );

        return;

    }


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        showMessage(
            "Camera अभी ready नहीं है"
        );

        return;

    }


    if(
        !window.MediaRecorder
    ){

        showMessage(
            "इस browser में recording supported नहीं है"
        );

        return;

    }


    try{

        /*
           Recording canvas
        */

        const recordCanvas =
        document.createElement(
            "canvas"
        );


        recordCanvas.width =
        video.videoWidth;


        recordCanvas.height =
        video.videoHeight;


        const ctx =
        recordCanvas.getContext(
            "2d"
        );


        /*
           Combined video frame
        */

        function drawRecordingFrame(){

            if(!isRecording){

                return;

            }


            const width =
            recordCanvas.width;

            const height =
            recordCanvas.height;


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
               CAMERA
            */

            if(mirror){

                ctx.save();


                ctx.translate(
                    width,
                    0
                );


                ctx.scale(
                    -1,
                    1
                );


                ctx.drawImage(
                    video,
                    0,
                    0,
                    width,
                    height
                );


                ctx.restore();

            }else{

                ctx.drawImage(
                    video,
                    0,
                    0,
                    width,
                    height
                );

            }


            /*
               3D MODEL
            */

            ctx.drawImage(
                renderer.domElement,
                0,
                0,
                width,
                height
            );


            requestAnimationFrame(
                drawRecordingFrame
            );

        }


        /*
           Create recording stream
        */

        const recordingStream =
        recordCanvas.captureStream(
            30
        );


        /*
           Add microphone audio
           from camera stream.
        */

        const audioTracks =
        stream.getAudioTracks();


        audioTracks.forEach(
            track=>{

                recordingStream.addTrack(
                    track
                );

            }
        );


        /*
           Find supported format.
        */

        let mimeType =
        "";


        if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9,opus"
            )
        ){

            mimeType =
            "video/webm;codecs=vp9,opus";

        }

        else if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp8,opus"
            )
        ){

            mimeType =
            "video/webm;codecs=vp8,opus";

        }

        else if(
            MediaRecorder.isTypeSupported(
                "video/webm"
            )
        ){

            mimeType =
            "video/webm";

        }


        /*
           Create recorder.
        */

        if(mimeType){

            mediaRecorder =
            new MediaRecorder(
                recordingStream,
                {
                    mimeType:
                    mimeType
                }
            );

        }else{

            mediaRecorder =
            new MediaRecorder(
                recordingStream
            );

        }


        recordedChunks =
        [];


        /*
           Collect video data.
        */

        mediaRecorder.ondataavailable =
        event=>{

            if(
                event.data &&
                event.data.size > 0
            ){

                recordedChunks.push(
                    event.data
                );

            }

        };


        /*
           When recording stops
        */

        mediaRecorder.onstop =
        ()=>{

            try{

                const blob =
                new Blob(
                    recordedChunks,
                    {
                        type:
                        mediaRecorder.mimeType ||
                        "video/webm"
                    }
                );


                const url =
                URL.createObjectURL(
                    blob
                );


                const link =
                document.createElement(
                    "a"
                );


                link.href =
                url;


                link.download =
                "Azeez-AR-" +
                Date.now() +
                ".webm";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    ()=>{
                        URL.revokeObjectURL(
                            url
                        );
                    },
                    3000
                );


                setStatus(
                    "Recording Saved ✓"
                );


                showMessage(
                    "Recording saved ✓"
                );


            }catch(error){

                console.error(
                    "SAVE ERROR:",
                    error
                );


                showMessage(
                    "Recording save failed"
                );

            }

        };


        /*
           Start recording.
        */

        mediaRecorder.start(
            1000
        );


        isRecording =
        true;


        setStatus(
            "● Recording..."
        );


        const recordButton =
        document.getElementById(
            "recordButton"
        );


        if(recordButton){

            recordButton.textContent =
            "⏹ Stop";

        }


        drawRecordingFrame();


        showMessage(
            "Recording started"
        );


    }catch(error){

        console.error(
            "RECORDING ERROR:",
            error
        );


        isRecording =
        false;


        setStatus(
            "Recording failed"
        );


        showMessage(
            "Recording error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();

    }


    isRecording =
    false;


    const recordButton =
    document.getElementById(
        "recordButton"
    );


    if(recordButton){

        recordButton.textContent =
        "● Record";

    }


    setStatus(
        "Processing recording..."
    );

}


/* =====================================================
   RECORD BUTTON
===================================================== */

document
.getElementById(
    "recordButton"
)
.addEventListener(
    "click",
    ()=>{

        startRecording();

    }
);


/* =====================================================
   INITIAL VALUES
===================================================== */

updateModelUI();

updateMirror();


/* =====================================================
   RENDER LOOP
===================================================== */

function render(){

    requestAnimationFrame(
        render
    );


    renderer.render(
        scene,
        camera
    );

}


render();


/* =====================================================
   FINAL RESIZE
===================================================== */

resize();


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        /*
           Stop camera.
        */

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>{

                    track.stop();

                }
            );

        }


        /*
           Stop recorder.
        */

        if(
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ){

            try{

                mediaRecorder.stop();

            }catch(error){

                console.warn(
                    error
                );

            }

        }


        /*
           Release model resources.
        */

        if(currentModel){

            disposeObject(
                currentModel
            );

        }


        /*
           Release blob URLs.
        */

        objectURLs.forEach(
            url=>{

                try{

                    URL.revokeObjectURL(
                        url
                    );

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }
        );


        objectURLs =
        [];

    }
);


/* =====================================================
   APP READY
===================================================== */

setStatus(
    "Ready — Camera दबाएँ"
);


console.log(
    "================================="
);

console.log(
    "Azeez AR 3D Face Tracker"
);

console.log(
    "App Ready ✓"
);

console.log(
    "================================="
);

</script>
