<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 15px;
  text-align: center;
  background: #111b2b;
}

header h1 {
  margin: 0;
  font-size: 21px;
  letter-spacing: 2px;
}

header p {
  margin: 6px 0 0;
  color: #9eb5d0;
  font-size: 12px;
}

#controls {
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

button {
  padding: 13px 8px;
  border: 0;
  border-radius: 8px;
  background: #294361;
  color: white;
  font-weight: bold;
  font-size: 12px;
}

.start {
  background: #087da9;
}

.stop {
  background: #a52e42;
}

#status {
  margin: 0 12px 12px;
  padding: 12px;
  background: #111b2b;
  border-radius: 8px;
  color: #80e3ff;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#container {
  width: 100%;
  height: 65vh;
  min-height: 300px;
  position: relative;
  overflow: hidden;
  background: #111827;
}

#container video,
#container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#container canvas {
  z-index: 2;
}

#container.camera-hidden {
  visibility: hidden;
}

#container.camera-hidden::after {
  content: "CAMERA PREVIEW HIDDEN";
  visibility: visible;
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111827;
  color: white;
  z-index: 5;
}

.note {
  padding: 12px;
  color: #94a9c3;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>
  <h1>AZEEZ AI AR STUDIO</h1>
  <p>MINDAR FACE TRACKING TEST</p>
</header>

<div id="controls">
  <button class="start" id="startButton">START CAMERA</button>
  <button class="stop" id="stopButton">STOP CAMERA</button>
  <button id="switchButton">SWITCH CAMERA</button>
  <button id="hideButton">HIDE CAMERA</button>
</div>

<div id="status">Ready. Press START CAMERA.</div>

<div id="container"></div>

<p class="note">
  First allow camera permission. Keep your face in front of the camera.
  Internet connection is required to load the tracking model.
</p>

<script type="module">
import * as THREE from "three";

import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";

import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#container");
const status = document.querySelector("#status");

const startButton = document.querySelector("#startButton");
const stopButton = document.querySelector("#stopButton");
const switchButton = document.querySelector("#switchButton");
const hideButton = document.querySelector("#hideButton");

let mindarThree = null;
let avatar = null;
let anchor = null;

let running = false;
let cameraFacing = "user";
let cameraHidden = false;

function setStatus(message) {
  status.textContent = message;
}

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const url =
      "https://assets.codepen.io/9177687/raccoon_head.glb";

    const loader = new GLTFLoader();

    this.gltf = await new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });

    this.gltf.scene.traverse((object) => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }
    });

    if (this.morphTargetMeshes.length === 0) {
      console.warn("Avatar has no morph targets.");
    }
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes || !blendshapes.categories) return;

    const categories = blendshapes.categories;

    const values = new Map();

    for (const category of categories) {
      values.set(category.categoryName, category.score);
    }

    for (const mesh of this.morphTargetMeshes) {
      const dictionary = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      for (const [name, value] of values) {
        if (dictionary[name] === undefined) continue;

        const index = dictionary[name];
        influences[index] = value;
      }
    }
  }
}

async function setup() {
  setStatus("Loading avatar...");

  avatar = new Avatar();
  await avatar.init();

  setStatus("Preparing face tracking camera...");

  mindarThree = new MindARThree({
    container: container,
    faceCamera: cameraFacing,
    maxTrack: 1
  });

  const scene = mindarThree.scene;
  const camera = mindarThree.camera;
  const renderer = mindarThree.renderer;

  const light = new THREE.HemisphereLight(
    0xffffff,
    0xbbbbff,
    1.5
  );

  scene.add(light);

  const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    1.5
  );

  directionalLight.position.set(0, 1, 2);
  scene.add(directionalLight);

  anchor = mindarThree.addAnchor(1);

  avatar.gltf.scene.scale.set(2, 2, 2);

  anchor.group.add(avatar.gltf.scene);

  await mindarThree.start();

  running = true;

  renderer.setAnimationLoop(() => {
    if (!running) return;

    const estimate = mindarThree.getLatestEstimate();

    if (estimate && estimate.blendshapes) {
      avatar.updateBlendshapes(estimate.blendshapes);
    }

    renderer.render(scene, camera);
  });

  setStatus("Camera running. Face tracking active.");
}

async function startCamera() {
  if (running) {
    setStatus("Camera is already running.");
    return;
  }

  startButton.disabled = true;

  try {
    await setup();
  } catch (error) {
    console.error(error);

    running = false;

    setStatus(
      "START ERROR: " +
      (error.message || "Camera or model could not load.")
    );

    if (mindarThree) {
      try {
        mindarThree.stop();
      } catch (e) {
        console.error(e);
      }
    }

    mindarThree = null;
    avatar = null;
  } finally {
    startButton.disabled = false;
  }
}

function stopCamera() {
  running = false;

  if (mindarThree) {
    try {
      mindarThree.renderer.setAnimationLoop(null);
      mindarThree.stop();
    } catch (error) {
      console.error(error);
    }
  }

  mindarThree = null;
  avatar = null;
  anchor = null;

  container.innerHTML = "";

  setStatus("Camera stopped.");
}

async function switchCamera() {
  const wasRunning = running;

  cameraFacing =
    cameraFacing === "user" ? "environment" : "user";

  setStatus(
    "Selected camera: " +
    (cameraFacing === "user" ? "Front" : "Back")
  );

  if (wasRunning) {
    stopCamera();
    await startCamera();
  }
}

function toggleCameraPreview() {
  cameraHidden = !cameraHidden;

  container.classList.toggle(
    "camera-hidden",
    cameraHidden
  );

  hideButton.textContent =
    cameraHidden ? "SHOW CAMERA" : "HIDE CAMERA";
}

startButton.addEventListener("click", startCamera);

stopButton.addEventListener("click", stopCamera);

switchButton.addEventListener("click", switchCamera);

hideButton.addEventListener("click", toggleCameraPreview);

setStatus("Studio ready. Press START CAMERA.");

</script>
</body>
</html>
