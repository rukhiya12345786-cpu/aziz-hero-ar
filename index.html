<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Face Tracking Test</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

#status{
    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:20;

    background:rgba(0,0,0,.8);

    color:white;

    padding:10px 16px;

    border-radius:10px;

    font-family:Arial;

    font-size:16px;

    text-align:center;
}

#open{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<canvas id="three"></canvas>


<div id="status">
CAMERA + FACE TEST
</div>


<button id="open">
OPEN CAMERA
</button>


<script type="module">


/* =================================
   THREE.JS
================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


const video =
document.getElementById("camera");

const canvas =
document.getElementById("three");

const button =
document.getElementById("open");

const status =
document.getElementById("status");



/* =================================
   THREE SCENE
================================= */

const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.1,

    100

);


camera3D.position.z = 4;



const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    alpha:true,

    antialias:true

});


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);



/* =================================
   LIGHT
================================= */

const light =
new THREE.DirectionalLight(

    0xffffff,
    3

);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


const ambient =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambient);



/* =================================
   HEAD ANCHOR
================================= */

const headAnchor =
new THREE.Group();

scene.add(headAnchor);



/* =================================
   SMALL CUBE
================================= */

const geometry =
new THREE.BoxGeometry(

    0.55,
    0.55,
    0.55

);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(

    geometry,
    material

);


/*
   Cube is attached to
   headAnchor.
*/

cube.position.set(

    0,
    0,
    0

);


headAnchor.add(cube);



/* =================================
   TEMPORARY ROTATION
================================= */

let faceFound = false;


function render(){

    requestAnimationFrame(render);

    /*
    Cube will NOT independently
    rotate once face is found.
    */

    if(!faceFound){

        cube.rotation.x += 0.01;
        cube.rotation.y += 0.015;

    }

    renderer.render(

        scene,
        camera3D

    );

}


render();



/* =================================
   OPEN CAMERA
================================= */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA ON — LOADING FACE TRACKING...";


        /*
        IMPORTANT:
        MediaPipe loads AFTER
        camera is already working.
        */


        await startFaceTracking();

    }

    catch(error){

        status.innerText =
        "CAMERA ERROR";

        alert(

            error.name +
            "\n\n" +
            error.message

        );

    }

};



/* =================================
   MEDIAPIPE
================================= */

async function startFaceTracking(){

    try{

        const vision =
        await import(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"

        );


        const {
            FaceLandmarker,
            FilesetResolver
        } = vision;



        status.innerText =
        "LOADING FACE MODEL...";


        const fileset =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );



        const faceLandmarker =
        await FaceLandmarker.createFromOptions(

            fileset,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"GPU"

                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5,

                outputFaceBlendshapes:false,

                outputFacialTransformationMatrixes:true

            }

        );



        status.innerText =
        "FACE TRACKING ON";


        trackFace(faceLandmarker);

    }

    catch(error){

        console.error(error);


        status.innerText =
        "FACE TRACKING ERROR";


        alert(

            "FACE TRACKING ERROR\n\n" +

            error.message

        );

    }

}



/* =================================
   FACE TRACKING
================================= */

let lastTime = -1;


function trackFace(faceLandmarker){

    requestAnimationFrame(

        () => trackFace(faceLandmarker)

    );


    if(
        video.readyState <
        video.HAVE_CURRENT_DATA
    ){

        return;

    }


    const now =
    performance.now();


    if(now === lastTime){

        return;

    }


    lastTime = now;



    const result =
    faceLandmarker.detectForVideo(

        video,
        now

    );



    if(

        result.faceLandmarks &&
        result.faceLandmarks.length > 0

    ){

        faceFound = true;


        status.innerText =
        "FACE DETECTED ✓";


        const landmarks =
        result.faceLandmarks[0];



        /*
        Nose landmark.
        */

        const nose =
        landmarks[1];



        /*
        Convert MediaPipe
        normalized coordinates
        into Three.js screen area.
        */

        const x =
        (nose.x - 0.5) * 3.4;


        const y =
        -(nose.y - 0.5) * 2.6;



        /*
        Move head anchor.
        */

        headAnchor.position.x =
        x;

        headAnchor.position.y =
        y;


        /*
        Small depth offset.
        */

        headAnchor.position.z =
        0;



        /*
        FACE ROTATION
        */

        if(

            result.facialTransformationMatrixes &&

            result.facialTransformationMatrixes.length > 0

        ){

            const matrixData =
            result.facialTransformationMatrixes[0].data;


            const matrix =
            new THREE.Matrix4();


            matrix.fromArray(
                matrixData
            );


            const position =
            new THREE.Vector3();


            const quaternion =
            new THREE.Quaternion();


            const scale =
            new THREE.Vector3();


            matrix.decompose(

                position,
                quaternion,
                scale

            );


            /*
            Apply facial rotation
            to the head anchor.
            */

            headAnchor.quaternion.slerp(

                quaternion,

                0.35

            );

        }

    }

    else{

        faceFound = false;


        status.innerText =
        "FACE NOT DETECTED";

    }

}



/* =================================
   RESIZE
================================= */

window.addEventListener(

    "resize",

    function(){

        camera3D.aspect =

        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


</script>

</body>

</html>
