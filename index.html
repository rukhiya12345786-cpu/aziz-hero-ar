
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #111;
  touch-action: none;
}

#container video,
#container canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#container video { z-index: 1 !important; }
#container canvas { z-index: 2 !important; }

#topbar {
  position: fixed;
  top: 8px;
  left: 8px;
  right: 8px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

#brand, #status {
  background: #000c;
  color: white;
  border-radius: 8px;
  padding: 9px;
  font-size: 11px;
  font-weight: bold;
}

button {
  background: #202020ee;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 10px;
  font-size: 11px;
  font-weight: bold;
}

button.active { background: #075fc5; }
button:disabled { opacity: .4; }

#toggleAllBtn {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: #075fc5;
}

#controls {
  position: fixed;
  bottom: 8px;
  left: 8px;
  right: 8px;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
}

#transformPanel {
  position: fixed;
  top: 60px;
  right: 8px;
  z-index: 35;
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 110px;
}

#sizePanel {
  position: fixed;
  bottom: 105px;
  left: 8px;
  right: 8px;
  z-index: 36;
  background: #000c;
  color: white;
  padding: 9px;
  border-radius: 9px;
}

#sizePanel label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

#sizeSlider {
  width: 100%;
  height: 28px;
  accent-color: #0784ff;
  touch-action: pan-x;
}

#sizeValue {
  display: block;
  text-align: center;
  font-size: 12px;
}

#message {
  position: fixed;
  bottom: 65px;
  left: 8px;
  right: 8px;
  z-index: 25;
  background: #0009;
  color: white;
  padding: 8px;
  border-radius: 8px;
  text-align: center;
  font-size: 11px;
  pointer-events: none;
}

.hidden { display: none !important; }

#fileInput, #imageInput, #videoInput {
  display: none;
}

@media (orientation: landscape) {
  #controls {
    left: auto;
    right: 8px;
    bottom: 8px;
    width: 190px;
  }

  #sizePanel {
    left: 8px;
    right: 210px;
    bottom: 8px;
  }

  #message {
    left: 8px;
    right: 210px;
    bottom: 65px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<button id="toggleAllBtn">HIDE ALL</button>

<div id="topbar" class="ui-panel">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="transformPanel" class="ui-panel">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
  <button id="scaleBtn">SCALE GIZMO</button>
  <button id="hideGizmoBtn">HIDE GIZMO</button>
</div>

<div id="sizePanel" class="ui-panel">
  <label>3D MODEL SIZE</label>
  <input id="sizeSlider" type="range"
    min="0.01" max="20" step="0.01" value="1">
  <span id="sizeValue">100%</span>
</div>

<div id="controls" class="ui-panel">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="trackingBtn">TRACKING ON</button>
  <button id="importBtn">IMPORT 3D</button>
  <button id="imageBtn">IMPORT IMAGE</button>
  <button id="videoBtn">IMPORT VIDEO</button>
  <button id="disposeBtn">DISPOSE</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<div id="message" class="ui-panel">
  Press START CAMERA.
</div>

<input id="fileInput" type="file" accept=".glb,.gltf,.obj,.fbx">
<input id="imageInput" type="file" accept="image/*">
<input id="videoInput" type="file" accept="video/*">

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");

const fileInput = document.querySelector("#fileInput");
const imageInput = document.querySelector("#imageInput");
const videoInput = document.querySelector("#videoInput");

let mindarThree = null;
let anchor = null;
let avatar = null;
let importedContent = null;
let transformControls = null;

let running = false;
let starting = false;
let trackingEnabled = true;
let gizmoVisible = true;
let allVisible = true;
let currentMode = "translate";

let baseScale = new THREE.Vector3(1, 1, 1);
let currentSizeObject = null;
let activeVideo = null;
let activeObjectURL = null;
let touchPoints = new Map();
let previousTouchDistance = 0;
let previousTouchAngle = 0;

const $ = (id) => document.getElementById(id);
const setMessage = (text) => messageBox.textContent = text;
const setStatus = (text) => statusBox.textContent = text;

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const loader = new GLTFLoader();
    const url = "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";

    this.gltf = await loader.loadAsync(url);

    this.gltf.scene.traverse((object) => {
      if (object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences) {
        this.morphTargetMeshes.push(object);
      }
    });
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes?.categories) return;

    const values = new Map(
      blendshapes.categories.map(item => [
        item.categoryName, item.score
      ])
    );

    for (const mesh of this.morphTargetMeshes) {
      for (const [name, value] of values) {
        const index = mesh.morphTargetDictionary[name];
        if (index !== undefined) {
          mesh.morphTargetInfluences[index] = value;
        }
      }
    }
  }
}
  
async function startCamera() {
  if (starting || running) return;

  starting = true;
  $("startBtn").disabled = true;
  setStatus("Starting...");
  setMessage("Loading camera and face tracking...");

  try {
    mindarThree = new MindARThree({
      container,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    scene.add(new THREE.HemisphereLight(
      0xffffff, 0xbbbbff, 1.5
    ));

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 2);
    scene.add(light);

    anchor = mindarThree.addAnchor(1);

    if (!avatar) {
      avatar = new Avatar();
      await avatar.init();
    }

    anchor.group.add(avatar.gltf.scene);
    avatar.gltf.scene.scale.set(2, 2, 2);

    transformControls = new TransformControls(
      camera, renderer.domElement
    );

    transformControls.setMode(currentMode);
    transformControls.setSize(0.8);
    transformControls.enabled = false;
    scene.add(transformControls);

    await mindarThree.start();

    running = true;
    setStatus("Camera running");
    setMessage("Face tracking active.");

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();

      if (trackingEnabled && estimate?.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);
    });

    attachGizmo(avatar.gltf.scene);
    setSizeTarget(avatar.gltf.scene);

  } catch (error) {
    console.error(error);
    setStatus("Start error");
    setMessage(error.message || "Camera could not start.");

    try {
      mindarThree?.renderer?.setAnimationLoop(null);
      await mindarThree?.stop();
    } catch (e) {}

    mindarThree = null;
    running = false;

  } finally {
    starting = false;
    $("startBtn").disabled = false;
  }
}

function attachGizmo(object) {
  if (!transformControls || !object) return;

  transformControls.attach(object);
  transformControls.enabled = gizmoVisible;
  transformControls.visible = gizmoVisible;
}

function setSizeTarget(object) {
  currentSizeObject = object;
  if (!object) return;

  baseScale.copy(object.scale);
  $("sizeSlider").value = 1;
  $("sizeValue").textContent = "100%";
}

$("sizeSlider").addEventListener("input", (event) => {
  if (!currentSizeObject) return;

  const value = Number(event.target.value);

  currentSizeObject.scale.set(
    baseScale.x * value,
    baseScale.y * value,
    baseScale.z * value
  );

  $("sizeValue").textContent =
    Math.round(value * 100) + "%";
});

function fitModelToFace(model) {
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error("Model has invalid dimensions.");
  }

  const targetSize = 1.2;
  const factor = targetSize / maxDimension;

  model.scale.setScalar(factor);
  model.updateMatrixWorld(true);

  const fittedBox = new THREE.Box3().setFromObject(model);
  const center = fittedBox.getCenter(new THREE.Vector3());

  model.position.sub(center);
}

function setMode(mode, buttonId) {
  currentMode = mode;
  transformControls?.setMode(mode);

  ["moveBtn", "rotateBtn", "scaleBtn"].forEach(id => {
    $(id).classList.toggle("active", id === buttonId);
  });
}

$("moveBtn").addEventListener("click", () =>
  setMode("translate", "moveBtn")
);

$("rotateBtn").addEventListener("click", () =>
  setMode("rotate", "rotateBtn")
);

$("scaleBtn").addEventListener("click", () =>
  setMode("scale", "scaleBtn")
);

$("hideGizmoBtn").addEventListener("click", () => {
  gizmoVisible = !gizmoVisible;

  if (transformControls) {
    transformControls.enabled = gizmoVisible;
    transformControls.visible = gizmoVisible;
  }

  $("hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

$("trackingBtn").addEventListener("click", () => {
  trackingEnabled = !trackingEnabled;

  $("trackingBtn").textContent =
    trackingEnabled ? "TRACKING ON" : "TRACKING OFF";

  $("trackingBtn").classList.toggle("active", trackingEnabled);
  setMessage(trackingEnabled
    ? "Tracking updates enabled."
    : "Tracking updates paused.");
});

$("toggleAllBtn").addEventListener("click", () => {
  allVisible = !allVisible;

  document.querySelectorAll(".ui-panel").forEach(panel => {
    panel.classList.toggle("hidden", !allVisible);
  });

  $("toggleAllBtn").textContent =
    allVisible ? "HIDE ALL" : "SHOW ALL";
});

async function stopCamera() {
  if (!mindarThree) return;

  try {
    transformControls?.detach();
    transformControls?.dispose();

    mindarThree.renderer?.setAnimationLoop(null);
    await mindarThree.stop();
  } catch (error) {
    console.error(error);
  }

  mindarThree = null;
  transformControls = null;
  anchor = null;
  running = false;
  container.innerHTML = "";

  setStatus("Camera stopped");
  setMessage("Press START CAMERA.");
}

$("startBtn").addEventListener("click", startCamera);
$("stopBtn").addEventListener("click", stopCamera);

$("switchBtn").addEventListener("click", async () => {
  if (!running || !mindarThree) {
    setMessage("Start camera first.");
    return;
  }

  try {
    await mindarThree.switchCamera();
    setMessage("Camera switched.");
  } catch (error) {
    setMessage("Camera switch failed: " + error.message);
  }
});

function disposeImported() {
  if (!importedContent) return;

  transformControls?.detach();

  importedContent.traverse(child => {
    child.geometry?.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material : [child.material];

      materials.forEach(material => {
        for (const key in material) {
          if (material[key]?.isTexture) {
            material[key].dispose();
          }
        }
        material.dispose();
      });
    }
  });

  importedContent.removeFromParent();
  importedContent = null;
  currentSizeObject = null;

  if (activeVideo) {
    activeVideo.pause();
    activeVideo.removeAttribute("src");
    activeVideo.load();
    activeVideo = null;
  }

  if (activeObjectURL) {
    URL.revokeObjectURL(activeObjectURL);
    activeObjectURL = null;
  }

  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = true;
    attachGizmo(avatar.gltf.scene);
    setSizeTarget(avatar.gltf.scene);
  }
}

async function import3D(file) {
  if (!running || !anchor) {
    setMessage("Start camera before importing.");
    return;
  }

  const url = URL.createObjectURL(file);
  const extension = file.name.split(".").pop().toLowerCase();

  try {
    let model;

    if (extension === "glb" || extension === "gltf") {
      model = (await new GLTFLoader().loadAsync(url)).scene;
    } else if (extension === "obj") {
      model = await new OBJLoader().loadAsync(url);
    } else if (extension === "fbx") {
      model = await new FBXLoader().loadAsync(url);
    } else {
      throw new Error("Unsupported 3D format.");
    }

    disposeImported();

    avatar.gltf.scene.visible = false;
    fitModelToFace(model);

    importedContent = model;
    anchor.group.add(model);

    attachGizmo(model);
    setSizeTarget(model);

    activeObjectURL = url;
    setMessage("Model imported and automatically fitted.");

  } catch (error) {
    URL.revokeObjectURL(url);
    console.error(error);
    setMessage("3D import error: " + error.message);
  }
}

$("importBtn").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (file) await import3D(file);
  fileInput.value = "";
});

function addMediaPlane(texture, video = null, url = null) {
  disposeImported();

  avatar.gltf.scene.visible = false;

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 1.2),
    new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    })
  );

  importedContent = plane;
  anchor.group.add(plane);

  attachGizmo(plane);
  setSizeTarget(plane);

  activeVideo = video;
  activeObjectURL = url;
}

$("imageBtn").addEventListener("click", () => imageInput.click());

imageInput.addEventListener("change", event => {
  const file = event.target.files[0];

  if (!file || !running || !anchor) {
    setMessage("Start camera before importing image.");
    imageInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);

  new THREE.TextureLoader().load(url, texture => {
    addMediaPlane(texture, null, url);
    setMessage("Image imported.");
  }, undefined, error => {
    URL.revokeObjectURL(url);
    setMessage("Image import failed.");
  });

  imageInput.value = "";
});

$("videoBtn").addEventListener("click", () => videoInput.click());

videoInput.addEventListener("change", event => {
  const file = event.target.files[0];

  if (!file || !running || !anchor) {
    setMessage("Start camera before importing video.");
    videoInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const video = document.createElement("video");

  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;

  video.addEventListener("loadeddata", async () => {
    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;

    addMediaPlane(texture, video, url);

    try {
      await video.play();
      setMessage("Video imported and playing.");
    } catch (error) {
      setMessage("Tap screen to play video.");
    }
  }, { once: true });

  videoInput.value = "";
});

$("disposeBtn").addEventListener("click", () => {
  if (!importedContent) {
    setMessage("No imported content.");
    return;
  }

  disposeImported();
  setMessage("Imported content removed.");
});

// Touch gestures on the camera canvas.
// One finger: move model.
// Two fingers: resize and rotate model.
function getCanvas() {
  return container.querySelector("canvas");
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function angle(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function canTouchModel(event) {
  if (!importedContent || !running || !gizmoVisible) {
    return !!importedContent && running;
  }

  const rect = event.currentTarget.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  const pointer = new THREE.Vector2(
    (x / rect.width) * 2 - 1,
    -(y / rect.height) * 2 + 1
  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, mindarThree.camera);

  const hits = raycaster.intersectObject(
    transformControls.getHelper(), true
  );

  return hits.length === 0;
}

function setupTouch() {
  const canvas = getCanvas();
  if (!canvas || canvas.dataset.touchReady) return;

  canvas.dataset.touchReady = "1";

  canvas.addEventListener("pointerdown", event => {
    if (!importedContent || !running) return;
    if (!canTouchModel(event)) return;

    canvas.setPointerCapture(event.pointerId);
    touchPoints.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (touchPoints.size === 2) {
      const points = [...touchPoints.values()];
      previousTouchDistance = distance(points[0], points[1]);
      previousTouchAngle = angle(points[0], points[1]);
    }
  });

  canvas.addEventListener("pointermove", event => {
    if (!touchPoints.has(event.pointerId) || !importedContent) return;

    const old = touchPoints.get(event.pointerId);
    const current = { x: event.clientX, y: event.clientY };
    touchPoints.set(event.pointerId, current);

    if (touchPoints.size === 1) {
      const dx = current.x - old.x;
      const dy = current.y - old.y;

      importedContent.position.x += dx * 0.003;
      importedContent.position.y -= dy * 0.003;
    }

    if (touchPoints.size === 2) {
      const points = [...touchPoints.values()];
      const newDistance = distance(points[0], points[1]);
      const newAngle = angle(points[0], points[1]);

      if (previousTouchDistance > 0) {
        const factor = newDistance / previousTouchDistance;

        importedContent.scale.multiplyScalar(
          THREE.MathUtils.clamp(factor, 0.5, 2)
        );
      }

      importedContent.rotation.z +=
        newAngle - previousTouchAngle;

      previousTouchDistance = newDistance;
      previousTouchAngle = newAngle;

      baseScale.copy(importedContent.scale);
      $("sizeSlider").value = 1;
      $("sizeValue").textContent = "100%";
    }
  });

  function release(event) {
    touchPoints.delete(event.pointerId);

    if (touchPoints.size < 2) {
      previousTouchDistance = 0;
      previousTouchAngle = 0;
    }
  }

  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
}

const touchObserver = new MutationObserver(setupTouch);
touchObserver.observe(container, { childList: true });

$("fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen unavailable.");
  }
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
  } catch (error) {}
});
</script>
</body>
</html>
