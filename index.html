<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#container video,
#container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#controlPanel {
  position: fixed;
  z-index: 20;
  left: 10px;
  right: 10px;
  bottom: 10px;
  max-height: 65dvh;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 14px;
  background: #101010eF;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#controlPanel.hidden {
  display: none;
}

#hideButton {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  font-size: 19px;
  background: #171717eF;
}

#header {
  position: fixed;
  z-index: 15;
  top: 12px;
  left: 12px;
  padding: 10px 12px;
  border-radius: 9px;
  background: #111d;
  font-size: 13px;
  font-weight: bold;
}

#header.hidden {
  display: none;
}

#status {
  color: #00e69a;
  font-size: 11px;
}

.sectionTitle {
  width: 100%;
  font-size: 11px;
  color: #aaa;
  font-weight: bold;
  margin-top: 3px;
}

.buttonRow {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

button {
  padding: 11px 12px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #292929;
  color: white;
  font-size: 11px;
  font-weight: bold;
}

button.active {
  background: #087c4b;
  border-color: #00e69a;
}

.sliderRow {
  display: grid;
  grid-template-columns: 90px 1fr 38px;
  align-items: center;
  gap: 7px;
  font-size: 11px;
}

.sliderRow input {
  width: 100%;
  accent-color: #00e69a;
}

.sliderValue {
  color: #00e69a;
  text-align: right;
}

input[type="file"] {
  display: none;
}

@media (orientation: landscape) {
  #controlPanel {
    left: 10px;
    right: auto;
    bottom: 10px;
    width: min(370px, 48vw);
    max-height: 82dvh;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<div id="header">
  AZEEZ AI AR STUDIO
  <div id="status">CAMERA OFF</div>
</div>

<button id="hideButton">☰</button>

<div id="controlPanel">

  <div class="sectionTitle">CAMERA</div>
  <div class="buttonRow">
    <button id="startBtn">START</button>
    <button id="frontBtn">FRONT</button>
    <button id="backBtn">BACK</button>
    <button id="stopBtn">STOP</button>
  </div>

  <div class="sectionTitle">IMPORT MODEL / MEDIA</div>
  <div class="buttonRow">
    <button id="glbBtn">GLB</button>
    <button id="gltfBtn">GLTF</button>
    <button id="objBtn">OBJ</button>
    <button id="fbxBtn">FBX</button>
    <button id="imageBtn">IMAGE</button>
    <button id="videoBtn">VIDEO</button>
    <button id="removeBtn">REMOVE</button>
  </div>

  <div class="sectionTitle">3D GIZMOS</div>
  <div class="buttonRow">
    <button id="moveBtn">MOVE</button>
    <button id="rotateBtn">ROTATE</button>
    <button id="scaleBtn">SCALE</button>
    <button id="gizmoBtn">HIDE GIZMO</button>
  </div>

  <div class="sectionTitle">POSITION</div>

  <div class="sliderRow">
    <span>Up / Down</span>
    <input id="posY" type="range" min="-2" max="2" step="0.01" value="0">
    <span class="sliderValue" id="posYValue">0</span>
  </div>

  <div class="sliderRow">
    <span>Left / Right</span>
    <input id="posX" type="range" min="-2" max="2" step="0.01" value="0">
    <span class="sliderValue" id="posXValue">0</span>
  </div>

  <div class="sliderRow">
    <span>Front / Back</span>
    <input id="posZ" type="range" min="-2" max="2" step="0.01" value="0">
    <span class="sliderValue" id="posZValue">0</span>
  </div>

  <div class="sectionTitle">ROTATION</div>

  <div class="sliderRow">
    <span>Rotation X</span>
    <input id="rotX" type="range" min="-180" max="180" value="0">
    <span class="sliderValue" id="rotXValue">0</span>
  </div>

  <div class="sliderRow">
    <span>Rotation Y</span>
    <input id="rotY" type="range" min="-180" max="180" value="0">
    <span class="sliderValue" id="rotYValue">0</span>
  </div>

  <div class="sliderRow">
    <span>Rotation Z</span>
    <input id="rotZ" type="range" min="-180" max="180" value="0">
    <span class="sliderValue" id="rotZValue">0</span>
  </div>

  <div class="sectionTitle">MODEL SIZE</div>

  <div class="sliderRow">
    <span>Small / Large</span>
    <input id="modelSize" type="range"
      min="0.05" max="10" step="0.05" value="1">
    <span class="sliderValue" id="modelSizeValue">1x</span>
  </div>

</div>

<input id="glbFile" type="file" accept=".glb">
<input id="gltfFile" type="file" accept=".gltf,.glb">
<input id="objFile" type="file" accept=".obj">
<input id="fbxFile" type="file" accept=".fbx">
<input id="imageFile" type="file" accept="image/*">
<input id="videoFile" type="file" accept="video/*">

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";

const $ = (id) => document.getElementById(id);

let mindarThree = null;
let anchor = null;
let transformControls = null;

let activeModel = null;
let running = false;
let gizmoVisible = true;
let currentCamera = "user";

let activeVideo = null;
let activeObjectURL = null;

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const fbxLoader = new FBXLoader();

function setStatus(message) {
  $("status").textContent = message;
}

</script>

</body>
</html>
