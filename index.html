<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez Hero - VR App</title>
    <style>
        body {
            margin: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100vh;
        }
        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .controls {
            position: relative;
            bottom: 30px;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <!-- Video element to display camera feed -->
    <video id="videoElement" autoplay playsinline></video>

    <!-- Controls -->
    <div class="controls">
        <button id="switchCameraBtn">Switch Camera (Front/Back)</button>
        <button id="recordBtn">Start Recording</button>
    </div>

    <script>
        let currentFacingMode = 'user'; // 'user' for front, 'environment' for back
        let videoStream = null;

        const videoElement = document.getElementById('videoElement');
        const switchCameraBtn = document.getElementById('switchCameraBtn');

        async function startCamera(facingMode) {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { facingMode: facingMode },
                    audio: true
                };
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = videoStream;
            } catch (error) {
                console.error("Error starting camera:", error);
                alert("Camera access could not be granted!");
            }
        }

        // Button to switch camera
        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        // Start front camera as soon as the app loads
        startCamera(currentFacingMode);
    </script>

</body>
</html>
