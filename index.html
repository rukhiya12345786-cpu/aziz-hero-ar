<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Azeez AR - Universal Head Tracking</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#cameraStream{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    color:#fff;
    background:rgba(0,0,0,.65);

    padding:8px 15px;
    border-radius:20px;

    font-size:13px;
    white-space:nowrap;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    z-index:40;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;

    padding:10px;

    background:rgba(0,0,0,.75);
}

button,
label{
    border:0;
    border-radius:9px;

    padding:10px 13px;

    background:#fff;
    color:#111;

    font-size:13px;
    font-weight:bold;
}

button:active,
label:active{
    transform:scale(.96);
}

input[type=file]{
    display:none;
}

.sliderBox{
    width:100%;
    max-width:430px;

    color:#fff;
    font-size:12px;
}

.sliderBox input{
    width:100%;
}

#loading{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:rgba(0,0,0,.65);

    color:#fff;

    align-items:center;
    justify-content:center;

    font-size:18px;
}
</style>


<!-- THREE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- LOADERS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

</head>

<body>

<video
    id="cameraStream"
    autoplay
    muted
    playsinline>
</video>

<canvas id="threeCanvas"></canvas>

<div id="status">
    Starting...
</div>

<div id="loading">
    Loading 3D Character...
</div>


<div id="controls">

    <label>
        Import 3D
        <input
            id="modelInput"
            type="file"
            accept=".glb,.gltf,.obj,.fbx">
    </label>

    <button id="flipBtn">
        Flip Camera
    </button>

    <button id="resetBtn">
        Reset
    </button>


    <div class="sliderBox">
        Character Size
        <input
            id="scaleSlider"
            type="range"
            min="0.5"
            max="2.5"
            step="0.01"
            value="1">
    </div>


    <div class="sliderBox">
        Head Up / Down
        <input
            id="headYSlider"
            type="range"
            min="-0.6"
            max="0.6"
            step="0.01"
            value="0">
    </div>


    <div class="sliderBox">
        Head Forward / Back
        <input
            id="headZSlider"
            type="range"
            min="-0.5"
            max="0.5"
            step="0.01"
            value="0">
    </div>


    <button id="snapshotBtn">
        Snapshot
    </button>

    <button id="recordBtn">
        Rec
    </button>

    <button id="stopBtn">
        Stop
    </button>

    <button id="downloadBtn">
        Download
    </button>

</div>


<script>

/* =========================================================
   GLOBALS
   ========================================================= */

const video =
    document.getElementById("cameraStream");

const canvas =
    document.getElementById("threeCanvas");

const statusEl =
    document.getElementById("status");

const loadingEl =
    document.getElementById("loading");


let scene;
let renderer;
let arCamera;

let faceMesh;
let cameraController;

let modelContainer = null;
let currentModel = null;

let useFrontCamera = true;

let faceDetected = false;


/* =========================================================
   USER ADJUSTMENTS
   ========================================================= */

let userScale = 1;

let headYOffset = 0;

let headZOffset = 0;


/* =========================================================
   SMOOTH TRACKING
   ========================================================= */

const tracking = {

    x:0,
    y:0,
    z:0,

    yaw:0,
    pitch:0,
    roll:0,

    scale:1
};


/* =========================================================
   MODEL BASE DATA
   ========================================================= */

let modelBaseScale = 1;


/* =========================================================
   THREE INIT
   ========================================================= */

function init3D(){

    scene =
        new THREE.Scene();


    arCamera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,

            0.01,
            100
        );


    /*
       Camera is fixed.

       The AR character moves relative
       to this camera.
    */

    arCamera.position.set(
        0,
        0,
        3
    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:canvas,

            alpha:true,

            antialias:true,

            preserveDrawingBuffer:true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    /* =====================================================
       LIGHTS
       ===================================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.6
        );

    scene.add(
        ambient
    );


    const light1 =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    light1.position.set(
        2,
        4,
        5
    );

    scene.add(
        light1
    );


    const light2 =
        new THREE.DirectionalLight(
            0xffffff,
            0.8
        );

    light2.position.set(
        -3,
        2,
        3
    );

    scene.add(
        light2
    );


    /* =====================================================
       HEAD CONTAINER

       THIS is the important part.

       We attach the character to this container,
       not directly to the face.
    ===================================================== */

    modelContainer =
        new THREE.Group();


    modelContainer.visible =
        false;


    scene.add(
        modelContainer
    );


    /* =====================================================
       RENDER
    ===================================================== */

    function render(){

        requestAnimationFrame(
            render
        );


        renderer.render(
            scene,
            arCamera
        );
    }


    render();


    window.addEventListener(
        "resize",
        resizeRenderer
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeRenderer(){

    if(
        !renderer ||
        !arCamera
    ){

        return;
    }


    arCamera.aspect =
        window.innerWidth /
        window.innerHeight;


    arCamera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   FACE MESH
   ========================================================= */

function initFaceTracking(){

    faceMesh =
        new FaceMesh({

            locateFile:function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/face_mesh/" +
                    file
                );
            }
        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.6,

        minTrackingConfidence:0.6
    });


    faceMesh.onResults(
        onFaceResults
    );
}


/* =========================================================
   FACE TRACKING
   ========================================================= */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        faceDetected =
            false;


        if(modelContainer){

            modelContainer.visible =
                false;
        }


        statusEl.innerText =
            "Face not detected";

        return;
    }


    faceDetected =
        true;


    modelContainer.visible =
        currentModel !== null;


    const lm =
        results.multiFaceLandmarks[0];


    /* =====================================================
       IMPORTANT LANDMARKS
    ===================================================== */

    const nose =
        lm[1];

    const forehead =
        lm[10];

    const chin =
        lm[152];

    const leftFace =
        lm[234];

    const rightFace =
        lm[454];

    const leftEye =
        lm[33];

    const rightEye =
        lm[263];


    /* =====================================================
       FACE WIDTH
    ===================================================== */

    const faceWidth =
        Math.abs(
            rightFace.x -
            leftFace.x
        );


    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    /* =====================================================
       HEAD ANCHOR

       IMPORTANT:

       We DON'T use nose as character center.

       The anchor is moved toward the forehead/top
       of the head.

       This prevents the character from appearing
       like it is floating in front of the face.
    ===================================================== */

    const headAnchorX =
        (
            leftFace.x +
            rightFace.x
        ) / 2;


    /*
       Forehead is above the face.

       Move a little above forehead so helmets,
       masks and head characters sit around the head.
    */

    const headAnchorY =
        forehead.y -
        faceHeight * 0.16;


    /* =====================================================
       SCREEN POSITION
    ===================================================== */

    const targetX =
        (0.5 - headAnchorX)
        * 3.2;


    const targetY =
        (0.5 - headAnchorY)
        * 2.6
        +
        headYOffset;


    /*
       Z is kept stable.

       Raw MediaPipe z is NOT used as absolute
       character depth because that causes jumping.
    */

    const targetZ =
        headZOffset;


    /* =====================================================
       YAW

       Use nose relative to cheek center.
    ===================================================== */

    const cheekCenterX =
        (
            leftFace.x +
            rightFace.x
        ) / 2;


    const yawAmount =
        (
            nose.x -
            cheekCenterX
        ) /
        Math.max(
            faceWidth,
            0.001
        );


    const targetYaw =
        THREE.MathUtils.clamp(
            yawAmount * 2.8,
            -1.15,
            1.15
        );


    /* =====================================================
       ROLL
    ===================================================== */

    const eyeDX =
        rightEye.x -
        leftEye.x;


    const eyeDY =
        rightEye.y -
        leftEye.y;


    const targetRoll =
        -Math.atan2(
            eyeDY,
            eyeDX
        );


    /* =====================================================
       PITCH
    ===================================================== */

    const faceVertical =
        Math.max(
            faceHeight,
            0.001
        );


    const noseFromForehead =
        nose.y -
        forehead.y;


    const pitchRatio =
        noseFromForehead /
        faceVertical;


    const targetPitch =
        THREE.MathUtils.clamp(
            (pitchRatio - 0.48)
            * 2.2,

            -0.75,
            0.75
        );


    /* =====================================================
       AUTOMATIC SCALE

       Character size follows face size.
    ===================================================== */

    const targetScale =
        THREE.MathUtils.clamp(
            faceWidth * 6.8,
            0.45,
            2.8
        )
        *
        userScale
        *
        modelBaseScale;


    /* =====================================================
       SMOOTHING
    ===================================================== */

    const smoothAmount =
        0.32;


    tracking.x +=
        (
            targetX -
            tracking.x
        )
        *
        smoothAmount;


    tracking.y +=
        (
            targetY -
            tracking.y
        )
        *
        smoothAmount;


    tracking.z +=
        (
            targetZ -
            tracking.z
        )
        *
        smoothAmount;


    tracking.yaw +=
        (
            targetYaw -
            tracking.yaw
        )
        *
        smoothAmount;


    tracking.pitch +=
        (
            targetPitch -
            tracking.pitch
        )
        *
        smoothAmount;


    tracking.roll +=
        (
            targetRoll -
            tracking.roll
        )
        *
        smoothAmount;


    tracking.scale +=
        (
            targetScale -
            tracking.scale
        )
        *
        smoothAmount;


    /* =====================================================
       APPLY TO HEAD CONTAINER
    ===================================================== */

    modelContainer.position.set(
        tracking.x,
        tracking.y,
        tracking.z
    );


    modelContainer.rotation.order =
        "YXZ";


    modelContainer.rotation.y =
        tracking.yaw;


    modelContainer.rotation.x =
        tracking.pitch;


    modelContainer.rotation.z =
        tracking.roll;


    modelContainer.scale.setScalar(
        tracking.scale
    );


    statusEl.innerText =
        "HEAD TRACKING ON";
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera(){

    try{

        statusEl.innerText =
            "Starting camera...";


        if(cameraController){

            try{

                cameraController.stop();

            }catch(e){}

            cameraController =
                null;
        }


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();
                    }
                );


            video.srcObject =
                null;
        }


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{

                    facingMode:
                        useFrontCamera
                        ? "user"
                        : "environment",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false
            });


        video.srcObject =
            stream;


        await video.play();


        cameraController =
            new Camera(

                video,

                {

                    onFrame:
                    async function(){

                        await faceMesh.send({
                            image:video
                        });
                    },

                    width:640,

                    height:480
                }
            );


        cameraController.start();


        statusEl.innerText =
            "Camera ON";


    }catch(error){

        console.error(error);

        statusEl.innerText =
            "Camera Error";
    }
}


/* =========================================================
   FLIP
   ========================================================= */

document
.getElementById("flipBtn")
.addEventListener(
    "click",
    async function(){

        useFrontCamera =
            !useFrontCamera;

        await startCamera();
    }
);


/* =========================================================
   USER CONTROLS
   ========================================================= */

document
.getElementById("scaleSlider")
.addEventListener(
    "input",
    function(){

        userScale =
            parseFloat(
                this.value
            );
    }
);


document
.getElementById("headYSlider")
.addEventListener(
    "input",
    function(){

        headYOffset =
            parseFloat(
                this.value
            );
    }
);


document
.getElementById("headZSlider")
.addEventListener(
    "input",
    function(){

        headZOffset =
            parseFloat(
                this.value
            );
    }
);


/* =========================================================
   RESET
   ========================================================= */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    function(){

        userScale = 1;

        headYOffset = 0;

        headZOffset = 0;


        document
        .getElementById("scaleSlider")
        .value = 1;


        document
        .getElementById("headYSlider")
        .value = 0;


        document
        .getElementById("headZSlider")
        .value = 0;
    }
);/* =========================================================
   UNIVERSAL MODEL NORMALIZATION
   ========================================================= */

function prepareModel(object){

    /*
       Remove previous character
    */

    if(currentModel){

        modelContainer.remove(
            currentModel
        );

        currentModel =
            null;
    }


    currentModel =
        object;


    /*
       Put model inside head container.
    */

    modelContainer.add(
        currentModel
    );


    /* =====================================================
       FIND MODEL BOUNDING BOX
    ===================================================== */

    let box =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );


    const size =
        new THREE.Vector3();


    const center =
        new THREE.Vector3();


    box.getSize(
        size
    );


    box.getCenter(
        center
    );


    const biggest =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        !isFinite(biggest) ||
        biggest <= 0
    ){

        throw new Error(
            "Invalid 3D model"
        );
    }


    /* =====================================================
       NORMALIZE MODEL

       Every imported model becomes approximately
       the same physical size.
    ===================================================== */

    const standardSize =
        1.9;


    const normalizeFactor =
        standardSize /
        biggest;


    currentModel.scale.setScalar(
        normalizeFactor
    );


    /*
       Recalculate bounding box after scaling.
    */

    box =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );


    box.getCenter(
        center
    );


    /*
       Move model to container center.
    */

    currentModel.position.x -=
        center.x;


    currentModel.position.y -=
        center.y;


    currentModel.position.z -=
        center.z;


    /* =====================================================
       IMPORTANT HEAD OFFSET
       
       The model is placed slightly above the
       face anchor.

       This is what makes the character sit on
       the head instead of hanging in front of
       the face.
    ===================================================== */

    currentModel.position.y +=
        0.15;


    /*
       Slightly behind the face plane.

       This prevents the model from looking
       like it is floating far in front.
    */

    currentModel.position.z -=
        0.10;


    /* =====================================================
       MATERIAL / MESH
    ===================================================== */

    currentModel.traverse(
        function(child){

            if(child.isMesh){

                child.frustumCulled =
                    false;


                child.castShadow =
                    true;


                child.receiveShadow =
                    true;


                if(child.material){

                    child.material
                        .side =
                        THREE.DoubleSide;
                }
            }
        }
    );


    /*
       Character visible only when face exists.
    */

    modelContainer.visible =
        faceDetected;


    statusEl.innerText =
        "3D HEAD READY";
}


/* =========================================================
   GLB / GLTF LOADER
   ========================================================= */

function loadGLTF(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const loader =
                        new THREE.GLTFLoader();


                    loader.parse(

                        event.target.result,

                        "",

                        function(gltf){

                            resolve(
                                gltf.scene
                            );
                        },

                        function(error){

                            reject(error);
                        }
                    );
                };


            reader.onerror =
                function(error){

                    reject(error);
                };


            reader.readAsArrayBuffer(
                file
            );
        }
    );
}


/* =========================================================
   OBJ
   ========================================================= */

function loadOBJ(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    try{

                        const loader =
                            new THREE.OBJLoader();


                        const object =
                            loader.parse(
                                event.target.result
                            );


                        resolve(
                            object
                        );

                    }catch(error){

                        reject(error);
                    }
                };


            reader.onerror =
                function(error){

                    reject(error);
                };


            reader.readAsText(
                file
            );
        }
    );
}


/* =========================================================
   FBX
   ========================================================= */

function loadFBX(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    try{

                        const loader =
                            new THREE.FBXLoader();


                        const object =
                            loader.parse(
                                event.target.result,
                                ""
                            );


                        resolve(
                            object
                        );

                    }catch(error){

                        reject(error);
                    }
                };


            reader.onerror =
                function(error){

                    reject(error);
                };


            reader.readAsArrayBuffer(
                file
            );
        }
    );
}


/* =========================================================
   IMPORT
   ========================================================= */

document
.getElementById("modelInput")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;
        }


        const filename =
            file.name.toLowerCase();


        loadingEl.style.display =
            "flex";


        statusEl.innerText =
            "Loading 3D Head...";


        try{

            let object;


            if(
                filename.endsWith(".glb") ||
                filename.endsWith(".gltf")
            ){

                object =
                    await loadGLTF(
                        file
                    );
            }

            else if(
                filename.endsWith(".obj")
            ){

                object =
                    await loadOBJ(
                        file
                    );
            }

            else if(
                filename.endsWith(".fbx")
            ){

                object =
                    await loadFBX(
                        file
                    );
            }

            else{

                throw new Error(
                    "Unsupported format"
                );
            }


            /*
               Universal preparation
            */

            prepareModel(
                object
            );


        }catch(error){

            console.error(
                error
            );


            alert(
                "3D model load nahi hua.\n\n" +
                "GLB format sabse reliable hai."
            );


            statusEl.innerText =
                "3D Load Failed";

        }finally{

            loadingEl.style.display =
                "none";
        }
    }
);


/* =========================================================
   SNAPSHOT
   ========================================================= */

document
.getElementById("snapshotBtn")
.addEventListener(
    "click",
    function(){

        const output =
            document.createElement(
                "canvas"
            );


        output.width =
            video.videoWidth ||
            window.innerWidth;


        output.height =
            video.videoHeight ||
            window.innerHeight;


        const ctx =
            output.getContext(
                "2d"
            );


        /*
           Mirror camera
        */

        ctx.save();


        ctx.translate(
            output.width,
            0
        );


        ctx.scale(
            -1,
            1
        );


        ctx.drawImage(
            video,
            0,
            0,
            output.width,
            output.height
        );


        ctx.restore();


        /*
           Draw 3D layer
        */

        ctx.drawImage(
            canvas,
            0,
            0,
            output.width,
            output.height
        );


        const a =
            document.createElement(
                "a"
            );


        a.download =
            "azeez-ar.jpg";


        a.href =
            output.toDataURL(
                "image/jpeg",
                0.95
            );


        a.click();
    }
);


/* =========================================================
   RECORDING
   ========================================================= */

let mediaRecorder =
    null;

let recordedChunks =
    [];


document
.getElementById("recordBtn")
.addEventListener(
    "click",
    function(){

        if(
            !canvas.captureStream
        ){

            alert(
                "Recording supported nahi hai."
            );

            return;
        }


        recordedChunks =
            [];


        const stream =
            canvas.captureStream(
                30
            );


        try{

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            "video/webm"
                    }
                );

        }catch(e){

            mediaRecorder =
                new MediaRecorder(
                    stream
                );
        }


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            function(){

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                "video/webm"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;


                a.download =
                    "azeez-ar.webm";


                a.click();


                setTimeout(
                    function(){

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );
            };


        mediaRecorder.start();


        statusEl.innerText =
            "Recording ON";
    }
);


/* =========================================================
   STOP
   ========================================================= */

document
.getElementById("stopBtn")
.addEventListener(
    "click",
    function(){

        if(
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ){

            mediaRecorder.stop();


            statusEl.innerText =
                "Recording Saved";
        }
    }
);


/* =========================================================
   DOWNLOAD BUTTON
   ========================================================= */

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    function(){

        if(
            recordedChunks.length === 0
        ){

            alert(
                "Pehle recording karein."
            );

            return;
        }


        const blob =
            new Blob(
                recordedChunks,
                {
                    type:
                        "video/webm"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "azeez-ar-video.webm";


        a.click();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );
    }
);


/* =========================================================
   START APP
   ========================================================= */

async function startApp(){

    init3D();

    initFaceTracking();

    await startCamera();
}


startApp();

</script>
