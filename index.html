<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aijaz AR Head Tracking Studio - Pro Max</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        
        #webcam { position: absolute; top: 15px; left: 15px; width: 120px; height: 90px; transform: scaleX(-1); border-radius: 8px; z-index: 10; border: 2px solid #00ff88; object-fit: cover; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-panel {
            position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .btn-group { display: flex; gap: 8px; }
        .btn {
            background: #00ff88; color: #000; border: none;
            padding: 10px 16px; font-size: 12px; border-radius: 20px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,255,136,0.3);
        }
        .btn:active { background: #00cc6a; }
        .btn-red { background: #ff4757; color: #fff; box-shadow: 0 4px 10px rgba(255,71,87,0.3); }

        /* Controls Panel for Adjusting Model */
        .controls-panel {
            position: absolute; bottom: 80px; left: 15px; right: 15px; z-index: 20;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column; gap: 8px; color: #fff; font-size: 11px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .control-row input { width: 70%; cursor: pointer; }

        .status-bar {
            position: absolute; bottom: 15px; left: 15px; right: 15px; text-align: center;
            z-index: 20; color: #fff; font-size: 12px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>

    <!-- Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- MediaPipe & Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="ui-panel">
        <div class="btn-group">
            <button id="upload-btn" class="btn">📁 Import Model</button>
            <button id="record-btn" class="btn btn-red">🔴 Record Video</button>
        </div>
        <input type="file" id="file-input" style="display: none;" accept=".obj,.glb,.gltf,.fbx">
    </div>

    <!-- Model Adjustment Sliders -->
    <div class="controls-panel">
        <div class="control-row">
            <span>Size (Scale):</span>
            <input type="range" id="scale-slider" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="control-row">
            <span>Forward/Backward (Z):</span>
            <input type="range" id="posz-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
        </div>
        <div class="control-row">
            <span>Manual Rotate Y:</span>
            <input type="range" id="roty-slider" min="-3.14" max="3.14" step="0.1" value="0.0">
        </div>
    </div>

    <div id="webgl-container"></div>
    <div class="status-bar" id="status">Initializing Camera and 3D Studio...</div>

    <script>
        let scene, camera, renderer, videoElement;
        let currentModel = null;
        let targetRotation = new THREE.Euler();
        let currentRotation = new THREE.Euler();
        
        // Custom adjustment offsets
        let userScale = 1.0;
        let userPosZ = 0.0;
        let userRotY = 0.0;
        let baseScaleMultiplier = 1.2;

        // MediaRecorder variables
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 2.5));
            const light1 = new THREE.DirectionalLight(0xffffff, 2.0);
            light1.position.set(0, 10, 10);
            scene.add(light1);
            const light2 = new THREE.DirectionalLight(0xffffff, 1.0);
            light2.position.set(0, -10, -10);
            scene.add(light2);

            loadDefaultHead();

            // UI Listeners
            document.getElementById('upload-btn').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            // Sliders hooks
            document.getElementById('scale-slider').addEventListener('input', (e) => {
                userScale = parseFloat(e.target.value);
            });
            document.getElementById('posz-slider').addEventListener('input', (e) => {
                userPosZ = parseFloat(e.target.value);
            });
            document.getElementById('roty-slider').addEventListener('input', (e) => {
                userRotY = parseFloat(e.target.value);
            });

            // Video Recording hook
            document.getElementById('record-btn').addEventListener('click', toggleRecording);

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileURL = URL.createObjectURL(file);
                const ext = file.name.split('.').pop().toLowerCase();

                document.getElementById('status').innerText = "Loading and processing your 3D model...";

                const setupModel = (object) => {
                    if (currentModel) scene.remove(currentModel);
                    
                    object.traverse((child) => {
                        if (child.isMesh) {
                            if (!child.material || child.material.opacity === 0) {
                                child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
                            } else {
                                child.material.side = THREE.DoubleSide;
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    object.position.sub(center);

                    const maxAxis = Math.max(size.x, size.y, size.z);
                    if (maxAxis > 0) {
                        baseScaleMultiplier = 1.2 / maxAxis;
                    }

                    currentModel = object;
                    scene.add(currentModel);
                    document.getElementById('status').innerText = "Success! Custom model loaded & tracking active.";
                };

                if (ext === 'obj') {
                    new THREE.OBJLoader().load(fileURL, (obj) => setupModel(obj), undefined, () => alert("Failed to load OBJ"));
                } else if (ext === 'glb' || ext === 'gltf') {
                    new THREE.GLTFLoader().load(fileURL, (gltf) => setupModel(gltf.scene), undefined, () => alert("Failed to load GLB"));
                } else if (ext === 'fbx') {
                    new THREE.FBXLoader().load(fileURL, (obj) => setupModel(obj), undefined, () => alert("Failed to load FBX"));
                }
            });

            startTracking();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function loadDefaultHead() {
            const group = new THREE.Group();
            const geometry = new THREE.BoxGeometry(0.5, 0.6, 0.5);
            const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);
            currentModel = group;
            scene.add(currentModel);
        }

        function toggleRecording() {
            const recordBtn = document.getElementById('record-btn');
            if (!isRecording) {
                recordedChunks = [];
                const canvasStream = renderer.domElement.captureStream(30); // 30 FPS
                try {
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(canvasStream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'aijaz-ar-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.getElementById('status').innerText = "Video saved successfully!";
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "⏹️ Stop Recording";
                recordBtn.style.background = "#ffa502";
                document.getElementById('status').innerText = "Recording video...";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Record Video";
                recordBtn.style.background = "#ff4757";
            }
        }

        function startTracking() {
            videoElement = document.getElementById('webcam');

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];
                    const riggedFace = Kalidokit.Face.solve(landmarks, {
                        runtime: "mediapipe",
                        video: videoElement
                    });

                    if (riggedFace) {
                        targetRotation.x = riggedFace.head.x;
                        targetRotation.y = riggedFace.head.y;
                        targetRotation.z = riggedFace.head.z;
                    }
                }
            });

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    if (videoElement && videoElement.readyState >= 2) {
                        await faceMesh.send({ image: videoElement });
                    }
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (currentModel) {
                // Smooth rotation interpolation + manual Y offset
                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.2;
                currentRotation.y += ((targetRotation.y + userRotY) - currentRotation.y) * 0.2;
                currentRotation.z += (targetRotation.z - currentRotation.z) * 0.2;

                currentModel.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z, 'YXZ');
                
                // Apply user scaling and depth position
                const finalScale = baseScaleMultiplier * userScale;
                currentModel.scale.set(finalScale, finalScale, finalScale);
                currentModel.position.z = userPosZ;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
