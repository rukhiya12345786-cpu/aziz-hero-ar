
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZEEZ AI AR STUDIO</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    #view {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 400px;
      overflow: hidden;
      background: #101010;
      isolation: isolate;
    }

    #cameraVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #dotsCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      padding: 8px 12px;
      border-radius: 8px;
      background: #000b;
      color: #00ff80;
      font-size: 13px;
    }

    #controls {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 12px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    button, .controlButton {
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px 12px;
      background: #202020ee;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    button:active {
      background: #087f46;
    }

    #view h2 {
      position: absolute;
      top: 38px;
      left: 10px;
      z-index: 20;
      margin: 0;
      font-size: 18px;
      text-shadow: 0 1px 4px black;
    }

    @media (orientation: landscape) {
      #controls {
        left: auto;
        right: 8px;
        top: 8px;
        bottom: auto;
        max-width: 48%;
      }
    }
  </style>
</head>

<body>
  <div id="view">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="dotsCanvas"></canvas>

    <div id="status">Ready — Start Camera</div>
    <h2>AZEEZ AI AR STUDIO</h2>

    <div id="controls">
      <button id="startBtn">Start Camera</button>
      <button id="switchBtn">Front / Back</button>
      <button id="mirrorBtn">Mirror</button>
      <button id="fullscreenBtn">Fullscreen</button>
      <button id="trackingBtn">Start Tracking</button>
      <button id="stopTrackingBtn">Stop Tracking</button>
      <button id="dotsBtn">Hide / Show Dots</button>
      <button id="stopBtn">Stop Camera</button>
    </div>
  </div>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    const video = document.getElementById("cameraVideo");
    const canvas = document.getElementById("dotsCanvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    const startBtn = document.getElementById("startBtn");
    const switchBtn = document.getElementById("switchBtn");
    const mirrorBtn = document.getElementById("mirrorBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const trackingBtn = document.getElementById("trackingBtn");
    const stopTrackingBtn = document.getElementById("stopTrackingBtn");
    const dotsBtn = document.getElementById("dotsBtn");
    const stopBtn = document.getElementById("stopBtn");

    let stream = null;
    let faceLandmarker = null;
    let tracking = false;
    let mirrored = true;
    let showDots = true;
    let facingMode = "user";
    let lastVideoTime = -1;

    function setStatus(message) {
      status.textContent = message;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    resizeCanvas();

    async function loadFaceLandmarker() {
      if (faceLandmarker) return faceLandmarker;

      setStatus("Loading face tracking...");

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 4,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: true
      });

      return faceLandmarker;
    }

    async function startCamera() {
      try {
        stopCamera(false);

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        resizeCanvas();
        setStatus("Camera ready");
      } catch (error) {
        setStatus("Camera error: " + error.message);
      }
    }

    function stopCamera(updateStatus = true) {
      tracking = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (updateStatus) setStatus("Camera stopped");
    }

    function drawFaces(result) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      if (!showDots || !result.faceLandmarks) return;

      for (const landmarks of result.faceLandmarks) {
        for (const point of landmarks) {
          const x = (mirrored ? 1 - point.x : point.x) * width;
          const y = point.y * height;

          ctx.beginPath();
          ctx.arc(x, y, 1.7, 0, Math.PI * 2);
          ctx.fillStyle = "#00ff66";
          ctx.fill();
        }
      }
    }

    async function trackingLoop() {
      if (!tracking) return;

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        try {
          const result = faceLandmarker.detectForVideo(
            video,
            performance.now()
          );

          drawFaces(result);
          setStatus(
            result.faceLandmarks?.length
              ? "Tracking: " + result.faceLandmarks.length + " face(s)"
              : "Camera ready — no face detected"
          );
        } catch (error) {
          setStatus("Tracking error: " + error.message);
        }
      }

      requestAnimationFrame(trackingLoop);
    }

    startBtn.addEventListener("click", startCamera);

    switchBtn.addEventListener("click", async () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      mirrored = facingMode === "user";
      video.style.transform = mirrored ? "scaleX(-1)" : "none";
      await startCamera();
    });

    mirrorBtn.addEventListener("click", () => {
      mirrored = !mirrored;
      video.style.transform = mirrored ? "scaleX(-1)" : "none";
      if (tracking) setStatus("Mirror updated");
    });

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.getElementById("view").requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        setStatus("Fullscreen unavailable on this browser");
      }
    });

    trackingBtn.addEventListener("click", async () => {
      try {
        if (!stream) await startCamera();
        await loadFaceLandmarker();

        tracking = true;
        lastVideoTime = -1;
        setStatus("Tracking started");
        requestAnimationFrame(trackingLoop);
      } catch (error) {
        setStatus("Tracking setup error: " + error.message);
      }
    });

    stopTrackingBtn.addEventListener("click", () => {
      tracking = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setStatus("Tracking stopped");
    });

    dotsBtn.addEventListener("click", () => {
      showDots = !showDots;

      if (!showDots) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      dotsBtn.textContent = showDots ? "Hide Dots" : "Show Dots";
    });

    stopBtn.addEventListener("click", () => stopCamera());

    video.style.transform = "scaleX(-1)";
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
