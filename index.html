<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

#threeCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#landmarkCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 20;
}

#status {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,0.78);
    color: #00ff00;
    font-size: 14px;
    font-weight: bold;
}

button {
    display: block;
    margin-top: 10px;
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
}

#startButton {
    background: #00ff00;
    color: #000;
}

#modelButton {
    background: #ffffff;
    color: #000;
}

#modelInput {
    display: none;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js?v=15",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<canvas id="threeCanvas"></canvas>

<canvas id="landmarkCanvas"></canvas>

<div id="ui">

    <div id="status">
        READY
    </div>

    <button id="startButton">
        START CAMERA
    </button>

    <button id="modelButton">
        LOAD GLB MODEL
    </button>

    <input
        id="modelInput"
        type="file"
        accept=".glb">
</div>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


const video =
    document.getElementById("camera");

const threeCanvas =
    document.getElementById("threeCanvas");

const landmarkCanvas =
    document.getElementById("landmarkCanvas");

const status =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");

const modelButton =
    document.getElementById("modelButton");

const modelInput =
    document.getElementById("modelInput");


let faceLandmarker = null;
let trackingStarted = false;
let loadedModel = null;


/* THREE */

const renderer =
    new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


const scene =
    new THREE.Scene();


const threeCamera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

threeCamera.position.set(
    0,
    0,
    5
);


/* HEAD ANCHOR */

const anchor =
    new THREE.Group();

scene.add(anchor);


/* TEST CUBE */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );

const cubeMaterial =
    new THREE.MeshNormalMaterial({
        transparent: true,
        opacity: 0.65
    });

const cube =
    new THREE.Mesh(
        cubeGeometry,
        cubeMaterial
    );

cube.scale.set(
    0.45,
    0.45,
    0.45
);

anchor.add(cube);


/* GLB LOADER */

const gltfLoader =
    new GLTFLoader();


/* CAMERA */

async function startCamera() {

    try {

        status.textContent =
            "OPENING CAMERA...";

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            status.textContent =
                "CAMERA NOT SUPPORTED";

            return;
        }

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },
                audio: false
            });

        video.srcObject =
            stream;

        await video.play();

        status.textContent =
            "CAMERA OK";

        startButton.style.display =
            "none";

        await loadFaceTracker();

    } catch (error) {

        console.error(error);

        status.textContent =
            "CAMERA ERROR";
    }
}


/* FACE TRACKER */

async function loadFaceTracker() {

    try {

        status.textContent =
            "LOADING FACE TRACKER...";

        const vision =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs?v=15"
            );

        const {
            FaceLandmarker,
            FilesetResolver
        } = vision;


        const filesetResolver =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
            );


        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                filesetResolver,
                {
                    baseOptions: {

                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                        delegate: "GPU"
                    },

                    runningMode: "VIDEO",

                    numFaces: 1,

                    outputFaceBlendshapes:
                        false,

                    outputFacialTransformationMatrixes:
                        true
                }
            );


        status.textContent =
            "FACE TRACKER READY";

        trackingStarted = true;

        requestAnimationFrame(
            trackFace
        );

    } catch (error) {

        console.error(error);

        status.textContent =
            "TRACKER ERROR";
    }
}


/* GREEN LANDMARKS */

function drawLandmarks(landmarks) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    landmarkCanvas.width =
        Math.round(width * dpr);

    landmarkCanvas.height =
        Math.round(height * dpr);


    const ctx =
        landmarkCanvas.getContext("2d");

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (
        const point of landmarks
    ) {

        const x =
            point.x * width;

        const y =
            point.y * height;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            12,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(0,255,0,0.25)";

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ff00";

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }
}


/* GLB BUTTON */

modelButton.addEventListener(
    "click",
    () => {

        modelInput.click();

    }
);


/* GLB FILE */

modelInput.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        status.textContent =
            "LOADING 3D MODEL...";


        try {

            const arrayBuffer =
                await file.arrayBuffer();


            gltfLoader.parse(
                arrayBuffer,
                "",
                (gltf) => {

                    if (loadedModel) {

                        anchor.remove(
                            loadedModel
                        );
                    }


                    anchor.remove(
                        cube
                    );


                    loadedModel =
                        gltf.scene;


                    loadedModel.scale.set(
                        1,
                        1,
                        1
                    );

                    loadedModel.position.set(
                        0,
                        0,
                        0
                    );


                    anchor.add(
                        loadedModel
                    );


                    status.textContent =
                        "GLB MODEL LOADED";
                },

                undefined,

                (error) => {

                    console.error(error);

                    status.textContent =
                        "GLB LOAD ERROR";
                }
            );

        } catch (error) {

            console.error(error);

            status.textContent =
                "MODEL ERROR";
        }
    }
);function updateHeadAnchor(
    landmarks,
    transformationMatrix
) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const nose =
        landmarks[1];

    const leftEye =
        landmarks[33];

    const rightEye =
        landmarks[263];


    /* Face position */

    const faceX =
        nose.x * width;

    const faceY =
        nose.y * height;


    const normalizedX =
        (faceX / width) * 2 - 1;

    const normalizedY =
        -((faceY / height) * 2 - 1);


    anchor.position.x =
        normalizedX * 2.25;

    anchor.position.y =
        normalizedY * 1.7;


    /* Face size */

    const dx =
        rightEye.x - leftEye.x;

    const dy =
        rightEye.y - leftEye.y;


    const eyeDistance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const headScale =
        Math.max(
            0.35,
            Math.min(
                1.35,
                eyeDistance * 3.5
            )
        );


    anchor.scale.set(
        headScale,
        headScale,
        headScale
    );


    /* Head rotation */

    if (
        transformationMatrix &&
        transformationMatrix.length >= 16
    ) {

        const matrix =
            new THREE.Matrix4();

        matrix.fromArray(
            transformationMatrix
        );


        const position =
            new THREE.Vector3();

        const quaternion =
            new THREE.Quaternion();

        const scale =
            new THREE.Vector3();


        matrix.decompose(
            position,
            quaternion,
            scale
        );


        const euler =
            new THREE.Euler();

        euler.setFromQuaternion(
            quaternion,
            "YXZ"
        );


        anchor.rotation.x =
            euler.x;

        anchor.rotation.y =
            euler.y;

        anchor.rotation.z =
            euler.z;
    }
}


/* FACE TRACKING */

function trackFace() {

    if (
        !trackingStarted ||
        !faceLandmarker
    ) {

        requestAnimationFrame(
            trackFace
        );

        return;
    }


    if (
        video.readyState >= 2
    ) {

        try {

            const now =
                performance.now();


            const result =
                faceLandmarker.detectForVideo(
                    video,
                    now
                );


            if (
                result.faceLandmarks &&
                result.faceLandmarks.length > 0
            ) {

                const landmarks =
                    result.faceLandmarks[0];


                /* Draw green dots */

                drawLandmarks(
                    landmarks
                );


                let matrix =
                    null;


                if (
                    result.facialTransformationMatrixes &&
                    result.facialTransformationMatrixes.length > 0
                ) {

                    matrix =
                        result
                        .facialTransformationMatrixes[0]
                        .data;
                }


                /* Move 3D object */

                updateHeadAnchor(
                    landmarks,
                    matrix
                );


                if (loadedModel) {

                    status.textContent =
                        "GLB HEAD TRACKING: ON";

                } else {

                    status.textContent =
                        "HEAD TRACKING: ON";
                }


            } else {

                const ctx =
                    landmarkCanvas
                    .getContext("2d");


                ctx.clearRect(
                    0,
                    0,
                    landmarkCanvas.width,
                    landmarkCanvas.height
                );


                status.textContent =
                    "FACE NOT FOUND";
            }

        } catch (error) {

            console.error(error);

            status.textContent =
                "TRACKING ERROR";
        }
    }


    requestAnimationFrame(
        trackFace
    );
}


/* THREE RENDER */

function render() {

    requestAnimationFrame(
        render
    );


    renderer.render(
        scene,
        threeCamera
    );
}

render();


/* RESIZE */

window.addEventListener(
    "resize",
    () => {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        renderer.setSize(
            width,
            height
        );


        threeCamera.aspect =
            width / height;


        threeCamera.updateProjectionMatrix();


        landmarkCanvas.width =
            Math.round(
                width *
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                )
            );

        landmarkCanvas.height =
            Math.round(
                height *
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                )
            );
    }
);


/* START BUTTON */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
