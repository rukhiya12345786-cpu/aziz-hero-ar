<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arContainer video,
#arContainer canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#arContainer video {
    object-fit: cover;
    z-index: 0;
}

#arContainer canvas {
    z-index: 1;
    pointer-events: none;
}

#ui {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
}

button,
input {
    pointer-events: auto;
}

.topBar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
}

button {
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    padding: 9px 11px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
}

button:active {
    transform: scale(0.96);
}

#statusBox {
    position: absolute;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, 92%);
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.68);
    color: #00ff66;
    text-align: center;
    font-size: 11px;
}

#expressionBox {
    position: absolute;
    top: 88px;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, 92%);
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    text-align: center;
    font-size: 10px;
}

#toolBar {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
}

#toolBar button {
    min-width: 108px;
}

.hiddenInput {
    display: none;
}

#gizmoLayer {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
}

#gizmo {
    position: absolute;
    width: 150px;
    height: 150px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
}

.gizmoRing {
    position: absolute;
    inset: 10px;
    border: 3px solid rgba(255,255,255,0.65);
    border-radius: 50%;
}

.gizmoCenter {
    position: absolute;
    width: 18px;
    height: 18px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 2px solid #000;
}

.gizmoArrow {
    position: absolute;
    width: 5px;
    height: 58px;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
}

#gizmoX {
    background: #ff4444;
    transform: translate(-50%, -100%) rotate(90deg);
}

#gizmoY {
    background: #44ff66;
    transform: translate(-50%, -100%) rotate(0deg);
}

#gizmoZ {
    background: #4488ff;
    transform: translate(-50%, -100%) rotate(45deg);
}

.gizmoArrow::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -8px;
    width: 14px;
    height: 14px;
    transform: translateX(-50%) rotate(45deg);
    border-top: 4px solid currentColor;
    border-left: 4px solid currentColor;
}

#gizmoX::after {
    color: #ff4444;
}

#gizmoY::after {
    color: #44ff66;
}

#gizmoZ::after {
    color: #4488ff;
}

#scaleHandle {
    position: absolute;
    right: -8px;
    bottom: -8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 3px solid #111;
    pointer-events: auto;
}

#rotateHandle {
    position: absolute;
    left: 50%;
    top: -17px;
    width: 30px;
    height: 30px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 3px solid #ffd43b;
    background: rgba(0,0,0,0.65);
    pointer-events: auto;
}

#rotateHandle::after {
    content: "↻";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd43b;
    font-size: 19px;
    font-weight: 900;
}

#gizmoHint {
    position: absolute;
    left: 50%;
    top: calc(50% + 82px);
    transform: translateX(-50%);
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 9px;
    white-space: nowrap;
    display: none;
}

#portraitButton {
    display: none;
}

@media (orientation: portrait) {
    #portraitButton {
        display: block;
    }
}

@media (max-width: 480px) {
    button {
        padding: 8px 9px;
        font-size: 10px;
    }

    #gizmo {
        width: 130px;
        height: 130px;
    }

    #gizmoHint {
        top: calc(50% + 74px);
    }
}
</style>

    <div id="ui">

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    OBJLoader
} from "three/addons/loaders/OBJLoader.js";

import {
    FBXLoader
} from "three/addons/loaders/FBXLoader.js";

import {
    MindARThree
} from "mindar-face-three";

const arContainer =
    document.getElementById(
        "arContainer"
    );

const startCameraButton =
    document.getElementById(
        "startCameraButton"
    );

const switchCameraButton =
    document.getElementById(
        "switchCameraButton"
    );

const mirrorButton =
    document.getElementById(
        "mirrorButton"
    );

const trackingButton =
    document.getElementById(
        "trackingButton"
    );

const meshButton =
    document.getElementById(
        "meshButton"
    );

const portraitButton =
    document.getElementById(
        "portraitButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const recordButton =
    document.getElementById(
        "recordButton"
    );

const importGLBButton =
    document.getElementById(
        "importGLBButton"
    );

const importOBJButton =
    document.getElementById(
        "importOBJButton"
    );

const importFBXButton =
    document.getElementById(
        "importFBXButton"
    );

const importSettingsButton =
    document.getElementById(
        "importSettingsButton"
    );

const exportSettingsButton =
    document.getElementById(
        "exportSettingsButton"
    );

const glbInput =
    document.getElementById(
        "glbInput"
    );

const objInput =
    document.getElementById(
        "objInput"
    );

const fbxInput =
    document.getElementById(
        "fbxInput"
    );

const settingsInput =
    document.getElementById(
        "settingsInput"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const expressionText =
    document.getElementById(
        "expressionText"
    );

const gizmo =
    document.getElementById(
        "gizmo"
    );

const gizmoHint =
    document.getElementById(
        "gizmoHint"
    );

const rotateHandle =
    document.getElementById(
        "rotateHandle"
    );

const scaleHandle =
    document.getElementById(
        "scaleHandle"
    );

let mindarThree = null;

let renderer = null;

let scene = null;

let camera = null;

let faceMesh = null;

let modelRoot = null;

let loadedModel = null;

let cameraStarted = false;

let trackingEnabled = true;

let mirrorEnabled = false;

let faceMeshVisible = true;

let currentCameraMode =
    "user";

let animationStarted = false;

let recording = false;

let mediaRecorder = null;

let recordedChunks = [];

let recordingCanvas = null;

let recordingContext = null;

let gizmoMode = "translate";

let activeGizmoAxis = null;

let dragStartX = 0;

let dragStartY = 0;

let dragStartValue = 0;

let dragStartScale = 1;

let dragStartRotation = 0;

let lastFrameTime = 0;

const smoothingState = {
    x: 0,
    y: 0,
    z: 0,
    rx: 0,
    ry: 0,
    rz: 0
};

const modelState = {
    x: 0,
    y: 0,
    z: 0,

    scale: 1,

    rotX: 0,
    rotY: 0,
    rotZ: 0,

    fit: 1
};

function setStatus(message) {
    statusText.textContent =
        message;
}

function setExpression(message) {
    expressionText.textContent =
        message;
}

function degToRad(value) {
    return (
        value *
        Math.PI /
        180
    );
}

function clamp(
    value,
    minimum,
    maximum
) {
    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}

function smoothValue(
    current,
    target,
    amount
) {
    return (
        current +
        (
            target -
            current
        ) * amount
    );
}

function showGizmo(show) {
    if (!loadedModel) {
        gizmo.style.display =
            "none";

        gizmoHint.style.display =
            "none";

        return;
    }

    gizmo.style.display =
        show ? "block" : "none";

    gizmoHint.style.display =
        show ? "block" : "none";
}

function updateGizmoPosition() {
    if (!loadedModel) {
        return;
    }

    const center =
        new THREE.Vector3();

    loadedModel.getWorldPosition(
        center
    );

    const projected =
        center.clone().project(
            camera
        );

    const x =
        (
            projected.x *
            0.5 +
            0.5
        ) *
        window.innerWidth;

    const y =
        (
            -projected.y *
            0.5 +
            0.5
        ) *
        window.innerHeight;

    gizmo.style.left =
        `${x}px`;

    gizmo.style.top =
        `${y}px`;
}

function createARScene() {

    mindarThree =
        new MindARThree({
            container:
                arContainer,

            uiLoading:
                "no",

            uiScanning:
                "no",

            uiError:
                "no",

            filterMinCF:
                0.0008,

            filterBeta:
                0.9
        });

    renderer =
        mindarThree.renderer;

    scene =
        mindarThree.scene;

    camera =
        mindarThree.camera;

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio ||
            1,
            1.5
        )
    );

    renderer.setClearColor(
        0x000000,
        0
    );

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            1.8
        );

    scene.add(hemi);

    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2.0
        );

    light.position.set(
        0,
        2,
        3
    );

    scene.add(light);

    faceMesh =
        mindarThree.addFaceMesh();

    faceMesh.material.transparent =
        true;

    faceMesh.material.opacity =
        0.20;

    faceMesh.material.color.set(
        0x00ff66
    );

    scene.add(faceMesh);

    modelRoot =
        new THREE.Group();

    faceMesh.add(
        modelRoot
    );
}

function updateFaceExpression() {

    if (
        !mindarThree ||
        !cameraStarted
    ) {
        return;
    }

    try {

        const estimate =
            mindarThree
                .getLatestEstimate();

        if (!estimate) {
            setExpression(
                "Expression: Waiting"
            );
            return;
        }

        const blendshapes =
            estimate.blendshapes;

        if (
            blendshapes &&
            Array.isArray(
                blendshapes.categories
            ) &&
            blendshapes.categories.length
        ) {

            let strongest =
                blendshapes.categories[0];

            for (
                const category
                of blendshapes.categories
            ) {

                if (
                    category.score >
                    strongest.score
                ) {
                    strongest =
                        category;
                }
            }

            const name =
                strongest.displayName ||
                strongest.categoryName ||
                "Face";

            const score =
                Number(
                    strongest.score || 0
                );

            setExpression(
                `Expression: ${name} ${score.toFixed(2)}`
            );

        } else {

            setExpression(
                "Expression: Face detected"
            );
        }

    } catch (error) {

        console.warn(
            "Expression update error",
            error
        );
    }
}

function applyModelTransform() {

    if (!loadedModel) {
        return;
    }

    loadedModel.position.set(
        modelState.x,
        modelState.y,
        modelState.z
    );

    const finalScale =
        Math.max(
            0.001,
            modelState.scale *
            modelState.fit
        );

    loadedModel.scale.setScalar(
        finalScale
    );

    loadedModel.rotation.set(
        degToRad(
            modelState.rotX
        ),
        degToRad(
            modelState.rotY
        ),
        degToRad(
            modelState.rotZ
        )
    );

    updateGizmoPosition();
}

function resetModel() {

    modelState.x = 0;
    modelState.y = 0;
    modelState.z = 0;

    modelState.scale = 1;

    modelState.rotX = 0;
    modelState.rotY = 0;
    modelState.rotZ = 0;

    modelState.fit = 1;

    applyModelTransform();

    setStatus(
        loadedModel
            ? "Model reset"
            : "Ready for model import"
    );
}

createARScene();

setStatus(
    "Ready - press START CAMERA"
);function normalizeImportedModel(object) {

    const box =
        new THREE.Box3().setFromObject(
            object
        );

    const size =
        new THREE.Vector3();

    const center =
        new THREE.Vector3();

    box.getSize(size);
    box.getCenter(center);

    object.position.sub(center);

    const largest =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        Number.isFinite(largest) &&
        largest > 0
    ) {
        object.scale.setScalar(
            1 / largest
        );
    }

    object.traverse(
        child => {

            if (
                child.isMesh
            ) {

                child.frustumCulled =
                    false;

                if (
                    child.material
                ) {

                    const materials =
                        Array.isArray(
                            child.material
                        )
                            ? child.material
                            : [child.material];

                    for (
                        const material
                        of materials
                    ) {

                        material.depthTest =
                            true;

                        material.depthWrite =
                            true;

                        material.transparent =
                            false;
                    }
                }
            }
        }
    );
}

function removeCurrentModel() {

    if (!loadedModel) {
        return;
    }

    modelRoot.remove(
        loadedModel
    );

    loadedModel.traverse(
        child => {

            if (
                child.geometry
            ) {
                child.geometry.dispose();
            }

            if (
                child.material
            ) {

                const materials =
                    Array.isArray(
                        child.material
                    )
                        ? child.material
                        : [child.material];

                for (
                    const material
                    of materials
                ) {

                    if (
                        material.map
                    ) {
                        material.map.dispose();
                    }

                    if (
                        material.normalMap
                    ) {
                        material.normalMap.dispose();
                    }

                    if (
                        material.roughnessMap
                    ) {
                        material.roughnessMap.dispose();
                    }

                    if (
                        material.metalnessMap
                    ) {
                        material.metalnessMap.dispose();
                    }

                    material.dispose();
                }
            }
        }
    );

    loadedModel = null;

    showGizmo(false);
}

function attachImportedModel(object) {

    if (!modelRoot) {
        setStatus(
            "Tracking scene not ready"
        );
        return;
    }

    removeCurrentModel();

    normalizeImportedModel(
        object
    );

    loadedModel = object;

    modelRoot.add(
        loadedModel
    );

    modelState.x = 0;
    modelState.y = 0;
    modelState.z = 0;

    modelState.scale = 1;

    modelState.rotX = 0;
    modelState.rotY = 0;
    modelState.rotZ = 0;

    modelState.fit = 1;

    applyModelTransform();

    showGizmo(true);

    setStatus(
        "3D model attached"
    );
}

function importGLBFile(file) {

    if (!file) {
        return;
    }

    setStatus(
        "Loading GLB / GLTF..."
    );

    const reader =
        new FileReader();

    reader.onload =
        event => {

            const loader =
                new GLTFLoader();

            loader.parse(
                event.target.result,
                "",
                gltf => {

                    if (
                        !gltf ||
                        !gltf.scene
                    ) {

                        setStatus(
                            "Empty GLB / GLTF"
                        );

                        return;
                    }

                    attachImportedModel(
                        gltf.scene
                    );
                },
                error => {

                    console.error(
                        "GLTF error:",
                        error
                    );

                    setStatus(
                        "GLB / GLTF import failed"
                    );
                }
            );
        };

    reader.onerror =
        () => {

            setStatus(
                "Unable to read GLB / GLTF"
            );
        };

    reader.readAsArrayBuffer(
        file
    );
}

function importOBJFile(file) {

    if (!file) {
        return;
    }

    setStatus(
        "Loading OBJ..."
    );

    const reader =
        new FileReader();

    reader.onload =
        event => {

            try {

                const loader =
                    new OBJLoader();

                const object =
                    loader.parse(
                        event.target.result
                    );

                attachImportedModel(
                    object
                );

            } catch (error) {

                console.error(
                    "OBJ error:",
                    error
                );

                setStatus(
                    "OBJ import failed"
                );
            }
        };

    reader.onerror =
        () => {

            setStatus(
                "Unable to read OBJ"
            );
        };

    reader.readAsText(
        file
    );
}

function importFBXFile(file) {

    if (!file) {
        return;
    }

    setStatus(
        "Loading FBX..."
    );

    const reader =
        new FileReader();

    reader.onload =
        event => {

            try {

                const loader =
                    new FBXLoader();

                const object =
                    loader.parse(
                        event.target.result,
                        ""
                    );

                attachImportedModel(
                    object
                );

            } catch (error) {

                console.error(
                    "FBX error:",
                    error
                );

                setStatus(
                    "FBX import failed"
                );
            }
        };

    reader.onerror =
        () => {

            setStatus(
                "Unable to read FBX"
            );
        };

    reader.readAsArrayBuffer(
        file
    );
}

function toggleFaceMesh() {

    faceMeshVisible =
        !faceMeshVisible;

    if (faceMesh) {
        faceMesh.visible =
            faceMeshVisible;
    }

    meshButton.textContent =
        faceMeshVisible
            ? "FACE MESH: ON"
            : "FACE MESH: OFF";

    setStatus(
        faceMeshVisible
            ? "Green face mesh visible"
            : "Green face mesh hidden"
    );
}

function toggleTracking() {

    trackingEnabled =
        !trackingEnabled;

    trackingButton.textContent =
        trackingEnabled
            ? "TRACKING: ON"
            : "TRACKING: OFF";

    setStatus(
        trackingEnabled
            ? "Face tracking enabled"
            : "Face tracking paused"
    );
}

function toggleMirror() {

    mirrorEnabled =
        !mirrorEnabled;

    mirrorButton.textContent =
        mirrorEnabled
            ? "MIRROR: ON"
            : "MIRROR: OFF";

    const video =
        arContainer.querySelector(
            "video"
        );

    const canvas =
        renderer
            ? renderer.domElement
            : arContainer.querySelector(
                "canvas"
            );

    if (video) {

        video.style.transform =
            mirrorEnabled

            activeGizmoAxis ===

            activeGizmoAxis ===
            "y"

                dragStartValue -
                dy * movement;

        } else if (
            activeGizmoAxis ===
            "z"

        gizmoMode ===

            Math.sqrt(

            distance *

            angle;

let rotationAxis = "rotY";

function continueGizmoDrag(event) {
    if (!activeGizmoAxis) return;

    const point = pointerPosition(event);

    const dx = point.x - dragStartX;
    const dy = point.y - dragStartY;

    if (gizmoMode === "translate") {

        if (activeGizmoAxis === "x") {
            modelState.x =
                dragStartValue + dx * 0.008;
        }

        if (activeGizmoAxis === "y") {
            modelState.y =
                dragStartValue - dy * 0.008;
        }

        if (activeGizmoAxis === "z") {
            modelState.z =
                dragStartValue + (dx - dy) * 0.008;
        }

        if (activeGizmoAxis === "xy") {
            modelState.x =
                dragStartValue + dx * 0.008;

            modelState.y =
                dragStartValue - dy * 0.008;
        }
    }

    if (gizmoMode === "scale") {
        const distance =
            Math.sqrt((dx * dx) + (dy * dy));

        const direction =
            (dx + dy) >= 0 ? 1 : -1;

        modelState.scale =
            dragStartScale +
            distance * 0.004 * direction;

        modelState.scale =
            clamp(modelState.scale, 0.01, 100);
    }

    if (gizmoMode === "rotate") {

        const centerX =
            window.innerWidth / 2;

        const centerY =
            window.innerHeight / 2;

        const startAngle =
            Math.atan2(
                dragStartY - centerY,
                dragStartX - centerX
            );

        const currentAngle =
            Math.atan2(
                point.y - centerY,
                point.x - centerX
            );

        let angleDelta =
            currentAngle - startAngle;

        while (angleDelta > Math.PI) {
            angleDelta -= Math.PI * 2;
        }

        while (angleDelta < -Math.PI) {
            angleDelta += Math.PI * 2;
        }

        const degrees =
            THREE.MathUtils.radToDeg(angleDelta);

        modelState[rotationAxis] =
            dragStartRotation + degrees;

        modelState[rotationAxis] =
            clamp(
                modelState[rotationAxis],
                -1440,
                1440
            );
    }

    applyModelTransform();
}

function createRecordingCanvas() {
    if (recordCanvas) {
        return recordCanvas;
    }

    recordCanvas = document.createElement("canvas");
    recordCanvas.width = 720;
    recordCanvas.height = 1280;

    recordContext =
        recordCanvas.getContext("2d", {
            alpha: false
        });

    return recordCanvas;
}

function getMindARVideo() {
    if (!arContainer) return null;

function drawRecordingFrame() {
    if (!recordingActive) return;

    const video = getMindARVideo();

    if (!video ||
        video.readyState < 2 ||
        !recordContext) {

        recordingFrameId =
            requestAnimationFrame(drawRecordingFrame);

        return;
    }

    const canvasWidth =
        recordCanvas.width;

    const canvasHeight =
        recordCanvas.height;

    recordContext.fillStyle = "#000";
    recordContext.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    const videoWidth =
        video.videoWidth || canvasWidth;

    const videoHeight =
        video.videoHeight || canvasHeight;

    const videoRatio =
        videoWidth / videoHeight;

    const canvasRatio =
        canvasWidth / canvasHeight;

    let drawWidth;
    let drawHeight;
    let drawX;
    let drawY;

    if (videoRatio > canvasRatio) {
        drawHeight = canvasHeight;
        drawWidth =
            drawHeight * videoRatio;

        drawX =
            (canvasWidth - drawWidth) / 2;

        drawY = 0;

    } else {
        drawWidth = canvasWidth;
        drawHeight =
            drawWidth / videoRatio;

        drawX = 0;

        drawY =
            (canvasHeight - drawHeight) / 2;
    }

    recordContext.save();

    if (mirrorEnabled) {
        recordContext.translate(
            canvasWidth,
            0
        );

        recordContext.scale(-1, 1);
    }

    recordContext.drawImage(
        video,
        drawX,
        drawY,
        drawWidth,
        drawHeight
    );

    recordContext.restore();

    if (renderer &&
        renderer.domElement) {

        recordContext.drawImage(
            renderer.domElement,
            0,
            0,
            canvasWidth,
            canvasHeight
        );
    }

    recordingFrameId =
        requestAnimationFrame(
            drawRecordingFrame
        );
}

async function startRecording() {
    if (recordingActive) return;

    if (!cameraStarted) {
        setStatus("Start camera first");
        return;
    }

    createRecordingCanvas();

    const stream =
        recordCanvas.captureStream(30);

    const supportedTypes = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    let selectedType = "";

    for (const type of supportedTypes) {
        if (
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(type)
        ) {
            selectedType = type;
            break;
        }
    }

    try {
        recorder = selectedType
            ? new MediaRecorder(
                stream,
                {
                    mimeType: selectedType,
                    videoBitsPerSecond: 6000000
                }
            )
            : new MediaRecorder(stream);
    } catch (error) {
        setStatus("Recording not supported");
        return;
    }

    recordedChunks = [];

    recorder.ondataavailable = (event) => {
        if (event.data &&
            event.data.size > 0) {

            recordedChunks.push(
                event.data
            );
        }
    };

    recorder.onstop = () => {
        if (!recordedChunks.length) {
            setStatus("No recording data");
            return;
        }

        const blob =
            new Blob(
                recordedChunks,
                {
                    type:
                        recorder.mimeType ||
                        "video/webm"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;
        link.download =
            "aziz-ar-recording.webm";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 2000);

        setStatus("Recording saved");
    };

    recorder.start(250);

    recordingActive = true;

    recordingFrameId =
        requestAnimationFrame(
            drawRecordingFrame
        );

    recordingButton.textContent =
        "STOP RECORDING";

    recordingButton.classList.add(
        "active"
    );

    setStatus("Recording...");
}

function stopRecording() {
    if (!recordingActive) return;

    recordingActive = false;

    if (recordingFrameId) {
        cancelAnimationFrame(
            recordingFrameId
        );

        recordingFrameId = null;
    }

    if (recorder &&
        recorder.state !== "inactive") {

        recorder.stop();
    }

    recordingButton.textContent =
        "START RECORDING";

    recordingButton.classList.remove(
        "active"
    );
}

function toggleRecording() {
    if (recordingActive) {

}

    const reader =
        new FileReader();

    reader.onload = () => {
        try {
            const settings =
                JSON.parse(
                    reader.result
                );

            if (settings.modelState) {
                Object.assign(
                    modelState,
                    settings.modelState
                );
            }

            if (
                typeof settings.mirrorEnabled ===
                "boolean"
            ) {
                mirrorEnabled =
                    settings.mirrorEnabled;
            }

            if (
                typeof settings.trackingEnabled ===
                "boolean"
            ) {
                trackingEnabled =
                    settings.trackingEnabled;
            }

            if (
                typeof settings.faceMeshVisible ===
                "boolean"
            ) {
                faceMeshVisible =
                    settings.faceMeshVisible;
            }

            if (
                settings.currentCameraMode ===
                "front" ||
                settings.currentCameraMode ===
                "environment"
            ) {
                currentCameraMode =
                    settings.currentCameraMode;
            }

            applyModelTransform();

            if (faceMesh) {
                faceMesh.visible =
                    faceMeshVisible;
            }

            trackingButton.textContent =
                trackingEnabled
                    ? "TRACKING: ON"
                    : "TRACKING: OFF";

            faceMeshButton.textContent =
                faceMeshVisible
                    ? "FACE MESH: ON"
                    : "FACE MESH: OFF";

            applyMirrorState();

            setStatus(
                "Settings imported"
            );

        } catch (error) {
            console.error(
                "Settings import error:",
                error
            );

            setStatus(
                "Invalid settings file"
            );
        }
    };

    reader.readAsText(file);
}

    if (!loadedModel) return;

    loadedModel.traverse((child) => {
        if (!child.isMesh) return;

        child.frustumCulled = false;

        if (child.material) {
            const materials =
                Array.isArray(child.material)
                    ? child.material
                    : [child.material];

            materials.forEach((material) => {
                material.depthTest = true;
                material.depthWrite = true;
                material.transparent = false;
                material.needsUpdate = true;
            });
        }
    });
}

function updateModelVisibility() {
    if (!loadedModel) return;

    loadedModel.visible =
        trackingEnabled &&
        cameraStarted;
}

function updateTrackingState() {
    updateModelVisibility();

    if (!trackingEnabled) {
        setExpression("Tracking paused");
        return;
    }

    if (!cameraStarted) {
        setExpression("Camera stopped");
        return;
    }

    const estimate =
        mindarThree
            ? mindarThree.getLatestEstimate()
            : null;

    if (!estimate) {
        setExpression("Looking for face...");
    }
}

function updateFaceMeshState() {
    if (!faceMesh) return;

    faceMesh.visible =
        faceMeshVisible;
}

function safeAnimationFrame(time) {
    if (!animationStarted) return;

    try {
        renderLoop(time);
    } catch (error) {
        console.error(
            "Render loop error:",
            error
        );
    }
}

function startAnimationLoop() {
    if (!renderer || animationStarted) {
        return;
    }

    animationStarted = true;

    renderer.setAnimationLoop(
        safeAnimationFrame
    );
}

function stopAnimationLoop() {
    if (!renderer) return;

    renderer.setAnimationLoop(null);

    animationStarted = false;
}

function applyAllState() {
    applyModelTransform();
    applyMirrorState();
    updateFaceMeshState();
    updateTrackingState();
}

async function startCamera() {
    if (cameraStarted) {
        setStatus("Camera already running");
        return;
    }

    try {
        setStatus("Starting camera...");

        await mindarThree.start();

        cameraStarted = true;

        const video =
            getMindARVideo();

        if (video) {
            video.setAttribute(
                "playsinline",
                ""
            );

            video.setAttribute(
                "autoplay",
                ""
            );

            video.muted = true;

            video.style.pointerEvents =
                "none";

            video.style.objectFit =
                "cover";
        }

        if (renderer &&
            renderer.domElement) {

            renderer.domElement.style
                .pointerEvents = "none";
        }

        applyMirrorState();

        startAnimationLoop();

        updateTrackingState();

        cameraButton.textContent =
            "CAMERA ON";

        setStatus(
            "Camera on - looking for face"
        );

    } catch (error) {
        console.error(
            "Camera start error:",
            error
        );

        cameraStarted = false;

        setStatus(
            "Camera error - allow camera permission"
        );
    }
}

async function switchCamera() {
    if (!cameraStarted) {
        setStatus(
            "Start camera first"
        );
        return;
    }

    try {
        setStatus(
            "Switching camera..."
        );

        await mindarThree.switchCamera();

        currentCameraMode =
            currentCameraMode ===
            "front"
                ? "environment"
                : "front";

        applyMirrorState();

        setStatus(
            currentCameraMode ===
            "front"
                ? "Front camera"
                : "Back camera"
        );

    } catch (error) {
        console.error(
            "Camera switch error:",
            error
        );

        setStatus(
            "Camera switch failed"
        );
    }
}

function toggleTracking() {
    trackingEnabled =
        !trackingEnabled;

    trackingButton.textContent =
        trackingEnabled
            ? "TRACKING: ON"
            : "TRACKING: OFF";

    updateTrackingState();

    if (trackingEnabled) {
        setStatus(
            "Tracking enabled"
        );
    } else {
        setStatus(
            "Tracking paused"
        );
    }
}

function toggleFaceMesh() {
    faceMeshVisible =
        !faceMeshVisible;

    updateFaceMeshState();

    faceMeshButton.textContent =
        faceMeshVisible
            ? "FACE MESH: ON"
            : "FACE MESH: OFF";

    setStatus(
        faceMeshVisible
            ? "Face mesh visible"
            : "Face mesh hidden"
    );
}

function updateExpressionSafely() {
    if (!mindarThree) return;

    if (!trackingEnabled) {
        setExpression(
            "Tracking paused"
        );
        return;
    }

    try {
        updateFaceExpression();
    } catch (error) {
        setExpression(
            "Face tracking active"
        );
    }
}

function renderLoop(time) {
    if (!renderer ||
        !scene ||
        !camera) {
        return;
    }

    if (!lastFrameTime) {
        lastFrameTime = time;
    }

    const delta =
        Math.min(
            (time - lastFrameTime) / 1000,
            0.05
        );

    lastFrameTime = time;

    if (trackingEnabled) {
        updateExpressionSafely();
    }

    updateModelVisibility();

    updateFaceMeshState();

    if (loadedModel) {
        prepareModelForTracking();

        const smoothing =
            1 -
            Math.exp(
                -18 * delta
            );

        loadedModel.position.x +=
            (
                modelRoot.position.x -
                loadedModel.position.x
            ) * smoothing;

        loadedModel.position.y +=
            (
                modelRoot.position.y -
                loadedModel.position.y
            ) * smoothing;

        loadedModel.position.z +=
            (
                modelRoot.position.z -
                loadedModel.position.z
            ) * smoothing;
    }

    updateGizmoPosition();

    renderer.render(
        scene,
        camera
    );
}

function resetApplicationState() {
    trackingEnabled = true;
    mirrorEnabled = false;
    faceMeshVisible = true;

    currentCameraMode =
        "front";

    trackingButton.textContent =
        "TRACKING: ON";

    mirrorButton.textContent =
        "MIRROR: OFF";

    faceMeshButton.textContent =
        "FACE MESH: ON";

    updateFaceMeshState();

    applyMirrorState();

    resetModel();
}

function cleanupRecording() {
    if (recordingFrameId) {
        cancelAnimationFrame(
            recordingFrameId
        );

        recordingFrameId = null;
    }

    if (recorder &&
        recorder.state !== "inactive") {

        try {
            recorder.stop();
        } catch (error) {}
    }

    recordingActive = false;
}

window.addEventListener(
    "beforeunload",
    cleanupRecording
);

document.addEventListener(
    "visibilitychange",
    () => {
        if (
            document.hidden &&
            recordingActive
        ) {
            setStatus(
                "Recording continues"
            );
        }

        if (
            !document.hidden &&
            cameraStarted
        ) {
            resizeAR();
        }
    }
);

window.addEventListener(
    "error",
    (event) => {
        console.error(
            "Application error:",
            event.error || event.message
        );
    }
);

window.addEventListener(
    "unhandledrejection",
    (event) => {
        console.error(
            "Unhandled promise error:",
            event.reason
        );
    }
);

function updateUIForModel() {
    if (!loadedModel) {
        showGizmo(false);
        return;
    }

    showGizmo(true);

    updateGizmoPosition();

    setStatus(
        "3D model ready"
    );
}

function verifyRequiredElements() {
    const required = [
        arContainer,
        cameraButton,
        switchCameraButton,
        mirrorButton,
        trackingButton,
        faceMeshButton,
        recordingButton,
        resetButton,
        glbButton,
        objButton,
        fbxButton,
        settingsButton,
        exportSettingsButton
    ];

    const missing =
        required.some(
            (element) => !element
        );

    if (missing) {
        console.error(
            "Required UI element is missing"
        );

        setStatus(
            "UI initialization error"
        );

        return false;
    }

    return true;
}

function initializeApplication() {
    if (!verifyRequiredElements()) {
        return;
    }

    resetApplicationState();

    updateFaceMeshState();

    updateUIForModel();

    resizeAR();

    setStatus(
        "Ready - press START CAMERA"
    );
}

initializeApplication();

console.log(
    "Azeez AR Head Tracker initialized"
);
</script>

</body>
