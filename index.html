<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #000;
}

/* MindAR controls the video and canvas inside this container.
   Do not force styles onto its video/canvas elements. */

#arContainer {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #000;
}

#ui {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
}

.topBar {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    pointer-events: auto;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.25);
}

button:active {
    transform: scale(0.96);
}

button.active {
    background: rgba(0,180,90,0.85);
}

#status {
    position: absolute;
    left: 10px;
    top: 65px;
    max-width: calc(100% - 20px);
    padding: 8px 11px;
    border-radius: 9px;
    background: rgba(0,0,0,0.68);
    color: #fff;
    font-size: 12px;
    pointer-events: none;
}

#expression {
    position: absolute;
    left: 10px;
    top: 102px;
    max-width: calc(100% - 20px);
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: #00ff88;
    font-size: 11px;
    pointer-events: none;
}

#controls {
    position: absolute;
    right: 10px;
    top: 145px;
    width: min(235px, 48vw);
    max-height: calc(100vh - 155px);
    overflow-y: auto;
    padding: 10px;
    border-radius: 13px;
    background: rgba(0,0,0,0.68);
    border: 1px solid rgba(255,255,255,0.18);
    pointer-events: auto;
}

.controlTitle {
    color: #00ff88;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
}

.controlRow {
    margin-bottom: 9px;
}

.controlRow label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-size: 11px;
    margin-bottom: 4px;
}

.value {
    color: #00ff88;
    font-weight: 700;
    white-space: nowrap;
}

input[type="range"] {
    width: 100%;
    height: 28px;
    margin: 0;
    accent-color: #00ff88;
}

.sectionLine {
    height: 1px;
    background: rgba(255,255,255,0.16);
    margin: 10px 0;
}

#fileInput,
#settingsInput {
    display: none;
}

.bottomBar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    pointer-events: auto;
}

.smallButton {
    flex: 1 1 auto;
    min-width: 90px;
}

#modelName {
    color: #fff;
    font-size: 11px;
    margin-top: 5px;
    word-break: break-word;
}

#loading {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    pointer-events: none;
}

#loading.show {
    display: flex;
}

@media (max-width: 600px) {
    #controls {
        width: 190px;
        max-height: 54vh;
        top: 142px;
    }

    button {
        padding: 9px 10px;
        font-size: 11px;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

}
</script>
</head>

<body>

<div id="app">

    <div id="arContainer"></div>

    <div id="ui">

        <div class="topBar">

            <button id="startButton">
                START CAMERA
            </button>

            <button id="switchButton">
                SWITCH CAMERA
            </button>

            <button id="mirrorButton">
                MIRROR: OFF
            </button>

            <button id="trackingButton">
                TRACKING: ON
            </button>

        </div>

        <div id="status">
            Camera: OFF
        </div>

        <div id="expression">
            Face: Waiting
        </div>

        <div id="controls">

            <div class="controlTitle">
                HEAD / MODEL CONTROLS
            </div>

            <div class="controlRow">
                <label>
                    <span>Position X</span>
                    <span class="value" id="xValue">0.00</span>
                </label>
                <input
                    id="xSlider"
                    type="range"
                    min="-10"

                    step="0.01"
                    value="0">
            </div>

            <div class="controlRow">
                <label>
                    <span>Position Y</span>
                    <span class="value" id="yValue">0.00</span>
                </label>
                <input
                    id="ySlider"
                    type="range"
                    min="-10"
                    max="10"
                    step="0.01"
                    value="0">
            </div>

            <div class="controlRow">
                <label>
                    <span>Depth Z</span>
                    <span class="value" id="zValue">0.00</span>
                </label>
                <input
                    id="zSlider"
                    type="range"
                    min="-20"

            </div>

            <div class="controlRow">
                <label>
                    <span>Scale</span>

            <div class="sectionLine"></div>

            <div class="controlRow">
                <label>

                <input

                    step="1"

            </div>

            <div class="controlRow">
                <label>
                    <span>Rotation Y</span>
                    <span class="value" id="rotYValue">0°</span>
                </label>
                <input
                    id="rotYSlider"
                    type="range"
                    min="-1440"
                    max="1440"
                    step="1"
                    value="0">
            </div>

            <div class="controlRow">
                <label>
                    <span>Rotation Z</span>
                    <span class="value" id="rotZValue">0°</span>
                </label>
                <input
                    id="rotZSlider"
                    type="range"
                    min="-1440"
                    max="1440"
                    step="1"

            </div>

            <div class="controlRow">
                <label>
                    <span>Head Fit</span>
                    <span class="value" id="fitValue">1.00</span>

                <input

                    type="range"

                    max="10"
                    step="0.01"

            </div>

            <div class="sectionLine"></div>

            <button id="resetButton" style="width:100%;">
                RESET MODEL

            <div id="modelName">

        </div>

        <div class="bottomBar">

            <button
                id="importModelButton"
                class="smallButton">
                IMPORT GLB
            </button>

            <button
                id="recordButton"
                class="smallButton">
                START RECORDING
            </button>

            <button
                id="importSettingsButton"
                class="smallButton">
                IMPORT SETTINGS
            </button>

            <button
                id="exportSettingsButton"
                class="smallButton">
                EXPORT SETTINGS
            </button>

        </div>

    </div>

    <div id="loading">
        Loading...
    </div>

</div>

<input
    id="fileInput"
    type="file"
    accept=".glb,.gltf">

<input
    id="settingsInput"
    type="file"
    accept=".json">

<script type="module">import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#arContainer");

const startButton = document.querySelector("#startButton");
const switchButton = document.querySelector("#switchButton");
const mirrorButton = document.querySelector("#mirrorButton");
const trackingButton = document.querySelector("#trackingButton");

const status = document.querySelector("#status");
const expression = document.querySelector("#expression");
const loading = document.querySelector("#loading");

const fileInput = document.querySelector("#fileInput");
const settingsInput = document.querySelector("#settingsInput");

const importModelButton = document.querySelector("#importModelButton");
const importSettingsButton = document.querySelector("#importSettingsButton");
const exportSettingsButton = document.querySelector("#exportSettingsButton");
const recordButton = document.querySelector("#recordButton");
const resetButton = document.querySelector("#resetButton");

const modelName = document.querySelector("#modelName");

const xSlider = document.querySelector("#xSlider");
const ySlider = document.querySelector("#ySlider");
const zSlider = document.querySelector("#zSlider");
const scaleSlider = document.querySelector("#scaleSlider");

const rotXSlider = document.querySelector("#rotXSlider");
const rotYSlider = document.querySelector("#rotYSlider");
const rotZSlider = document.querySelector("#rotZSlider");

const fitSlider = document.querySelector("#fitSlider");

const xValue = document.querySelector("#xValue");
const yValue = document.querySelector("#yValue");
const zValue = document.querySelector("#zValue");
const scaleValue = document.querySelector("#scaleValue");

const rotXValue = document.querySelector("#rotXValue");
const rotYValue = document.querySelector("#rotYValue");
const rotZValue = document.querySelector("#rotZValue");
const fitValue = document.querySelector("#fitValue");

let mindarThree = null;
let renderer = null;
let scene = null;
let camera = null;

let faceMesh = null;
let modelRoot = null;
let loadedModel = null;

let cameraStarted = false;
let trackingEnabled = true;
let mirrorEnabled = false;

let animationStarted = false;

let mediaRecorder = null;
let recordedChunks = [];
let recordingStream = null;

const modelState = {
    x: 0,
    y: 0,
    z: 0,
    scale: 1,
    rotX: 0,
    rotY: 0,
    rotZ: 0,
    fit: 1
};

function setStatus(message) {
    status.textContent = message;
}

function showLoading(show, message = "Loading...") {
    loading.textContent = message;

    if (show) {
        loading.classList.add("show");
    } else {
        loading.classList.remove("show");
    }
}

function degreesToRadians(value) {
    return value * Math.PI / 180;
}

function updateValueLabels() {
    xValue.textContent = Number(modelState.x).toFixed(2);
    yValue.textContent = Number(modelState.y).toFixed(2);
    zValue.textContent = Number(modelState.z).toFixed(2);

    scaleValue.textContent = Number(modelState.scale).toFixed(2);

    rotXValue.textContent =
        Math.round(modelState.rotX) + "°";

    rotYValue.textContent =
        Math.round(modelState.rotY) + "°";

    rotZValue.textContent =
        Math.round(modelState.rotZ) + "°";

    fitValue.textContent =
        Number(modelState.fit).toFixed(2);
}

function readSliders() {
    modelState.x = Number(xSlider.value);
    modelState.y = Number(ySlider.value);
    modelState.z = Number(zSlider.value);

    modelState.scale = Number(scaleSlider.value);

    modelState.rotX = Number(rotXSlider.value);
    modelState.rotY = Number(rotYSlider.value);
    modelState.rotZ = Number(rotZSlider.value);

    modelState.fit = Number(fitSlider.value);

    updateValueLabels();
    applyModelTransform();
}

function writeSliders() {
    xSlider.value = modelState.x;
    ySlider.value = modelState.y;
    zSlider.value = modelState.z;

    scaleSlider.value = modelState.scale;

    rotXSlider.value = modelState.rotX;
    rotYSlider.value = modelState.rotY;
    rotZSlider.value = modelState.rotZ;

    fitSlider.value = modelState.fit;

    updateValueLabels();
}

function applyModelTransform() {
    if (!modelRoot) {
        return;
    }

    modelRoot.position.set(
        modelState.x,
        modelState.y,
        modelState.z
    );

    modelRoot.rotation.set(
        degreesToRadians(modelState.rotX),
        degreesToRadians(modelState.rotY),
        degreesToRadians(modelState.rotZ)
    );

    const finalScale = modelState.scale * modelState.fit;

    modelRoot.scale.set(
        finalScale,
        finalScale,
        finalScale
    );
}

function resetModel() {
    modelState.x = 0;
    modelState.y = 0;
    modelState.z = 0;

    modelState.scale = 1;

    modelState.rotX = 0;
    modelState.rotY = 0;
    modelState.rotZ = 0;

    modelState.fit = 1;

    writeSliders();
    applyModelTransform();

    setStatus("Model controls reset");
}

function createMindAR() {
    mindarThree = new MindARThree({
        container: container,
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
    });

    renderer = mindarThree.renderer;
    scene = mindarThree.scene;
    camera = mindarThree.camera;

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setClearColor(0x000000, 0);

    const ambientLight = new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2.2
    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

    directionalLight.position.set(
        0,
        2,
        4
    );

    scene.add(directionalLight);

    faceMesh = mindarThree.addFaceMesh();

    faceMesh.material.transparent = true;
    faceMesh.material.opacity = 0.16;

    faceMesh.material.color.set(
        0x00ff66
    );

    scene.add(faceMesh);

    modelRoot = new THREE.Group();

    faceMesh.add(modelRoot);

    createFaceOutline();

    setStatus("MindAR ready");
}

function createFaceOutline() {
    const geometry = new THREE.BufferGeometry();

    const positions = new Float32Array([
        -0.7, 0.0, 0.0,
         0.7, 0.0, 0.0,

         0.0, -0.8, 0.0,
         0.0,  0.8, 0.0,

        -0.5, 0.4, 0.0,
         0.5, 0.4, 0.0,

        -0.5,-0.4, 0.0,
         0.5,-0.4, 0.0
    ]);

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material = new THREE.PointsMaterial({
        color: 0x00ff66,
        size: 0.025,
        sizeAttenuation: true
    });

    const points = new THREE.Points(
        geometry,
        material
    );

    points.visible = false;

    modelRoot.add(points);
}

async function startCamera() {
    if (!mindarThree) {
        createMindAR();
    }

    if (cameraStarted) {
        setStatus("Camera already running");
        return;
    }

    try {
        showLoading(
            true,
            "Starting camera..."
        );

        await mindarThree.start();

        cameraStarted = true;

        if (!animationStarted) {
            renderer.setAnimationLoop(
                renderLoop
            );

            animationStarted = true;
        }

        startButton.textContent = "CAMERA ON";
        startButton.classList.add("active");

        setStatus(
            "Camera ON - Face tracking ready"
        );

        showLoading(false);

    } catch (error) {
        console.error(error);

        cameraStarted = false;

        setStatus(
            "Camera error: " +
            (error.message || "Unknown error")
        );

        showLoading(false);
    }
}

function renderLoop() {
    if (!renderer || !scene || !camera) {
        return;
    }

    updateFaceTrackingInfo();

    renderer.render(
        scene,
        camera
    );
}

function updateFaceTrackingInfo() {
    if (!mindarThree || !cameraStarted) {
        return;
    }

    if (!trackingEnabled) {
        expression.textContent =
            "Face tracking: OFF";

        return;
    }

    try {
        const estimate =
            mindarThree.getLatestEstimate();

        if (!estimate) {
            expression.textContent =
                "Face: Searching";

            return;
        }

        let text = "Face: Detected";

        if (
            estimate.blendshapes &&
            estimate.blendshapes.categories
        ) {
            const categories =
                estimate.blendshapes.categories;

            let strongestName = "";
            let strongestScore = 0;

            for (
                const category of categories
            ) {
                const score =
                    Number(category.score || 0);

                if (
                    score > strongestScore
                ) {
                    strongestScore = score;
                    strongestName =
                        category.categoryName || "";
                }
            }

            if (strongestName) {
                text +=
                    " | " +
                    strongestName +
                    " " +
                    strongestScore.toFixed(2);
            }
        }

        expression.textContent = text;

    } catch (error) {
        expression.textContent =
            "Face: Tracking";
    }
}

async function switchCamera() {
    if (!mindarThree) {
        setStatus(
            "Start camera first"
        );
        return;
    }

    if (!cameraStarted) {
        setStatus(
            "Start camera first"
        );
        return;
    }

    try {
        setStatus(
            "Switching camera..."
        );

        mindarThree.switchCamera();

        setStatus(
            "Camera switched"
        );

    } catch (error) {
        console.error(error);

        setStatus(
            "Camera switch failed"
        );
    }
}

function toggleTracking() {
    trackingEnabled =
        !trackingEnabled;

    trackingButton.textContent =
        trackingEnabled
            ? "TRACKING: ON"
            : "TRACKING: OFF";

    trackingButton.classList.toggle(
        "active",
        trackingEnabled
    );

    if (!trackingEnabled) {
        expression.textContent =
            "Face tracking: OFF";
    } else {
        expression.textContent =
            "Face: Searching";
    }
}

function toggleMirror() {
    mirrorEnabled =
        !mirrorEnabled;

    mirrorButton.textContent =
        mirrorEnabled
            ? "MIRROR: ON"
            : "MIRROR: OFF";

    mirrorButton.classList.toggle(
        "active",
        mirrorEnabled
    );

    /*
     * MindAR manages its camera presentation.
     * The actual mirror implementation is kept
     * separate so it does not break tracking.
     */

    setStatus(
        mirrorEnabled
            ? "Mirror mode ON"
            : "Mirror mode OFF"
    );
}

async function loadGLB(file) {
    if (!file) {
        return;
    }

    if (!modelRoot) {
        setStatus(
            "Start camera first"
        );
        return;
    }

    showLoading(
        true,
        "Loading 3D model..."
    );

    const loader =
        new GLTFLoader();

    try {
        const arrayBuffer =
            await file.arrayBuffer();

        loader.parse(
            arrayBuffer,
            "",
            function(gltf) {

                removeCurrentModel();

                loadedModel =
                    gltf.scene;

                prepareModel(
                    loadedModel
                );

                modelRoot.add(
                    loadedModel
                );

                applyModelTransform();

                modelName.textContent =
                    "Model: " +
                    file.name;

                setStatus(
                    "3D model loaded"
                );

                showLoading(false);
            },
            function(error) {

                console.error(error);

                setStatus(
                    "3D model loading failed"
                );

                showLoading(false);
            }
        );

    } catch (error) {
        console.error(error);

        setStatus(
            "Could not read model"
        );

        showLoading(false);
    }
}

function removeCurrentModel() {
    if (!loadedModel) {
        return;
    }

    modelRoot.remove(
        loadedModel
    );

    loadedModel.traverse(
        function(object) {

            if (object.geometry) {
                object.geometry.dispose();
            }

            if (object.material) {

                if (
                    Array.isArray(
                        object.material
                    )
                ) {
                    object.material.forEach(
                        function(material) {
                            material.dispose();
                        }
                    );
                } else {
                    object.material.dispose();
                }
            }
        }
    );

    loadedModel = null;
}

function prepareModel(model) {
    model.traverse(
        function(object) {

            if (!object.isMesh) {
                return;
            }

            object.frustumCulled = false;

            if (object.material) {

                if (
                    Array.isArray(
                        object.material
                    )
                ) {
                    object.material.forEach(
                        function(material) {
                            material.side =
                                THREE.DoubleSide;
                        }
                    );
                } else {
                    object.material.side =
                        THREE.DoubleSide;
                }
            }
        }
    );

    const box =
        new THREE.Box3().setFromObject(
            model
        );

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    model.position.sub(center);

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    const largest =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        largest > 0 &&
        Number.isFinite(largest)
    ) {
        const normalize =
            1 / largest;

        model.scale.setScalar(
            normalize
        );
    }
}

startButton.addEventListener(
    "click",
    startCamera
);

switchButton.addEventListener(
    "click",
    switchCamera
);

trackingButton.addEventListener(
    "click",
    toggleTracking
);

mirrorButton.addEventListener(
    "click",
    toggleMirror
);

importModelButton.addEventListener(
    "click",
    function() {
        fileInput.click();
    }
);

fileInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files &&
            event.target.files[0];

        if (file) {
            loadGLB(file);
        }

        fileInput.value = "";
    }
);

xSlider.addEventListener(
    "input",
    readSliders
);

ySlider.addEventListener(
    "input",
    readSliders
);

zSlider.addEventListener(
    "input",
    readSliders
);

scaleSlider.addEventListener(
    "input",
    readSliders
);

rotXSlider.addEventListener(
    "input",
    readSliders
);

rotYSlider.addEventListener(
    "input",
    readSliders
);

rotZSlider.addEventListener(
    "input",
    readSliders
);

fitSlider.addEventListener(
    "input",
    readSliders
);

resetButton.addEventListener(
    "click",
    resetModel
);

updateValueLabels();function getSettings() {
    return {
        version: 1,
        model: {
            x: modelState.x,
            y: modelState.y,
            z: modelState.z,
            scale: modelState.scale,
            rotX: modelState.rotX,
            rotY: modelState.rotY,
            rotZ: modelState.rotZ,
            fit: modelState.fit
        },
        mirror: mirrorEnabled,
        tracking: trackingEnabled
    };
}

function applySettings(settings) {
    if (!settings || !settings.model) {
        setStatus("Invalid settings file");
        return;
    }

    const data = settings.model;

    if (Number.isFinite(Number(data.x))) {
        modelState.x = Number(data.x);
    }

    if (Number.isFinite(Number(data.y))) {
        modelState.y = Number(data.y);
    }

    if (Number.isFinite(Number(data.z))) {
        modelState.z = Number(data.z);
    }

    if (Number.isFinite(Number(data.scale))) {
        modelState.scale = Number(data.scale);
    }

    if (Number.isFinite(Number(data.rotX))) {
        modelState.rotX = Number(data.rotX);
    }

    if (Number.isFinite(Number(data.rotY))) {
        modelState.rotY = Number(data.rotY);
    }

    if (Number.isFinite(Number(data.rotZ))) {
        modelState.rotZ = Number(data.rotZ);
    }

    if (Number.isFinite(Number(data.fit))) {
        modelState.fit = Number(data.fit);
    }

    if (settings.mirror !== undefined) {
        mirrorEnabled = Boolean(settings.mirror);

        mirrorButton.textContent =
            mirrorEnabled
                ? "MIRROR: ON"
                : "MIRROR: OFF";

        mirrorButton.classList.toggle(
            "active",
            mirrorEnabled
        );
    }

    if (settings.tracking !== undefined) {
        trackingEnabled =
            Boolean(settings.tracking);

        trackingButton.textContent =
            trackingEnabled
                ? "TRACKING: ON"
                : "TRACKING: OFF";

        trackingButton.classList.toggle(
            "active",
            trackingEnabled
        );
    }

    writeSliders();
    applyModelTransform();

    setStatus("Settings imported");
}

function exportSettings() {
    const settings =
        getSettings();

    const json =
        JSON.stringify(
            settings,
            null,
            2
        );

    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement("a");

    link.href = url;
    link.download =
        "aziz-ar-settings.json";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    setStatus(
        "Settings exported"
    );
}

importSettingsButton.addEventListener(
    "click",
    function() {
        settingsInput.click();
    }
);

settingsInput.addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files &&
            event.target.files[0];

        if (!file) {
            return;
        }

        try {
            const text =
                await file.text();

            const settings =
                JSON.parse(text);

            applySettings(
                settings
            );

        } catch (error) {
            console.error(error);

            setStatus(
                "Settings file is invalid"
            );
        }

        settingsInput.value = "";
    }
);

exportSettingsButton.addEventListener(
    "click",
    exportSettings
);

function getCameraVideo() {
    if (!container) {
        return null;
    }

    const videos =
        container.querySelectorAll(
            "video"
        );

    if (!videos.length) {
        return null;
    }

    return videos[0];
}

function createRecordingCanvas() {
    const canvas =
        document.createElement("canvas");

    const width =
        Math.max(
            720,
            window.innerWidth
        );

    const height =
        Math.max(
            1280,
            window.innerHeight
        );

    canvas.width = width;
    canvas.height = height;

    return canvas;
}

function getRendererCanvas() {
    if (!renderer) {
        return null;
    }

    return renderer.domElement;
}

function startRecording() {
    if (mediaRecorder) {
        return;
    }

    const video =
        getCameraVideo();

    const renderCanvas =
        getRendererCanvas();

    if (!video || !renderCanvas) {
        setStatus(
            "Start camera before recording"
        );
        return;
    }

    const recordCanvas =
        createRecordingCanvas();

    const recordContext =
        recordCanvas.getContext("2d");

    if (!recordContext) {
        setStatus(
            "Recording is not supported"
        );
        return;
    }

    const fps = 30;

    const drawFrame =
        function() {

            if (
                !mediaRecorder ||
                mediaRecorder.state !== "recording"
            ) {
                return;
            }

            recordContext.clearRect(
                0,
                0,
                recordCanvas.width,
                recordCanvas.height
            );

            const videoWidth =
                video.videoWidth ||
                video.clientWidth ||
                recordCanvas.width;

            const videoHeight =
                video.videoHeight ||
                video.clientHeight ||
                recordCanvas.height;

            if (
                videoWidth > 0 &&
                videoHeight > 0
            ) {
                const scale =
                    Math.max(
                        recordCanvas.width /
                            videoWidth,
                        recordCanvas.height /
                            videoHeight
                    );

                const drawWidth =
                    videoWidth * scale;

                const drawHeight =
                    videoHeight * scale;

                const offsetX =
                    (
                        recordCanvas.width -
                        drawWidth
                    ) / 2;

                const offsetY =
                    (
                        recordCanvas.height -
                        drawHeight
                    ) / 2;

                recordContext.drawImage(
                    video,
                    offsetX,
                    offsetY,
                    drawWidth,
                    drawHeight
                );
            }

            recordContext.drawImage(
                renderCanvas,
                0,
                0,
                recordCanvas.width,
                recordCanvas.height
            );

            requestAnimationFrame(
                drawFrame
            );
        };

    recordingStream =
        recordCanvas.captureStream(
            fps
        );

    let mimeType =
        "video/webm";

    if (
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ) {
        mimeType =
            "video/webm;codecs=vp9";
    } else if (
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8"
        )
    ) {
        mimeType =
            "video/webm;codecs=vp8";
    }

    try {
        mediaRecorder =
            new MediaRecorder(
                recordingStream,
                {
                    mimeType:
                        mimeType
                }
            );
    } catch (error) {
        console.error(error);

        try {
            mediaRecorder =
                new MediaRecorder(
                    recordingStream
                );
        } catch (secondError) {
            console.error(
                secondError
            );

            setStatus(
                "Recording is not supported"
            );

            recordingStream = null;

            return;
        }
    }

    recordedChunks = [];

    mediaRecorder.ondataavailable =
        function(event) {

            if (
                event.data &&
                event.data.size > 0
            ) {
                recordedChunks.push(
                    event.data
                );
            }
        };

    mediaRecorder.onstop =
        function() {

            const blob =
                new Blob(
                    recordedChunks,
                    {
                        type:
                            mediaRecorder.mimeType ||
                            "video/webm"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href = url;

            link.download =
                "aziz-ar-recording.webm";

            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

            setTimeout(
                function() {
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );

            recordedChunks = [];
            recordingStream = null;
            mediaRecorder = null;

            recordButton.textContent =
                "START RECORDING";

            recordButton.classList.remove(
                "active"
            );

            setStatus(
                "Recording saved"
            );
        };

    mediaRecorder.onerror =
        function(event) {

            console.error(event);

            setStatus(
                "Recording error"
            );
        };

    mediaRecorder.start(
        1000
    );

    recordButton.textContent =
        "STOP RECORDING";

    recordButton.classList.add(
        "active"
    );

    setStatus(
        "Recording started"
    );

    requestAnimationFrame(
        drawFrame
    );
}

function stopRecording() {
    if (
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ) {
        return;
    }

    mediaRecorder.stop();

    setStatus(
        "Preparing recording..."
    );
}

recordButton.addEventListener(
    "click",
    function() {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {
            stopRecording();
        } else {
            startRecording();
        }
    }
);

window.addEventListener(
    "resize",
    function() {

        if (!renderer) {
            return;
        }

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

        renderer.setSize(
            container.clientWidth,
            container.clientHeight,
            false
        );
    }
);

window.addEventListener(
    "beforeunload",
    function() {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {
            mediaRecorder.stop();
        }

        if (mindarThree) {
            try {
                mindarThree.stop();
            } catch (error) {
                console.error(error);
            }
        }
    }
);

try {
    createMindAR();

    setStatus(
        "Ready - press START CAMERA"
    );

} catch (error) {
    console.error(error);

    setStatus(
        "MindAR initialization failed"
    );
}
</script>

</body>
