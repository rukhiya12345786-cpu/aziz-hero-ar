function setStatus(text){
  status.textContent = text;
}

function setLoading(value){
  loading.style.display =
    value ? "flex" : "none";
}

function radians(value){
  return value * Math.PI / 180;
}

function updateLabels(){

  xValue.textContent =
    state.x.toFixed(2);

  yValue.textContent =
    state.y.toFixed(2);

  zValue.textContent =
    state.z.toFixed(2);

  scaleValue.textContent =
    state.scale.toFixed(2);

  rotXValue.textContent =
    Math.round(state.rotX);

  rotYValue.textContent =
    Math.round(state.rotY);

  rotZValue.textContent =
    Math.round(state.rotZ);
}

function updateModel(){

  if(!modelRoot){
    return;
  }

  modelRoot.position.set(
    state.x,
    state.y,
    state.z
  );

  modelRoot.scale.setScalar(
    state.scale
  );

  modelRoot.rotation.set(
    radians(state.rotX),
    radians(state.rotY),
    radians(state.rotZ)
  );

  updateLabels();
}

function resetModel(){

  state.x = 0;
  state.y = 0;
  state.z = 0;
  state.scale = 1;
  state.rotX = 0;
  state.rotY = 0;
  state.rotZ = 0;

  xSlider.value = 0;
  ySlider.value = 0;
  zSlider.value = 0;
  scaleSlider.value = 1;
  rotXSlider.value = 0;
  rotYSlider.value = 0;
  rotZSlider.value = 0;

async function createAR(){

if(mindar){
return;
}

setLoading(true);
setStatus("Preparing Camera...");

mindar = new MindARThree({
container: arContainer,
uiLoading: "no",
uiScanning: "no",
uiError: "no"
});

renderer = mindar.renderer;
scene = mindar.scene;
camera = mindar.camera;

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio || 1,
2
)
);

renderer.setSize(
window.innerWidth,
window.innerHeight,
false
);

renderer.setClearColor(
0x000000,
0
);

const ambient =
new THREE.HemisphereLight(
0xffffff,
0x444444,
2
);

scene.add(ambient);

const light =
new THREE.DirectionalLight(
0xffffff,
2
);

light.position.set(
0,
2,
3
);

scene.add(light);

faceAnchor =
mindar.addFaceAnchor(168);

faceMesh =
mindar.addFaceMesh();

faceMesh.material.transparent =
true;

faceMesh.material.opacity =
0.35;

faceMesh.material.color.set(
0x00ff66
);

faceMesh.material.depthWrite =
false;

scene.add(faceMesh);

modelRoot =
new THREE.Group();

faceAnchor.group.add(
modelRoot
);

updateModel();

return mindar;
}

async function startCamera(){

if(running){
return;
}

try{

await createAR();

setLoading(true);
setStatus("Opening Camera...");

await mindar.start();

running = true;

startButton.style.display =
  "none";

setStatus(

setLoading(false);

}catch(error){

console.error(error);

running = false;

setLoading(false);

startButton.style.display =
  "block";

setStatus(

}
}

async function stopCamera(){

return;
}

try{
await mindar.stop();
}catch(error){
console.error(error);
}

running = false;

startButton.style.display =

if(!running){

);

}

try{

}

mindar = null;
renderer = null;

camera = null;

function fitModel(){

if(!currentModel){

setStatus(
  "Load Model First"
);

return;

}

const box =
new THREE.Box3()
.setFromObject(
currentModel
);

const size =
new THREE.Vector3();

box.getSize(size);

const largest =
Math.max(
size.x,
size.y,
size.z
);

if(
largest > 0 &&
Number.isFinite(largest)
){

currentModel.scale.setScalar(
  1 / largest
);

}

state.scale = 1;
scaleSlider.value = 1;

updateModel();

setStatus(
"Model Fitted"
);
}

function applyModelControls() {
    if (!currentModel) return;

    const x = parseFloat(document.getElementById("posX")?.value || 0);
    const y = parseFloat(document.getElementById("posY")?.value || 0);
    const z = parseFloat(document.getElementById("posZ")?.value || 0);

    const scale = parseFloat(document.getElementById("modelScale")?.value || 1);

    const rx = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotX")?.value || 0)
    );
    const ry = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotY")?.value || 0)
    );
    const rz = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotZ")?.value || 0)
    );

    currentModel.position.set(x, y, z);
    currentModel.scale.setScalar(scale);

    currentModel.rotation.x = rx;
    currentModel.rotation.y = ry;
    currentModel.rotation.z = rz;
}

function resetModelControls() {
    const defaults = {
        posX: 0,
        posY: 0,
        posZ: 0,
        modelScale: 1,
        rotX: 0,
        rotY: 0,
        rotZ: 0
    };

    Object.keys(defaults).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = defaults[id];
    });

    applyModelControls();
    updateLabels();
}

function toggleControlsVisibility() {
    const panel = document.getElementById("controlsPanel");
    if (!panel) return;

    panel.classList.toggle("hidden");
}

function createFaceTracker() {
    if (!mindar) return;

    try {
        faceAnchor = mindar.addFaceAnchor(168);

        faceMesh = mindar.addFaceMesh();

        if (faceMesh) {
            faceMesh.material.color.set(0x00ff66);
            faceMesh.material.transparent = true;
            faceMesh.material.opacity = 0.18;
            faceMesh.material.depthWrite = false;
            faceMesh.visible = meshVisible;

            scene.add(faceMesh);
        }

        faceAnchor.group.add(modelRoot);

        faceAnchor.onTargetFound = () => {
            if (modelRoot) {
                modelRoot.visible = true;
            }
        };

        faceAnchor.onTargetLost = () => {
            if (modelRoot) {
                modelRoot.visible = false;
            }
        };

        setStatus("Face tracker ready");
    } catch (error) {
        console.error("Face tracker error:", error);
        setStatus("Face tracker error");
    }
}

function updateFaceTracking() {
    if (!faceAnchor || !faceAnchor.group || !modelRoot) return;

    const head = faceAnchor.group;

    const position = head.position;
    const rotation = head.rotation;

    const smoothing = 0.35;

    modelRoot.position.x +=
        (position.x - modelRoot.position.x) * smoothing;

    modelRoot.position.y +=
        (position.y - modelRoot.position.y) * smoothing;

    modelRoot.position.z +=
        (position.z - modelRoot.position.z) * smoothing;

    modelRoot.rotation.x +=
        (rotation.x - modelRoot.rotation.x) * smoothing;

    modelRoot.rotation.y +=
        (rotation.y - modelRoot.rotation.y) * smoothing;

    modelRoot.rotation.z +=
        (rotation.z - modelRoot.rotation.z) * smoothing;

    applyHeadTracking();
}

function updateHeadPose() {
    if (!faceAnchor || !faceAnchor.group) return null;

    const head = faceAnchor.group;

    return {
        x: head.position.x,
        y: head.position.y,
        z: head.position.z,
        rx: head.rotation.x,
        ry: head.rotation.y,
        rz: head.rotation.z
    };
}

function applyHeadTracking() {
    if (!currentModel) return;

    const pose = updateHeadPose();
    if (!pose) return;

    const manualX = parseFloat(
        document.getElementById("posX")?.value || 0
    );

    const manualY = parseFloat(
        document.getElementById("posY")?.value || 0
    );

    const manualZ = parseFloat(
        document.getElementById("posZ")?.value || 0
    );

    const scale = parseFloat(
        document.getElementById("modelScale")?.value || 1
    );

    const rx = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotX")?.value || 0)
    );

    const ry = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotY")?.value || 0)
    );

    const rz = THREE.MathUtils.degToRad(
        parseFloat(document.getElementById("rotZ")?.value || 0)
    );

    currentModel.position.x = pose.x + manualX;
    currentModel.position.y = pose.y + manualY;
    currentModel.position.z = pose.z + manualZ;

    currentModel.scale.setScalar(scale);

    currentModel.rotation.x = rx + pose.rx;
    currentModel.rotation.y = ry + pose.ry;
    currentModel.rotation.z = rz + pose.rz;
}

function updateFaceMeshVisibility() {
    if (faceMesh) {
        faceMesh.visible = meshVisible;
    }
}

function toggleFaceMesh() {
    meshVisible = !meshVisible;
    updateFaceMeshVisibility();

    const button = document.getElementById("meshButton");

    if (button) {
        button.textContent = meshVisible

    }
}

}

    if (button) {

    }
}

function updateModelVisibility() {
    if (modelRoot) {
        modelRoot.visible = !!currentModel;
    }
}

function disposeObject(object) {
    if (!object) return;

    object.traverse(child => {
        if (child.geometry) {
            child.geometry.dispose();
        }

        if (child.material) {
            if (Array.isArray(child.material)) {
                child.material.forEach(material => {
                    if (material.map) material.map.dispose();
                    if (material.normalMap) material.normalMap.dispose();
                    if (material.roughnessMap) material.roughnessMap.dispose();
                    if (material.metalnessMap) material.metalnessMap.dispose();
                    material.dispose();
                });
            } else {
                if (child.material.map) child.material.map.dispose();
                if (child.material.normalMap) child.material.normalMap.dispose();
                if (child.material.roughnessMap) child.material.roughnessMap.dispose();
                if (child.material.metalnessMap) child.material.metalnessMap.dispose();
                child.material.dispose();
            }
        }
    });
}

function clearCurrentModel() {
    if (!currentModel) return;

    modelRoot.remove(currentModel);
    disposeObject(currentModel);

    currentModel = null;

    updateModelVisibility();
}

function addModelToHead(object) {
    clearCurrentModel();

    currentModel = object;

    currentModel.traverse(child => {
        if (child.isMesh) {
            child.frustumCulled = false;
        }
    });

    modelRoot.add(currentModel);

    resetModelControls();

    currentModel.visible = true;

    setStatus("3D model attached");
}

function animate() {
    requestAnimationFrame(animate);

    if (running) {
        updateFaceTracking();
    }

    renderer.render(scene, camera);
}

animate();
