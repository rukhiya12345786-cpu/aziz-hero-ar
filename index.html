<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AZEEZ AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

#container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  touch-action: none;
}

#panel {
  position: fixed;
  z-index: 10000;
  top: 10px;
  left: 10px;
  width: 245px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 11px;
  border: 1px solid #777;
  border-radius: 12px;
  background: rgba(0,0,0,.88);
  color: white;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

button, .fileButton {
  border: 0;
  border-radius: 7px;
  padding: 11px 8px;
  color: white;
  background: #292929;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
}

button.active {
  background: #ffc400;
  color: #000;
}

.fileButton {
  display: block;
}

input[type="file"] {
  display: none;
}

.row {
  display: flex;
  gap: 5px;
}

.row button {
  flex: 1;
}

.sectionTitle {
  color: #ffc400;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}

#sizeSlider {
  width: 100%;
  height: 35px;
  accent-color: #ffc400;
}

#sizeValue, #status {
  font-size: 11px;
  overflow-wrap: anywhere;
}

#sizeValue {
  color: #ffc400;
}

#status {
  color: #ddd;
}

#panelToggle {
  position: fixed;
  z-index: 10002;
  top: 10px;
  right: 10px;
  background: #ffc400;
  color: #000;
}

.hidden {
  display: none !important;
}

#video-feed {
  display: none;
}

@media (orientation: landscape) {
  #panel {
    max-height: 92vh;
    width: 220px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<button id="panelToggle">HIDE PANEL</button>

<div id="panel">

  <div class="sectionTitle">AZEEZ AR STUDIO</div>

  <div class="sectionTitle">CAMERA</div>

  <button id="startBtn">START CAMERA</button>

  <div class="row">
    <button id="frontBtn">FRONT</button>
    <button id="backBtn">BACK</button>
  </div>

  <button id="stopBtn">STOP CAMERA</button>

  <div class="sectionTitle">IMPORT 3D MODEL</div>

  <label class="fileButton" for="modelInput">
    IMPORT GLB / GLTF / OBJ / FBX
  </label>
  <input id="modelInput" type="file"
    accept=".glb,.gltf,.obj,.fbx">

  <div class="sectionTitle">IMPORT IMAGE</div>

  <label class="fileButton" for="imageInput">
    IMPORT IMAGE
  </label>
  <input id="imageInput" type="file"
    accept="image/*">

  <div class="sectionTitle">IMPORT VIDEO</div>

  <label class="fileButton" for="videoInput">
    IMPORT VIDEO
  </label>
  <input id="videoInput" type="file"
    accept="video/*">

  <div class="sectionTitle">TRANSFORM GIZMOS</div>

  <div class="row">
    <button id="moveBtn">MOVE</button>
    <button id="rotateBtn">ROTATE</button>
    <button id="scaleBtn">SCALE</button>
  </div>

  <button id="gizmoToggle">HIDE GIZMOS</button>

  <div class="sectionTitle">MODEL SIZE</div>

  <input id="sizeSlider"
    type="range"
    min="0"
    max="1000"
    value="500">

  <div id="sizeValue">Size: 1.00x</div>

  <button id="removeModelBtn">REMOVE SELECTED MODEL</button>

  <div id="status">Ready. Start camera.</div>

</div>

<video id="video-feed" playsinline muted></video>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";

import { OBJLoader } from
  "three/addons/loaders/OBJLoader.js";

import { FBXLoader } from
  "three/addons/loaders/FBXLoader.js";

import { TransformControls } from
  "three/addons/controls/TransformControls.js";

import { MindARThree } from "mindar-face-three";


// =====================================
// GLOBAL VARIABLES
// =====================================

let mindarThree = null;
let avatar = null;

let anchor = null;
let raccoonObject = null;

let transformControls = null;
let gizmoHelper = null;

let activeObject = null;
let activeBaseScale = new THREE.Vector3(1,1,1);

let importedObjects = [];

let currentMode = "translate";

let gizmosVisible = true;

let facingMode = "user";

let isRunning = false;
let isStarting = false;
let isSwitching = false;

let videoElements = [];

const container =
  document.querySelector("#container");

const statusText =
  document.querySelector("#status");

const sizeSlider =
  document.querySelector("#sizeSlider");

const sizeValue =
  document.querySelector("#sizeValue");


// =====================================
// ORIGINAL RACCOON AVATAR
// =====================================

class Avatar {

  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {

    const loader = new GLTFLoader();

    const url =
      "https://assets.codepen.io/9177687/raccoon_head.glb";

    const gltf = await loader.loadAsync(url);

    gltf.scene.traverse((object) => {

      if (object.isBone && !this.root) {
        this.root = object;
      }

      if (!object.isMesh) return;

      if (
        !object.morphTargetDictionary ||
        !object.morphTargetInfluences
      ) return;

      this.morphTargetMeshes.push(object);

    });

    this.gltf = gltf;
  }

  updateBlendshapes(blendshapes) {

    if (!blendshapes || !blendshapes.categories) return;

    const categoryMap = new Map();

    for (const item of blendshapes.categories) {
      categoryMap.set(item.categoryName, item.score);
    }

    for (const mesh of this.morphTargetMeshes) {

      if (
        !mesh.morphTargetDictionary ||
        !mesh.morphTargetInfluences
      ) continue;

      for (const [name, value] of categoryMap) {

        const index = mesh.morphTargetDictionary[name];

        if (index === undefined) continue;

        mesh.morphTargetInfluences[index] = value;
      }
    }
  }
}


// =====================================
// INITIALIZE MINDAR
// =====================================

async function setup() {

  if (mindarThree) return;

  statusText.textContent = "Preparing face tracking...";

  mindarThree = new MindARThree({
    container: container
  });

  const scene = mindarThree.scene;
  const camera = mindarThree.camera;
  const renderer = mindarThree.renderer;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  renderer.domElement.style.touchAction = "none";

  const hemisphere = new THREE.HemisphereLight(
    0xffffff,
    0xbbbbff,
    1.2
  );

  scene.add(hemisphere);

  const directional = new THREE.DirectionalLight(
    0xffffff,
    1
  );

  directional.position.set(0, 2, 3);
  scene.add(directional);

  anchor = mindarThree.addAnchor(1);

  // Load original Raccoon.
  avatar = new Avatar();

  await avatar.init();

  raccoonObject = avatar.gltf.scene;

  raccoonObject.scale.set(2, 2, 2);

  anchor.group.add(raccoonObject);

  activeObject = raccoonObject;

  activeBaseScale.copy(raccoonObject.scale);

  // TransformControls.
  transformControls = new TransformControls(
    camera,
    renderer.domElement
  );

  gizmoHelper = transformControls.getHelper();

  scene.add(gizmoHelper);

  transformControls.setMode(currentMode);
  transformControls.setSize(1.4);

  transformControls.showX = true;
  transformControls.showY = true;
  transformControls.showZ = true;

  gizmoHelper.visible = gizmosVisible;

  transformControls.addEventListener(
    "dragging-changed",
    (event) => {
      // Keep MindAR rendering active while dragging.
    }
  );

  transformControls.addEventListener(
    "objectChange",
    updateSizeLabel
  );

  transformControls.attach(activeObject);

  statusText.textContent = "Raccoon loaded";
}


// =====================================
// CAMERA START
// =====================================

async function startCamera() {

  if (isRunning || isStarting || isSwitching) return;

  isStarting = true;

  statusText.textContent = "Starting camera...";

  try {

    await setup();

    await mindarThree.start({
      facingMode: facingMode
    });

    const { renderer, scene, camera } = mindarThree;

    renderer.setAnimationLoop(() => {

      const estimate = mindarThree.getLatestEstimate();

      if (
        estimate &&
        estimate.blendshapes &&
        avatar
      ) {
        avatar.updateBlendshapes(
          estimate.blendshapes
        );
      }

      renderer.render(scene, camera);

    });

    isRunning = true;

    statusText.textContent =
      facingMode === "user"
      ? "Front camera running"
      : "Back camera running";

  } catch (error) {

    console.error("Camera start error:", error);

    isRunning = false;

    statusText.textContent =
      "Camera error: " + error.message;

  } finally {

    isStarting = false;
  }
}


// =====================================
// CAMERA STOP
// =====================================

async function stopCamera() {

  if (!mindarThree || !isRunning || isSwitching) return;

  try {

    mindarThree.renderer.setAnimationLoop(null);

    await mindarThree.stop();

    isRunning = false;

    statusText.textContent = "Camera stopped";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Stop error: " + error.message;
  }
}


// =====================================
// FRONT / BACK CAMERA
// =====================================

async function switchCamera(targetMode) {

  if (
    !mindarThree ||
    !isRunning ||
    isStarting ||
    isSwitching
  ) return;

  if (targetMode === facingMode) return;

  isSwitching = true;

  statusText.textContent = "Switching camera...";

  try {

    await mindarThree.switchCamera();

    facingMode = targetMode;

    statusText.textContent =
      facingMode === "user"
      ? "Front camera running"
      : "Back camera running";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Camera switch failed: " + error.message;

  } finally {

    isSwitching = false;
  }
}


// =====================================
// SELECT OBJECT
// =====================================

function selectObject(object) {

  if (!transformControls || !object) return;

  transformControls.detach();

  activeObject = object;

  activeBaseScale.copy(object.scale);

  sizeSlider.value = 500;

  transformControls.attach(object);

  transformControls.setMode(currentMode);

  gizmoHelper.visible = gizmosVisible;

  updateSizeLabel();
}


// =====================================
// GIZMO MODES
// =====================================

function setGizmoMode(mode, buttonId) {

  currentMode = mode;

  if (transformControls) {

    transformControls.setMode(mode);

    transformControls.enabled = true;

    if (activeObject) {
      transformControls.attach(activeObject);
    }
  }

  document.querySelectorAll(
    "#moveBtn, #rotateBtn, #scaleBtn"
  ).forEach(button => {
    button.classList.remove("active");
  });

  document.querySelector("#" + buttonId)
    .classList.add("active");

  if (gizmoHelper) {
    gizmoHelper.visible = gizmosVisible;
  }
}


// =====================================
// SIZE SLIDER
// =====================================

function getSizeMultiplier(value) {

  return Math.pow(10, (value - 500) / 166.6667);
}

function updateSizeLabel() {

  if (!activeObject) {
    sizeValue.textContent = "No model selected";
    return;
  }

  const factor = getSizeMultiplier(
    Number(sizeSlider.value)
  );

  activeObject.scale.copy(activeBaseScale);

  activeObject.scale.multiplyScalar(factor);

  sizeValue.textContent =
    "Size: " + factor.toExponential(2) + "x";
}

sizeSlider.addEventListener(
  "input",
  updateSizeLabel
);


// =====================================
// PREPARE IMPORTED MODEL
// =====================================

function prepareModel(object, name) {

  if (!anchor) {
    throw new Error("Start camera before importing.");
  }

  const box = new THREE.Box3().setFromObject(object);

  const dimensions = new THREE.Vector3();

  box.getSize(dimensions);

  const maxDimension = Math.max(
    dimensions.x,
    dimensions.y,
    dimensions.z
  );

  if (maxDimension > 0) {
    object.scale.multiplyScalar(1 / maxDimension);
  }

  const center = new THREE.Box3()
    .setFromObject(object)
    .getCenter(new THREE.Vector3());

  object.position.sub(center);

  const wrapper = new THREE.Group();

  wrapper.name = name;

  wrapper.add(object);

  anchor.group.add(wrapper);

  importedObjects.push(wrapper);

  selectObject(wrapper);

  statusText.textContent = name + " imported";

  return wrapper;
}


// =====================================
// IMPORT 3D MODEL
// =====================================

document.querySelector("#modelInput")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    try {

      if (!anchor) {
        throw new Error("Start camera before importing.");
      }

      const extension =
        file.name.split(".").pop().toLowerCase();

      let object = null;

      const url = URL.createObjectURL(file);

      if (extension === "glb" || extension === "gltf") {

        const loader = new GLTFLoader();

        const gltf = await loader.loadAsync(url);

        object = gltf.scene;

      } else if (extension === "obj") {

        const loader = new OBJLoader();

        object = loader.parse(
          await file.text()
        );

      } else if (extension === "fbx") {

        const loader = new FBXLoader();

        object = loader.parse(
          await file.arrayBuffer(),
          ""
        );

      } else {

        throw new Error("Unsupported 3D model format");
      }

      prepareModel(object, file.name);

      URL.revokeObjectURL(url);

    } catch (error) {

      console.error(error);

      statusText.textContent =
        "Import error: " + error.message;
    }

    event.target.value = "";
  });


// =====================================
// IMPORT IMAGE
// =====================================

document.querySelector("#imageInput")
  .addEventListener("change", (event) => {

    const file = event.target.files[0];

    if (!file) return;

    if (!anchor) {
      statusText.textContent = "Start camera first";
      return;
    }

    const url = URL.createObjectURL(file);

    const textureLoader = new THREE.TextureLoader();

    textureLoader.load(url, (texture) => {

      texture.colorSpace = THREE.SRGBColorSpace;

      const geometry =
        new THREE.PlaneGeometry(1, 1);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide
      });

      const imageMesh = new THREE.Mesh(
        geometry,
        material
      );

      prepareModel(imageMesh, file.name);

      URL.revokeObjectURL(url);
    });

    event.target.value = "";
  });


// =====================================
// IMPORT VIDEO
// =====================================

document.querySelector("#videoInput")
  .addEventListener("change", (event) => {

    const file = event.target.files[0];

    if (!file) return;

    if (!anchor) {
      statusText.textContent = "Start camera first";
      return;
    }

    const url = URL.createObjectURL(file);

    const video = document.createElement("video");

    video.src = url;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;

    videoElements.push(video);

    video.play().catch(() => {});

    video.addEventListener("loadeddata", () => {

      const texture = new THREE.VideoTexture(video);

      texture.colorSpace = THREE.SRGBColorSpace;

      const geometry =
        new THREE.PlaneGeometry(1, 1);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      const videoMesh = new THREE.Mesh(
        geometry,
        material
      );

      prepareModel(videoMesh, file.name);
    });

    event.target.value = "";
  });


// =====================================
// REMOVE SELECTED IMPORT
// =====================================

function removeSelectedImport() {

  if (!activeObject) {
    statusText.textContent = "No model selected";
    return;
  }

  if (!importedObjects.includes(activeObject)) {
    statusText.textContent =
      "Original Raccoon cannot be removed";
    return;
  }

  transformControls.detach();

  const index = importedObjects.indexOf(activeObject);

  if (index !== -1) {
    importedObjects.splice(index, 1);
  }

  anchor.group.remove(activeObject);

  activeObject.traverse((object) => {

    if (object.geometry) {
      object.geometry.dispose();
    }

    if (object.material) {

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach(material => {

        if (material.map) {
          material.map.dispose();
        }

        material.dispose();
      });
    }
  });

  activeObject = raccoonObject;

  if (raccoonObject) {

    activeBaseScale.copy(raccoonObject.scale);

    transformControls.attach(raccoonObject);
  }

  sizeSlider.value = 500;

  updateSizeLabel();

  statusText.textContent = "Imported model removed";
}


// =====================================
// GIZMO VISIBILITY
// =====================================

document.querySelector("#gizmoToggle")
  .addEventListener("click", () => {

    gizmosVisible = !gizmosVisible;

    if (gizmoHelper) {
      gizmoHelper.visible = gizmosVisible;
    }

    document.querySelector("#gizmoToggle").textContent =
      gizmosVisible
      ? "HIDE GIZMOS"
      : "SHOW GIZMOS";
  });


// =====================================
// PANEL VISIBILITY
// =====================================

document.querySelector("#panelToggle")
  .addEventListener("click", () => {

    const panel = document.querySelector("#panel");

    panel.classList.toggle("hidden");

    document.querySelector("#panelToggle").textContent =
      panel.classList.contains("hidden")
      ? "SHOW PANEL"
      : "HIDE PANEL";
  });


// =====================================
// BUTTON EVENTS
// =====================================

document.querySelector("#moveBtn")
  .addEventListener("click", () => {
    setGizmoMode("translate", "moveBtn");
  });

document.querySelector("#rotateBtn")
  .addEventListener("click", () => {
    setGizmoMode("rotate", "rotateBtn");
  });

document.querySelector("#scaleBtn")
  .addEventListener("click", () => {
    setGizmoMode("scale", "scaleBtn");
  });

document.querySelector("#startBtn")
  .addEventListener("click", startCamera);

document.querySelector("#stopBtn")
  .addEventListener("click", stopCamera);

document.querySelector("#frontBtn")
  .addEventListener("click", () => {
    switchCamera("user");
  });

document.querySelector("#backBtn")
  .addEventListener("click", () => {
    switchCamera("environment");
  });

document.querySelector("#removeModelBtn")
  .addEventListener("click", removeSelectedImport);


// =====================================
// INITIAL BUTTON STATE
// =====================================

document.querySelector("#moveBtn").classList.add("active");


// =====================================
// WINDOW RESIZE
// =====================================

window.addEventListener("resize", () => {

  if (mindarThree && mindarThree.renderer) {

    mindarThree.renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
});


// =====================================
// ERROR HANDLING
// =====================================

window.addEventListener("error", (event) => {

  console.error("Application error:", event.error);

  statusText.textContent =
    "Error: " + event.message;
});

</script>
</body>
</html>
