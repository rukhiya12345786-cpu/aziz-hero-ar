<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Face Tracking</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#three{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#status{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.65);
    padding:10px 15px;
    border-radius:10px;
    font-family:Arial;
}

button{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    padding:15px 25px;
    font-size:18px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="three"></canvas>

<div id="status">Camera OFF</div>

<button id="open">OPEN CAMERA</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    FaceLandmarker,
    FilesetResolver
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


const video = document.getElementById("camera");
const canvas = document.getElementById("three");
const button = document.getElementById("open");
const status = document.getElementById("status");


const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera3D.position.set(0,0,5);


const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    alpha:true,
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);


const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(2,3,5);

scene.add(light);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);


const geometry =
new THREE.BoxGeometry(
    0.8,
    0.8,
    0.8
);

const material =
new THREE.MeshNormalMaterial();

const faceObject =
new THREE.Mesh(
    geometry,
    material
);

scene.add(faceObject);

faceObject.visible = false;


let faceLandmarker = null;
let tracking = false;


async function startTracking(){

    try{

        status.innerText =
        "Loading Face Tracking...";


        const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


        faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {

                baseOptions:{
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"GPU"
                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5,

                outputFaceBlendshapes:false,

                outputFacialTransformationMatrixes:true

            }
        );


        tracking = true;

        status.innerText =
        "Face Tracking ON";

        trackFace();


    }catch(error){

        console.error(error);

        status.innerText =
        "Tracking Error";

        alert(
            "Face Tracking Error:\n\n" +
            error.message
        );

    }
}


function trackFace(){

    if(!tracking){
        return;
    }


    if(
        video.readyState >= 2 &&
        faceLandmarker
    ){

        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );


        if(
            result.faceLandmarks &&
            result.faceLandmarks.length > 0
        ){

            const landmarks =
            result.faceLandmarks[0];


            let minX = 1;
            let maxX = 0;
            let minY = 1;
            let maxY = 0;


            for(const p of landmarks){

                minX = Math.min(minX,p.x);
                maxX = Math.max(maxX,p.x);

                minY = Math.min(minY,p.y);
                maxY = Math.max(maxY,p.y);

            }


            const centerX =
            (minX + maxX) / 2;

            const centerY =
            (minY + maxY) / 2;


            faceObject.position.x =
            -(centerX - 0.5) * 5;

            faceObject.position.y =
            -(centerY - 0.5) * 3.5;


            const faceWidth =
            maxX - minX;

            const size =
            Math.max(
                0.35,
                faceWidth * 4
            );

            faceObject.scale.set(
                size,
                size,
                size
            );


            if(
                result.facialTransformationMatrixes &&
                result.facialTransformationMatrixes.length
            ){

                const data =
                result
                .facialTransformationMatrixes[0]
                .data;


                const matrix =
                new THREE.Matrix4();

                matrix.fromArray(data);


                const position =
                new THREE.Vector3();

                const quaternion =
                new THREE.Quaternion();

                const scale =
                new THREE.Vector3();


                matrix.decompose(
                    position,
                    quaternion,
                    scale
                );


                faceObject.quaternion.copy(
                    quaternion
                );

            }


            faceObject.visible = true;

            status.innerText =
            "3D FACE TRACKING ON";


        }else{

            faceObject.visible = false;

            status.innerText =
            "NO FACE";

        }

    }


    renderer.render(
        scene,
        camera3D
    );

    requestAnimationFrame(trackFace);
}


button.onclick = async function(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject = stream;

        this.style.display = "none";

        status.innerText =
        "Camera ON";


        await video.play();

        await startTracking();


    }catch(error){

        alert(
            "Camera Error:\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};


window.addEventListener(
    "resize",
    function(){

        camera3D.aspect =
        window.innerWidth /
        window.innerHeight;

        camera3D.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
