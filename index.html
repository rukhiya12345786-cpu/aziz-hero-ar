
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeez AR Camera Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;text-align:center}
h2{font-size:22px}
video{width:100%;max-height:70vh;object-fit:contain;background:#000}
button{padding:14px;margin:6px;border:0;border-radius:9px;font-weight:bold}
#status{padding:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>Azeez AR Camera Test</h2>
<video id="cam" autoplay playsinline muted></video>
<div>
<button id="start">START CAMERA</button>
<button id="switch">SWITCH CAMERA</button>
<button id="stop">STOP CAMERA</button>
</div>
<p id="status">Ready</p>
<script>
const video=document.getElementById("cam");
const status=document.getElementById("status");
let stream=null;
let facing="user";

async function startCamera(){
  stopCamera(false);
  status.textContent="Requesting camera permission...";
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Camera API unavailable. Open the HTTPS GitHub Pages URL.");
    }
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    status.textContent="SUCCESS: Camera is working.";
  }catch(e){
    status.textContent="ERROR: "+e.name+" — "+e.message;
  }
}
function stopCamera(update=true){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  video.srcObject=null;
  if(update)status.textContent="Camera stopped.";
}
document.getElementById("start").onclick=()=>startCamera();
document.getElementById("switch").onclick=async()=>{
  facing=facing==="user"?"environment":"user";
  await startCamera();
};
document.getElementById("stop").onclick=()=>stopCamera();
</script>
</body>
</html>
