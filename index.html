<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Pro 3D Animoji Studio - Custom Import</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; flex-wrap: wrap; gap: 6px; }
        
        .btn {
            background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 12px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(6px); transition: all 0.2s ease;
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }

        /* Manual Position & Scale Panel */
        .control-panel {
            position: absolute; top: 85px; left: 15px; display: flex; flex-direction: column; gap: 8px;
            background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 15px; backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .control-row { display: flex; gap: 8px; justify-content: center; }
        .control-btn {
            background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4);
            width: 38px; height: 38px; border-radius: 50%; font-size: 15px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .control-btn:active { background: rgba(0, 255, 136, 0.6); border-color: #00ff88; }

        .bottom-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
        }
        .filter-switcher { display: flex; gap: 12px; align-items: center; }
        .filter-thumb {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            background-size: cover; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; background-color: rgba(34,34,34,0.7); transition: transform 0.2s;
        }
        .filter-thumb:active { transform: scale(0.9); }
        .filter-thumb.active { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #111, #222); z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
    </style>

    <!-- Three.js & Loaders (OBJ & GLTF) & MediaPipe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px;">Aziz Pro Animoji Studio</h1>
        <p style="color: #aaa; max-width: 320px;">Direct Custom 3D Model Import (.obj, .glb, .gltf) & 360° Head Lock</p>
        <button id="launch-btn">START STUDIO</button>
        <div id="error-log" style="color: #ff4444; font-size: 13px; margin-top: 15px; max-width: 300px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="reset-pos" class="btn interactive">🎯 Reset</button>
            <button id="export-btn" class="btn interactive">📤 Export Project</button>
            
            <!-- Direct Custom 3D Model Import -->
            <button id="import-btn" class="btn interactive">📥 Import Custom 3D (.obj/.glb)</button>
            <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf,.xfpx,.json">
            
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div class="control-panel interactive">
            <div class="control-row">
                <button class="control-btn" onclick="adjustPosition('up')">⬆️</button>
            </div>
            <div class="control-row">
                <button class="control-btn" onclick="adjustPosition('left')">⬅️</button>
                <button class="control-btn" onclick="adjustPosition('front')">⏺️</button>
                <button class="control-btn" onclick="adjustPosition('right')">➡️</button>
            </div>
            <div class="control-row">
                <button class="control-btn" onclick="adjustPosition('down')">⬇️</button>
            </div>
            <div style="height: 1px; background: rgba(255,255,255,0.2); margin: 4px 0;"></div>
            <div class="control-row">
                <button class="control-btn" onclick="adjustScale(0.1)" title="Zoom In">➕</button>
                <button class="control-btn" onclick="adjustScale(-0.1)" title="Zoom Out">➖</button>
            </div>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb active" id="btn-laugh" onclick="switchAnimoji('laugh')">😆</div>
                <div class="filter-thumb" id="btn-cool" onclick="switchAnimoji('cool')">😎</div>
                <div class="filter-thumb" id="btn-panda" onclick="switchAnimoji('panda')">🐼</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let animojiGroup = null;
        let currentType = 'laugh';
        let useFront = true;
        let jawPart = null;

        let manualOffsetX = 0;
        let manualOffsetY = 0;
        let manualOffsetZ = 0;
        let manualScale = 1.0;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Loading Studio...";
            btn.disabled = true;

            try {
                if (typeof THREE === 'undefined') throw new Error("Three.js failed to load.");
                if (typeof FaceMesh === 'undefined') throw new Error("MediaPipe failed to load.");

                await startCamera();
                document.getElementById('start-screen').style.display = 'none';

                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START STUDIO";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        document.getElementById('reset-pos').addEventListener('click', () => {
            manualOffsetX = 0;
            manualOffsetY = 0;
            manualOffsetZ = 0;
            manualScale = 1.0;
            if (animojiGroup) animojiGroup.scale.set(1, 1, 1);
        });

        // Export Config
        document.getElementById('export-btn').addEventListener('click', () => {
            const config = {
                app: "AzizProStudio",
                currentType,
                manualOffsetX,
                manualOffsetY,
                manualOffsetZ,
                manualScale
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "aziz_animoji_project.xfpx");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        });

        // Custom 3D Model File Import Handler (.obj, .glb, .gltf)
        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            const fileURL = URL.createObjectURL(file);

            if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (object) => {
                    if (animojiGroup) scene.remove(animojiGroup);
                    animojiGroup = new THREE.Group();
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
                        }
                    });
                    animojiGroup.add(object);
                    animojiGroup.scale.set(manualScale, manualScale, manualScale);
                    scene.add(animojiGroup);
                    alert("Custom .OBJ 3D Model Loaded Successfully!");
                }, undefined, (err) => { alert("Failed to load .obj file."); });
            } 
            else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    if (animojiGroup) scene.remove(animojiGroup);
                    animojiGroup = new THREE.Group();
                    animojiGroup.add(gltf.scene);
                    animojiGroup.scale.set(manualScale, manualScale, manualScale);
                    scene.add(animojiGroup);
                    alert("Custom .GLB/.GLTF 3D Model Loaded Successfully!");
                }, undefined, (err) => { alert("Failed to load .glb file."); });
            }
            else {
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const config = JSON.parse(e.target.result);
                        if (config.currentType) switchAnimoji(config.currentType);
                        if (config.manualOffsetX !== undefined) manualOffsetX = config.manualOffsetX;
                        if (config.manualOffsetY !== undefined) manualOffsetY = config.manualOffsetY;
                        if (config.manualOffsetZ !== undefined) manualOffsetZ = config.manualOffsetZ;
                        if (config.manualScale !== undefined) {
                            manualScale = config.manualScale;
                            if (animojiGroup) animojiGroup.scale.set(manualScale, manualScale, manualScale);
                        }
                        alert("Project settings imported successfully!");
                    } catch (err) {
                        alert("File loaded.");
                    }
                };
            }
        });

        function adjustPosition(direction) {
            const step = 0.15;
            if (direction === 'left') manualOffsetX -= step;
            if (direction === 'right') manualOffsetX += step;
            if (direction === 'up') manualOffsetY += step;
            if (direction === 'down') manualOffsetY -= step;
            if (direction === 'front') manualOffsetZ += step;
        }

        function adjustScale(amount) {
            manualScale = Math.max(0.4, Math.min(2.5, manualScale + amount));
            if (animojiGroup) {
                animojiGroup.scale.set(manualScale, manualScale, manualScale);
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            buildAnimoji('laugh');
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', takeSnapshot);
            animateLoop();
        }

        function switchAnimoji(type) {
            currentType = type;
            document.querySelectorAll('.filter-thumb').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            buildAnimoji(type);
        }

        function buildAnimoji(type) {
            if (animojiGroup) scene.remove(animojiGroup);
            animojiGroup = new THREE.Group();

            // 360 Degree True Head Volume Enclosure
            if (type === 'laugh') {
                const headGeo = new THREE.SphereGeometry(0.95, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                const eyeGeo = new THREE.BoxGeometry(0.18, 0.07, 0.05);
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.3, 0.22, 0.85);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.3, 0.22, 0.85);
                animojiGroup.add(leftEye); animojiGroup.add(rightEye);

                const mouthGeo = new THREE.BoxGeometry(0.35, 0.22, 0.1);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x8b0000 });
                jawPart = new THREE.Mesh(mouthGeo, mouthMat);
                jawPart.position.set(0, -0.22, 0.8);
                animojiGroup.add(jawPart);

            } else if (type === 'cool') {
                const headGeo = new THREE.SphereGeometry(0.95, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.1 });
                const glassGeo = new THREE.BoxGeometry(1.1, 0.35, 0.3);
                const glasses = new THREE.Mesh(glassGeo, glassMat);
                glasses.position.set(0, 0.18, 0.82);
                animojiGroup.add(glasses);

                const mouthGeo = new THREE.BoxGeometry(0.3, 0.07, 0.05);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                jawPart = new THREE.Mesh(mouthGeo, mouthMat);
                jawPart.position.set(0, -0.28, 0.85);
                animojiGroup.add(jawPart);

            } else if (type === 'panda') {
                const headGeo = new THREE.SphereGeometry(0.95, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                const head = new THREE.Mesh(headGeo, headMat);
                animojiGroup.add(head);

                const earGeo = new THREE.SphereGeometry(0.3, 16, 16);
                const earMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const leftEar = new THREE.Mesh(earGeo, earMat); leftEar.position.set(-0.75, 0.75, 0);
                const rightEar = new THREE.Mesh(earGeo, earMat); rightEar.position.set(0.75, 0.75, 0);
                animojiGroup.add(leftEar); animojiGroup.add(rightEar);

                const patchGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.05, 16);
                patchGeo.rotateX(Math.PI / 2);
                const patchMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const lPatch = new THREE.Mesh(patchGeo, patchMat); lPatch.position.set(-0.35, 0.18, 0.82);
                const rPatch = new THREE.Mesh(patchGeo, patchMat); rPatch.position.set(0.35, 0.18, 0.82);
                animojiGroup.add(lPatch); animojiGroup.add(rPatch);

                const noseGeo = new THREE.BoxGeometry(0.18, 0.1, 0.05);
                const noseMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const nose = new THREE.Mesh(noseGeo, noseMat); nose.position.set(0, -0.05, 0.9);
                animojiGroup.add(nose);

                const mouthGeo = new THREE.BoxGeometry(0.28, 0.12, 0.05);
                jawPart = new THREE.Mesh(mouthGeo, patchMat);
                jawPart.position.set(0, -0.28, 0.85);
                animojiGroup.add(jawPart);
            }

            animojiGroup.scale.set(manualScale, manualScale, manualScale);
            scene.add(animojiGroup);
        }

        function i
