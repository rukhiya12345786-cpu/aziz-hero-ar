<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Azeez AR - 3D Head Tracking</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 1;
    transform: scaleX(-1);
}

#arCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#status {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    font-size: 13px;
    white-space: nowrap;
}

#cameraError {
    position: fixed;
    left: 20px;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;
    display: none;
    padding: 18px;
    border-radius: 15px;
    background: rgba(120, 0, 0, 0.94);
    color: #fff;
    text-align: center;
    line-height: 1.5;
}

#controls {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 20;
    padding: 12px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    color: #fff;
}

.buttonRow {
    display: flex;
    gap: 7px;
    margin-bottom: 8px;
}

button,
.fileButton {
    flex: 1;
    min-height: 44px;
    border: 0;
    border-radius: 11px;
    background: #252525;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
}

button:active,
.fileButton:active {
    transform: scale(0.96);
}

#recordButton {
    background: #b00020;
}

#recordButton.recording {
    background: #ff1744;
}

#modelFile {
    display: none;
}

.sliderBox {
    margin-top: 8px;
}

.sliderBox span {
    display: block;
    margin-bottom: 3px;
    font-size: 12px;
}

.sliderBox input {
    width: 100%;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>

<body>

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>

<canvas id="arCanvas"></canvas>

<div id="status">
    Starting Camera...
</div>

<div id="cameraError">

    <strong>Camera could not start</strong>

    <br><br>

    Please allow camera permission
    and use HTTPS or localhost.

</div>

<div id="controls">

    <div class="buttonRow">

        <label
            class="fileButton"
            for="modelFile">
            3D Model
        </label>

        <button id="recordButton">
            Record
        </button>

        <button id="flipButton">
            Flip Camera
        </button>

        <button id="resetButton">
            Reset
        </button>

    </div>

    <input
        id="modelFile"
        type="file"
        accept=".glb,.gltf,.obj,.fbx">

    <div class="sliderBox">

        <span>Model Size</span>

        <input
            id="sizeSlider"
            type="range"
            min="0.3"
            max="2"
            value="1"
            step="0.01">

    </div>

    <div class="sliderBox">

        <span>Head Up / Down</span>

        <input
            id="heightSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01">

    </div>

    <div class="sliderBox">

        <span>Head Forward / Back</span>

        <input
            id="depthSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01">

    </div>

</div>

<script>

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("arCanvas");

const status =
    document.getElementById("status");

const cameraError =
    document.getElementById("cameraError");

const recordButton =
    document.getElementById("recordButton");

const flipButton =
    document.getElementById("flipButton");

const resetButton =
    document.getElementById("resetButton");

const modelFile =
    document.getElementById("modelFile");

const sizeSlider =
    document.getElementById("sizeSlider");

const heightSlider =
    document.getElementById("heightSlider");

const depthSlider =
    document.getElementById("depthSlider");

let scene = null;

let threeCamera = null;

let renderer = null;

let headGroup = null;

let faceOccluder = null;

let importedModel = null;

let faceMesh = null;

let mpCamera = null;

let cameraFacing = "user";

let poseStarted = false;

let smoothPosition =
    new THREE.Vector3();

let smoothQuaternion =
    new THREE.Quaternion();

let smoothScale = 1;

let modelSize = 1;

let heightValue = 0;

let depthValue = 0;

let mediaRecorder = null;

let recordedChunks = [];

let isRecording = false;

let recordCanvas = null;

let recordContext = null;

let recordAnimationId = null;

function initializeThree() {

    scene =
        new THREE.Scene();

    threeCamera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );

    threeCamera.position.set(
        0,
        0,
        3
    );

    renderer =
        new THREE.WebGLRenderer({

            canvas: canvas,

            alpha: true,

            antialias: true,

            preserveDrawingBuffer: true

        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    headGroup =
        new THREE.Group();

    scene.add(
        headGroup
    );

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            1.2
        );

    scene.add(
        ambientLight
    );

    const mainLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    mainLight.position.set(
        2,
        3,
        4
    );

    scene.add(
        mainLight
    );

    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            0.7
        );

    fillLight.position.set(
        -3,
        1,
        2
    );

    scene.add(
        fillLight
    );

    createFaceOccluder();

    window.addEventListener(
        "resize",
        resizeAR
    );

    resizeAR();

    renderLoop();

}

function resizeAR() {

    if (!renderer) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    threeCamera.aspect =
        width / height;

    threeCamera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );

}

function createFaceOccluder() {

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            24
        );

    const material =
        new THREE.MeshBasicMaterial({

            color: 0x000000,

            transparent: true,

            opacity: 0,

            colorWrite: false,

            depthWrite: true,

            depthTest: true,

            side: THREE.DoubleSide

        });

    faceOccluder =
        new THREE.Mesh(
            geometry,
            material
        );

    faceOccluder.visible =
        false;

    faceOccluder.renderOrder =
        0;

    scene.add(
        faceOccluder
    );

}

function renderLoop() {

    requestAnimationFrame(
        renderLoop
    );

    if (renderer) {

        renderer.render(
            scene,
            threeCamera
        );

    }

}

function cameraSupported() {

    return !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
    );

}

async function startCamera() {

    status.innerText =
        "Opening Camera...";

    cameraError.style.display =
        "none";

    try {

        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(
                    function(track) {
                        track.stop();
                    }
                );

        }

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: true

                });

        video.srcObject =
            stream;

        cameraFacing =
            "user";

        video.style.transform =
            "scaleX(-1)";

        await new Promise(
            function(resolve) {

                if (video.readyState >= 2) {

                    resolve();

                    return;

                }

                video.onloadedmetadata =
                    function() {

                        resolve();

                    };

            }
        );

        await video.play();

        status.innerText =
            "Camera Ready";

        return true;

    } catch (error) {

        console.error(
            "Camera Error:",
            error
        );

        status.innerText =
            "Camera Error";

        cameraError.style.display =
            "block";

        return false;

    }

}/* ==============================
   FACE TRACKING INITIALIZATION
============================== */

function initializeFaceTracking() {

    faceMesh = new FaceMesh({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/face_mesh/" +
                file
            );

        }

    });


    faceMesh.setOptions({

        maxNumFaces: 1,

        refineLandmarks: true,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });


    faceMesh.onResults(
        processFace
    );


    mpCamera = new Camera(

        video,

        {

            onFrame: async function() {

                await faceMesh.send({
                    image: video
                });

            },

            width: 1280,

            height: 720

        }

    );


    mpCamera.start();


    status.innerText =
        "Face Tracking Ready";

}


/* ==============================
   FACE LANDMARK PROCESSING
============================== */

function processFace(results) {

    if (
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ) {

        poseStarted = false;

        if (!importedModel) {

            status.innerText =
                "Show Your Face";

        }

        return;

    }


    const landmarks =
        results.multiFaceLandmarks[0];


    const forehead =
        landmarks[10];

    const chin =
        landmarks[152];

    const leftCheek =
        landmarks[234];

    const rightCheek =
        landmarks[454];

    const nose =
        landmarks[1];


    const leftX =
        1 - leftCheek.x;

    const rightX =
        1 - rightCheek.x;

    const foreheadX =
        1 - forehead.x;

    const chinX =
        1 - chin.x;

    const noseX =
        1 - nose.x;


    const centerX =
        (leftX + rightX) * 0.5;

    const centerY =
        (forehead.y + chin.y) * 0.5;


    const faceWidth =
        Math.abs(
            rightX - leftX
        );

    const faceHeight =
        Math.abs(
            chin.y - forehead.y
        );


    if (faceWidth < 0.02) {

        return;

    }


    const targetX =
        (centerX - 0.5) * 2.2;

    const targetY =
        -(centerY - 0.5) * 1.65;


    const targetScale =
        THREE.MathUtils.clamp(

            faceWidth * 3.2,

            0.45,

            2.2

        );


    const leftPoint =
        new THREE.Vector3(

            leftX,
            -leftCheek.y,
            leftCheek.z

        );


    const rightPoint =
        new THREE.Vector3(

            rightX,
            -rightCheek.y,
            rightCheek.z

        );


    const topPoint =
        new THREE.Vector3(

            foreheadX,
            -forehead.y,
            forehead.z

        );


    const bottomPoint =
        new THREE.Vector3(

            chinX,
            -chin.y,
            chin.z

        );


    const nosePoint =
        new THREE.Vector3(

            noseX,
            -nose.y,
            nose.z

        );


    const xAxis =
        new THREE.Vector3()
            .subVectors(
                rightPoint,
                leftPoint
            )
            .normalize();


    const yAxis =
        new THREE.Vector3()
            .subVectors(
                topPoint,
                bottomPoint
            )
            .normalize();


    const zAxis =
        new THREE.Vector3()
            .crossVectors(
                xAxis,
                yAxis
            )
            .normalize();


    const faceCenter =
        new THREE.Vector3()
            .addVectors(
                leftPoint,
                rightPoint
            )
            .multiplyScalar(0.5);


    const faceDirection =
        new THREE.Vector3()
            .subVectors(
                nosePoint,
                faceCenter
            )
            .normalize();


    if (
        zAxis.dot(
            faceDirection
        ) < 0
    ) {

        zAxis.negate();

    }


    yAxis
        .crossVectors(
            zAxis,
            xAxis
        )
        .normalize();


    const rotationMatrix =
        new THREE.Matrix4();


    rotationMatrix.makeBasis(

        xAxis,
        yAxis,
        zAxis

    );


    const targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion
        .setFromRotationMatrix(
            rotationMatrix
        );


    const targetPosition =
        new THREE.Vector3(

            targetX,

            targetY +
            heightValue,

            depthValue

        );


    smoothPosition.lerp(

        targetPosition,

        0.35

    );


    smoothQuaternion.slerp(

        targetQuaternion,

        0.35

    );


    const finalScale =
        targetScale *
        modelSize;


    smoothScale +=
        (
            finalScale -
            smoothScale
        ) * 0.25;


    headGroup.position.copy(
        smoothPosition
    );


    headGroup.quaternion.copy(
        smoothQuaternion
    );


    headGroup.scale.setScalar(
        smoothScale
    );


    if (faceOccluder) {

        faceOccluder.visible =
            true;


        faceOccluder.position.copy(
            smoothPosition
        );


        faceOccluder.quaternion.copy(
            smoothQuaternion
        );


        const occluderWidth =
            faceWidth * 3.0;


        const occluderHeight =
            faceHeight * 2.8;


        faceOccluder.scale.set(

            occluderWidth,

            occluderHeight,

            occluderWidth * 0.8

        );

    }


    poseStarted = true;


    if (importedModel) {

        status.innerText =
            "3D Tracking Active";

    }

}


/* ==============================
   MODEL FILE INPUT
============================== */

modelFile.addEventListener(

    "change",

    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        loadLocalModel(file);

    }

);


/* ==============================
   LOCAL MODEL LOADING
============================== */

function loadLocalModel(file) {

    const fileName =
        file.name.toLowerCase();


    const objectURL =
        URL.createObjectURL(file);


    status.innerText =
        "Loading 3D Model...";


    if (importedModel) {

        headGroup.remove(
            importedModel
        );


        importedModel.traverse(

            function(child) {

                if (child.geometry) {

                    child.geometry.dispose();

                }


                if (child.material) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material.forEach(
                            disposeMaterial
                        );

                    } else {

                        disposeMaterial(
                            child.material
                        );

                    }

                }

            }

        );


        importedModel =
            null;

    }


    if (
        fileName.endsWith(".glb") ||
        fileName.endsWith(".gltf")
    ) {

        const loader =
            new THREE.GLTFLoader();


        loader.load(

            objectURL,

            function(gltf) {

                prepareImportedModel(
                    gltf.scene
                );

                URL.revokeObjectURL(
                    objectURL
                );

            },

            undefined,

            function(error) {

                console.error(
                    error
                );

                status.innerText =
                    "GLTF Load Failed";

                URL.revokeObjectURL(
                    objectURL
                );

            }

        );

        return;

    }


    if (
        fileName.endsWith(".obj")
    ) {

        const loader =
            new THREE.OBJLoader();


        loader.load(

            objectURL,

            function(object) {

                prepareImportedModel(
                    object
                );

                URL.revokeObjectURL(
                    objectURL
                );

            },

            undefined,

            function(error) {

                console.error(
                    error
                );

                status.innerText =
                    "OBJ Load Failed";

                URL.revokeObjectURL(
                    objectURL
                );

            }

        );

        return;

    }


    if (
        fileName.endsWith(".fbx")
    ) {

        const loader =
            new THREE.FBXLoader();


        loader.load(

            objectURL,

            function(object) {

                prepareImportedModel(
                    object
                );

                URL.revokeObjectURL(
                    objectURL
                );

            },

            undefined,

            function(error) {

                console.error(
                    error
                );

                status.innerText =
                    "FBX Load Failed";

                URL.revokeObjectURL(
                    objectURL
                );

            }

        );

        return;

    }


    URL.revokeObjectURL(
        objectURL
    );


    status.innerText =
        "Unsupported 3D Model";

}


/* ==============================
   MODEL PREPARATION
============================== */

function prepareImportedModel(model) {

    if (!model) {
        return;
    }


    importedModel =
        model;


    const box =
        new THREE.Box3()
            .setFromObject(
                importedModel
            );


    const size =
        new THREE.Vector3();


    const center =
        new THREE.Vector3();


    box.getSize(size);

    box.getCenter(center);


    importedModel.position.sub(
        center
    );


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if (maxDimension > 0) {

        importedModel.scale.setScalar(
            1.8 / maxDimension
        );

    }


    importedModel.traverse(

        function(child) {

            if (child.isMesh) {

                child.frustumCulled =
                    false;

                child.renderOrder =
                    1;


                if (child.material) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material.forEach(

                            function(material) {

                                material.depthTest =
                                    true;

                                material.depthWrite =
                                    true;

                                material.side =
                                    THREE.DoubleSide;

                            }

                        );

                    } else {

                        child.material.depthTest =
                            true;

                        child.material.depthWrite =
                            true;

                        child.material.side =
                            THREE.DoubleSide;

                    }

                }

            }

        }

    );


    headGroup.add(
        importedModel
    );


    importedModel.visible =
        true;


    status.innerText =
        "3D Model Loaded";


    poseStarted =
        false;

}


/* ==============================
   MATERIAL CLEANUP
============================== */

function disposeMaterial(material) {

    if (!material) {
        return;
    }


    if (material.map) {
        material.map.dispose();
    }


    if (material.normalMap) {
        material.normalMap.dispose();
    }


    if (material.roughnessMap) {
        material.roughnessMap.dispose();
    }


    if (material.metalnessMap) {
        material.metalnessMap.dispose();
    }


    if (material.emissiveMap) {
        material.emissiveMap.dispose();
    }


    material.dispose();

}


/* ==============================
   CONTROL EVENTS
============================== */

sizeSlider.addEventListener(

    "input",

    function() {

        modelSize =
            parseFloat(
                sizeSlider.value
            );

    }

);


heightSlider.addEventListener(

    "input",

    function() {

        heightValue =
            parseFloat(
                heightSlider.value
            );

    }

);


depthSlider.addEventListener(

    "input",

    function() {

        depthValue =
            parseFloat(
                depthSlider.value
            );

    }

);/* ==============================
   RECORDING CANVAS
============================== */

function initializeRecordingCanvas() {

    recordCanvas =
        document.createElement("canvas");

    recordContext =
        recordCanvas.getContext("2d");

}


/* ==============================
   UPDATE RECORDING FRAME
============================== */

function updateRecordCanvas() {

    if (
        !recordCanvas ||
        !recordContext
    ) {

        return;

    }


    const width =
        video.videoWidth ||
        window.innerWidth;


    const height =
        video.videoHeight ||
        window.innerHeight;


    if (
        recordCanvas.width !== width ||
        recordCanvas.height !== height
    ) {

        recordCanvas.width =
            width;

        recordCanvas.height =
            height;

    }


    recordContext.clearRect(

        0,
        0,
        width,
        height

    );


    if (
        cameraFacing === "user"
    ) {

        recordContext.save();


        recordContext.translate(
            width,
            0
        );


        recordContext.scale(
            -1,
            1
        );


        recordContext.drawImage(

            video,

            0,
            0,
            width,
            height

        );


        recordContext.restore();

    } else {

        recordContext.drawImage(

            video,

            0,
            0,
            width,
            height

        );

    }


    recordContext.drawImage(

        canvas,

        0,
        0,
        width,
        height

    );


    if (isRecording) {

        recordAnimationId =
            requestAnimationFrame(
                updateRecordCanvas
            );

    }

}


/* ==============================
   START RECORDING
============================== */

async function startRecording() {

    if (isRecording) {
        return;
    }


    if (!window.MediaRecorder) {

        alert(
            "Video recording is not supported."
        );

        return;

    }


    if (!video.srcObject) {

        alert(
            "Camera is not ready."
        );

        return;

    }


    try {

        if (!recordCanvas) {

            initializeRecordingCanvas();

        }


        recordedChunks = [];


        isRecording = true;


        updateRecordCanvas();


        const stream =
            recordCanvas.captureStream(30);


        const audioTracks =
            video.srcObject
                .getAudioTracks();


        audioTracks.forEach(

            function(track) {

                stream.addTrack(
                    track
                );

            }

        );


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp9";

        } else if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp8"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp8";

        } else if (
            MediaRecorder.isTypeSupported(
                "video/webm"
            )
        ) {

            mimeType =
                "video/webm";

        }


        if (mimeType) {

            mediaRecorder =
                new MediaRecorder(

                    stream,

                    {
                        mimeType:
                            mimeType
                    }

                );

        } else {

            mediaRecorder =
                new MediaRecorder(
                    stream
                );

        }


        mediaRecorder.ondataavailable =
            function(event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            function() {

                finishRecording();

            };


        mediaRecorder.onerror =
            function(event) {

                console.error(
                    "Recording Error:",
                    event
                );

                isRecording = false;

                recordButton.innerText =
                    "Record";

                recordButton.classList.remove(
                    "recording"
                );

            };


        mediaRecorder.start(200);


        recordButton.innerText =
            "Stop Recording";


        recordButton.classList.add(
            "recording"
        );


        status.innerText =
            "Recording...";

    }
    catch (error) {

        console.error(
            "Recording Error:",
            error
        );


        isRecording = false;


        recordButton.innerText =
            "Record";


        recordButton.classList.remove(
            "recording"
        );


        status.innerText =
            "Recording Failed";

    }

}


/* ==============================
   STOP RECORDING
============================== */

function stopRecording() {

    if (!isRecording) {
        return;
    }


    isRecording = false;


    if (recordAnimationId) {

        cancelAnimationFrame(
            recordAnimationId
        );

        recordAnimationId =
            null;

    }


    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }


    recordButton.innerText =
        "Record";


    recordButton.classList.remove(
        "recording"
    );


    status.innerText =
        "Processing Video...";

}


/* ==============================
   FINISH RECORDING
============================== */

function finishRecording() {

    if (
        recordedChunks.length === 0
    ) {

        status.innerText =
            "No Video Recorded";

        return;

    }


    const blob =
        new Blob(

            recordedChunks,

            {
                type: "video/webm"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "Azeez-AR-" +
        Date.now() +
        ".webm";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(

        function() {

            URL.revokeObjectURL(
                url
            );

        },

        2000

    );


    recordedChunks = [];


    status.innerText =
        "Video Saved";

}


/* ==============================
   RECORD BUTTON
============================== */

recordButton.addEventListener(

    "click",

    function() {

        if (isRecording) {

            stopRecording();

        } else {

            startRecording();

        }

    }

);


/* ==============================
   CAMERA FLIP
============================== */

flipButton.addEventListener(

    "click",

    async function() {

        const nextFacing =
            cameraFacing === "user"
            ? "environment"
            : "user";


        try {

            if (video.srcObject) {

                video.srcObject
                    .getTracks()
                    .forEach(

                        function(track) {

                            track.stop();

                        }

                    );

            }


            let stream;


            try {

                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: {
                                    exact:
                                        nextFacing
                                },

                                width: {
                                    ideal: 1280
                                },

                                height: {
                                    ideal: 720
                                }

                            },

                            audio: true

                        });

            }
            catch (firstError) {

                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: {
                                    ideal:
                                        nextFacing
                                }

                            },

                            audio: true

                        });

            }


            video.srcObject =
                stream;


            cameraFacing =
                nextFacing;


            video.style.transform =
                cameraFacing === "user"
                ? "scaleX(-1)"
                : "scaleX(1)";


            await video.play();


            status.innerText =
                "Camera Ready";

        }
        catch (error) {

            console.error(
                "Camera Flip Error:",
                error
            );


            status.innerText =
                "Camera Flip Failed";

        }

    }

);


/* ==============================
   RESET CONTROLS
============================== */

resetButton.addEventListener(

    "click",

    function() {

        sizeSlider.value =
            "1";


        heightSlider.value =
            "0";


        depthSlider.value =
            "0";


        modelSize =
            1;


        heightValue =
            0;


        depthValue =
            0;


        smoothPosition.set(
            0,
            0,
            0
        );


        smoothQuaternion.identity();


        smoothScale =
            1;


        if (headGroup) {

            headGroup.position.set(
                0,
                0,
                0
            );


            headGroup.rotation.set(
                0,
                0,
                0
            );


            headGroup.scale.set(
                1,
                1,
                1
            );

        }


        status.innerText =
            importedModel
            ? "Model Reset"
            : "Ready";

    }

);


/* ==============================
   PAGE VISIBILITY
============================== */

document.addEventListener(

    "visibilitychange",

    async function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                video.srcObject &&
                video.paused
            ) {

                try {

                    await video.play();

                }
                catch (error) {

                    console.error(
                        "Video Resume Error:",
                        error
                    );

                }

            }

        }

    }

);async function startApplication() {
    initializeThree();

    if (!cameraSupported()) {
        status.innerText = "Camera Not Supported";
        cameraError.style.display = "block";
        return;
    }

    const cameraStarted = await startCamera();

    if (!cameraStarted) {
        return;
    }

    initializeRecordingCanvas();
    initializeFaceTracking();

    status.innerText = "Face Tracking Active";
}

function stopCameraTracks() {
    if (!video.srcObject) {
        return;
    }

    const tracks = video.srcObject.getTracks();

    tracks.forEach(function(track) {
        track.stop();
    });

    video.srcObject = null;
}

function cleanupThreeObject(object) {
    if (!object) {
        return;
    }

    object.traverse(function(child) {
        if (!child.isMesh) {
            return;
        }

        if (child.geometry) {
            child.geometry.dispose();
        }

        if (Array.isArray(child.material)) {
            child.material.forEach(function(material) {
                disposeMaterial(material);
            });
        } else if (child.material) {
            disposeMaterial(child.material);
        }
    });
}

function resetTrackingState() {
    poseStarted = false;

    smoothPosition.set(0, 0, 0);
    smoothQuaternion.identity();
    smoothScale = 1;

    if (headGroup) {
        headGroup.position.set(0, 0, 0);
        headGroup.quaternion.identity();
        headGroup.scale.set(1, 1, 1);
    }

    if (faceOccluder) {
        faceOccluder.position.set(0, 0, 0);
        faceOccluder.quaternion.identity();
        faceOccluder.scale.set(1, 1, 1);
    }
}

function setCameraMirror() {
    if (cameraFacing === "user") {
        video.style.transform = "scaleX(-1)";
    } else {
        video.style.transform = "scaleX(1)";
    }
}

function updateCameraLayout() {
    if (!video.videoWidth || !video.videoHeight) {
        return;
    }

    resizeAR();
    setCameraMirror();
}

video.addEventListener("loadedmetadata", function() {
    updateCameraLayout();
});

window.addEventListener("orientationchange", function() {
    setTimeout(function() {
        updateCameraLayout();
    }, 250);
});

window.addEventListener("resize", function() {
    updateCameraLayout();
});

function showStatus(message) {
    if (status) {
        status.innerText = message;
    }
}

function showCameraError(message) {
    if (!cameraError) {
        return;
    }

    cameraError.innerHTML = message;
    cameraError.style.display = "block";
}

function hideCameraError() {
    if (!cameraError) {
        return;
    }

    cameraError.style.display = "none";
}

function isModelLoaded() {
    return importedModel !== null;
}

function getCurrentModelScale() {
    return modelSize;
}

function getCurrentHeightOffset() {
    return heightValue;
}

function getCurrentDepthOffset() {
    return depthValue;
}

function applyManualModelOffsets() {
    if (!headGroup) {
        return;
    }

    headGroup.position.y += getCurrentHeightOffset() * 0.25;
    headGroup.position.z += getCurrentDepthOffset() * 0.25;
}

function prepareForRecording() {
    if (!renderer || !canvas) {
        return false;
    }

    if (!renderer.domElement) {
        return false;
    }

    if (!canvas.width || !canvas.height) {
        resizeAR();
    }

    return true;
}

function stopRecordingIfActive() {
    if (!isRecording) {
        return;
    }

    stopRecording();
}

function releaseApplicationResources() {
    stopRecordingIfActive();

    if (mpCamera) {
        try {
            mpCamera.stop();
        } catch (error) {
            console.warn(error);
        }
    }

    stopCameraTracks();

    if (importedModel) {
        cleanupThreeObject(importedModel);
        importedModel = null;
    }

    if (faceOccluder && scene) {
        scene.remove(faceOccluder);
        faceOccluder.geometry.dispose();

        if (faceOccluder.material) {
            faceOccluder.material.dispose();
        }

        faceOccluder = null;
    }

    if (renderer) {
        renderer.dispose();
    }
}

function prepareApplicationUI() {
    hideCameraError();

    if (recordButton) {
        recordButton.innerText = "Record";
        recordButton.classList.remove("recording");
    }

    if (flipButton) {
        flipButton.disabled = false;
    }

    if (resetButton) {
        resetButton.disabled = false;
    }

    if (modelFile) {
        modelFile.value = "";
    }

    if (sizeSlider) {
        sizeSlider.value = "1";
    }

    if (heightSlider) {
        heightSlider.value = "0";
    }

    if (depthSlider) {
        depthSlider.value = "0";
    }
}

function initializeApplicationState() {
    modelSize = 1;
    heightValue = 0;
    depthValue = 0;

    resetTrackingState();
    prepareApplicationUI();
}initializeApplicationState();

window.addEventListener("load", async function() {
    try {
        await startApplication();
    } catch (error) {
        console.error("Application startup error:", error);

        showStatus("Application Startup Failed");

        showCameraError(
            "Unable to start the application.<br><br>" +
            "Please check camera permission and reload the page."
        );
    }
});

window.addEventListener("beforeunload", function() {
    releaseApplicationResources();
});

document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
        if (video && video.srcObject) {
            video.play().catch(function(error) {
                console.warn(error);
            });
        }
    }
});

if (document.readyState === "complete") {
    startApplication().catch(function(error) {
        console.error("Application startup error:", error);
    });
}
