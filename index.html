<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #111;
  font-family: Arial, sans-serif;
}
#container {
  position: fixed; inset: 0; width: 100%; height: 100%;
  overflow: hidden; background: #111;
}
#container video {
  position: absolute !important; inset: 0 !important;
  width: 100% !important; height: 100% !important;
  object-fit: cover !important; z-index: 1 !important;
}
#container canvas {
  position: absolute !important; inset: 0 !important;
  width: 100% !important; height: 100% !important;
  z-index: 2 !important;
}
#topbar {
  position: fixed; top: 10px; left: 10px; right: 10px;
  z-index: 20; display: flex; justify-content: space-between;
  gap: 8px; pointer-events: none;
}
#brand, #status {
  color: white; background: #000b; padding: 10px;
  border-radius: 9px; font-size: 12px; font-weight: bold;
}
button {
  background: #202020ee; color: white;
  border: 1px solid #555; border-radius: 9px;
  padding: 11px 12px; font-size: 12px; font-weight: bold;
}
button.active { background: #075fc5; }
button:disabled { opacity: .45; }
#message {
  position: fixed; z-index: 25; bottom: 190px;
  left: 10px; right: 10px; padding: 9px;
  background: #0009; color: white; border-radius: 8px;
  text-align: center; font-size: 12px; pointer-events: none;
}
#controls {
  position: fixed; left: 8px; right: 8px; bottom: 8px;
  z-index: 30; display: flex; justify-content: center;
  flex-wrap: wrap; gap: 7px;
}
#transformPanel {
  position: fixed; top: 62px; right: 10px; z-index: 35;
  display: flex; flex-direction: column; gap: 7px; width: 125px;
}
#transformPanel button { width: 100%; }
#sizePanel {
  position: fixed; left: 10px; right: 10px; bottom: 112px;
  z-index: 35; padding: 9px 14px; border-radius: 10px;
  background: #000d; color: white; font-size: 13px;
}
#sizePanel label {
  display: block; margin-bottom: 7px; font-weight: bold;
}
#sizeSlider {
  width: 100%; height: 30px; accent-color: #087cff;
}
#sizeValue {
  display: block; margin-top: 3px; text-align: center;
}
#toggleAllBtn {
  position: fixed; z-index: 100; top: 10px; left: 50%;
  transform: translateX(-50%); background: #075fc5;
  border: 1px solid white; padding: 10px 15px;
}
#partsPanel {
  position: fixed; z-index: 36; left: 10px; top: 62px;
  width: 125px; display: flex; flex-direction: column; gap: 6px;
}
#partsPanel button { width: 100%; padding: 9px 5px; }
.hidden { display: none !important; }
#fileInput, #imageInput, #videoInput { display: none; }

@media (orientation: landscape) {
  #controls {
    left: auto; right: 10px; bottom: 8px; width: 190px;
  }
  #controls button { flex: 1 1 75px; }
  #message { bottom: 10px; left: 10px; right: 210px; }
  #sizePanel {
    left: 210px; right: 210px; bottom: 8px;
  }
  #partsPanel { top: 62px; left: 10px; }
}
</style>
</head>

<body>
<div id="container"></div>

<button id="toggleAllBtn">HIDE ALL</button>

<div id="topbar" class="ui-panel">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="message" class="ui-panel">
  Press START CAMERA and allow camera permission.
</div>

<div id="transformPanel" class="ui-panel">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
  <button id="scaleBtn">SCALE GIZMO</button>
  <button id="hideGizmoBtn">HIDE GIZMO</button>
</div>

<div id="partsPanel" class="ui-panel">
  <button id="selectMaskBtn" class="active">SELECT MODEL</button>
  <button id="leftEyeBtn">LEFT EYE</button>
  <button id="rightEyeBtn">RIGHT EYE</button>
  <button id="mouthBtn">MOUTH</button>
  <button id="partsToggleBtn">HIDE FACE PARTS</button>
</div>

<div id="sizePanel" class="ui-panel">
  <label for="sizeSlider">OBJECT SIZE</label>
  <input id="sizeSlider" type="range"
    min="0.01" max="10" step="0.01" value="1">
  <span id="sizeValue">100%</span>
</div>

<div id="controls" class="ui-panel">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="importBtn">IMPORT 3D</button>
  <button id="imageBtn">IMPORT IMAGE</button>
  <button id="videoBtn">IMPORT VIDEO</button>
  <button id="remove3DBtn">REMOVE 3D MODEL</button>
  <button id="disposeBtn">DISPOSE</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<input id="fileInput" type="file" accept=".glb,.gltf,.obj,.fbx">
<input id="imageInput" type="file" accept="image/*">
<input id="videoInput" type="file" accept="video/*">

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");
const fileInput = document.querySelector("#fileInput");
const imageInput = document.querySelector("#imageInput");
const videoInput = document.querySelector("#videoInput");

let mindarThree = null;
let anchor = null;
let avatar = null;
let importedContent = null;
let transformControls = null;
let faceLandmarker = null;
let faceVideo = null;
let faceParts = {};
let running = false;
let starting = false;
let gizmoVisible = true;
let allVisible = true;
let partsVisible = true;
let currentMode = "translate";
let selectedObject = null;
let baseScale = new THREE.Vector3(1, 1, 1);
let currentSizeObject = null;
let activeVideo = null;
let activeObjectURL = null;
let lastLandmarkTime = -1;

function setStatus(text) {
  statusBox.textContent = text;
}
function setMessage(text) {
  messageBox.textContent = text;
}

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }
  async init() {
    const url =
      "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";
    this.gltf = await new GLTFLoader().loadAsync(url);
    this.gltf.scene.traverse(object => {
      if (object.isMesh && object.morphTargetDictionary &&
          object.morphTargetInfluences) {
        this.morphTargetMeshes.push(object);
      }
    });
  }
  updateBlendshapes(blendshapes) {
    if (!blendshapes || !blendshapes.categories) return;
    const values = new Map();
    for (const item of blendshapes.categories) {
      values.set(item.categoryName, item.score);
    }
    for (const mesh of this.morphTargetMeshes) {
      for (const [name, value] of values) {
        const index = mesh.morphTargetDictionary[name];
        if (index !== undefined) mesh.morphTargetInfluences[index] = value;
      }
    }
  }
}

async function initFaceLandmarker() {
  if (faceLandmarker) return faceLandmarker;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1,
    outputFaceBlendshapes: true
  });

  return faceLandmarker;
}

function makePart(name, width, height) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    material
  );
  mesh.name = name;
  mesh.renderOrder = 20;
  mesh.visible = false;
  mesh.userData.cropCanvas = canvas;
  mesh.userData.cropTexture = texture;
  mesh.userData.partName = name;
  return mesh;
}

function createFaceParts() {
  if (!anchor || faceParts.leftEye) return;

  faceParts.leftEye = makePart("LEFT EYE", 0.36, 0.20);
  faceParts.rightEye = makePart("RIGHT EYE", 0.36, 0.20);
  faceParts.mouth = makePart("MOUTH", 0.40, 0.22);

  faceParts.leftEye.position.set(-0.20, 0.12, 0.55);
  faceParts.rightEye.position.set(0.20, 0.12, 0.55);
  faceParts.mouth.position.set(0, -0.22, 0.56);

  anchor.group.add(
    faceParts.leftEye,
    faceParts.rightEye,
    faceParts.mouth
  );
}
function cropLandmarkPart(mesh, video, landmarks, indices) {
  if (!video || !landmarks || !mesh) return;

  const points = indices.map(index => landmarks[index]).filter(Boolean);
  if (points.length < 3) return;

  const xs = points.map(point => point.x * video.videoWidth);
  const ys = points.map(point => point.y * video.videoHeight);

  const minX = Math.max(0, Math.min(...xs));
  const maxX = Math.min(video.videoWidth, Math.max(...xs));
  const minY = Math.max(0, Math.min(...ys));
  const maxY = Math.min(video.videoHeight, Math.max(...ys));

  const width = Math.max(2, maxX - minX);
  const height = Math.max(2, maxY - minY);

  const canvas = mesh.userData.cropCanvas;
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();

  // Clip to the actual landmark outline, not a circle or oval.
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = ((point.x * video.videoWidth - minX) / width) * 256;
    const y = ((point.y * video.videoHeight - minY) / height) * 256;

    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(
    video,
    minX, minY, width, height,
    0, 0, 256, 256
  );

  ctx.restore();
  mesh.userData.cropTexture.needsUpdate = true;
  mesh.visible = partsVisible;
}

function updateFaceParts() {
  if (!faceLandmarker || !faceVideo ||
      faceVideo.readyState < 2 || !anchor) return;

  if (faceVideo.currentTime === lastLandmarkTime) return;
  lastLandmarkTime = faceVideo.currentTime;

  const result = faceLandmarker.detectForVideo(
    faceVideo, performance.now()
  );

  if (!result.faceLandmarks || !result.faceLandmarks.length) {
    Object.values(faceParts).forEach(part => part.visible = false);
    return;
  }

  const points = result.faceLandmarks[0];

  const leftEyeIndices = [
    33, 246, 161, 160, 159, 158, 157, 173,
    133, 155, 154, 153, 145, 144, 163
  ];

  const rightEyeIndices = [
    362, 398, 384, 385, 386, 387, 388, 466,
    263, 249, 390, 373, 374, 380, 381
  ];

  const mouthIndices = [
    61, 185, 40, 39, 37, 0, 267, 269, 270, 409,
    291, 375, 321, 405, 314, 17, 84, 181, 91, 146
  ];

  cropLandmarkPart(faceParts.leftEye, faceVideo, points, leftEyeIndices);
  cropLandmarkPart(faceParts.rightEye, faceVideo, points, rightEyeIndices);
  cropLandmarkPart(faceParts.mouth, faceVideo, points, mouthIndices);
}

function attachGizmo(object) {
  if (!transformControls || !object) return;
  selectedObject = object;
  transformControls.attach(object);
  transformControls.enabled = gizmoVisible;
  transformControls.visible = gizmoVisible;
  setSizeTarget(object);
}

function setSizeTarget(object) {
  currentSizeObject = object;
  if (!object) return;
  baseScale.copy(object.scale);
  document.querySelector("#sizeSlider").value = 1;
  document.querySelector("#sizeValue").textContent = "100%";
}

document.querySelector("#sizeSlider").addEventListener("input", event => {
  if (!currentSizeObject) return;
  const value = Number(event.target.value);
  currentSizeObject.scale.set(
    baseScale.x * value,
    baseScale.y * value,
    baseScale.z * value
  );
  document.querySelector("#sizeValue").textContent =
    Math.round(value * 100) + "%";
});

async function startCamera() {
  if (starting || running) return;
  starting = true;
  document.querySelector("#startBtn").disabled = true;
  setStatus("Starting...");
  setMessage("Loading camera and face tracking...");

  try {
    mindarThree = new MindARThree({ container, maxTrack: 1 });
    const { renderer, scene, camera } = mindarThree;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 2);
    scene.add(light);

    anchor = mindarThree.addAnchor(1);

    if (!avatar) {
      avatar = new Avatar();
      await avatar.init();
    }

    avatar.gltf.scene.scale.set(2, 2, 2);
    anchor.group.add(avatar.gltf.scene);

    transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.setMode(currentMode);
    transformControls.setSize(0.8);
    transformControls.enabled = false;
    scene.add(transformControls);

    await mindarThree.start();
    running = true;

    faceVideo = container.querySelector("video");
    if (!faceVideo) throw new Error("Camera video element not found.");

    await initFaceLandmarker();
    createFaceParts();

    setStatus("Camera running");
    setMessage("Face tracking active. Select an eye or mouth to adjust it.");

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();
      if (estimate && estimate.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }
      updateFaceParts();
      renderer.render(scene, camera);
    });

    attachGizmo(avatar.gltf.scene);

  } catch (error) {
    console.error(error);
    setStatus("Start error");
    setMessage(error.message || "Camera could not start.");
    try {
      mindarThree?.renderer?.setAnimationLoop(null);
      await mindarThree?.stop();
    } catch (e) {}
    mindarThree = null;
    running = false;
  } finally {
    starting = false;
    document.querySelector("#startBtn").disabled = false;
  }
}

function setActiveMode(id) {
  ["moveBtn", "rotateBtn", "scaleBtn"].forEach(buttonId => {
    document.getElementById(buttonId).classList.toggle(
      "active", buttonId === id
    );
  });
}

document.querySelector("#moveBtn").addEventListener("click", () => {
  currentMode = "translate";
  transformControls?.setMode("translate");
  setActiveMode("moveBtn");
});

document.querySelector("#rotateBtn").addEventListener("click", () => {
  currentMode = "rotate";
  transformControls?.setMode("rotate");
  setActiveMode("rotateBtn");
});

document.querySelector("#scaleBtn").addEventListener("click", () => {
  currentMode = "scale";
  transformControls?.setMode("scale");
  setActiveMode("scaleBtn");
});

document.querySelector("#hideGizmoBtn").addEventListener("click", () => {
  gizmoVisible = !gizmoVisible;
  if (transformControls) {
    transformControls.enabled = gizmoVisible;
    transformControls.visible = gizmoVisible;
  }
  document.querySelector("#hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

function selectFacePart(part, buttonId) {
  if (!running || !transformControls) {
    setMessage("Start the camera first.");
    return;
  }
  if (!part) return;

  Object.values(faceParts).forEach(item => {
    item.material.color.set(0xffffff);
  });

  part.material.color.set(0xffffff);
  attachGizmo(part);

  ["selectMaskBtn", "leftEyeBtn", "rightEyeBtn", "mouthBtn"]
    .forEach(id => document.getElementById(id).classList.remove("active"));

  document.getElementById(buttonId).classList.add("active");
  setMessage(part.name + " selected. Use MOVE, ROTATE or SCALE.");
}

document.querySelector("#selectMaskBtn").addEventListener("click", () => {
  if (importedContent) {
    attachGizmo(importedContent);
  } else if (avatar?.gltf?.scene) {
    attachGizmo(avatar.gltf.scene);
  }
  ["selectMaskBtn", "leftEyeBtn", "rightEyeBtn", "mouthBtn"]
    .forEach(id => document.getElementById(id).classList.remove("active"));
  document.querySelector("#selectMaskBtn").classList.add("active");
});

document.querySelector("#leftEyeBtn").addEventListener("click", () => {
  selectFacePart(faceParts.leftEye, "leftEyeBtn");
});
document.querySelector("#rightEyeBtn").addEventListener("click", () => {
  selectFacePart(faceParts.rightEye, "rightEyeBtn");
});
document.querySelector("#mouthBtn").addEventListener("click", () => {
  selectFacePart(faceParts.mouth, "mouthBtn");
});

document.querySelector("#partsToggleBtn").addEventListener("click", () => {
  partsVisible = !partsVisible;
  Object.values(faceParts).forEach(part => {
    part.visible = partsVisible;
  });
  document.querySelector("#partsToggleBtn").textContent =
    partsVisible ? "HIDE FACE PARTS" : "SHOW FACE PARTS";
});

document.querySelector("#toggleAllBtn").addEventListener("click", () => {
  allVisible = !allVisible;
  document.querySelectorAll(".ui-panel").forEach(panel => {
    panel.classList.toggle("hidden", !allVisible);
  });
  document.querySelector("#toggleAllBtn").textContent =
    allVisible ? "HIDE ALL" : "SHOW ALL";
});

document.querySelector("#startBtn").addEventListener("click", startCamera);
document.querySelector("#stopBtn").addEventListener("click", stopCamera);

document.querySelector("#switchBtn").addEventListener("click", async () => {
  if (!running || !mindarThree) {
    setMessage("Start the camera first.");
    return;
  }
  try {
    setMessage("Switching camera...");
    await mindarThree.switchCamera();
    faceVideo = container.querySelector("video");
    lastLandmarkTime = -1;
    setMessage("Camera switched.");
  } catch (error) {
    setMessage("Camera switch failed: " + error.message);
  }
});

document.querySelector("#importBtn").addEventListener("click", () => {
  fileInput.click();
});
document.querySelector("#imageBtn").addEventListener("click", () => {
  imageInput.click();
});
document.querySelector("#videoBtn").addEventListener("click", () => {
  videoInput.click();
});

function disposeObject(object) {
  if (!object) return;
  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material : [child.material];
      materials.forEach(material => {
        for (const key in material) {
          const value = material[key];
          if (value?.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });
}

function removeContent() {
  if (importedContent) {
    transformControls?.detach();
    disposeObject(importedContent);
    importedContent.removeFromParent();
    importedContent = null;
  }

  currentSizeObject = null;

  if (activeVideo) {
    activeVideo.pause();
    activeVideo.removeAttribute("src");
    activeVideo.load();
    activeVideo = null;
  }
  if (activeObjectURL) {
    URL.revokeObjectURL(activeObjectURL);
    activeObjectURL = null;
  }
}

async function load3DFile(file) {
  if (!running || !anchor) {
    setMessage("Start the camera before importing a model.");
    return;
  }

  setMessage("Loading 3D model...");
  const extension = file.name.split(".").pop().toLowerCase();
  const objectURL = URL.createObjectURL(file);

  try {
    let model;
    if (extension === "glb" || extension === "gltf") {
      model = (await new GLTFLoader().loadAsync(objectURL)).scene;
    } else if (extension === "obj") {
      model = await new OBJLoader().loadAsync(objectURL);
    } else if (extension === "fbx") {
      model = await new FBXLoader().loadAsync(objectURL);
    } else {
      throw new Error("Unsupported model format.");
    }

    removeContent();
    if (avatar?.gltf?.scene) avatar.gltf.scene.visible = false;

    importedContent = model;
    anchor.group.add(importedContent);
    importedContent.position.set(0, 0, 0);
    importedContent.rotation.set(0, 0, 0);
    importedContent.scale.set(1, 1, 1);

    attachGizmo(importedContent);
    activeObjectURL = objectURL;
    setMessage("3D model imported.");
  } catch (error) {
    URL.revokeObjectURL(objectURL);
    setMessage("3D import error: " + error.message);
  }
}

fileInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (file) await load3DFile(file);
  fileInput.value = "";
});

function createMediaPlane(texture, videoElement = null) {
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    })
  );

  removeContent();
  if (avatar?.gltf?.scene) avatar.gltf.scene.visible = false;

  importedContent = plane;
  anchor.group.add(plane);
  plane.position.set(0, 0, 0);
  plane.rotation.set(0, 0, 0);
  plane.scale.set(1, 1, 1);

  attachGizmo(plane);
  if (videoElement) activeVideo = videoElement;
}

imageInput.addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!running || !anchor) {
    setMessage("Start the camera before importing an image.");
    imageInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  new THREE.TextureLoader().load(
    url,
    texture => {
      texture.colorSpace = THREE.SRGBColorSpace;
      createMediaPlane(texture);
      activeObjectURL = url;
      setMessage("Image imported successfully.");
    },
    undefined,
    () => {
      URL.revokeObjectURL(url);
      setMessage("Image import failed.");
    }
  );
  imageInput.value = "";
});

videoInput.addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!running || !anchor) {
    setMessage("Start the camera before importing a video.");
    videoInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.autoplay = true;

  video.addEventListener("loadeddata", async () => {
    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;
    createMediaPlane(texture, video);
    activeObjectURL = url;
    try {
      await video.play();
      setMessage("Video imported and playing.");
    } catch (error) {
      setMessage("Video imported. Tap to play.");
    }
  }, { once: true });

  video.addEventListener("error", () => {
    URL.revokeObjectURL(url);
    setMessage("Video import failed.");
  }, { once: true });

  videoInput.value = "";
});

document.querySelector("#remove3DBtn").addEventListener("click", () => {
  if (!importedContent) {
    setMessage("No imported 3D model to remove.");
    return;
  }

  removeContent();

  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = true;
    attachGizmo(avatar.gltf.scene);
  }

  setMessage("Imported 3D model removed.");
});

document.querySelector("#disposeBtn").addEventListener("click", () => {
  if (!importedContent) {
    setMessage("No imported content to dispose.");
    return;
  }

  removeContent();
  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = true;
    attachGizmo(avatar.gltf.scene);
  }
  setMessage("Imported content removed.");
});

async function stopCamera() {
  if (!mindarThree) return;

  try {
    transformControls?.detach();
    transformControls?.dispose();
    mindarThree.renderer?.setAnimationLoop(null);
    await mindarThree.stop();
  } catch (error) {
    console.error(error);
  }

  mindarThree = null;
  transformControls = null;
  anchor = null;
  running = false;
  faceVideo = null;

  container.innerHTML = "";
  faceParts = {};
  selectedObject = null;
  currentSizeObject = null;

  setStatus("Camera stopped");
  setMessage("Press START CAMERA to begin.");
}

document.querySelector("#fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen is not available.");
  }
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
  } catch (error) {}
});
</script>
</body>
</html>
