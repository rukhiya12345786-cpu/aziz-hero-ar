<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aziz Hero AR</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial;
}

#video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#three{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}

#ui{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button,label{
  background:white;
  color:#111;
  padding:13px 16px;
  border-radius:10px;
  font-weight:bold;
  border:0;
}

#file{
  display:none;
}

#status{
  position:fixed;
  top:15px;
  left:15px;
  z-index:20;
  background:rgba(0,0,0,.75);
  color:white;
  padding:10px 14px;
  border-radius:10px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="three"></canvas>

<div id="status">
  Camera Ready
</div>

<div id="ui">

<button id="start">📷 Start Camera</button>

<button id="switch">🔄 Front / Back</button>

<label for="file">📦 IMPORT 3D MODEL</label>

<input
  id="file"
  type="file"
  accept=".glb,.gltf"
>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


const video =
document.getElementById("video");

const canvas =
document.getElementById("three");

const status =
document.getElementById("status");

const start =
document.getElementById("start");

const switchBtn =
document.getElementById("switch");

const file =
document.getElementById("file");


let stream=null;

let facing="user";


// THREE SCENE

const scene =
new THREE.Scene();


const camera =
new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.z=5;


const renderer =
new THREE.WebGLRenderer({
canvas:canvas,
alpha:true,
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);


// LIGHT

const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
2,3,5
);

scene.add(light);


// MODEL

let model=null;

const loader =
new GLTFLoader();


file.addEventListener(
"change",
function(){

const selected =
file.files[0];

if(!selected)return;

status.textContent=
"Loading 3D Model...";

const url =
URL.createObjectURL(selected);


loader.load(

url,

function(gltf){

if(model){

scene.remove(model);

}


model =
gltf.scene;


// MODEL POSITION

model.position.set(
0,
0,
0
);


// MODEL SIZE

model.scale.set(
1,
1,
1
);


scene.add(model);

status.textContent=
"✅ 3D MODEL LOADED";


URL.revokeObjectURL(url);

},

undefined,

function(error){

console.error(error);

status.textContent=
"❌ MODEL ERROR";

}

);

});


// CAMERA

async function startCamera(){

try{

if(stream){

stream
.getTracks()
.forEach(
track=>track.stop()
);

}

stream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:facing
},

audio:false

});


video.srcObject=stream;

await video.play();

status.textContent=
"📷 Camera ON";

}

catch(error){

console.error(error);

status.textContent=
"❌ Camera Error";

}

}


start.onclick=
startCamera;


// SWITCH CAMERA

switchBtn.onclick=
async function(){

facing =
facing==="user"
?"environment"
:"user";

await startCamera();

};


// ANIMATION

function animate(){

requestAnimationFrame(
animate
);

if(model){

model.rotation.y +=
0.01;

}

renderer.render(
scene,
camera
);

}

animate();


// RESIZE

window.addEventListener(
"resize",
function(){

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});

</script>

</body>
</html>
