<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera Face Test</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:20;

    max-width:90%;

    background:rgba(0,0,0,.8);
    color:white;

    padding:10px 14px;
    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:15px;

    text-align:center;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 28px;

    font-size:20px;
    font-weight:bold;

    border:0;
    border-radius:10px;

    background:white;
    color:black;
}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<canvas id="three"></canvas>


<div id="status">
CAMERA READY
</div>


<button id="open">
OPEN CAMERA
</button>



<script type="module">


/* =====================================
   THREE.JS
===================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


const video =
document.getElementById("camera");

const canvas =
document.getElementById("three");

const button =
document.getElementById("open");

const status =
document.getElementById("status");



/* =====================================
   THREE SCENE
===================================== */

const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.1,
    100

);


camera3D.position.z = 4;



const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    alpha:true,

    antialias:true

});


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);



/* =====================================
   LIGHT
===================================== */

const light =
new THREE.DirectionalLight(

    0xffffff,
    3

);


light.position.set(

    2,
    3,
    5

);


scene.add(light);


scene.add(

    new THREE.AmbientLight(
        0xffffff,
        2
    )

);



/* =====================================
   SMALL CUBE
===================================== */

const geometry =
new THREE.BoxGeometry(

    0.55,
    0.55,
    0.55

);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(

    geometry,
    material

);


cube.position.set(

    0,
    0,
    0

);


scene.add(cube);



/* =====================================
   RENDER
===================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    renderer.render(

        scene,
        camera3D

    );

}


animate();



/* =====================================
   CAMERA
===================================== */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA OK — LOADING FACE...";


        /*
        IMPORTANT:

        Camera is already working
        before MediaPipe starts.
        */

        startFaceTracking();

    }

    catch(error){

        showError(
            "CAMERA ERROR",
            error
        );

    }

};



/* =====================================
   ERROR DISPLAY
===================================== */

function showError(
    title,
    error
){

    console.error(
        title,
        error
    );


    let message =
    "";


    if(error){

        message =
        error.message ||
        String(error);

    }


    status.innerText =
    title +
    ": " +
    message;

}



/* =====================================
   FACE TRACKING
===================================== */

async function startFaceTracking(){

    try{

        status.innerText =
        "LOADING MEDIAPIPE...";


        /*
        LOAD MEDIAPIPE AFTER CAMERA
        */

        const vision =
        await import(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"

        );


        status.innerText =
        "MEDIAPIPE LOADED";


        const FilesetResolver =
        vision.FilesetResolver;


        const FaceLandmarker =
        vision.FaceLandmarker;



        /* =================================
           WASM
        ================================= */

        const fileset =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


        status.innerText =
        "LOADING FACE MODEL...";



        /* =================================
           FACE LANDMARKER
        ================================= */

        const faceLandmarker =
        await FaceLandmarker.createFromOptions(

            fileset,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    /*
                    CPU FIRST.

                    GPU is disabled for this test.
                    */

                    delegate:"CPU"

                },


                runningMode:"VIDEO",

                numFaces:1,


                minFaceDetectionConfidence:
                0.5,


                minFacePresenceConfidence:
                0.5,


                minTrackingConfidence:
                0.5,


                outputFaceBlendshapes:false,


                /*
                Keep this ON because later
                we need real 3D head rotation.
                */

                outputFacialTransformationMatrixes:
                true

            }

        );


        status.innerText =
        "FACE MODEL READY ✓";


        startDetection(
            faceLandmarker
        );

    }

    catch(error){

        showError(
            "FACE MODEL ERROR",
            error
        );

    }

}



/* =====================================
   DETECTION
===================================== */

let lastVideoTime = -1;


function startDetection(
    faceLandmarker
){

    requestAnimationFrame(

        function(){

            startDetection(
                faceLandmarker
            );

        }

    );


    if(

        video.readyState <
        video.HAVE_CURRENT_DATA

    ){

        return;

    }


    if(

        video.currentTime ===
        lastVideoTime

    ){

        return;

    }


    lastVideoTime =
    video.currentTime;


    try{

        const result =
        faceLandmarker.detectForVideo(

            video,

            performance.now()

        );


        if(

            result.faceLandmarks &&
            result.faceLandmarks.length > 0

        ){

            status.innerText =
            "FACE DETECTED ✓";

        }

        else{

            status.innerText =
            "FACE TRACKING ON — FACE NOT FOUND";

        }

    }

    catch(error){

        showError(
            "DETECTION ERROR",
            error
        );

    }

}



/* =====================================
   RESIZE
===================================== */

window.addEventListener(

    "resize",

    function(){

        camera3D.aspect =

        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


</script>

</body>

</html>
