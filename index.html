
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Azeez AR Face Tracking</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:white;font-family:Arial,sans-serif}
#view{position:fixed;inset:0;overflow:hidden;background:#080b10}
#cameraVideo,#dotsCanvas{position:absolute;inset:0;width:100%;height:100%}
#cameraVideo{object-fit:contain;background:#080b10}
#dotsCanvas{pointer-events:none}
#topbar{position:absolute;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;flex-wrap:wrap;gap:7px;z-index:5}
button{border:1px solid #454c5a;background:#171d28;color:white;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
button:active{background:#334155}
button:disabled{opacity:.45}
#status{position:absolute;bottom:12px;left:10px;right:10px;z-index:5;background:#111a;color:#fff;padding:10px;border-radius:9px;font-size:13px}
#toast{position:absolute;top:70px;left:10px;right:10px;z-index:9;text-align:center;background:#252d3b;padding:10px;border-radius:8px;display:none}
#toast.show{display:block}
#help{position:absolute;left:10px;right:10px;bottom:60px;color:#cbd5e1;font-size:12px;z-index:4;text-align:center}
</style>
</head>
<body>
<div id="view">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <canvas id="dotsCanvas"></canvas>

  <div id="topbar">
    <button id="startCameraBtn">START CAMERA</button>
    <button id="stopCameraBtn" disabled>STOP CAMERA</button>
    <button id="switchCameraBtn">SWITCH CAMERA</button>
    <button id="mirrorBtn">MIRROR OFF</button>
    <button id="fullscreenBtn">FULL SCREEN</button>
    <button id="startTrackingBtn">START TRACKING</button>
    <button id="stopTrackingBtn" disabled>STOP TRACKING</button>
    <button id="greenDotsBtn">GREEN DOTS ON</button>
  </div>

  <div id="help">Start camera, then start tracking. Internet is required to load the tracking model.</div>
  <div id="status">Ready. Start the camera first.</div>
  <div id="toast"></div>
</div>

</body>
</html>
<script type="module">
const $ = id => document.getElementById(id);

const video = $("cameraVideo");
const canvas = $("dotsCanvas");
const ctx = canvas.getContext("2d");

let stream = null;
let tracker = null;
let facingMode = "user";
let mirrored = false;
let showDots = true;
let tracking = false;
let frameId = null;
let lastVideoTime = -1;

function status(message) {
  $("status").textContent = message;
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 3000);
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function clearDots() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function updateMirror() {
  video.style.transform = mirrored ? "scaleX(-1)" : "none";
  $("mirrorBtn").textContent = mirrored ? "MIRROR ON" : "MIRROR OFF";
}

async function startCamera() {
  try {
    if (stream) return;

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Open this site using HTTPS in Chrome.");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();
    resizeCanvas();

    $("startCameraBtn").disabled = true;
    $("stopCameraBtn").disabled = false;
    status("Camera started. Now press START TRACKING.");
    toast("Camera started.");
  } catch (error) {
    console.error(error);
    status("Camera error: " + error.message);
    toast("Allow camera permission and try again.");
  }
}

function stopTracking() {
  tracking = false;

  if (frameId !== null) {
    cancelAnimationFrame(frameId);
    frameId = null;
  }

  clearDots();
  $("startTrackingBtn").disabled = false;
  $("stopTrackingBtn").disabled = true;
  status("Face tracking stopped.");
}

function stopCamera() {
  stopTracking();

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  $("startCameraBtn").disabled = false;
  $("stopCameraBtn").disabled = true;
  clearDots();
  status("Camera stopped.");
}

async function switchCamera() {
  const wasRunning = !!stream;

  if (wasRunning) {
    stopCamera();
  }

  facingMode = facingMode === "user" ? "environment" : "user";

  if (wasRunning) {
    await startCamera();
  } else {
    toast(facingMode === "user" ? "Front camera selected." : "Back camera selected.");
  }
}

async function loadTracker() {
  if (tracker) return tracker;

  status("Loading face tracking library...");

  const mp = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
  );

  status("Loading tracking model...");

  const vision = await mp.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  tracker = await mp.FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });

  return tracker;
}

async function startTracking() {
  if (!stream) {
    toast("Start camera first.");
    return;
  }

  if (tracking) return;

  $("startTrackingBtn").disabled = true;
  status("Connecting to face tracking...");

  try {
    await loadTracker();

    tracking = true;
    lastVideoTime = -1;
    $("stopTrackingBtn").disabled = false;
    status("Tracking active. Look at the camera.");
    trackFrame();
  } catch (error) {
    console.error("Tracking setup error:", error);
    tracking = false;
    $("startTrackingBtn").disabled = false;

    status("Tracking error: " + error.message);
    toast("Model failed to load. Check internet and reload the page.");
  }
}

function trackFrame() {
  if (!tracking || !stream || !tracker) return;

  frameId = requestAnimationFrame(trackFrame);

  if (video.readyState < 2 || video.currentTime === lastVideoTime) {
    return;
  }

  lastVideoTime = video.currentTime;

  try {
    const result = tracker.detectForVideo(video, performance.now());
    clearDots();

    if (!showDots || !result.faceLandmarks?.length) return;

    const rect = canvas.getBoundingClientRect();
    const vw = video.videoWidth || 1;
    const vh = video.videoHeight || 1;

    const scale = Math.min(rect.width / vw, rect.height / vh);
    const drawW = vw * scale;
    const drawH = vh * scale;
    const offsetX = (rect.width - drawW) / 2;
    const offsetY = (rect.height - drawH) / 2;

    ctx.fillStyle = "#00ff66";

    for (const point of result.faceLandmarks[0]) {
      const px = mirrored ? 1 - point.x : point.x;
      const x = offsetX + px * drawW;
      const y = offsetY + point.y * drawH;

      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  } catch (error) {
    console.error("Tracking frame error:", error);
  }
}

function toggleDots() {
  showDots = !showDots;
  $("greenDotsBtn").textContent = showDots ? "GREEN DOTS ON" : "GREEN DOTS OFF";
  if (!showDots) clearDots();
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await $("view").requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error(error);
    toast("Fullscreen unavailable in this browser.");
  }

  setTimeout(resizeCanvas, 200);
}

$("startCameraBtn").addEventListener("click", startCamera);
$("stopCameraBtn").addEventListener("click", stopCamera);
$("switchCameraBtn").addEventListener("click", switchCamera);

$("mirrorBtn").addEventListener("click", () => {
  mirrored = !mirrored;
  updateMirror();
});

$("fullscreenBtn").addEventListener("click", toggleFullscreen);
$("startTrackingBtn").addEventListener("click", startTracking);
$("stopTrackingBtn").addEventListener("click", stopTracking);
$("greenDotsBtn").addEventListener("click", toggleDots);

video.addEventListener("loadedmetadata", resizeCanvas);
window.addEventListener("resize", resizeCanvas);
document.addEventListener("fullscreenchange", () => setTimeout(resizeCanvas, 200));

resizeCanvas();
updateMirror();
status("Ready. Start the camera first.");
</script>
</body>
</html>
