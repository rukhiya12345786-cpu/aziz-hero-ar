<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>REAL 3D FACE TRACK TEST</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

#cameraCanvas,
#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#cameraCanvas{
    z-index:1;
}

#threeCanvas{
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    top:15px;
    left:10px;
    right:10px;
    z-index:20;

    padding:12px;

    background:rgba(0,0,0,.82);
    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:15px;

    white-space:pre-wrap;
    word-break:break-word;
}

#start{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    z-index:30;

    padding:16px 25px;

    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<video id="camera"
       autoplay
       playsinline
       muted></video>

<canvas id="cameraCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div id="status">READY</div>

<button id="start">START 3D FACE</button>


<script type="module">

/* =====================================================
   THREE.JS
===================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   IMPORTANT:
   NEW FACE LANDMARKER LOADER

   NOT vision_bundle.mjs
   NOT esm.sh
===================================================== */

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const cameraCanvas =
document.getElementById("cameraCanvas");

const threeCanvas =
document.getElementById("threeCanvas");

const status =
document.getElementById("status");

const start =
document.getElementById("start");

const ctx =
cameraCanvas.getContext("2d");


/* =====================================================
   THREE
===================================================== */

const scene =
new THREE.Scene();

const camera3D =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera3D.position.z = 4;


const renderer =
new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


/* =====================================================
   HEAD ANCHOR
===================================================== */

const headAnchor =
new THREE.Group();

scene.add(headAnchor);


/* =====================================================
   TEST 3D MASK
===================================================== */

const mask =
new THREE.Mesh(
    new THREE.BoxGeometry(
        0.42,
        0.42,
        0.42
    ),
    new THREE.MeshNormalMaterial()
);

headAnchor.add(mask);


/* =====================================================
   FACE LANDMARKER
===================================================== */

let faceLandmarker = null;

let stream = null;

let running = false;

let lastVideoTime = -1;


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){
    status.innerText = text;
}


/* =====================================================
   LOAD FACE LANDMARKER
===================================================== */

async function loadFaceLandmarker(){

    setStatus(
        "1/3\n\n" +
        "LOADING FACE LANDMARKER..."
    );


    const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    setStatus(
        "2/3\n\n" +
        "WASM LOADED ✓\n\n" +
        "CREATING FACE LANDMARKER..."
    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"CPU"
            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:0.5,

            minFacePresenceConfidence:0.5,

            minTrackingConfidence:0.5,

            outputFaceBlendshapes:false,

            outputFacialTransformationMatrixes:true
        }
    );


    setStatus(
        "2/3 ✓\n\n" +
        "FACE LANDMARKER READY ✓"
    );
}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    stream =
    await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:"user",

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            }
        },

        audio:false
    });


    video.srcObject =
    stream;

    await video.play();


    setStatus(
        "3/3\n\n" +
        "CAMERA ON ✓\n\n" +
        "FINDING FACE..."
    );
}


/* =====================================================
   CAMERA DRAW
===================================================== */

function drawCamera(){

    requestAnimationFrame(
        drawCamera
    );


    if(
        video.readyState < 2 ||
        !video.videoWidth
    ){
        return;
    }


    const cw =
    cameraCanvas.width;

    const ch =
    cameraCanvas.height;

    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    const scale =
    Math.max(
        cw / vw,
        ch / vh
    );


    const drawW =
    vw * scale;

    const drawH =
    vh * scale;

    const x =
    (cw - drawW) / 2;

    const y =
    (ch - drawH) / 2;


    /*
       SAME CAMERA MIRROR
       THAT WAS WORKING BEFORE.
    */

    ctx.save();

    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );

    ctx.translate(
        cw,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        video,
        0,
        0,
        vw,
        vh,
        x,
        y,
        drawW,
        drawH
    );

    ctx.restore();
}


/* =====================================================
   FACE TRACKING
===================================================== */

function track(){

    requestAnimationFrame(
        track
    );


    if(
        !running ||
        !faceLandmarker ||
        video.readyState < 2
    ){
        return;
    }


    if(
        video.currentTime ===
        lastVideoTime
    ){
        return;
    }


    lastVideoTime =
    video.currentTime;


    try{

        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );


        /*
           NO FACE
        */

        if(
            !result ||
            !result.faceLandmarks ||
            result.faceLandmarks.length === 0
        ){

            mask.visible = false;

            setStatus(
                "FACE TRACKING\n\n" +
                "FACE NOT FOUND"
            );

            return;
        }


        mask.visible = true;


        /*
           478 3D LANDMARKS
        */

        const landmarks =
        result.faceLandmarks[0];


        /*
           NOSE / FACE CENTER

           Landmark 1 is used as the
           visible head anchor.
        */

        const nose =
        landmarks[1];


        /*
           Convert normalized face position
           into Three.js coordinates.
        */

        const x =
        (0.5 - nose.x) * 4.2;

        const y =
        (0.5 - nose.y) * 3.0;


        /*
           Z from face depth.

           This is only the anchor position.
           Rotation below comes from the
           REAL facial transformation matrix.
        */

        const z =
        -nose.z * 2.0;


        headAnchor.position.set(
            x,
            y,
            z
        );


        /*
           REAL 3D FACIAL TRANSFORMATION MATRIX
        */

        if(
            result.facialTransformationMatrixes &&
            result.facialTransformationMatrixes.length > 0
        ){

            const data =
            result
            .facialTransformationMatrixes[0]
            .data;


            if(
                data &&
                data.length >= 16
            ){

                const matrix =
                new THREE.Matrix4();

                matrix.fromArray(
                    data
                );


                const position =
                new THREE.Vector3();

                const quaternion =
                new THREE.Quaternion();

                const scale =
                new THREE.Vector3();


                matrix.decompose(
                    position,
                    quaternion,
                    scale
                );


                /*
                   IMPORTANT:

                   Do NOT use matrix POSITION.

                   Position comes from the
                   visible face landmark.

                   Rotation comes from the
                   REAL 3D facial matrix.
                */

                headAnchor.quaternion.slerp(
                    quaternion,
                    0.65
                );


                setStatus(
                    "3D FACE TRACKING ✓\n\n" +
                    "478 LANDMARKS ✓\n" +
                    "HEAD ROTATION ✓\n" +
                    "TRANSFORMATION MATRIX ✓"
                );

            }

        }

    }catch(error){

        mask.visible = false;

        setStatus(
            "TRACKING ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

        console.error(
            "FACE TRACK ERROR:",
            error
        );
    }
}


/* =====================================================
   RENDER
===================================================== */

function render(){

    requestAnimationFrame(
        render
    );

    renderer.render(
        scene,
        camera3D
    );
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const w =
    window.innerWidth;

    const h =
    window.innerHeight;


    cameraCanvas.width =
    w;

    cameraCanvas.height =
    h;


    renderer.setSize(
        w,
        h
    );


    camera3D.aspect =
    w / h;

    camera3D.updateProjectionMatrix();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   START
===================================================== */

start.onclick =
async function(){

    start.disabled = true;

    try{

        await loadFaceLandmarker();

        await openCamera();

        running = true;

        start.style.display =
        "none";

        drawCamera();

        track();

    }catch(error){

        console.error(error);

        setStatus(
            "ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

        start.disabled = false;
    }
};


/* =====================================================
   INIT
===================================================== */

resize();

render();

</script>

</body>
</html>
