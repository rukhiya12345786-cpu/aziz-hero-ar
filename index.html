<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR - Face Tracking Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#threeCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 16px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    padding: 8px 14px;
    border-radius: 8px;
}

#startButton {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    padding: 16px 28px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    z-index: 10;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
    }
}
</script>

</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="threeCanvas"></canvas>

<div id="status">Ready</div>

<button id="startButton">START TRACKING</button>

<script type="module">

import * as THREE from "three";

import {
    FaceLandmarker,
    FilesetResolver
} from "@mediapipe/tasks-vision";

const video = document.getElementById("camera");
const canvas = document.getElementById("threeCanvas");
const status = document.getElementById("status");
const button = document.getElementById("startButton");

let faceLandmarker = null;
let lastVideoTime = -1;

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera3D.position.z = 5;

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(478 * 3);

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
);

const material = new THREE.PointsMaterial({
    color: 0x00ff00,
    size: 0.025
});

const facePoints = new THREE.Points(
    geometry,
    material
);

scene.add(facePoints);

async function createFaceTracker() {

    status.textContent = "Loading face tracker...";

    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    faceLandmarker = await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU"
            },

            runningMode: "VIDEO",

            numFaces: 1,

            outputFaceBlendshapes: false,

            outputFacialTransformationMatrixes: true
        }
    );

    status.textContent = "Face tracker loaded";
}

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user"
                },
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        await createFaceTracker();

        button.style.display = "none";

        status.textContent = "Looking for face...";

        requestAnimationFrame(trackFace);

    } catch (error) {

        console.error(error);

        status.textContent =
            "Tracking error: " + error.message;
    }
}

function trackFace() {

    if (
        video.readyState >= 2 &&
        faceLandmarker
    ) {

        if (video.currentTime !== lastVideoTime) {

            lastVideoTime = video.currentTime;

            const result =
                faceLandmarker.detectForVideo(
                    video,
                    performance.now()
                );

            if (
                result.faceLandmarks &&
                result.faceLandmarks.length > 0
            ) {

                const landmarks =
                    result.faceLandmarks[0];

                const count =
                    Math.min(
                        landmarks.length,
                        478
                    );

                for (let i = 0; i < count; i++) {

                    const point =
                        landmarks[i];

                    const x =
                        (point.x - 0.5) * 4;

                    const y =
                        -(point.y - 0.5) * 4;

                    const z =
                        -point.z * 4;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;
                }

                geometry.attributes.position.needsUpdate = true;

                status.textContent =
                    "FACE TRACKING: ON";

            } else {

                status.textContent =
                    "Looking for face...";
            }
        }
    }

    renderer.render(scene, camera3D);

    requestAnimationFrame(trackFace);
}

button.addEventListener(
    "click",
    startCamera
);

window.addEventListener(
    "resize",
    () => {

        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;

        camera3D.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
