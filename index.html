<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

#threeCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#landmarkCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 10;
}

#status {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,0.75);
    color: #00ff00;
    font-size: 14px;
    font-weight: bold;
}

#startButton {
    display: block;
    margin-top: 10px;
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: #00ff00;
    color: #000;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>

<canvas id="landmarkCanvas"></canvas>

<div id="ui">
    <div id="status">READY</div>
    <button id="startButton">START CAMERA</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js?v=11";

const video = document.getElementById("camera");
const threeCanvas = document.getElementById("threeCanvas");
const landmarkCanvas = document.getElementById("landmarkCanvas");

const status = document.getElementById("status");
const startButton = document.getElementById("startButton");

let faceLandmarker = null;
let trackingStarted = false;


/* THREE */

const renderer = new THREE.WebGLRenderer({
    canvas: threeCanvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

const scene = new THREE.Scene();

const threeCamera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

threeCamera.position.z = 5;


/* CUBE */

const cubeGeometry =
    new THREE.BoxGeometry(1, 1, 1);

const cubeMaterial =
    new THREE.MeshNormalMaterial();

const cube =
    new THREE.Mesh(
        cubeGeometry,
        cubeMaterial
    );

cube.scale.set(
    0.45,
    0.45,
    0.45
);

scene.add(cube);


/* CUBE ANIMATION */

function animateCube() {

    requestAnimationFrame(animateCube);

    renderer.render(
        scene,
        threeCamera
    );
}

animateCube();


/* CAMERA */

async function startCamera() {

    try {

        status.textContent =
            "OPENING CAMERA...";

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        status.textContent =
            "CAMERA OK";

        startButton.style.display =
            "none";

        await loadFaceTracker();

    } catch (error) {

        console.error(error);

        status.textContent =
            "CAMERA ERROR";
    }
}


/* MEDIAPIPE */

async function loadFaceTracker() {

    try {

        status.textContent =
            "LOADING FACE TRACKER...";

        const vision =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
            );

        const {
            FaceLandmarker,
            FilesetResolver
        } = vision;

        const filesetResolver =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
            );

        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                filesetResolver,
                {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                        delegate: "GPU"
                    },

                    runningMode: "VIDEO",

                    numFaces: 1,

                    outputFaceBlendshapes: false,

                    outputFacialTransformationMatrixes: true
                }
            );

        status.textContent =
            "FACE TRACKER READY";

        trackingStarted = true;

        requestAnimationFrame(trackFace);

    } catch (error) {

        console.error(error);

        status.textContent =
            "TRACKER ERROR";
    }
}


/* GREEN DOTS */

function drawLandmarks(landmarks) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    landmarkCanvas.width =
        Math.round(width * dpr);

    landmarkCanvas.height =
        Math.round(height * dpr);

    const ctx =
        landmarkCanvas.getContext("2d");

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for (const point of landmarks) {

        const x =
            point.x * width;

        const y =
            point.y * height;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            12,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(0,255,0,0.25)";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ff00";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }
}/* FACE TO CUBE TRACKING */

function updateCubeFromFace(landmarks) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    /* Nose */

    const nose =
        landmarks[1];


    /* Left eye */

    const leftEye =
        landmarks[33];


    /* Right eye */

    const rightEye =
        landmarks[263];


    /* Face position */

    const faceX =
        nose.x * width;

    const faceY =
        nose.y * height;


    /* Move cube to face */

    const normalizedX =
        (faceX / width) * 2 - 1;

    const normalizedY =
        -((faceY / height) * 2 - 1);


    cube.position.x =
        normalizedX * 2.25;

    cube.position.y =
        normalizedY * 1.7;


    /* Face size */

    const dx =
        rightEye.x - leftEye.x;

    const dy =
        rightEye.y - leftEye.y;

    const eyeDistance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const cubeSize =
        Math.max(
            0.25,
            Math.min(
                1.15,
                eyeDistance * 3.2
            )
        );


    cube.scale.set(
        cubeSize,
        cubeSize,
        cubeSize
    );


    /* Head left/right rotation */

    const angle =
        Math.atan2(
            dy,
            dx
        );

    cube.rotation.z =
        -angle;
}


/* FACE TRACKING */

function trackFace() {

    if (
        !trackingStarted ||
        !faceLandmarker
    ) {

        requestAnimationFrame(
            trackFace
        );

        return;
    }


    if (video.readyState >= 2) {

        try {

            const now =
                performance.now();

            const result =
                faceLandmarker.detectForVideo(
                    video,
                    now
                );


            if (
                result.faceLandmarks &&
                result.faceLandmarks.length > 0
            ) {

                const landmarks =
                    result.faceLandmarks[0];


                /* Green dots */

                drawLandmarks(
                    landmarks
                );


                /* Cube follows face */

                updateCubeFromFace(
                    landmarks
                );


                status.textContent =
                    "HEAD TRACKING: ON";

            } else {

                const ctx =
                    landmarkCanvas.getContext("2d");

                ctx.clearRect(
                    0,
                    0,
                    landmarkCanvas.width,
                    landmarkCanvas.height
                );

                status.textContent =
                    "FACE NOT FOUND";
            }

        } catch (error) {

            console.error(error);

            status.textContent =
                "TRACKING ERROR";
        }
    }


    requestAnimationFrame(
        trackFace
    );
}


/* RESIZE */

window.addEventListener(
    "resize",
    () => {

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        threeCamera.aspect =
            window.innerWidth /
            window.innerHeight;

        threeCamera.updateProjectionMatrix();

    }
);


/* START */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
