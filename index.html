<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez AR - 3D & Camera</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #cameraStream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vw;
            object-fit: cover;
            z-index: 1;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none; /* Allows touch to pass through 3D canvas */
        }
        .ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            max-width: 500px;
        }
        button, label.upload-btn {
            padding: 10px 15px;
            font-size: 14px;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        label.upload-btn {
            background: #ffc107;
            color: #000;
            display: inline-block;
        }
        input[type="file"] {
            display: none;
        }
        #recordBtn { background: #28a745; }
        #stopBtn { background: #dc3545; display: none; }
    </style>

    <!-- Libraries for Three.js and loading 3D models -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- Camera video background -->
    <video id="cameraStream" autoplay playsinline muted></video>

    <!-- Screen to show 3D model -->
    <div id="webgl-container"></div>

    <!-- Controls and buttons -->
    <div class="ui-layer">
        <button id="flipBtn">Flip Camera</button>
        <label class="upload-btn">
            Upload 3D (GLB)
            <input type="file" id="fileInput" accept=".glb,.gltf">
        </label>
        <button id="recordBtn">Record</button>
        <button id="stopBtn">Stop</button>
    </div>

    <script>
        const videoElement = document.getElementById('cameraStream');
        const flipBtn = document.getElementById('flipBtn');
        const fileInput = document.getElementById('fileInput');
        
        let useFrontCamera = true;
        let currentStream;
        let scene, camera, renderer, currentModel;

        // Start camera function
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (error) {
                alert("Camera error: " + error);
            }
        }

        flipBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Three.js 3D setup
        function init3D() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Add lighting so 3D model is clearly visible
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            // Rotate model slightly if loaded (for test)
            if (currentModel) {
                currentModel.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        // Upload and load 3D file (GLB)
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();

                loader.parse(contents, '', (gltf) => {
                    if (currentModel) {
                        scene.remove(currentModel);
                    }
                    currentModel = gltf.scene;
                    currentModel.scale.set(1.5, 1.5, 1.5); // Set model scale
                    scene.add(currentModel);
                }, (error) => {
                    alert("Error loading 3D model: " + error);
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Start app
        startCamera();
        init3D();

        // Adjust on screen size change
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
