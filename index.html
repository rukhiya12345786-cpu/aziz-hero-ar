<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 25px;
    font-size:18px;
    z-index:2;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<button id="start">START CAMERA</button>

<script>

document.getElementById("start").onclick =
async function(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        document.getElementById("video").srcObject =
        stream;

        this.style.display = "none";

    }catch(error){

        alert(
            error.name + "\n\n" +
            error.message
        );

    }

};

</script>

</body>
</html>
