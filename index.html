<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>AR Head 3D Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#three{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    max-height:48vh;
    overflow-y:auto;
    padding:12px;
    background:rgba(0,0,0,.78);
    color:#fff;
    z-index:20;
    border-radius:18px 18px 0 0;
}

button,
.fileButton{
    border:0;
    border-radius:10px;
    padding:10px 13px;
    margin:3px;
    font-weight:bold;
    font-size:13px;
}

button{
    background:#fff;
    color:#000;
}

.fileButton{
    display:inline-block;
    background:#fff;
    color:#000;
    cursor:pointer;
}

#file{
    display:none;
}

.row{
    margin-top:7px;
}

.row label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:3px;
}

input[type=range]{
    width:100%;
}

#status{
    margin-top:7px;
    font-size:12px;
}

#title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:6px;
}
</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           muted
           playsinline></video>

    <canvas id="three"></canvas>

    <div id="controls">

        <div id="title">
            3D HEAD TRACKER
        </div>

        <label class="fileButton">
            IMPORT GLB
            <input id="file"
                   type="file"
                   accept=".glb,.gltf">
        </label>

        <button id="cameraBtn">
            START CAMERA
        </button>

        <button id="resetBtn">
            RESET
        </button>

        <div class="row">
            <label>
                UP / DOWN
                <span id="upVal">0</span>
            </label>
            <input id="up"
                   type="range"
                   min="-1"
                   max="1"
                   step="0.01"
                   value="0">
        </div>

        <div class="row">
            <label>
                LEFT / RIGHT
                <span id="sideVal">0</span>
            </label>
            <input id="side"
                   type="range"
                   min="-1"
                   max="1"
                   step="0.01"
                   value="0">
        </div>

        <div class="row">
            <label>
                FRONT / BACK
                <span id="depthVal">0</span>
            </label>
            <input id="depth"
                   type="range"
                   min="-1"
                   max="1"
                   step="0.01"
                   value="0">
        </div>

        <div class="row">
            <label>
                SIZE
                <span id="sizeVal">1</span>
            </label>
            <input id="size"
                   type="range"
                   min="0.1"
                   max="3"
                   step="0.01"
                   value="1">
        </div>

        <div class="row">
            <label>
                ROTATION X
                <span id="rxVal">180°</span>
            </label>
            <input id="rx"
                   type="range"
                   min="-180"
                   max="180"
                   step="1"
                   value="180">
        </div>

        <div class="row">
            <label>
                ROTATION Y
                <span id="ryVal">0°</span>
            </label>
            <input id="ry"
                   type="range"
                   min="-180"
                   max="180"
                   step="1"
                   value="0">
        </div>

        <div class="row">
            <label>
                ROTATION Z
                <span id="rzVal">0°</span>
            </label>
            <input id="rz"
                   type="range"
                   min="-180"
                   max="180"
                   step="1"
                   value="0">
        </div>

        <div id="status">
            Model: Not loaded
        </div>

    </div>
</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("three");

const status =
    document.getElementById("status");


/* =====================================================
   THREE.JS
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.OrthographicCamera(
        -1,
        1,
        1,
        -1,
        0.01,
        100
    );

camera.position.z = 5;


const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   LIGHTS
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

light.position.set(
    0,
    2,
    5
);

scene.add(light);


/* =====================================================
   TRACKING GROUP
===================================================== */

const headGroup =
    new THREE.Group();

scene.add(headGroup);


/* =====================================================
   MODEL
===================================================== */

let model = null;

const loader =
    new THREE.GLTFLoader();


document
.getElementById("file")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file) return;


        const url =
            URL.createObjectURL(file);


        loader.load(
            url,

            function(gltf){

                if(model){

                    headGroup.remove(model);

                }


                model =
                    gltf.scene;


                /*
                   GLB को headGroup के अंदर रखेंगे।
                   इससे tracking और manual controls
                   अलग-अलग रहेंगे।
                */

                headGroup.add(model);


                /*
                   Model center निकालना
                */

                const box =
                    new THREE.Box3()
                    .setFromObject(model);


                const center =
                    new THREE.Vector3();


                box.getCenter(center);


                /*
                   Model को अपने center पर लाना
                */

                model.position.sub(center);


                /*
                   Initial scale
                */

                model.scale.set(
                    1,
                    1,
                    1
                );


                /*
                   उल्टे model को ठीक करने
                   के लिए default X = 180°
                */

                model.rotation.set(
                    THREE.MathUtils.degToRad(180),
                    0,
                    0
                );


                model.traverse(
                    function(obj){

                        if(obj.isMesh){

                            obj.frustumCulled =
                                false;

                        }

                    }
                );


                status.textContent =
                    "Model: GLB loaded ✓";


                URL.revokeObjectURL(url);

            },

            undefined,

            function(error){

                console.error(error);

                status.textContent =
                    "GLB load failed";

            }
        );

    }
);


/* =====================================================
   SLIDERS
===================================================== */

const sliders = {

    up:
        document.getElementById("up"),

    side:
        document.getElementById("side"),

    depth:
        document.getElementById("depth"),

    size:
        document.getElementById("size"),

    rx:
        document.getElementById("rx"),

    ry:
        document.getElementById("ry"),

    rz:
        document.getElementById("rz")

};


/* =====================================================
   MANUAL SETTINGS
===================================================== */

const manual = {

    up:0,

    side:0,

    depth:0,

    size:1,

    rx:180,

    ry:0,

    rz:0

};


function readControls(){

    manual.up =
        Number(sliders.up.value);

    manual.side =
        Number(sliders.side.value);

    manual.depth =
        Number(sliders.depth.value);

    manual.size =
        Number(sliders.size.value);

    manual.rx =
        Number(sliders.rx.value);

    manual.ry =
        Number(sliders.ry.value);

    manual.rz =
        Number(sliders.rz.value);


    document.getElementById("upVal")
        .textContent =
        manual.up.toFixed(2);


    document.getElementById("sideVal")
        .textContent =
        manual.side.toFixed(2);


    document.getElementById("depthVal")
        .textContent =
        manual.depth.toFixed(2);


    document.getElementById("sizeVal")
        .textContent =
        manual.size.toFixed(2);


    document.getElementById("rxVal")
        .textContent =
        manual.rx + "°";


    document.getElementById("ryVal")
        .textContent =
        manual.ry + "°";


    document.getElementById("rzVal")
        .textContent =
        manual.rz + "°";
}


Object.values(sliders)
.forEach(function(slider){

    slider.addEventListener(
        "input",
        readControls
    );

});


readControls();


/* =====================================================
   RESET
===================================================== */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    function(){

        sliders.up.value =
            0;

        sliders.side.value =
            0;

        sliders.depth.value =
            0;

        sliders.size.value =
            1;

        sliders.rx.value =
            180;

        sliders.ry.value =
            0;

        sliders.rz.value =
            0;


        readControls();

    }
);


/* =====================================================
   CAMERA
===================================================== */

let stream = null;

let faceMesh = null;

let trackingRunning = false;


document
.getElementById("cameraBtn")
.addEventListener(
    "click",
    startCamera
);


async function startCamera(){

    if(trackingRunning) return;


    try{

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        createFaceMesh();


        trackingRunning =
            true;


        status.textContent =
            "Camera + tracking started ✓";


        trackingLoop();


    }catch(error){

        console.error(error);

        status.textContent =
            "Camera permission required";

    }

}


/* =====================================================
   MEDIAPIPE
===================================================== */

function createFaceMesh(){

    faceMesh =
        new FaceMesh({

            locateFile:function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/face_mesh/" +
                    file
                );

            }

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });


    faceMesh.onResults(
        faceResults
    );

}


/* =====================================================
   FACE VARIABLES
===================================================== */

let targetX = 0;

let targetY = 0;

let targetZ = 0;

let targetYaw = 0;

let targetPitch = 0;

let targetRoll = 0;


/* =====================================================
   FACE TRACKING
===================================================== */

function faceResults(results){

    if(
        !results ||
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    if(!model) return;


    const face =
        results.multiFaceLandmarks[0];


    const forehead =
        face[10];

    const leftEye =
        face[33];

    const rightEye =
        face[263];

    const nose =
        face[1];

    const chin =
        face[152];


    if(
        !forehead ||
        !leftEye ||
        !rightEye ||
        !nose ||
        !chin
    ){

        return;

    }


    /* =================================================
       FACE SIZE
    ================================================= */

    const faceWidth =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    if(faceWidth < 0.01) return;


    /* =================================================
       HEAD CENTER
    ================================================= */

    const eyeCenterX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    /*
       Forehead से ऊपर anchor.
       यही helmet/cap position है।
    */

    const topY =
        forehead.y -
        faceHeight * 0.38;


    /* =================================================
       SCREEN → THREE
    ================================================= */

    targetX =
        (eyeCenterX - 0.5) * 2;


    targetY =
        -(topY - 0.5) * 2;


    /*
       Depth based on face size.
    */

    targetZ =
        -(faceWidth * 1.8);


    /* =================================================
       YAW — LEFT / RIGHT
    ================================================= */

    const eyeMidX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    const noseOffsetX =
        (
            nose.x -
            eyeMidX
        ) / faceWidth;


    targetYaw =
        THREE.MathUtils.clamp(
            noseOffsetX * 2.0,
            -1.1,
            1.1
        );


    /* =================================================
       PITCH — UP / DOWN
    ================================================= */

    const faceMidY =
        (
            forehead.y +
            chin.y
        ) / 2;


    const noseOffsetY =
        (
            nose.y -
            faceMidY
        ) / faceHeight;


    targetPitch =
        THREE.MathUtils.clamp(
            noseOffsetY * 1.4,
            -0.8,
            0.8
        );


    /* =================================================
       ROLL — HEAD TILT
    ================================================= */

    const dx =
        rightEye.x -
        leftEye.x;


    const dy =
        rightEye.y -
        leftEye.y;


    targetRoll =
        THREE.MathUtils.clamp(
            Math.atan2(dy,dx),
            -0.8,
            0.8
        );


    status.textContent =
        "Head detected ✓";

}


/* =====================================================
   SMOOTH TRACKING
===================================================== */

function updateModel(){

    if(!model) return;


    /*
       Manual position offsets.
    */

    const manualX =
        manual.side * 0.8;


    const manualY =
        manual.up;


    const manualZ =
        manual.depth;


    /*
       Smooth position
    */

    headGroup.position.x +=
        (
            targetX +
            manualX -
            headGroup.position.x
        ) * 0.18;


    headGroup.position.y +=
        (
            targetY +
            manualY -
            headGroup.position.y
        ) * 0.18;


    headGroup.position.z +=
        (
            targetZ +
            manualZ -
            headGroup.position.z
        ) * 0.18;


    /*
       Automatic head rotation
       + manual rotation.
    */

    headGroup.rotation.x +=
        (
            targetPitch -
            headGroup.rotation.x
        ) * 0.18;


    headGroup.rotation.y +=
        (
            targetYaw -
            headGroup.rotation.y
        ) * 0.18;


    headGroup.rotation.z +=
        (
            targetRoll -
            headGroup.rotation.z
        ) * 0.18;


    /*
       Manual GLB rotation
       अलग से apply होगी।
    */

    model.rotation.x =
        THREE.MathUtils.degToRad(
            manual.rx
        );


    model.rotation.y =
        THREE.MathUtils.degToRad(
            manual.ry
        );


    model.rotation.z =
        THREE.MathUtils.degToRad(
            manual.rz
        );


    /*
       Manual size
    */

    const s =
        manual.size;


    model.scale.set(
        s,
        s,
        s
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(
        faceMesh &&
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        try{

            await faceMesh.send({
                image:video
            });

        }catch(error){

            console.log(
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   RENDER LOOP
===================================================== */

function render(){

    requestAnimationFrame(
        render
    );


    updateModel();


    renderer.render(
        scene,
        camera
    );

}


render();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
