<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziz Hero AR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 10px 16px;
            background: rgba(0,0,0,.7);
            color: white;
            border-radius: 10px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div id="status">AZIZ AR — JavaScript Test</div>

    <video id="camera" autoplay playsinline></video>

    <script type="module" src="./js/app.js"></script>

</body>
</html>
