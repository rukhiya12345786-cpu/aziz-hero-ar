<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz 3D Face Morph & Model Studio</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .btn {
            background: rgba(0, 0, 0, 0.8); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 16px; font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        input[type="file"] { display: none; }

        /* Control Panel for Full 3D Rotation & Position */
        #control-panel {
            position: absolute; right: 12px; top: 70px;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3); padding: 10px;
            border-radius: 12px; display: flex; flex-direction: column; gap: 8px; width: 180px;
            max-height: 82vh; overflow-y: auto;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 3px; color: #00ff88; font-size: 10px; font-weight: bold; }
        .ctrl-group .btn-row { display: flex; gap: 4px; }
        .ctrl-group button { flex: 1; background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .ctrl-group button:active { background: #ff0055; }

        .bottom-dock {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 25px; border-radius: 30px; display: flex; align-items: center; gap: 20px;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 15px 35px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>Aziz 3D Face Morph Studio</h2>
        <p>Tap below to start 3D AR Tracker</p>
        <button id="launch-btn">START 3D APP</button>
        <p id="error-box" style="color: #ff4444; font-size: 12px; margin-top: 15px;"></p>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip Cam</button>
            <button id="take-snap" class="btn interactive">📸 Snapshot</button>
        </div>

        <div id="control-panel" class="interactive">
            <div class="ctrl-group" style="background: rgba(0,255,136,0.1); padding: 4px; border-radius: 4px; border: 1px solid #00ff88;">
                <span>DEPTH (BACK / FRONT)</span>
                <div class="btn-row">
                    <button onclick="adjust('posZ', -0.05)" style="background:#ff0055;">◀ BACK</button>
                    <button onclick="adjust('posZ', 0.05)" style="background:#00ff88; color:#000;">FRONT ▶</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>SCALE / SIZE</span>
                <div class="btn-row">
                    <button onclick="adjust('scale', -0.05)">-</button>
                    <button onclick="adjust('scale', 0.05)">+</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>MOVE (X / Y)</span>
                <div class="btn-row">
                    <button onclick="adjust('posX', -0.02)">L</button>
                    <button onclick="adjust('posX', 0.02)">R</button>
                    <button onclick="adjust('posY', -0.02)">D</button>
                    <button onclick="adjust('posY', 0.02)">U</button>
                </div>
            </div>

            <div class="ctrl-group" style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px;">
                <span>ROTATE Y (LEFT/RIGHT)</span>
                <div class="btn-row">
                    <button onclick="adjust('rotY', -0.2)">↺</button>
                    <button onclick="adjust('rotY', 0.2)">↻</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>ROTATE X (TILT)</span>
                <div class="btn-row">
                    <button onclick="adjust('rotX', -0.2)">▲</button>
                    <button onclick="adjust('rotX', 0.2)">
