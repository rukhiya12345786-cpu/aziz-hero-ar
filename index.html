<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Aziz Hero AR</title>  <style>  
html,body{  
  margin:0;  
  width:100%;  
  height:100%;  
  overflow:hidden;  
  background:#000;  
  font-family:Arial;  
}  
  
#camera{  
  position:absolute;  
  width:100%;  
  height:100%;  
  object-fit:cover;  
}  
  
#canvas{  
  position:absolute;  
  left:0;  
  top:0;  
  width:100%;  
  height:100%;  
}  
  
#status{  
  position:fixed;  
  top:15px;  
  left:15px;  
  z-index:10;  
  padding:10px 15px;  
  border-radius:10px;  
  background:rgba(0,0,0,.7);  
  color:white;  
  font-weight:bold;  
}  
  
button{  
  position:fixed;  
  bottom:20px;  
  left:50%;  
  transform:translateX(-50%);  
  z-index:20;  
  padding:15px 25px;  
  border:0;  
  border-radius:12px;  
  font-size:16px;  
  font-weight:bold;  
}  
</style>  </head>  <body>  <video  
id="camera"  
autoplay  
playsinline  
muted>
</video>

<canvas id="canvas"></canvas>

<div id="status">  
  Face Detector Loading...  
</div>  <button id="start">  
  📷 START CAMERA  
</button>  <script type="module">  
  
import {  
  FaceDetector,  
  FilesetResolver  
}  
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";  
  
  
const video =  
  document.getElementById("camera");  
  
const canvas =  
  document.getElementById("canvas");  
  
const ctx =  
  canvas.getContext("2d");  
  
const status =  
  document.getElementById("status");  
  
const start =  
  document.getElementById("start");  
  
  
let detector = null;  
let stream = null;  
  
  
/* =========================  
   LOAD MEDIAPIPE  
========================= */  
  
async function loadFaceDetector(){  
  
  try{  
  
    const vision =  
      await FilesetResolver.forVisionTasks(  
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"  
      );  
  
    detector =  
      await FaceDetector.createFromOptions(  
        vision,  
        {  
          baseOptions:{  
            modelAssetPath:  
              "https://storage.googleapis.com/mediapipe-models/face_detector/face_detector/float16/1/face_detector.tflite"  
          },  
  
          runningMode:"VIDEO",  
  
          minDetectionConfidence:0.5  
        }  
      );  
  
    status.textContent =  
      "Face Detector Ready";  
  
  }catch(error){  
  
    console.error(error);  
  
    status.textContent =  
      "Face Detector Error";  
  
  }  
  
}  
  
  
/* =========================  
   CAMERA  
========================= */  
  
async function startCamera(){  
  
  try{  
  
    stream =  
      await navigator.mediaDevices  
      .getUserMedia({  
  
        video:{  
          facingMode:"user",  
          width:{ideal:1280},  
          height:{ideal:720}  
        },  
  
        audio:false  
  
      });  
  
    video.srcObject =  
      stream;  
  
    await video.play();  
  
    status.textContent =  
      "Camera ON - Detecting Face";  
  
    resizeCanvas();  
  
    detectFace();  
  
  }catch(error){  
  
    console.error(error);  
  
    status.textContent =  
      "Camera Error";  
  
  }  
  
}  
  
  
/* =========================  
   FACE DETECTION  
========================= */  
  
function detectFace(){  
  
  if(  
    !detector ||  
    video.readyState < 2  
  ){  
  
    requestAnimationFrame(  
      detectFace  
    );  
  
    return;  
  }  
  
  
  const now =  
    performance.now();  
  
  
  const result =  
    detector.detectForVideo(  
      video,  
      now  
    );  
  
  
  drawFace(result);  
  
  
  requestAnimationFrame(  
    detectFace  
  );  
  
}  
  
  
/* =========================  
   DRAW FACE BOX  
========================= */  
  
function drawFace(result){  
  
  ctx.clearRect(  
    0,  
    0,  
    canvas.width,  
    canvas.height  
  );  
  
  
  if(  
    !result ||  
    !result.detections ||  
    result.detections.length === 0  
  ){  
  
    status.textContent =  
      "Camera ON - Face not found";  
  
    return;  
  
  }  
  
  
  status.textContent =  
    "🙂 FACE DETECTED";  
  
  
  const face =  
    result.detections[0];  
  
  
  const box =  
    face.boundingBox;  
  
  
  const scaleX =  
    canvas.width /  
    video.videoWidth;  
  
  
  const scaleY =  
    canvas.height /  
    video.videoHeight;  
  
  
  const x =  
    box.originX *  
    scaleX;  
  
  const y =  
    box.originY *  
    scaleY;  
  
  const w =  
    box.width *  
    scaleX;  
  
  const h =  
    box.height *  
    scaleY;  
  
  
  ctx.strokeStyle =  
    "#00ff88";  
  
  ctx.lineWidth =  
    4;  
  
  ctx.strokeRect(  
    x,  
    y,  
    w,  
    h  
  );  
  
}  
  
  
/* =========================  
   CANVAS SIZE  
========================= */  
  
function resizeCanvas(){  
  
  canvas.width =  
    video.videoWidth ||  
    window.innerWidth;  
  
  canvas.height =  
    video.videoHeight ||  
    window.innerHeight;  
  
}  
  
  
video.addEventListener(  
  "loadedmetadata",  
  resizeCanvas  
);  
  
  
window.addEventListener(  
  "resize",  
  resizeCanvas  
);  
  
  
start.addEventListener(  
  "click",  
  startCamera  
);  
  
  
/* =========================  
   START  
========================= */  
  
loadFaceDetector();  
  
</script>  </body>  
</html>
