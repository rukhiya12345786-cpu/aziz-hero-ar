<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera Left Right Test</title>

<style>

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

}

#camera{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

}

#left{

    position:fixed;

    left:20px;
    top:50%;

    transform:translateY(-50%);

    z-index:10;

    background:red;

    color:white;

    padding:15px;

    font-size:25px;

    font-weight:bold;

}

#right{

    position:fixed;

    right:20px;
    top:50%;

    transform:translateY(-50%);

    z-index:10;

    background:blue;

    color:white;

    padding:15px;

    font-size:25px;

    font-weight:bold;

}

#open{

    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 30px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

}

#status{

    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:20;

    background:rgba(0,0,0,.8);

    color:white;

    padding:12px 18px;

    border-radius:10px;

    font-size:18px;

}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<div id="left">
LEFT
</div>


<div id="right">
RIGHT
</div>


<div id="status">
CAMERA TEST
</div>


<button id="open">
OPEN CAMERA
</button>


<script>

const video =
document.getElementById("camera");

const button =
document.getElementById("open");

const status =
document.getElementById("status");


button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA RAW";

    }

    catch(error){

        status.innerText =
        "CAMERA ERROR";

        alert(

            error.name +
            "\n\n" +
            error.message

        );

    }

};

</script>


</body>

</html>
