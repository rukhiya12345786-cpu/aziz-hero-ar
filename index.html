<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#05070c">
<title>Azeez AR Full Screen</title>

<style>
:root {
  color-scheme: dark;
  --panel-alpha: 0.48;
  --panel-bg: rgba(8, 13, 24, var(--panel-alpha));
  --panel-border: rgba(255, 255, 255, 0.22);
  --accent: #38bdf8;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  position: fixed;
  inset: 0;
  overscroll-behavior: none;
}

button,
input,
select {
  font: inherit;
}

button {
  min-height: 40px;
  padding: 9px 12px;
  color: #fff;
  background: rgba(23, 34, 52, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.45;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

input[type="file"] {
  display: none;
}

/* Full-screen camera stage */

#cameraStage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  isolation: isolate;
}

#cameraVideo,
#threeCanvas,
#faceCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#cameraVideo {
  z-index: 0;
  object-fit: cover;
  background: #000;
}

#threeCanvas {
  z-index: 1;
  pointer-events: none;
}

#faceCanvas {
  z-index: 2;
  pointer-events: none;
}

#cameraPlaceholder {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 28px;
  text-align: center;
  color: #dce8f8;
  background: #05070c;
}

#cameraPlaceholder strong {
  font-size: 23px;
  letter-spacing: 1px;
}

#cameraPlaceholder span {
  max-width: 290px;
  color: #9eacc1;
  font-size: 13px;
  line-height: 1.6;
}

#cameraPlaceholder button {
  pointer-events: auto;
  background: #075985;
  border-color: #0284c7;
}

/* Transparent floating panels */

.overlay-panel {
  position: absolute;
  z-index: 10;
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  padding: 10px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#topControls {
  top: max(8px, env(safe-area-inset-top));
  max-height: 43dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

#sliderOverlay {
  top: 50%;
  bottom: max(8px, env(safe-area-inset-bottom));
  transform: translateY(-50%);
  max-height: 72dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.panel-title {
  margin: 0 0 9px;
  font-size: 14px;
  font-weight: 800;
}

.panel-note {
  margin: 7px 0 0;
  color: #d1dbea;
  font-size: 11px;
  line-height: 1.5;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.primary-button {
  background: rgba(3, 105, 161, 0.85);
  border-color: #38bdf8;
}

.success-button {
  background: rgba(6, 95, 70, 0.88);
  border-color: #34d399;
}

.danger-button {
  background: rgba(127, 29, 29, 0.86);
  border-color: #f87171;
}

.section-divider {
  height: 1px;
  margin: 10px 0;
  background: rgba(255, 255, 255, 0.18);
}

.status-text {
  margin-top: 8px;
  color: #e1eafa;
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.slider-group {
  margin-top: 12px;
}

.slider-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 12px;
}

.slider-value {
  color: #7dd3fc;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.hidden-panel {
  display: none !important;
}

#floatingVisibility {
  position: absolute;
  z-index: 30;
  left: 8px;
  right: 8px;
  bottom: max(8px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  pointer-events: none;
}

#floatingVisibility button {
  pointer-events: auto;
  background: rgba(8, 13, 24, 0.78);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  border-color: rgba(255, 255, 255, 0.4);
}

#floatingVisibility button:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-height: 600px) {
  #topControls {
    max-height: 38dvh;
  }

  #sliderOverlay {
    max-height: 65dvh;
  }

  button {
    min-height: 34px;
    padding: 6px 9px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<main id="cameraStage">

  <video id="cameraVideo"
    autoplay
    muted
    playsinline></video>

  <canvas id="threeCanvas"></canvas>
  <canvas id="faceCanvas"></canvas>

  <div id="cameraPlaceholder">
    <strong>AZEEZ AR</strong>
    <span>
      Full-screen face tracking and 3D model studio.
      Press Start Camera to begin.
    </span>
    <button type="button" id="placeholderStartBtn">
      START CAMERA
    </button>
  </div>

  <section class="overlay-panel" id="topControls">
    <h1 class="panel-title">AZEEZ AR CONTROLS</h1>

    <div class="button-grid">
      <button type="button" id="startCameraBtn"
        class="success-button">START CAMERA</button>

      <button type="button" id="stopCameraBtn"
        class="danger-button">STOP CAMERA</button>

      <button type="button" id="switchCameraBtn">
        FRONT / BACK
      </button>

      <button type="button" id="mirrorBtn">
        MIRROR: OFF
      </button>

      <button type="button" id="startTrackingBtn"
        class="primary-button">START FACE TRACKING</button>

      <button type="button" id="stopTrackingBtn">
        STOP TRACKING
      </button>
    </div>

    <div class="section-divider"></div>

    <h2 class="panel-title">3D MODEL</h2>

    <div class="button-grid">
      <button type="button" id="importModelBtn">
        IMPORT 3D MODEL
      </button>

      <button type="button" id="resetModelBtn">
        RESET MODEL
      </button>

      <button type="button" id="exportSettingsBtn">
        EXPORT SETTINGS
      </button>

      <button type="button" id="importSettingsBtn">
        IMPORT SETTINGS
      </button>
    </div>

    <div class="status-text" id="cameraStatus">
      Camera stopped.
    </div>

    <div class="status-text" id="faceStatus">
      Face tracking not started.
    </div>

    <div class="status-text" id="modelStatus">
      No model loaded.
    </div>
  </section>

  <input type="file" id="modelFileInput"
    accept=".glb,.gltf,.obj,.fbx">

  <input type="file" id="settingsFileInput"
    accept=".json,application/json">

  <input type="file" id="recordingFileInput"
    accept="video/*" hidden>
    <div class="section-divider"></div>

    <h2 class="panel-title">RECORDING</h2>

    <div class="button-grid">
      <button type="button" id="startRecordingBtn"
        class="success-button">START RECORDING</button>

      <button type="button" id="stopRecordingBtn"
        class="danger-button">STOP RECORDING</button>
    </div>

    <div class="status-text" id="recordingStatus">
      Recording stopped.
    </div>

    <div class="section-divider"></div>

    <h2 class="panel-title">SETTINGS</h2>

    <div class="button-grid">
      <button type="button" id="resetAllBtn">
        RESET ALL SETTINGS
      </button>

      <button type="button" id="toggleFullscreenBtn">
        FULLSCREEN
      </button>
    </div>

    <div class="status-text" id="generalStatus">
      Azeez AR ready. Start the camera to begin.
    </div>

  </section>

  <!-- Always-visible independent visibility buttons -->

  <div id="floatingVisibility">

    <button type="button" id="toggleSlidersBtn">
      HIDE SLIDERS
    </button>

    <button type="button" id="toggleControlsBtn">
      HIDE CONTROLS
    </button>

  </div>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
