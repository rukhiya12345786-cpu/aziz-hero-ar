<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Format 3D Character Adjuster</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            outline: none;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.96);
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(18, 18, 18, 0.9);
            padding: 14px 16px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            z-index: 100;
            color: #fff;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        .slider-group {
            margin-bottom: 10px;
        }
        .slider-group:last-child {
            margin-bottom: 0;
        }
        .slider-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            color: #ccc;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/libs/fflate.min.js"></script>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="top-bar">
        <button class="btn" id="import-btn">Import Model</button>
        <button class="btn" id="flip-cam-btn">Flip Cam</button>
        <button class="btn" id="record-btn">Record</button>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label>Scale (Size)</label>
            <input type="range" id="scale-slider" min="0.1" max="3" step="0.05" value="1">
        </div>
        <div class="slider-group">
            <label>Position X (Left/Right)</label>
            <input type="range" id="pos-x-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Y (Up/Down)</label>
            <input type="range" id="pos-y-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Z (Depth)</label>
            <input type="range" id="pos-z-slider" min="-5" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate X</label>
            <input type="range" id="rot-x-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate Y</label>
            <input type="range" id="rot-y-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
    </div>

    <input type="file" id="file-input" accept=".glb, .gltf, .obj, .fbx, .vrm" style="display: none;">

    <script>
        const videoElement = document.getElementById('webcam-video');
        let useFrontCamera = true;
        let currentStream = null;

        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                await videoElement.play();
            } catch (error) {
                console.warn("Camera initialization warning:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });

        document.getElementById('flip-cam-btn').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        // Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 1.4, 1.5);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        let currentModel = null;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const importBtn = document.getElementById('import-btn');
        const fileInput = document.getElementById('file-input');

        importBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        // Handle File Import based on file extension
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            const fileName = file.name.toLowerCase();

            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            if (fileName.endsWith('.glb') || fileName.endsWith('.gltf') || fileName.endsWith('.vrm')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);
                    currentModel.rotation.y = Math.PI;
                    alert("GLB/VRM Model loaded successfully: " + file.name);
                }, undefined, (error) => {
                    console.error("GLTF load error:", error);
                    alert("Failed to load GLB/VRM file.");
                });
            } 
            else if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (obj) => {
                    currentModel = obj;
                    scene.add(currentModel);
                    alert("OBJ Model loaded successfully: " + file.name);
                }, undefined, (error) => {
                    console.error("OBJ load error:", error);
                    alert("Failed to load OBJ file.");
                });
            } 
            else if (fileName.endsWith('.fbx')) {
                const loader = new THREE.FBXLoader();
                loader.load(fileURL, (fbx) => {
                    currentModel = fbx;
                    scene.add(currentModel);
                    currentModel.scale.set(0.01, 0.01, 0.01); // FBX models are usually large in scale
                    alert("FBX Model loaded successfully: " + file.name);
                }, undefined, (error) => {
                    console.error("FBX load error:", error);
                    alert("Failed to load FBX file.");
                });
            } else {
                alert("Unsupported file format!");
            }
        });

        // Sliders Adjustment Logic
        const scaleSlider = document.getElementById('scale-slider');
        const posXSlider = document.getElementById('pos-x-slider');
        const posYSlider = document.getElementById('pos-y-slider');
        const posZSlider = document.getElementById('pos-z-slider');
        const rotXSlider = document.getElementById('rot-x-slider');
        const rotYSlider = document.getElementById('rot-y-slider');

        function updateModelTransform() {
            if (!currentModel) return;
            const s = parseFloat(scaleSlider.value);
            currentModel.scale.set(s, s, s);

            currentModel.position.set(
                parseFloat(posXSlider.value),
                parseFloat(posYSlider.value) + 1.2,
                parseFloat(posZSlider.value)
            );

            currentModel.rotation.x = parseFloat(rotXSlider.value);
            currentModel.rotation.y = Math.PI + parseFloat(rotYSlider.value);
        }

        [scaleSlider, posXSlider, posYSlider, posZSlider, rotXSlider, rotYSlider].forEach(slider => {
            slider.addEventListener('input', updateModelTransform);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
