<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Face Rotation Test</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    display:none;
}

#cameraCanvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);

    z-index:10;

    padding:16px 28px;

    font-size:20px;
    font-weight:bold;

    border:0;
    border-radius:10px;

    background:white;
    color:black;
}

#info{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);

    z-index:10;

    padding:10px 16px;

    background:rgba(0,0,0,.75);
    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:16px;

    text-align:center;
}

</style>

</head>

<body>

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<canvas id="cameraCanvas"></canvas>

<canvas id="three"></canvas>

<div id="info">
    CAMERA READY
</div>

<button id="open">
    OPEN CAMERA
</button>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =================================================
   ELEMENTS
================================================= */

const video =
    document.getElementById("camera");

const cameraCanvas =
    document.getElementById("cameraCanvas");

const cameraCtx =
    cameraCanvas.getContext("2d");

const threeCanvas =
    document.getElementById("three");

const button =
    document.getElementById("open");

const info =
    document.getElementById("info");


/* =================================================
   THREE
================================================= */

const scene =
    new THREE.Scene();


const camera3D =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );


camera3D.position.z = 5;


const renderer =
    new THREE.WebGLRenderer({

        canvas:threeCanvas,

        alpha:true,

        antialias:true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =================================================
   LIGHT
================================================= */

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    2,
    3,
    5
);

scene.add(light);


scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


/* =================================================
   CUBE
================================================= */

const geometry =
    new THREE.BoxGeometry(
        0.8,
        0.8,
        0.8
    );


const material =
    new THREE.MeshNormalMaterial();


const cube =
    new THREE.Mesh(
        geometry,
        material
    );


scene.add(cube);


/* =================================================
   TARGET VALUES
================================================= */

let targetX = 0;
let targetY = 0;

let targetRotX = 0;
let targetRotY = 0;
let targetRotZ = 0;


/* =================================================
   MEDIAPIPE
================================================= */

let faceMesh = null;


function startFaceTracking(){

    faceMesh =
        new FaceMesh({

            locateFile:function(file){

                return
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" +
                file;

            }

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });


    faceMesh.onResults(
        onFaceResults
    );

}


/* =================================================
   FACE RESULT
================================================= */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        info.innerText =
            "FACE NOT FOUND";

        return;

    }


    const p =
        results.multiFaceLandmarks[0];


    /*
    ==============================================
    FACE POSITION
    ==============================================
    */

    const nose = p[1];

    const visibleX =
        1 - nose.x;

    const visibleY =
        nose.y;


    targetX =
        (visibleX - 0.5) * 4;


    targetY =
        -(visibleY - 0.5) * 3;


    /*
    ==============================================
    HEAD ROTATION
    ==============================================

    Left eye outer
    Right eye outer
    Nose
    Chin

    These points give us approximate
    head orientation.
    ==============================================
    */

    const leftEye =
        p[33];

    const rightEye =
        p[263];

    const nosePoint =
        p[1];

    const chin =
        p[152];


    /*
    ----------------------------------------------
    ROLL
    ----------------------------------------------
    */

    const eyeDX =
        rightEye.x - leftEye.x;

    const eyeDY =
        rightEye.y - leftEye.y;


    let roll =
        Math.atan2(
            eyeDY,
            eyeDX
        );


    /*
    ----------------------------------------------
    YAW
    ----------------------------------------------

    Difference between nose position and
    eye-center gives approximate left/right
    head rotation.
    ----------------------------------------------
    */

    const eyeCenterX =
        (leftEye.x + rightEye.x) / 2;


    const faceWidth =
        Math.abs(
            rightEye.x - leftEye.x
        );


    let yaw =
        (nosePoint.x - eyeCenterX) /
        faceWidth;


    /*
    ----------------------------------------------
    PITCH
    ----------------------------------------------
    */

    const eyeCenterY =
        (leftEye.y + rightEye.y) / 2;


    const faceHeight =
        Math.abs(
            chin.y - eyeCenterY
        );


    let pitch =
        (nosePoint.y - eyeCenterY) /
        faceHeight;


    /*
    LIMITS
    */

    yaw =
        THREE.MathUtils.clamp(
            yaw,
            -0.8,
            0.8
        );


    pitch =
        THREE.MathUtils.clamp(
            pitch,
            -0.8,
            0.8
        );


    /*
    CAMERA DISPLAY IS MIRRORED,
    SO YAW DIRECTION IS REVERSED.
    */

    targetRotY =
        -yaw * 1.6;


    targetRotX =
        pitch * 1.2;


    targetRotZ =
        -roll * 1.2;


    info.innerText =
        "FACE TRACKING ✓";

}


/* =================================================
   CAMERA
================================================= */

button.onclick =
async function(){

    try{

        info.innerText =
            "OPENING CAMERA...";


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        button.style.display =
            "none";


        startFaceTracking();


        drawCamera();


        processFace();


    }
    catch(error){

        info.innerText =
            "CAMERA ERROR";


        alert(
            error.name +
            "\n\n" +
            error.message
        );

    }

};


/* =================================================
   CAMERA DISPLAY
   SAME WORKING CAMERA CODE
================================================= */

function drawCamera(){

    if(
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        const vw =
            video.videoWidth;

        const vh =
            video.videoHeight;


        const cw =
            window.innerWidth;

        const ch =
            window.innerHeight;


        if(
            cameraCanvas.width !== cw ||
            cameraCanvas.height !== ch
        ){

            cameraCanvas.width =
                cw;

            cameraCanvas.height =
                ch;

        }


        const scale =
            Math.max(
                cw / vw,
                ch / vh
            );


        const drawW =
            vw * scale;

        const drawH =
            vh * scale;


        const x =
            (cw - drawW) / 2;

        const y =
            (ch - drawH) / 2;


        cameraCtx.clearRect(
            0,
            0,
            cw,
            ch
        );


        /*
        WORKING RIGHT / LEFT FIX
        */

        cameraCtx.save();

        cameraCtx.translate(
            cw,
            0
        );

        cameraCtx.scale(
            -1,
            1
        );


        cameraCtx.drawImage(
            video,

            0,
            0,
            vw,
            vh,

            x,
            y,
            drawW,
            drawH
        );


        cameraCtx.restore();

    }


    requestAnimationFrame(
        drawCamera
    );

}


/* =================================================
   FACE PROCESSING
================================================= */

async function processFace(){

    if(
        faceMesh &&
        video.readyState >= 2
    ){

        try{

            await faceMesh.send({
                image:video
            });

        }
        catch(error){

            console.log(
                "FACE ERROR:",
                error
            );

        }

    }


    requestAnimationFrame(
        processFace
    );

}


/* =================================================
   3D ANIMATION
================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    /*
    POSITION
    */

    cube.position.x +=
        (targetX - cube.position.x) * 0.18;


    cube.position.y +=
        (targetY - cube.position.y) * 0.18;


    /*
    ROTATION
    */

    cube.rotation.x +=
        (targetRotX - cube.rotation.x) * 0.18;


    cube.rotation.y +=
        (targetRotY - cube.rotation.y) * 0.18;


    cube.rotation.z +=
        (targetRotZ - cube.rotation.z) * 0.18;


    renderer.render(
        scene,
        camera3D
    );

}


animate();


/* =================================================
   RESIZE
================================================= */

window.addEventListener(
    "resize",
    function(){

        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        cameraCanvas.width =
            window.innerWidth;

        cameraCanvas.height =
            window.innerHeight;

    }
);

</script>

</body>
</html>
