<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Face Landmarker Diagnostic</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#cameraCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    left:10px;
    right:10px;
    top:15px;
    z-index:20;

    padding:14px;

    background:rgba(0,0,0,.85);
    color:#fff;

    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:15px;

    white-space:pre-wrap;
    word-break:break-word;
}

#start{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    z-index:20;

    padding:16px 25px;

    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<video
id="video"
autoplay
playsinline
muted
style="display:none">
</video>

<canvas id="cameraCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div id="status">READY</div>

<button id="start">START TRACKING TEST</button>


<script type="module">

/* =====================================================
   THREE
===================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   FACE LANDMARKER
===================================================== */

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://esm.sh/@mediapipe/tasks-vision@0.10.22?bundle";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const cameraCanvas =
document.getElementById("cameraCanvas");

const threeCanvas =
document.getElementById("threeCanvas");

const status =
document.getElementById("status");

const startButton =
document.getElementById("start");

const ctx =
cameraCanvas.getContext("2d");


/* =====================================================
   STATUS
===================================================== */

function show(text){
    status.innerText = text;
}


/* =====================================================
   THREE
===================================================== */

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    0.1,
    100
);

camera.position.z = 4;


const renderer =
new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


/* =====================================================
   CUBE
===================================================== */

const cube =
new THREE.Mesh(
    new THREE.BoxGeometry(
        0.35,
        0.35,
        0.35
    ),
    new THREE.MeshNormalMaterial()
);

scene.add(cube);


/* =====================================================
   VARIABLES
===================================================== */

let landmarker = null;

let cameraStarted = false;

let trackingStarted = false;

let lastTime = -1;


/* =====================================================
   CREATE LANDMARKER
===================================================== */

async function loadLandmarker(){

    show(
        "STEP 1/3\n\n" +
        "Loading Face Landmarker..."
    );


    try{

        const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


        show(
            "STEP 1/3 ✓\n\n" +
            "WASM loaded.\n\n" +
            "Creating Face Landmarker..."
        );


        landmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {

                baseOptions:{
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"CPU"
                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5,

                outputFaceBlendshapes:false,

                outputFacialTransformationMatrixes:true
            }
        );


        show(
            "STEP 1/3 ✓\n\n" +
            "FACE LANDMARKER CREATED ✓"
        );

        return true;


    }catch(error){

        show(
            "❌ LANDMARKER ERROR\n\n" +
            "NAME:\n" +
            (error.name || "unknown") +
            "\n\nMESSAGE:\n" +
            (error.message || error) +
            "\n\nFULL ERROR:\n" +
            String(error)
        );

        console.error(error);

        return false;
    }
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    show(
        "STEP 2/3\n\n" +
        "Opening camera..."
    );


    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false
        });


        video.srcObject =
        stream;

        await video.play();


        cameraStarted = true;

        show(
            "STEP 2/3 ✓\n\n" +
            "CAMERA ON ✓\n\n" +
            "Starting face detection..."
        );


        drawCamera();


        return true;


    }catch(error){

        show(
            "❌ CAMERA ERROR\n\n" +
            "NAME:\n" +
            (error.name || "unknown") +
            "\n\nMESSAGE:\n" +
            (error.message || error)
        );

        console.error(error);

        return false;
    }
}


/* =====================================================
   CAMERA DRAW
===================================================== */

function drawCamera(){

    requestAnimationFrame(
        drawCamera
    );


    if(
        !cameraStarted ||
        !video.videoWidth
    ){
        return;
    }


    const cw =
    cameraCanvas.width;

    const ch =
    cameraCanvas.height;

    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    const scale =
    Math.max(
        cw/vw,
        ch/vh
    );


    const drawW =
    vw * scale;

    const drawH =
    vh * scale;

    const x =
    (cw-drawW)/2;

    const y =
    (ch-drawH)/2;


    /*
       MIRROR DISPLAY

       Raw video remains unchanged
       for Face Landmarker.
    */

    ctx.save();

    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );

    ctx.translate(
        cw,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        video,
        0,
        0,
        vw,
        vh,
        x,
        y,
        drawW,
        drawH
    );

    ctx.restore();
}


/* =====================================================
   TRACKING
===================================================== */

function trackingLoop(){

    requestAnimationFrame(
        trackingLoop
    );


    if(
        !trackingStarted ||
        !landmarker ||
        video.readyState < 2
    ){
        return;
    }


    if(
        video.currentTime === lastTime
    ){
        return;
    }


    lastTime =
    video.currentTime;


    try{

        const result =
        landmarker.detectForVideo(
            video,
            performance.now()
        );


        if(
            !result
        ){

            show(
                "STEP 3/3\n\n" +
                "NO RESULT"
            );

            return;
        }


        if(
            !result.faceLandmarks ||
            result.faceLandmarks.length === 0
        ){

            show(
                "STEP 3/3\n\n" +
                "FACE NOT FOUND\n\n" +
                "Camera is working.\n" +
                "Landmarker is working.\n\n" +
                "Move your face into the center."
            );

            return;
        }


        /*
           FACE FOUND
        */

        show(
            "STEP 3/3 ✓\n\n" +
            "FACE FOUND ✓\n\n" +
            "LANDMARK COUNT: " +
            result.faceLandmarks[0].length
        );


        /*
           CHECK TRANSFORMATION MATRIX
        */

        if(
            result.facialTransformationMatrixes &&
            result.facialTransformationMatrixes.length
        ){

            const data =
            result.facialTransformationMatrixes[0].data;


            if(data && data.length >= 16){

                const matrix =
                new THREE.Matrix4();

                matrix.fromArray(data);


                const position =
                new THREE.Vector3();

                const quaternion =
                new THREE.Quaternion();

                const scale =
                new THREE.Vector3();


                matrix.decompose(
                    position,
                    quaternion,
                    scale
                );


                /*
                   Use matrix rotation.
                */

                cube.quaternion.copy(
                    quaternion
                );


                /*
                   Use a stable visible
                   position for this test.

                   The important test here
                   is head rotation.
                */

                cube.position.set(
                    0,
                    0,
                    0
                );


                cube.scale.set(
                    1,
                    1,
                    1
                );


                show(
                    "STEP 3/3 ✓\n\n" +
                    "FACE FOUND ✓\n\n" +
                    "3D LANDMARKS ✓\n" +
                    "3D TRANSFORMATION MATRIX ✓\n\n" +
                    "ROTATION TRACKING ACTIVE"
                );
            }

        }else{

            show(
                "FACE FOUND ✓\n\n" +
                "LANDMARKS FOUND\n\n" +
                "BUT TRANSFORMATION MATRIX\n" +
                "IS NOT AVAILABLE."
            );
        }


    }catch(error){

        show(
            "❌ TRACKING ERROR\n\n" +
            "NAME:\n" +
            (error.name || "unknown") +
            "\n\nMESSAGE:\n" +
            (error.message || error) +
            "\n\nFULL ERROR:\n" +
            String(error)
        );

        console.error(
            "TRACKING ERROR:",
            error
        );
    }
}


/* =====================================================
   RENDER
===================================================== */

function render(){

    requestAnimationFrame(
        render
    );

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const w =
    window.innerWidth;

    const h =
    window.innerHeight;


    cameraCanvas.width =
    w;

    cameraCanvas.height =
    h;


    renderer.setSize(
        w,
        h
    );


    camera.aspect =
    w/h;

    camera.updateProjectionMatrix();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   START BUTTON
===================================================== */

startButton.onclick =
async function(){

    startButton.style.display =
    "none";


    const loaded =
    await loadLandmarker();

    if(!loaded){

        startButton.style.display =
        "block";

        return;
    }


    const cam =
    await startCamera();

    if(!cam){

        startButton.style.display =
        "block";

        return;
    }


    trackingStarted =
    true;


    show(
        "STEP 3/3\n\n" +
        "LOOK DIRECTLY AT CAMERA..."
    );


    trackingLoop();
};


/* =====================================================
   START RENDER
===================================================== */

resize();

render();

</script>

</body>
</html>
