<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Step 2 - Tracker Test</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#box{
  padding:25px;
}

#status{
  font-size:20px;
  margin:20px 0;
  color:#00ff88;
}

button{
  padding:15px 25px;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="box">

  <h2>STEP 2</h2>

  <div id="status">
    Tracker not started
  </div>

  <button id="test">
    TEST TRACKER
  </button>

</div>

<script type="module">

const status =
  document.getElementById("status");

const button =
  document.getElementById("test");


button.onclick = async () => {

  status.textContent =
    "Loading tracker...";

  button.disabled = true;

  try {

    /* Load MediaPipe */

    const module =
      await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
      );


    const FaceLandmarker =
      module.FaceLandmarker;

    const FilesetResolver =
      module.FilesetResolver;


    status.textContent =
      "Library loaded ✓";


    /* Load WASM */

    const vision =
      await FilesetResolver.forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

      );


    status.textContent =
      "WASM loaded ✓";


    /* Load Face Model */

    const tracker =
      await FaceLandmarker.createFromOptions(

        vision,

        {

          baseOptions:{

            modelAssetPath:

            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

          },

          runningMode:"VIDEO",

          numFaces:1,

          outputFacialTransformationMatrixes:true

        }

      );


    if(tracker){

      status.textContent =
        "🟢 TRACKER READY";

      alert(
        "SUCCESS!\n\n" +
        "Face Tracker + Model loaded successfully."
      );

    }

  }

  catch(error){

    console.error(error);

    status.style.color =
      "#ff4444";

    status.textContent =
      "🔴 TRACKER FAILED";

    alert(
      "TRACKER ERROR:\n\n" +
      error.message
    );

    button.disabled = false;

  }

};

</script>

</body>
</html>
