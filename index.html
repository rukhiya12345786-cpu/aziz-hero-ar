<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera + Face Tracking</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#status{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px 15px;
    border-radius:10px;
    font-family:Arial;
}

button{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:15px 25px;
    font-size:18px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<div id="status">Camera बंद है</div>

<button id="open">OPEN CAMERA</button>

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

const video = document.getElementById("camera");
const button = document.getElementById("open");
const status = document.getElementById("status");

let faceLandmarker;
let tracking = false;

async function startFaceTracking(){

    status.innerText = "Face Tracking शुरू हो रहा है...";

    try{

        const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions:{
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"GPU"
                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5,

                outputFaceBlendshapes:false,

                outputFacialTransformationMatrixes:true
            }
        );

        tracking = true;

        status.innerText = "Face Tracking ON";

        trackFace();

    }catch(error){

        console.error(error);

        status.innerText =
        "Face Tracking Error";

        alert(
            "Face Tracking Error:\n\n" +
            error.message
        );

    }
}


function trackFace(){

    if(!tracking){
        return;
    }

    if(video.readyState >= 2){

        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );

        if(
            result.faceLandmarks &&
            result.faceLandmarks.length > 0
        ){

            status.innerText =
            "😊 FACE DETECTED";

        }else{

            status.innerText =
            "Face camera में लाओ";

        }
    }

    requestAnimationFrame(trackFace);
}


button.onclick = async function(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });

        video.srcObject = stream;

        this.style.display = "none";

        status.innerText =
        "Camera ON — Face Tracking...";

        await video.play();

        startFaceTracking();

    }catch(error){

        alert(
            "Camera Error:\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};

</script>

</body>
</html>
