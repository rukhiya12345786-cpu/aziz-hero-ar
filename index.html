<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 1;
}

#arCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#status {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: 13px;
    white-space: nowrap;
}

#error {
    display: none;
    position: fixed;
    top: 55px;
    left: 10px;
    right: 10px;
    z-index: 20;
    padding: 12px;
    border-radius: 10px;
    background: rgba(180, 0, 0, 0.9);
    color: #fff;
    font-size: 13px;
    line-height: 1.4;
}

#controls {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 12px;
    z-index: 10;
    padding: 10px;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
}

.buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button,
.fileButton {
    flex: 1;
    min-width: 80px;
    min-height: 42px;
    border: 0;
    border-radius: 10px;
    background: #ffffff;
    color: #111;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.fileButton {
    padding: 0 10px;
}

button:active,
.fileButton:active {
    transform: scale(0.97);
}

#modelInput {
    display: none;
}

.slider {
    margin-top: 9px;
    color: #fff;
    font-size: 12px;
}

.slider input {
    width: 100%;
    margin-top: 4px;
}

.recording {
    background: #ff3030 !important;
    color: #fff !important;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script></head>

<body>

<video id="camera" autoplay muted playsinline></video>

<canvas id="arCanvas"></canvas>

<div id="status">Starting...</div>

<div id="error"></div>

<div id="controls">

    <div class="buttons">

        <label class="fileButton" for="modelInput">
            Import 3D
        </label>

        <button id="recordButton">
            Record
        </button>

        <button id="flipButton">
            Flip Camera
        </button>

        <button id="resetButton">
            Reset
        </button>

    </div>

    <input
        id="modelInput"
        type="file"
        accept=".glb,.gltf,.obj,.fbx"
    >

    <div class="slider">
        Model Size
        <input
            id="sizeSlider"
            type="range"
            min="0.3"
            max="3"
            value="1"
            step="0.01"
        >
    </div>

    <div class="slider">
        Head Height
        <input
            id="heightSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01"
        >
    </div>

    <div class="slider">
        Head Depth
        <input
            id="depthSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01"
        >
    </div>

</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("arCanvas");

const status = document.getElementById("status");
const errorBox = document.getElementById("error");

const modelInput = document.getElementById("modelInput");
const recordButton = document.getElementById("recordButton");
const flipButton = document.getElementById("flipButton");
const resetButton = document.getElementById("resetButton");

const sizeSlider = document.getElementById("sizeSlider");
const heightSlider = document.getElementById("heightSlider");
const depthSlider = document.getElementById("depthSlider");

let scene = null;
let threeCamera = null;
let renderer = null;

let headGroup = null;
let importedModel = null;

let cameraStream = null;
let cameraFacing = "user";

let modelSize = 1;
let heightValue = 0;
let depthValue = 0;

let mediaRecorder = null;
let recordedChunks = [];

let isRecording = false;

let recordingCanvas = null;
let recordingContext = null;
let recordingFrame = null;

function setStatus(message) {
    status.textContent = message;
}

function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}

function initializeThree() {

    scene = new THREE.Scene();

    threeCamera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    threeCamera.position.set(0, 0, 5);

    renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    headGroup = new THREE.Group();

    scene.add(headGroup);

    const ambientLight = new THREE.AmbientLight(
        0xffffff,
        1.4
    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(
        0xffffff,
        1.2
    );

    directionalLight.position.set(
        2,
        3,
        5
    );

    scene.add(directionalLight);

    window.addEventListener(
        "resize",
        resizeThree
    );

    renderLoop();
}

function resizeThree() {

    if (!renderer || !threeCamera) {
        return;
    }

    const width = window.innerWidth;
    const height = window.innerHeight;

    threeCamera.aspect = width / height;
    threeCamera.updateProjectionMatrix();

    renderer.setSize(width, height);

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );
}

function renderLoop() {

    requestAnimationFrame(renderLoop);

    if (!renderer || !scene || !threeCamera) {
        return;
    }

    renderer.render(
        scene,
        threeCamera
    );
}

async function openCamera() {

    hideError();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        showError(
            "Camera access is not supported. Use HTTPS or localhost."
        );

        setStatus("Camera unavailable");

        return;
    }

    try {

        if (cameraStream) {

            cameraStream.getTracks().forEach(
                function(track) {
                    track.stop();
                }
            );

            cameraStream = null;
        }

        setStatus("Opening camera...");

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: cameraFacing
                    },
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: true
            });

        video.srcObject = cameraStream;

        if (cameraFacing === "user") {

            video.style.transform = "scaleX(-1)";

        } else {

            video.style.transform = "scaleX(1)";
        }

        await video.play();

        setStatus("Camera Ready");

        resizeThree();

    } catch (error) {

        console.error(error);

        showError(
            "Camera could not start. Allow camera permission and open this page through HTTPS or localhost."
        );

        setStatus("Camera Error");
    }
}

initializeThree();

openCamera();let faceMesh = null;
let trackingStarted = false;
let trackingBusy = false;

let smoothPosition = new THREE.Vector3();
let smoothQuaternion = new THREE.Quaternion();
let smoothScale = 1;

function initializeFaceTracking() {

    if (typeof FaceMesh === "undefined") {

        showError(
            "Face tracking library could not load. Check your internet connection."
        );

        setStatus("Tracking unavailable");

        return;
    }

    faceMesh = new FaceMesh({
        locateFile: function(file) {
            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
        }
    });

    faceMesh.setOptions({

        maxNumFaces: 1,

        refineLandmarks: true,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });

    faceMesh.onResults(processFace);

    trackingStarted = true;

    setStatus("Face Tracking Ready");

    trackingLoop();
}

async function trackingLoop() {

    requestAnimationFrame(trackingLoop);

    if (!trackingStarted) {
        return;
    }

    if (!faceMesh) {
        return;
    }

    if (!cameraStream) {
        return;
    }

    if (video.readyState < 2) {
        return;
    }

    if (trackingBusy) {
        return;
    }

    trackingBusy = true;

    try {

        await faceMesh.send({
            image: video
        });

    } catch (error) {

        console.error(error);

    }

    trackingBusy = false;
}

function processFace(results) {

    if (!results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0) {

        setStatus("Show Your Face");

        return;
    }

    const landmarks =
        results.multiFaceLandmarks[0];

    const leftCheek = landmarks[234];
    const rightCheek = landmarks[454];
    const forehead = landmarks[10];
    const chin = landmarks[152];
    const nose = landmarks[1];

    if (!leftCheek ||
        !rightCheek ||
        !forehead ||
        !chin ||
        !nose) {

        return;
    }

    function landmarkToVector(point) {

        const x = (1 - point.x) * 2 - 1;
        const y = -(point.y * 2 - 1);
        const z = -point.z * 2;

        return new THREE.Vector3(
            x,
            y,
            z
        );
    }

    const left = landmarkToVector(leftCheek);
    const right = landmarkToVector(rightCheek);
    const top = landmarkToVector(forehead);
    const bottom = landmarkToVector(chin);
    const nosePoint = landmarkToVector(nose);

    const center = new THREE.Vector3()
        .addVectors(left, right)
        .multiplyScalar(0.5);

    const xAxis = new THREE.Vector3()
        .subVectors(right, left)
        .normalize();

    const yAxis = new THREE.Vector3()
        .subVectors(top, bottom)
        .normalize();

    let zAxis = new THREE.Vector3()
        .crossVectors(xAxis, yAxis)
        .normalize();

    const noseDirection = new THREE.Vector3()
        .subVectors(nosePoint, center)
        .normalize();

    if (zAxis.dot(noseDirection) < 0) {

        zAxis.negate();

    }

    yAxis
        .copy(
            new THREE.Vector3()
                .crossVectors(zAxis, xAxis)
                .normalize()
        );

    const rotationMatrix =
        new THREE.Matrix4();

    rotationMatrix.makeBasis(
        xAxis,
        yAxis,
        zAxis
    );

    const targetQuaternion =
        new THREE.Quaternion();

    targetQuaternion.setFromRotationMatrix(
        rotationMatrix
    );

    const faceWidth =
        left.distanceTo(right);

    const targetScale =
        THREE.MathUtils.clamp(
            faceWidth * 3.2,
            0.4,
            2.5
        );

    smoothPosition.lerp(
        center,
        0.35
    );

    smoothQuaternion.slerp(
        targetQuaternion,
        0.35
    );

    smoothScale +=
        (targetScale - smoothScale) * 0.25;

    if (headGroup) {

        headGroup.position.copy(
            smoothPosition
        );

        headGroup.quaternion.copy(
            smoothQuaternion
        );

        headGroup.scale.setScalar(
            smoothScale
        );
    }

    if (importedModel) {

        importedModel.position.y =
            heightValue;

        importedModel.position.z =
            depthValue;

        importedModel.scale.setScalar(
            modelSize
        );

        setStatus("3D Tracking Active");

    } else {

        setStatus("Face Tracking Active");
    }
}

function disposeMaterial(material) {

    if (!material) {
        return;
    }

    const textureKeys = [
        "map",
        "normalMap",
        "roughnessMap",
        "metalnessMap",
        "aoMap",
        "emissiveMap",
        "alphaMap",
        "bumpMap",
        "displacementMap"
    ];

    textureKeys.forEach(
        function(key) {

            if (material[key]) {

                material[key].dispose();
            }
        }
    );

    material.dispose();
}

function disposeModel(object) {

    if (!object) {
        return;
    }

    object.traverse(
        function(child) {

            if (!child.isMesh) {
                return;
            }

            if (child.geometry) {

                child.geometry.dispose();
            }

            if (Array.isArray(child.material)) {

                child.material.forEach(
                    disposeMaterial
                );

            } else if (child.material) {

                disposeMaterial(
                    child.material
                );
            }
        }
    );
}

function prepareModel(object) {

    if (!object) {
        return;
    }

    const box =
        new THREE.Box3().setFromObject(object);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    object.position.sub(center);

    const largestDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (largestDimension > 0) {

        const normalizationScale =
            1.8 / largestDimension;

        object.scale.setScalar(
            normalizationScale
        );
    }

    object.traverse(
        function(child) {

            if (!child.isMesh) {
                return;
            }

            child.frustumCulled = false;

            child.renderOrder = 1;

            if (child.material) {

                if (Array.isArray(child.material)) {

                    child.material.forEach(
                        function(material) {

                            material.depthTest = true;
                            material.depthWrite = true;
                            material.side = THREE.DoubleSide;

                        }
                    );

                } else {

                    child.material.depthTest = true;
                    child.material.depthWrite = true;
                    child.material.side = THREE.DoubleSide;
                }
            }
        }
    );

    importedModel = object;

    headGroup.add(
        importedModel
    );

    setStatus("3D Model Loaded");
}

modelInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        loadModel(file);
    }
);

function loadModel(file) {

    if (!file) {
        return;
    }

    if (importedModel) {

        headGroup.remove(
            importedModel
        );

        disposeModel(
            importedModel
        );

        importedModel = null;
    }

    const fileName =
        file.name.toLowerCase();

    const objectURL =
        URL.createObjectURL(file);

    setStatus("Loading 3D Model...");

    if (
        fileName.endsWith(".glb") ||
        fileName.endsWith(".gltf")
    ) {

        const loader =
            new THREE.GLTFLoader();

        loader.load(

            objectURL,

            function(gltf) {

                URL.revokeObjectURL(
                    objectURL
                );

                prepareModel(
                    gltf.scene
                );
            },

            undefined,

            function(error) {

                URL.revokeObjectURL(
                    objectURL
                );

                console.error(error);

                showError(
                    "The GLB or GLTF model could not be loaded."
                );

                setStatus("Model Error");
            }
        );

    } else if (
        fileName.endsWith(".obj")
    ) {

        const loader =
            new THREE.OBJLoader();

        loader.load(

            objectURL,

            function(object) {

                URL.revokeObjectURL(
                    objectURL
                );

                prepareModel(
                    object
                );
            },

            undefined,

            function(error) {

                URL.revokeObjectURL(
                    objectURL
                );

                console.error(error);

                showError(
                    "The OBJ model could not be loaded."
                );

                setStatus("Model Error");
            }
        );

    } else if (
        fileName.endsWith(".fbx")
    ) {

        const loader =
            new THREE.FBXLoader();

        loader.load(

            objectURL,

            function(object) {

                URL.revokeObjectURL(
                    objectURL
                );

                prepareModel(
                    object
                );
            },

            undefined,

            function(error) {

                URL.revokeObjectURL(
                    objectURL
                );

                console.error(error);

                showError(
                    "The FBX model could not be loaded."
                );

                setStatus("Model Error");
            }
        );

    } else {

        URL.revokeObjectURL(
            objectURL
        );

        showError(
            "Supported formats are GLB, GLTF, OBJ and FBX."
        );

        setStatus("Unsupported Model");
    }
        }sizeSlider.addEventListener(
    "input",
    function() {

        modelSize =
            parseFloat(
                sizeSlider.value
            );
    }
);

heightSlider.addEventListener(
    "input",
    function() {

        heightValue =
            parseFloat(
                heightSlider.value
            );
    }
);

depthSlider.addEventListener(
    "input",
    function() {

        depthValue =
            parseFloat(
                depthSlider.value
            );
    }
);

flipButton.addEventListener(
    "click",
    async function() {

        cameraFacing =
            cameraFacing === "user"
                ? "environment"
                : "user";

        await openCamera();
    }
);

resetButton.addEventListener(
    "click",
    function() {

        sizeSlider.value = "1";
        heightSlider.value = "0";
        depthSlider.value = "0";

        modelSize = 1;
        heightValue = 0;
        depthValue = 0;

        smoothPosition.set(
            0,
            0,
            0
        );

        smoothQuaternion.identity();

        smoothScale = 1;

        if (headGroup) {

            headGroup.position.set(
                0,
                0,
                0
            );

            headGroup.quaternion.identity();

            headGroup.scale.setScalar(1);
        }

        if (importedModel) {

            importedModel.position.set(
                0,
                0,
                0
            );

            importedModel.quaternion.identity();

            importedModel.scale.setScalar(1);
        }

        setStatus("Reset Complete");
    }
);

function createRecordingCanvas() {

    if (recordingCanvas) {
        return;
    }

    recordingCanvas =
        document.createElement("canvas");

    recordingCanvas.width =
        1280;

    recordingCanvas.height =
        720;

    recordingContext =
        recordingCanvas.getContext(
            "2d"
        );
}

function drawRecordingFrame() {

    if (!recordingCanvas ||
        !recordingContext) {

        return;
    }

    const ctx =
        recordingContext;

    const width =
        recordingCanvas.width;

    const height =
        recordingCanvas.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.save();

    if (cameraFacing === "user") {

        ctx.translate(
            width,
            0
        );

        ctx.scale(
            -1,
            1
        );
    }

    if (video.readyState >= 2) {

        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );
    }

    ctx.restore();

    if (canvas.width > 0 &&
        canvas.height > 0) {

        ctx.drawImage(
            canvas,
            0,
            0,
            width,
            height
        );
    }

    if (isRecording) {

        recordingFrame =
            requestAnimationFrame(
                drawRecordingFrame
            );
    }
}

function getRecordingType() {

    if (
        typeof MediaRecorder ===
        "undefined"
    ) {

        return null;
    }

    const types = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    for (
        let i = 0;
        i < types.length;
        i++
    ) {

        if (
            MediaRecorder.isTypeSupported(
                types[i]
            )
        ) {

            return types[i];
        }
    }

    return null;
}

function startRecording() {

    if (
        typeof MediaRecorder ===
        "undefined"
    ) {

        showError(
            "Video recording is not supported on this device."
        );

        return;
    }

    if (!cameraStream) {

        showError(
            "Camera must be active before recording."
        );

        return;
    }

    createRecordingCanvas();

    const canvasStream =
        recordingCanvas.captureStream(
            30
        );

    const audioTracks =
        cameraStream.getAudioTracks();

    audioTracks.forEach(
        function(track) {

            canvasStream.addTrack(
                track
            );
        }
    );

    const recordingType =
        getRecordingType();

    if (!recordingType) {

        showError(
            "WebM video recording is not supported."
        );

        return;
    }

    recordedChunks = [];

    try {

        mediaRecorder =
            new MediaRecorder(
                canvasStream,
                {
                    mimeType:
                        recordingType
                }
            );

    } catch (error) {

        console.error(error);

        showError(
            "Could not start video recording."
        );

        return;
    }

    mediaRecorder.ondataavailable =
        function(event) {

            if (
                event.data &&
                event.data.size > 0
            ) {

                recordedChunks.push(
                    event.data
                );
            }
        };

    mediaRecorder.onstop =
        function() {

            saveRecording();
        };

    mediaRecorder.onerror =
        function(event) {

            console.error(event);

            isRecording = false;

            recordButton.classList.remove(
                "recording"
            );

            recordButton.textContent =
                "Record";

            if (recordingFrame) {

                cancelAnimationFrame(
                    recordingFrame
                );
            }

            showError(
                "Recording failed."
            );
        };

    isRecording = true;

    recordButton.classList.add(
        "recording"
    );

    recordButton.textContent =
        "Stop";

    setStatus(
        "Recording..."
    );

    drawRecordingFrame();

    mediaRecorder.start();
}

function stopRecording() {

    if (!mediaRecorder) {
        return;
    }

    if (
        mediaRecorder.state ===
        "recording"
    ) {

        mediaRecorder.stop();
    }

    isRecording = false;

    recordButton.classList.remove(
        "recording"
    );

    recordButton.textContent =
        "Record";

    if (recordingFrame) {

        cancelAnimationFrame(
            recordingFrame
        );

        recordingFrame = null;
    }

    setStatus(
        "Processing Video..."
    );
}

function saveRecording() {

    if (
        recordedChunks.length === 0
    ) {

        setStatus(
            "No Video Data"
        );

        return;
    }

    const blob =
        new Blob(
            recordedChunks,
            {
                type: "video/webm"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "Azeez-AR-" +
        Date.now() +
        ".webm";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

    recordedChunks = [];

    setStatus(
        "Video Saved"
    );
}

recordButton.addEventListener(
    "click",
    function() {

        if (isRecording) {

            stopRecording();

        } else {

            startRecording();
        }
    }
);

video.addEventListener(
    "loadedmetadata",
    function() {

        resizeThree();
    }
);

video.addEventListener(
    "canplay",
    function() {

        resizeThree();
    }
);

window.addEventListener(
    "beforeunload",
    function() {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    function(track) {

                        track.stop();
                    }
                );
        }

        if (recordingFrame) {

            cancelAnimationFrame(
                recordingFrame
            );
        }
    }
);

initializeFaceTracking();setStatus("Azeez AR Ready");

</script>

</body>
</html>
