
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AZEEZ AI AR STUDIO</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

#container video,
#container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#cutoutCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}

.topbar {
  position: fixed;
  z-index: 30;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: rgba(0,0,0,.65);
  border: 1px solid #333;
  border-radius: 12px;
}

.brand {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
}

#status {
  font-size: 11px;
  color: #00ff9d;
}

.panel {
  position: fixed;
  z-index: 30;
  left: 10px;
  right: 10px;
  bottom: 10px;
  max-height: 48vh;
  overflow-y: auto;
  padding: 12px;
  background: rgba(5,5,5,.88);
  border: 1px solid #333;
  border-radius: 15px;
  backdrop-filter: blur(12px);
}

.section-title {
  margin: 10px 0 7px;
  font-size: 12px;
  font-weight: bold;
  color: #00ff9d;
  letter-spacing: 1px;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

button {
  min-height: 38px;
  padding: 8px 5px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #171717;
  color: white;
  font-size: 11px;
  font-weight: bold;
}

button:active {
  background: #00a96b;
}

button.primary {
  background: #007b50;
  border-color: #00ff9d;
}

button.danger {
  background: #781d27;
  border-color: #b43a48;
}

.slider-box {
  margin: 8px 0;
  padding: 10px;
  background: #151515;
  border-radius: 9px;
}

.slider-heading {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 8px;
}

input[type="range"] {
  width: 100%;
  accent-color: #00ff9d;
}

input[type="file"] {
  display: none;
}

.cutout-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

#modelInfo {
  margin-top: 8px;
  color: #aaa;
  font-size: 11px;
}

#message {
  margin-top: 8px;
  color: #00ff9d;
  font-size: 11px;
}

.hidden {
  display: none !important;
}

@media (orientation: landscape) {
  .panel {
    left: auto;
    width: 320px;
    max-height: 75vh;
  }

  .topbar {
    right: 340px;
  }
}
</style>
</head>

<body>

<div id="container"></div>
<canvas id="cutoutCanvas"></canvas>

<div class="topbar">
  <div class="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">CAMERA STOPPED</div>
  <button id="togglePanelBtn">HIDE ALL</button>
</div>

<div class="panel" id="mainPanel">

  <div class="section-title">CAMERA CONTROLS</div>
  <div class="button-grid">
    <button class="primary" id="startBtn">START CAMERA</button>
    <button id="switchBtn">SWITCH CAMERA</button>
    <button class="danger" id="stopBtn">STOP CAMERA</button>
    <button id="trackingBtn">TRACKING ON</button>
    <button id="fullscreenBtn">FULL SCREEN</button>
    <button id="hideDotsBtn">HIDE CUTOUTS</button>
  </div>

  <div class="section-title">IMPORT CONTENT</div>
  <div class="button-grid">
    <button id="import3DBtn">IMPORT 3D</button>
    <button id="importImageBtn">IMPORT IMAGE</button>
    <button id="importVideoBtn">IMPORT VIDEO</button>
    <button class="danger" id="removeModelBtn">REMOVE MODEL</button>
    <button id="hideGizmoBtn">HIDE GIZMO</button>
    <button id="resetBtn">RESET POSITION</button>
  </div>

  <input id="modelInput" type="file" accept=".glb,.gltf,.obj,.fbx">
  <input id="imageInput" type="file" accept="image/*">
  <input id="videoInput" type="file" accept="video/*">

  <div class="section-title">MODEL SIZE</div>
  <div class="slider-box">
    <div class="slider-heading">
      <span>SIZE</span>
      <span id="sizeValue">1.00x</span>
    </div>
    <input id="sizeSlider" type="range"
      min="0.01" max="20" step="0.01" value="1">
  </div>

  <div class="section-title">TRANSFORM GIZMO</div>
  <div class="button-grid">
    <button id="moveBtn">MOVE</button>
    <button id="rotateBtn">ROTATE</button>
    <button id="scaleBtn">SCALE GIZMO</button>
  </div>

  <div class="section-title">LIVE FACE CUTOUTS</div>
  <div class="cutout-controls">
    <button id="leftEyeBtn">LEFT EYE</button>
    <button id="rightEyeBtn">RIGHT EYE</button>
    <button id="mouthBtn">MOUTH</button>
  </div>

  <div class="button-grid" style="margin-top:7px">
    <button id="enableCutoutsBtn">START CUTOUTS</button>
    <button id="disableCutoutsBtn">STOP CUTOUTS</button>
    <button id="hideCutoutsBtn">HIDE CUTOUTS</button>
  </div>

  <div id="modelInfo">No imported model</div>
  <div id="message">Ready to start</div>

</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";

const $ = (id) => document.getElementById(id);

let mindarThree = null;
let avatar = null;
let anchor = null;
let importedContent = null;
let transformControls = null;

let cameraFacing = "user";
let trackingEnabled = true;
let cameraStarted = false;
let gizmoVisible = true;
let cutoutsEnabled = false;
let cutoutsVisible = true;

let baseScale = 1;
let activeObjectURL = null;
let currentVideo = null;
let currentTexture = null;

const container = $("container");
const cutoutCanvas = $("cutoutCanvas");
const cutoutContext = cutoutCanvas.getContext("2d");

function setMessage(message) {
  $("message").textContent = message;
}

function setStatus(message) {
  $("status").textContent = message;
}

function resizeCutoutCanvas() {
  const ratio = window.devicePixelRatio || 1;
  cutoutCanvas.width = Math.round(innerWidth * ratio);
  cutoutCanvas.height = Math.round(innerHeight * ratio);
  cutoutContext.setTransform(ratio, 0, 0, ratio, 0, 0);
}

window.addEventListener("resize", resizeCutoutCanvas);
resizeCutoutCanvas();

function updateModelInfo(name) {
  $("modelInfo").textContent = name;
}

function clearCutoutCanvas() {
  cutoutContext.clearRect(0, 0, innerWidth, innerHeight);
}

function setCutoutVisibility(visible) {
  cutoutsVisible = visible;
  cutoutCanvas.style.display = visible ? "block" : "none";
  if (!visible) clearCutoutCanvas();
}

function getCameraVideo() {
  return container.querySelector("video");
}


async function loadFaceCutoutEngine() {
  try {
    setMessage("Loading face detection...");

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
    );

    const fileset = await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    faceLandmarker = await vision.FaceLandmarker.createFromOptions(
      fileset,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      }
    );

    setMessage("Face detection ready.");
    return true;
  } catch (error) {
    console.error(error);
    setMessage("Face detection could not load.");
    return false;
  }
}

let faceLandmarker = null;
let cutoutFrameId = null;
let lastDetectionTime = 0;
let faceResults = null;

function getLandmarkPoint(landmarks, index, width, height) {
  const point = landmarks[index];
  return {
    x: point.x * width,
    y: point.y * height
  };
}

function drawFacePatch(video, landmarks, indices) {
  const width = innerWidth;
  const height = innerHeight;

  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  if (!videoWidth || !videoHeight) return;

  const scale = Math.max(
    width / videoWidth,
    height / videoHeight
  );

  const renderedWidth = videoWidth * scale;
  const renderedHeight = videoHeight * scale;

  const offsetX = (width - renderedWidth) / 2;
  const offsetY = (height - renderedHeight) / 2;

  const points = indices.map(index => {
    const p = landmarks[index];
    return {
      x: offsetX + p.x * renderedWidth,
      y: offsetY + p.y * renderedHeight
    };
  });

  cutoutContext.save();
  cutoutContext.beginPath();

  points.forEach((point, index) => {
    if (index === 0) {
      cutoutContext.moveTo(point.x, point.y);
    } else {
      cutoutContext.lineTo(point.x, point.y);
    }
  });

  cutoutContext.closePath();
  cutoutContext.clip();

  cutoutContext.drawImage(
    video,
    0,
    0,
    videoWidth,
    videoHeight,
    offsetX,
    offsetY,
    renderedWidth,
    renderedHeight
  );

  cutoutContext.restore();
}

function renderFaceCutouts() {
  if (!cutoutsEnabled || !cutoutsVisible) {
    clearCutoutCanvas();
    cutoutFrameId = requestAnimationFrame(renderFaceCutouts);
    return;
  }

  const video = getCameraVideo();

  if (
    video &&
    faceLandmarker &&
    video.readyState >= 2
  ) {
    const now = performance.now();

    if (now - lastDetectionTime > 60) {
      lastDetectionTime = now;

      try {
        faceResults = faceLandmarker.detectForVideo(video, now);
      } catch (error) {
        console.warn(error);
      }
    }

    clearCutoutCanvas();

    const landmarks = faceResults?.faceLandmarks?.[0];

    if (landmarks) {
      if (activeCutout === "left" || activeCutout === "all") {
        drawFacePatch(video, landmarks, [
          33, 246, 161, 160, 159, 158, 157,
          173, 133, 155, 154, 153, 145, 144,
          163, 7
        ]);
      }

      if (activeCutout === "right" || activeCutout === "all") {
        drawFacePatch(video, landmarks, [
          362, 398, 384, 385, 386, 387, 388,
          466, 263, 249, 390, 373, 374, 380,
          381, 382
        ]);
      }

      if (activeCutout === "mouth" || activeCutout === "all") {
        drawFacePatch(video, landmarks, [
          61, 146, 91, 181, 84, 17, 314,
          405, 321, 375, 291, 308, 324,
          318, 402, 317, 14, 87, 178, 88
        ]);
      }
    }
  }

  cutoutFrameId = requestAnimationFrame(renderFaceCutouts);
}

let activeCutout = "all";

async function startFaceCutouts() {
  if (!cameraStarted) {
    setMessage("Start the camera first.");
    return;
  }

  if (!faceLandmarker) {
    const loaded = await loadFaceCutoutEngine();
    if (!loaded) return;
  }

  activeCutout = "all";
  cutoutsEnabled = true;
  setCutoutVisibility(true);

  if (cutoutFrameId) cancelAnimationFrame(cutoutFrameId);

  renderFaceCutouts();
  setMessage("Live face cutouts started.");
}

function stopFaceCutouts() {
  cutoutsEnabled = false;

  if (cutoutFrameId) {
    cancelAnimationFrame(cutoutFrameId);
    cutoutFrameId = null;
  }

  clearCutoutCanvas();
  setMessage("Live face cutouts stopped.");
}

function disposeObject(object) {
  if (!object) return;

  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        for (const key in material) {
          if (material[key]?.isTexture) {
            material[key].dispose();
          }
        }
        material.dispose();
      });
    }
  });
}

function removeImportedModel() {
  if (transformControls && importedContent) {
    transformControls.detach();
  }

  if (importedContent && anchor) {
    anchor.group.remove(importedContent);
    disposeObject(importedContent);
  }

  importedContent = null;

  if (currentVideo) {
    currentVideo.pause();
    currentVideo.src = "";
    currentVideo = null;
  }

  if (currentTexture) {
    currentTexture.dispose();
    currentTexture = null;
  }

  if (activeObjectURL) {
    URL.revokeObjectURL(activeObjectURL);
    activeObjectURL = null;
  }

  updateModelInfo("No imported model");
  setMessage("Imported content removed.");
}

function fitModelToFace(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDimension = Math.max(size.x, size.y, size.z);

  if (maxDimension > 0) {
    const factor = 0.3 / maxDimension;
    object.scale.multiplyScalar(factor);
  }

  object.position.sub(center.multiplyScalar(object.scale.x));

  baseScale = object.scale.x;
  $("sizeSlider").value = "1";
  $("sizeValue").textContent = "1.00x";
}

function attachImportedObject(object, name) {
  removeImportedModel();

  if (!anchor) {
    setMessage("Start the camera first.");
    return;
  }

  importedContent = object;
  fitModelToFace(object);

  anchor.group.add(object);

  if (transformControls) {
    transformControls.attach(object);
  }

  updateModelInfo(name);
  setMessage("Imported: " + name);
}

function addMediaPlane(texture, name) {
  const geometry = new THREE.PlaneGeometry(0.35, 0.35);

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const plane = new THREE.Mesh(geometry, material);
  attachImportedObject(plane, name);
}

async function importModel(file) {
  if (!file) return;

  const extension = file.name.split(".").pop().toLowerCase();

  activeObjectURL = URL.createObjectURL(file);

  try {
    let object;

    if (extension === "glb" || extension === "gltf") {
      const loader = new GLTFLoader();

      const result = await loader.loadAsync(activeObjectURL);
      object = result.scene;
    } else if (extension === "obj") {
      const loader = new OBJLoader();
      object = await loader.loadAsync(activeObjectURL);
    } else if (extension === "fbx") {
      const loader = new FBXLoader();
      object = await loader.loadAsync(activeObjectURL);
    } else {
      throw new Error("Unsupported 3D file.");
    }

    attachImportedObject(object, file.name);
  } catch (error) {
    console.error(error);

    if (activeObjectURL) {
      URL.revokeObjectURL(activeObjectURL);
      activeObjectURL = null;
    }

    setMessage("Model import failed.");
  }
}

async function importImage(file) {
  if (!file) return;

  const url = URL.createObjectURL(file);

  const texture = await new THREE.TextureLoader().loadAsync(url);

  activeObjectURL = url;
  currentTexture = texture;

  addMediaPlane(texture, file.name);
}

async function importVideo(file) {
  if (!file) return;

  const url = URL.createObjectURL(file);
  activeObjectURL = url;

  const video = document.createElement("video");
  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;

  await video.play();

  currentVideo = video;

  const texture = new THREE.VideoTexture(video);
  currentTexture = texture;

  addMediaPlane(texture, file.name);
}

async function startCamera() {
  if (cameraStarted) return;

  try {
    setMessage("Starting camera...");

    mindarThree = new MindARThree({
      container,
      maxTrack: 1,
      filterMinCF: 0.0001,
      filterBeta: 0.001
    });

    const { renderer, scene, camera } = mindarThree;

    anchor = mindarThree.addAnchor(168);

    transformControls = new TransformControls(
      camera,
      renderer.domElement
    );

    scene.add(transformControls);

    transformControls.addEventListener("dragging-changed", event => {
      if (event.value) {
        trackingEnabled = false;
      } else {
        trackingEnabled = true;
      }
    });

    await mindarThree.start();

    cameraStarted = true;

    renderer.setAnimationLoop(() => {
      if (trackingEnabled) {
        // Face tracking is handled by MindAR.
      }

      renderer.render(scene, camera);
    });

    setStatus("CAMERA ACTIVE");
    setMessage("Camera started.");
  } catch (error) {
    console.error(error);
    setStatus("CAMERA ERROR");
    setMessage("Camera could not start.");
  }
}

async function stopCamera() {
  stopFaceCutouts();
  removeImportedModel();

  if (mindarThree) {
    try {
      mindarThree.stop();
    } catch (error) {
      console.warn(error);
    }
  }

  mindarThree = null;
  anchor = null;
  transformControls = null;
  cameraStarted = false;

  container.innerHTML = "";

  setStatus("CAMERA STOPPED");
  setMessage("Camera stopped.");
}

async function switchCamera() {
  const wasStarted = cameraStarted;

  if (wasStarted) {
    await stopCamera();
  }

  cameraFacing = cameraFacing === "user"
    ? "environment"
    : "user";

  if (wasStarted) {
    await startCamera();
  }
}

$("startBtn").addEventListener("click", startCamera);
$("stopBtn").addEventListener("click", stopCamera);
$("switchBtn").addEventListener("click", switchCamera);

$("trackingBtn").addEventListener("click", () => {
  trackingEnabled = !trackingEnabled;
  $("trackingBtn").textContent = trackingEnabled
    ? "TRACKING ON"
    : "TRACKING OFF";
});

$("import3DBtn").addEventListener("click", () => {
  $("modelInput").click();
});

$("importImageBtn").addEventListener("click", () => {
  $("imageInput").click();
});

$("importVideoBtn").addEventListener("click", () => {
  $("videoInput").click();
});

$("modelInput").addEventListener("change", event => {
  importModel(event.target.files[0]);
  event.target.value = "";
});

$("imageInput").addEventListener("change", event => {
  importImage(event.target.files[0]);
  event.target.value = "";
});

$("videoInput").addEventListener("change", event => {
  importVideo(event.target.files[0]);
  event.target.value = "";
});

$("removeModelBtn").addEventListener("click", removeImportedModel);

$("sizeSlider").addEventListener("input", event => {
  if (!importedContent) return;

  const multiplier = Number(event.target.value);

  importedContent.scale.setScalar(
    baseScale * multiplier
  );

  $("sizeValue").textContent = multiplier.toFixed(2) + "x";
});

$("moveBtn").addEventListener("click", () => {
  if (transformControls && importedContent) {
    transformControls.setMode("translate");
    transformControls.enabled = true;
  }
});

$("rotateBtn").addEventListener("click", () => {
  if (transformControls && importedContent) {
    transformControls.setMode("rotate");
    transformControls.enabled = true;
  }
});

$("scaleBtn").addEventListener("click", () => {
  if (transformControls && importedContent) {
    transformControls.setMode("scale");
    transformControls.enabled = true;
  }
});

$("hideGizmoBtn").addEventListener("click", () => {
  if (!transformControls) return;

  gizmoVisible = !gizmoVisible;
  transformControls.visible = gizmoVisible;
  transformControls.enabled = gizmoVisible;

  $("hideGizmoBtn").textContent = gizmoVisible
    ? "HIDE GIZMO"
    : "SHOW GIZMO";
});

$("resetBtn").addEventListener("click", () => {
  if (!importedContent) return;

  importedContent.position.set(0, 0, 0);
  importedContent.rotation.set(0, 0, 0);
  importedContent.scale.setScalar(baseScale);

  $("sizeSlider").value = "1";
  $("sizeValue").textContent = "1.00x";
});

$("togglePanelBtn").addEventListener("click", () => {
  const panel = $("mainPanel");
  panel.classList.toggle("hidden");

  $("togglePanelBtn").textContent =
    panel.classList.contains("hidden")
      ? "SHOW ALL"
      : "HIDE ALL";
});

$("hideDotsBtn").addEventListener("click", () => {
  setCutoutVisibility(false);
});

$("hideCutoutsBtn").addEventListener("click", () => {
  setCutoutVisibility(false);
});

$("leftEyeBtn").addEventListener("click", () => {
  activeCutout = "left";
  setCutoutVisibility(true);
});

$("rightEyeBtn").addEventListener("click", () => {
  activeCutout = "right";
  setCutoutVisibility(true);
});

$("mouthBtn").addEventListener("click", () => {
  activeCutout = "mouth";
  setCutoutVisibility(true);
});

$("enableCutoutsBtn").addEventListener("click", startFaceCutouts);
$("disableCutoutsBtn").addEventListener("click", stopFaceCutouts);

$("fullscreenBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen unavailable.");
  }
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
    faceLandmarker?.close();
  } catch (error) {}
});

setMessage("Ready. Start the camera.");
</script>
</body>
</html>
