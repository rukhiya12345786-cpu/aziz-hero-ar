<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Face Test</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#start{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;

    padding:15px 25px;
    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;
}

#status{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    z-index:10;

    padding:10px 16px;
    border-radius:10px;

    background:rgba(0,0,0,.7);
    color:white;

    font-family:Arial;
}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="threeCanvas"></canvas>

<div id="status">
    Camera OFF
</div>

<button id="start">
    START CAMERA
</button>


<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    FaceLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =========================
   HTML
========================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("threeCanvas");

const button =
document.getElementById("start");

const status =
document.getElementById("status");


/* =========================
   THREE.JS
========================= */

const scene =
new THREE.Scene();


const camera =
new THREE.OrthographicCamera(
    -1,
    1,
    1,
    -1,
    0.01,
    100
);

camera.position.z = 5;


const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    alpha:true,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setClearColor(
    0x000000,
    0
);


/* =========================
   LIGHT
========================= */

const ambient =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    0,
    1,
    3
);

scene.add(light);


/* =========================
   TEST 3D HEAD
========================= */

const head =
new THREE.Group();

scene.add(head);


/*
   सिर्फ test के लिए
   एक 3D sphere head
*/

const geometry =
new THREE.SphereGeometry(
    0.35,
    32,
    32
);


const material =
new THREE.MeshStandardMaterial({
    color:0x00ffcc
});


const face =
new THREE.Mesh(
    geometry,
    material
);


head.add(face);


/*
   Nose
*/

const noseGeometry =
new THREE.ConeGeometry(
    0.08,
    0.25,
    16
);


const noseMaterial =
new THREE.MeshStandardMaterial({
    color:0xffaa00
});


const nose =
new THREE.Mesh(
    noseGeometry,
    noseMaterial
);


nose.rotation.x =
Math.PI / 2;


nose.position.z =
0.35;


head.add(nose);


/* =========================
   MEDIAPIPE
========================= */

let faceLandmarker = null;

let stream = null;

let lastVideoTime = -1;


/* =========================
   INITIALIZE FACE TRACKER
========================= */

async function initFaceTracker(){

    status.textContent =
    "Loading Face Tracker...";


    const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(
        vision,
        {

            baseOptions:{

                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"

            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:
                0.5,

            minFacePresenceConfidence:
                0.5,

            minTrackingConfidence:
                0.5,

            outputFaceBlendshapes:false,

            outputFacialTransformationMatrixes:true

        }
    );


    status.textContent =
    "Face Tracker Ready ✓";

}


/* =========================
   START CAMERA
========================= */

async function startCamera(){

    try{

        status.textContent =
        "Opening Camera...";


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Camera API available नहीं है. HTTPS या localhost इस्तेमाल करें."
            );

        }


        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        status.textContent =
        "Camera ON ✓";


        button.style.display =
        "none";


        await initFaceTracker();


        requestAnimationFrame(
            trackFace
        );


    }catch(error){

        console.error(
            error
        );


        status.textContent =
        "Camera Error";


        alert(
            error.name +
            "\n\n" +
            error.message
        );

    }

}


/* =========================
   FACE TRACKING
========================= */

function trackFace(){

    requestAnimationFrame(
        trackFace
    );


    if(
        !faceLandmarker ||
        video.readyState < 2
    ){

        return;

    }


    if(
        video.currentTime ===
        lastVideoTime
    ){

        return;

    }


    lastVideoTime =
    video.currentTime;


    const result =
    faceLandmarker.detectForVideo(
        video,
        performance.now()
    );


    if(
        !result.faceLandmarks ||
        result.faceLandmarks.length === 0
    ){

        head.visible =
        false;

        status.textContent =
        "Face not detected";

        return;

    }


    head.visible =
    true;


    status.textContent =
    "3D FACE TRACKING ✓";


    const landmarks =
    result.faceLandmarks[0];


    /*
       Face bounding box
    */

    let minX = 1;

    let maxX = 0;

    let minY = 1;

    let maxY = 0;


    for(
        const point of landmarks
    ){

        minX =
        Math.min(
            minX,
            point.x
        );

        maxX =
        Math.max(
            maxX,
            point.x
        );

        minY =
        Math.min(
            minY,
            point.y
        );

        maxY =
        Math.max(
            maxY,
            point.y
        );

    }


    const centerX =
    (minX + maxX) / 2;


    const centerY =
    (minY + maxY) / 2;


    const faceWidth =
    maxX - minX;


    const aspect =
    window.innerWidth /
    window.innerHeight;


    /*
       Position
    */

    const targetX =
    (0.5 - centerX) *
    2 *
    aspect;


    const targetY =
    (0.5 - centerY) *
    2;


    const targetZ =
    THREE.MathUtils.clamp(
        (0.18 / faceWidth) - 1,
        -1,
        2
    );


    head.position.x =
    THREE.MathUtils.lerp(
        head.position.x,
        targetX,
        0.3
    );


    head.position.y =
    THREE.MathUtils.lerp(
        head.position.y,
        targetY,
        0.3
    );


    head.position.z =
    THREE.MathUtils.lerp(
        head.position.z,
        targetZ,
        0.3
    );


    /*
       REAL 3D FACE ROTATION
    */

    if(
        result.facialTransformationMatrixes &&
        result.facialTransformationMatrixes.length
    ){

        const data =
        result
        .facialTransformationMatrixes[0]
        .data;


        const matrix =
        new THREE.Matrix4();


        matrix.fromArray(
            data
        );


        const position =
        new THREE.Vector3();


        const quaternion =
        new THREE.Quaternion();


        const scale =
        new THREE.Vector3();


        matrix.decompose(
            position,
            quaternion,
            scale
        );


        /*
           MediaPipe → Three.js
           coordinate correction
        */

        const correction =
        new THREE.Quaternion()
        .setFromEuler(
            new THREE.Euler(
                0,
                Math.PI,
                0
            )
        );


        const targetRotation =
        quaternion
        .clone()
        .multiply(
            correction
        );


        head.quaternion.slerp(
            targetRotation,
            0.25
        );

    }

}


/* =========================
   RESIZE
========================= */

function resize(){

    const width =
    window.innerWidth;

    const height =
    window.innerHeight;


    renderer.setSize(
        width,
        height,
        false
    );

}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =========================
   BUTTON
========================= */

button.addEventListener(
    "click",
    startCamera
);


/* =========================
   RENDER
========================= */

function render(){

    requestAnimationFrame(
        render
    );


    renderer.render(
        scene,
        camera
    );

}

render();


</script>

</body>
</html>
