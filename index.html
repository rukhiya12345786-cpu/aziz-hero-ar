<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Azeez AR Studio</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

button, input, select {
  font: inherit;
}

button {
  border: 1px solid #555;
  border-radius: 8px;
  padding: 9px 12px;
  color: white;
  background: #222;
  cursor: pointer;
}

button:active {
  background: #444;
}

button.active {
  background: #087fdb;
  border-color: #38aaff;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

#cameraVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#arCanvas,
#dotsCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#arCanvas {
  z-index: 2;
}

#dotsCanvas {
  z-index: 3;
}

#topControls,
#bottomControls {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.48);
}

#topControls {
  top: 0;
}

#bottomControls {
  bottom: 0;
}

#controlPanel {
  position: absolute;
  z-index: 20;
  left: 8px;
  right: 8px;
  top: 65px;
  bottom: 65px;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #444;
  border-radius: 12px;
  background: rgba(10, 10, 10, 0.94);
}

#controlPanel.hidden {
  display: none;
}

.panelTitle {
  margin: 5px 0 12px;
  font-size: 18px;
  font-weight: bold;
}

.section {
  margin-bottom: 15px;
  padding: 10px;
  border: 1px solid #333;
  border-radius: 10px;
}

.section h3 {
  margin: 0 0 10px;
  font-size: 15px;
}

.buttonRow {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 8px;
}

.sliderRow {
  display: grid;
  grid-template-columns: minmax(85px, 1fr) minmax(100px, 2fr) 45px;
  align-items: center;
  gap: 8px;
  margin: 9px 0;
}

.sliderRow label {
  font-size: 12px;
}

.sliderRow input[type="range"] {
  width: 100%;
  min-width: 0;
}

.sliderValue {
  text-align: right;
  font-size: 12px;
  color: #aaa;
}

input[type="file"] {
  display: none;
}

.status {
  font-size: 12px;
  color: #9de5ff;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

#cropPanel {
  position: absolute;
  z-index: 12;
  right: 8px;
  top: 80px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.cropBox {
  width: 100px;
  height: 100px;
  overflow: hidden;
  border: 1px solid #00ff8c;
  border-radius: 8px;
  background: rgba(0,0,0,.6);
}

.cropBox canvas {
  width: 100%;
  height: 100%;
}

#cropPanel.hidden {
  display: none;
}

#notice {
  position: absolute;
  z-index: 30;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 9px;
  background: rgba(0,0,0,.8);
  color: white;
  text-align: center;
  font-size: 13px;
  pointer-events: none;
}

#notice.hidden {
  display: none;
}

#stage.fallbackFullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  z-index: 9999;
}

body.fullscreenMode #topControls,
body.fullscreenMode #bottomControls {
  background: rgba(0,0,0,.25);
}

@media (orientation: landscape) {
  #controlPanel {
    left: 8px;
    right: auto;
    top: 60px;
    bottom: 60px;
    width: min(390px, 48vw);
  }

  #cropPanel {
    top: 65px;
  }

  .cropBox {
    width: 85px;
    height: 85px;
  }
}

@media (max-width: 420px) {
  button {
    padding: 8px 9px;
    font-size: 12px;
  }

  .sliderRow {
    grid-template-columns: 75px minmax(70px, 1fr) 38px;
    gap: 5px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="stage">

  <video id="cameraVideo"
         autoplay
         playsinline
         muted></video>

  <canvas id="arCanvas"></canvas>
  <canvas id="dotsCanvas"></canvas>

  <div id="topControls">

    <button id="startCameraBtn">START CAMERA</button>
    <button id="switchCameraBtn">SWITCH CAMERA</button>
    <button id="mirrorBtn">MIRROR ON</button>
    <button id="fullscreenBtn">FULL SCREEN</button>

  </div>

  <div id="bottomControls">

    <button id="trackingBtn">START TRACKING</button>
    <button id="dotsBtn">GREEN DOTS ON</button>
    <button id="panelBtn">HIDE CONTROLS</button>
    <button id="stopCameraBtn">STOP CAMERA</button>

  </div>

  <div id="controlPanel">

    <div class="panelTitle">AZEEZ AR STUDIO</div>

    <div class="section">

      <h3>3D MODEL</h3>

      <div class="buttonRow">
        <button id="importModelBtn">IMPORT MODEL</button>
        <button id="importImageBtn">IMPORT IMAGE</button>
        <button id="importVideoBtn">IMPORT VIDEO</button>
      </div>

      <div class="buttonRow">
        <button id="hideModelBtn">HIDE MODEL</button>
        <button id="removeModelBtn">REMOVE MODEL</button>
        <button id="resetModelBtn">RESET MODEL</button>
      </div>

      <div class="buttonRow">
        <button id="moveModeBtn">MOVE</button>
        <button id="rotateModeBtn">ROTATE</button>
        <button id="scaleModeBtn">SCALE</button>
      </div>

      <div class="status" id="modelStatus">
        No model imported
      </div>

      <input id="modelFileInput"
             type="file"
             accept=".glb,.gltf,.obj,.fbx">

      <input id="imageFileInput"
             type="file"
             accept="image/*">

      <input id="videoFileInput"
             type="file"
             accept="video/*">

    </div>

    <div class="section">

      <h3>MODEL TRANSFORM</h3>

      <div class="sliderRow">
        <label for="modelScaleSlider">Scale</label>
        <input id="modelScaleSlider"
               type="range"
               min="0.01"
               max="5"
               step="0.01"
               value="1">
        <span class="sliderValue" id="modelScaleValue">1</span>
      </div>

      <div class="sliderRow">
        <label for="modelDepthSlider">Depth</label>
        <input id="modelDepthSlider"
               type="range"
               min="-5"
               max="5"
               step="0.01"
               value="0">
        <span class="sliderValue" id="modelDepthValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="modelUpDownSlider">Up / Down</label>
        <input id="modelUpDownSlider"
               type="range"
               min="-3"
               max="3"
               step="0.01"
               value="0">
        <span class="sliderValue" id="modelUpDownValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="modelLeftRightSlider">Left / Right</label>
        <input id="modelLeftRightSlider"
               type="range"
               min="-3"
               max="3"
               step="0.01"
               value="0">
        <span class="sliderValue" id="modelLeftRightValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="modelRotationXSlider">Rotation X</label>
        <input id="modelRotationXSlider"
               type="range"
               min="-180"
               max="180"
               step="1"
               value="0">
        <span class="sliderValue" id="modelRotationXValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="modelRotationYSlider">Rotation Y</label>
        <input id="modelRotationYSlider"
               type="range"
               min="-180"
               max="180"
               step="1"
               value="0">
        <span class="sliderValue" id="modelRotationYValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="modelRotationZSlider">Rotation Z</label>
        <input id="modelRotationZSlider"
               type="range"
               min="-180"
               max="180"
               step="1"
               value="0">
        <span class="sliderValue" id="modelRotationZValue">0</span>
      </div>

    </div>

    <div class="section">

      <h3>FACE POSITION</h3>

      <div class="sliderRow">
        <label for="headCenterXSlider">Head Center X</label>
        <input id="headCenterXSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
        <span class="sliderValue" id="headCenterXValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="headCenterYSlider">Head Center Y</label>
        <input id="headCenterYSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
        <span class="sliderValue" id="headCenterYValue">0</span>
      </div>

      <div class="sliderRow">
        <label for="headCenterZSlider">Head Center Z</label>
        <input id="headCenterZSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
        <span class="sliderValue" id="headCenterZValue">0</span>
      </div>

    </div>

    <div class="section">

      <h3>FACE TRACKING</h3>

      <div class="buttonRow">
        <button id="startTrackingBtn">START TRACKING</button>
        <button id="stopTrackingBtn">STOP TRACKING</button>
        <button id="greenDotsBtn">GREEN DOTS ON</button>
        <button id="hideDotsBtn">HIDE DOTS</button>
      </div>

      <div class="status" id="trackingStatus">
        Tracking stopped
      </div>

    </div>

    <div class="section">

      <h3>EYES AND MOUTH</h3>

      <div class="sliderRow">
        <label for="eyeSizeSlider">Eye Size</label>
        <input id="eyeSizeSlider"
               type="range"
               min="0.5"
               max="2"
               step="0.01"
               value="1">
        <span class="sliderValue" id="eyeSizeValue">1</span>
      </div>

      <div class="sliderRow">
        <label for="mouthSizeSlider">Mouth Size</label>
        <input id="mouthSizeSlider"
               type="range"
               min="0.5"
               max="2"
               step="0.01"
               value="1">
        <span class="sliderValue" id="mouthSizeValue">1</span>
      </div>

      <div class="buttonRow">
        <button id="showCropsBtn">SHOW FACE CROPS</button>
        <button id="hideCropsBtn">HIDE FACE CROPS</button>
      </div>

    </div>

    <div class="section">

      <h3>MODEL FIT SETTINGS</h3>

      <div class="buttonRow">
        <button id="saveModelFitBtn">SAVE MODEL FIT</button>

      <input id="modelFitFileInput"
             type="file"
             accept=".json">

    </div>

    <div class="section">

      <h3>SETTINGS</h3>

      <div class="buttonRow">
        <button id="exportSettingsBtn">EXPORT SETTINGS</button>
        <button id="importSettingsBtn">IMPORT SETTINGS</button>
      </div>

      <input id="settingsFileInput"
             type="file"
             accept=".json">

      <div class="buttonRow">
        <button id="recordBtn">START RECORDING</button>
        <button id="stopRecordBtn">STOP RECORDING</button>
      </div>

      <div class="status" id="recordStatus">
        Recording stopped
      </div>

    </div>

  </div>

  <div id="cropPanel" class="hidden">

    <div class="cropBox">
      <canvas id="leftEyeCrop"></canvas>
    </div>

    <div class="cropBox">
      <canvas id="rightEyeCrop"></canvas>
    </div>

    <div class="cropBox">
      <canvas id="mouthCrop"></canvas>
    </div>

  </div>

  <div id="notice" class="hidden"></div>

</div>


<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

/* =========================================
   AZEEZ AR STUDIO
   Camera + 3D model + controls
========================================= */

const $ = id => document.getElementById(id);

const stage = $("stage");
const video = $("cameraVideo");
const arCanvas = $("arCanvas");
const dotsCanvas = $("dotsCanvas");

const panel = $("controlPanel");
const notice = $("notice");

const modelStatus = $("modelStatus");
const trackingStatus = $("trackingStatus");
const recordStatus = $("recordStatus");

const modelFileInput = $("modelFileInput");
const imageFileInput = $("imageFileInput");
const videoFileInput = $("videoFileInput");
const settingsFileInput = $("settingsFileInput");
const modelFitFileInput = $("modelFitFileInput");

let cameraStream = null;
let facingMode = "user";
let mirrorEnabled = true;

let currentModel = null;
let modelVisible = true;

let trackingEnabled = false;
let dotsVisible = true;
let cropVisible = false;

let animationFrame = 0;
let recording = null;
let recordingChunks = [];

let importedMediaURL = null;

const fit = {
  scale: 1,
  x: 0,
  y: 0,
  z: 0,
  rx: 0,
  ry: 0,
  rz: 0,
  headX: 0,
  headY: 0,
  headZ: 0,
  eyeSize: 1,
  mouthSize: 1
};

/* =========================================
   THREE.JS
========================================= */

const renderer = new THREE.WebGLRenderer({
  canvas: arCanvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  stage.clientWidth / stage.clientHeight,
  0.01,
  1000
);

camera.position.set(0, 0, 5);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(2, 4, 5);
scene.add(light);

const modelRoot = new THREE.Group();
scene.add(modelRoot);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false;

const transformControls = new TransformControls(
  camera,
  renderer.domElement
);

scene.add(transformControls);

transformControls.addEventListener("dragging-changed", event => {
  controls.enabled = !event.value;
});

transformControls.addEventListener("objectChange", () => {
  if (!currentModel) return;

  syncSlidersFromModel();
});

function resizeRenderer() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  if (!width || !height) return;

  renderer.setSize(width, height, false);

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  resizeDotsCanvas();
}

window.addEventListener("resize", resizeRenderer);

function renderLoop() {
  animationFrame = requestAnimationFrame(renderLoop);

  renderer.render(scene, camera);

  if (cropVisible) {
    drawFaceCrops();
  }
}

renderLoop();

/* =========================================
   NOTICE
========================================= */

let noticeTimer = null;

function showNotice(message) {
  notice.textContent = message;
  notice.classList.remove("hidden");

  clearTimeout(noticeTimer);

  noticeTimer = setTimeout(() => {
    notice.classList.add("hidden");
  }, 2500);
}

/* =========================================
   CAMERA
========================================= */

async function startCamera() {
  stopCamera();

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = cameraStream;

    await video.play();

    showNotice("Camera started");
  } catch (error) {
    console.error(error);

    showNotice(
      "Camera error. Allow camera permission and use HTTPS."
    );
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;
}

async function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";

  await startCamera();
}

function updateMirror() {
  video.style.transform = mirrorEnabled
    ? "scaleX(-1)"
    : "scaleX(1)";

  $("mirrorBtn").textContent = mirrorEnabled
    ? "MIRROR ON"
    : "MIRROR OFF";
}

/* =========================================
   FULLSCREEN
========================================= */

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await stage.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    stage.classList.toggle("fallbackFullscreen");

    document.body.classList.toggle(
      "fullscreenMode",
      stage.classList.contains("fallbackFullscreen")
    );
  }
}

/* =========================================
   MODEL IMPORT
========================================= */

function clearCurrentModel() {
  transformControls.detach();

  if (currentModel) {
    modelRoot.remove(currentModel);

    currentModel.traverse(object => {
      if (!object.isMesh) return;

      object.geometry?.dispose();

      if (Array.isArray(object.material)) {
        object.material.forEach(material => material.dispose());
      } else {
        object.material?.dispose();
      }
    });
  }

  currentModel = null;

  modelStatus.textContent = "No model imported";
}

function fitModel(model) {
  const box = new THREE.Box3().setFromObject(model);

  if (box.isEmpty()) return;

  const size = box.getSize(new THREE.Vector3());

  const maxSize = Math.max(size.x, size.y, size.z);

  if (!maxSize) return;

  const center = box.getCenter(new THREE.Vector3());

  model.position.sub(center);

  model.scale.setScalar(1 / maxSize);
}

function importModel(file) {
  if (!file) return;

  const extension = file.name
    .split(".")
    .pop()
    .toLowerCase();

  const url = URL.createObjectURL(file);

  clearCurrentModel();

  modelStatus.textContent = "Loading model...";

  const onLoaded = model => {
    currentModel = model;

    fitModel(currentModel);

    modelRoot.add(currentModel);

    modelVisible = true;

    currentModel.visible = true;

    applyFit();

    modelStatus.textContent = file.name;

    showNotice("Model imported");
  };

  const onError = error => {
    console.error(error);

    modelStatus.textContent = "Model loading failed";

    showNotice("Could not load this model");
  };

  if (extension === "glb" || extension === "gltf") {
    new GLTFLoader().load(
      url,
      result => onLoaded(result.scene),
      undefined,
      onError
    );
  } else if (extension === "obj") {
    new OBJLoader().load(
      url,
      onLoaded,
      undefined,
      onError
    );
  } else if (extension === "fbx") {
    new FBXLoader().load(
      url,
      onLoaded,
      undefined,
      onError
    );
  } else {
    onError(new Error("Unsupported file"));
  }
}

/* =========================================
   TRANSFORM SLIDERS
========================================= */

const sliderPairs = [
  ["modelScaleSlider", "modelScaleValue", "scale"],
  ["modelDepthSlider", "modelDepthValue", "z"],
  ["modelUpDownSlider", "modelUpDownValue", "y"],
  ["modelLeftRightSlider", "modelLeftRightValue", "x"],
  ["modelRotationXSlider", "modelRotationXValue", "rx"],
  ["modelRotationYSlider", "modelRotationYValue", "ry"],
  ["modelRotationZSlider", "modelRotationZValue", "rz"],
  ["headCenterXSlider", "headCenterXValue", "headX"],
  ["headCenterYSlider", "headCenterYValue", "headY"],
  ["headCenterZSlider", "headCenterZValue", "headZ"],
  ["eyeSizeSlider", "eyeSizeValue", "eyeSize"],
  ["mouthSizeSlider", "mouthSizeValue", "mouthSize"]
];

function applyFit() {
  if (!currentModel) return;

  currentModel.scale.setScalar(fit.scale);

  currentModel.position.set(
    fit.x + fit.headX,
    fit.y + fit.headY,
    fit.z + fit.headZ
  );

  currentModel.rotation.set(
    THREE.MathUtils.degToRad(fit.rx),
    THREE.MathUtils.degToRad(fit.ry),
    THREE.MathUtils.degToRad(fit.rz)
  );
}

function bindSliders() {
  sliderPairs.forEach(([sliderId, valueId, key]) => {
    const slider = $(sliderId);
    const value = $(valueId);

    if (!slider || !value) return;

    slider.addEventListener("input", () => {
      fit[key] = Number(slider.value);

      value.textContent = slider.value;

      applyFit();
    });
  });
}

function syncSlidersFromModel() {
  if (!currentModel) return;

  fit.x = currentModel.position.x;
  fit.y = currentModel.position.y;
  fit.z = currentModel.position.z;

  fit.rx = THREE.MathUtils.radToDeg(currentModel.rotation.x);
  fit.ry = THREE.MathUtils.radToDeg(currentModel.rotation.y);
  fit.rz = THREE.MathUtils.radToDeg(currentModel.rotation.z);

  sliderPairs.forEach(([sliderId, valueId, key]) => {
    const slider = $(sliderId);
    const value = $(valueId);

    if (!slider || !value) return;

    if (key === "scale") {
      slider.value = currentModel.scale.x;
      value.textContent = currentModel.scale.x.toFixed(2);
    } else if (["x", "y", "z", "rx", "ry", "rz"].includes(key)) {
      slider.value = fit[key];
      value.textContent = Number(fit[key]).toFixed(2);
    }
  });
}

bindSliders();

/* =========================================
   GIZMO
========================================= */

function setTransformMode(mode) {
  if (!currentModel) {
    showNotice("Import a model first");
    return;
  }

  transformControls.attach(currentModel);
  transformControls.setMode(mode);

  $("moveModeBtn").classList.toggle("active", mode === "translate");
  $("rotateModeBtn").classList.toggle("active", mode === "rotate");
  $("scaleModeBtn").classList.toggle("active", mode === "scale");
}

/* =========================================
   RESET MODEL
========================================= */

function resetModel() {
  Object.assign(fit, {
    scale: 1,
    x: 0,
    y: 0,
    z: 0,
    rx: 0,
    ry: 0,
    rz: 0,
    headX: 0,
    headY: 0,
    headZ: 0
  });

  sliderPairs.forEach(([sliderId, valueId, key]) => {
    const slider = $(sliderId);
    const value = $(valueId);

    if (!slider || !value) return;

    slider.value = fit[key];
    value.textContent = fit[key];
  });

  applyFit();

  showNotice("Model reset");
}

/* =========================================
   MODEL FIT SAVE / LOAD
========================================= */

function saveModelFit() {
  const data = JSON.stringify(fit, null, 2);

  downloadText(data, "azeez-model-fit.json");
}

function loadModelFit(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      Object.keys(fit).forEach(key => {
        if (Number.isFinite(data[key])) {
          fit[key] = data[key];
        }
      });

      sliderPairs.forEach(([sliderId, valueId, key]) => {
        const slider = $(sliderId);
        const value = $(valueId);

        if (!slider || !value) return;

        slider.value = fit[key];
        value.textContent = fit[key];
      });

      applyFit();

      showNotice("Model fit loaded");
    } catch (error) {
      console.error(error);

      showNotice("Invalid model fit file");
    }
  };

  reader.readAsText(file);
}

/* =========================================
   SETTINGS EXPORT / IMPORT
========================================= */

function downloadText(text, filename) {
  const blob = new Blob([text], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);

  const anchor = document.createElement("a");

  anchor.href = url;
  anchor.download = filename;

  anchor.click();

  URL.revokeObjectURL(url);
}

function exportSettings() {
  downloadText(
    JSON.stringify({
      fit,
      mirrorEnabled,
      dotsVisible,
      cropVisible
    }, null, 2),
    "azeez-ar-settings.json"
  );
}

function importSettings(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      if (data.fit) {
        Object.keys(fit).forEach(key => {
          if (Number.isFinite(data.fit[key])) {
            fit[key] = data.fit[key];
          }
        });
      }

      mirrorEnabled = Boolean(data.mirrorEnabled);

      dotsVisible = data.dotsVisible !== false;

      cropVisible = Boolean(data.cropVisible);

      updateMirror();

      updateDotsVisibility();

      updateCropVisibility();

      sliderPairs.forEach(([sliderId, valueId, key]) => {
        const slider = $(sliderId);
        const value = $(valueId);

        if (!slider || !value) return;

        slider.value = fit[key];
        value.textContent = fit[key];
      });

      applyFit();

      showNotice("Settings imported");
    } catch (error) {
      console.error(error);

      showNotice("Invalid settings file");
    }
  };

  reader.readAsText(file);
}

/* =========================================
   GREEN DOT CANVAS
========================================= */

const dotsContext = dotsCanvas.getContext("2d");

function resizeDotsCanvas() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  dotsCanvas.width = Math.round(width * dpr);
  dotsCanvas.height = Math.round(height * dpr);

  dotsCanvas.style.width = width + "px";
  dotsCanvas.style.height = height + "px";

  dotsContext.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function clearDots() {
  dotsContext.clearRect(
    0,
    0,
    stage.clientWidth,
    stage.clientHeight
  );
}

function updateDotsVisibility() {
  dotsCanvas.style.display = dotsVisible ? "block" : "none";

  $("greenDotsBtn").classList.toggle("active", dotsVisible);

  $("dotsBtn").textContent = dotsVisible
    ? "GREEN DOTS ON"
    : "GREEN DOTS OFF";
}

resizeDotsCanvas();

/* =========================================
   FACE TRACKING STATUS
========================================= */

function startTracking() {
  trackingEnabled = true;

  trackingStatus.textContent =
    "Tracking enabled. Face landmark detector is not connected.";

  $("trackingBtn").classList.add("active");

  showNotice(
    "Camera tracking controls enabled. MediaPipe detector still needs integration."
  );
}

function stopTracking() {
  trackingEnabled = false;

  trackingStatus.textContent = "Tracking stopped";

  $("trackingBtn").classList.remove("active");

  clearDots();
}

/* =========================================
   FACE CROPS
========================================= */

function drawCrop(canvas, sx, sy, sw, sh) {
  const context = canvas.getContext("2d");

  canvas.width = 200;
  canvas.height = 200;

  context.clearRect(0, 0, canvas.width, canvas.height);

  if (!video.videoWidth || !video.videoHeight) return;

  sx = Math.max(0, Math.min(sx, video.videoWidth - 1));
  sy = Math.max(0, Math.min(sy, video.videoHeight - 1));

  sw = Math.max(1, Math.min(sw, video.videoWidth - sx));
  sh = Math.max(1, Math.min(sh, video.videoHeight - sy));

  context.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );
}

function drawFaceCrops() {
  if (!video.videoWidth || !video.videoHeight) return;

  const width = video.videoWidth;
  const height = video.videoHeight;

  const eyeWidth = width * 0.16 * fit.eyeSize;
  const eyeHeight = height * 0.12 * fit.eyeSize;

  const mouthWidth = width * 0.22 * fit.mouthSize;
  const mouthHeight = height * 0.14 * fit.mouthSize;

  drawCrop(
    $("leftEyeCrop"),
    width * 0.25 - eyeWidth / 2,
    height * 0.35 - eyeHeight / 2,
    eyeWidth,
    eyeHeight
  );

  drawCrop(
    $("rightEyeCrop"),
    width * 0.65 - eyeWidth / 2,
    height * 0.35 - eyeHeight / 2,
    eyeWidth,
    eyeHeight
  );

  drawCrop(
    $("mouthCrop"),
    width * 0.5 - mouthWidth / 2,
    height * 0.62 - mouthHeight / 2,
    mouthWidth,
    mouthHeight
  );
}

function updateCropVisibility() {
  $("cropPanel").classList.toggle("hidden", !cropVisible);
}

/* =========================================
   IMPORT IMAGE / VIDEO
========================================= */

function importImage(file) {
  if (!file) return;

  if (importedMediaURL) {
    URL.revokeObjectURL(importedMediaURL);
  }

  importedMediaURL = URL.createObjectURL(file);

  const textureLoader = new THREE.TextureLoader();

  textureLoader.load(importedMediaURL, texture => {
    clearCurrentModel();

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const geometry = new THREE.PlaneGeometry(1, 1);

    currentModel = new THREE.Mesh(geometry, material);

    modelRoot.add(currentModel);

    fitModel(currentModel);

    applyFit();

    modelStatus.textContent = file.name;

    showNotice("Image imported");
  });
}

function importVideo(file) {
  if (!file) return;

  showNotice(
    "Video selected. Video texture placement is not connected yet."
  );

  modelStatus.textContent = file.name;
}

/* =========================================
   RECORDING
========================================= */

function startRecording() {
  if (!cameraStream) {
    showNotice("Start camera first");
    return;
  }

  try {
    const outputCanvas = document.createElement("canvas");

    outputCanvas.width = stage.clientWidth;
    outputCanvas.height = stage.clientHeight;

    const context = outputCanvas.getContext("2d");

    const stream = outputCanvas.captureStream(30);

    recordingChunks = [];

    recording = new MediaRecorder(stream, {
      mimeType: MediaRecorder.isTypeSupported("video/webm")
        ? "video/webm"
        : ""
    });

    recording.ondataavailable = event => {
      if (event.data.size > 0) {
        recordingChunks.push(event.data);
      }
    };

    recording.onstop = () => {
      const blob = new Blob(recordingChunks, {
        type: "video/webm"
      });

      const url = URL.createObjectURL(blob);

      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = "azeez-ar-recording.webm";

      anchor.click();

      URL.revokeObjectURL(url);

      recordStatus.textContent = "Recording saved";
    };

    recording.start();

    recordStatus.textContent = "Recording";

    const drawRecording = () => {
      if (!recording || recording.state !== "recording") return;

      context.clearRect(
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );

      if (video.readyState >= 2) {
        context.drawImage(
          video,
          0,
          0,
          outputCanvas.width,
          outputCanvas.height
        );
      }

      context.drawImage(
        arCanvas,
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );

      context.drawImage(
        dotsCanvas,
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );

      requestAnimationFrame(drawRecording);
    };

    drawRecording();

  } catch (error) {
    console.error(error);

    showNotice("Recording could not start");
  }
}

function stopRecording() {
  if (recording && recording.state !== "inactive") {
    recording.stop();
  }

  recording = null;

  recordStatus.textContent = "Recording stopped";
}

updateMirror();

updateDotsVisibility();

updateCropVisibility();

modelStatus.textContent = "No model imported";

trackingStatus.textContent = "Tracking stopped";

recordStatus.textContent = "Recording stopped";
