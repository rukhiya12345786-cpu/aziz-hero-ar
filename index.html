<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Flip Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#video{
    display:none;
}

#canvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

#status{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:10;

    padding:10px 16px;
    background:rgba(0,0,0,.8);
    color:white;
    border-radius:10px;
}

.controls{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:20;

    display:flex;
    gap:10px;
}

button{
    padding:14px 18px;
    font-size:16px;
    font-weight:bold;
    border:0;
    border-radius:10px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="status">CAMERA READY</div>

<div class="controls">

<button id="open">OPEN CAMERA</button>

<button id="flip" style="display:none;">
FLIP: OFF
</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const openButton = document.getElementById("open");
const flipButton = document.getElementById("flip");
const status = document.getElementById("status");

let flipped = false;


openButton.onclick = async function(){

    try{

        status.innerText = "OPENING CAMERA...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });

        video.srcObject = stream;

        await video.play();

        openButton.style.display = "none";
        flipButton.style.display = "block";

        status.innerText = "CAMERA ON";

        draw();

    }

    catch(error){

        status.innerText = "CAMERA ERROR";

        alert(
            error.name +
            "\n\n" +
            error.message
        );

    }

};


flipButton.onclick = function(){

    flipped = !flipped;

    flipButton.innerText =
        flipped ? "FLIP: ON" : "FLIP: OFF";

};


function draw(){

    if(video.readyState >= 2){

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cw = window.innerWidth;
        const ch = window.innerHeight;

        if(canvas.width !== cw ||
           canvas.height !== ch){

            canvas.width = cw;
            canvas.height = ch;

        }

        const scale = Math.max(
            cw / vw,
            ch / vh
        );

        const w = vw * scale;
        const h = vh * scale;

        const x = (cw - w) / 2;
        const y = (ch - h) / 2;

        ctx.clearRect(
            0,
            0,
            cw,
            ch
        );

        ctx.save();

        if(flipped){

            ctx.translate(cw,0);
            ctx.scale(-1,1);

        }

        ctx.drawImage(
            video,
            0,
            0,
            vw,
            vh,
            flipped ? -x : x,
            y,
            w,
            h
        );

        ctx.restore();

    }

    requestAnimationFrame(draw);

}

</script>

</body>
</html>
