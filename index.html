
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Hero AR Studio - Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; transform: scaleX(-1); }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 12px; box-sizing: border-box;
        }
        .control-group { pointer-events: auto; display: flex; gap: 6px; flex-wrap: wrap; background: rgba(0,0,0,0.75); padding: 8px; border-radius: 10px; }
        button, label.btn {
            background: #ff0055; color: white; border: none; padding: 8px 12px;
            font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center;
        }
        button:active, label.btn:active { background: #cc0044; }
        input[type="file"] { display: none; }
        
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        #middle-controls { 
            pointer-events: auto; display: flex; flex-direction: column; gap: 6px; 
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; align-self: center; width: 90%; max-width: 320px;
        }
        .adjust-row { display: flex; justify-content: space-between; align-items: center; color: white; font-size: 12px; }
        .adjust-row button { padding: 4px 10px; background: #333; font-size: 14px; }

        #bottom-bar { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 5px; }
        #record-btn { background: #ff3333; width: 60px; height: 60px; border-radius: 50%; border: 4px solid white; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #record-btn.recording { background: #222; animation: pulse 1s infinite; border-color: #ff3333; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #permission-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.98); z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px; box-sizing: border-box;
        }
        #start-app-btn { 
            background: #00ff88; color: #000000; font-size: 18px; font-weight: bold; 
            padding: 16px 30px; border-radius: 10px; margin-top: 20px; border: none;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,255,136,0.4); pointer-events: auto;
        }
        #error-msg { margin-top: 15px; font-size: 13px; color: #ff4444; max-width: 90%; word-break: break-all; }
    </style>
</head>
<body>

    <div id="permission-screen">
        <h1 style="margin: 0 0 10px 0; font-size: 24px;">Aziz Hero AR Pro Studio</h1>
        <p style="margin: 0; color: #aaa;">Click below to start Face Tracking & Camera</p>
        <button id="start-app-btn">START AR STUDIO</button>
        <div id="error-msg"></div>
    </div>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="top-bar">
            <div class="control-group">
                <label class="btn" for="file-input">Import 3D (.obj/.gltf/.glb)</label>
                <input type="file" id="file-input" accept=".obj,.gltf,.glb">
                <button id="snapshot-btn">Snapshot</button>
            </div>
            <div class="control-group">
                <button id="cam-switch-btn">Flip Cam</button>
            </div>
        </div>

        <!-- Model Adjust Controls for Face Alignment -->
        <div id="middle-controls">
            <div style="color:#00ff88; font-size:11px; font-weight:bold; text-align:center; margin-bottom:2px;">HEAD POSITION & SIZE ADJUST</div>
            <div class="adjust-row">
                <span>Size (Scale):</span>
                <div>
                    <button onclick="adjustScale(-0.1)">-</button>
                    <button onclick="adjustScale(0.1)">+</button>
                </div>
            </div>
            <div class="adjust-row">
                <span>Move Up/Down:</span>
                <div>
                    <button onclick="adjustPosY(-0.05)">▼</button>
                    <button onclick="adjustPosY(0.05)">▲</button>
                </div>
            </div>
            <div class="adjust-row">
                <span>Move Left/Right:</span>
                <div>
                    <button onclick="adjustPosX(-0.05)">◀</button>
                    <button onclick="adjustPosX(0.05)">▶</button>
                </div>
            </div>
        </div>

        <div id="bottom-bar">
            <div class="control-group" style="background: transparent; padding: 0;">
                <button id="record-btn" title="Record Video with Audio"></button>
            </div>
        </div>
    </div>

    <!-- Three.js and Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- MediaPipe Face Mesh for Face Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        let scene, camera, renderer, currentModel;
        let videoElement, mediaStream;
        let useFrontCamera = true;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let faceMesh, mpCamera;

        // Manual offset adjustments for fine-tuning on face
        let userScale = 1.0;
        let userOffsetX = 0.0;
        let userOffsetY = 0.2; // Default slightly above nose/face center (head area)
        let userOffsetZ = 0.0;

        document.getElementById('start-app-btn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = "Initializing face tracking & camera...";
            
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Camera API not supported.");
                }

                await startCamera();
                document.getElementById('permission-screen').style.display = 'none';

                initThreeJS();
                initFaceTracking();

            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Error: " + err.message + ". Check camera permissions / HTTPS.";
            }
        });

        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 1280, height: 720 },
                    audio: true // Audio enabled for video recording
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }

            videoElement = document.getElementById('video-bg');
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try {
                await startCamera();
                if (mpCamera) {
                    // Re-init camera feed for Mediapipe if needed
                }
            } catch (err) {
                alert("Could not switch camera: " + err.message);
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            createDefaultModel();
            camera.position.z = 3;

            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', handleFileImport);
            document.getElementById('snapshot-btn').addEventListener('click', takeSnapshot);
            document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);
            document.getElementById('record-btn').addEventListener('click', toggleRecording);

            animate();
        }

        function createDefaultModel() {
            const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
            currentModel = new THREE.Mesh(geometry, material);
            scene.add(currentModel);
        }

        function initFaceTracking() {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceResults);

            mpCamera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });
            mpCamera.start();
        }

        function onFaceResults(results) {
            if (!currentModel) return;

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                // Landmark 10 is near the top of the forehead/head, 1 or 168 is around nose bridge
                const nose = landmarks[1]; 

                // Map normalized coordinates (0 to 1) to Three.js screen space (-1 to 1)
                const x = -(nose.x - 0.5) * 4.5 + userOffsetX;
                const y = -(nose.y - 0.5) * 4.5 + userOffsetY;
                const z = userOffsetZ;

                currentModel.position.set(x, y, z);
                currentModel.visible = true;
            } else {
                // If face not visible, keep model at center or hide
            }
        }

        // Adjust functions controlled via on-screen buttons
        function adjustScale(amount) {
            userScale = Math.max(0.1, userScale + amount);
            if (currentModel) {
                currentModel.scale.set(userScale, userScale, userScale);
            }
        }
        function adjustPosX(amount) { userOffsetX += amount; }
        function adjustPosY(amount) { userOffsetY += amount; }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = function (e) {
                    const loader = new THREE.OBJLoader();
                    const obj = loader.parse(e.target.result);
                    replaceModel(obj);
                };
            } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(e.target.result, '', function (gltf) {
                        replaceModel(gltf.scene);
                    }, function (error) {
                        alert('Error loading 3D model file.');
                    });
                };
            } else {
                alert('Please select .obj, .gltf, or .glb format.');
            }
        }

        function replaceModel(newObj) {
            if (currentModel) scene.remove(currentModel);
            currentModel = newObj;
            userScale = 1.0;
            userOffsetX = 0.0;
            userOffsetY = 0.2;
            currentModel.scale.set(userScale, userScale, userScale);
            scene.add(currentModel);
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'aziz-ar-snapshot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                if (!mediaStream) {
                    alert('Camera not ready.');
                    return;
                }

                // Combine video stream and audio stream for recording with sound
                const combinedStream = new MediaStream([
                    ...mediaStream.getVideoTracks(),
                    ...mediaStream.getAudioTracks()
                ]);

                // Also add canvas stream if available for combined rendering, otherwise capture stream
                try {
                    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9,opus' });
                } catch (e) {
                    try {
                        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/mp4' });
                    } catch (err) {
                        mediaRecorder = new MediaRecorder(combinedStream);
                    }
                }

                recordedChunks = [];
                mediaRecorder.ondataavailable = function (e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                // Automatically save/download video on stop
                mediaRecorder.onstop = function () {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'aziz-ar-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        window.URL.revokeObjectURL(url);
                        a.remove();
                    }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>
</html>
