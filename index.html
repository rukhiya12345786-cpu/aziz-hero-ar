<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz AR Pro Studio - Ultimate</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; transform: scaleX(-1); }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }

        .clickable { pointer-events: auto; }

        .top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .glass-btn {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 14px; font-size: 13px; border-radius: 20px; cursor: pointer; font-weight: 600; text-align: center;
        }
        .glass-btn:active { background: rgba(255, 255, 255, 0.3); }
        input[type="file"] { display: none; }

        /* Advanced Adjust & Rotate Panel */
        #adjust-panel {
            position: absolute; right: 12px; top: 65px;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); padding: 8px;
            border-radius: 14px; display: flex; flex-direction: column; gap: 6px; width: 135px;
            max-height: 80vh; overflow-y: auto;
        }
        .adj-group { display: flex; flex-direction: column; gap: 2px; color: #00ff88; font-size: 9px; font-weight: bold; }
        .adj-group div { display: flex; gap: 3px; }
        .adj-group button { flex: 1; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .adj-group button:active { background: #ff0055; }

        /* Bottom Floating Dock */
        .bottom-dock {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 20px;
            border-radius: 35px; display: flex; align-items: center; gap: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dock-btn {
            background: transparent; border: none; color: white; font-size: 11px; font-weight: 600;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px;
        }
        
        #record-btn {
            background: #fff; width: 60px; height: 60px; border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.4); box-shadow: 0 0 20px rgba(255,255,255,0.5);
            cursor: pointer; position: relative; transition: all 0.2s ease;
        }
        #record-btn.recording { background: #ff3333; border-color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        #permission-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0b0b; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }
        #start-app-btn {
            background: #ff0055; color: #fff; font-size: 16px; font-weight: bold;
            padding: 14px 28px; border-radius: 25px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,0,85,0.4);
        }
        #error-msg { margin-top: 15px; font-size: 13px; color: #ff4444; max-width: 90%; word-break: break-all; }
    </style>
</head>
<body>

    <div id="permission-screen">
        <h1 style="margin: 0 0 10px 0; font-size: 22px;">Aziz AR Studio</h1>
        <p style="margin: 0; color: #aaa; font-size: 13px;">Tap below to start camera & head tracking</p>
        <button id="start-app-btn">START CAMERA</button>
        <div id="error-msg"></div>
    </div>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <button id="cam-switch-btn" class="glass-btn clickable">🔄 Flip</button>
            <button id="snapshot-btn" class="glass-btn clickable">📸 Snapshot</button>
        </div>

        <div id="adjust-panel" class="clickable">
            <div class="adj-group">
                <span>SIZE</span>
                <div>
                    <button onclick="adjustVal('scale', -0.1)">-</button>
                    <button onclick="adjustVal('scale', 0.1)">+</button>
                </div>
            </div>
            <div class="adj-group">
                <span>UP / DOWN</span>
                <div>
                    <button onclick="adjustVal('posY', -0.03)">▼</button>
                    <button onclick="adjustVal('posY', 0.03)">▲</button>
                </div>
            </div>
            <div class="adj-group">
                <span>LEFT / RIGHT</span>
                <div>
                    <button onclick="adjustVal('posX', -0.03)">◀</button>
                    <button onclick="adjustVal('posX', 0.03)">▶</button>
                </div>
            </div>
            <div class="adj-group">
                <span>ROTATE X</span>
                <div>
                    <button onclick="adjustVal('rotX', -0.2)">-</button>
                    <button onclick="adjustVal('rotX', 0.2)">+</button>
                </div>
            </div>
            <div class="adj-group">
                <span>ROTATE Y</span>
                <div>
                    <button onclick="adjustVal('rotY', -0.2)">-</button>
                    <button onclick="adjustVal('rotY', 0.2)">+</button>
                </div>
            </div>
            <div class="adj-group">
                <span>ROTATE Z</span>
                <div>
                    <button onclick="adjustVal('rotZ', -0.2)">-</button>
                    <button onclick="adjustVal('rotZ', 0.2)">+</button>
                </div>
            </div>
        </div>

        <div class="bottom-dock clickable">
            <label class="dock-btn" for="file-input">
                📁 <span>Import</span>
            </label>
            <input type="file" id="file-input" accept=".obj,.gltf,.glb,.fbx">

            <button id="record-btn" class="clickable" title="Record Video"></button>

            <button class="dock-btn" onclick="resetModelTransforms()">
                🎯 <span>Reset</span>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        let scene, camera, renderer, currentModel;
        let videoElement, mediaStream;
        let useFrontCamera = true;
        let mediaRecorder, recordedChunks = [], isRecording = false;
        let faceMesh, mpCamera;

        // Model adjustments & rotations
        let modelScale = 1.0;
        let modelOffsetX = 0.0;
        let modelOffsetY = 0.35; // Positioned higher to properly cover the head
        let modelOffsetZ = 0.0;
        let customRotX = 0.0;
        let customRotY = 0.0;
        let customRotZ = 0.0;

        document.getElementById('start-app-btn').addEventListener('click', async () => {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = "Initializing camera & head tracking...";
            try {
                await initCamera();
                document.getElementById('permission-screen').style.display = 'none';
                initThree();
                initFaceTracking();
            } catch (err) {
                console.error(err);
                errDiv.innerText = "Error: " + err.message + ". Allow permissions / use HTTPS.";
            }
        });

        async function initCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 1280, height: 720 },
                    audio: true
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
            videoElement = document.getElementById('video-bg');
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try { await initCamera(); } catch (e) { alert("Switch failed: " + e.message); }
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const dLight = new THREE.DirectionalLight(0xffffff, 1.8);
            dLight.position.set(5, 12, 8);
            scene.add(dLight);

            loadDefaultModel();
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('file-input').addEventListener('change', handleModelImport);
            document.getElementById('snapshot-btn').addEventListener('click', takeSnapshot);
            document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);
            document.getElementById('record-btn').addEventListener('click', toggleVideoRecording);

            animate();
        }

        function loadDefaultModel() {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
            currentModel = new THREE.Mesh(geo, mat);
            scene.add(currentModel);
        }

        function initFaceTracking() {
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            faceMesh.onResults((results) => {
                if (!currentModel) return;
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];
                    
                    // Landmark 10 is near the top of the forehead/head, 1 is near nose bridge for centering head depth
                    const topHead = landmarks[10];
                    const nose = landmarks[1];

                    // Calculate 3D head position mapping to completely cover the head area
                    const x = -(nose.x - 0.5) * 4.5 + modelOffsetX;
                    const y = -(topHead.y - 0.5) * 4.5 + modelOffsetY;
                    
                    currentModel.position.set(x, y, modelOffsetZ);
                    
                    // Apply custom user rotations on top of base tracking
                    currentModel.rotation.set(customRotX, customRotY, customRotZ);
                    currentModel.visible = true;
                }
            });

            mpCamera = new Camera(videoElement, {
                onFrame: async () => { await faceMesh.send({ image: videoElement }); },
                width: 1280, height: 720
            });
            mpCamera.start();
        }

        function adjustVal(type, val) {
            if (type === 'scale') {
                modelScale = Math.max(0.1, modelScale + val);
                if (currentModel) currentModel.scale.set(modelScale, modelScale, modelScale);
            } else if (type === 'posY') { modelOffsetY += val; }
              else if (type === 'posX') { modelOffsetX += val; }
              else if (type === 'rotX') { customRotX += val; }
              else if (type === 'rotY') { customRotY += val; }
              else if (type === 'rotZ') { customRotZ += val; }
        }

        function resetModelTransforms() {
            modelScale = 1.0;
            modelOffsetX = 0.0;
            modelOffsetY = 0.35;
            modelOffsetZ = 0.0;
            customRotX = 0.0;
            customRotY = 0.0;
            customRotZ = 0.0;
            if (currentModel) currentModel.scale.set(modelScale, modelScale, modelScale);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function handleModelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const name = file.name.toLowerCase();

            if (name.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = (evt) => {
                    const loader = new THREE.OBJLoader();
                    replaceModel(loader.parse(evt.target.result));
                };
            } else if (name.endsWith('.gltf') || name.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = (evt) => {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(evt.target.result, '', (gltf) => replaceModel(gltf.scene));
                };
            } else if (name.endsWith('.fbx')) {
                reader.readAsArrayBuffer(file);
                reader.onload = (evt) => {
                    const loader = new THREE.FBXLoader();
                    try {
                        const obj = loader.parse(evt.target.result, '');
                        replaceModel(obj);
                    } catch (err) {
                        alert("Error parsing FBX file.");
                    }
                };
            } else { 
                alert("Please select .obj, .gltf, .glb or .fbx format."); 
            }
        }

        function replaceModel(newObj) {
            if (currentModel) scene.remove(currentModel);
            currentModel = newObj;
            resetModelTransforms();
            scene.add(currentModel);
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const a = document.createElement('a');
            a.download = 'aziz-ar-snapshot.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        function toggleVideoRecording() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                if (!mediaStream) { alert("Camera not ready"); return; }
                const combined = new MediaStream([...mediaStream.getVideoTracks(), ...mediaStream.getAudioTracks()]);
                
                try { mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9,opus' }); }
                catch (e) { mediaRecorder = new MediaRecorder(combined); }

                recordedChunks = [];
                mediaRecorder.ondataavailable = (evt) => { if (evt.data.size > 0) recordedChunks.push(evt.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'aziz-ar-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { window.URL.revokeObjectURL(url); a.remove(); }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>
                    </html>
