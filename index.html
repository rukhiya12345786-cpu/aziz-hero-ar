<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeez AR - Face Tracking Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;text-align:center}
h3{padding:14px 8px;margin:0}
#stage{position:relative;width:100%;height:65vh;background:#222;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
button{padding:13px 15px;margin:7px 4px;font-size:15px;border:0;border-radius:7px}
#start{background:#168b45;color:white}
#stop{background:#b52d2d;color:white}
#status{padding:12px;font-size:14px;overflow-wrap:anywhere;min-height:50px}
</style>
</head>
<body>
<h3>AZEEZ AR — CAMERA + FACE TRACKING</h3>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="status">Ready. Press START TEST.</div>
<button id="start">START CAMERA + TRACKING</button>
<button id="stop">STOP CAMERA</button>

<script type="module">
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const startButton=document.getElementById("start");

let stream=null;
let tracker=null;
let running=false;
let busy=false;

async function startTest(){
  if(busy||running)return;
  busy=true;
  startButton.disabled=true;

  try{
    status.textContent="STEP 1: Opening camera...";

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Open the HTTPS GitHub Pages website in Chrome and allow camera access.");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"user"},
        width:{ideal:640},
        height:{ideal:480}
      }
    });

    video.srcObject=stream;
    await video.play();
    status.textContent="STEP 2: Camera opened. Loading tracking library...";

    const mp=await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
    );

    const vision=await mp.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );

    status.textContent="STEP 3: Loading face tracking model...";

    tracker=await mp.FaceLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"CPU"
      },
      runningMode:"VIDEO",
      numFaces:1
    });

    running=true;
    status.textContent="Tracking ready. Look left and right.";
    requestAnimationFrame(detectFace);

  }catch(error){
    status.textContent="ERROR: "+(error.message||String(error));
    console.error(error);
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
      video.srcObject=null;
    }
  }finally{
    busy=false;
    startButton.disabled=false;
  }
}

function detectFace(){
  if(!running)return;

  try{
    if(video.readyState>=2&&video.videoWidth>0){
      if(canvas.width!==video.videoWidth||
         canvas.height!==video.videoHeight){
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
      }

      ctx.clearRect(0,0,canvas.width,canvas.height);

      const result=tracker.detectForVideo(video,performance.now());
      const faces=result.faceLandmarks||[];

      if(faces.length){
        status.textContent="FACE DETECTED ✓ — MIRRORED DOTS";
        ctx.fillStyle="#00ff66";

        for(const point of faces[0]){
          // Flip X coordinates to match the mirrored preview.
          const mirroredX=(1-point.x)*canvas.width;
          const y=point.y*canvas.height;

          ctx.beginPath();
          ctx.arc(mirroredX,y,2,0,Math.PI*2);
          ctx.fill();
        }
      }else{
        status.textContent="Tracking running — face not detected";
      }
    }
  }catch(error){
    running=false;
    status.textContent="TRACKING ERROR: "+error.message;
    return;
  }

  requestAnimationFrame(detectFace);
}

function stopCamera(){
  running=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  if(tracker){
    tracker.close();
    tracker=null;
  }

  video.srcObject=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  status.textContent="Camera stopped.";
  startButton.disabled=false;
}

startButton.addEventListener("click",startTest);
document.getElementById("stop").addEventListener("click",stopCamera);
</script>
</body>
</html>
