<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Lite Animoji Studio</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; gap: 6px; }
        
        .btn {
            background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 12px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(6px);
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }

        .bottom-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(8px);
        }
        .filter-switcher { display: flex; gap: 12px; align-items: center; }
        .filter-thumb {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            background-color: rgba(34,34,34,0.7); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .filter-thumb.active { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
        }
    </style>

    <!-- Essential Fast CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px;">Aziz Lite Studio</h1>
        <p style="color: #aaa; font-size: 14px;">Fast & Smooth 360° Head Enclosure</p>
        <button id="launch-btn">START APP</button>
        <div id="error-log" style="color: #ff4444; font-size: 12px; margin-top: 10px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb active" id="btn-laugh" onclick="switchAnimoji('laugh')">😆</div>
                <div class="filter-thumb" id="btn-cool" onclick="switchAnimoji('cool')">😎</div>
                <div class="filter-thumb" id="btn-panda" onclick="switchAnimoji('panda')">🐼</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let animojiGroup = null;
        let currentType = 'laugh';
        let useFront = true;
        let jawPart = null;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Opening...";
            btn.disabled = true;

            try {
                if (typeof THREE === 'undefined') throw new Error("Three.js not loaded.");
                if (typeof FaceMesh === 'undefined') throw new Error("MediaPipe not loaded.");

                await startCamera();
                document.getElementById('start-screen').style.display = 'none';

                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START APP";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(0, 10, 10);
            scene.add(light);

            buildAnimoji('laugh');
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
                const link = document.createElement('a');
                link.download = 'snap.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            animateLoop();
        }

        function switchAnimoji(type) {
            currentType = type;
            document.querySelectorAll('.filter-thumb').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            buildAnimoji(type);
        }

        function buildAnimoji(type) {
            if (animojiGroup) scene.remove(animojiGroup);
            animojiGroup = new THREE.Group();

            // 360 Head Sphere
            const headGeo = new THREE.SphereGeometry(0.9, 24, 24);

            if (type === 'laugh') {
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
                animojiGroup.add(new THREE.Mesh(headGeo, headMat));

                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222 });
                const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 0.04), eyeMat); lEye.position.set(-0.3, 0.2, 0.8);
                const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 0.04), eyeMat); rEye.position.set(0.3, 0.2, 0.8);
                animojiGroup.add(lEye); animojiGroup.add(rEye);

                jawPart = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.08), new THREE.MeshBasicMaterial({ color: 0x8b0000 }));
                jawPart.position.set(0, -0.2, 0.75);
                animojiGroup.add(jawPart);

            } else if (type === 'cool') {
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
                animojiGroup.add(new THREE.Mesh(headGeo, headMat));

                const glasses = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.25), new THREE.MeshStandardMaterial({ color: 0x111, metalness: 0.8 }));
                glasses.position.set(0, 0.15, 0.78);
                animojiGroup.add(glasses);

                jawPart = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.04), new THREE.MeshBasicMaterial({ color: 0x222 }));
                jawPart.position.set(0, -0.25, 0.8);
                animojiGroup.add(jawPart);

            } else if (type === 'panda') {
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                animojiGroup.add(new THREE.Mesh(headGeo, headMat));

                const earMat = new THREE.MeshStandardMaterial({ color: 0x111 });
                const lEar = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), earMat); lEar.position.set(-0.7, 0.7, 0);
                const rEar = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), earMat); rEar.position.set(0.7, 0.7, 0);
                animojiGroup.add(lEar); animojiGroup.add(rEar);

                const patchMat = new THREE.MeshBasicMaterial({ color: 0x111 });
                const lPatch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 12), patchMat); lPatch.rotateX(Math.PI/2); lPatch.position.set(-0.3, 0.15, 0.78);
                const rPatch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 12), patchMat); rPatch.rotateX(Math.PI/2); rPatch.position.set(0.3, 0.15, 0.78);
                animojiGroup.add(lPatch); animojiGroup.add(rPatch);

                jawPart = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, 0.04), patchMat);
                jawPart.position.set(0, -0.25, 0.8);
                animojiGroup.add(jawPart);
            }

            scene.add(animojiGroup);
        }

        function initTracking() {
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && animojiGroup) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1], lEdge = lm[234], rEdge = lm[454], forehead = lm[10], chin = lm[152];

                    const cx = (lEdge.x + rEdge.x) / 2;
                    const cy = (forehead.y + chin.y) / 2;
                    const cz = (lEdge.z + rEdge.z + nose.z) / 3;

                    // Smooth tracking calculation
                    animojiGroup.position.x += ((-(cx - 0.5) * 3.5) - animojiGroup.position.x) * 0.6;
                    animojiGroup.position.y += (((-(cy - 0.5) * 3.5) + 0.1) - animojiGroup.position.y) * 0.6;
                    animojiGroup.position.z += ((cz * 1.5) - animojiGroup.position.z) * 0.6;

                    const dx = rEdge.x - lEdge.x, dy = rEdge.y - lEdge.y;
                    const roll = Math.atan2(dy, dx);
                    const yaw = Math.asin(Math.max(-1, Math.min(1, (rEdge.z - lEdge.z) * 1.8)));
                    const pitch = ((chin.y - forehead.y) - 0.4) * -1.2;

                    animojiGroup.rotation.set(pitch, yaw, roll);

                    if (jawPart) {
                        const mouthOpen = Math.abs(lm[13].y - lm[14].y);
                        jawPart.scale.set(1, Math.max(0.4, mouthOpen * 14.0), 1);
                    }

                    animojiGroup.visible = true;
                } else if (animojiGroup) {
                    animojiGroup.visible = false;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => { if (videoEl && videoEl.readyState >= 2) await faceMesh.send({ image: videoEl }); },
                width: 640, height: 480
            });
            mpCamera.start();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
