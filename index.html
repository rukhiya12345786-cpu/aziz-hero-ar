<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Azeez AR</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    z-index:1;
}

#arCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:8px 14px;
    border-radius:20px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:13px;
    white-space:nowrap;
}

#cameraError{
    display:none;
    position:fixed;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:420px;
    z-index:20;
    padding:15px;
    border-radius:12px;
    background:rgba(120,0,0,.9);
    color:#fff;
    text-align:center;
    font-size:14px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:10;
    padding:10px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9) 18%
    );
}

.buttonRow{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:center;
}

button,
.fileButton{
    border:0;
    border-radius:9px;
    padding:11px 13px;
    background:#222;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.fileButton{
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

button:active,
.fileButton:active{
    transform:scale(.96);
}

#recordButton{
    background:#c62828;
}

#recordButton.recording{
    background:#ff1744;
}

#modelFile{
    display:none;
}

.sliderBox{
    width:100%;
    max-width:500px;
    margin:7px auto 0;
    color:#fff;
    font-size:12px;
}

.sliderBox span{
    display:block;
    margin-bottom:3px;
}

.sliderBox input{
    width:100%;
}

#recordingIndicator{
    display:none;
    position:fixed;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    color:#fff;
    background:#d50000;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
}

#recordingIndicator.active{
    display:block;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<canvas id="arCanvas"></canvas>

<div id="status">Starting...</div>

<div id="recordingIndicator">● Recording</div>

<div id="cameraError"></div>

<div id="controls">

    <div class="buttonRow">

        <label class="fileButton" for="modelFile">
            3D Model
        </label>

        <button id="recordButton">
            Record
        </button>

        <button id="flipButton">
            Flip Camera
        </button>

        <button id="resetButton">
            Reset
        </button>

    </div>

    <input
        id="modelFile"
        type="file"
        accept=".glb,.gltf,.obj,.fbx"
    >

    <div class="sliderBox">
        <span>Model Size</span>
        <input
            id="sizeSlider"
            type="range"
            min="0.3"
            max="2.5"
            value="1"
            step="0.01"
        >
    </div>

    <div class="sliderBox">
        <span>Head Up / Down</span>
        <input
            id="heightSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01"
        >
    </div>

    <div class="sliderBox">
        <span>Head Forward / Back</span>
        <input
            id="depthSlider"
            type="range"
            min="-1"
            max="1"
            value="0"
            step="0.01"
        >
    </div>

</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("arCanvas");
const statusBox = document.getElementById("status");
const cameraError = document.getElementById("cameraError");

const recordButton = document.getElementById("recordButton");
const flipButton = document.getElementById("flipButton");
const resetButton = document.getElementById("resetButton");
const modelFile = document.getElementById("modelFile");

const sizeSlider = document.getElementById("sizeSlider");
const heightSlider = document.getElementById("heightSlider");
const depthSlider = document.getElementById("depthSlider");

const recordingIndicator =
    document.getElementById("recordingIndicator");

let scene;
let threeCamera;
let renderer;

let headGroup;
let faceOccluder;
let importedModel = null;

let faceMesh = null;

let cameraStream = null;
let cameraFacing = "user";

let trackingRunning = false;
let trackingBusy = false;

let smoothPosition = new THREE.Vector3();
let smoothQuaternion = new THREE.Quaternion();
let smoothScale = 1;

let modelSize = 1;
let heightValue = 0;
let depthValue = 0;

let mediaRecorder = null;
let recordedChunks = [];

let recordCanvas = null;
let recordContext = null;
let recordingFrame = null;
let isRecording = false;

let lastFaceTime = 0;

function setStatus(message){
    statusBox.textContent = message;
}

function showError(message){
    cameraError.innerHTML = message;
    cameraError.style.display = "block";
}

function hideError(){
    cameraError.style.display = "none";
}

function isCameraSupported(){
    return !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
    );
}

function initializeThree(){

    scene = new THREE.Scene();

    threeCamera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    threeCamera.position.set(0,0,5);

    renderer = new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true,
        preserveDrawingBuffer:true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    headGroup = new THREE.Group();

    scene.add(headGroup);

    const ambient = new THREE.AmbientLight(
        0xffffff,
        1.4
    );

    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    keyLight.position.set(2,3,4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(
        0xffffff,
        .7
    );

    fillLight.position.set(-3,1,2);
    scene.add(fillLight);

    createFaceOccluder();

    window.addEventListener(
        "resize",
        resizeThree
    );

    renderLoop();
}

function resizeThree(){

    if(!renderer || !threeCamera){
        return;
    }

    threeCamera.aspect =
        window.innerWidth / window.innerHeight;

    threeCamera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function createFaceOccluder(){

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            24
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:0x000000,
            transparent:true,
            opacity:0,
            colorWrite:false,
            depthWrite:true,
            depthTest:true,
            side:THREE.DoubleSide
        });

    faceOccluder =
        new THREE.Mesh(
            geometry,
            material
        );

    faceOccluder.renderOrder = 0;

    scene.add(faceOccluder);
}

function renderLoop(){

    requestAnimationFrame(renderLoop);

    if(renderer && scene && threeCamera){

        renderer.render(
            scene,
            threeCamera
        );
    }
}

async function startCamera(){

    if(!isCameraSupported()){

        showError(
            "Camera is not supported by this browser."
        );

        setStatus("Camera Not Supported");

        return false;
    }

    hideError();

    try{

        if(cameraStream){

            cameraStream.getTracks().forEach(
                track => track.stop()
            );
        }

        setStatus("Opening Camera...");

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:cameraFacing
                    },
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:true

            });

        video.srcObject = cameraStream;

        video.style.transform =
            cameraFacing === "user"
            ? "scaleX(-1)"
            : "scaleX(1)";

        await video.play();

        setStatus("Camera Ready");

        return true;

    }catch(error){

        console.error(error);

        showError(
            "Camera could not open.<br><br>" +
            "Allow camera permission and use HTTPS or localhost."
        );

        setStatus("Camera Error");

        return false;
    }
}function initializeFaceTracking(){

    faceMesh = new FaceMesh({
        locateFile:function(file){
            return
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" +
                file;
        }
    });

    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });

    faceMesh.onResults(
        processFaceResults
    );

    trackingRunning = true;

    trackingLoop();

    setStatus("Face Tracking Ready");
}

async function trackingLoop(){

    if(!trackingRunning){
        return;
    }

    requestAnimationFrame(
        trackingLoop
    );

    if(
        !faceMesh ||
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        trackingBusy
    ){
        return;
    }

    const now = performance.now();

    if(now - lastFaceTime < 33){
        return;
    }

    lastFaceTime = now;

    trackingBusy = true;

    try{

        await faceMesh.send({
            image:video
        });

    }catch(error){

        console.warn(
            "Face tracking error:",
            error
        );

    }

    trackingBusy = false;
}

function processFaceResults(results){

    if(
        !results ||
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){
        return;
    }

    const landmarks =
        results.multiFaceLandmarks[0];

    const leftCheek =
        landmarks[234];

    const rightCheek =
        landmarks[454];

    const forehead =
        landmarks[10];

    const chin =
        landmarks[152];

    const nose =
        landmarks[1];

    if(
        !leftCheek ||
        !rightCheek ||
        !forehead ||
        !chin ||
        !nose
    ){
        return;
    }

    const lx = 1 - leftCheek.x;
    const rx = 1 - rightCheek.x;
    const fx = 1 - forehead.x;
    const cx = 1 - chin.x;
    const nx = 1 - nose.x;

    const left = new THREE.Vector3(
        (lx - .5) * 2.4,
        -(leftCheek.y - .5) * 2.0,
        0
    );

    const right = new THREE.Vector3(
        (rx - .5) * 2.4,
        -(rightCheek.y - .5) * 2.0,
        0
    );

    const top = new THREE.Vector3(
        (fx - .5) * 2.4,
        -(forehead.y - .5) * 2.0,
        0
    );

    const bottom = new THREE.Vector3(
        (cx - .5) * 2.4,
        -(chin.y - .5) * 2.0,
        0
    );

    const nosePoint = new THREE.Vector3(
        (nx - .5) * 2.4,
        -(nose.y - .5) * 2.0,
        1
    );

    const center = new THREE.Vector3()
        .addVectors(left,right)
        .multiplyScalar(.5);

    center.y =
        (top.y + bottom.y) * .5;

    const xAxis =
        new THREE.Vector3()
        .subVectors(right,left)
        .normalize();

    let yAxis =
        new THREE.Vector3()
        .subVectors(top,bottom)
        .normalize();

    let zAxis =
        new THREE.Vector3()
        .crossVectors(xAxis,yAxis)
        .normalize();

    const noseDirection =
        new THREE.Vector3()
        .subVectors(
            nosePoint,
            center
        );

    if(
        zAxis.dot(noseDirection) < 0
    ){
        zAxis.negate();
    }

    yAxis =
        new THREE.Vector3()
        .crossVectors(zAxis,xAxis)
        .normalize();

    const rotationMatrix =
        new THREE.Matrix4();

    rotationMatrix.makeBasis(
        xAxis,
        yAxis,
        zAxis
    );

    const targetQuaternion =
        new THREE.Quaternion();

    targetQuaternion.setFromRotationMatrix(
        rotationMatrix
    );

    const faceWidth =
        left.distanceTo(right);

    const faceHeight =
        top.distanceTo(bottom);

    const centerX =
        (lx + rx) * .5;

    const centerY =
        (forehead.y + chin.y) * .5;

    const targetPosition =
        new THREE.Vector3(
            (centerX - .5) * 2.4,
            -(centerY - .5) * 2.0,
            0
        );

    const targetScale =
        THREE.MathUtils.clamp(
            faceWidth * 3.4,
            .35,
            2.4
        );

    smoothPosition.lerp(
        targetPosition,
        .35
    );

    smoothQuaternion.slerp(
        targetQuaternion,
        .3
    );

    smoothScale +=
        (targetScale - smoothScale) * .25;

    if(headGroup){

        headGroup.position.copy(
            smoothPosition
        );

        headGroup.quaternion.copy(
            smoothQuaternion
        );

        headGroup.scale.setScalar(
            smoothScale * modelSize
        );

        headGroup.position.y +=
            heightValue * .3;

        headGroup.position.z +=
            depthValue * .3;
    }

    if(faceOccluder){

        faceOccluder.position.copy(
            smoothPosition
        );

        faceOccluder.quaternion.copy(
            smoothQuaternion
        );

        const widthScale =
            THREE.MathUtils.clamp(
                faceWidth * 3.8,
                .65,
                2.5
            );

        const heightScale =
            THREE.MathUtils.clamp(
                faceHeight * 2.7,
                .7,
                3
            );

        faceOccluder.scale.set(
            widthScale,
            heightScale,
            widthScale * .9
        );
    }

    setStatus(
        importedModel
        ? "3D Tracking Active"
        : "Face Tracking Active"
    );
}

function disposeMaterial(material){

    if(!material){
        return;
    }

    const keys = [
        "map",
        "normalMap",
        "roughnessMap",
        "metalnessMap",
        "aoMap",
        "emissiveMap",
        "alphaMap"
    ];

    keys.forEach(function(key){

        if(material[key]){
            material[key].dispose();
        }

    });

    material.dispose();
}

function disposeObject(object){

    if(!object){
        return;
    }

    object.traverse(function(child){

        if(!child.isMesh){
            return;
        }

        if(child.geometry){
            child.geometry.dispose();
        }

        if(Array.isArray(child.material)){

            child.material.forEach(
                disposeMaterial
            );

        }else if(child.material){

            disposeMaterial(
                child.material
            );
        }
    });
}

modelFile.addEventListener(
    "change",
    function(){

        const file =
            modelFile.files &&
            modelFile.files[0];

        if(!file){
            return;
        }

        loadModel(file);
    }
);

function loadModel(file){

    const name =
        file.name.toLowerCase();

    const url =
        URL.createObjectURL(file);

    setStatus("Loading 3D Model...");

    if(importedModel){

        headGroup.remove(
            importedModel
        );

        disposeObject(
            importedModel
        );

        importedModel = null;
    }

    if(
        name.endsWith(".glb") ||
        name.endsWith(".gltf")
    ){

        const loader =
            new THREE.GLTFLoader();

        loader.load(

            url,

            function(gltf){

                URL.revokeObjectURL(url);

                prepareModel(
                    gltf.scene
                );
            },

            undefined,

            function(error){

                URL.revokeObjectURL(url);

                console.error(error);

                setStatus(
                    "GLTF Load Failed"
                );
            }
        );

        return;
    }

    if(name.endsWith(".obj")){

        const loader =
            new THREE.OBJLoader();

        loader.load(

            url,

            function(object){

                URL.revokeObjectURL(url);

                prepareModel(
                    object
                );
            },

            undefined,

            function(error){

                URL.revokeObjectURL(url);

                console.error(error);

                setStatus(
                    "OBJ Load Failed"
                );
            }
        );

        return;
    }

    if(name.endsWith(".fbx")){

        const loader =
            new THREE.FBXLoader();

        loader.load(

            url,

            function(object){

                URL.revokeObjectURL(url);

                prepareModel(
                    object
                );
            },

            undefined,

            function(error){

                URL.revokeObjectURL(url);

                console.error(error);

                setStatus(
                    "FBX Load Failed"
                );
            }
        );

        return;
    }

    URL.revokeObjectURL(url);

    setStatus(
        "Unsupported Model"
    );
}

function prepareModel(object){

    if(!object){
        return;
    }

    const box =
        new THREE.Box3()
        .setFromObject(object);

    const center =
        new THREE.Vector3();

    const size =
        new THREE.Vector3();

    box.getCenter(center);
    box.getSize(size);

    object.position.sub(
        center
    );

    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if(maxDimension > 0){

        const scale =
            1.8 / maxDimension;

        object.scale.setScalar(
            scale
        );
    }

    object.traverse(function(child){

        if(!child.isMesh){
            return;
        }

        child.frustumCulled = false;

        child.renderOrder = 1;

        if(child.material){

            if(Array.isArray(child.material)){

                child.material.forEach(
                    function(material){

                        material.depthTest = true;
                        material.depthWrite = true;
                        material.side =
                            THREE.DoubleSide;

                    }
                );

            }else{

                child.material.depthTest = true;
                child.material.depthWrite = true;
                child.material.side =
                    THREE.DoubleSide;
            }
        }
    });

    importedModel = object;

    headGroup.add(
        importedModel
    );

    setStatus(
        "3D Model Loaded"
    );
      }sizeSlider.addEventListener(
    "input",
    function(){

        modelSize =
            parseFloat(
                sizeSlider.value
            );
    }
);

heightSlider.addEventListener(
    "input",
    function(){

        heightValue =
            parseFloat(
                heightSlider.value
            );
    }
);

depthSlider.addEventListener(
    "input",
    function(){

        depthValue =
            parseFloat(
                depthSlider.value
            );
    }
);

flipButton.addEventListener(
    "click",
    async function(){

        cameraFacing =
            cameraFacing === "user"
            ? "environment"
            : "user";

        const success =
            await startCamera();

        if(success){

            video.style.transform =
                cameraFacing === "user"
                ? "scaleX(-1)"
                : "scaleX(1)";

            setStatus(
                "Camera Ready"
            );
        }
    }
);

resetButton.addEventListener(
    "click",
    function(){

        modelSize = 1;
        heightValue = 0;
        depthValue = 0;

        sizeSlider.value = "1";
        heightSlider.value = "0";
        depthSlider.value = "0";

        smoothPosition.set(
            0,0,0
        );

        smoothQuaternion.identity();

        smoothScale = 1;

        if(headGroup){

            headGroup.position.set(
                0,0,0
            );

            headGroup.quaternion.identity();

            headGroup.scale.setScalar(1);
        }

        if(faceOccluder){

            faceOccluder.position.set(
                0,0,0
            );

            faceOccluder.quaternion.identity();

            faceOccluder.scale.set(
                1,1,1
            );
        }

        setStatus(
            importedModel
            ? "Tracking Reset"
            : "Ready"
        );
    }
);

function createRecordingCanvas(){

    if(recordCanvas){
        return;
    }

    recordCanvas =
        document.createElement(
            "canvas"
        );

    recordContext =
        recordCanvas.getContext(
            "2d"
        );
}

function drawRecordingFrame(){

    if(
        !recordCanvas ||
        !recordContext ||
        !video.videoWidth
    ){
        return;
    }

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    if(
        recordCanvas.width !== width ||
        recordCanvas.height !== height
    ){

        recordCanvas.width = width;
        recordCanvas.height = height;
    }

    recordContext.clearRect(
        0,
        0,
        width,
        height
    );

    if(cameraFacing === "user"){

        recordContext.save();

        recordContext.translate(
            width,
            0
        );

        recordContext.scale(
            -1,
            1
        );

        recordContext.drawImage(
            video,
            0,
            0,
            width,
            height
        );

        recordContext.restore();

    }else{

        recordContext.drawImage(
            video,
            0,
            0,
            width,
            height
        );
    }

    recordContext.drawImage(
        canvas,
        0,
        0,
        width,
        height
    );

    if(isRecording){

        recordingFrame =
            requestAnimationFrame(
                drawRecordingFrame
            );
    }
}

function getRecordingMimeType(){

    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"
    ];

    for(
        let i = 0;
        i < types.length;
        i++
    ){

        if(
            MediaRecorder.isTypeSupported(
                types[i]
            )
        ){
            return types[i];
        }
    }

    return "";
}

function startRecording(){

    if(isRecording){
        return;
    }

    if(
        !window.MediaRecorder
    ){

        setStatus(
            "Recording Not Supported"
        );

        return;
    }

    if(
        !cameraStream
    ){

        setStatus(
            "Camera Not Ready"
        );

        return;
    }

    createRecordingCanvas();

    recordedChunks = [];

    const recordingStream =
        recordCanvas.captureStream(30);

    cameraStream
        .getAudioTracks()
        .forEach(function(track){

            recordingStream.addTrack(
                track
            );
        });

    const mimeType =
        getRecordingMimeType();

    try{

        mediaRecorder =
            mimeType
            ? new MediaRecorder(
                recordingStream,
                {mimeType:mimeType}
            )
            : new MediaRecorder(
                recordingStream
            );

    }catch(error){

        console.error(error);

        setStatus(
            "Recorder Start Failed"
        );

        return;
    }

    mediaRecorder.ondataavailable =
        function(event){

            if(
                event.data &&
                event.data.size > 0
            ){

                recordedChunks.push(
                    event.data
                );
            }
        };

    mediaRecorder.onstop =
        finishRecording;

    mediaRecorder.onerror =
        function(event){

            console.error(event);

            isRecording = false;

            recordingIndicator
                .classList.remove(
                    "active"
                );

            recordButton
                .classList.remove(
                    "recording"
                );

            recordButton.textContent =
                "Record";

            setStatus(
                "Recording Error"
            );
        };

    isRecording = true;

    recordingIndicator
        .classList.add(
            "active"
        );

    recordButton
        .classList.add(
            "recording"
        );

    recordButton.textContent =
        "Stop";

    drawRecordingFrame();

    mediaRecorder.start(200);

    setStatus(
        "Recording..."
    );
}

function stopRecording(){

    if(
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ){
        return;
    }

    mediaRecorder.stop();

    isRecording = false;

    if(recordingFrame){

        cancelAnimationFrame(
            recordingFrame
        );

        recordingFrame = null;
    }

    recordingIndicator
        .classList.remove(
            "active"
        );

    recordButton
        .classList.remove(
            "recording"
        );

    recordButton.textContent =
        "Record";

    setStatus(
        "Saving Video..."
    );
}

function finishRecording(){

    if(!recordedChunks.length){

        setStatus(
            "No Recording Data"
        );

        return;
    }

    const blob =
        new Blob(
            recordedChunks,
            {
                type:"video/webm"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement(
            "a"
        );

    link.href = url;

    link.download =
        "Azeez-AR-" +
        Date.now() +
        ".webm";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

    recordedChunks = [];

    setStatus(
        "Video Saved"
    );
}

recordButton.addEventListener(
    "click",
    function(){

        if(isRecording){

            stopRecording();

        }else{

            startRecording();
        }
    }
);async function initializeApplication(){

    setStatus(
        "Initializing..."
    );

    initializeThree();

    createRecordingCanvas();

    if(!isCameraSupported()){

        showError(
            "Camera access is not available in this browser."
        );

        setStatus(
            "Camera Not Supported"
        );

        return;
    }

    const cameraStarted =
        await startCamera();

    if(!cameraStarted){

        return;
    }

    setStatus(
        "Loading Face Tracking..."
    );

    try{

        initializeFaceTracking();

    }catch(error){

        console.error(error);

        showError(
            "Face tracking could not start."
        );

        setStatus(
            "Tracking Error"
        );

        return;
    }

    setStatus(
        "Face Tracking Active"
    );
}

function stopAllResources(){

    trackingRunning = false;

    if(
        cameraStream
    ){

        cameraStream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        cameraStream = null;
    }

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        try{
            mediaRecorder.stop();
        }catch(error){
            console.warn(error);
        }
    }

    isRecording = false;

    if(recordingFrame){

        cancelAnimationFrame(
            recordingFrame
        );

        recordingFrame = null;
    }
}

window.addEventListener(
    "beforeunload",
    function(){

        stopAllResources();

        if(importedModel){

            disposeObject(
                importedModel
            );
        }

        if(renderer){

            renderer.dispose();
        }
    }
);

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible" &&
            cameraStream
        ){

            video.play().catch(
                function(error){
                    console.warn(error);
                }
            );
        }
    }
);window.addEventListener(
    "load",
    function(){

        initializeApplication()
            .catch(
                function(error){

                    console.error(
                        "Application Error:",
                        error
                    );

                    setStatus(
                        "Application Error"
                    );

                    showError(
                        "Application could not start.<br><br>" +
                        "Please check camera permission."
                    );
                }
            );
    }
);

</script>
