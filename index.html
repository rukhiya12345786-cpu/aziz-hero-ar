<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz AR Studio - Kalidokit Pro Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: sans-serif; }
        
        #webcam { position: absolute; top: 15px; left: 15px; width: 130px; height: 98px; transform: scaleX(-1); border-radius: 8px; z-index: 10; border: 2px solid rgba(0,255,136,0.5); object-fit: cover; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        
        .ui-top {
            position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; gap: 8px; pointer-events: auto;
        }
        .btn {
            background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88;
            padding: 9px 14px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(6px); text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .btn:active { background: #00ff88; color: #000; }

        .info-box {
            position: absolute; bottom: 20px; left: 15px; right: 15px; text-align: center;
            z-index: 20; color: #00ff88; font-size: 11px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 6px;
            border: 1px solid rgba(0,255,136,0.3); backdrop-filter: blur(5px);
        }
    </style>

    <!-- Core Libraries (Three.js & Loaders) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- MediaPipe & Kalidokit Tracking Engines -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="ui-top">
        <button id="import-btn" class="btn">📥 Import Model</button>
        <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf,.fbx">
    </div>

    <div id="webgl-container"></div>
    <div class="info-box" id="status-text">Status: Initializing Kalidokit Engine & Camera...</div>

    <script>
        let scene, camera, renderer, videoElement;
        let activeModelGroup = null;
        let smoothPos = new THREE.Vector3(0, 0, 0);
        let smoothRot = new THREE.Quaternion();

        function initStudio() {
            // 1. Three.js Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            // Lighting for Custom Models
            scene.add(new THREE.AmbientLight(0xffffff, 1.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            // Load default placeholder head so screen isn't blank
            createDefaultHead();

            // 2. Import Logic
            document.getElementById('import-btn').addEventListener('click', () => {
                document.getElementById('import-file').click();
            });

            document.getElementById('import-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileURL = URL.createObjectURL(file);
                const fileName = file.name.toLowerCase();

                document.getElementById('status-text').innerText = "Processing & Centering Model...";

                const processAndAddModel = (object) => {
                    if (activeModelGroup) scene.remove(activeModelGroup);
                    activeModelGroup = new THREE.Group();

                    // Perfect Bounding Box auto-centering so it never goes off-screen
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    object.position.sub(center);

                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        const scaleFactor = 1.0 / maxDim;
                        object.scale.multiplyScalar(scaleFactor);
                    }

                    activeModelGroup.add(object);
                    scene.add(activeModelGroup);
                    document.getElementById('status-text').innerText = "Success! Model loaded & synced with tracker.";
                };

                if (fileName.endsWith('.obj')) {
                    new THREE.OBJLoader().load(fileURL, (obj) => {
                        obj.traverse(child => {
                            if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3, metalness: 0.2 });
                        });
                        processAndAddModel(obj);
                    }, undefined, (err) => { console.error(err); alert("Error loading OBJ file"); });
                } else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                    new THREE.GLTFLoader().load(fileURL, (gltf) => {
                        processAndAddModel(gltf.scene);
                    }, undefined, (err) => { console.error(err); alert("Error loading GLB file"); });
                } else if (fileName.endsWith('.fbx')) {
                    new THREE.FBXLoader().load(fileURL, (obj) => {
                        obj.traverse(child => {
                            if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3, metalness: 0.2 });
                        });
                        processAndAddModel(obj);
                    }, undefined, (err) => { console.error(err); alert("Error loading FBX file"); });
                }
            });

            // 3. Start MediaPipe & Kalidokit Tracking
            initTracking();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animateLoop();
        }

        function createDefaultHead() {
            activeModelGroup = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.4, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2, metalness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            activeModelGroup.add(mesh);
            scene.add(activeModelGroup);
        }

        function initTracking() {
            videoElement = document.getElementById('webcam');

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && activeModelGroup) {
                    const landmarks = results.multiFaceLandmarks[0];
                    
                    // Kalidokit Solver Engine
                    const riggedFace = Kalidokit.Face.solve(landmarks, {
                        runtime: "mediapipe",
                        video: videoElement
                    });

                    if (riggedFace) {
                        // Positional tracking coordinates based on face position
                        const nose = landmarks[1], lEdge = landmarks[234], rEdge = landmarks[454];
                        const cx = (lEdge.x + rEdge.x) / 2;
                        const cy = (landmarks[10].y + landmarks[152].y) / 2;
                        const cz = (lEdge.z + rEdge.z + nose.z) / 3;

                        const targetX = -(cx - 0.5) * 3.0;
                        const targetY = -(cy - 0.5) * 3.0 + 0.15;
                        const targetZ = cz;

                        smoothPos.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.5);
                        activeModelGroup.position.copy(smoothPos);

                        // Smooth Head Rotation using Kalidokit euler angles
                        const euler = riggedFace.head;
                        let targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(euler.x, euler.y, euler.z, 'YXZ'));
                        smoothRot.slerp(targetQuat, 0.5);
                        activeModelGroup.quaternion.copy(smoothRot);
                    }

                    activeModelGroup.visible = true;
                    document.getElementById('status-text').innerText = "Tracking Active: Face detected smoothly!";
                } else if (activeModelGroup) {
                    activeModelGroup.visible = false;
                    document.getElementById('status-text').innerText = "Searching for face... Look at the camera.";
                }
            });

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    if (videoElement && videoElement.readyState >= 2) {
                        await faceMesh.send({ image: videoElement });
                    }
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        initStudio();
    </script>
</body>
</html>
