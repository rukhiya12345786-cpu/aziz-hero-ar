<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez AR App</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: sans-serif; color: #fff;
        }
        #cameraStream {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1;
        }
        #webgl-container {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }
        .ui-layer {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 10; display: flex;
            gap: 8px; flex-wrap: wrap;
            justify-content: center; width: 95%; max-width: 600px;
        }
        button, label.upload-btn {
            padding: 10px 14px; font-size: 13px;
            color: white; background: #007bff;
            border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        label.upload-btn { background: #ffc107; color: #000; }
        input[type="file"] { display: none; }
        #exportBtn { background: #17a2b8; }
        #recordBtn { background: #28a745; }
        #stopBtn { background: #dc3545; display: none; }
        #downloadLink { background: #6c757d; color: #fff; text-decoration: none; display: none; line-height: 35px; padding: 0 12px; border-radius: 8px;}

        /* Sliders Panel */
        .sliders-panel {
            position: fixed; top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 10; background: rgba(0,0,0,0.75);
            padding: 10px 15px; border-radius: 10px;
            display: flex; flex-direction: column; gap: 8px;
            width: 90%; max-width: 350px; font-size: 12px;
            backdrop-filter: blur(5px);
        }
        .slider-row { display: flex; align-items: center; justify-content: space-between; }
        .slider-row input { width: 65%; cursor: pointer; }
    </style>

    <!-- Three.js & GLTF Loader via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <!-- Sliders for 3D Model Control -->
    <div class="sliders-panel">
        <div class="slider-row">
            <span>Size (Scale):</span>
            <input type="range" id="scaleSlider" min="0.2" max="5" step="0.1" value="1.5">
        </div>
        <div class="slider-row">
            <span>Rotate 360°:</span>
            <input type="range" id="rotateSlider" min="0" max="6.28" step="0.1" value="0">
        </div>
        <div class="slider-row">
            <span>Move Left/Right:</span>
            <input type="range" id="posXSlider" min="-3" max="3" step="0.1" value="0">
        </div>
        <div class="slider-row">
            <span>Move Up/Down:</span>
            <input type="range" id="posYSlider" min="-3" max="3" step="0.1" value="0">
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="ui-layer">
        <button id="flipBtn">Flip</button>
        <label class="upload-btn">
            Import 3D
            <input type="file" id="fileInput" accept=".glb,.gltf">
        </label>
        <button id="exportBtn">Export</button>
        <button id="recordBtn">Rec</button>
        <button id="stopBtn">Stop</button>
        <a id="downloadLink" download="azeez-ar-video.webm">Download Video</a>
    </div>

    <script>
        const videoElement = document.getElementById('cameraStream');
        const flipBtn = document.getElementById('flipBtn');
        const fileInput = document.getElementById('fileInput');
        const exportBtn = document.getElementById('exportBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');

        const scaleSlider = document.getElementById('scaleSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const posXSlider = document.getElementById('posXSlider');
        const posYSlider = document.getElementById('posYSlider');

        let useFrontCamera = true;
        let currentStream;
        let scene, camera, renderer, currentModel;
        let mediaRecorder;
        let recordedChunks = [];

        // Start Camera
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (error) {
                alert("Camera error: " + error);
            }
        }

        flipBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Initialize 3D Scene
        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                let baseScale = parseFloat(scaleSlider.value);
                currentModel.scale.set(baseScale, baseScale, baseScale);
                currentModel.rotation.y = parseFloat(rotateSlider.value);
                currentModel.position.x = parseFloat(posXSlider.value);
                currentModel.position.y = parseFloat(posYSlider.value);
            }
            renderer.render(scene, camera);
        }

        // Import 3D Model
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const loader = new THREE.GLTFLoader();
                loader.parse(e.target.result, '', (gltf) => {
                    if (currentModel) scene.remove(currentModel);
                    currentModel = gltf.scene;
                    scene.add(currentModel);
                }, (err) => { alert("Load error: " + err); });
            };
            reader.readAsArrayBuffer(file);
        });

        // Export Snapshot
        exportBtn.addEventListener('click', () => {
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'azeez-ar-snapshot.png';
            link.href = dataURL;
            link.click();
        });

        // Video Recording
        recordBtn.addEventListener('click', () => {
            recordedChunks = [];
            try {
                let options = { mimeType: 'video/webm;codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
                
                mediaRecorder = new MediaRecorder(currentStream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadLink.style.display = 'inline-block';
                };
                mediaRecorder.start();
                recordBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                downloadLink.style.display = 'none';
            } catch (err) { alert("Recording error: " + err); }
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            stopBtn.style.display = 'none';
            recordBtn.style.display = 'inline-block';
        });

        startCamera();
        init3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
