
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MindAR Face Filters + 3D Model Import</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    .example-container { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    a-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .options-panel {
      position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
      z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      padding: 8px; border-radius: 12px; background: rgba(0,0,0,.62);
    }
    .options-panel img {
      width: 48px; height: 48px; object-fit: cover; cursor: pointer;
      border: 2px solid #ddd; border-radius: 7px; background: #fff;
    }
    .options-panel img.selected { border-color: #28e06f; }
    .control-button, .file-label {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 38px; padding: 8px 10px; border: 0; border-radius: 8px;
      color: #fff; background: #1769d2; font-size: 12px; font-weight: 700;
      cursor: pointer; text-align: center;
    }
    .control-button.remove { background: #b83232; }
    #modelFile { display: none; }
    #status {
      position: fixed; z-index: 11; left: 8px; bottom: max(8px, env(safe-area-inset-bottom));
      max-width: calc(100% - 16px); padding: 8px 10px; border-radius: 8px;
      background: rgba(0,0,0,.72); color: white; font-size: 12px;
    }
    @media (max-width: 420px) {
      .options-panel { gap: 5px; padding: 6px; }
      .options-panel img { width: 42px; height: 42px; }
      .control-button, .file-label { font-size: 11px; padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <div class="example-container">
    <div class="options-panel" aria-label="Face filters and model controls">
      <img id="hat1" alt="Hat filter 1" title="Hat 1" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/thumbnail.png">
      <img id="hat2" alt="Hat filter 2" title="Hat 2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat2/thumbnail.png">
      <img id="glasses1" alt="Glasses filter 1" title="Glasses 1" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/thumbnail.png">
      <img id="glasses2" alt="Glasses filter 2" title="Glasses 2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses2/thumbnail.png">
      <img id="earring" alt="Earring filter" title="Earring" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/earring/thumbnail.png">

      <label class="file-label" for="modelFile">IMPORT 3D MODEL</label>
      <input id="modelFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
      <button id="removeModel" class="control-button remove" type="button">REMOVE MODEL</button>
    </div>

    <div id="status" role="status">Allow camera access when prompted. Choose a .glb model to import.</div>

    <a-scene
      mindar-face="autoStart: true; uiLoading: no; uiScanning: no; uiError: no"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
        <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
        <a-asset-item id="glassesModel2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses2/scene.gltf"></a-asset-item>
        <a-asset-item id="hatModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
        <a-asset-item id="hatModel2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat2/scene.gltf"></a-asset-item>
        <a-asset-item id="earringModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/earring/scene.gltf"></a-asset-item>
      </a-assets>

      <a-camera active="false" position="0 0 0"></a-camera>

      <!-- Face occluder -->
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-gltf-model mindar-face-occluder position="0 -0.3 0.15" rotation="0 0 0" scale="0.065 0.065 0.065" src="#headModel"></a-gltf-model>
      </a-entity>

      <!-- Built-in filters -->
      <a-entity mindar-face-target="anchorIndex: 10">
        <a-gltf-model rotation="0 0 0" position="0 1.0 -0.5" scale="0.35 0.35 0.35" src="#hatModel" class="hat1-entity" visible="false"></a-gltf-model>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex: 10">
        <a-gltf-model rotation="0 0 0" position="0 -0.2 -0.5" scale="0.008 0.008 0.008" src="#hatModel2" class="hat2-entity" visible="false"></a-gltf-model>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.01 0.01 0.01" src="#glassesModel" class="glasses1-entity" visible="false"></a-gltf-model>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-gltf-model rotation="0 -90 0" position="0 -0.3 0" scale="0.6 0.6 0.6" src="#glassesModel2" class="glasses2-entity" visible="false"></a-gltf-model>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex: 127">
        <a-gltf-model rotation="-0.1 0 0" position="0 -0.3 -0.3" scale="0.05 0.05 0.05" src="#earringModel" class="earring-entity" visible="false"></a-gltf-model>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex: 356">
        <a-gltf-model rotation="0.1 0 0" position="0 -0.3 -0.3" scale="0.05 0.05 0.05" src="#earringModel" class="earring-entity" visible="false"></a-gltf-model>
      </a-entity>

      <!-- Imported model is attached to face anchor 168 -->
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-entity id="uploadedModel" visible="false" position="0 0 0" rotation="0 0 0" scale="0.1 0.1 0.1"></a-entity>
      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const filterNames = ["glasses1", "glasses2", "hat1", "hat2", "earring"];
      const filterVisible = [true, false, false, true, true];
      const status = document.querySelector("#status");
      const modelInput = document.querySelector("#modelFile");
      const uploadedModel = document.querySelector("#uploadedModel");
      const removeButton = document.querySelector("#removeModel");
      let currentObjectUrl = null;

      function setFilterVisible(button, entities, visible) {
        button.classList.toggle("selected", visible);
        entities.forEach((entity) => entity.setAttribute("visible", visible));
      }

      filterNames.forEach((name, index) => {
        const button = document.querySelector("#" + name);
        const entities = document.querySelectorAll("." + name + "-entity");
        setFilterVisible(button, entities, filterVisible[index]);
        button.addEventListener("click", () => {
          filterVisible[index] = !filterVisible[index];
          setFilterVisible(button, entities, filterVisible[index]);
        });
      });

      function removeImportedModel() {
        uploadedModel.setAttribute("visible", false);
        uploadedModel.removeAttribute("gltf-model");
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = null;
        }
        modelInput.value = "";
        status.textContent = "Imported model removed.";
      }

      modelInput.addEventListener("change", function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const lowerName = file.name.toLowerCase();
        if (!lowerName.endsWith(".glb") && !lowerName.endsWith(".gltf")) {
          status.textContent = "Please choose a .glb or .gltf file.";
          modelInput.value = "";
          return;
        }

        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(file);

        uploadedModel.setAttribute("visible", false);
        uploadedModel.removeAttribute("gltf-model");

        uploadedModel.addEventListener("model-loaded", function onLoaded() {
          uploadedModel.removeEventListener("model-loaded", onLoaded);
          uploadedModel.setAttribute("visible", true);
          status.textContent = "3D model loaded on face anchor. If its size/position is wrong, adjust scale/position in the HTML.";
        });

        uploadedModel.addEventListener("model-error", function onError() {
          uploadedModel.removeEventListener("model-error", onError);
          status.textContent = "Model failed to load. Try a .glb file; .gltf files may need their textures and other files together.";
        });

        uploadedModel.setAttribute("gltf-model", currentObjectUrl);
        status.textContent = "Loading " + file.name + "...";
      });

      removeButton.addEventListener("click", removeImportedModel);

      const scene = document.querySelector("a-scene");
      scene.addEventListener("arReady", () => {
        status.textContent = "Face tracking ready. Tap a filter or import a .glb model.";
      });
      scene.addEventListener("arError", () => {
        status.textContent = "Camera/tracking error. Check camera permission and open this page over HTTPS.";
      });
    });
  </script>
</body>
</html>
