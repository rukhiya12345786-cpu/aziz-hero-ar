<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aziz Hero AR</title>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:Arial,sans-serif;
    }

    #video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    .controls{
      position:fixed;
      bottom:20px;
      left:0;
      width:100%;
      z-index:10;
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    button,label{
      background:white;
      color:black;
      border:0;
      border-radius:10px;
      padding:12px 15px;
      font-size:15px;
      font-weight:bold;
    }

    #file{
      display:none;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="controls">

  <button id="start">
    📷 Start Camera
  </button>

  <button id="switch">
    🔄 Front / Back
  </button>

  <label for="file">
    📦 Import 3D
  </label>

  <input
    id="file"
    type="file"
    accept=".glb,.gltf"
  >

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const startButton =
  document.getElementById("start");

const switchButton =
  document.getElementById("switch");

const fileInput =
  document.getElementById("file");


let stream = null;

let facingMode = "user";


// ==========================
// THREE.JS
// ==========================

const scene =
  new THREE.Scene();

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );

camera.position.z = 5;


const renderer =
  new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);


// ==========================
// LIGHT
// ==========================

const light =
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    3
  );

scene.add(light);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

directionalLight.position.set(
  2,3,5
);

scene.add(directionalLight);


// ==========================
// 3D MODEL
// ==========================

let model = null;

const loader =
  new GLTFLoader();


fileInput.addEventListener(
  "change",
  function(event){

    const file =
      event.target.files[0];

    if(!file){
      return;
    }

    const url =
      URL.createObjectURL(file);

    loader.load(
      url,

      function(gltf){

        if(model){
          scene.remove(model);
        }

        model =
          gltf.scene;

        model.position.set(
          0,
          0,
          0
        );

        model.scale.set(
          1,
          1,
          1
        );

        scene.add(model);

        URL.revokeObjectURL(url);

      },

      undefined,

      function(error){

        console.error(error);

        alert(
          "3D Model Load Error"
        );

      }
    );

  }
);


// ==========================
// CAMERA
// ==========================

async function startCamera(){

  try{

    if(stream){

      stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    }

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:facingMode
        },

        audio:false

      });

    video.srcObject =
      stream;

    await video.play();

  }

  catch(error){

    console.error(error);

    alert(
      "Camera Error: " +
      error.message
    );

  }

}


startButton.addEventListener(
  "click",
  startCamera
);


// ==========================
// FRONT / BACK
// ==========================

switchButton.addEventListener(
  "click",
  async function(){

    facingMode =
      facingMode === "user"
      ? "environment"
      : "user";

    await startCamera();

  }
);


// ==========================
// ANIMATION
// ==========================

function animate(){

  requestAnimationFrame(
    animate
  );

  if(model){

    model.rotation.y += 0.005;

  }

  renderer.render(
    scene,
    camera
  );

}

animate();


// ==========================
// RESIZE
// ==========================

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
