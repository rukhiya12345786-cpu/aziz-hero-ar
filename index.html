
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

#container video,
#container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.topbar {
  position: fixed;
  z-index: 20;
  top: 10px;
  left: 10px;
  right: 10px;
  min-height: 48px;
  padding: 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(0,0,0,.78);
  border: 1px solid #333;
  border-radius: 12px;
}

.brand {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
}

#status {
  font-size: 10px;
  color: #00ff9d;
}

.panel {
  position: fixed;
  z-index: 20;
  left: 10px;
  right: 10px;
  bottom: 10px;
  max-height: 52vh;
  overflow-y: auto;
  padding: 12px;
  background: rgba(8,8,8,.92);
  border: 1px solid #383838;
  border-radius: 14px;
}

.section-title {
  margin: 12px 0 8px;
  color: #00ff9d;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 7px;
}

button {
  min-height: 39px;
  padding: 8px 4px;
  color: #fff;
  background: #1a1a1a;
  border: 1px solid #454545;
  border-radius: 8px;
  font-size: 10px;
  font-weight: bold;
}

button.primary {
  background: #006d49;
  border-color: #00ff9d;
}

button.danger {
  background: #741d2a;
  border-color: #a93b49;
}

button:active {
  opacity: .7;
}

.slider-box {
  padding: 12px;
  margin-top: 8px;
  background: #171717;
  border-radius: 9px;
}

.slider-heading {
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
  font-size: 12px;
}

input[type="range"] {
  width: 100%;
  accent-color: #00ff9d;
}

input[type="file"] {
  display: none;
}

#message {
  margin-top: 10px;
  font-size: 11px;
  color: #00ff9d;
}

#modelInfo {
  margin-top: 7px;
  color: #aaa;
  font-size: 11px;
}

.hidden {
  display: none !important;
}

@media (orientation: landscape) {
  .panel {
    left: auto;
    width: 310px;
    max-height: 78vh;
  }

  .topbar {
    right: 330px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<div class="topbar">
  <div class="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">CAMERA STOPPED</div>
  <button id="togglePanelBtn">HIDE ALL</button>
</div>

<div class="panel" id="mainPanel">

  <div class="section-title">CAMERA</div>
  <div class="button-grid">
    <button class="primary" id="startBtn">START CAMERA</button>
    <button id="switchBtn">SWITCH CAMERA</button>
    <button class="danger" id="stopBtn">STOP CAMERA</button>
    <button id="trackingBtn">TRACKING ON</button>
    <button id="fullscreenBtn">FULL SCREEN</button>
    <button id="resetBtn">RESET</button>
  </div>

  <div class="section-title">IMPORT CONTENT</div>
  <div class="button-grid">
    <button id="import3DBtn">IMPORT 3D</button>
    <button id="importImageBtn">IMPORT IMAGE</button>
    <button id="importVideoBtn">IMPORT VIDEO</button>
    <button class="danger" id="removeModelBtn">REMOVE MODEL</button>
    <button id="moveBtn">MOVE</button>
    <button id="rotateBtn">ROTATE</button>
    <button id="scaleBtn">SCALE GIZMO</button>
    <button id="hideGizmoBtn">HIDE GIZMO</button>
  </div>

  <input id="modelInput" type="file" accept=".glb,.gltf,.obj,.fbx">
  <input id="imageInput" type="file" accept="image/*">
  <input id="videoInput" type="file" accept="video/*">

  <div class="section-title">MODEL SIZE</div>
  <div class="slider-box">
    <div class="slider-heading">
      <span>SIZE</span>
      <span id="sizeValue">1.00x</span>
    </div>
    <input
      id="sizeSlider"
      type="range"
      min="0.01"
      max="20"
      step="0.01"
      value="1">
  </div>

  <div class="section-title">LIVE FACE CUTOUTS</div>
  <div class="button-grid">
    <button id="leftEyeBtn">LEFT EYE</button>
    <button id="rightEyeBtn">RIGHT EYE</button>
    <button id="mouthBtn">MOUTH</button>
    <button id="startCutoutsBtn">START CUTOUTS</button>
    <button id="stopCutoutsBtn">STOP CUTOUTS</button>
    <button id="hideCutoutsBtn">HIDE CUTOUTS</button>
  </div>

  <div id="modelInfo">No imported content</div>
  <div id="message">Ready to start</div>

</div>

  
<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-face-three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

const $ = id => document.getElementById(id);

let mindarThree = null;
let anchor = null;
let transformControls = null;
let importedContent = null;

let cameraStarted = false;
let trackingEnabled = true;
let gizmoVisible = true;
let baseScale = 1;

let currentVideo = null;
let currentObjectURL = null;

const container = $("container");

function message(text) {
  $("message").textContent = text;
}

function status(text) {
  $("status").textContent = text;
}

function disposeObject(object) {
  if (!object) return;

  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        Object.values(material).forEach(value => {
          if (value && value.isTexture) value.dispose();
        });

        material.dispose();
      });
    }
  });
}

function removeImportedModel() {
  if (transformControls) {
    transformControls.detach();
  }

  if (importedContent && anchor) {
    anchor.group.remove(importedContent);
    disposeObject(importedContent);
  }

  importedContent = null;

  if (currentVideo) {
    currentVideo.pause();
    currentVideo.removeAttribute("src");
    currentVideo.load();
    currentVideo = null;
  }

  if (currentObjectURL) {
    URL.revokeObjectURL(currentObjectURL);
    currentObjectURL = null;
  }

  $("modelInfo").textContent = "No imported content";
  $("sizeSlider").value = "1";
  $("sizeValue").textContent = "1.00x";

  message("Imported content removed.");
}

function fitModelToFace(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const largest = Math.max(size.x, size.y, size.z);

  if (largest > 0) {
    const factor = 0.3 / largest;
    object.scale.setScalar(factor);
  }

  object.position.sub(center.multiplyScalar(object.scale.x));

  baseScale = object.scale.x;

  $("sizeSlider").value = "1";
  $("sizeValue").textContent = "1.00x";
}

function attachObject(object, name) {
  if (!cameraStarted || !anchor) {
    disposeObject(object);
    message("Start camera before importing.");
    return;
  }

  removeImportedModel();

  importedContent = object;
  fitModelToFace(object);

  anchor.group.add(object);

  if (transformControls) {
    transformControls.attach(object);
  }

  $("modelInfo").textContent = name;
  message("Imported: " + name);
}

async function startCamera() {
  if (cameraStarted) return;

  try {
    message("Starting camera...");
    status("STARTING");

    mindarThree = new MindARThree({
      container: container,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    anchor = mindarThree.addAnchor(1);

    transformControls = new TransformControls(
      camera,
      renderer.domElement
    );

    scene.add(transformControls);

    transformControls.addEventListener(
      "dragging-changed",
      event => {
        if (event.value) {
          trackingEnabled = false;
        } else {
          trackingEnabled = true;
        }
      }
    );

    await mindarThree.start();

    cameraStarted = true;

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    status("CAMERA ACTIVE");
    message("Camera started.");
  } catch (error) {
    console.error("Camera error:", error);

    status("CAMERA ERROR");
    message("Camera failed. Check browser permissions.");

    try {
      mindarThree?.stop();
    } catch (stopError) {
      console.warn(stopError);
    }

    mindarThree = null;
    anchor = null;
    transformControls = null;
    cameraStarted = false;
  }
}

async function stopCamera() {
  removeImportedModel();

  if (mindarThree) {
    try {
      mindarThree.stop();
    } catch (error) {
      console.warn(error);
    }
  }

  mindarThree = null;
  anchor = null;
  transformControls = null;
  cameraStarted = false;

  container.innerHTML = "";

  status("CAMERA STOPPED");
  message("Camera stopped.");
}

async function importModel(file) {
  if (!file) return;

  const extension = file.name.split(".").pop().toLowerCase();

  if (!["glb", "gltf", "obj", "fbx"].includes(extension)) {
    message("Unsupported 3D file.");
    return;
  }

  const url = URL.createObjectURL(file);
  currentObjectURL = url;

  try {
    let object;

    if (extension === "glb" || extension === "gltf") {
      const loader = new GLTFLoader();
      const result = await loader.loadAsync(url);
      object = result.scene;
    } else if (extension === "obj") {
      const loader = new OBJLoader();
      object = await loader.loadAsync(url);
    } else {
      const loader = new FBXLoader();
      object = await loader.loadAsync(url);
    }

    if (currentObjectURL !== url) {
      disposeObject(object);
      return;
    }

    attachObject(object, file.name);
  } catch (error) {
    console.error("Model import error:", error);

    if (currentObjectURL === url) {
      URL.revokeObjectURL(url);
      currentObjectURL = null;
    }

    message("Model import failed.");
  }
}

async function importImage(file) {
  if (!file) return;

  const url = URL.createObjectURL(file);

  try {
    const texture = await new THREE.TextureLoader().loadAsync(url);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.35),
      material
    );

    if (!cameraStarted || !anchor) {
      disposeObject(plane);
      URL.revokeObjectURL(url);
      message("Start camera before importing.");
      return;
    }

    currentObjectURL = url;
    attachObject(plane, file.name);
  } catch (error) {
    console.error(error);
    URL.revokeObjectURL(url);
    message("Image import failed.");
  }
}

async function importVideo(file) {
  if (!file) return;

  const url = URL.createObjectURL(file);

  try {
    const video = document.createElement("video");

    video.src = url;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;

    await video.play();

    const texture = new THREE.VideoTexture(video);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.35),
      material
    );

    if (!cameraStarted || !anchor) {
      video.pause();
      texture.dispose();
      disposeObject(plane);
      URL.revokeObjectURL(url);
      message("Start camera before importing.");
      return;
    }

    currentVideo = video;
    currentObjectURL = url;

    attachObject(plane, file.name);
  } catch (error) {
    console.error(error);
    URL.revokeObjectURL(url);
    message("Video import failed.");
  }
}

$("startBtn").addEventListener("click", startCamera);
$("stopBtn").addEventListener("click", stopCamera);

$("switchBtn").addEventListener("click", () => {
  message("Camera switching is not implemented in this version.");
});

$("trackingBtn").addEventListener("click", () => {
  trackingEnabled = !trackingEnabled;

  $("trackingBtn").textContent =
    trackingEnabled ? "TRACKING ON" : "TRACKING OFF";

  message(
    trackingEnabled
      ? "Tracking display enabled."
      : "Tracking display disabled."
  );
});

$("import3DBtn").addEventListener("click", () => {
  $("modelInput").click();
});

$("importImageBtn").addEventListener("click", () => {
  $("imageInput").click();
});

$("importVideoBtn").addEventListener("click", () => {
  $("videoInput").click();
});

$("modelInput").addEventListener("change", event => {
  importModel(event.target.files[0]);
  event.target.value = "";
});

$("imageInput").addEventListener("change", event => {
  importImage(event.target.files[0]);
  event.target.value = "";
});

$("videoInput").addEventListener("change", event => {
  importVideo(event.target.files[0]);
  event.target.value = "";
});

$("removeModelBtn").addEventListener(
  "click",
  removeImportedModel
);

$("sizeSlider").addEventListener("input", event => {
  if (!importedContent) return;

  const multiplier = Number(event.target.value);

  importedContent.scale.setScalar(
    baseScale * multiplier
  );

  $("sizeValue").textContent =
    multiplier.toFixed(2) + "x";
});

$("moveBtn").addEventListener("click", () => {
  if (!transformControls || !importedContent) return;

  transformControls.setMode("translate");
  transformControls.enabled = true;
  transformControls.visible = true;
  gizmoVisible = true;
});

$("rotateBtn").addEventListener("click", () => {
  if (!transformControls || !importedContent) return;

  transformControls.setMode("rotate");
  transformControls.enabled = true;
  transformControls.visible = true;
  gizmoVisible = true;
});

$("scaleBtn").addEventListener("click", () => {
  if (!transformControls || !importedContent) return;

  transformControls.setMode("scale");
  transformControls.enabled = true;
  transformControls.visible = true;
  gizmoVisible = true;
});

$("hideGizmoBtn").addEventListener("click", () => {
  if (!transformControls) return;

  gizmoVisible = !gizmoVisible;

  transformControls.visible = gizmoVisible;
  transformControls.enabled = gizmoVisible;

  $("hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

$("resetBtn").addEventListener("click", () => {
  if (!importedContent) return;

  importedContent.position.set(0, 0, 0);
  importedContent.rotation.set(0, 0, 0);
  importedContent.scale.setScalar(baseScale);

  $("sizeSlider").value = "1";
  $("sizeValue").textContent = "1.00x";

  message("Model position reset.");
});

$("togglePanelBtn").addEventListener("click", () => {
  const panel = $("mainPanel");

  panel.classList.toggle("hidden");

  $("togglePanelBtn").textContent =
    panel.classList.contains("hidden")
      ? "SHOW ALL"
      : "HIDE ALL";
});

$("fullscreenBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    message("Fullscreen unavailable.");
  }
});

// Live eye and mouth cutout processing is not connected yet.
// These buttons are placeholders for the next development stage.

$("leftEyeBtn").addEventListener("click", () => {
  message("Left eye cutout is not implemented yet.");
});

$("rightEyeBtn").addEventListener("click", () => {
  message("Right eye cutout is not implemented yet.");
});

$("mouthBtn").addEventListener("click", () => {
  message("Mouth cutout is not implemented yet.");
});

$("startCutoutsBtn").addEventListener("click", () => {
  message("Live cutout engine is not implemented yet.");
});

$("stopCutoutsBtn").addEventListener("click", () => {
  message("No live cutouts are running.");
});

$("hideCutoutsBtn").addEventListener("click", () => {
  message("No live cutouts are displayed.");
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
  } catch (error) {}
});

message("Ready. Start the camera.");
</script>
</body>
</html>
