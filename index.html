<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Check</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px;
}

button{
    padding:15px 25px;
    font-size:18px;
    margin-top:20px;
}
</style>
</head>

<body>

<h2 id="title">CAMERA TEST</h2>

<p id="status">
JavaScript चल रहा है ✓
</p>

<button onclick="openCamera()">
OPEN CAMERA
</button>

<video
    id="video"
    autoplay
    playsinline
    muted
    style="
    display:none;
    width:100%;
    margin-top:20px;
    ">
</video>

<script>

async function openCamera(){

    const status =
    document.getElementById("status");

    const video =
    document.getElementById("video");

    try{

        status.innerText =
        "Camera permission मांग रहा है...";

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        video.srcObject =
        stream;

        video.style.display =
        "block";

        status.innerText =
        "CAMERA WORKING ✓";

    }catch(error){

        status.innerText =
        "CAMERA ERROR";

        alert(
            "ERROR:\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

        console.log(error);

    }

}

</script>

</body>
</html>
