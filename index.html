<!DOCTYPE html>
<html lang="en"><script type="module">
    import {
        FaceLandmarker,
        FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Aziz Hero AR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #camera {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            background: #000;
        }

        #startButton {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            z-index: 10;

            border: 0;
            border-radius: 12px;
            padding: 15px 30px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: bold;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            padding: 10px 16px;
            border-radius: 10px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <video id="camera"
           autoplay
           muted
           playsinline></video>

    <div id="status">
        Camera Ready
    </div>

    <button id="startButton">
        START CAMERA
    </button>

    <script>
        const video = document.getElementById("camera");
        const button = document.getElementById("startButton");
        const status = document.getElementById("status");

        async function startCamera() {

            try {

                status.textContent = "Requesting Camera...";

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user"
                        },
                        audio: false
                    });

                video.srcObject = stream;

                await video.play();

                status.textContent = "Camera Working ✓";

                button.style.display = "none";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Camera Error: " + error.name;

            }
        }

        button.addEventListener("click", startCamera);
    </script>

</body>
</html>
