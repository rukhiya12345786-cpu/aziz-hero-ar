<!DOCTYPE html>
<html>
<body style="margin:0;background:#000;color:white;text-align:center">

<h2>CAMERA TEST</h2>

<button onclick="camera()">OPEN CAMERA</button>

<video id="v"
autoplay
playsinline
muted
style="width:100%;margin-top:20px">
</video>

<script>
async function camera(){

try{

let s=await navigator.mediaDevices.getUserMedia({
video:true,
audio:false
});

document.getElementById("v").srcObject=s;

}catch(e){

alert(e.name+"\n"+e.message);

}

}
</script>

</body>
</html>
