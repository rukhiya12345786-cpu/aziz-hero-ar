<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #111;
  font-family: Arial, sans-serif;
}
#container {
  position: fixed; inset: 0; overflow: hidden;
  background: #111;
}
#cameraVideo {
  position: absolute; inset: 0; width: 100%;
  height: 100%; object-fit: cover; z-index: 1;
}
#container canvas {
  position: absolute; inset: 0; width: 100%;
  height: 100%; z-index: 2;
}
#topbar {
  position: fixed; top: 10px; left: 10px; right: 10px;
  z-index: 20; display: flex; justify-content: space-between;
  gap: 8px; pointer-events: none;
}
#brand, #status {
  color: white; background: #000b; padding: 10px;
  border-radius: 9px; font-size: 12px; font-weight: bold;
}
button, select {
  background: #202020ee; color: white;
  border: 1px solid #555; border-radius: 9px;
  padding: 10px; font-size: 11px; font-weight: bold;
}
button.active { background: #075fc5; }
button:disabled { opacity: .45; }
#message {
  position: fixed; z-index: 25; bottom: 190px;
  left: 10px; right: 10px; padding: 9px;
  background: #0009; color: white; border-radius: 8px;
  text-align: center; font-size: 12px; pointer-events: none;
}
#controls {
  position: fixed; left: 8px; right: 8px; bottom: 8px;
  z-index: 30; display: flex; justify-content: center;
  flex-wrap: wrap; gap: 7px;
}
#transformPanel {
  position: fixed; top: 62px; right: 10px; z-index: 35;
  display: flex; flex-direction: column; gap: 6px; width: 125px;
}
#transformPanel button { width: 100%; }
#partsPanel {
  position: fixed; z-index: 36; left: 10px; top: 62px;
  width: 125px; display: flex; flex-direction: column; gap: 6px;
}
#partsPanel button { width: 100%; padding: 9px 5px; }
#sizePanel {
  position: fixed; left: 10px; right: 10px; bottom: 112px;
  z-index: 35; padding: 9px 14px; border-radius: 10px;
  background: #000d; color: white; font-size: 13px;
}
#sizePanel label { display: block; margin-bottom: 7px; font-weight: bold; }
#sizeSlider { width: 100%; height: 30px; accent-color: #087cff; }
#sizeValue { display: block; margin-top: 3px; text-align: center; }
#facePanel {
  position: fixed; z-index: 37; top: 62px; left: 145px;
  display: flex; flex-direction: column; gap: 5px;
  width: 130px; padding: 7px; background: #000b;
  border-radius: 9px; color: white; font-size: 11px;
}
#facePanel select { width: 100%; }
#facePanel button { width: 100%; padding: 8px 4px; }
#toggleAllBtn {
  position: fixed; z-index: 100; top: 10px; left: 50%;
  transform: translateX(-50%); background: #075fc5;
  border: 1px solid white; padding: 10px 15px;
}
.hidden { display: none !important; }
#fileInput, #imageInput, #videoInput { display: none; }

@media (orientation: landscape) {
  #controls { left: auto; right: 10px; bottom: 8px; width: 190px; }
  #controls button { flex: 1 1 75px; }
  #message { bottom: 10px; left: 10px; right: 210px; }
  #sizePanel { left: 210px; right: 210px; bottom: 8px; }
  #facePanel { top: 62px; left: 145px; }
}
</style>
</head>

<body>
<div id="container">
  <video id="cameraVideo" autoplay muted playsinline></video>
</div>

<button id="toggleAllBtn">HIDE ALL</button>

<div id="topbar" class="ui-panel">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="message" class="ui-panel">
  Press START CAMERA and allow camera permission.
</div>

<div id="facePanel" class="ui-panel">
  <strong>FACE SETTINGS</strong>
  <select id="faceMode">
    <option value="separate">SEPARATE MODE</option>
    <option value="same">SAME MODEL FOR ALL</option>
  </select>
  <select id="personSelect">
    <option value="0">PERSON 1</option>
    <option value="1">PERSON 2</option>
    <option value="2">PERSON 3</option>
    <option value="3">PERSON 4</option>
  </select>
  <button id="assignBtn">APPLY MODEL</button>
  <div id="faceCount">Faces: 0 / 4</div>
</div>

<div id="transformPanel" class="ui-panel">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
  <button id="scaleBtn">SCALE GIZMO</button>
  <button id="hideGizmoBtn">HIDE GIZMO</button>
</div>

<div id="partsPanel" class="ui-panel">
  <button id="selectMaskBtn" class="active">SELECT MODEL</button>
  <button id="leftEyeBtn">LEFT EYE</button>
  <button id="rightEyeBtn">RIGHT EYE</button>
  <button id="mouthBtn">MOUTH</button>
  <button id="partsToggleBtn">HIDE FACE PARTS</button>
</div>

<div id="sizePanel" class="ui-panel">
  <label for="sizeSlider">OBJECT SIZE</label>
  <input id="sizeSlider" type="range"
    min="0.01" max="10" step="0.01" value="1">
  <span id="sizeValue">100%</span>
</div>

<div id="controls" class="ui-panel">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="importBtn">IMPORT 3D</button>
  <button id="imageBtn">IMPORT IMAGE</button>
  <button id="videoBtn">IMPORT VIDEO</button>
  <button id="remove3DBtn">REMOVE 3D MODEL</button>
  <button id="disposeBtn">DISPOSE</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<input id="fileInput" type="file" accept=".glb,.gltf,.obj,.fbx">
<input id="imageInput" type="file" accept="image/*">
<input id="videoInput" type="file" accept="video/*">

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const container = document.querySelector("#container");
const video = document.querySelector("#cameraVideo");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");
const fileInput = document.querySelector("#fileInput");
const imageInput = document.querySelector("#imageInput");
const videoInput = document.querySelector("#videoInput");

let renderer, scene, camera, transformControls;
let faceLandmarker = null;
let cameraStream = null;
let running = false;
let starting = false;
let facingMode = "user";
let animationId = 0;
let lastVideoTime = -1;
let currentMode = "translate";
let gizmoVisible = true;
let allVisible = true;
let partsVisible = true;
let importedContent = null;
let activeVideo = null;
let activeObjectURL = null;
let currentSizeObject = null;
let baseScale = new THREE.Vector3(1, 1, 1);
let selectedObject = null;
let selectedPerson = 0;
let faceSlots = [];
let faceParts = {};

const loaderGLTF = new GLTFLoader();

function setStatus(text) {
  statusBox.textContent = text;
}
function setMessage(text) {
  messageBox.textContent = text;
}

function makeSlot(index) {
  const group = new THREE.Group();
  group.name = "PERSON_" + (index + 1);
  group.visible = false;
  scene.add(group);

  return {
    group,
    model: null,
    center: null,
    visible: false,
    lastSeen: 0,
    scale: 1,
    imported: false
  };
}

async function initFaceLandmarker() {
  if (faceLandmarker) return faceLandmarker;

  setMessage("Loading face tracking model...");
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 4,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true
  });

  return faceLandmarker;
}

function setupThree() {
  scene = new THREE.Scene();

  camera = new THREE.OrthographicCamera(
    -1, 1, 1, -1, 0.01, 100
  );
  camera.position.z = 10;

  renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.style.background = "transparent";
  container.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(0, 2, 5);
  scene.add(light);

  faceSlots = [];
  for (let i = 0; i < 4; i++) {
    faceSlots.push(makeSlot(i));
  }

  transformControls = new TransformControls(camera, renderer.domElement);
  transformControls.setMode(currentMode);
  transformControls.setSize(0.8);
  transformControls.enabled = false;
  transformControls.visible = false;
  scene.add(transformControls);

  resizeScene();
}

function resizeScene() {
  if (!renderer || !camera) return;

  const width = container.clientWidth;
  const height = container.clientHeight;
  const aspect = width / Math.max(1, height);

  camera.left = -aspect;
  camera.right = aspect;
  camera.top = 1;
  camera.bottom = -1;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

window.addEventListener("resize", resizeScene);

function screenPosition(point) {
  const aspect = container.clientWidth / Math.max(1, container.clientHeight);
  return {
    x: (0.5 - point.x) * 2 * aspect,
    y: (0.5 - point.y) * 2
  };
}

function faceMetrics(points) {
  const left = points[234];
  const right = points[454];
  const top = points[10];
  const bottom = points[152];
  const nose = points[1];
  const eyeLeft = points[33];
  const eyeRight = points[263];

  const width = Math.hypot(right.x - left.x, right.y - left.y);
  const height = Math.hypot(bottom.x - top.x, bottom.y - top.y);
  const center = {
    x: (left.x + right.x) / 2,
    y: (top.y + bottom.y) / 2
  };

  const roll = Math.atan2(
    eyeRight.y - eyeLeft.y,
    eyeRight.x - eyeLeft.x
  );

  const yaw = THREE.MathUtils.clamp(
    (nose.x - center.x) / Math.max(width * 0.22, 0.001),
    -1, 1
  );

  const pitch = THREE.MathUtils.clamp(
    (nose.y - center.y) / Math.max(height * 0.25, 0.001),
    -1, 1
  );

  return { center, width, height, roll, yaw, pitch };
}

function assignFaces(faceLandmarks) {
  const now = performance.now();
  const available = faceLandmarks.map((points, index) => ({
    points,
    index,
    metrics: faceMetrics(points)
  }));

  faceSlots.forEach(slot => {
    slot.visible = false;
    slot.group.visible = false;
  });

  const unused = new Set(available.map((_, i) => i));

  // Match detected faces to their previous screen positions.
  faceSlots.forEach(slot => {
    if (!slot.center || now - slot.lastSeen > 1200) return;

    let best = -1;
    let bestDistance = Infinity;

    for (const itemIndex of unused) {
      const item = available[itemIndex];
      const dx = item.metrics.center.x - slot.center.x;
      const dy = item.metrics.center.y - slot.center.y;
      const distance = dx * dx + dy * dy;

      if (distance < bestDistance) {
        bestDistance = distance;
        best = itemIndex;
      }
    }

    if (best >= 0 && bestDistance < 0.09) {
      updateSlot(slot, available[best].metrics, now);
      unused.delete(best);
    }
  });

  // Put new faces into empty slots.
  for (const itemIndex of unused) {
    const slot = faceSlots.find(s => !s.visible);
    if (!slot) break;
    updateSlot(slot, available[itemIndex].metrics, now);
  }

  const count = faceSlots.filter(slot => slot.visible).length;
  document.querySelector("#faceCount").textContent =
    "Faces: " + count + " / 4";
}

function updateSlot(slot, metrics, now) {
  slot.visible = true;
  slot.group.visible = true;
  slot.center = metrics.center;
  slot.lastSeen = now;

  const position = screenPosition(metrics.center);
  const faceWidth = metrics.width * 2 *
    (container.clientWidth / Math.max(1, container.clientHeight));

  slot.group.position.set(position.x, position.y, 0);
  slot.group.rotation.set(
    metrics.pitch * 0.22,
    metrics.yaw * 0.45,
    -metrics.roll
  );

  const scale = Math.max(0.08, faceWidth * 1.25) * slot.scale;
  slot.group.scale.setScalar(scale);
}

async function loadDefaultModel() {
  const url =
    "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";
  const gltf = await loaderGLTF.loadAsync(url);
  return gltf.scene;
}

function cloneModel(source) {
  const clone = source.clone(true);
  clone.traverse(child => {
    if (child.isMesh) {
      if (child.material) {
        child.material = Array.isArray(child.material)
          ? child.material.map(m => m.clone())
          : child.material.clone();
      }
    }
  });
  return clone;
}

async function prepareDefaultModels() {
  setMessage("Loading default 3D face model...");
  const source = await loadDefaultModel();

  faceSlots.forEach(slot => {
    if (slot.model) slot.group.remove(slot.model);
    slot.model = cloneModel(source);
    slot.model.scale.setScalar(1);
    slot.group.add(slot.model);
  });

  disposeObject(source);
}

async function startCamera() {
  if (starting || running) return;

  starting = true;
  document.querySelector("#startBtn").disabled = true;
  setStatus("Starting...");
  setMessage("Opening camera...");

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    if (!renderer) setupThree();

    await initFaceLandmarker();
    await prepareDefaultModels();

    running = true;
    lastVideoTime = -1;

    setStatus("Camera running");
    setMessage("Tracking up to four faces.");

    animate();
  } catch (error) {
    console.error(error);
    setStatus("Start error");
    setMessage(error.message || "Camera could not start.");
    await stopCamera();
  } finally {
    starting = false;
    document.querySelector("#startBtn").disabled = false;
  }
}

function animate() {
  if (!running) return;

  animationId = requestAnimationFrame(animate);

  if (video.readyState >= 2 &&
      video.currentTime !== lastVideoTime &&
      faceLandmarker) {
    lastVideoTime = video.currentTime;

    try {
      const result = faceLandmarker.detectForVideo(
        video, performance.now()
      );
      assignFaces(result.faceLandmarks || []);
      updateBlendshapes(result);
    } catch (error) {
      console.warn("Face detection:", error);
    }
  }

  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

function updateBlendshapes(result) {
  if (!result.faceBlendshapes) return;

  result.faceBlendshapes.forEach((blendshape, faceIndex) => {
    const slot = faceSlots[faceIndex];
    if (!slot || !slot.model) return;

    const values = new Map();
    blendshape.categories.forEach(item => {
      values.set(item.categoryName, item.score);
    });

    slot.model.traverse(object => {
      if (!object.isMesh || !object.morphTargetDictionary ||
          !object.morphTargetInfluences) return;

      for (const [name, value] of values) {
        const index = object.morphTargetDictionary[name];
        if (index !== undefined) {
          object.morphTargetInfluences[index] = value;
        }
      }
    });
  });
}
  function getSelectedSlot() {
  return faceSlots[selectedPerson];
}

function attachGizmo(object) {
  if (!transformControls || !object) return;

  selectedObject = object;
  transformControls.attach(object);
  transformControls.enabled = gizmoVisible;
  transformControls.visible = gizmoVisible;
  setSizeTarget(object);
}

function setSizeTarget(object) {
  currentSizeObject = object;
  if (!object) return;

  baseScale.copy(object.scale);
  document.querySelector("#sizeSlider").value = 1;
  document.querySelector("#sizeValue").textContent = "100%";
}

document.querySelector("#sizeSlider").addEventListener("input", event => {
  if (!currentSizeObject) return;

  const value = Number(event.target.value);
  currentSizeObject.scale.set(
    baseScale.x * value,
    baseScale.y * value,
    baseScale.z * value
  );

  document.querySelector("#sizeValue").textContent =
    Math.round(value * 100) + "%";
});

document.querySelector("#personSelect").addEventListener("change", event => {
  selectedPerson = Number(event.target.value);
  const slot = getSelectedSlot();

  if (slot?.model) {
    attachGizmo(slot.model);
    setMessage("Person " + (selectedPerson + 1) + " selected.");
  }
});

document.querySelector("#assignBtn").addEventListener("click", () => {
  const slot = getSelectedSlot();

  if (!slot?.model) {
    setMessage("Import a model first.");
    return;
  }

  attachGizmo(slot.model);
  setMessage("Model selected for Person " + (selectedPerson + 1) + ".");
});

function setActiveMode(id) {
  ["moveBtn", "rotateBtn", "scaleBtn"].forEach(buttonId => {
    document.getElementById(buttonId).classList.toggle(
      "active", buttonId === id
    );
  });
}

document.querySelector("#moveBtn").addEventListener("click", () => {
  currentMode = "translate";
  transformControls?.setMode("translate");
  setActiveMode("moveBtn");
});

document.querySelector("#rotateBtn").addEventListener("click", () => {
  currentMode = "rotate";
  transformControls?.setMode("rotate");
  setActiveMode("rotateBtn");
});

document.querySelector("#scaleBtn").addEventListener("click", () => {
  currentMode = "scale";
  transformControls?.setMode("scale");
  setActiveMode("scaleBtn");
});

document.querySelector("#hideGizmoBtn").addEventListener("click", () => {
  gizmoVisible = !gizmoVisible;

  if (transformControls) {
    transformControls.enabled = gizmoVisible;
    transformControls.visible = gizmoVisible && !!selectedObject;
  }

  document.querySelector("#hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

document.querySelector("#selectMaskBtn").addEventListener("click", () => {
  const slot = getSelectedSlot();

  if (slot?.model) {
    attachGizmo(slot.model);
    setMessage("Person " + (selectedPerson + 1) + " model selected.");
  } else {
    setMessage("No model available for this person.");
  }

  document.querySelectorAll(
    "#partsPanel button"
  ).forEach(button => button.classList.remove("active"));

  document.querySelector("#selectMaskBtn").classList.add("active");
});

function selectFacePart(name, buttonId) {
  setMessage(
    name + " face-part editing is not available in this four-face tracking build."
  );

  document.querySelectorAll(
    "#partsPanel button"
  ).forEach(button => button.classList.remove("active"));

  document.getElementById(buttonId).classList.add("active");
}

document.querySelector("#leftEyeBtn").addEventListener("click", () => {
  selectFacePart("LEFT EYE", "leftEyeBtn");
});

document.querySelector("#rightEyeBtn").addEventListener("click", () => {
  selectFacePart("RIGHT EYE", "rightEyeBtn");
});

document.querySelector("#mouthBtn").addEventListener("click", () => {
  selectFacePart("MOUTH", "mouthBtn");
});

document.querySelector("#partsToggleBtn").addEventListener("click", () => {
  partsVisible = !partsVisible;

  document.querySelector("#partsToggleBtn").textContent =
    partsVisible ? "HIDE FACE PARTS" : "SHOW FACE PARTS";

  setMessage(
    partsVisible
      ? "Face parts option enabled."
      : "Face parts option hidden."
  );
});

document.querySelector("#faceMode").addEventListener("change", event => {
  setMessage(
    event.target.value === "same"
      ? "Same model mode selected. Import a model to apply it to all four people."
      : "Separate model mode selected. Choose a person before importing."
  );
});

document.querySelector("#toggleAllBtn").addEventListener("click", () => {
  allVisible = !allVisible;

  document.querySelectorAll(".ui-panel").forEach(panel => {
    panel.classList.toggle("hidden", !allVisible);
  });

  document.querySelector("#toggleAllBtn").textContent =
    allVisible ? "HIDE ALL" : "SHOW ALL";
});

document.querySelector("#startBtn").addEventListener("click", startCamera);

document.querySelector("#stopBtn").addEventListener("click", stopCamera);

document.querySelector("#switchBtn").addEventListener("click", async () => {
  if (!running) {
    setMessage("Start the camera first.");
    return;
  }

  facingMode = facingMode === "user" ? "environment" : "user";
  const oldStream = cameraStream;

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    oldStream?.getTracks().forEach(track => track.stop());
    lastVideoTime = -1;

    setMessage("Camera switched.");
  } catch (error) {
    facingMode = facingMode === "user" ? "environment" : "user";
    setMessage("Camera switch failed: " + error.message);
  }
});

document.querySelector("#importBtn").addEventListener("click", () => {
  fileInput.click();
});

document.querySelector("#imageBtn").addEventListener("click", () => {
  imageInput.click();
});

document.querySelector("#videoBtn").addEventListener("click", () => {
  videoInput.click();
});

function disposeObject(object) {
  if (!object) return;

  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material : [child.material];

      materials.forEach(material => {
        for (const key in material) {
          const value = material[key];
          if (value?.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });
}

function clearImportedContent() {
  if (transformControls) transformControls.detach();

  if (importedContent) {
    importedContent.removeFromParent();
    disposeObject(importedContent);
    importedContent = null;
  }

  if (activeVideo) {
    activeVideo.pause();
    activeVideo.removeAttribute("src");
    activeVideo.load();
    activeVideo = null;
  }

  if (activeObjectURL) {
    URL.revokeObjectURL(activeObjectURL);
    activeObjectURL = null;
  }

  currentSizeObject = null;
}

async function loadModelFile(file) {
  if (!running || !scene) {
    setMessage("Start the camera before importing a model.");
    return;
  }

  const extension = file.name.split(".").pop().toLowerCase();
  const objectURL = URL.createObjectURL(file);

  setMessage("Loading 3D model...");

  try {
    let model;

    if (extension === "glb" || extension === "gltf") {
      model = (await new GLTFLoader().loadAsync(objectURL)).scene;
    } else if (extension === "obj") {
      model = await new OBJLoader().loadAsync(objectURL);
    } else if (extension === "fbx") {
      model = await new FBXLoader().loadAsync(objectURL);
    } else {
      throw new Error("Unsupported model format.");
    }

    model.position.set(0, 0, 0);
    model.rotation.set(0, 0, 0);
    model.scale.setScalar(1);

    const mode = document.querySelector("#faceMode").value;

    if (mode === "same") {
      faceSlots.forEach((slot, index) => {
        if (slot.model) {
          slot.model.removeFromParent();
          disposeObject(slot.model);
        }

        slot.model = cloneModel(model);
        slot.model.scale.setScalar(1);
        slot.group.add(slot.model);
        slot.imported = true;

        if (index === selectedPerson) {
          attachGizmo(slot.model);
        }
      });

      setMessage("Same model applied to all four person slots.");
    } else {
      const slot = getSelectedSlot();

      if (slot.model) {
        slot.model.removeFromParent();
        disposeObject(slot.model);
      }

      slot.model = cloneModel(model);
      slot.model.scale.setScalar(1);
      slot.group.add(slot.model);
      slot.imported = true;

      attachGizmo(slot.model);

      setMessage("Model assigned to Person " + (selectedPerson + 1) + ".");
    }

    disposeObject(model);
    URL.revokeObjectURL(objectURL);
  } catch (error) {
    URL.revokeObjectURL(objectURL);
    console.error(error);
    setMessage("3D import error: " + error.message);
  }
}

fileInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (file) await loadModelFile(file);
  fileInput.value = "";
});

function createMediaPlane(texture, videoElement = null) {
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    })
  );

  const slot = getSelectedSlot();

  if (!slot) {
    disposeObject(plane);
    return;
  }

  clearImportedContent();

  importedContent = plane;
  slot.group.add(plane);
  plane.position.set(0, 0, 0);
  plane.scale.setScalar(1);

  attachGizmo(plane);

  if (videoElement) activeVideo = videoElement;
}

imageInput.addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!running) {
    setMessage("Start the camera before importing an image.");
    imageInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);

  new THREE.TextureLoader().load(
    url,
    texture => {
      texture.colorSpace = THREE.SRGBColorSpace;
      createMediaPlane(texture);
      activeObjectURL = url;
      setMessage("Image imported for selected person.");
    },
    undefined,
    () => {
      URL.revokeObjectURL(url);
      setMessage("Image import failed.");
    }
  );

  imageInput.value = "";
});

videoInput.addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!running) {
    setMessage("Start the camera before importing a video.");
    videoInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const mediaVideo = document.createElement("video");

  mediaVideo.src = url;
  mediaVideo.loop = true;
  mediaVideo.muted = true;
  mediaVideo.playsInline = true;
  mediaVideo.autoplay = true;

  mediaVideo.addEventListener("loadeddata", async () => {
    const texture = new THREE.VideoTexture(mediaVideo);
    texture.colorSpace = THREE.SRGBColorSpace;

    createMediaPlane(texture, mediaVideo);
    activeObjectURL = url;

    try {
      await mediaVideo.play();
      setMessage("Video imported for selected person.");
    } catch (error) {
      setMessage("Video imported. Tap to play.");
    }
  }, { once: true });

  mediaVideo.addEventListener("error", () => {
    URL.revokeObjectURL(url);
    setMessage("Video import failed.");
  }, { once: true });

  videoInput.value = "";
});

document.querySelector("#remove3DBtn").addEventListener("click", () => {
  const slot = getSelectedSlot();

  if (!slot?.model || !slot.imported) {
    setMessage("No imported 3D model for this person.");
    return;
  }

  slot.model.removeFromParent();
  disposeObject(slot.model);
  slot.model = null;
  slot.imported = false;

  if (transformControls) transformControls.detach();
  currentSizeObject = null;

  setMessage("Imported model removed from Person " + (selectedPerson + 1) + ".");
});

document.querySelector("#disposeBtn").addEventListener("click", () => {
  clearImportedContent();

  faceSlots.forEach(slot => {
    if (slot.imported && slot.model) {
      slot.model.removeFromParent();
      disposeObject(slot.model);
      slot.model = null;
      slot.imported = false;
    }
  });

  setMessage("Imported content disposed.");
});

async function stopCamera() {
  running = false;
  cancelAnimationFrame(animationId);

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.pause();
  video.srcObject = null;

  if (transformControls) {
    transformControls.detach();
    transformControls.dispose();
    transformControls = null;
  }

  if (renderer) {
    renderer.dispose();
    renderer.domElement.remove();
    renderer = null;
  }

  if (scene) {
    faceSlots.forEach(slot => {
      slot.group.removeFromParent();
    });
    scene.clear();
  }

  scene = null;
  camera = null;
  faceSlots = [];
  selectedObject = null;
  currentSizeObject = null;
  lastVideoTime = -1;

  setStatus("Camera stopped");
  setMessage("Press START CAMERA to begin.");
  document.querySelector("#faceCount").textContent = "Faces: 0 / 4";
}

document.querySelector("#fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
    resizeScene();
  } catch (error) {
    setMessage("Fullscreen is not available.");
  }
});

window.addEventListener("beforeunload", () => {
  cameraStream?.getTracks().forEach(track => track.stop());
});
</script>
</body>
</html>
