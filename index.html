<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Aziz Face AR</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
}

#camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
}

#status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 8px 14px;
    border-radius: 12px;

    background: rgba(0,0,0,.65);
    color: #fff;

    font-size: 14px;
    white-space: nowrap;
}

#topBar {
    position: absolute;
    top: 55px;
    left: 10px;
    right: 10px;

    z-index: 20;

    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    min-height: 44px;
    padding: 9px 13px;

    border: 0;
    border-radius: 12px;

    background: rgba(255,255,255,.92);
    color: #000;

    font-size: 14px;
    font-weight: 700;
}

button:active {
    transform: scale(.96);
}

#bottomBar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;

    z-index: 20;

    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

#controls {
    position: absolute;

    left: 10px;
    right: 10px;
    bottom: 70px;

    z-index: 25;

    max-height: 42vh;
    overflow-y: auto;

    padding: 14px;

    border-radius: 16px;

    background: rgba(0,0,0,.78);

    display: none;
}

.control {
    margin-bottom: 12px;
}

.control:last-child {
    margin-bottom: 0;
}

.controlHeader {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;

    font-size: 13px;
}

input[type="range"] {
    width: 100%;
    height: 32px;
}

#recordButton.recording {
    background: #ff3030;
    color: #fff;
}

#fileInput {
    display: none;
}
</style>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>

    <div id="status">
        Aziz AR Ready
    </div>


    <div id="topBar">

        <button id="cameraButton">
            Start Camera
        </button>

        <button id="switchCameraButton">
            Front Camera
        </button>

        <button id="modelButton">
            3D Controls
        </button>

    </div>


    <div id="controls">

        <div class="control">
            <div class="controlHeader">
                <span>Position X</span>
                <span id="posXValue">0</span>
            </div>
            <input
                id="posX"
                type="range"
                min="-2"
                max="2"
                step="0.01"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Position Y</span>
                <span id="posYValue">0</span>
            </div>
            <input
                id="posY"
                type="range"
                min="-2"
                max="2"
                step="0.01"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Position Z</span>
                <span id="posZValue">0</span>
            </div>
            <input
                id="posZ"
                type="range"
                min="-2"
                max="2"
                step="0.01"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Rotate X 360°</span>
                <span id="rotXValue">0°</span>
            </div>
            <input
                id="rotX"
                type="range"
                min="0"
                max="360"
                step="1"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Rotate Y 360°</span>
                <span id="rotYValue">0°</span>
            </div>
            <input
                id="rotY"
                type="range"
                min="0"
                max="360"
                step="1"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Rotate Z 360°</span>
                <span id="rotZValue">0°</span>
            </div>
            <input
                id="rotZ"
                type="range"
                min="0"
                max="360"
                step="1"
                value="0">
        </div>


        <div class="control">
            <div class="controlHeader">
                <span>Scale</span>
                <span id="scaleValue">1.00</span>
            </div>
            <input
                id="scale"
                type="range"
                min="0.1"
                max="3"
                step="0.01"
                value="1">
        </div>

    </div>


    <div id="bottomBar">

        <button id="photoButton">
            Photo
        </button>

        <button id="recordButton">
            Record Video
        </button>

        <button id="audioButton">
            Audio
        </button>

        <button id="resetButton">
            Reset 3D
        </button>

    </div>


    <input
        id="fileInput"
        type="file"
        accept="video/*,image/*">


</div>


<!-- APP JAVASCRIPT -->
<script
    type="module"
    src="./js/app.js?v=1">
</script>


<script>
/*
    BASIC HTML TEST

    अगर यह message दिखाई देता है,
    तो index.html सही तरीके से load हुआ है।
*/

console.log("AZIZ AR HTML LOADED");

const status =
    document.getElementById("status");

const controls =
    document.getElementById("controls");

const modelButton =
    document.getElementById("modelButton");


function setStatus(message) {

    console.log("[AZIZ AR]", message);

    if (status) {
        status.textContent = message;
    }
}


setStatus("HTML READY");


modelButton.addEventListener(
    "click",
    function () {

        if (
            controls.style.display === "block"
        ) {

            controls.style.display =
                "none";

        } else {

            controls.style.display =
                "block";

        }

    }
);


/*
    3D CONTROL VALUES

    अभी ये values UI में काम करेंगी।
    अगला app.js इन्हें वास्तविक
    3D model से connect करेगा।
*/

const controlsList = [
    ["posX", "posXValue"],
    ["posY", "posYValue"],
    ["posZ", "posZValue"],
    ["rotX", "rotXValue"],
    ["rotY", "rotYValue"],
    ["rotZ", "rotZValue"],
    ["scale", "scaleValue"]
];


controlsList.forEach(
    function(item) {

        const slider =
            document.getElementById(item[0]);

        const value =
            document.getElementById(item[1]);


        slider.addEventListener(
            "input",
            function() {

                let text =
                    slider.value;


                if (
                    item[0].startsWith("rot")
                ) {

                    text += "°";

                }


                value.textContent =
                    text;

            }
        );

    }
);


document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        function() {

            document.getElementById("posX").value = 0;
            document.getElementById("posY").value = 0;
            document.getElementById("posZ").value = 0;

            document.getElementById("rotX").value = 0;
            document.getElementById("rotY").value = 0;
            document.getElementById("rotZ").value = 0;

            document.getElementById("scale").value = 1;


            document
                .querySelectorAll("#controls input")
                .forEach(
                    function(slider) {
                        slider.dispatchEvent(
                            new Event("input")
                        );
                    }
                );

        }
    );

</script>

</body>
</html>
