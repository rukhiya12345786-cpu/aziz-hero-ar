<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
    z-index: 1;
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
}

#status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    max-width: 92%;
    padding: 8px 14px;

    border-radius: 20px;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;

    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#topButtons {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);

    width: 96%;
    max-width: 520px;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;

    z-index: 30;
}

button,
.fileButton {
    border: none;
    border-radius: 10px;

    padding: 10px 12px;

    background: rgba(20, 20, 20, 0.82);
    color: #fff;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

button:active,
.fileButton:active {
    transform: scale(0.97);
}

button:hover,
.fileButton:hover {
    background: rgba(50, 50, 50, 0.92);
}

.fileButton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

#modelFileInput {
    display: none;
}

#appControls {
    position: absolute;

    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);

    width: 94%;
    max-width: 520px;
    max-height: 48vh;

    padding: 12px;

    overflow-y: auto;

    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(8px);

    border-radius: 16px;

    z-index: 30;
}

.controlRow {
    margin-bottom: 10px;
}

.controlRow:last-child {
    margin-bottom: 0;
}

.controlLabel {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 4px;

    color: #fff;
    font-size: 12px;
}

.controlValue {
    opacity: 0.75;
    font-size: 11px;
}

input[type="range"] {
    width: 100%;
    height: 28px;
    margin: 0;

    accent-color: #ffffff;
}

#controlsButtons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

#showControlsButton {
    position: absolute;

    right: 12px;
    bottom: 12px;

    z-index: 31;

    display: none;
}

@media (max-width: 600px) {
    #topButtons {
        top: 48px;
        gap: 5px;
    }

    button,
    .fileButton {
        padding: 8px 9px;
        font-size: 12px;
    }

    #appControls {
        bottom: 8px;
        width: 96%;
        max-height: 45vh;
    }

    #status {
        top: 8px;
        font-size: 12px;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

    <div id="status">
        Ready. Press OPEN CAMERA.
    </div>

    <div id="topButtons">

        <button id="openCameraButton">
            OPEN CAMERA
        </button>

        <button id="startTrackingButton">
            START TRACKING
        </button>

        <button id="switchCameraButton">
            SWITCH CAMERA
        </button>

        <button id="flipCameraButton">
            FLIP
        </button>

        <button id="recordButton">
            RECORD
        </button>

        <button id="captureButton">
            PHOTO
        </button>

        <label
            class="fileButton"
            for="modelFileInput">
            IMPORT 3D
        </label>

        <input
            id="modelFileInput"
            type="file"
            accept=".glb,.gltf,.obj,.stl">

        <button id="exportButton">
            EXPORT GLB
        </button>

    </div>

    <div id="appControls">

        <div class="controlRow">
            <div class="controlLabel">
                <span>Scale</span>
                <span
                    id="scaleValue"
                    class="controlValue">
                    1.00
                </span>
            </div>

            <input
                id="scaleSlider"
                type="range"
                min="0.05"
                max="5"
                step="0.01"
                value="1">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Position X</span>
                <span
                    id="xValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="xSlider"
                type="range"
                min="-3"
                max="3"
                step="0.01"
                value="0">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Position Y</span>
                <span
                    id="yValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="ySlider"
                type="range"
                min="-3"
                max="3"
                step="0.01"
                value="0">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Position Z</span>
                <span
                    id="zValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="zSlider"
                type="range"
                min="-3"
                max="3"
                step="0.01"
                value="0">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Rotation X</span>
                <span
                    id="rotateXValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="rotateXSlider"
                type="range"
                min="-180"
                max="180"
                step="1"
                value="0">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Rotation Y</span>
                <span
                    id="rotateYValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="rotateYSlider"
                type="range"
                min="-180"
                max="180"
                step="1"
                value="0">
        </div>

        <div class="controlRow">
            <div class="controlLabel">
                <span>Rotation Z</span>
                <span
                    id="rotateZValue"
                    class="controlValue">
                    0
                </span>
            </div>

            <input
                id="rotateZSlider"
                type="range"
                min="-180"
                max="180"
                step="1"
                value="0">
        </div>

        <div id="controlsButtons">

            <button id="resetControlsButton">
                RESET
            </button>

            <button id="hideControlsButton">
                HIDE CONTROLS
            </button>

        </div>

    </div>

    <button id="showControlsButton">
        SHOW CONTROLS
    </button></div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
