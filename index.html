<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Aziz Hero AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;
}

.camera-mirrored {
    transform: scaleX(-1);
}

#threeCanvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}

#status {

    position: fixed;

    left: 12px;
    bottom: 14px;

    z-index: 20;

    padding: 8px 12px;

    border-radius: 20px;

    background: rgba(0,0,0,.60);

    color: #fff;

    font-size: 12px;

    max-width: 70%;

    pointer-events: none;
}


/* RIGHT SIDE BUTTONS */

#sideControls {

    position: fixed;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    z-index: 30;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    max-height: 90vh;

    overflow-y: auto;

    padding: 5px;

    scrollbar-width: none;
}

#sideControls::-webkit-scrollbar {
    display: none;
}

.tool {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    touch-action: manipulation;
}

.tool:active {
    transform: scale(.9);
}

.tool.primary {

    background: rgba(255,255,255,.95);

    color: #111;
}

.tool.recording {
    background: #e53935;
}


/* 3D PANEL */

#modelPanel {

    position: fixed;

    right: 68px;

    top: 50%;

    transform: translateY(-50%);

    z-index: 40;

    width: min(245px,68vw);

    max-height: 82vh;

    overflow-y: auto;

    padding: 14px;

    border-radius: 18px;

    background: rgba(15,15,18,.94);

    color: white;

    display: none;
}

#modelPanel.show {
    display: block;
}

.panelTitle {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;
}

.control {
    margin-bottom: 10px;
}

.control label {

    display: flex;

    justify-content: space-between;

    font-size: 11px;

    margin-bottom: 4px;
}

.control input[type="range"] {
    width: 100%;
}

.hiddenInput {
    display: none;
}

</style>

</head>

<body>


<!-- CAMERA -->

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<!-- 3D CANVAS -->

<canvas id="threeCanvas"></canvas>


<!-- STATUS -->

<div id="status">
    Ready
</div>


<!-- RIGHT SIDE CONTROLS -->

<div id="sideControls">

    <button
        id="cameraButton"
        class="tool primary">
        ▶
    </button>

    <button
        id="switchCameraButton"
        class="tool">
        ↔
    </button>

    <button
        id="photoButton"
        class="tool">
        📷
    </button>

    <button
        id="recordButton"
        class="tool">
        ⏺
    </button>

    <button
        id="audioButton"
        class="tool">
        🎙
    </button>

    <button
        id="import3DButton"
        class="tool">
        📥
    </button>

    <button
        id="modelButton"
        class="tool">
        3D
    </button>

    <button
        id="export3DButton"
        class="tool">
        📤
    </button>

    <button
        id="resetButton"
        class="tool">
        ↺
    </button>

</div>


<!-- 3D CONTROL PANEL -->

<div id="modelPanel">

    <div class="panelTitle">
        3D MODEL
    </div>

    <div class="control">

        <label>
            <span>X</span>
            <span id="posXValue">0</span>
        </label>

        <input
            id="posX"
            type="range"
            min="-3"
            max="3"
            step="0.01"
            value="0">

    </div>

    <div class="control">

        <label>
            <span>Y</span>
            <span id="posYValue">0</span>
        </label>

        <input
            id="posY"
            type="range"
            min="-3"
            max="3"
            step="0.01"
            value="0">

    </div>

    <div class="control">

        <label>
            <span>Z</span>
            <span id="posZValue">0</span>
        </label>

        <input
            id="posZ"
            type="range"
            min="-3"
            max="3"
            step="0.01"
            value="0">

    </div>

    <div class="control">

        <label>
            <span>Rotate X</span>
            <span id="rotXValue">0°</span>
        </label>

        <input
            id="rotX"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0">

    </div>    <div class="control">

        <label>
            <span>Rotate Y</span>
            <span id="rotYValue">0°</span>
        </label>

        <input
            id="rotY"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0">

    </div>


    <div class="control">

        <label>
            <span>Rotate Z</span>
            <span id="rotZValue">0°</span>
        </label>

        <input
            id="rotZ"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0">

    </div>


    <div class="control">

        <label>
            <span>Scale</span>
            <span id="scaleValue">1.00</span>
        </label>

        <input
            id="scale"
            type="range"
            min="0.1"
            max="4"
            step="0.01"
            value="1">

    </div>

</div>


<!-- 3D MODEL FILE INPUT -->

<input
    id="import3DInput"
    class="hiddenInput"
    type="file"
    accept=".glb,.gltf,.obj,.fbx,.stl">


<!-- APP JAVASCRIPT -->

<script
    type="module"
    src="./js/app.js?v=3">
</script>


</body>

</html>
