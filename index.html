<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

#threeCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

#landmarkCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}

#ui {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 20;
  max-height: calc(100vh - 30px);
  overflow-y: auto;
  padding-bottom: 20px;
}

#status {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: #00ff00;
  font-size: 14px;
  font-weight: bold;
}

button {
  display: block;
  margin-top: 10px;
  padding: 12px 18px;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

#startButton {
  background: #00ff00;
  color: #000;
}

#flipButton {
  background: #00aaff;
  color: #fff;
}

#modelButton {
  background: #fff;
  color: #000;
}

#resetButton {
  background: #ffcc00;
  color: #000;
}

#fitButton {
  background: #9b59ff;
  color: #fff;
}

#modelInput {
  display: none;
}

#controls {
  display: none;
  margin-top: 12px;
  padding: 12px;
  max-width: 360px;
  border-radius: 14px;
  background: rgba(0,0,0,.78);
}

#controlsTitle {
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}

.control {
  margin-top: 9px;
}

.controlTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
  font-size: 13px;
  margin-bottom: 4px;
}

.controlValue {
  color: #00ff00;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  height: 28px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js?v=18",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>

<canvas id="landmarkCanvas"></canvas>

<div id="ui">

  <div id="status">READY</div>

  <button id="startButton">START CAMERA</button>

  <button id="flipButton">FLIP CAMERA</button>

  <button id="modelButton">LOAD GLB MODEL</button>

  <input id="modelInput" type="file" accept=".glb">

  <div id="controls">

    <div id="controlsTitle">MODEL ADJUSTMENT</div>

    <button id="fitButton">HEAD FIT MODE</button>

    <div class="control">
      <div class="controlTop">
        <span>X Position</span>
        <span id="xValue" class="controlValue">0.00</span>
      </div>
      <input id="xSlider" type="range"
        min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Y Position</span>
        <span id="yValue" class="controlValue">0.00</span>
      </div>
      <input id="ySlider" type="range"
        min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Z Position</span>
        <span id="zValue" class="controlValue">0.00</span>
      </div>
      <input id="zSlider" type="range"
        min="-3" max="3" step="0.01" value="0">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Scale</span>
        <span id="scaleValue" class="controlValue">1.00</span>
      </div>
      <input id="scaleSlider" type="range"
        min="0.1" max="3" step="0.01" value="1">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Rotate X</span>
        <span id="rotXValue" class="controlValue">0°</span>
      </div>
      <input id="rotXSlider" type="range"
        min="-360" max="360" step="1" value="0">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Rotate Y</span>
        <span id="rotYValue" class="controlValue">0°</span>
      </div>
      <input id="rotYSlider" type="range"
        min="-360" max="360" step="1" value="0">
    </div>

    <div class="control">
      <div class="controlTop">
        <span>Rotate Z</span>
        <span id="rotZValue" class="controlValue">0°</span>
      </div>
      <input id="rotZSlider" type="range"
        min="-360" max="360" step="1" value="0">
    </div>

    <button id="resetButton">RESET MODEL</button>

  </div>
</div>

<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


const video =
  document.getElementById("camera");

const threeCanvas =
  document.getElementById("threeCanvas");

const landmarkCanvas =
  document.getElementById("landmarkCanvas");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const flipButton =
  document.getElementById("flipButton");

const modelButton =
  document.getElementById("modelButton");

const modelInput =
  document.getElementById("modelInput");

const controls =
  document.getElementById("controls");

const fitButton =
  document.getElementById("fitButton");

const resetButton =
  document.getElementById("resetButton");


const xSlider =
  document.getElementById("xSlider");

const ySlider =
  document.getElementById("ySlider");

const zSlider =
  document.getElementById("zSlider");

const scaleSlider =
  document.getElementById("scaleSlider");

const rotXSlider =
  document.getElementById("rotXSlider");

const rotYSlider =
  document.getElementById("rotYSlider");

const rotZSlider =
  document.getElementById("rotZSlider");


const xValue =
  document.getElementById("xValue");

const yValue =
  document.getElementById("yValue");

const zValue =
  document.getElementById("zValue");

const scaleValue =
  document.getElementById("scaleValue");

const rotXValue =
  document.getElementById("rotXValue");

const rotYValue =
  document.getElementById("rotYValue");

const rotZValue =
  document.getElementById("rotZValue");


let faceLandmarker = null;

let trackingStarted = false;

let loadedModel = null;

let modelCenter =
  new THREE.Vector3();

let modelSize =
  new THREE.Vector3();

let headFitEnabled = false;

let currentFacingMode = "user";

let currentStream = null;


const renderer =
  new THREE.WebGLRenderer({
    canvas: threeCanvas,
    alpha: true,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


const threeCamera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
  );

threeCamera.position.set(
  0,
  0,
  5
);


const anchor =
  new THREE.Group();

scene.add(anchor);


const modelPivot =
  new THREE.Group();

anchor.add(modelPivot);


const cubeGeometry =
  new THREE.BoxGeometry(
    1,
    1,
    1
  );

const cubeMaterial =
  new THREE.MeshNormalMaterial({
    transparent: true,
    opacity: 0.65
  });

const cube =
  new THREE.Mesh(
    cubeGeometry,
    cubeMaterial
  );

cube.scale.set(
  0.45,
  0.45,
  0.45
);

modelPivot.add(cube);


const gltfLoader =
  new GLTFLoader();


const defaultModelSettings = {
  x: 0,
  y: 0,
  z: 0,
  scale: 1,
  rotX: 0,
  rotY: 0,
  rotZ: 0
};


async function startCamera() {

  try {

    status.textContent =
      "OPENING CAMERA...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      status.textContent =
        "CAMERA NOT SUPPORTED";

      return;
    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode:
              currentFacingMode,

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false
        });


    currentStream =
      stream;

    video.srcObject =
      stream;

    await video.play();


    status.textContent =
      currentFacingMode === "user"
        ? "FRONT CAMERA"
        : "BACK CAMERA";


    startButton.style.display =
      "none";


    await loadFaceTracker();

  } catch (error) {

    console.error(error);

    status.textContent =
      "CAMERA ERROR";
  }
}


async function flipCamera() {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      status.textContent =
        "CAMERA NOT SUPPORTED";

      return;
    }


    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      currentStream = null;
    }


    currentFacingMode =
      currentFacingMode === "user"
        ? "environment"
        : "user";


    status.textContent =
      "SWITCHING CAMERA...";


    let stream;


    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {
              facingMode: {
                exact:
                  currentFacingMode
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });

    } catch (firstError) {

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {
              facingMode:
                currentFacingMode,

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });
    }


    currentStream =
      stream;

    video.srcObject =
      stream;

    await video.play();


    status.textContent =
      currentFacingMode === "user"
        ? "FRONT CAMERA"
        : "BACK CAMERA";


  } catch (error) {

    console.error(error);

    status.textContent =
      "FLIP CAMERA ERROR";
  }
}


async function loadFaceTracker() {

  try {

    status.textContent =
      "LOADING FACE TRACKER...";


    const vision =
      await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs?v=18"
      );


    const {
      FaceLandmarker,
      FilesetResolver
    } = vision;


    const filesetResolver =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
      );


    faceLandmarker =
      await FaceLandmarker
        .createFromOptions(
          filesetResolver,
          {

            baseOptions: {

              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

              delegate:
                "GPU"

            },

            runningMode:
              "VIDEO",

            numFaces:
              1,

            outputFaceBlendshapes:
              false,

            outputFacialTransformationMatrixes:
              true

          }
        );


    status.textContent =
      "FACE TRACKER READY";


    trackingStarted =
      true;


    requestAnimationFrame(
      trackFace
    );

  } catch (error) {

    console.error(error);

    status.textContent =
      "TRACKER ERROR";
  }
}


function drawLandmarks(
  landmarks
) {

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  landmarkCanvas.width =
    Math.round(
      width * dpr
    );

  landmarkCanvas.height =
    Math.round(
      height * dpr
    );


  const ctx =
    landmarkCanvas
      .getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  for (
    const point of landmarks
  ) {

    const x =
      point.x * width;

    const y =
      point.y * height;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      12,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(0,255,0,0.25)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#00ff00";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();
  }
}


modelButton.addEventListener(
  "click",
  () => {
    modelInput.click();
  }
);


modelInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) return;


    status.textContent =
      "LOADING 3D MODEL...";


    try {

      const arrayBuffer =
        await file.arrayBuffer();


      gltfLoader.parse(

        arrayBuffer,

        "",

        gltf => {

          modelPivot.clear();

          loadedModel =
            gltf.scene;


          modelPivot.add(
            loadedModel
          );


          calculateModelBounds();


          cube.visible =
            false;


          controls.style.display =
            "block";


          status.textContent =
            "GLB MODEL LOADED";


          applyModelSettings();

        },

        undefined,

        error => {

          console.error(error);

          status.textContent =
            "GLB LOAD ERROR";
        }
      );


    } catch (error) {

      console.error(error);

      status.textContent =
        "MODEL ERROR";
    }
  }
);


function calculateModelBounds() {

  if (!loadedModel) return;


  const box =
    new THREE.Box3()
      .setFromObject(
        loadedModel
      );


  box.getCenter(
    modelCenter
  );

  box.getSize(
    modelSize
  );


  loadedModel.position.set(
    -modelCenter.x,
    -modelCenter.y,
    -modelCenter.z
  );


  modelCenter.set(
    0,
    0,
    0
  );


  if (
    modelSize.x === 0 &&
    modelSize.y === 0 &&
    modelSize.z === 0
  ) {

    modelSize.set(
      1,
      1,
      1
    );
  }
}


function applyModelSettings() {

  if (!loadedModel) return;


  const x =
    parseFloat(
      xSlider.value
    );

  const y =
    parseFloat(
      ySlider.value
    );

  const z =
    parseFloat(
      zSlider.value
    );

  const scale =
    parseFloat(
      scaleSlider.value
    );

  const rotX =
    parseFloat(
      rotXSlider.value
    );

  const rotY =
    parseFloat(
      rotYSlider.value
    );

  const rotZ =
    parseFloat(
      rotZSlider.value
    );


  modelPivot.position.set(
    x,
    y,
    z
  );


  if (!headFitEnabled) {

    modelPivot.scale.set(
      scale,
      scale,
      scale
    );

  } else {

    applyHeadFit();
  }


  modelPivot.rotation.set(

    THREE.MathUtils.degToRad(
      rotX
    ),

    THREE.MathUtils.degToRad(
      rotY
    ),

    THREE.MathUtils.degToRad(
      rotZ
    )
  );


  xValue.textContent =
    x.toFixed(2);

  yValue.textContent =
    y.toFixed(2);

  zValue.textContent =
    z.toFixed(2);

  scaleValue.textContent =
    scale.toFixed(2);

  rotXValue.textContent =
    rotX + "°";

  rotYValue.textContent =
    rotY + "°";

  rotZValue.textContent =
    rotZ + "°";
}


xSlider.addEventListener(
  "input",
  applyModelSettings
);

ySlider.addEventListener(
  "input",
  applyModelSettings
);

zSlider.addEventListener(
  "input",
  applyModelSettings
);

scaleSlider.addEventListener(
  "input",
  applyModelSettings
);

rotXSlider.addEventListener(
  "input",
  applyModelSettings
);

rotYSlider.addEventListener(
  "input",
  applyModelSettings
);

rotZSlider.addEventListener(
  "input",
  applyModelSettings
);


fitButton.addEventListener(
  "click",
  () => {

    if (!loadedModel) {

      status.textContent =
        "LOAD GLB FIRST";

      return;
    }


    headFitEnabled =
      !headFitEnabled;


    fitButton.textContent =
      headFitEnabled
        ? "HEAD FIT ON"
        : "HEAD FIT MODE";


    if (headFitEnabled) {

      applyHeadFit();

      status.textContent =
        "HEAD FIT ENABLED";

    } else {

      applyModelSettings();

      status.textContent =
        "HEAD FIT DISABLED";
    }
  }
);function applyHeadFit() {

  if (!loadedModel) return;

  if (!headFitEnabled) return;


  if (
    modelSize.x === 0 &&
    modelSize.y === 0 &&
    modelSize.z === 0
  ) {
    return;
  }


  const targetHeadSize = 1.0;


  const largestDimension =
    Math.max(
      modelSize.x,
      modelSize.y,
      modelSize.z
    );


  if (largestDimension <= 0) {
    return;
  }


  const fitScale =
    targetHeadSize /
    largestDimension;


  const userScale =
    parseFloat(
      scaleSlider.value
    );


  const finalScale =
    fitScale * userScale;


  modelPivot.scale.set(
    finalScale,
    finalScale,
    finalScale
  );
}


resetButton.addEventListener(
  "click",
  () => {

    xSlider.value =
      defaultModelSettings.x;

    ySlider.value =
      defaultModelSettings.y;

    zSlider.value =
      defaultModelSettings.z;

    scaleSlider.value =
      defaultModelSettings.scale;

    rotXSlider.value =
      defaultModelSettings.rotX;

    rotYSlider.value =
      defaultModelSettings.rotY;

    rotZSlider.value =
      defaultModelSettings.rotZ;


    if (loadedModel) {

      loadedModel.position.set(
        -modelCenter.x,
        -modelCenter.y,
        -modelCenter.z
      );
    }


    applyModelSettings();


    status.textContent =
      "MODEL RESET";
  }
);


function updateHeadAnchor(
  landmarks,
  transformationMatrix
) {

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  const nose =
    landmarks[1];

  const leftEye =
    landmarks[33];

  const rightEye =
    landmarks[263];


  if (
    !nose ||
    !leftEye ||
    !rightEye
  ) {
    return;
  }


  const faceX =
    nose.x * width;

  const faceY =
    nose.y * height;


  const normalizedX =
    (faceX / width) * 2 - 1;

  const normalizedY =
    -(
      (faceY / height) * 2 - 1
    );


  anchor.position.x =
    normalizedX * 2.25;

  anchor.position.y =
    normalizedY * 1.7;


  const dx =
    rightEye.x -
    leftEye.x;

  const dy =
    rightEye.y -
    leftEye.y;


  const eyeDistance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const headScale =
    Math.max(
      0.35,
      Math.min(
        1.35,
        eyeDistance * 3.5
      )
    );


  anchor.scale.set(
    headScale,
    headScale,
    headScale
  );


  if (
    transformationMatrix &&
    transformationMatrix.length >= 16
  ) {

    const matrix =
      new THREE.Matrix4();


    matrix.fromArray(
      transformationMatrix
    );


    const position =
      new THREE.Vector3();

    const quaternion =
      new THREE.Quaternion();

    const scale =
      new THREE.Vector3();


    matrix.decompose(
      position,
      quaternion,
      scale
    );


    const euler =
      new THREE.Euler();


    euler.setFromQuaternion(
      quaternion,
      "YXZ"
    );


    anchor.rotation.x =
      euler.x;

    anchor.rotation.y =
      euler.y;

    anchor.rotation.z =
      euler.z;
  }


  if (headFitEnabled) {
    applyHeadFit();
  }
}


function trackFace() {

  if (
    !trackingStarted ||
    !faceLandmarker
  ) {

    requestAnimationFrame(
      trackFace
    );

    return;
  }


  if (
    video.readyState >= 2
  ) {

    try {

      const now =
        performance.now();


      const result =
        faceLandmarker
          .detectForVideo(
            video,
            now
          );


      if (
        result.faceLandmarks &&
        result.faceLandmarks.length > 0
      ) {

        const landmarks =
          result.faceLandmarks[0];


        drawLandmarks(
          landmarks
        );


        let matrix = null;


        if (
          result.facialTransformationMatrixes &&
          result.facialTransformationMatrixes.length > 0
        ) {

          matrix =
            result
              .facialTransformationMatrixes[0]
              .data;
        }


        updateHeadAnchor(
          landmarks,
          matrix
        );


        status.textContent =
          loadedModel
            ? (
              headFitEnabled
                ? "HEAD FIT TRACKING: ON"
                : "GLB HEAD TRACKING: ON"
            )
            : "HEAD TRACKING: ON";


      } else {

        const ctx =
          landmarkCanvas
            .getContext("2d");


        ctx.clearRect(
          0,
          0,
          landmarkCanvas.width,
          landmarkCanvas.height
        );


        status.textContent =
          "FACE NOT FOUND";
      }


    } catch (error) {

      console.error(error);

      status.textContent =
        "TRACKING ERROR";
    }
  }


  requestAnimationFrame(
    trackFace
  );
}


function render() {

  requestAnimationFrame(
    render
  );


  renderer.render(
    scene,
    threeCamera
  );
}


render();


window.addEventListener(
  "resize",
  () => {

    const width =
      window.innerWidth;

    const height =
      window.innerHeight;


    renderer.setSize(
      width,
      height
    );


    threeCamera.aspect =
      width / height;


    threeCamera.updateProjectionMatrix();
  }
);


startButton.addEventListener(
  "click",
  startCamera
);


flipButton.addEventListener(
  "click",
  flipCamera
);

</script>

</body>
</html>
