<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera Face Tracking</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

#status{
    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:20;

    max-width:90%;

    background:rgba(0,0,0,.8);

    color:white;

    padding:12px 16px;

    border-radius:10px;

    font-family:Arial,sans-serif;

    font-size:15px;

    text-align:center;
}

#open{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

</style>


<!--
    IMPORTANT:
    MediaPipe is loaded as a normal script.
    No dynamic import().
-->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js"
crossorigin="anonymous">
</script>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<div id="status">
CAMERA TEST
</div>


<button id="open">
OPEN CAMERA
</button>



<script>


const video =
document.getElementById("camera");


const button =
document.getElementById("open");


const status =
document.getElementById("status");


let faceLandmarker =
null;


let lastVideoTime =
-1;



/* =====================================
   CAMERA
===================================== */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA OK — STARTING FACE...";


        await createFaceTracker();

    }

    catch(error){

        showError(
            "CAMERA ERROR",
            error
        );

    }

};



/* =====================================
   FACE TRACKER
===================================== */

async function createFaceTracker(){

    try{

        status.innerText =
        "CHECKING MEDIAPIPE...";


        /*
        Check whether the script loaded.
        */

        if(
            typeof FaceLandmarker ===
            "undefined"
        ){

            throw new Error(

                "MediaPipe FaceLandmarker was not loaded."

            );

        }


        if(
            typeof FilesetResolver ===
            "undefined"
        ){

            throw new Error(

                "MediaPipe FilesetResolver was not loaded."

            );

        }


        status.innerText =
        "LOADING MEDIAPIPE WASM...";


        const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


        status.innerText =
        "LOADING FACE MODEL...";


        faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    /*
                    CPU for first test.
                    */

                    delegate:"CPU"

                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5,

                outputFaceBlendshapes:false,

                outputFacialTransformationMatrixes:true

            }

        );


        status.innerText =
        "FACE TRACKING READY";


        detectFace();

    }

    catch(error){

        showError(
            "FACE MODEL ERROR",
            error
        );

    }

}



/* =====================================
   FACE DETECTION
===================================== */

function detectFace(){

    requestAnimationFrame(
        detectFace
    );


    if(
        !faceLandmarker
    ){

        return;

    }


    if(
        video.readyState <
        video.HAVE_CURRENT_DATA
    ){

        return;

    }


    if(
        video.currentTime ===
        lastVideoTime
    ){

        return;

    }


    lastVideoTime =
    video.currentTime;


    try{

        const result =
        faceLandmarker.detectForVideo(

            video,

            performance.now()

        );


        if(

            result.faceLandmarks &&

            result.faceLandmarks.length > 0

        ){

            status.innerText =
            "FACE DETECTED ✓";

        }

        else{

            status.innerText =
            "FACE TRACKING ON — FACE NOT FOUND";

        }

    }

    catch(error){

        showError(
            "DETECTION ERROR",
            error
        );

    }

}



/* =====================================
   ERROR
===================================== */

function showError(
    title,
    error
){

    console.error(
        title,
        error
    );


    const message =
    error &&
    error.message
    ?
    error.message
    :
    String(error);


    status.innerText =
    title +
    ": " +
    message;

}


</script>

</body>

</html>
