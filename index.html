<title>AR 3D Face Studio</title>

<style>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    FBXLoader
} from "three/addons/loaders/FBXLoader.js";

import {
    OBJLoader
} from "three/addons/loaders/OBJLoader.js";

import {
    MTLLoader
} from "three/addons/loaders/MTLLoader.js";

import {
    FaceLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


const video =
    document.getElementById("video");

const stage =
    document.getElementById("stage");

const canvas =
    document.getElementById("threeCanvas");

const statusText =
    document.getElementById("status");

const message =
    document.getElementById("message");

const controls =
    document.getElementById("controls");

const modelInfo =
    document.getElementById("modelInfo");


let stream = null;

let facingMode = "user";

let mirror = true;

let faceLandmarker = null;

let trackingStarted = false;

let lastVideoTime = -1;

let currentModel = null;

let currentModelName = "";

let modelFiles = new Map();

let objectURLs = [];

let mediaRecorder = null;

let recordedChunks = [];

let isRecording = false;

let faceVisible = false;

let smoothX = 0;

let smoothY = 0;

let smoothZ = 0;

let smoothQuaternion =
    new THREE.Quaternion();

let hasSmoothRotation = false;


/* ---------------------------
   THREE SCENE
--------------------------- */

const scene =
    new THREE.Scene();


const camera =
    new THREE.OrthographicCamera(
        -1,
        1,
        1,
        -1,
        0.01,
        100
    );


camera.position.set(
    0,
    0,
    5
);


const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true,
        preserveDrawingBuffer:true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* ---------------------------
   LIGHTS
--------------------------- */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2.0
    );

scene.add(ambient);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

keyLight.position.set(
    2,
    3,
    5
);

scene.add(keyLight);


/* ---------------------------
   HEAD ANCHOR
--------------------------- */

const headAnchor =
    new THREE.Object3D();

scene.add(headAnchor);


/*
    The modelOffset is separate from
    the tracked head.

    This is important.

    Face tracking moves headAnchor.

    User controls move modelOffset.
*/

const modelOffset =
    new THREE.Object3D();

headAnchor.add(modelOffset);


/* ---------------------------
   MODEL SETTINGS
--------------------------- */

const modelSettings = {

    x:0,

    y:0,

    z:0,

    scale:1,

    rotX:0,

    rotY:180,

    rotZ:0

};


/* ---------------------------
   UI HELPERS
--------------------------- */

function showMessage(text){

    message.textContent = text;

    message.style.display = "block";

    setTimeout(()=>{
        message.style.display = "none";
    },2500);
}


function setStatus(text){

    statusText.textContent = text;

}


/* ---------------------------
   RESIZE
--------------------------- */

function resize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    renderer.setSize(
        w,
        h,
        false
    );

    const aspect =
        w / h;

    camera.left =
        -aspect;

    camera.right =
        aspect;

    camera.top =
        1;

    camera.bottom =
        -1;

    camera.updateProjectionMatrix();

}

window.addEventListener(
    "resize",
    resize
);

resize();/* =====================================================
   PART 2
   CAMERA + MEDIAPIPE FACE TRACKING
===================================================== */


/* ---------------------------
   CAMERA
--------------------------- */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks()
                .forEach(track=>{
                    track.stop();
                });

            stream = null;
        }


        setStatus(
            "Opening camera..."
        );


        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:facingMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:true

            });


        video.srcObject =
            stream;


        await video.play();


        setStatus(
            "Camera ready - finding face..."
        );


        if(!faceLandmarker){

            await initFaceTracking();

        }


        if(!trackingStarted){

            trackingStarted = true;

            requestAnimationFrame(
                trackingLoop
            );

        }

    }catch(error){

        console.error(error);

        setStatus(
            "Camera error"
        );

        showMessage(
            "Camera start नहीं हुआ। Camera permission allow करें."
        );

    }

}


/* ---------------------------
   MEDIAPIPE INITIALIZATION
--------------------------- */

async function initFaceTracking(){

    try{

        setStatus(
            "Loading face tracking..."
        );


        const vision =
            await FilesetResolver
            .forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );


        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                vision,
                {

                    baseOptions:{

                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                        delegate:"GPU"

                    },

                    runningMode:"VIDEO",

                    numFaces:1,

                    minFaceDetectionConfidence:
                        0.5,

                    minFacePresenceConfidence:
                        0.5,

                    minTrackingConfidence:
                        0.5,

                    outputFaceBlendshapes:false,

                    outputFacialTransformationMatrixes:true

                }
            );


        setStatus(
            "Face tracking ready"
        );


    }catch(error){

        console.error(
            "FaceLandmarker error:",
            error
        );


        setStatus(
            "Face tracker failed"
        );


        showMessage(
            "Face tracking model load नहीं हुआ। Internet connection check करें."
        );

    }

}


/* ---------------------------
   CLAMP
--------------------------- */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* ---------------------------
   FACE BOUNDING BOX
--------------------------- */

function getFaceBox(
    landmarks
){

    let minX = 1;

    let minY = 1;

    let maxX = 0;

    let maxY = 0;


    for(
        const p of landmarks
    ){

        if(p.x < minX)
            minX = p.x;

        if(p.y < minY)
            minY = p.y;

        if(p.x > maxX)
            maxX = p.x;

        if(p.y > maxY)
            maxY = p.y;

    }


    return {

        centerX:
            (minX + maxX) / 2,

        centerY:
            (minY + maxY) / 2,

        width:
            maxX - minX,

        height:
            maxY - minY

    };

}


/* ---------------------------
   TRACKING LOOP
--------------------------- */

function trackingLoop(){

    if(
        !video.videoWidth ||
        !faceLandmarker
    ){

        requestAnimationFrame(
            trackingLoop
        );

        return;

    }


    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
            video.currentTime;


        try{

            const result =
                faceLandmarker.detectForVideo(
                    video,
                    performance.now()
                );


            processFaceResult(
                result
            );


        }catch(error){

            console.error(
                "Tracking error:",
                error
            );

        }

    }


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        trackingLoop
    );

}


/* ---------------------------
   PROCESS FACE
--------------------------- */

function processFaceResult(
    result
){

    if(
        !result ||
        !result.faceLandmarks ||
        !result.faceLandmarks.length
    ){

        faceVisible = false;

        setStatus(
            "Face not detected"
        );

        /*
            Slowly return only the tracking
            position. Model controls remain.
        */

        smoothX *= 0.92;

        smoothY *= 0.92;

        smoothZ *= 0.92;


        headAnchor.position.set(
            smoothX,
            smoothY,
            smoothZ
        );


        return;

    }


    faceVisible = true;


    const landmarks =
        result.faceLandmarks[0];


    const box =
        getFaceBox(
            landmarks
        );


    /*
       Screen position.

       This is only used to place the
       3D head anchor where the real
       face is.

       Rotation comes from the
       facial transformation matrix below.
    */

    const aspect =
        window.innerWidth /
        window.innerHeight;


    let targetX =
        (0.5 - box.centerX)
        * 2
        * aspect;


    let targetY =
        (0.5 - box.centerY)
        * 2;


    /*
       Face size controls approximate
       depth.

       Larger face = closer camera.
    */

    let targetZ =
        (0.18 /
        Math.max(
            box.width,
            0.001
        )) - 1;


    targetX =
        clamp(
            targetX,
            -2.5,
            2.5
        );


    targetY =
        clamp(
            targetY,
            -2.0,
            2.0
        );


    targetZ =
        clamp(
            targetZ,
            -1.2,
            2.5
        );


    /*
       Smooth position.
    */

    smoothX =
        THREE.MathUtils.lerp(
            smoothX,
            targetX,
            0.35
        );


    smoothY =
        THREE.MathUtils.lerp(
            smoothY,
            targetY,
            0.35
        );


    smoothZ =
        THREE.MathUtils.lerp(
            smoothZ,
            targetZ,
            0.25
        );


    headAnchor.position.set(
        smoothX,
        smoothY,
        smoothZ
    );


    /* ---------------------------
       TRUE 3D FACE ROTATION
    --------------------------- */

    if(
        result.facialTransformationMatrixes &&
        result.facialTransformationMatrixes.length
    ){

        const matrixData =
            result.facialTransformationMatrixes[0].data;


        if(
            matrixData &&
            matrixData.length === 16
        ){

            const faceMatrix =
                new THREE.Matrix4();


            faceMatrix.fromArray(
                matrixData
            );


            const facePosition =
                new THREE.Vector3();


            const faceQuaternion =
                new THREE.Quaternion();


            const faceScale =
                new THREE.Vector3();


            faceMatrix.decompose(
                facePosition,
                faceQuaternion,
                faceScale
            );


            /*
                MediaPipe and Three.js may use
                different forward directions.

                We apply a Y-axis correction
                to the tracked head coordinate.
            */

            const correction =
                new THREE.Quaternion()
                .setFromEuler(
                    new THREE.Euler(
                        0,
                        Math.PI,
                        0
                    )
                );


            const targetQuaternion =
                faceQuaternion
                .clone()
                .multiply(
                    correction
                );


            if(!hasSmoothRotation){

                smoothQuaternion.copy(
                    targetQuaternion
                );

                hasSmoothRotation =
                    true;

            }else{

                smoothQuaternion.slerp(
                    targetQuaternion,
                    0.35
                );

            }


            headAnchor.quaternion.copy(
                smoothQuaternion
            );

        }

    }


    setStatus(
        "Face tracking active"
    );

}


/* ---------------------------
   MIRROR
--------------------------- */

function updateMirror(){

    stage.style.transform =
        mirror
        ? "scaleX(-1)"
        : "scaleX(1)";

}


function toggleMirror(){

    mirror =
        !mirror;

    updateMirror();

}


updateMirror();


/* ---------------------------
   CAMERA SWITCH
--------------------------- */

async function switchCamera(){

    facingMode =
        facingMode === "user"
        ? "environment"
        : "user";


    hasSmoothRotation = false;


    await startCamera();

}


/* ---------------------------
   INITIAL CAMERA BUTTON
--------------------------- */

document
    .getElementById("cameraButton")
    .addEventListener(
        "click",
        switchCamera
    );


document
    .getElementById("mirrorButton")
    .addEventListener(
        "click",
        toggleMirror
    );


document
    .getElementById("controlButton")
    .addEventListener(
        "click",
        ()=>{

            controls.style.display =
                controls.style.display === "block"
                ? "none"
                : "block";

        }
    );/* =====================================================
   PART 3
   3D MODEL IMPORT SYSTEM
===================================================== */


/* ---------------------------
   CLEAN OLD MODEL
--------------------------- */

function disposeObject(
    object
){

    if(!object)
        return;


    object.traverse(
        child=>{

            if(child.geometry){

                child.geometry.dispose();

            }


            if(child.material){

                const materials =
                    Array.isArray(
                        child.material
                    )
                    ? child.material
                    : [child.material];


                materials.forEach(
                    material=>{

                        if(
                            material.map
                        )
                            material.map.dispose();


                        if(
                            material.normalMap
                        )
                            material.normalMap.dispose();


                        if(
                            material.roughnessMap
                        )
                            material.roughnessMap.dispose();


                        if(
                            material.metalnessMap
                        )
                            material.metalnessMap.dispose();


                        material.dispose();

                    }
                );

            }

        }
    );

}


/* ---------------------------
   REMOVE MODEL
--------------------------- */

function removeCurrentModel(){

    if(currentModel){

        modelOffset.remove(
            currentModel
        );

        disposeObject(
            currentModel
        );

        currentModel = null;

    }


    currentModelName = "";

    modelInfo.textContent =
        "No model loaded";

}


/* ---------------------------
   CREATE LOADING MANAGER
--------------------------- */

function createFileManager(){

    const manager =
        new THREE.LoadingManager();


    manager.setURLModifier(
        (url)=>{

            const cleanURL =
                url.split("?")[0]
                   .split("#")[0];


            const fileName =
                decodeURIComponent(
                    cleanURL
                        .split("/")
                        .pop()
                );


            /*
                First try exact filename.
            */

            if(
                modelFiles.has(
                    fileName
                )
            ){

                const file =
                    modelFiles.get(
                        fileName
                    );


                const objectURL =
                    URL.createObjectURL(
                        file
                    );


                objectURLs.push(
                    objectURL
                );


                return objectURL;

            }


            /*
                Sometimes GLTF/OBJ references
                filenames with different paths.
                Try only basename.
            */

            for(
                const [
                    name,
                    file
                ]
                of modelFiles
            ){

                if(
                    name.toLowerCase() ===
                    fileName.toLowerCase()
                ){

                    const objectURL =
                        URL.createObjectURL(
                            file
                        );


                    objectURLs.push(
                        objectURL
                    );


                    return objectURL;

                }

            }


            return url;

        }
    );


    return manager;

}


/* ---------------------------
   NORMALIZE MODEL
--------------------------- */

function normalizeModel(
    root
){

    root.updateMatrixWorld(
        true
    );


    const box =
        new THREE.Box3()
        .setFromObject(
            root
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const largest =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        largest > 0
    ){

        const targetSize =
            0.85;


        const scaleFactor =
            targetSize /
            largest;


        root.scale.multiplyScalar(
            scaleFactor
        );

    }


    /*
       Recalculate after scaling.
    */

    root.updateMatrixWorld(
        true
    );


    const box2 =
        new THREE.Box3()
        .setFromObject(
            root
        );


    const center2 =
        box2.getCenter(
            new THREE.Vector3()
        );


    /*
       Put model origin near
       its visual center.
    */

    root.position.x -=
        center2.x;


    root.position.y -=
        center2.y;


    root.position.z -=
        center2.z;


    /*
       Enable shadows.
    */

    root.traverse(
        child=>{

            if(
                child.isMesh
            ){

                child.castShadow =
                    true;

                child.receiveShadow =
                    true;

                if(
                    child.material
                ){

                    const materials =
                        Array.isArray(
                            child.material
                        )
                        ? child.material
                        : [child.material];


                    materials.forEach(
                        material=>{

                            material.needsUpdate =
                                true;

                        }
                    );

                }

            }

        }
    );


    return root;

}


/* ---------------------------
   LOAD GLB / GLTF
--------------------------- */

async function loadGLTF(
    file
){

    const manager =
        createFileManager();


    const loader =
        new GLTFLoader(
            manager
        );


    const buffer =
        await file.arrayBuffer();


    const result =
        await loader.parseAsync(
            buffer,
            ""
        );


    return result.scene;

}


/* ---------------------------
   LOAD FBX
--------------------------- */

async function loadFBX(
    file
){

    const manager =
        createFileManager();


    const loader =
        new FBXLoader(
            manager
        );


    const buffer =
        await file.arrayBuffer();


    const root =
        loader.parse(
            buffer,
            ""
        );


    return root;

}


/* ---------------------------
   LOAD OBJ
--------------------------- */

async function loadOBJ(
    file
){

    const manager =
        createFileManager();


    let materials = null;


    /*
       Search for matching MTL.

       Prefer same base filename.

       Example:

       character.obj
       character.mtl
    */

    const baseName =
        file.name
            .replace(
                /\.obj$/i,
                ""
            );


    for(
        const [
            name,
            mtlFile
        ]
        of modelFiles
    ){

        if(
            /\.mtl$/i.test(
                name
            )
        ){

            const mtlBase =
                name.replace(
                    /\.mtl$/i,
                    ""
                );


            if(
                mtlBase.toLowerCase() ===
                baseName.toLowerCase()
            ){

                const mtlLoader =
                    new MTLLoader(
                        manager
                    );


                const mtlText =
                    await mtlFile.text();


                materials =
                    mtlLoader.parse(
                        mtlText,
                        ""
                    );


                materials.preload();


                break;

            }

        }

    }


    const loader =
        new OBJLoader(
            manager
        );


    if(materials){

        loader.setMaterials(
            materials
        );

    }


    const text =
        await file.text();


    const root =
        loader.parse(
            text
        );


    return root;

}


/* ---------------------------
   PREPARE MODEL
--------------------------- */

function prepareModel(
    root,
    name
){

    normalizeModel(
        root
    );


    /*
       User-controlled offset.
    */

    root.position.set(
        modelSettings.x,
        modelSettings.y,
        modelSettings.z
    );


    root.scale.setScalar(
        modelSettings.scale
    );


    root.rotation.set(
        THREE.MathUtils.degToRad(
            modelSettings.rotX
        ),

        THREE.MathUtils.degToRad(
            modelSettings.rotY
        ),

        THREE.MathUtils.degToRad(
            modelSettings.rotZ
        )
    );


    modelOffset.add(
        root
    );


    currentModel =
        root;


    currentModelName =
        name;


    modelInfo.textContent =
        "Loaded: " + name;


    updateModelUI();


}


/* ---------------------------
   IMPORT MODEL
--------------------------- */

async function importModelFiles(
    files
){

    if(
        !files ||
        !files.length
    ){

        return;

    }


    try{

        setStatus(
            "Loading 3D model..."
        );


        removeCurrentModel();


        /*
           Clear previous files.
        */

        modelFiles.clear();


        /*
           Clear old blob URLs.
        */

        objectURLs.forEach(
            url=>{
                URL.revokeObjectURL(
                    url
                );
            }
        );


        objectURLs = [];


        /*
           Store all selected files.

           This is important for:

           GLTF + BIN + textures

           OBJ + MTL + textures
        */

        for(
            const file of files
        ){

            modelFiles.set(
                file.name,
                file
            );

        }


        let mainFile =
            null;


        /*
           Priority:

           GLB
           GLTF
           FBX
           OBJ
        */

        mainFile =
            [...files].find(
                f =>
                    /\.glb$/i.test(
                        f.name
                    )
            );


        if(!mainFile){

            mainFile =
                [...files].find(
                    f =>
                        /\.gltf$/i.test(
                            f.name
                        )
                );

        }


        if(!mainFile){

            mainFile =
                [...files].find(
                    f =>
                        /\.fbx$/i.test(
                            f.name
                        )
                );

        }


        if(!mainFile){

            mainFile =
                [...files].find(
                    f =>
                        /\.obj$/i.test(
                            f.name
                        )
                );

        }


        if(!mainFile){

            throw new Error(
                "GLB / GLTF / FBX / OBJ file नहीं मिला"
            );

        }


        let root;


        const lower =
            mainFile.name
                .toLowerCase();


        if(
            lower.endsWith(".glb") ||
            lower.endsWith(".gltf")
        ){

            root =
                await loadGLTF(
                    mainFile
                );

        }

        else if(
            lower.endsWith(".fbx")
        ){

            root =
                await loadFBX(
                    mainFile
                );

        }

        else if(
            lower.endsWith(".obj")
        ){

            root =
                await loadOBJ(
                    mainFile
                );

        }


        if(!root){

            throw new Error(
                "3D model load नहीं हुआ"
            );

        }


        prepareModel(
            root,
            mainFile.name
        );


        setStatus(
            "3D model loaded"
        );


        showMessage(
            "3D model successfully imported"
        );


    }catch(error){

        console.error(
            "MODEL IMPORT ERROR:",
            error
        );


        setStatus(
            "Model import failed"
        );


        showMessage(
            "Model import error: " +
            error.message
        );

    }

}

/* ---------------------------
   RECORDING CANVAS
--------------------------- */

const recordCanvas =
    document.createElement(
        "canvas"
    );


const recordContext =
    recordCanvas.getContext(
        "2d"
    );


function drawRecordingFrame(){

    if(
        !recordCanvas.width ||
        !recordCanvas.height
    ){

        return;

    }


    const w =
        recordCanvas.width;

    const h =
        recordCanvas.height;


    recordContext.clearRect(
        0,
        0,
        w,
        h
    );


    /*
       Mirror video if mirror is enabled.
    */

    recordContext.save();


    if(mirror){

        recordContext.translate(
            w,
            0
        );

        recordContext.scale(
            -1,
            1
        );

    }


    /*
       object-fit: cover
       calculation.
    */

    const videoW =
        video.videoWidth ||
        w;

    const videoH =
        video.videoHeight ||
        h;


    const videoAspect =
        videoW / videoH;

    const canvasAspect =
        w / h;


    let drawW;

    let drawH;

    let offsetX = 0;

    let offsetY = 0;


    if(
        videoAspect >
        canvasAspect
    ){

        drawH = h;

        drawW =
            h * videoAspect;

        offsetX =
            (w - drawW) / 2;

    }else{

        drawW = w;

        drawH =
            w / videoAspect;

        offsetY =
            (h - drawH) / 2;

    }


    recordContext.drawImage(
        video,
        offsetX,
        offsetY,
        drawW,
        drawH
    );


    recordContext.restore();


    /*
       Draw transparent Three.js layer.
    */

    recordContext.drawImage(
        canvas,
        0,
        0,
        w,
        h
    );

}


/* ---------------------------
   START RECORDING
--------------------------- */

function startRecording(){

    if(!stream){

        showMessage(
            "Camera पहले start करें"
        );

        return;

    }


    const width =
        video.videoWidth ||
        1280;


    const height =
        video.videoHeight ||
        720;


    recordCanvas.width =
        width;

    recordCanvas.height =
        height;


    const captureStream =
        recordCanvas.captureStream(
            30
        );


    /*
       Add microphone/camera audio.
    */

    if(stream){

        const audioTracks =
            stream.getAudioTracks();


        audioTracks.forEach(
            track=>{

                captureStream.addTrack(
                    track
                );

            }
        );

    }


    let mimeType =
        "video/webm;codecs=vp9";


    if(
        !MediaRecorder.isTypeSupported(
            mimeType
        )
    ){

        mimeType =
            "video/webm;codecs=vp8";

    }


    if(
        !MediaRecorder.isTypeSupported(
            mimeType
        )
    ){

        mimeType =
            "video/webm";

    }


    recordedChunks = [];


    try{

        mediaRecorder =
            new MediaRecorder(
                captureStream,
                {
                    mimeType:
                        mimeType
                }
            );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            "Recording इस browser में supported नहीं है"
        );

        return;

    }


    mediaRecorder.ondataavailable =
        event=>{

            if(
                event.data &&
                event.data.size > 0
            ){

                recordedChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        ()=>{

            const blob =
                new Blob(
                    recordedChunks,
                    {
                        type:
                            mimeType
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                "AR-face-video.webm";


            a.click();


            setTimeout(
                ()=>{
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );


            showMessage(
                "Video saved"
            );

        };


    mediaRecorder.start(
        1000
    );


    isRecording = true;


    document.getElementById(
        "recording"
    ).style.display =
        "flex";


    document.getElementById(
        "recordButton"
    ).textContent =
        "Stop";


    setStatus(
        "Recording..."
    );


    recordingLoop();

}


/* ---------------------------
   RECORDING LOOP
--------------------------- */

function recordingLoop(){

    if(!isRecording)
        return;


    drawRecordingFrame();


    requestAnimationFrame(
        recordingLoop
    );

}


/* ---------------------------
   STOP RECORDING
--------------------------- */

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();

    }


    isRecording = false;


    document.getElementById(
        "recording"
    ).style.display =
        "none";


    document.getElementById(
        "recordButton"
    ).textContent =
        "Record";


    setStatus(
        faceVisible
        ? "Face tracking active"
        : "Face not detected"
    );

}
