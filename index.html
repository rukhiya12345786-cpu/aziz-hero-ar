<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>3D Head Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#threeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#ui{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:12px;
    background:rgba(0,0,0,.65);
    color:white;
    z-index:10;
}

button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    margin:3px;
    font-size:14px;
    font-weight:bold;
}

input[type=file]{
    display:none;
}

.fileBtn{
    display:inline-block;
    background:white;
    color:black;
    border-radius:10px;
    padding:10px 14px;
    margin:3px;
    font-weight:bold;
}

.control{
    margin-top:8px;
}

.control label{
    display:block;
    font-size:12px;
    margin-bottom:2px;
}

input[type=range]{
    width:100%;
}

#status{
    font-size:12px;
    margin-top:6px;
}
</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           muted
           playsinline></video>

    <canvas id="threeCanvas"></canvas>

    <div id="ui">

        <label class="fileBtn">
            Import GLB
            <input id="glbInput"
                   type="file"
                   accept=".glb,.gltf">
        </label>

        <button id="startBtn">
            Start Camera
        </button>

        <div class="control">
            <label>
                Height
                <span id="heightValue">0.25</span>
            </label>
            <input id="height"
                   type="range"
                   min="-0.5"
                   max="1.0"
                   step="0.01"
                   value="0.25">
        </div>

        <div class="control">
            <label>
                X Rotation
                <span id="rxValue">0</span>
            </label>
            <input id="rx"
                   type="range"
                   min="-3.14"
                   max="3.14"
                   step="0.01"
                   value="0">
        </div>

        <div class="control">
            <label>
                Y Rotation
                <span id="ryValue">0</span>
            </label>
            <input id="ry"
                   type="range"
                   min="-3.14"
                   max="3.14"
                   step="0.01"
                   value="0">
        </div>

        <div class="control">
            <label>
                Z Rotation
                <span id="rzValue">0</span>
            </label>
            <input id="rz"
                   type="range"
                   min="-3.14"
                   max="3.14"
                   step="0.01"
                   value="0">
        </div>

        <div id="status">
            Model: Not loaded
        </div>

    </div>

</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- GLTF / GLB LOADER -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* ==============================
   BASIC THREE.JS SETUP
============================== */

const canvas =
    document.getElementById("threeCanvas");

const scene = new THREE.Scene();

const camera =
    new THREE.OrthographicCamera(
        -1,1,1,-1,0.01,100
    );

camera.position.z = 5;

const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* ==============================
   LIGHT
============================== */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(ambient);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

light.position.set(0,2,5);

scene.add(light);


/* ==============================
   MODEL
============================== */

let model = null;

const loader =
    new THREE.GLTFLoader();

document
.getElementById("glbInput")
.addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const url =
        URL.createObjectURL(file);

    loader.load(
        url,
        function(gltf){

            if(model){
                scene.remove(model);
            }

            model = gltf.scene;

            scene.add(model);

            model.position.set(
                0,
                0.25,
                0
            );

            model.rotation.set(
                0,
                0,
                0
            );

            model.scale.set(
                1,
                1,
                1
            );

            document.getElementById("status")
                .textContent =
                "Model: GLB loaded";

            URL.revokeObjectURL(url);
        },

        undefined,

        function(error){

            console.error(error);

            document.getElementById("status")
                .textContent =
                "Model load failed";
        }
    );
});


/* ==============================
   MANUAL CONTROLS
============================== */

const height =
    document.getElementById("height");

const rx =
    document.getElementById("rx");

const ry =
    document.getElementById("ry");

const rz =
    document.getElementById("rz");

function updateManual(){

    if(!model) return;

    model.position.y =
        Number(height.value);

    model.rotation.x =
        Number(rx.value);

    model.rotation.y =
        Number(ry.value);

    model.rotation.z =
        Number(rz.value);

    document.getElementById("heightValue")
        .textContent = height.value;

    document.getElementById("rxValue")
        .textContent = rx.value;

    document.getElementById("ryValue")
        .textContent = ry.value;

    document.getElementById("rzValue")
        .textContent = rz.value;
}

height.oninput = updateManual;
rx.oninput = updateManual;
ry.oninput = updateManual;
rz.oninput = updateManual;


/* ==============================
   CAMERA
============================== */

const video =
    document.getElementById("video");

document
.getElementById("startBtn")
.addEventListener("click",async function(){

    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        video.srcObject = stream;

        document.getElementById("status")
            .textContent =
            "Camera started — load your GLB";

    }catch(error){

        console.error(error);

        document.getElementById("status")
            .textContent =
            "Camera permission required";
    }

});


/* ==============================
   RESIZE
============================== */

window.addEventListener(
    "resize",
    function(){

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ==============================
   RENDER LOOP
============================== */

function animate(){

    requestAnimationFrame(animate);

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html><!-- ==============================

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

let faceMesh = null;


/* ==============================
   START FACE TRACKING
============================== */

function startFaceTracking(){

    faceMesh = new FaceMesh({

        locateFile: function(file){

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
            + file;

        }

    });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });


    faceMesh.onResults(
        onFaceResults
    );


    processFaceVideo();
}


/* ==============================
   PROCESS CAMERA FRAMES
============================== */

async function processFaceVideo(){

    if(!faceMesh){

        requestAnimationFrame(
            processFaceVideo
        );

        return;
    }


    if(
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        try{

            await faceMesh.send({
                image:video
            });

        }catch(error){

            console.log(
                "Face tracking error:",
                error
            );

        }

    }


    requestAnimationFrame(
        processFaceVideo
    );
}


/* ==============================
   FACE RESULT
============================== */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        return;
    }


    const face =
        results.multiFaceLandmarks[0];


    if(!model) return;


    /*
       IMPORTANT LANDMARKS

       10  = forehead
       1   = nose
       33  = left eye
       263 = right eye
       152 = chin
    */

    const forehead =
        face[10];

    const nose =
        face[1];

    const leftEye =
        face[33];

    const rightEye =
        face[263];

    const chin =
        face[152];


    if(
        !forehead ||
        !nose ||
        !leftEye ||
        !rightEye ||
        !chin
    ){

        return;
    }


    /* ==============================
       FACE CENTER
    ============================== */

    const centerX =
        (leftEye.x + rightEye.x) / 2;

    const centerY =
        (forehead.y + chin.y) / 2;


    /* ==============================
       FACE SIZE
    ============================== */

    const faceWidth =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    /* ==============================
       HEAD TOP POSITION

       मॉडल को forehead से ऊपर
       उठाया जाता है।
    ============================== */

    const topOffset =
        faceHeight * 0.42;


    const targetX =
        (centerX - 0.5) * 2;


    const targetY =
        -(forehead.y - 0.5) * 2
        + topOffset;


    /*
       Z position

       मॉडल को face के सामने
       चिपकाने के बजाय depth
       में पीछे रखा जाता है।
    */

    const targetZ =
        -faceWidth * 1.5;


    /* ==============================
       SMOOTH MOVEMENT
    ============================== */

    model.position.x +=
        (targetX - model.position.x)
        * 0.35;


    model.position.y +=
        (targetY - model.position.y)
        * 0.35;


    model.position.z +=
        (targetZ - model.position.z)
        * 0.35;


    /* ==============================
       MODEL SCALE
    ============================== */

    const targetScale =
        faceWidth * 3.2;


    model.scale.lerp(
        new THREE.Vector3(
            targetScale,
            targetScale,
            targetScale
        ),
        0.35
    );


    /* ==============================
       HEAD ROLL

       सिर दाएँ-बाएँ झुके तो
       मॉडल भी झुकेगा।
    ============================== */

    const dx =
        rightEye.x -
        leftEye.x;

    const dy =
        rightEye.y -
        leftEye.y;


    const roll =
        Math.atan2(
            dy,
            dx
        );


    /*
       Manual rotation values
       भी साथ में रहेंगे।
    */

    const manualX =
        Number(rx.value);

    const manualY =
        Number(ry.value);

    const manualZ =
        Number(rz.value);


    model.rotation.x =
        manualX;

    model.rotation.y =
        manualY;

    model.rotation.z =
        roll + manualZ;


    document.getElementById("status")
        .textContent =
        "Head detected ✓";

}


/* ==============================
   START TRACKING AFTER CAMERA
============================== */

const oldStart =
    document.getElementById("startBtn");


oldStart.addEventListener(
    "click",
    function(){

        setTimeout(
            function(){

                if(!faceMesh){

                    startFaceTracking();

                }

            },
            500
        );

    }
);

     FULL 3D HEAD ROTATION
============================== -->

<script>

/*
    Head rotation calculation

    LEFT / RIGHT  = Y rotation
    UP / DOWN     = X rotation
    HEAD TILT     = Z rotation
*/


function updateHeadRotation(face){

    if(!model) return;

    const leftEye  = face[33];
    const rightEye = face[263];

    const forehead = face[10];
    const chin     = face[152];
    const nose     = face[1];

    if(
        !leftEye ||
        !rightEye ||
        !forehead ||
        !chin ||
        !nose
    ){
        return;
    }


    /* ==============================
       1. EYE CENTER
    ============================== */

    const eyeCenterX =
        (leftEye.x + rightEye.x) / 2;

    const eyeCenterY =
        (leftEye.y + rightEye.y) / 2;


    /* ==============================
       2. HEAD WIDTH
    ============================== */

    const headWidth =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    /* ==============================
       3. HEAD HEIGHT
    ============================== */

    const headHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    if(headWidth < 0.01) return;


    /* ==============================
       4. LEFT / RIGHT TURN

       Nose center से कितना
       left/right जा रहा है
    ============================== */

    const eyeMidX =
        (leftEye.x + rightEye.x) / 2;


    const noseOffsetX =
        (nose.x - eyeMidX) /
        headWidth;


    let yaw =
        noseOffsetX * 1.8;


    /*
       Limit ताकि model
       अचानक बहुत ज्यादा न घूमे।
    */

    yaw =
        THREE.MathUtils.clamp(
            yaw,
            -1.2,
            1.2
        );


    /* ==============================
       5. UP / DOWN

       Nose की vertical position
       से head pitch निकालना
    ============================== */

    const faceMidY =
        (forehead.y + chin.y) / 2;


    const noseOffsetY =
        (nose.y - faceMidY) /
        headHeight;


    let pitch =
        noseOffsetY * 1.5;


    pitch =
        THREE.MathUtils.clamp(
            pitch,
            -0.9,
            0.9
        );


    /* ==============================
       6. HEAD TILT

       दोनों आँखों की line
       से Z rotation
    ============================== */

    const dx =
        rightEye.x -
        leftEye.x;

    const dy =
        rightEye.y -
        leftEye.y;


    let roll =
        Math.atan2(
            dy,
            dx
        );


    roll =
        THREE.MathUtils.clamp(
            roll,
            -0.8,
            0.8
        );


    /* ==============================
       7. MANUAL ROTATION
    ============================== */

    const manualX =
        Number(
            document.getElementById("rx").value
        );

    const manualY =
        Number(
            document.getElementById("ry").value
        );

    const manualZ =
        Number(
            document.getElementById("rz").value
        );


    /* ==============================
       8. SMOOTH ROTATION
    ============================== */

    const smooth =
        0.18;


    model.rotation.x +=
        (
            pitch +
            manualX -
            model.rotation.x
        ) * smooth;


    model.rotation.y +=
        (
            yaw +
            manualY -
            model.rotation.y
        ) * smooth;


    model.rotation.z +=
        (
            roll +
            manualZ -
            model.rotation.z
        ) * smooth;

}


/* ==============================
   CONNECT TO FACE TRACKING
============================== */

const previousFaceResult =
    onFaceResults;


onFaceResults =
    function(results){

        if(
            !results.multiFaceLandmarks ||
            results.multiFaceLandmarks.length === 0
        ){
            return;
        }

        const face =
            results.multiFaceLandmarks[0];

        if(!model) return;


        /*
           पहले position update
        */

        const forehead =
            face[10];

        const chin =
            face[152];

        const leftEye =
            face[33];

        const rightEye =
            face[263];


        const centerX =
            (
                leftEye.x +
                rightEye.x
            ) / 2;


        const faceHeight =
            Math.abs(
                chin.y -
                forehead.y
            );


        const targetX =
            (centerX - 0.5) * 2;


        /*
           HEAD TOP
        */

        const targetY =
            -(forehead.y - 0.5) * 2
            +
            faceHeight * 0.42;


        model.position.x +=
            (
                targetX -
                model.position.x
            ) * 0.25;


        model.position.y +=
            (
                targetY -
                model.position.y
            ) * 0.25;


        /*
           अब पूरा 3D rotation
        */

        updateHeadRotation(face);

    };


</script><script>

/* =========================================
   PART 4 — AUTO MODEL CENTER + HEAD TOP
========================================= */

let modelBox = new THREE.Box3();
let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3();


/* =========================================
   PREPARE GLB
========================================= */

function prepareModel(){

    if(!model) return;

    /* Calculate complete model bounds */

    modelBox.setFromObject(model);

    modelBox.getCenter(modelCenter);

    modelBox.getSize(modelSize);


    /*
       GLB का origin चाहे कहीं भी हो,
       हम model को उसके center के हिसाब
       से normalize करेंगे।
    */

    model.position.x -= modelCenter.x;
    model.position.y -= modelCenter.y;
    model.position.z -= modelCenter.z;


    /*
       Model को default orientation
       में रखो।
    */

    model.rotation.order = "YXZ";


    /*
       Shadows / materials
    */

    model.traverse(function(object){

        if(object.isMesh){

            object.frustumCulled = false;

            if(object.material){

                object.material.needsUpdate = true;

            }

        }

    });


    document.getElementById("status")
        .textContent =
        "Model prepared ✓";
}


/* =========================================
   AUTO SIZE
========================================= */

function getModelScale(faceWidth){

    if(!modelSize.x ||
       !modelSize.y ||
       !modelSize.z){

        return 1;
    }


    /*
       Head width के हिसाब से
       model को scale किया जाएगा।
    */

    const targetWidth =
        faceWidth * 2.6;


    const currentWidth =
        Math.max(
            modelSize.x,
            modelSize.z,
            0.001
        );


    return targetWidth /
           currentWidth;
}


/* =========================================
   PUT MODEL ABOVE HEAD
========================================= */

function placeModelOnHead(face){

    if(!model) return;


    const forehead =
        face[10];

    const chin =
        face[152];

    const leftEye =
        face[33];

    const rightEye =
        face[263];


    if(
        !forehead ||
        !chin ||
        !leftEye ||
        !rightEye
    ){

        return;
    }


    /* -------------------------------------
       FACE MEASUREMENTS
    ------------------------------------- */

    const faceWidth =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    if(faceWidth < 0.01) return;


    /* -------------------------------------
       HEAD CENTER
    ------------------------------------- */

    const headX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    /*
       Important:

       Model को eyes/nose के सामने नहीं,
       forehead के ऊपर रखा जा रहा है।
    */

    const headTop =
        forehead.y -
        faceHeight * 0.32;


    /* -------------------------------------
       SCREEN → THREE
    ------------------------------------- */

    const targetX =
        (headX - 0.5) * 2;


    const targetY =
        -(headTop - 0.5) * 2;


    /*
       Z को negative रखने से
       model camera के सामने
       sticker जैसा नहीं रहेगा।
    */

    const targetZ =
        -0.35;


    /* -------------------------------------
       SMOOTH POSITION
    ------------------------------------- */

    model.position.x +=
        (
            targetX -
            model.position.x
        ) * 0.22;


    model.position.y +=
        (
            targetY -
            model.position.y
        ) * 0.22;


    model.position.z +=
        (
            targetZ -
            model.position.z
        ) * 0.22;


    /* -------------------------------------
       AUTO SCALE
    ------------------------------------- */

    const scale =
        getModelScale(faceWidth);


    model.scale.lerp(
        new THREE.Vector3(
            scale,
            scale,
            scale
        ),
        0.18
    );


    /* -------------------------------------
       STATUS
    ------------------------------------- */

    document.getElementById("status")
        .textContent =
        "Head lock: ACTIVE ✓";
}


/* =========================================
   RUN AFTER MODEL LOAD
========================================= */

/*
   जब GLB load हो जाए,
   prepareModel() चलाएँ।
*/

const originalPrepareInput =
    document.getElementById("glbInput");


originalPrepareInput.addEventListener(
    "change",
    function(){

        setTimeout(
            function(){

                if(model){

                    prepareModel();

                }

            },
            300
        );

    }
);


/* =========================================
   HEAD UPDATE HELPER
========================================= */

function updateModelHeadPosition(face){

    if(!model) return;

    placeModelOnHead(face);

}


/* =========================================
   RESET MODEL
========================================= */

function resetModelPosition(){

    if(!model) return;


    model.position.set(
        0,
        0,
        0
    );


    model.rotation.set(
        0,
        0,
        0
    );


    model.scale.set(
        1,
        1,
        1
    );


    document.getElementById("status")
        .textContent =
        "Model reset";
}

</script><script>

/* =========================================
   PART 5 — FINAL TRACKING CONNECTION
========================================= */

let trackingStarted = false;


/* =========================================
   START TRACKING
========================================= */

async function startTracking(){

    if(trackingStarted) return;

    trackingStarted = true;


    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject = stream;


        await video.play();


        /* Start MediaPipe */

        if(!faceMesh){

            startFaceTracking();

        }


        document.getElementById("status")
            .textContent =
            "Camera + Head Tracking ACTIVE ✓";


    }catch(error){

        console.error(error);

        trackingStarted = false;


        document.getElementById("status")
            .textContent =
            "Camera permission denied";


    }

}


/* =========================================
   REPLACE OLD CAMERA BUTTON
========================================= */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    function(){

        startTracking();

    }
);


/* =========================================
   FINAL MODEL UPDATE
========================================= */

function finalHeadUpdate(face){

    if(!model) return;


    /*
       Position
    */

    updateModelHeadPosition(face);


    /*
       Rotation
    */

    updateHeadRotation(face);

}


/* =========================================
   FINAL FACE RESULT
========================================= */

function finalFaceResults(results){

    if(
        !results ||
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        return;

    }


    const face =
        results.multiFaceLandmarks[0];


    if(!model) return;


    finalHeadUpdate(face);

}


/* =========================================
   CONNECT MEDIAPIPE

function setupFinalFaceMesh(){

    faceMesh =
        new FaceMesh({

            locateFile:function(file){

                return
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
                + file;

            }

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.55,

        minTrackingConfidence:0.55

    });


    faceMesh.onResults(
        finalFaceResults
    );

}


/* =========================================
   TRACKING LOOP
========================================= */

async function finalTrackingLoop(){

    if(
        faceMesh &&
        video &&
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        try{

            await faceMesh.send({

                image:video

            });

        }catch(error){

            console.log(
                "Tracking:",
                error
            );

        }

    }


    requestAnimationFrame(
        finalTrackingLoop
    );

}


/* =========================================
   INITIALIZE
========================================= */

window.addEventListener(
    "load",
    function(){

        /*
           अगर Part 2 वाला FaceMesh
           पहले से बना है तो उसे रहने दें।
        */

        if(!faceMesh){

            setupFinalFaceMesh();

        }


        finalTrackingLoop();

    }
);


/* =========================================
   KEYBOARD SHORTCUTS
========================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(!model) return;


        /*
           Arrow keys = height
        */

        if(e.key === "ArrowUp"){

            height.value =
                Math.min(
                    1,
                    Number(height.value) + 0.02
                );

            updateManual();

        }


        if(e.key === "ArrowDown"){

            height.value =
                Math.max(
                    -0.5,
                    Number(height.value) - 0.02
                );

            updateManual();

        }


        /*
           Q / E = Y rotation
        */

        if(e.key.toLowerCase() === "q"){

            ry.value =
                Number(ry.value) - 0.05;

            updateManual();

        }


        if(e.key.toLowerCase() === "e"){

            ry.value =
                Number(ry.value) + 0.05;

            updateManual();

        }

    }
);


/* =========================================
   FINAL STATUS
========================================= */

console.log(
    "3D Head Tracker initialized"
);

</script>
