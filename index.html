<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez AR - Full Screen</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #cameraStream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .ui-layer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 95%;
            max-width: 600px;
        }
        button, label.upload-btn {
            padding: 10px 14px;
            font-size: 14px;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label.upload-btn {
            background: #ffc107;
            color: #000;
        }
        input[type="file"] {
            display: none;
        }
        #recordBtn { background: #28a745; }
        #stopBtn { background: #dc3545; display: none; }
        #downloadLink {
            background: #17a2b8;
            color: #fff;
            text-decoration: none;
            display: none;
            align-items: center;
        }
    </style>

    <!-- Libraries for Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- Full Screen Camera Background -->
    <video id="cameraStream" autoplay playsinline muted></video>

    <!-- 3D Canvas Layer -->
    <div id="webgl-container"></div>

    <!-- UI Controls Layer -->
    <div class="ui-layer">
        <button id="flipBtn">Flip Camera</button>
        <label class="upload-btn">
            Upload 3D
            <input type="file" id="fileInput" accept=".glb,.gltf">
        </label>
        <button id="recordBtn">Start Rec</button>
        <button id="stopBtn">Stop Rec</button>
        <a id="downloadLink" download="azeez-ar-video.webm">Download</a>
    </div>

    <script>
        const videoElement = document.getElementById('cameraStream');
        const flipBtn = document.getElementById('flipBtn');
        const fileInput = document.getElementById('fileInput');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');
        
        let useFrontCamera = true;
        let currentStream;
        let scene, camera, renderer, currentModel;
        let mediaRecorder;
        let recordedChunks = [];

        // Start camera function
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (error) {
                alert("Camera error: " + error);
            }
        }

        flipBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Three.js 3D setup
        function init3D() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                currentModel.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        // Upload and load 3D file (GLB)
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();

                loader.parse(contents, '', (gltf) => {
                    if (currentModel) {
                        scene.remove(currentModel);
                    }
                    currentModel = gltf.scene;
                    currentModel.scale.set(1.5, 1.5, 1.5);
                    scene.add(currentModel);
                }, (error) => {
                    alert("Error loading 3D model: " + error);
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Video Recording logic
        recordBtn.addEventListener('click', () => {
            recordedChunks = [];
            try {
                let options = { mimeType: 'video/webm;codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = {};
                }

                mediaRecorder = new MediaRecorder(currentStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const videoURL = URL.createObjectURL(blob);
                    downloadLink.href = videoURL;
                    downloadLink.style.display = 'inline-block';
                };

                mediaRecorder.start();
                recordBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                downloadLink.style.display = 'none';
            } catch (err) {
                alert("Recording failed: " + err);
            }
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            stopBtn.style.display = 'none';
            recordBtn.style.display = 'inline-block';
        });

        // Start app
        startCamera();
        init3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
