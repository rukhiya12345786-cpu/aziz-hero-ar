
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aziz AI AR Studio</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b11; color: white; font-family: Arial, sans-serif; }
    #container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #controls { position: fixed; z-index: 10; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #101724eF; border-radius: 10px; }
    button, label { border: 1px solid #56647a; border-radius: 8px; background: #263247; color: white; padding: 10px; font-size: 12px; cursor: pointer; }
    input[type=file] { display: none; }
    #status { position: fixed; z-index: 10; bottom: 10px; left: 10px; right: 10px; padding: 10px; border-radius: 8px; background: #101724eF; font-size: 12px; }
    #video-feed { display: none; }
  </style>
</head>

<body>
  <div id="container"></div>

  <div id="controls">
    <button id="startButton">START CAMERA</button>
    <button id="stopButton">STOP CAMERA</button>

    <label for="modelFile">IMPORT 3D MODEL</label>
    <input id="modelFile" type="file" accept=".glb,.gltf,.fbx,.obj,.stl">

    <button id="removeButton">REMOVE MODEL</button>
    <button id="resetButton">RESET MODEL</button>
  </div>

  <video id="video-feed" playsinline muted></video>
  <div id="status">Choose a model or press START CAMERA.</div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const $ = id => document.getElementById(id);
    const container = $('container');
    const status = $('status');

    let mindar = null;
    let anchor = null;
    let importedModel = null;
    let modelUrl = null;
    let cameraStarted = false;

    function say(message) {
      status.textContent = message;
    }

    async function setup() {
      if (mindar) return;

      mindar = new MindARThree({ container });
      const { scene } = mindar;

      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5));

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(0, 1, 2);
      scene.add(light);

      // Face anchor: the imported model is attached to the tracked face.
      anchor = mindar.addAnchor(1);

      mindar.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      mindar.renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );

      mindar.renderer.setAnimationLoop(() => {
        mindar.renderer.render(mindar.scene, mindar.camera);
      });
    }

    async function startCamera() {
      try {
        await setup();

        if (cameraStarted) {
          say('Camera is already running.');
          return;
        }

        await mindar.start();
        cameraStarted = true;
        say('Camera started. Face the camera.');
      } catch (error) {
        console.error(error);
        say('Camera failed. Use HTTPS and allow camera permission.');
      }
    }

    function stopCamera() {
      if (!mindar || !cameraStarted) return;

      try {
        mindar.stop();
      } catch (error) {
        console.warn(error);
      }

      cameraStarted = false;
      say('Camera stopped.');
    }

    function disposeModel(object) {
      object.traverse(child => {
        if (child.geometry) child.geometry.dispose();

        if (child.material) {
          const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];

          materials.forEach(material => {
            Object.values(material).forEach(value => {
              if (value?.isTexture) value.dispose();
            });
            material.dispose();
          });
        }
      });
    }

    function removeModel(showStatus = true) {
      if (importedModel && anchor) {
        anchor.group.remove(importedModel);
        disposeModel(importedModel);
      }

      importedModel = null;

      if (modelUrl) {
        URL.revokeObjectURL(modelUrl);
        modelUrl = null;
      }

      if (showStatus) say('Model removed.');
    }

    async function importModel(file) {
      if (!file) return;

      const extension = file.name.split('.').pop().toLowerCase();
      const supported = ['glb', 'gltf', 'fbx', 'obj', 'stl'];

      if (!supported.includes(extension)) {
        say('Unsupported format. Use GLB, GLTF, FBX, OBJ or STL.');
        return;
      }

      try {
        await setup();
        removeModel(false);
        say('Loading ' + file.name + '...');

        modelUrl = URL.createObjectURL(file);

        if (extension === 'glb' || extension === 'gltf') {
          const result = await new GLTFLoader().loadAsync(modelUrl);
          importedModel = result.scene;
        } else if (extension === 'fbx') {
          importedModel = await new FBXLoader().loadAsync(modelUrl);
        } else if (extension === 'obj') {
          importedModel = await new OBJLoader().loadAsync(modelUrl);
        } else if (extension === 'stl') {
          const geometry = await new STLLoader().loadAsync(modelUrl);
          geometry.computeVertexNormals();

          importedModel = new THREE.Mesh(
            geometry,
            new THREE.MeshStandardMaterial({
              color: 0xd9dce5,
              metalness: 0.1,
              roughness: 0.7
            })
          );
        }

        importedModel.traverse(child => {
          if (child.isMesh && child.material) {
            child.material.side = THREE.DoubleSide;
            child.material.needsUpdate = true;
          }
        });

        // Initial test size and position; model units vary by file.
        importedModel.position.set(0, 0, 0);
        importedModel.rotation.set(0, 0, 0);
        importedModel.scale.setScalar(0.1);

        anchor.group.add(importedModel);
        say('Model imported and attached to the face anchor.');
      } catch (error) {
        console.error(error);
        removeModel(false);
        say('Import failed. Try a self-contained GLB file.');
      }
    }

    $('startButton').addEventListener('click', startCamera);
    $('stopButton').addEventListener('click', stopCamera);
    $('removeButton').addEventListener('click', () => removeModel());

    $('resetButton').addEventListener('click', () => {
      if (!importedModel) {
        say('Import a model first.');
        return;
      }

      importedModel.position.set(0, 0, 0);
      importedModel.rotation.set(0, 0, 0);
      importedModel.scale.setScalar(0.1);
      say('Model reset.');
    });

    $('modelFile').addEventListener('change', event => {
      const file = event.target.files?.[0];
      if (file) importModel(file);
      event.target.value = '';
    });

    window.addEventListener('resize', () => {
      if (!mindar) return;

      mindar.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      mindar.renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );
    });

    say('Ready. Import a model or start the camera.');
  </script>
</body>
</html>
