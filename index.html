<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Face Tracking Adjuster</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            outline: none;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.96);
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(18, 18, 18, 0.9);
            padding: 14px 16px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            z-index: 100;
            color: #fff;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        .slider-group {
            margin-bottom: 10px;
        }
        .slider-group:last-child {
            margin-bottom: 0;
        }
        .slider-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            color: #ccc;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <button class="btn" id="import-btn">Import Model</button>
        <button class="btn" id="flip-cam-btn">Flip Cam</button>
        <button class="btn" id="record-btn">Record</button>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label>Scale (Size)</label>
            <input type="range" id="scale-slider" min="0.5" max="3" step="0.05" value="1">
        </div>
        <div class="slider-group">
            <label>Position X (Left/Right)</label>
            <input type="range" id="pos-x-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Y (Up/Down)</label>
            <input type="range" id="pos-y-slider" min="-2" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>Position Z (Depth)</label>
            <input type="range" id="pos-z-slider" min="-5" max="2" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate X</label>
            <input type="range" id="rot-x-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
        <div class="slider-group">
            <label>360° Rotate Y</label>
            <input type="range" id="rot-y-slider" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
    </div>

    <input type="file" id="file-input" accept=".vrm" style="display: none;">

    <script>
        const videoElement = document.getElementById('webcam-video');
        let useFrontCamera = true;
        let currentStream = null;

        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                await videoElement.play();
            } catch (error) {
                console.warn("Camera initialization warning:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });

        document.getElementById('flip-cam-btn').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        const importBtn = document.getElementById('import-btn');
        const fileInput = document.getElementById('file-input');

        importBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                console.log("VRM File Loaded URL:", fileURL);
                alert("Model successfully loaded: " + file.name);
            }
        });
    </script>
</body>
</html>
