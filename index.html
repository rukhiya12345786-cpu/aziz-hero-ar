<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Aziz Hero AR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      color: #fff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;

      transform: none;
      -webkit-transform: none;
    }

    #threeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      background: transparent;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;

      z-index: 20;

      min-height: 38px;
      padding: 10px 12px;

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.62);
      color: #fff;

      font-size: 13px;
      line-height: 18px;

      pointer-events: none;

      overflow-wrap: anywhere;
    }

    #status[data-state="error"] {
      background: rgba(120, 0, 0, 0.82);
    }

    #topControls {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;

      z-index: 30;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;

      padding: 8px;

      border-radius: 14px;

      background: rgba(0, 0, 0, 0.60);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button,
    select {
      min-height: 42px;

      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;

      padding: 8px 12px;

      background: rgba(255, 255, 255, 0.12);
      color: #fff;

      font-size: 13px;
      font-weight: 600;

      touch-action: manipulation;
    }

    button:active {
      background: rgba(255, 255, 255, 0.25);
    }

    select {
      background: #111;
    }

    option {
      background: #111;
      color: #fff;
    }

    #sideControls {
      position: absolute;

      top: 72px;
      right: 10px;

      z-index: 25;

      width: min(170px, 42vw);

      display: flex;
      flex-direction: column;
      gap: 7px;

      padding: 9px;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #sideControls .controlTitle {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    #sideControls label {
      display: flex;
      flex-direction: column;
      gap: 3px;

      font-size: 10px;
      color: rgba(255, 255, 255, 0.85);
    }

    #sideControls input[type="range"] {
      width: 100%;
      min-height: 22px;
      accent-color: #29a8ff;
    }

    #fileInputs {
      display: none;
    }

    @media (max-width: 520px) {
      #topControls {
        gap: 5px;
        padding: 6px;
      }

      button,
      select {
        min-height: 38px;
        padding: 7px 9px;
        font-size: 11px;
      }

      #sideControls {
        top: 64px;
        width: 145px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <video
      id="camera"
      autoplay
      playsinline
      muted
      disablepictureinpicture
      webkit-playsinline
    ></video>

    <canvas id="threeCanvas"></canvas>

    <div id="status">
      Loading app...
    </div>

    <div id="sideControls">

      <div class="controlTitle">
        3D Controls
      </div>

      <label>
        Scale
        <input
          id="scaleSlider"
          type="range"
          min="0.1"
          max="5"
          step="0.01"
          value="1"
        >
      </label>

      <label>
        X Position
        <input
          id="xSlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </label>

      <label>
        Y Position
        <input
          id="ySlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </label>

      <label>
        Z Position
        <input
          id="zSlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </label>

      <label>
        Rotate X
        <input
          id="rotateXSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </label>

      <label>
        Rotate Y
        <input
          id="rotateYSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </label>

      <label>
        Rotate Z
        <input
          id="rotateZSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </label>

    </div>

    <div id="topControls">

      <button
        id="cameraButton"
        type="button"
      >
        Open Camera
      </button>

      <button
        id="switchCameraButton"
        type="button"
      >
        Switch Camera
      </button>

      <button
        id="photoButton"
        type="button"
      >
        Photo
      </button>

      <button
        id="recordButton"
        type="button"
      >
        Record
      </button>

      <button
        id="audioButton"
        type="button"
      >
        Audio
      </button>

      <button
        id="trackingButton"
        type="button"
      >
        Face Tracking
      </button>

      <button
        id="modelButton"
        type="button"
      >
        Model Controls
      </button>

      <button
        id="import3DButton"
        type="button"
      >
        Import 3D
      </button>

      <input
        id="import3DInput"
        type="file"
        accept=".glb,.gltf,.obj,.stl,model/gltf-binary,model/gltf+json,model/obj,model/stl"
      >

      <button
        id="export3DButton"
        type="button"
      >
        Export 3D
      </button>

      <select
        id="exportFormat"
        aria-label="Export format"
      >
        <option value="glb">
          GLB
        </option>

        <option value="gltf">
          GLTF
        </option>

        <option value="obj">
          OBJ
        </option>
      </select>

      <button
        id="resetButton"
        type="button"
      >
        Reset
      </button>

    </div>    <div id="fileInputs">
    </div>

  </main>

  <script type="module" src="./js/app.js?v=20260926"></script>

</body>
</html>
