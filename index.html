
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZEEZ AI AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

#container video {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 1 !important;
}

#container canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
}

#topbar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

#brand, #status {
  color: white;
  background: #000b;
  padding: 10px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: bold;
}

button {
  background: #202020ee;
  color: white;
  border: 1px solid #555;
  border-radius: 9px;
  padding: 11px 12px;
  font-size: 12px;
  font-weight: bold;
}

button.active {
  background: #075fc5;
}

button:disabled {
  opacity: .45;
}

#message {
  position: fixed;
  z-index: 25;
  bottom: 105px;
  left: 10px;
  right: 10px;
  padding: 9px;
  background: #0009;
  color: white;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}

#controls {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: 12px;
  z-index: 30;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
}

#transformPanel {
  position: fixed;
  top: 62px;
  right: 10px;
  z-index: 35;
  display: flex;
  flex-direction: column;
  gap: 7px;
  width: 125px;
}

#transformPanel button {
  width: 100%;
}

#sizePanel {
  position: fixed;
  top: 62px;
  left: 10px;
  z-index: 35;
  width: 165px;
  padding: 10px;
  border-radius: 9px;
  background: #000c;
  color: white;
  font-size: 12px;
}

#sizePanel label {
  display: block;
  margin-bottom: 9px;
  font-weight: bold;
}

#sizeSlider {
  width: 100%;
  accent-color: #087cff;
}

#sizeValue {
  display: block;
  margin-top: 7px;
  text-align: center;
}

#toggleAllBtn {
  position: fixed;
  z-index: 100;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #075fc5;
  border: 1px solid white;
  padding: 10px 15px;
}

.hidden {
  display: none !important;
}

#fileInput, #imageInput, #videoInput {
  display: none;
}

@media (orientation: landscape) {
  #controls {
    left: auto;
    right: 10px;
    bottom: 10px;
    width: 190px;
  }

  #controls button {
    flex: 1 1 75px;
  }

  #message {
    bottom: 10px;
    left: 10px;
    right: 210px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<button id="toggleAllBtn">HIDE ALL</button>

<div id="topbar" class="ui-panel">
  <div id="brand">AZEEZ AI AR STUDIO</div>
  <div id="status">Camera stopped</div>
</div>

<div id="message" class="ui-panel">
  Press START CAMERA and allow camera permission.
</div>

<div id="transformPanel" class="ui-panel">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
  <button id="scaleBtn">SCALE GIZMO</button>
  <button id="hideGizmoBtn">HIDE GIZMO</button>
</div>

<div id="sizePanel" class="ui-panel">
  <label for="sizeSlider">3D MODEL SIZE</label>
  <input id="sizeSlider" type="range"
    min="0.1" max="3" step="0.01" value="1">
  <span id="sizeValue">100%</span>
</div>

<div id="controls" class="ui-panel">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="stopBtn">STOP CAMERA</button>
  <button id="importBtn">IMPORT 3D</button>
  <button id="imageBtn">IMPORT IMAGE</button>
  <button id="videoBtn">IMPORT VIDEO</button>
  <button id="disposeBtn">DISPOSE</button>
  <button id="fullBtn">FULL SCREEN</button>
</div>

<input id="fileInput" type="file"
  accept=".glb,.gltf,.obj,.fbx">

<input id="imageInput" type="file"
  accept="image/*">

<input id="videoInput" type="file"
  accept="video/*">

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { MindARThree } from "mindar-face-three";

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const messageBox = document.querySelector("#message");

const fileInput = document.querySelector("#fileInput");
const imageInput = document.querySelector("#imageInput");
const videoInput = document.querySelector("#videoInput");

const startBtn = document.querySelector("#startBtn");

let mindarThree = null;
let anchor = null;
let avatar = null;
let importedContent = null;
let transformControls = null;

let running = false;
let starting = false;
let gizmoVisible = true;
let allVisible = true;
let currentMode = "translate";

let baseScale = new THREE.Vector3(1, 1, 1);
let currentSizeObject = null;
let activeVideo = null;
let activeObjectURL = null;

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const url =
      "https://storage.googleapis.com/mediapipe-tasks/face_landmarker/raccoon_head.glb";

    const loader = new GLTFLoader();

    this.gltf = await new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });

    this.gltf.scene.traverse((object) => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }
    });
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes || !blendshapes.categories) return;

    const values = new Map();

    for (const item of blendshapes.categories) {
      values.set(item.categoryName, item.score);
    }

    for (const mesh of this.morphTargetMeshes) {
      const dictionary = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      for (const [name, value] of values) {
        const index = dictionary[name];

        if (index !== undefined) {
          mesh.morphTargetInfluences[index] = value;
        }
      }
    }
  }
}

function setStatus(text) {
  statusBox.textContent = text;
}

function setMessage(text) {
  messageBox.textContent = text;
}

async function startCamera() {
  if (starting || running) return;

  starting = true;
  startBtn.disabled = true;

  setStatus("Starting...");
  setMessage("Loading face tracking. Please wait.");

  try {
    mindarThree = new MindARThree({
      container,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5)
    );

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 2);
    scene.add(light);

    anchor = mindarThree.addAnchor(1);

    if (!avatar) {
      avatar = new Avatar();
      await avatar.init();
    }

    avatar.gltf.scene.scale.set(2, 2, 2);
    anchor.group.add(avatar.gltf.scene);

    transformControls = new TransformControls(
      camera,
      renderer.domElement
    );

    transformControls.setMode(currentMode);
    transformControls.setSize(0.8);
    transformControls.enabled = false;

    scene.add(transformControls);

    await mindarThree.start();

    running = true;

    setStatus("Camera running");
    setMessage("Face tracking active.");

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();

      if (estimate && estimate.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);
    });

    attachGizmo(avatar.gltf.scene);
    setSizeTarget(avatar.gltf.scene);

  } catch (error) {
    console.error(error);

    setStatus("Start error");
    setMessage(error.message || "Camera could not start.");

    if (mindarThree) {
      try {
        mindarThree.renderer?.setAnimationLoop(null);
        await mindarThree.stop();
      } catch (e) {}
    }

    mindarThree = null;
    running = false;

  } finally {
    starting = false;
    startBtn.disabled = false;
  }
}

function attachGizmo(object) {
  if (!transformControls || !object) return;

  transformControls.attach(object);
  transformControls.enabled = gizmoVisible;
  transformControls.visible = gizmoVisible;
}

function setSizeTarget(object) {
  currentSizeObject = object;

  if (object) {
    baseScale.copy(object.scale);
    document.querySelector("#sizeSlider").value = 1;
    document.querySelector("#sizeValue").textContent = "100%";
  }
}

document.querySelector("#sizeSlider").addEventListener("input", (event) => {
  if (!currentSizeObject) return;

  const value = Number(event.target.value);

  currentSizeObject.scale.set(
    baseScale.x * value,
    baseScale.y * value,
    baseScale.z * value
  );

  document.querySelector("#sizeValue").textContent =
    Math.round(value * 100) + "%";
});

async function stopCamera() {
  if (!mindarThree) return;

  try {
    transformControls?.detach();
    transformControls?.dispose();

    mindarThree.renderer?.setAnimationLoop(null);
    await mindarThree.stop();
  } catch (error) {
    console.error(error);
  }

  mindarThree = null;
  transformControls = null;
  anchor = null;
  running = false;

  container.innerHTML = "";

  setStatus("Camera stopped");
  setMessage("Press START CAMERA to begin.");
}

startBtn.addEventListener("click", startCamera);

document.querySelector("#stopBtn").addEventListener(
  "click", stopCamera
);

document.querySelector("#switchBtn").addEventListener(
  "click", async () => {
    if (!running || !mindarThree) {
      setMessage("Start the camera first.");
      return;
    }

    try {
      setMessage("Switching camera...");
      await mindarThree.switchCamera();
      setMessage("Camera switched.");
    } catch (error) {
      console.error(error);
      setMessage("Camera switch failed: " + error.message);
    }
  }
);

function setActiveMode(id) {
  ["moveBtn", "rotateBtn", "scaleBtn"].forEach((buttonId) => {
    document.getElementById(buttonId).classList.toggle(
      "active",
      buttonId === id
    );
  });
}

document.querySelector("#moveBtn").addEventListener("click", () => {
  currentMode = "translate";
  transformControls?.setMode("translate");
  setActiveMode("moveBtn");
});

document.querySelector("#rotateBtn").addEventListener("click", () => {
  currentMode = "rotate";
  transformControls?.setMode("rotate");
  setActiveMode("rotateBtn");
});

document.querySelector("#scaleBtn").addEventListener("click", () => {
  currentMode = "scale";
  transformControls?.setMode("scale");
  setActiveMode("scaleBtn");
});

document.querySelector("#hideGizmoBtn").addEventListener("click", () => {
  gizmoVisible = !gizmoVisible;

  if (transformControls) {
    transformControls.enabled = gizmoVisible;
    transformControls.visible = gizmoVisible;
  }

  document.querySelector("#hideGizmoBtn").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
});

// Show / Hide all interface panels.
// This button remains visible at all times.
document.querySelector("#toggleAllBtn").addEventListener("click", () => {
  allVisible = !allVisible;

  document.querySelectorAll(".ui-panel").forEach((panel) => {
    panel.classList.toggle("hidden", !allVisible);
  });

  document.querySelector("#toggleAllBtn").textContent =
    allVisible ? "HIDE ALL" : "SHOW ALL";
});

document.querySelector("#importBtn").addEventListener("click", () => {
  fileInput.click();
});

document.querySelector("#imageBtn").addEventListener("click", () => {
  imageInput.click();
});

document.querySelector("#videoBtn").addEventListener("click", () => {
  videoInput.click();
});

function removeContent() {
  if (!importedContent) return;

  transformControls?.detach();

  importedContent.traverse((child) => {
    if (child.geometry) child.geometry.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach((material) => {
        for (const key in material) {
          const value = material[key];
          if (value && value.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });

  importedContent.removeFromParent();
  importedContent = null;
  currentSizeObject = null;

  if (activeVideo) {
    activeVideo.pause();
    activeVideo.removeAttribute("src");
    activeVideo.load();
    activeVideo = null;
  }

  if (activeObjectURL) {
    URL.revokeObjectURL(activeObjectURL);
    activeObjectURL = null;
  }
}

async function load3DFile(file) {
  if (!running || !anchor) {
    setMessage("Start the camera before importing a model.");
    return;
  }

  setMessage("Loading 3D model...");

  const extension = file.name.split(".").pop().toLowerCase();
  const objectURL = URL.createObjectURL(file);

  try {
    let model = null;

    if (extension === "glb" || extension === "gltf") {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(objectURL);
      model = gltf.scene;
    } else if (extension === "obj") {
      model = await new OBJLoader().loadAsync(objectURL);
    } else if (extension === "fbx") {
      model = await new FBXLoader().loadAsync(objectURL);
    } else {
      throw new Error("Unsupported model format.");
    }

    removeContent();

    if (avatar?.gltf?.scene) {
      avatar.gltf.scene.visible = false;
    }

    importedContent = model;
    anchor.group.add(importedContent);

    importedContent.position.set(0, 0, 0);
    importedContent.rotation.set(0, 0, 0);
    importedContent.scale.set(1, 1, 1);

    attachGizmo(importedContent);
    setSizeTarget(importedContent);

    setMessage("3D model imported. Use the size slider and Gizmos.");

    // Keep the loaded object URL alive while the model is in use.
    activeObjectURL = objectURL;

  } catch (error) {
    URL.revokeObjectURL(objectURL);
    console.error(error);
    setMessage("3D import error: " + error.message);
  }
}

fileInput.addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) await load3DFile(file);
  fileInput.value = "";
});

function createMediaPlane(texture, videoElement = null) {
  const geometry = new THREE.PlaneGeometry(1.5, 1.5);

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide
  });

  const plane = new THREE.Mesh(geometry, material);

  removeContent();

  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = false;
  }

  importedContent = plane;
  anchor.group.add(plane);

  plane.position.set(0, 0, 0);
  plane.rotation.set(0, 0, 0);
  plane.scale.set(1, 1, 1);

  attachGizmo(plane);
  setSizeTarget(plane);

  if (videoElement) {
    activeVideo = videoElement;
  }

  return plane;
}

imageInput.addEventListener("change", (event) => {
  const file = event.target.files[0];

  if (!file) return;

  if (!running || !anchor) {
    setMessage("Start the camera before importing an image.");
    imageInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const textureLoader = new THREE.TextureLoader();

  textureLoader.load(
    url,
    (texture) => {
      createMediaPlane(texture);
      activeObjectURL = url;
      setMessage("Image imported successfully.");
    },
    undefined,
    (error) => {
      URL.revokeObjectURL(url);
      console.error(error);
      setMessage("Image import failed.");
    }
  );

  imageInput.value = "";
});

videoInput.addEventListener("change", (event) => {
  const file = event.target.files[0];

  if (!file) return;

  if (!running || !anchor) {
    setMessage("Start the camera before importing a video.");
    videoInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const video = document.createElement("video");

  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.autoplay = true;

  video.addEventListener("loadeddata", async () => {
    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;

    createMediaPlane(texture, video);
    activeObjectURL = url;

    try {
      await video.play();
      setMessage("Video imported and playing.");
    } catch (error) {
      setMessage("Video imported. Tap the screen to play it.");
    }
  }, { once: true });

  video.addEventListener("error", () => {
    URL.revokeObjectURL(url);
    setMessage("Video import failed.");
  }, { once: true });

  videoInput.value = "";
});

document.querySelector("#disposeBtn").addEventListener("click", () => {
  if (!importedContent) {
    setMessage("No imported content to dispose.");
    return;
  }

  removeContent();

  if (avatar?.gltf?.scene) {
    avatar.gltf.scene.visible = true;
    attachGizmo(avatar.gltf.scene);
    setSizeTarget(avatar.gltf.scene);
  }

  setMessage("Imported content removed.");
});

document.querySelector("#fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen is not available.");
  }
});

window.addEventListener("beforeunload", () => {
  try {
    mindarThree?.stop();
  } catch (error) {}
});
</script>
</body>
</html>
