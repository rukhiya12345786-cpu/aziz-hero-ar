<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aziz AR Test</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#camera{
  width:100%;
  height:100%;
  object-fit:cover;
}

#canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#status{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  z-index:10;
  padding:12px;
  background:#000c;
  color:white;
  border-radius:10px;
  font-family:Arial;
  font-size:15px;
}

#switch{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:14px 20px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="status">Starting camera...</div>

<button id="switch">🔄 Front / Back</button>

<script type="module">

import {
  FaceDetector,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const switchButton = document.getElementById("switch");

let stream = null;
let detector = null;
let facingMode = "user";


/* =========================
   CAMERA FIRST
========================= */

async function startCamera(){

  try{

    if(stream){
      stream.getTracks().forEach(track => track.stop());
    }

    status.textContent = "📷 Starting camera...";

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facingMode
      },
      audio:false
    });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    status.textContent =
      "📷 CAMERA WORKING — Loading Face Detector...";

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ CAMERA ERROR: " + error.message;

  }
}


/* =========================
   FACE DETECTOR
========================= */

async function loadDetector(){

  try{

    status.textContent =
      "📷 Camera OK — Loading Face Detector...";

    const vision =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

    detector =
      await FaceDetector.createFromOptions(
        vision,
        {
          baseOptions:{
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/face_detector/float16/1/face_detector.tflite"
          },

          runningMode:"VIDEO",

          minDetectionConfidence:0.5
        }
      );

    status.textContent =
      "✅ CAMERA + FACE DETECTOR READY";

    detectFace();

  }catch(error){

    console.error(error);

    status.textContent =
      "⚠️ CAMERA WORKS — FACE DETECTOR ERROR: "
      + error.message;

  }
}


/* =========================
   FACE DETECTION
========================= */

function detectFace(){

  if(!detector){
    return;
  }

  if(video.readyState < 2){

    requestAnimationFrame(detectFace);

    return;
  }

  try{

    const result =
      detector.detectForVideo(
        video,
        performance.now()
      );

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    if(
      result.detections &&
      result.detections.length > 0
    ){

      const box =
        result.detections[0].boundingBox;

      const sx =
        canvas.width / video.videoWidth;

      const sy =
        canvas.height / video.videoHeight;

      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth = 4;

      ctx.strokeRect(
        box.originX * sx,
        box.originY * sy,
        box.width * sx,
        box.height * sy
      );

      status.textContent =
        "🙂 FACE DETECTED";

    }else{

      status.textContent =
        "📷 CAMERA OK — FACE NOT FOUND";

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "⚠️ DETECTION ERROR: " + error.message;

  }

  requestAnimationFrame(detectFace);
}


/* =========================
   RESIZE
========================= */

function resizeCanvas(){

  canvas.width =
    video.videoWidth || window.innerWidth;

  canvas.height =
    video.videoHeight || window.innerHeight;

}


/* =========================
   FRONT / BACK
========================= */

switchButton.addEventListener(
  "click",
  async()=>{

    facingMode =
      facingMode === "user"
      ? "environment"
      : "user";

    await startCamera();

  }
);


video.addEventListener(
  "loadedmetadata",
  resizeCanvas
);

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   START
========================= */

startCamera();

loadDetector();

</script>

</body>
</html>
