<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Hero AR Studio</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px; box-sizing: border-box;
        }
        .control-group { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; }
        button, label.btn {
            background: #ff0055; color: white; border: none; padding: 10px 14px;
            font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center;
        }
        button:active, label.btn:active { background: #cc0044; }
        input[type="file"] { display: none; }
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        #bottom-bar { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; }
        #record-btn { background: #ff3333; width: 65px; height: 65px; border-radius: 50%; border: 4px solid white; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #record-btn.recording { background: #222; animation: pulse 1s infinite; border-color: #ff3333; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #permission-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.98); z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px; box-sizing: border-box;
        }
        #start-app-btn { 
            background: #ffffff; color: #000000; font-size: 18px; font-weight: bold; 
            padding: 16px 30px; border-radius: 10px; margin-top: 20px; border: none;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255,255,255,0.3); pointer-events: auto;
        }
        #error-box { margin-top: 15px; font-size: 12px; color: #ff4444; max-width: 90%; word-break: break-all; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="permission-screen">
        <h1 style="margin: 0 0 10px 0; font-size: 24px;">Aziz Hero AR Studio</h1>
        <p style="margin: 0; color: #aaa;">Click below to start camera & AR</p>
        <button id="start-app-btn">TAP TO START CAMERA</button>
        <div id="error-box"></div>
    </div>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="top-bar">
            <div class="control-group">
                <label class="btn" for="file-input">Import 3D Model</label>
                <input type="file" id="file-input" accept=".obj,.gltf,.glb">
                <button id="export-btn">Snapshot</button>
            </div>
            <div class="control-group">
                <button id="cam-switch-btn">Flip Cam</button>
            </div>
        </div>

        <div id="bottom-bar">
            <div class="control-group" style="background: transparent; padding: 0;">
                <button id="record-btn" title="Record Video"></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, currentModel;
        let useFrontCamera = true;
        let videoElement, mediaStream;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        const errorBox = document.getElementById('error-box');

        document.getElementById('start-app-btn').addEventListener('click', async () => {
            errorBox.innerText = "Connecting to camera...";
            try {
                await initAR();
                document.getElementById('permission-screenstyle').display = 'none'; // Safe property
                document.getElementById('permission-screen').style.display = 'none';
            } catch (err) {
                console.error(err);
                errorBox.innerHTML = `<b>Failed:</b> ${err.message}<br><br>Tip: Ensure you are using <b>HTTPS</b> and camera permission is allowed in your browser site settings.`;
            }
        });

        async function initAR() {
            videoElement = document.getElementById('video-bg');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            createDefaultModel();
            camera.position.z = 2.5;

            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', handleFileImport);
            document.getElementById('export-btn').addEventListener('click', exportPhoto);
            document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);
            document.getElementById('record-btn').addEventListener('click', toggleRecording);

            await startCamera();
            animate();
        }

        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            let constraints = {
                video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                audio: true
            };
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (e) {
                // Fallback if specific facingMode fails
                console.warn("Retrying with default constraints...", e);
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }

            videoElement.srcObject = mediaStream;
            await videoElement.play();
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try {
                await startCamera();
            } catch (err) {
                alert('Could not switch camera: ' + err.message);
            }
        }

        function createDefaultModel() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff6688, roughness: 0.3 });
            currentModel = new THREE.Mesh(geometry, material);
            scene.add(currentModel);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                currentModel.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = function (e) {
                    const loader = new THREE.OBJLoader();
                    const obj = loader.parse(e.target.result);
                    replaceModel(obj);
                };
            } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(e.target.result, '', function (gltf) {
                        replaceModel(gltf.scene);
                    }, function (error) {
                        alert('Error loading 3D model file');
                    });
                };
            } else {
                alert('Please select .obj, .gltf or .glb format.');
            }
        }

        function replaceModel(newObj) {
            if (currentModel) scene.remove(currentModel);
            currentModel = newObj;
            currentModel.scale.set(1.2, 1.2, 1.2);
            scene.add(currentModel);
        }

        function exportPhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'aziz-ar-snapshot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                if (!mediaStream) {
                    alert('Camera not ready yet.');
                    return;
                }
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9,opus' });
                } catch (e) {
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/mp4' });
                    } catch (err) {
                        mediaRecorder = new MediaRecorder(mediaStream);
                    }
                }

                recordedChunks = [];
                mediaRecorder.ondataavailable = function (e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = function () {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'aziz-ar-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>
        </html>
