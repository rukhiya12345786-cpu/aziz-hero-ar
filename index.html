<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

#threeCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

#landmarkCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}

#ui {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 20;
  max-height: calc(100vh - 30px);
  overflow-y: auto;
  padding-bottom: 20px;
}

#status {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: #00ff00;
  font-size: 14px;
  font-weight: bold;
}

button {
  display: block;
  margin-top: 10px;
  padding: 12px 18px;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

#startButton {
  background: #00ff00;
  color: #000;
}

#switchCameraButton {
  background: #0088ff;
  color: #fff;
}

#mirrorButton {
  background: #ff8800;
  color: #fff;
}

#recordButton {
  background: #ff1744;
  color: #fff;
}

#modelButton {
  background: #fff;
  color: #000;
}

#importSettingsButton {
  background: #00b894;
  color: #fff;
}

#exportButton {
  background: #6c5ce7;
  color: #fff;
}

#fitButton {
  background: #9b59ff;
  color: #fff;
}

#resetButton {
  background: #ffcc00;
  color: #000;
}

#modelInput,
#importSettingsInput {
  display: none;
}

#controls {
  display: none;
  margin-top: 12px;
  padding: 12px;
  max-width: 360px;
  border-radius: 14px;
  background: rgba(0,0,0,.78);
}

#controlsTitle {
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}

.control {
  margin-top: 9px;
}

.controlTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
  font-size: 13px;
  margin-bottom: 4px;
}

.controlValue {
  color: #00ff00;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  height: 28px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js?v=19",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>

<canvas id="landmarkCanvas"></canvas>

<div id="ui">

  <div id="status">READY</div>

  <button id="startButton">
    START CAMERA
  </button>

  <button id="switchCameraButton">
    SWITCH CAMERA
  </button>

  <button id="mirrorButton">
    MIRROR FLIP: OFF
  </button>

  <button id="recordButton">
    START RECORDING
  </button>

  <button id="modelButton">
    IMPORT GLB MODEL
  </button>

  <button id="importSettingsButton">
    IMPORT SETTINGS
  </button>

  <button id="exportButton">
    EXPORT SETTINGS
  </button>

  <input
    id="modelInput"
    type="file"
    accept=".glb"
  >

  <input
    id="importSettingsInput"
    type="file"
    accept=".json"
  >

  <div id="controls">

    <div id="controlsTitle">
      MODEL ADJUSTMENT
    </div>

    <button id="fitButton">
      HEAD FIT MODE
    </button>

    <div class="control">

      <div class="controlTop">
        <span>X Position</span>
        <span id="xValue" class="controlValue">
          0.00
        </span>
      </div>

      <input
        id="xSlider"
        type="range"
        min="-2"
        max="2"
        step="0.01"
        value="0"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Y Position</span>
        <span id="yValue" class="controlValue">
          0.00
        </span>
      </div>

      <input
        id="ySlider"
        type="range"
        min="-2"
        max="2"
        step="0.01"
        value="0"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Z Position</span>
        <span id="zValue" class="controlValue">
          0.00
        </span>
      </div>

      <input
        id="zSlider"
        type="range"
        min="-3"
        max="3"
        step="0.01"
        value="0"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Scale</span>
        <span id="scaleValue" class="controlValue">
          1.00
        </span>
      </div>

      <input
        id="scaleSlider"
        type="range"
        min="0.1"
        max="3"
        step="0.01"
        value="1"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Rotate X</span>
        <span id="rotXValue" class="controlValue">
          0°
        </span>
      </div>

      <input
        id="rotXSlider"
        type="range"
        min="-360"
        max="360"
        step="1"
        value="0"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Rotate Y</span>
        <span id="rotYValue" class="controlValue">
          0°
        </span>
      </div>

      <input
        id="rotYSlider"
        type="range"
        min="-360"
        max="360"
        step="1"
        value="0"
      >

    </div>

    <div class="control">

      <div class="controlTop">
        <span>Rotate Z</span>
        <span id="rotZValue" class="controlValue">
          0°
        </span>
      </div>

      <input
        id="rotZSlider"
        type="range"
        min="-360"
        max="360"
        step="1"
        value="0"
      >

    </div>

    <button id="resetButton">
      RESET MODEL
    </button>

  </div>
</div>

<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


const video =
  document.getElementById("camera");

const threeCanvas =
  document.getElementById("threeCanvas");

const landmarkCanvas =
  document.getElementById("landmarkCanvas");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const switchCameraButton =
  document.getElementById(
    "switchCameraButton"
  );

const mirrorButton =
  document.getElementById(
    "mirrorButton"
  );

const recordButton =
  document.getElementById(
    "recordButton"
  );

const modelButton =
  document.getElementById(
    "modelButton"
  );

const importSettingsButton =
  document.getElementById(
    "importSettingsButton"
  );

const exportButton =
  document.getElementById(
    "exportButton"
  );

const modelInput =
  document.getElementById(
    "modelInput"
  );

const importSettingsInput =
  document.getElementById(
    "importSettingsInput"
  );

const controls =
  document.getElementById(
    "controls"
  );

const fitButton =
  document.getElementById(
    "fitButton"
  );

const resetButton =
  document.getElementById(
    "resetButton"
  );


const xSlider =
  document.getElementById(
    "xSlider"
  );

const ySlider =
  document.getElementById(
    "ySlider"
  );

const zSlider =
  document.getElementById(
    "zSlider"
  );

const scaleSlider =
  document.getElementById(
    "scaleSlider"
  );

const rotXSlider =
  document.getElementById(
    "rotXSlider"
  );

const rotYSlider =
  document.getElementById(
    "rotYSlider"
  );

const rotZSlider =
  document.getElementById(
    "rotZSlider"
  );


const xValue =
  document.getElementById(
    "xValue"
  );

const yValue =
  document.getElementById(
    "yValue"
  );

const zValue =
  document.getElementById(
    "zValue"
  );

const scaleValue =
  document.getElementById(
    "scaleValue"
  );

const rotXValue =
  document.getElementById(
    "rotXValue"
  );

const rotYValue =
  document.getElementById(
    "rotYValue"
  );

const rotZValue =
  document.getElementById(
    "rotZValue"
  );


let faceLandmarker = null;

let trackingStarted = false;

let loadedModel = null;

let modelCenter =
  new THREE.Vector3();

let modelSize =
  new THREE.Vector3();

let headFitEnabled = false;

let currentFacingMode = "user";

let currentStream = null;

let mirrorEnabled = false;

let mediaRecorder = null;

let recordedChunks = [];


const renderer =
  new THREE.WebGLRenderer({
    canvas: threeCanvas,
    alpha: true,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


const threeCamera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
  );

threeCamera.position.set(
  0,
  0,
  5
);


const anchor =
  new THREE.Group();

scene.add(anchor);


const modelPivot =
  new THREE.Group();

anchor.add(modelPivot);


const cubeGeometry =
  new THREE.BoxGeometry(
    1,
    1,
    1
  );


const cubeMaterial =
  new THREE.MeshNormalMaterial({
    transparent: true,
    opacity: 0.65
  });


const cube =
  new THREE.Mesh(
    cubeGeometry,
    cubeMaterial
  );


cube.scale.set(
  0.45,
  0.45,
  0.45
);


modelPivot.add(cube);


const gltfLoader =
  new GLTFLoader();


const defaultModelSettings = {
  x: 0,
  y: 0,
  z: 0,
  scale: 1,
  rotX: 0,
  rotY: 0,
  rotZ: 0
};


async function startCamera() {

  try {

    status.textContent =
      "OPENING CAMERA...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      status.textContent =
        "CAMERA NOT SUPPORTED";

      return;
    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode:
              currentFacingMode,

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false
        });


    currentStream =
      stream;


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      currentFacingMode === "user"
        ? "FRONT CAMERA"
        : "BACK CAMERA";


    startButton.style.display =
      "none";


    await loadFaceTracker();


  } catch (error) {

    console.error(error);

    status.textContent =
      "CAMERA ERROR";
  }
}


async function switchCamera() {

  try {

    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      currentStream = null;
    }


    currentFacingMode =
      currentFacingMode === "user"
        ? "environment"
        : "user";


    status.textContent =
      "SWITCHING CAMERA...";


    let stream;


    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {
              facingMode: {
                exact:
                  currentFacingMode
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });

    } catch (firstError) {

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {
              facingMode:
                currentFacingMode,

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });
    }


    currentStream =
      stream;


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      currentFacingMode === "user"
        ? "FRONT CAMERA"
        : "BACK CAMERA";


  } catch (error) {

    console.error(error);

    status.textContent =
      "CAMERA SWITCH ERROR";
  }
}


function updateMirror() {

  video.style.transform =
    mirrorEnabled
      ? "scaleX(-1)"
      : "scaleX(1)";


  landmarkCanvas.style.transform =
    mirrorEnabled
      ? "scaleX(-1)"
      : "scaleX(1)";


  threeCanvas.style.transform =
    mirrorEnabled
      ? "scaleX(-1)"
      : "scaleX(1)";


  mirrorButton.textContent =
    mirrorEnabled
      ? "MIRROR FLIP: ON"
      : "MIRROR FLIP: OFF";
}


mirrorButton.addEventListener(
  "click",
  () => {

    mirrorEnabled =
      !mirrorEnabled;

    updateMirror();

  }
);


async function loadFaceTracker() {

  try {

    status.textContent =
      "LOADING FACE TRACKER...";


    const vision =
      await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs?v=19"
      );


    const {
      FaceLandmarker,
      FilesetResolver
    } = vision;


    const filesetResolver =
      await FilesetResolver
        .forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
        );


    faceLandmarker =
      await FaceLandmarker
        .createFromOptions(
          filesetResolver,
          {

            baseOptions: {

              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

              delegate:
                "GPU"
            },

            runningMode:
              "VIDEO",

            numFaces:
              1,

            outputFaceBlendshapes:
              false,

            outputFacialTransformationMatrixes:
              true
          }
        );


    status.textContent =
      "FACE TRACKER READY";


    trackingStarted =
      true;


    requestAnimationFrame(
      trackFace
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "TRACKER ERROR";
  }
}


function drawLandmarks(
  landmarks
) {

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  landmarkCanvas.width =
    Math.round(
      width * dpr
    );

  landmarkCanvas.height =
    Math.round(
      height * dpr
    );


  const ctx =
    landmarkCanvas
      .getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  for (
    const point of landmarks
  ) {

    const x =
      point.x * width;

    const y =
      point.y * height;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      12,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(0,255,0,0.25)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#00ff00";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();
  }
}


modelButton.addEventListener(
  "click",
  () => {

    modelInput.click();

  }
);


modelInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) return;


    status.textContent =
      "LOADING 3D MODEL...";


    try {

      const arrayBuffer =
        await file.arrayBuffer();


      gltfLoader.parse(

        arrayBuffer,

        "",

        gltf => {

          modelPivot.clear();


          loadedModel =
            gltf.scene;


          modelPivot.add(
            loadedModel
          );


          calculateModelBounds();


          cube.visible =
            false;


          controls.style.display =
            "block";


          status.textContent =
            "GLB MODEL LOADED";


          applyModelSettings();

        },

        undefined,

        error => {

          console.error(error);

          status.textContent =
            "GLB LOAD ERROR";
        }
      );


    } catch (error) {

      console.error(error);

      status.textContent =
        "MODEL ERROR";
    }
  }
);


function calculateModelBounds() {

  if (!loadedModel) return;


  const box =
    new THREE.Box3()
      .setFromObject(
        loadedModel
      );


  box.getCenter(
    modelCenter
  );


  box.getSize(
    modelSize
  );


  loadedModel.position.set(
    -modelCenter.x,
    -modelCenter.y,
    -modelCenter.z
  );


  modelCenter.set(
    0,
    0,
    0
  );


  if (
    modelSize.x === 0 &&
    modelSize.y === 0 &&
    modelSize.z === 0
  ) {

    modelSize.set(
      1,
      1,
      1
    );
  }
}<script type="module">

function applyModelSettings() {

  if (!loadedModel) return;


  modelPivot.position.set(
    Number(xSlider.value),
    Number(ySlider.value),
    Number(zSlider.value)
  );


  let finalScale =
    Number(scaleSlider.value);


  if (headFitEnabled) {

    const largestDimension =
      Math.max(
        modelSize.x,
        modelSize.y,
        modelSize.z
      );


    if (largestDimension > 0) {

      finalScale =
        Number(scaleSlider.value) /
        largestDimension;
    }
  }


  modelPivot.scale.set(
    finalScale,
    finalScale,
    finalScale
  );


  modelPivot.rotation.x =
    THREE.MathUtils.degToRad(
      Number(rotXSlider.value)
    );


  modelPivot.rotation.y =
    THREE.MathUtils.degToRad(
      Number(rotYSlider.value)
    );


  modelPivot.rotation.z =
    THREE.MathUtils.degToRad(
      Number(rotZSlider.value)
    );


  updateControlValues();
}


function updateControlValues() {

  xValue.textContent =
    Number(xSlider.value)
      .toFixed(2);


  yValue.textContent =
    Number(ySlider.value)
      .toFixed(2);


  zValue.textContent =
    Number(zSlider.value)
      .toFixed(2);


  scaleValue.textContent =
    Number(scaleSlider.value)
      .toFixed(2);


  rotXValue.textContent =
    Number(rotXSlider.value) + "°";


  rotYValue.textContent =
    Number(rotYSlider.value) + "°";


  rotZValue.textContent =
    Number(rotZSlider.value) + "°";
}


[
  xSlider,
  ySlider,
  zSlider,
  scaleSlider,
  rotXSlider,
  rotYSlider,
  rotZSlider
].forEach(
  slider => {

    slider.addEventListener(
      "input",
      applyModelSettings
    );

  }
);


fitButton.addEventListener(
  "click",
  () => {

    headFitEnabled =
      !headFitEnabled;


    fitButton.textContent =
      headFitEnabled
        ? "HEAD FIT: ON"
        : "HEAD FIT MODE";


    applyModelSettings();

  }
);


resetButton.addEventListener(
  "click",
  () => {

    xSlider.value =
      defaultModelSettings.x;

    ySlider.value =
      defaultModelSettings.y;

    zSlider.value =
      defaultModelSettings.z;

    scaleSlider.value =
      defaultModelSettings.scale;

    rotXSlider.value =
      defaultModelSettings.rotX;

    rotYSlider.value =
      defaultModelSettings.rotY;

    rotZSlider.value =
      defaultModelSettings.rotZ;


    headFitEnabled =
      false;


    fitButton.textContent =
      "HEAD FIT MODE";


    applyModelSettings();

  }
);


function updateHeadAnchor(
  landmarks,
  transformationMatrix
) {

  if (!landmarks) return;


  const nose =
    landmarks[1];

  const leftEye =
    landmarks[33];

  const rightEye =
    landmarks[263];


  if (
    !nose ||
    !leftEye ||
    !rightEye
  ) {
    return;
  }


  const eyeDistance =
    Math.hypot(
      rightEye.x -
      leftEye.x,

      rightEye.y -
      leftEye.y
    );


  const normalizedX =
    (nose.x - 0.5);

  const normalizedY =
    (0.5 - nose.y);


  anchor.position.x =
    normalizedX * 2.25;


  anchor.position.y =
    normalizedY * 1.7;


  anchor.position.z =
    -eyeDistance * 1.5;


  const headScale =
    THREE.MathUtils.clamp(
      eyeDistance * 5.2,
      0.45,
      2.2
    );


  anchor.scale.set(
    headScale,
    headScale,
    headScale
  );


  if (
    transformationMatrix &&
    transformationMatrix.data &&
    transformationMatrix.data.length === 16
  ) {

    const matrix =
      new THREE.Matrix4();


    matrix.fromArray(
      transformationMatrix.data
    );


    const position =
      new THREE.Vector3();

    const quaternion =
      new THREE.Quaternion();

    const scale =
      new THREE.Vector3();


    matrix.decompose(
      position,
      quaternion,
      scale
    );


    const euler =
      new THREE.Euler();


    euler.setFromQuaternion(
      quaternion,
      "YXZ"
    );


    anchor.rotation.copy(
      euler
    );
  }
}


function trackFace() {

  if (
    trackingStarted &&
    faceLandmarker &&
    video.readyState >= 2
  ) {

    try {

      const now =
        performance.now();


      const result =
        faceLandmarker.detectForVideo(
          video,
          now
        );


      if (
        result &&
        result.faceLandmarks &&
        result.faceLandmarks.length > 0
      ) {

        const landmarks =
          result.faceLandmarks[0];


        drawLandmarks(
          landmarks
        );


        let matrix = null;


        if (
          result.facialTransformationMatrixes &&
          result.facialTransformationMatrixes.length > 0
        ) {

          matrix =
            result
              .facialTransformationMatrixes[0];
        }


        updateHeadAnchor(
          landmarks,
          matrix
        );


        status.textContent =
          currentFacingMode === "user"
            ? "FACE TRACKING"
            : "BACK CAMERA";
      }

    } catch (error) {

      console.error(
        "Face tracking error:",
        error
      );
    }
  }


  renderer.render(
    scene,
    threeCamera
  );


  requestAnimationFrame(
    trackFace
  );
}


function resizeCanvas() {

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  renderer.setSize(
    width,
    height,
    false
  );


  threeCamera.aspect =
    width / height;


  threeCamera.updateProjectionMatrix();


  landmarkCanvas.style.width =
    width + "px";

  landmarkCanvas.style.height =
    height + "px";
}


window.addEventListener(
  "resize",
  resizeCanvas
);


resizeCanvas();


startButton.addEventListener(
  "click",
  startCamera
);


switchCameraButton.addEventListener(
  "click",
  switchCamera
);


function drawVideoCover(
  ctx,
  source,
  width,
  height
) {

  if (
    !source.videoWidth ||
    !source.videoHeight
  ) {
    return;
  }


  const sourceWidth =
    source.videoWidth;

  const sourceHeight =
    source.videoHeight;


  const scale =
    Math.max(
      width / sourceWidth,
      height / sourceHeight
    );


  const drawWidth =
    sourceWidth * scale;

  const drawHeight =
    sourceHeight * scale;


  const x =
    (width - drawWidth) / 2;

  const y =
    (height - drawHeight) / 2;


  ctx.drawImage(
    source,
    x,
    y,
    drawWidth,
    drawHeight
  );
}


let recordingCanvas =
  document.createElement(
    "canvas"
  );

let recordingContext =
  recordingCanvas.getContext(
    "2d"
  );

let recordingAnimationId =
  null;


function drawRecordingFrame() {

  if (
    !mediaRecorder ||
    mediaRecorder.state !== "recording"
  ) {
    return;
  }


  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  if (
    recordingCanvas.width !== width ||
    recordingCanvas.height !== height
  ) {

    recordingCanvas.width =
      width;

    recordingCanvas.height =
      height;
  }


  const ctx =
    recordingContext;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.save();


  if (mirrorEnabled) {

    ctx.translate(
      width,
      0
    );

    ctx.scale(
      -1,
      1
    );
  }


  drawVideoCover(
    ctx,
    video,
    width,
    height
  );


  ctx.drawImage(
    threeCanvas,
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    landmarkCanvas,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  recordingAnimationId =
    requestAnimationFrame(
      drawRecordingFrame
    );
}


function getRecordingMimeType() {

  const types = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  return "";
}


function startRecording() {

  if (
    !video.srcObject ||
    video.readyState < 2
  ) {

    status.textContent =
      "START CAMERA FIRST";

    return;
  }


  if (
    !window.MediaRecorder
  ) {

    status.textContent =
      "RECORDING NOT SUPPORTED";

    return;
  }


  recordedChunks = [];


  recordingCanvas.width =
    window.innerWidth;

  recordingCanvas.height =
    window.innerHeight;


  const recordingStream =
    recordingCanvas.captureStream(
      30
    );


  const mimeType =
    getRecordingMimeType();


  try {

    mediaRecorder =
      mimeType
        ? new MediaRecorder(
            recordingStream,
            {
              mimeType:
                mimeType
            }
          )
        : new MediaRecorder(
            recordingStream
          );


  } catch (error) {

    console.error(error);

    status.textContent =
      "RECORDING ERROR";

    return;
  }


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );
      }
    };


  mediaRecorder.onstop =
    () => {

      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mediaRecorder.mimeType ||
              "video/webm"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;

      link.download =
        "azeez-ar-recording.webm";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        () => {
          URL.revokeObjectURL(
            url
          );
        },
        1000
      );


      status.textContent =
        "VIDEO SAVED";
    };


  mediaRecorder.start();


  recordButton.textContent =
    "STOP RECORDING";


  status.textContent =
    "RECORDING";


  drawRecordingFrame();
}


function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state !==
      "recording"
  ) {
    return;
  }


  mediaRecorder.stop();


  if (
    recordingAnimationId
  ) {

    cancelAnimationFrame(
      recordingAnimationId
    );

    recordingAnimationId =
      null;
  }


  recordButton.textContent =
    "START RECORDING";
}


recordButton.addEventListener(
  "click",
  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {

      stopRecording();

    } else {

      startRecording();
    }

  }
);


function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
}


function getSettings() {

  return {

    x:
      Number(xSlider.value),

    y:
      Number(ySlider.value),

    z:
      Number(zSlider.value),

    scale:
      Number(scaleSlider.value),

    rotX:
      Number(rotXSlider.value),

    rotY:
      Number(rotYSlider.value),

    rotZ:
      Number(rotZSlider.value),

    headFit:
      headFitEnabled
  };
}


exportButton.addEventListener(
  "click",
  () => {

    const settings =
      getSettings();


    const json =
      JSON.stringify(
        settings,
        null,
        2
      );


    const blob =
      new Blob(
        [json],
        {
          type:
            "application/json"
        }
      );


    downloadBlob(
      blob,
      "azeez-ar-settings.json"
    );


    status.textContent =
      "SETTINGS EXPORTED";
  }
);


importSettingsButton.addEventListener(
  "click",
  () => {

    importSettingsInput.click();

  }
);


importSettingsInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) return;


    try {

      const text =
        await file.text();


      const settings =
        JSON.parse(text);


      if (
        typeof settings.x ===
        "number"
      ) {

        xSlider.value =
          settings.x;
      }


      if (
        typeof settings.y ===
        "number"
      ) {

        ySlider.value =
          settings.y;
      }


      if (
        typeof settings.z ===
        "number"
      ) {

        zSlider.value =
          settings.z;
      }


      if (
        typeof settings.scale ===
        "number"
      ) {

        scaleSlider.value =
          settings.scale;
      }


      if (
        typeof settings.rotX ===
        "number"
      ) {

        rotXSlider.value =
          settings.rotX;
      }


      if (
        typeof settings.rotY ===
        "number"
      ) {

        rotYSlider.value =
          settings.rotY;
      }


      if (
        typeof settings.rotZ ===
        "number"
      ) {

        rotZSlider.value =
          settings.rotZ;
      }


      if (
        typeof settings.headFit ===
        "boolean"
      ) {

        headFitEnabled =
          settings.headFit;


        fitButton.textContent =
          headFitEnabled
            ? "HEAD FIT: ON"
            : "HEAD FIT MODE";
      }


      applyModelSettings();


      status.textContent =
        "SETTINGS IMPORTED";


    } catch (error) {

      console.error(error);

      status.textContent =
        "SETTINGS IMPORT ERROR";
    }
  }
);


renderer.setAnimationLoop(
  () => {

    renderer.render(
      scene,
      threeCamera
    );

  }
);


updateMirror();
updateControlValues();


status.textContent =
  "READY";

</script>
