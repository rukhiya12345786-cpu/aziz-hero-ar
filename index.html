<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Natural Left Right</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    display:none;
}

#screen{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#000;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;

    padding:16px 28px;
    font-size:20px;
    font-weight:bold;

    border:0;
    border-radius:10px;

    background:white;
    color:black;
}

#status{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);

    z-index:10;

    padding:10px 15px;
    background:rgba(0,0,0,.75);
    color:white;

    border-radius:10px;
    font-family:Arial;
    font-size:16px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="screen"></canvas>

<div id="status">CAMERA READY</div>

<button id="open">OPEN CAMERA</button>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const button = document.getElementById("open");
const status = document.getElementById("status");

let stream = null;

button.onclick = async function(){

    try{

        status.innerText = "OPENING CAMERA...";

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        button.style.display = "none";

        status.innerText = "CAMERA ON ✓";

        drawCamera();

    }catch(error){

        status.innerText = "CAMERA ERROR";

        alert(
            "CAMERA ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};


function drawCamera(){

    if(video.readyState >= 2){

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cw = window.innerWidth;
        const ch = window.innerHeight;

        canvas.width = cw;
        canvas.height = ch;

        /*
        =====================================
        NATURAL CAMERA VIEW
        NO MIRROR
        NO FLIP
        =====================================
        */

        const scale = Math.max(
            cw / vw,
            ch / vh
        );

        const drawW = vw * scale;
        const drawH = vh * scale;

        const x = (cw - drawW) / 2;
        const y = (ch - drawH) / 2;

        ctx.clearRect(0,0,cw,ch);

        ctx.drawImage(
            video,
            0,
            0,
            vw,
            vh,
            x,
            y,
            drawW,
            drawH
        );
    }

    requestAnimationFrame(drawCamera);
}


window.addEventListener("resize",function(){

    if(video.readyState >= 2){

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

    }

});

</script>

</body>
</html>
