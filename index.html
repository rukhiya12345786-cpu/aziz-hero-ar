<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Azeez AR Head Tracker</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#container canvas{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    display:block;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
}

.row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    pointer-events:auto;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 12px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:13px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

#status{
    align-self:flex-start;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(0,0,0,.72);
    color:#00ff66;
    font-size:12px;
}

#controls{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:25;
    max-height:45vh;
    overflow-y:auto;
    padding:12px;
    border-radius:12px;
    background:rgba(0,0,0,.78);
    color:#fff;
    pointer-events:auto;
}

.control{
    display:grid;
    grid-template-columns:55px 1fr 55px;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.control span{
    font-size:12px;
}

.control output{
    text-align:right;
    font-size:11px;
}

input[type="range"]{
    width:100%;
}

.hidden{
    display:none!important;
}

input[type="file"]{
    display:none;
}

#recording{
    color:#ff5555;
}

.mirrored{
    transform:scaleX(-1);
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
}
</script>
</head>

<body>

<div id="container"></div>

<div id="ui">

    <div class="row">
        <button id="startButton">START CAMERA</button>
        <button id="switchButton">SWITCH CAMERA</button>
        <button id="mirrorButton">MIRROR: OFF</button>
    </div>

    <div class="row">
        <button id="modelButton">IMPORT 3D MODEL</button>
        <button id="settingsImportButton">IMPORT SETTINGS</button>
        <button id="settingsExportButton">EXPORT SETTINGS</button>
    </div>

    <div class="row">
        <button id="meshButton">FACE MESH: ON</button>
        <button id="controlsButton">CONTROLS</button>
        <button id="resetButton">RESET</button>
        <button id="recordButton">START RECORDING</button>
    </div>

    <div id="status">Ready</div>

</div>

<div id="controls">

    <div class="control">
        <span>X</span>
        <input id="posX" type="range" min="-1" max="1" step="0.001" value="0">
        <output id="posXValue">0</output>
    </div>

    <div class="control">
        <span>Y</span>
        <input id="posY" type="range" min="-1" max="1" step="0.001" value="0">
        <output id="posYValue">0</output>
    </div>

    <div class="control">
        <span>Z</span>
        <input id="posZ" type="range" min="-1" max="1" step="0.001" value="0">
        <output id="posZValue">0</output>
    </div>

    <div class="control">
        <span>Scale</span>
        <input id="modelScale" type="range" min="0.05" max="5" step="0.01" value="1">
        <output id="modelScaleValue">1</output>
    </div>

    <div class="control">
        <span>Rot X</span>
        <input id="rotX" type="range" min="-180" max="180" step="1" value="0">
        <output id="rotXValue">0</output>
    </div>

    <div class="control">
        <span>Rot Y</span>
        <input id="rotY" type="range" min="-180" max="180" step="1" value="0">
        <output id="rotYValue">0</output>
    </div>

    <div class="control">
        <span>Rot Z</span>
        <input id="rotZ" type="range" min="-180" max="180" step="1" value="0">
        <output id="rotZValue">0</output>
    </div>

</div>

<input id="modelInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
<input id="settingsInput" type="file" accept=".json">

<script type="module">import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {MindARThree} from "mindar-face-three";

const container=document.getElementById("container");

const startButton=document.getElementById("startButton");
const switchButton=document.getElementById("switchButton");
const mirrorButton=document.getElementById("mirrorButton");
const modelButton=document.getElementById("modelButton");
const settingsImportButton=document.getElementById("settingsImportButton");
const settingsExportButton=document.getElementById("settingsExportButton");
const meshButton=document.getElementById("meshButton");
const controlsButton=document.getElementById("controlsButton");
const resetButton=document.getElementById("resetButton");
const recordButton=document.getElementById("recordButton");

const status=document.getElementById("status");
const controls=document.getElementById("controls");

const modelInput=document.getElementById("modelInput");
const settingsInput=document.getElementById("settingsInput");

const posX=document.getElementById("posX");
const posY=document.getElementById("posY");
const posZ=document.getElementById("posZ");
const modelScale=document.getElementById("modelScale");
const rotX=document.getElementById("rotX");
const rotY=document.getElementById("rotY");
const rotZ=document.getElementById("rotZ");

const posXValue=document.getElementById("posXValue");
const posYValue=document.getElementById("posYValue");
const posZValue=document.getElementById("posZValue");
const modelScaleValue=document.getElementById("modelScaleValue");
const rotXValue=document.getElementById("rotXValue");
const rotYValue=document.getElementById("rotYValue");
const rotZValue=document.getElementById("rotZValue");

let mindarThree=null;
let faceAnchor=null;
let faceMesh=null;
let faceOccluder=null;

let modelRoot=new THREE.Group();
let currentModel=null;

let running=false;
let mirrored=false;
let meshVisible=true;

let mediaRecorder=null;
let recordedChunks=[];

const loader=new GLTFLoader();

function setStatus(message){
    status.textContent=message;
}

function updateLabels(){
    posXValue.textContent=Number(posX.value).toFixed(3);
    posYValue.textContent=Number(posY.value).toFixed(3);
    posZValue.textContent=Number(posZ.value).toFixed(3);
    modelScaleValue.textContent=Number(modelScale.value).toFixed(2);
    rotXValue.textContent=rotX.value;
    rotYValue.textContent=rotY.value;
    rotZValue.textContent=rotZ.value;
}

function getSettings(){
    return {
        posX:Number(posX.value),
        posY:Number(posY.value),
        posZ:Number(posZ.value),
        scale:Number(modelScale.value),
        rotX:Number(rotX.value),
        rotY:Number(rotY.value),
        rotZ:Number(rotZ.value),
        mirrored:mirrored,
        meshVisible:meshVisible
    };
}

function applySettings(settings){
    if(typeof settings.posX==="number")posX.value=settings.posX;
    if(typeof settings.posY==="number")posY.value=settings.posY;
    if(typeof settings.posZ==="number")posZ.value=settings.posZ;
    if(typeof settings.scale==="number")modelScale.value=settings.scale;
    if(typeof settings.rotX==="number")rotX.value=settings.rotX;
    if(typeof settings.rotY==="number")rotY.value=settings.rotY;
    if(typeof settings.rotZ==="number")rotZ.value=settings.rotZ;

    if(typeof settings.mirrored==="boolean"){
        mirrored=settings.mirrored;
    }

    if(typeof settings.meshVisible==="boolean"){
        meshVisible=settings.meshVisible;
    }

    applyModelTransform();
    updateMirror();
    updateFaceMesh();
    updateLabels();
}

function applyModelTransform(){
    if(!currentModel)return;

    currentModel.position.set(
        Number(posX.value),
        Number(posY.value),
        Number(posZ.value)
    );

    currentModel.scale.setScalar(
        Number(modelScale.value)
    );

    currentModel.rotation.set(
        THREE.MathUtils.degToRad(Number(rotX.value)),
        THREE.MathUtils.degToRad(Number(rotY.value)),
        THREE.MathUtils.degToRad(Number(rotZ.value))
    );
}

function updateMirror(){
    container.classList.toggle("mirrored",mirrored);
    mirrorButton.textContent=mirrored?"MIRROR: ON":"MIRROR: OFF";
}

function updateFaceMesh(){
    if(faceMesh){
        faceMesh.visible=meshVisible;
    }

    meshButton.textContent=meshVisible
        ?"FACE MESH: ON"
        :"FACE MESH: OFF";
}

function createMindAR(){
    if(mindarThree)return;

    mindarThree=new MindARThree({
        container:container,
        resolution:"720p",
        uiLoading:"no",
        uiScanning:"no",
        uiError:"yes",
        filterMinCF:0.0005,
        filterBeta:0.8,
        filterDCutOff:0.001,
        disableFaceMirror:false
    });

    const scene=mindarThree.scene;

    const ambient=new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        1.5
    );

    scene.add(ambient);

    const directional=new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    directional.position.set(0,2,3);
    scene.add(directional);

    faceAnchor=mindarThree.addAnchor(168);

    faceAnchor.group.add(modelRoot);

    modelRoot.visible=false;

    faceMesh=mindarThree.addFaceMesh();

    if(faceMesh){
        faceMesh.material.color.set(0x00ff66);
        faceMesh.material.transparent=true;
        faceMesh.material.opacity=0.18;
        faceMesh.material.depthWrite=false;
        faceMesh.visible=meshVisible;
        scene.add(faceMesh);
    }

    faceOccluder=mindarThree.addFaceMesh();

    if(faceOccluder){
        faceOccluder.material=new THREE.MeshBasicMaterial({
            colorWrite:false,
            depthWrite:true,
            depthTest:true,
            side:THREE.DoubleSide
        });

        faceOccluder.renderOrder=0;

        scene.add(faceOccluder);
    }

    faceAnchor.onTargetFound=()=>{
        if(currentModel){
            modelRoot.visible=true;
        }
    };

    faceAnchor.onTargetLost=()=>{
        modelRoot.visible=false;
    };

    setStatus("MindAR ready");
}

async function startAR(){
    try{
        createMindAR();

        if(running)return;

        await mindarThree.start();

        running=true;

        mindarThree.renderer.setAnimationLoop(()=>{
            mindarThree.renderer.render(
                mindarThree.scene,
                mindarThree.camera
            );
        });

        startButton.textContent="CAMERA ON";
        setStatus("Camera and face tracking ON");

    }catch(error){
        console.error(error);
        setStatus("Camera error");
    }
}

async function switchCamera(){
    try{
        if(!mindarThree){
            createMindAR();
            await mindarThree.start();
            running=true;
        }

        await mindarThree.switchCamera();

        setStatus("Camera switched");

    }catch(error){
        console.error(error);
        setStatus("Camera switch error");
    }
}

function resetControls(){
    posX.value=0;
    posY.value=0;
    posZ.value=0;
    modelScale.value=1;
    rotX.value=0;
    rotY.value=0;
    rotZ.value=0;

    applyModelTransform();
    updateLabels();
}

function disposeMaterial(material){
    if(!material)return;

    if(material.map)material.map.dispose();
    if(material.normalMap)material.normalMap.dispose();
    if(material.roughnessMap)material.roughnessMap.dispose();
    if(material.metalnessMap)material.metalnessMap.dispose();
    if(material.emissiveMap)material.emissiveMap.dispose();

    material.dispose();
}

function disposeModel(object){
    object.traverse(child=>{
        if(child.geometry){
            child.geometry.dispose();
        }

        if(child.material){
            if(Array.isArray(child.material)){
                child.material.forEach(disposeMaterial);
            }else{
                disposeMaterial(child.material);
            }
        }
    });
}

function removeCurrentModel(){
    if(!currentModel)return;

    modelRoot.remove(currentModel);
    disposeModel(currentModel);

    currentModel=null;
    modelRoot.visible=false;
}

function centerAndScaleModel(object){
    const box=new THREE.Box3().setFromObject(object);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());

    object.position.sub(center);

    const maxSize=Math.max(
        size.x,
        size.y,
        size.z
    );

    if(maxSize>0){
        const fitScale=1/maxSize;
        object.scale.setScalar(fitScale);
    }
}

function importModel(file){
    if(!file)return;

    const url=URL.createObjectURL(file);

    setStatus("Loading 3D model...");

    loader.load(
        url,
        gltf=>{
            URL.revokeObjectURL(url);

            removeCurrentModel();

            currentModel=gltf.scene;

            centerAndScaleModel(currentModel);

            currentModel.traverse(child=>{
                if(child.isMesh){
                    child.frustumCulled=false;

                    if(child.material){
                        child.material.side=THREE.DoubleSide;
                    }
                }
            });

            modelRoot.add(currentModel);

            resetControls();

            modelRoot.visible=true;

            setStatus("3D model loaded");
        },
        undefined,
        error=>{
            URL.revokeObjectURL(url);
            console.error(error);
            setStatus("3D model load error");
        }
    );
}

function exportSettings(){
    const data=JSON.stringify(
        getSettings(),
        null,
        2
    );

    const blob=new Blob(
        [data],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const link=document.createElement("a");

    link.href=url;
    link.download="azezz-ar-settings.json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    setStatus("Settings exported");
}

function importSettings(file){
    if(!file)return;

    const reader=new FileReader();

    reader.onload=()=>{
        try{
            const settings=JSON.parse(reader.result);
            applySettings(settings);
            setStatus("Settings imported");
        }catch(error){
            console.error(error);
            setStatus("Invalid settings file");
        }
    };

    reader.readAsText(file);
}

function updateRecordingButton(){
    recordButton.textContent=
        mediaRecorder&&mediaRecorder.state==="recording"
        ?"STOP RECORDING"
        :"START RECORDING";
}

function startRecording(){
    if(!mindarThree||!mindarThree.renderer){
        setStatus("Start camera first");
        return;
    }

    const canvas=mindarThree.renderer.domElement;

    if(!canvas.captureStream){
        setStatus("Recording not supported");
        return;
    }

    const stream=canvas.captureStream(30);

    recordedChunks=[];

    let options={};

    if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")){
        options={
            mimeType:"video/webm;codecs=vp9"
        };
    }else if(MediaRecorder.isTypeSupported("video/webm")){
        options={
            mimeType:"video/webm"
        };
    }

    try{
        mediaRecorder=new MediaRecorder(
            stream,
            options
        );
    }catch(error){
        console.error(error);
        setStatus("Recorder error");
        return;
    }

    mediaRecorder.ondataavailable=event=>{
        if(event.data&&event.data.size>0){
            recordedChunks.push(event.data);
        }
    };

    mediaRecorder.onstop=()=>{
        const blob=new Blob(
            recordedChunks,
            {type:"video/webm"}
        );

        const url=URL.createObjectURL(blob);

        const link=document.createElement("a");

        link.href=url;
        link.download="azezz-ar-recording.webm";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(()=>{
            URL.revokeObjectURL(url);
        },1000);

        setStatus("Recording saved");
        updateRecordingButton();
    };

    mediaRecorder.start();

    setStatus("Recording...");
    updateRecordingButton();
}

function stopRecording(){
    if(
        mediaRecorder&&
        mediaRecorder.state==="recording"
    ){
        mediaRecorder.stop();
    }
}

startButton.addEventListener(
    "click",
    startAR
);

switchButton.addEventListener(
    "click",
    switchCamera
);

mirrorButton.addEventListener(
    "click",
    ()=>{
        mirrored=!mirrored;
        updateMirror();
    }
);

modelButton.addEventListener(
    "click",
    ()=>{
        modelInput.value="";
        modelInput.click();
    }
);

modelInput.addEventListener(
    "change",
    ()=>{
        importModel(modelInput.files[0]);
    }
);

settingsImportButton.addEventListener(
    "click",
    ()=>{
        settingsInput.value="";
        settingsInput.click();
    }
);

settingsInput.addEventListener(
    "change",
    ()=>{
        importSettings(settingsInput.files[0]);
    }
);

settingsExportButton.addEventListener(
    "click",
    exportSettings
);

meshButton.addEventListener(
    "click",
    ()=>{
        meshVisible=!meshVisible;
        updateFaceMesh();
    }
);

controlsButton.addEventListener(
    "click",
    ()=>{
        controls.classList.toggle("hidden");
    }
);

resetButton.addEventListener(
    "click",
    resetControls
);

recordButton.addEventListener(
    "click",
    ()=>{
        if(
            mediaRecorder&&
            mediaRecorder.state==="recording"
        ){
            stopRecording();
        }else{
            startRecording();
        }
    }
);

[
    posX,
    posY,
    posZ,
    modelScale,
    rotX,
    rotY,
    rotZ
].forEach(input=>{
    input.addEventListener(
        "input",
        ()=>{
            applyModelTransform();
            updateLabels();
        }
    );
});

updateLabels();
updateMirror();
updateFaceMesh();window.addEventListener("resize",()=>{
    if(!mindarThree)return;

    const renderer=mindarThree.renderer;

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(document.hidden){
            return;
        }

        if(running&&mindarThree){
            try{
                mindarThree.renderer.setAnimationLoop(()=>{
                    mindarThree.renderer.render(
                        mindarThree.scene,
                        mindarThree.camera
                    );
                });
            }catch(error){
                console.error(error);
            }
        }
    }
);

window.addEventListener(
    "beforeunload",
    ()=>{
        try{
            if(mediaRecorder&&mediaRecorder.state==="recording"){
                mediaRecorder.stop();
            }
        }catch(error){}

        try{
            if(mindarThree&&running){
                mindarThree.stop();
            }
        }catch(error){}
    }
);

setStatus("Ready - press START CAMERA");
</script>

</body>
</html>
