<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Left Right Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#camera{
    display:none;
}

#screen{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

#left{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    z-index:5;

    padding:20px 25px;
    background:red;
    color:white;
    font-size:25px;
    font-weight:bold;
    border-radius:15px;
}

#right{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    z-index:5;

    padding:20px 25px;
    background:blue;
    color:white;
    font-size:25px;
    font-weight:bold;
    border-radius:15px;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;

    padding:16px 30px;
    font-size:20px;
    font-weight:bold;
    border:0;
    border-radius:10px;
}

#status{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:10;

    padding:10px 15px;
    background:rgba(0,0,0,.8);
    color:white;
    border-radius:10px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="screen"></canvas>

<div id="left">LEFT</div>
<div id="right">RIGHT</div>

<div id="status">CAMERA READY</div>

<button id="open">OPEN CAMERA</button>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const button = document.getElementById("open");
const status = document.getElementById("status");

button.onclick = async function(){

    try{

        status.innerText = "OPENING...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        button.style.display = "none";

        status.innerText = "CAMERA ON";

        draw();

    }catch(error){

        status.innerText = "CAMERA ERROR";

        alert(
            error.name +
            "\n\n" +
            error.message
        );

    }

};


function draw(){

    if(video.readyState >= 2){

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cw = window.innerWidth;
        const ch = window.innerHeight;

        canvas.width = cw;
        canvas.height = ch;

        const scale = Math.max(
            cw / vw,
            ch / vh
        );

        const w = vw * scale;
        const h = vh * scale;

        const x = (cw - w) / 2;
        const y = (ch - h) / 2;

        ctx.clearRect(0,0,cw,ch);

        /*
         * IMPORTANT:
         * बिल्कुल NO MIRROR
         * बिल्कुल NO FLIP
         */

        ctx.drawImage(
            video,
            0,
            0,
            vw,
            vh,
            x,
            y,
            w,
            h
        );
    }

    requestAnimationFrame(draw);
}

</script>

</body>
</html>
