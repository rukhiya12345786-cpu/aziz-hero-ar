<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera + Small 3D</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* CAMERA */

#camera{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

/* 3D */

#three{
    position:fixed;
    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* STATUS */

#status{
    position:fixed;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:10;

    background:rgba(0,0,0,.75);

    color:white;

    padding:10px 16px;

    border-radius:10px;

    font-family:Arial;

    font-size:16px;
}

/* BUTTON */

#open{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:20;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<canvas id="three"></canvas>


<div id="status">
CAMERA + 3D TEST
</div>


<button id="open">
OPEN CAMERA
</button>


<script type="module">


/* THREE.JS */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


const video =
document.getElementById("camera");

const canvas =
document.getElementById("three");

const button =
document.getElementById("open");

const status =
document.getElementById("status");



/* =========================
   SCENE
========================= */

const scene =
new THREE.Scene();



/* =========================
   3D CAMERA
========================= */

const camera3D =
new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.1,

    100

);


camera3D.position.z = 4;



/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    alpha:true,

    antialias:true

});


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);



/* =========================
   LIGHT
========================= */

const light =
new THREE.DirectionalLight(

    0xffffff,
    3

);


light.position.set(

    2,
    3,
    5

);


scene.add(light);



const ambient =
new THREE.AmbientLight(

    0xffffff,
    2

);


scene.add(ambient);



/* =========================
   SMALL CUBE
========================= */

const geometry =
new THREE.BoxGeometry(

    0.65,
    0.65,
    0.65

);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(

    geometry,
    material

);


cube.position.set(

    0,
    0,
    0

);


scene.add(cube);



/* =========================
   ROTATION
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    cube.rotation.x +=
    0.01;


    cube.rotation.y +=
    0.015;


    renderer.render(

        scene,
        camera3D

    );

}


animate();



/* =========================
   OPEN CAMERA
========================= */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA + SMALL 3D ON";

    }

    catch(error){

        status.innerText =
        "CAMERA ERROR";


        alert(

            error.name +
            "\n\n" +
            error.message

        );

    }

};



/* =========================
   RESIZE
========================= */

window.addEventListener(

    "resize",

    function(){

        camera3D.aspect =

        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


</script>

</body>

</html>
