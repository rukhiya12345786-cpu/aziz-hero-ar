<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR - Camera Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#camera {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#startButton {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    padding: 16px 28px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    z-index: 10;
}

#status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 16px;
    z-index: 10;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="status">Camera is off</div>

<button id="startButton">OPEN CAMERA</button>

<script>
const video = document.getElementById("camera");
const button = document.getElementById("startButton");
const status = document.getElementById("status");

button.addEventListener("click", async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        status.textContent = "Camera is working";
        button.style.display = "none";

    } catch (error) {
        status.textContent = "Camera error: " + error.message;
        console.error(error);
    }
});
</script>

</body>
</html>
