<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez AR - Step 1</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }
        video {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Azeez AR - Camera Test</h2>
    <!-- मोबाइल का कैमरा दिखाने के लिए वीडियो टैग -->
    <video id="cameraStream" autoplay playsinline></video>
    <button id="flipBtn">कैमरा फ्लिप करें</button>

    <script>
        const videoElement = document.getElementById('cameraStream');
        let useFrontCamera = true;

        async function startCamera() {
            try {
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
            } catch (error) {
                alert("कैमरा शुरू करने में एरर आया: " + error);
            }
        }

        // कैमरा फ्लिप बटन का काम
        document.getElementById('flipBtn').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // ऐप शुरू होते ही कैमरा चालू करें
        startCamera();
    </script>

</body>
</html>
