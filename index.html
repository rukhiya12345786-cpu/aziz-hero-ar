<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Hero AR Studio</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px; box-sizing: border-box;
        }
        .control-group { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; }
        button, label.btn {
            background: #ff0055; color: white; border: none; padding: 10px 14px;
            font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center;
        }
        button:active, label.btn:active { background: #cc0044; }
        input[type="file"] { display: none; }
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        #bottom-bar { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; }
        #record-btn { background: #ff3333; width: 65px; height: 65px; border-radius: 50%; border: 4px solid white; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #record-btn.recording { background: #222; animation: pulse 1s infinite; border-color: #ff3333; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #permission-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.98); z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px; box-sizing: border-box;
        }
        #start-app-btn { 
            background: #ffffff; color: #000000; font-size: 18px; font-weight: bold; 
            padding: 16px 30px; border-radius: 10px; margin-top: 20px; border: none;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255,255,255,0.3); pointer-events: auto;
        }
        #error-box { margin-top: 15px; font-size: 13px; color: #ff4444; max-width: 90%; word-break: break-all; }
    </style>
</head>
<body>

    <div id="permission-screen">
        <h1 style="margin: 0 0 10px 0; font-size: 24px;">Aziz Hero AR Studio</h1>
        <p style="margin: 0; color: #aaa;">Tap the button below to allow camera access</p>
        <button id="start-app-btn">TAP TO START CAMERA</button>
        <div id="error-box"></div>
    </div>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="top-bar">
            <div class="control-group">
                <label class="btn" for="file-input">Import 3D Model</label>
                <input type="file" id="file-input" accept=".obj,.gltf,.glb">
                <button id="export-btn">Snapshot</button>
            </div>
            <div class="control-group">
                <button id="cam-switch-btn">Flip Cam</button>
            </div>
        </div>

        <div id="bottom-bar">
            <div class="control-group" style="background: transparent; padding: 0;">
                <button id="record-btn" title="Record Video"></button>
            </div>
        </div>
    </div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, currentModel;
        let useFrontCamera = true;
        let videoElement, mediaStream;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        const errorBox = document.getElementById('error-box');

        document.getElementById('start-app-btn').addEventListener('click', async () => {
            errorBox.innerText = "Requesting camera...";
            try {
                await initAR();
                document.getElementById('permission-screen').style.display = 'none';
            } catch (err) {
                errorBox.innerText = "Error: " + err.message + " (Make sure site is on HTTPS and camera permission is allowed)";
            }
        });

        async function initAR() {
            videoElement = document.getElementById('video-bg');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            createDefaultModel();
            camera.position.z = 2.5;

            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', handleFileImport);
            document.getElementById('export-btn').addEventListener('click', exportPhoto);
            document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);
            document.getElementById('record-btn').addEventListener('click', toggleRecording);

            await startCamera();
            animate();
        }

        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                audio: true
            };
            
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try {
                await startCamera();
            } catch (err) {
                alert('Could not switch camera: ' + err.message);
            }
        }

        function createDefaultModel() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff6688, roughness: 0.3 });
            currentModel = new THREE.Mesh(geometry, material);
            scene.add(currentModel);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                currentModel.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
