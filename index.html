<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Face Model Test</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#camera{
    width:100%;
    height:100%;
    object-fit:cover;
}

#status{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    z-index:10;

    width:90%;
    max-width:500px;

    padding:14px;

    border-radius:12px;

    background:rgba(0,0,0,.8);
    color:white;

    font-family:Arial;
    font-size:16px;

    text-align:center;
}

#open{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    z-index:10;

    padding:16px 28px;

    border:0;
    border-radius:10px;

    font-size:20px;
    font-weight:bold;
}

</style>

</head>


<body>


<video
id="camera"
autoplay
playsinline
muted>
</video>


<div id="status">
READY
</div>


<button id="open">
OPEN CAMERA
</button>



<script type="module">


/* =========================================
   IMPORTANT:
   NO vision_bundle.mjs
   NO jsDelivr MediaPipe
========================================= */

const status =
document.getElementById("status");

const video =
document.getElementById("camera");

const button =
document.getElementById("open");


let FaceLandmarker;
let FilesetResolver;

let faceLandmarker = null;

let lastVideoTime = -1;



/* =========================================
   CAMERA
========================================= */

button.onclick =
async function(){

    try{

        status.innerText =
        "OPENING CAMERA...";


        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        status.innerText =
        "CAMERA OK — LOADING FACE LIBRARY...";


        await loadMediaPipe();

    }

    catch(error){

        showError(
            "ERROR",
            error
        );

    }

};



/* =========================================
   LOAD MEDIAPIPE FROM SKYpack
========================================= */

async function loadMediaPipe(){

    try{

        status.innerText =
        "LOADING FACE LIBRARY...";


        const vision =
        await import(

            "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3"

        );


        FaceLandmarker =
        vision.FaceLandmarker;


        FilesetResolver =
        vision.FilesetResolver;


        if(
            !FaceLandmarker ||
            !FilesetResolver
        ){

            throw new Error(
                "FaceLandmarker or FilesetResolver not found."
            );

        }


        status.innerText =
        "LIBRARY OK — LOADING MODEL...";


        await createFaceModel();

    }

    catch(error){

        showError(
            "MEDIAPIPE LOAD ERROR",
            error
        );

    }

}



/* =========================================
   CREATE FACE MODEL
========================================= */

async function createFaceModel(){

    try{

        const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"

        );


        faceLandmarker =
        await FaceLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"CPU"

                },


                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5

            }

        );


        status.innerText =
        "FACE MODEL READY ✓";


        detectFace();

    }

    catch(error){

        showError(
            "FACE MODEL ERROR",
            error
        );

    }

}



/* =========================================
   FACE DETECTION
========================================= */

function detectFace(){

    requestAnimationFrame(
        detectFace
    );


    if(
        !faceLandmarker
    ){

        return;

    }


    if(
        video.readyState <
        2
    ){

        return;

    }


    if(
        video.currentTime ===
        lastVideoTime
    ){

        return;

    }


    lastVideoTime =
    video.currentTime;


    try{

        const result =
        faceLandmarker
        .detectForVideo(

            video,

            performance.now()

        );


        if(
            result.faceLandmarks &&
            result.faceLandmarks.length
        ){

            status.innerText =
            "FACE DETECTED ✓";

        }

        else{

            status.innerText =
            "FACE MODEL ON — FACE NOT FOUND";

        }

    }

    catch(error){

        showError(
            "DETECTION ERROR",
            error
        );

    }

}



/* =========================================
   ERROR
========================================= */

function showError(
    title,
    error
){

    console.error(
        title,
        error
    );


    status.innerText =
    title +
    "\n\n" +
    (
        error.message ||
        String(error)
    );

}

</script>

</body>

</html>
