<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;

}

#threeCanvas{
    position:absolute;
    inset:0;

    height:100%;

}

#topBar{
    position:absolute;
    z-index:20;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    transform:scaleX(-1);
}

.btn{
    border:0;
    border-radius:12px;
    padding:10px 14px;

    color:white;

    font-size:14px;
    font-weight:600;
}

#status{
    position:absolute;
    z-index:20;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:9px 14px;

    color:white;
    background:rgba(0,0,0,.70);

    font-size:13px;
    white-space:nowrap;
}

#loading{
    position:absolute;
    z-index:50;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    gap:12px;

    color:white;
    background:#000;

    text-align:center;
}

#loading.hidden{
    display:none;
}

.spinner{
    width:38px;
    height:38px;

    border:4px solid rgba(255,255,255,.25);
    border-top-color:white;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

<body>

<div id="app">

    <div id="stage">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="threeCanvas"></canvas>

    </div>

        <button
            class="btn"
            id="cameraBtn">
            🔄 Camera
        </button>

            class="btn"
            id="mirrorBtn">
            🪞 Mirror
        </button>

    </div>


    <div id="status">
        Starting...
    </div>


    <div id="loading">

        <div class="spinner"></div>

            Loading 3D Head Tracking...
        </div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from
    "three";


import {
    FaceLandmarker,
    FilesetResolver
} from
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =========================================
   DOM
========================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("threeCanvas");

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const cameraBtn =
    document.getElementById("cameraBtn");

const mirrorBtn =
    document.getElementById("mirrorBtn");

const stage =
    document.getElementById("stage");


/* =========================================
   CAMERA
========================================= */

let currentFacingMode =
    "user";

let cameraStream =
    null;


async function startCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        cameraStream =
            null;
    }


    status.textContent =
        "Opening camera...";


    try{

        cameraStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:
                        currentFacingMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:false
            });


        video.srcObject =
            cameraStream;


        await video.play();


        status.textContent =
            "Camera ready - looking for face...";


    }catch(error){

        console.error(error);

        status.textContent =
            "Camera Error";

        alert(
            "Camera open नहीं हुआ.\n\n" +
            "Browser में Camera Permission Allow करें."
        );

        throw error;
    }
}


/* =========================================
   CAMERA SWITCH
========================================= */

cameraBtn.addEventListener(
    "click",
    async()=>{

        currentFacingMode =
            currentFacingMode === "user"
            ? "environment"
            : "user";

        await startCamera();

    }
);


/* =========================================
   MIRROR
========================================= */

let mirrorEnabled =
    true;


mirrorBtn.addEventListener(
    "click",
    ()=>{

        mirrorEnabled =
            !mirrorEnabled;


        stage.style.transform =
            mirrorEnabled
            ? "scaleX(-1)"
            : "scaleX(1)";


        mirrorBtn.textContent =
            mirrorEnabled
            ? "🪞 Mirror ON"
            : "🪞 Mirror OFF";

    }
);


/* =========================================
   THREE.JS
========================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas:canvas,

        alpha:true,

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


const scene =
    new THREE.Scene();


const arCamera =
    new THREE.OrthographicCamera(
        -1,
        1,
        1,
        -1,
        0.01,
        100
    );


/* =========================================
   LIGHT
========================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(
    ambientLight
);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

directionalLight.position.set(
    0,
    2,
    4
);

scene.add(
    directionalLight
);


/* =========================================
   HEAD ANCHOR
========================================= */

const headAnchor =
    new THREE.Group();

scene.add(
    headAnchor
);


/*
    All future 3D characters
    will go inside this group.
*/

const modelOffset =
    new THREE.Group();

headAnchor.add(
    modelOffset
);


/* =========================================
   TEST 3D OBJECT
========================================= */

const testHead =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.12,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({

            color:0x00ffcc,

            transparent:true,

            opacity:.85

        })

    );


modelOffset.add(
    testHead
);


/*
    X = Red
    Y = Green
    Z = Blue
*/

const axes =
    new THREE.AxesHelper(
        0.45
    );

modelOffset.add(
    axes
);


/* =========================================
   MEDIAPIPE
========================================= */

let faceLandmarker =
    null;


async function createFaceLandmarker(){

    status.textContent =
        "Loading face tracking...";


    const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    faceLandmarker =
        await FaceLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:
                        "GPU"

                },


                runningMode:
                    "VIDEO",


                numFaces:
                    1,


                minFaceDetectionConfidence:
                    0.5,


                minFacePresenceConfidence:
                    0.5,


                minTrackingConfidence:
                    0.5,


                outputFaceBlendshapes:
                    false,


                /*
                    IMPORTANT:
                    Real facial transformation
                    matrix.
                */

                outputFacialTransformationMatrixes:
                    true

            }

        );


    status.textContent =
        "3D Head Tracking Ready";

}


/* =========================================
   RESIZE
========================================= */

function resize(){

    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );


    const aspect =
        window.innerWidth /
        window.innerHeight;


    arCamera.left =
        -aspect;

    arCamera.right =
        aspect;

    arCamera.top =
        1;

    arCamera.bottom =
        -1;


    arCamera.updateProjectionMatrix();
}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =========================================
   MATRIX
========================================= */

const faceMatrix =
    new THREE.Matrix4();


const facePosition =
    new THREE.Vector3();


const faceQuaternion =
    new THREE.Quaternion();


const faceScale =
    new THREE.Vector3();


/* =========================================
   HEAD TRACKING
========================================= */

function updateHeadTracking(
    result
){

    if(

        !result ||

        !result.facialTransformationMatrixes ||

        result
        .facialTransformationMatrixes
        .length === 0

    ){

        headAnchor.visible =
            false;

        status.textContent =
            "Face not detected";

        return;
    }


    headAnchor.visible =
        true;


    const matrixData =
        result
        .facialTransformationMatrixes[0];


    const raw =
        matrixData.data ||
        matrixData;


    if(
        !raw ||
        raw.length !== 16
    ){

        headAnchor.visible =
            false;

        return;
    }


    faceMatrix.fromArray(
        raw
    );


    faceMatrix.decompose(

        facePosition,

        faceQuaternion,

        faceScale

    );


    /*
        MediaPipe → Three.js
        coordinate conversion
    */

    headAnchor.position.set(

        facePosition.x,

        -facePosition.y,

        facePosition.z

    );


    /*
        TRUE 3D HEAD ROTATION
    */

    headAnchor.quaternion.copy(
        faceQuaternion
    );


    /*
        Character scale will be
        controlled separately later.
    */

    headAnchor.scale.set(
        1,
        1,
        1
    );


    status.textContent =
        "3D HEAD TRACKING ACTIVE";
}


/* =========================================
   TRACKING LOOP
========================================= */

let lastVideoTime =
    -1;


async function trackingLoop(){

    requestAnimationFrame(
        trackingLoop
    );


    if(
        !faceLandmarker ||
        video.readyState < 2
    ){

        return;
    }


    if(
        video.currentTime ===
        lastVideoTime
    ){

        return;
    }


    lastVideoTime =
        video.currentTime;


    try{

        const timestamp =
            performance.now();


        const result =
            faceLandmarker
            .detectForVideo(

                video,

                timestamp

            );


        updateHeadTracking(
            result
        );


    }catch(error){

        console.error(
            "Tracking Error:",
            error
        );

    }


    renderer.render(
        scene,
        arCamera
    );

}


/* =========================================
   START APP
========================================= */

async function start(){

    try{

        await startCamera();

        await createFaceLandmarker();


        loading.classList.add(
            "hidden"
        );


        trackingLoop();


    }catch(error){

        console.error(error);

        status.textContent =
            "App Start Failed";

    }

}


start();

</script>

</body>

<script type="module">

/* =====================================================
   THREE.JS LOADERS
===================================================== */

import * as THREE from
"three";


import { GLTFLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


import { FBXLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js";


import { OBJLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/OBJLoader.js";



/* =====================================================
   GET EXISTING HEAD ANCHOR
===================================================== */

/*
   Part 1 में ये groups बने हुए हैं:

       headAnchor
           ↓
       modelOffset
           ↓
       3D Model
*/


const head =
    window.headAnchor ||
    null;


const offset =
    window.modelOffset ||
    null;



/* =====================================================
   CHECK PART 1
===================================================== */

if(!head || !offset){

    console.error(
        "Part 1 Head Anchor नहीं मिला."
    );

    alert(
        "पहले Part 1 का code चलाएँ."
    );

}



/* =====================================================
   DOM
===================================================== */

const modelFile =
    document.getElementById(
        "modelFile"
    );


const removeModel =
    document.getElementById(
        "removeModel"
    );



/* =====================================================
   CURRENT MODEL
===================================================== */

let currentModel =
    null;



/* =====================================================
   DELETE MODEL
===================================================== */

function deleteCurrentModel(){

    if(!currentModel){

        return;

    }


    offset.remove(
        currentModel
    );


    currentModel.traverse(
        object => {

            if(object.geometry){

                object.geometry.dispose();

            }


            if(object.material){

                const materials =
                    Array.isArray(
                        object.material
                    )
                    ? object.material
                    : [object.material];


                materials.forEach(
                    material => {

                        if(material.map){

                            material.map.dispose();

                        }


                        if(material.normalMap){

                            material.normalMap.dispose();

                        }


                        if(material.roughnessMap){

                            material.roughnessMap.dispose();

                        }


                        if(material.metalnessMap){

                            material.metalnessMap.dispose();

                        }


                        material.dispose();

                    }
                );

            }

        }
    );


    currentModel =
        null;

}



/* =====================================================
   CENTER + NORMALIZE MODEL
===================================================== */

function prepareModel(
    model
){

    /*
       Remove previous character
    */

    deleteCurrentModel();



    currentModel =
        model;



    /*
       Reset transform
    */

    model.position.set(
        0,
        0,
        0
    );


    model.rotation.set(
        0,
        0,
        0
    );


    model.scale.set(
        1,
        1,
        1
    );



    /* =================================================
       FIND MODEL BOUNDING BOX
    ================================================= */

    const box =
        new THREE.Box3()
        .setFromObject(
            model
        );


    const size =
        new THREE.Vector3();


    const center =
        new THREE.Vector3();


    box.getSize(
        size
    );


    box.getCenter(
        center
    );



    /* =================================================
       CENTER MODEL
    ================================================= */

    model.position.x -=
        center.x;


    model.position.y -=
        center.y;


    model.position.z -=
        center.z;



    /* =================================================
       AUTO SIZE
    ================================================= */

    const biggest =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        biggest > 0 &&
        Number.isFinite(biggest)
    ){

        const automaticScale =
            0.55 / biggest;


        model.scale.setScalar(
            automaticScale
        );

    }



    /* =================================================
       ADD TO HEAD ANCHOR
    ================================================= */

    offset.add(
        model
    );



    /*
       Make sure model follows
       the tracked head.
    */

    model.matrixAutoUpdate =
        true;



    console.log(
        "3D model attached to head."
    );



    /*
       Hide Part 1 test objects
       if they exist.
    */

    const testHead =
        window.testHead;


    const axes =
        window.axes;


    if(testHead){

        testHead.visible =
            false;

    }


    if(axes){

        axes.visible =
            false;

    }



    const status =
        document.getElementById(
            "status"
        );


    if(status){

        status.textContent =
            "3D MODEL ATTACHED";

    }

}



/* =====================================================
   GLB / GLTF
===================================================== */

async function loadGLTF(
    file
){

    const loader =
        new GLTFLoader();


    const url =
        URL.createObjectURL(
            file
        );


    try{

        const result =
            await loader.loadAsync(
                url
            );


        prepareModel(
            result.scene
        );


    }
    finally{

        URL.revokeObjectURL(
            url
        );

    }

}



/* =====================================================
   FBX
===================================================== */

async function loadFBX(
    file
){

    const loader =
        new FBXLoader();


    const url =
        URL.createObjectURL(
            file
        );


    try{

        const result =
            await loader.loadAsync(
                url
            );


        prepareModel(
            result
        );


    }
    finally{

        URL.revokeObjectURL(
            url
        );

    }

}



/* =====================================================
   OBJ
===================================================== */

async function loadOBJ(
    file
){

    const loader =
        new OBJLoader();


    const url =
        URL.createObjectURL(
            file
        );


    try{

        const result =
            await loader.loadAsync(
                url
            );


        prepareModel(
            result
        );


    }
    finally{

        URL.revokeObjectURL(
            url
        );

    }

}



/* =====================================================
   FILE SELECT
===================================================== */

modelFile.addEventListener(
    "change",

    async event => {


        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        const filename =
            file.name.toLowerCase();



        try{


            const status =
                document.getElementById(
                    "status"
                );


            if(status){

                status.textContent =
                    "Loading 3D Model...";

            }



            /* =========================================
               GLB
            ========================================= */

            if(
                filename.endsWith(
                    ".glb"
                )
            ){

                await loadGLTF(
                    file
                );

            }



            /* =========================================
               GLTF
            ========================================= */

            else if(
                filename.endsWith(
                    ".gltf"
                )
            ){

                await loadGLTF(
                    file
                );

            }



            /* =========================================
               FBX
            ========================================= */

            else if(
                filename.endsWith(
                    ".fbx"
                )
            ){

                await loadFBX(
                    file
                );

            }



            /* =========================================
               OBJ
            ========================================= */

            else if(
                filename.endsWith(
                    ".obj"
                )
            ){

                await loadOBJ(
                    file
                );

            }



            else{

                alert(
                    "केवल GLB, GLTF, FBX या OBJ file चुनें."
                );

            }


        }
        catch(error){

            console.error(
                "MODEL ERROR:",
                error
            );


            alert(
                "3D Model Load नहीं हुआ.\n\n" +
                error.message
            );


            const status =
                document.getElementById(
                    "status"
                );


            if(status){

                status.textContent =
                    "MODEL LOAD FAILED";

            }

        }



        /*
           Same file दोबारा select
           करने की अनुमति.
        */

        modelFile.value =
            "";

    }
);



/* =====================================================
   REMOVE BUTTON
===================================================== */

removeModel.addEventListener(
    "click",

    () => {


        deleteCurrentModel();



        const testHead =
            window.testHead;


        const axes =
            window.axes;


        if(testHead){

            testHead.visible =
                true;

        }


        if(axes){

            axes.visible =
                true;

        }


        const status =
            document.getElementById(
                "status"
            );


        if(status){

            status.textContent =
                "3D MODEL REMOVED";

        }

    }
);


      </script><!-- =====================================================

<style>

/* =====================================================
   CONTROL PANEL
===================================================== */

#characterControls{

    position:absolute;

    z-index:45;

<script>

/* =====================================================
   PART 3 — CHARACTER CONTROL SYSTEM
===================================================== */


/*
   Part 2 से आया हुआ modelOffset
   tracking head के अंदर है.

   इसलिए हम केवल modelOffset को
   manually adjust करेंगे.

   Head tracking अपनी जगह चलता रहेगा.
*/


const characterOffset =
    window.modelOffset;


/* =====================================================
   CHECK
===================================================== */

if(!characterOffset){

    console.error(
        "modelOffset नहीं मिला."
    );

}


/* =====================================================
   CONTROLS
===================================================== */

const upDown =
    document.getElementById(
        "upDown"
    );

const leftRight =
    document.getElementById(
        "leftRight"
    );

const frontBack =
    document.getElementById(
        "frontBack"
    );

const modelSize =
    document.getElementById(
        "modelSize"
    );

const rotationX =
    document.getElementById(
        "rotationX"
    );

const rotationY =
    document.getElementById(
        "rotationY"
    );

const rotationZ =
    document.getElementById(
        "rotationZ"
    );


const upDownValue =
    document.getElementById(
        "upDownValue"
    );

const leftRightValue =
    document.getElementById(
        "leftRightValue"
    );

const frontBackValue =
    document.getElementById(
        "frontBackValue"
    );

const sizeValue =
    document.getElementById(
        "sizeValue"
    );

const rotationXValue =
    document.getElementById(
        "rotationXValue"
    );

const rotationYValue =
    document.getElementById(
        "rotationYValue"
    );

const rotationZValue =
    document.getElementById(
        "rotationZValue"
    );


const resetCharacter =
    document.getElementById(
        "resetCharacter"
    );


/* =====================================================
   DEFAULT VALUES
===================================================== */

const defaultSettings = {

    x:0,

    y:0,

    z:0,

    scale:1,

    rx:0,

    ry:0,

    rz:0

};


/* =====================================================
   APPLY CONTROLS
===================================================== */

function updateCharacter(){

    if(!characterOffset){

        return;

    }


    /* ---------------------------------------------
       POSITION
    --------------------------------------------- */

    characterOffset.position.x =
        Number(
            leftRight.value
        );


    characterOffset.position.y =
        Number(
            upDown.value
        );


    characterOffset.position.z =
        Number(
            frontBack.value
        );


    /* ---------------------------------------------
       ROTATION
    --------------------------------------------- */

    characterOffset.rotation.x =
        THREE.MathUtils.degToRad(
            Number(
                rotationX.value
            )
        );


    characterOffset.rotation.y =
        THREE.MathUtils.degToRad(
            Number(
                rotationY.value
            )
        );


    characterOffset.rotation.z =
        THREE.MathUtils.degToRad(
            Number(
                rotationZ.value
            )
        );


    /* ---------------------------------------------
       SCALE
    --------------------------------------------- */

    const scale =
        Number(
            modelSize.value
        );


    characterOffset.scale.set(
        scale,
        scale,
        scale
    );


    /* ---------------------------------------------
       VALUES ON SCREEN
    --------------------------------------------- */

    upDownValue.textContent =
        Number(
            upDown.value
        ).toFixed(2);


    leftRightValue.textContent =
        Number(
            leftRight.value
        ).toFixed(2);


    frontBackValue.textContent =
        Number(
            frontBack.value
        ).toFixed(2);


    sizeValue.textContent =
        Number(
            modelSize.value
        ).toFixed(2);


    rotationXValue.textContent =
        rotationX.value + "°";


    rotationYValue.textContent =
        rotationY.value + "°";


    rotationZValue.textContent =
        rotationZ.value + "°";

}


/* =====================================================
   SLIDER EVENTS
===================================================== */

upDown.addEventListener(
    "input",
    updateCharacter
);


leftRight.addEventListener(
    "input",
    updateCharacter
);


frontBack.addEventListener(
    "input",
    updateCharacter
);


modelSize.addEventListener(
    "input",
    updateCharacter
);


rotationX.addEventListener(
    "input",
    updateCharacter
);


rotationY.addEventListener(
    "input",
    updateCharacter
);


rotationZ.addEventListener(
    "input",
    updateCharacter
);


/* =====================================================
   RESET
===================================================== */

resetCharacter.addEventListener(
    "click",

    () => {

        upDown.value =
            defaultSettings.y;

        leftRight.value =
            defaultSettings.x;

        frontBack.value =
            defaultSettings.z;

        modelSize.value =
            defaultSettings.scale;

        rotationX.value =
            defaultSettings.rx;

        rotationY.value =
            defaultSettings.ry;

        rotationZ.value =
            defaultSettings.rz;


        updateCharacter();

    }
);


/* =====================================================
   INITIAL UPDATE
===================================================== */

updateCharacter();

      </script><!-- =====================================================

<script>

/* =====================================================
   PART 4
   VIDEO RECORDING SYSTEM
===================================================== */


/* =====================================================
   DOM
===================================================== */

const recordBtn =
    document.getElementById(
        "recordBtn"
    );


const stopRecordBtn =
    document.getElementById(
        "stopRecordBtn"
    );


const downloadRecordBtn =
    document.getElementById(
        "downloadRecordBtn"
    );


const videoElement =
    document.getElementById(
        "video"
    );


const threeCanvasElement =
    document.getElementById(
        "threeCanvas"
    );


/* =====================================================
   VARIABLES
===================================================== */

let mediaRecorder =
    null;


let recordedChunks =
    [];


let recordedVideoBlob =
    null;


let recordedVideoURL =
    null;



/* =====================================================
   RECORDING CANVAS
===================================================== */

/*
    Camera video + Three.js AR layer
    एक ही canvas में combine होंगे।

    इससे recording में 3D character
    भी दिखाई देगा।
*/

const recordCanvas =
    document.createElement(
        "canvas"
    );


const recordContext =
    recordCanvas.getContext(
        "2d"
    );



/* =====================================================
   RECORDING SIZE
===================================================== */

function resizeRecordingCanvas(){

    const width =
        videoElement.videoWidth ||
        1280;


    const height =
        videoElement.videoHeight ||
        720;


    recordCanvas.width =
        width;


    recordCanvas.height =
        height;

}


videoElement.addEventListener(
    "loadedmetadata",
    resizeRecordingCanvas
);



/* =====================================================
   DRAW CAMERA + AR
===================================================== */

function drawRecordingFrame(){

    if(
        !recordContext
    ){

        return;

    }


    const width =
        recordCanvas.width;


    const height =
        recordCanvas.height;


    /*
        Clear
    */

    recordContext.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        MIRROR

        Camera और 3D canvas को
        preview जैसा mirror करेंगे।
    */

    if(
        window.mirrorEnabled !== false
    ){

        recordContext.save();

        recordContext.translate(
            width,
            0
        );

        recordContext.scale(
            -1,
            1
        );

        recordContext.drawImage(
            videoElement,
            0,
            0,
            width,
            height
        );

        recordContext.restore();


    }else{

        recordContext.drawImage(
            videoElement,
            0,
            0,
            width,
            height
        );

    }


    /*
        Three.js canvas overlay
    */

    if(
        window.mirrorEnabled !== false
    ){

        recordContext.save();

        recordContext.translate(
            width,
            0
        );

        recordContext.scale(
            -1,
            1
        );

        recordContext.drawImage(
            threeCanvasElement,
            0,
            0,
            width,
            height
        );

        recordContext.restore();


    }else{

        recordContext.drawImage(
            threeCanvasElement,
            0,
            0,
            width,
            height
        );

    }


    /*
        Continue while recording.
    */

    if(
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
    ){

        requestAnimationFrame(
            drawRecordingFrame
        );

    }

}



/* =====================================================
   FIND SUPPORTED VIDEO FORMAT
===================================================== */

function getRecordingMimeType(){

    const formats = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm",

        "video/mp4"

    ];


    for(
        const type of formats
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return type;

        }

    }


    return "";

}



/* =====================================================
   START RECORDING
===================================================== */

recordBtn.addEventListener(
    "click",

    () => {


        if(
            !videoElement.srcObject
        ){

            alert(
                "पहले camera start करें."
            );

            return;

        }


        resizeRecordingCanvas();


        recordedChunks =
            [];


        recordedVideoBlob =
            null;


        if(
            recordedVideoURL
        ){

            URL.revokeObjectURL(
                recordedVideoURL
            );

            recordedVideoURL =
                null;

        }


        const stream =
            recordCanvas.captureStream(
                30
            );


        const mimeType =
            getRecordingMimeType();


        try{


            mediaRecorder =
                mimeType

                ? new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            mimeType
                    }
                )

                : new MediaRecorder(
                    stream
                );


        }catch(error){

            console.error(
                error
            );


            alert(
                "इस browser में video recording supported नहीं है."
            );

            return;

        }



        /* =============================================
           DATA
        ============================================= */

        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            };



        /* =============================================
           RECORDING COMPLETE
        ============================================= */

        mediaRecorder.onstop =
            () => {


                const finalType =
                    mimeType ||
                    "video/webm";


                recordedVideoBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                finalType
                        }
                    );


                recordedVideoURL =
                    URL.createObjectURL(
                        recordedVideoBlob
                    );


                downloadRecordBtn.disabled =
                    false;


                recordBtn.disabled =
                    false;


                stopRecordBtn.disabled =
                    true;


                const status =
                    document.getElementById(
                        "status"
                    );


                if(status){

                    status.textContent =
                        "RECORDING READY";

                }

            };



        /* =============================================
           START
        ============================================= */

        mediaRecorder.start(
            1000
        );


        recordBtn.disabled =
            true;


        stopRecordBtn.disabled =
            false;


        downloadRecordBtn.disabled =
            true;


        const status =
            document.getElementById(
                "status"
            );


        if(status){

            status.textContent =
                "🔴 RECORDING";

        }


        drawRecordingFrame();

    }

);



/* =====================================================
   STOP RECORDING
===================================================== */

stopRecordBtn.addEventListener(
    "click",

    () => {

        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            mediaRecorder.stop();

        }

    }
);



/* =====================================================
   SAVE VIDEO
===================================================== */

downloadRecordBtn.addEventListener(
    "click",

    () => {


        if(
            !recordedVideoBlob
        ){

            return;

        }


        const link =
            document.createElement(
                "a"
            );


        link.href =
            recordedVideoURL;


        /*
            Browser-compatible extension
        */

        const extension =
            recordedVideoBlob.type
            .includes("mp4")
            ? "mp4"
            : "webm";


        link.download =
            "AR-Character-Recording." +
            extension;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }

);



/* =====================================================
   IMPORTANT:
   MAKE MIRROR VARIABLE GLOBAL
===================================================== */

window.mirrorEnabled =
    true;



/* =====================================================
   PATCH MIRROR BUTTON
===================================================== */

if(
    typeof mirrorBtn !==
    "undefined"
){

    mirrorBtn.addEventListener(
        "click",

        () => {

            window.mirrorEnabled =
                !window.mirrorEnabled;

        }
    );

}



/* =====================================================
   CAMERA BUTTON
===================================================== */

if(
    typeof cameraBtn !==
    "undefined"
){

    cameraBtn.textContent =
        "🔄 SWITCH CAMERA";

}

<script>

/* =====================================================
   PART 5
   PROJECT SETTINGS SYSTEM
===================================================== */


/* =====================================================
   ELEMENTS
===================================================== */

const exportProject =
    document.getElementById(
        "exportProject"
    );


const importProject =
    document.getElementById(
        "importProject"
    );



/* =====================================================
   SAFE NUMBER
===================================================== */

function safeNumber(
    value,
    fallback = 0
){

    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : fallback;

}



/* =====================================================
   GET CURRENT CHARACTER SETTINGS
===================================================== */

function getCharacterSettings(){

    const offset =
        window.modelOffset;


    if(
        !offset
    ){

        return null;

    }


    return {

        position:{

            x:
                safeNumber(
                    offset.position.x
                ),

            y:
                safeNumber(
                    offset.position.y
                ),

            z:
                safeNumber(
                    offset.position.z
                )

        },


        rotation:{

            x:
                safeNumber(
                    THREE.MathUtils.radToDeg(
                        offset.rotation.x
                    )
                ),

            y:
                safeNumber(
                    THREE.MathUtils.radToDeg(
                        offset.rotation.y
                    )
                ),

            z:
                safeNumber(
                    THREE.MathUtils.radToDeg(
                        offset.rotation.z
                    )
                )

        },


        scale:{

            x:
                safeNumber(
                    offset.scale.x,
                    1
                ),

            y:
                safeNumber(
                    offset.scale.y,
                    1
                ),

            z:
                safeNumber(
                    offset.scale.z,
                    1
                )

        }

    };

}



/* =====================================================
   EXPORT
===================================================== */

exportProject.addEventListener(
    "click",

    () => {

        const character =
            getCharacterSettings();


        if(
            !character
        ){

            alert(
                "3D character system अभी तैयार नहीं है."
            );

            return;

        }


        const project = {

            app:

                "AR 3D Face Tracking",


            version:

                "1.0",


            created:

                new Date().toISOString(),


            camera:

                window.currentFacingMode ||
                "user",


            mirror:

                window.mirrorEnabled !== false,


            model:

                {

                    filename:

                        window.currentModelName ||
                        "",

                    settings:

                        character

                }

        };


        const json =
            JSON.stringify(
                project,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "AR-Character-Project.json";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        const status =
            document.getElementById(
                "status"
            );


        if(status){

            status.textContent =
                "SETTINGS EXPORTED";

        }

    }

);



/* =====================================================
   IMPORT
===================================================== */

importProject.addEventListener(
    "change",

    event => {


        const file =
            event.target.files[0];


        if(
            !file
        ){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            () => {

                try{

                    const project =
                        JSON.parse(
                            reader.result
                        );


                    applyProjectSettings(
                        project
                    );


                }catch(error){

                    console.error(
                        error
                    );


                    alert(
                        "Invalid project JSON file."
                    );

                }

            };


        reader.readAsText(
            file
        );


        /*
            Same file को दोबारा
            select करने की अनुमति
        */

        event.target.value =
            "";

    }

);



/* =====================================================
   APPLY PROJECT
===================================================== */

function applyProjectSettings(
    project
){

    if(
        !project ||
        !project.model ||
        !project.model.settings
    ){

        alert(
            "Project settings नहीं मिले."
        );

        return;

    }


    const offset =
        window.modelOffset;


    if(
        !offset
    ){

        alert(
            "पहले Part 1 initialize होने दें."
        );

        return;

    }


    const settings =
        project.model.settings;



    /* =================================================
       POSITION
    ================================================= */

    if(
        settings.position
    ){

        offset.position.set(

            safeNumber(
                settings.position.x
            ),

            safeNumber(
                settings.position.y
            ),

            safeNumber(
                settings.position.z
            )

        );

    }



    /* =================================================
       ROTATION
    ================================================= */

    if(
        settings.rotation
    ){

        offset.rotation.set(

            THREE.MathUtils.degToRad(
                safeNumber(
                    settings.rotation.x
                )
            ),

            THREE.MathUtils.degToRad(
                safeNumber(
                    settings.rotation.y
                )
            ),

            THREE.MathUtils.degToRad(
                safeNumber(
                    settings.rotation.z
                )
            )

        );

    }



    /* =================================================
       SCALE
    ================================================= */

    if(
        settings.scale
    ){

        offset.scale.set(

            safeNumber(
                settings.scale.x,
                1
            ),

            safeNumber(
                settings.scale.y,
                1
            ),

            safeNumber(
                settings.scale.z,
                1
            )

        );

    }



    /* =================================================
       MIRROR
    ================================================= */

    if(
        typeof project.mirror ===
        "boolean"
    ){

        window.mirrorEnabled =
            project.mirror;


        /*
            Part 1 mirror variable
        */

        if(
            typeof mirrorEnabled !==
            "undefined"
        ){

            mirrorEnabled =
                project.mirror;

        }


        const stage =
            document.getElementById(
                "stage"
            );


        if(stage){

            stage.style.transform =
                project.mirror
                ? "scaleX(-1)"
                : "scaleX(1)";

        }

    }



    /* =================================================
       UPDATE SLIDERS
    ================================================= */

    updateControlSlidersFromModel();



    /* =================================================
       STATUS
    ================================================= */

    const status =
        document.getElementById(
            "status"
        );


    if(status){

        status.textContent =
            "SETTINGS IMPORTED";

    }

}



/* =====================================================
   UPDATE PART 3 SLIDERS
===================================================== */

function updateControlSlidersFromModel(){

    const offset =
        window.modelOffset;


    if(
        !offset
    ){

        return;

    }


    const upDown =
        document.getElementById(
            "upDown"
        );


    const leftRight =
        document.getElementById(
            "leftRight"
        );


    const frontBack =
        document.getElementById(
            "frontBack"
        );


    const modelSize =
        document.getElementById(
            "modelSize"
        );


    const rotationX =
        document.getElementById(
            "rotationX"
        );


    const rotationY =
        document.getElementById(
            "rotationY"
        );


    const rotationZ =
        document.getElementById(
            "rotationZ"
        );



    if(upDown){

        upDown.value =
            offset.position.y;

    }


    if(leftRight){

        leftRight.value =
            offset.position.x;

    }


    if(frontBack){

        frontBack.value =
            offset.position.z;

    }


    if(modelSize){

        modelSize.value =
            offset.scale.x;

    }


    if(rotationX){

        rotationX.value =
            THREE.MathUtils.radToDeg(
                offset.rotation.x
            );

    }


    if(rotationY){

        rotationY.value =
            THREE.MathUtils.radToDeg(
                offset.rotation.y
            );

    }


    if(rotationZ){

        rotationZ.value =
            THREE.MathUtils.radToDeg(
                offset.rotation.z
            );

    }

}



/* =====================================================
   CURRENT MODEL NAME
===================================================== */

window.currentModelName =
    "";



/* =====================================================
   HELPER FOR PART 2
===================================================== */

window.setCurrentModelName =
    function(name){

        window.currentModelName =
            name || "";

    };



/* =====================================================
   FINAL STATUS
===================================================== */

console.log(
    "PART 5 READY"
);

                      </script>
