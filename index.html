<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Azeez AR Studio</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:#080b12;color:#fff;
  font-family:Arial,sans-serif;
}
body{overflow:hidden}
button,input,select{font:inherit}
button{
  background:#182235;color:white;border:1px solid #34445f;
  border-radius:10px;padding:10px 12px;
}
button:active{background:#3154a0}
button.active{background:#087f68}
header{
  height:52px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  background:#101725;border-bottom:1px solid #293449;
}
header strong{font-size:17px;letter-spacing:.5px}
#status{font-size:11px;color:#80e9c4}
#stage{
  position:relative;width:100%;height:calc(100dvh - 52px);
  overflow:hidden;background:#05070b;
}
#cameraVideo,#arCanvas,#dotsCanvas{
  position:absolute;inset:0;width:100%;height:100%;
}
#cameraVideo{object-fit:contain;background:#05070b}
#arCanvas{pointer-events:auto;touch-action:none}
#dotsCanvas{pointer-events:none}
#cameraVideo.mirrored{transform:scaleX(-1)}
#topControls{
  position:absolute;top:10px;left:8px;right:8px;
  display:flex;flex-wrap:wrap;gap:6px;z-index:5;
}
#bottomControls{
  position:absolute;bottom:12px;left:8px;right:8px;
  display:flex;flex-wrap:wrap;gap:6px;z-index:5;
}
.panel{
  position:absolute;top:76px;left:8px;bottom:78px;
  width:min(310px,88vw);overflow-y:auto;
  background:#101725ee;border:1px solid #34445f;
  border-radius:14px;padding:12px;z-index:8;
}
.panel h3{font-size:15px;margin:4px 0 12px}
.panel button{margin:3px 0}
.panel label{display:block;font-size:12px;color:#c9d4e8;margin-top:12px}
.panel input[type=range]{width:100%;margin-top:7px}
.panel input[type=file]{width:100%;font-size:12px;margin-top:8px}
.panel select{width:100%;padding:8px;background:#182235;color:white}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{flex:1}
.crop{
  position:absolute;width:100px;height:65px;
  border:1px solid #5ce8bd;object-fit:contain;
  background:#111;z-index:4;display:none;
}
#eyeCropCanvas{top:62px;right:10px}
#mouthCropCanvas{top:135px;right:10px}
.hidden{display:none!important}
.small{font-size:11px;color:#aebbd0;line-height:1.5}
#notice{
  position:absolute;left:10px;right:10px;top:55px;
  text-align:center;font-size:12px;color:#b6c7df;
  z-index:4;pointer-events:none;
}
@media (orientation:landscape){
  #stage{height:calc(100dvh - 52px)}
  .panel{top:64px;bottom:65px}
  #topControls{max-width:75%}
}
</style>

<body>
<header>
  <strong>AZEEZ AR STUDIO</strong>

</header>

<main id="stage">
  <video id="cameraVideo" autoplay muted playsinline></video>
  <canvas id="arCanvas"></canvas>

  <canvas id="eyeCropCanvas" class="crop"></canvas>
  <canvas id="mouthCropCanvas" class="crop"></canvas>

  <div id="topControls">

</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
const $ = id => document.getElementById(id);

const video = $("cameraVideo");
const stage = $("stage");
const statusText = $("status");
const notice = $("notice");
const dotsCanvas = $("dotsCanvas");
const dotsCtx = dotsCanvas.getContext("2d");
const eyeCanvas = $("eyeCropCanvas");
const mouthCanvas = $("mouthCropCanvas");
const eyeCtx = eyeCanvas.getContext("2d");
const mouthCtx = mouthCanvas.getContext("2d");

let cameraStream = null;
let facingMode = "user";
let mirrored = false;
let trackingOn = false;
let showDots = true;
let showModel = true;
let recording = false;
let mediaRecorder = null;
let recordedChunks = [];
let faceLandmarker = null;
let visionReady = false;
let lastLandmarks = null;
let animationFrame = 0;

let renderer, scene, arCamera, controls;
let transformControls = null;  
let currentModel = null;
let neutralFaceMatrix = null;
let facePositionBaseline = null;
let neutralFaceWidth = null;
let headRotationActive = false;
let currentAssetURL = null;
let importedImage = null;
let importedVideo = null;
let activeSlot = 1;
const slotAssets = {1:null,2:null,3:null,4:null};

function setStatus(message) {
  statusText.textContent = message;
}

function setNotice(message) {
  notice.textContent = message;
}

function resizeCanvases() {
  const rect = stage.getBoundingClientRect();
  const width = Math.max(1, Math.floor(rect.width));
  const height = Math.max(1, Math.floor(rect.height));

  for (const canvas of [dotsCanvas, $("arCanvas")]) {
    canvas.width = width;
    canvas.height = height;
  }

  if (renderer && arCamera) {
    renderer.setSize(width, height, false);
    arCamera.aspect = width / height;
    arCamera.updateProjectionMatrix();
  }
}

function initThree() {
  if (renderer) return;

  scene = new THREE.Scene();
  arCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
  arCamera.position.set(0, 0, 5);

  renderer = new THREE.WebGLRenderer({
    canvas: $("arCanvas"),
    alpha: true,
    antialias: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(2, 4, 5);
  scene.add(light);

  controls = new OrbitControls(arCamera, renderer.domElement);
  controls.enableDamping = true;
  controls.enabled = false;
transformControls = new TransformControls(arCamera, renderer.domElement);
transformControls.setMode("translate");

scene.add(transformControls.getHelper());
transformControls.getHelper().visible = false;

transformControls.addEventListener("dragging-changed", event => {
  if (controls) controls.enabled = !event.value;
});
  

  resizeCanvases();
  renderLoop();
}

function renderLoop() {
  animationFrame = requestAnimationFrame(renderLoop);
  if (controls) controls.update();
  if (renderer && scene && arCamera) renderer.render(scene, arCamera);
}

async function startCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera API unavailable. Open this page using HTTPS.");
    }

    stopCamera(false);

    setStatus("OPENING CAMERA...");
    setNotice("Please allow camera access");

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    resizeCanvases();
    setStatus("CAMERA ON");
    setNotice("Camera ready");
  } catch (error) {
    console.error("Camera error:", error);
    setStatus("CAMERA ERROR");
    setNotice(error.message || "Could not start camera. Check permissions.");
  }
}

function stopCamera(updateStatus = true) {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.pause();
  video.srcObject = null;

  if (updateStatus) {
    setStatus("CAMERA OFF");
    setNotice("Camera stopped");
  }
}

async function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  if (cameraStream) await startCamera();
}

function toggleMirror() {
  mirrored = !mirrored;
  video.classList.toggle("mirrored", mirrored);
  $("mirrorBtn").textContent = mirrored ? "MIRROR ON" : "MIRROR OFF";
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen?.();
  } else if (stage.requestFullscreen) {
    stage.requestFullscreen().catch(() => {
      stage.classList.toggle("fallbackFullscreen");
    });
  } else {
    stage.classList.toggle("fallbackFullscreen");
  }
}

async function startTracking() {
  try {
    if (!cameraStream) {
      setNotice("Start camera first");
      return;
    }

    if (!faceLandmarker) {
      setStatus("LOADING FACE TRACKER...");
      const visionModule = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
);

      const vision = await visionModule.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
);

      faceLandmarker = await visionModule.FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 4,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        }
      );
    }

    visionReady = true;
    trackingOn = true;
    facePositionBaseline = null;
    $("trackingBtn").textContent = "STOP TRACKING";
    setStatus("TRACKING ON");
    setNotice("Face tracking active");
    trackLoop();
  } catch (error) {
    console.error("Tracking error:", error);
    setStatus("TRACKING ERROR");
    setNotice("Tracker failed to load. Check internet and reload.");
  }
}

function stopTracking() {
  trackingOn = false;
  lastLandmarks = null;
  $("trackingBtn").textContent = "START TRACKING";
  dotsCtx.clearRect(0, 0, dotsCanvas.width, dotsCanvas.height);
  setStatus(cameraStream ? "CAMERA ON" : "READY");
}

function trackLoop() {
  if (!trackingOn || !faceLandmarker) return;

  if (video.readyState >= 2 && video.videoWidth > 0) {
    try {
      const now = performance.now();
      const result = faceLandmarker.detectForVideo(video, now);
      const faceMatrices = result.facialTransformationMatrixes || [];
      console.log("Face matrix count:", faceMatrices.length);
      if (currentModel && faceMatrices.length > 0) {
  const data = faceMatrices[0].data;

  if (data && data.length === 16) {
    const faceMatrix = new THREE.Matrix4().fromArray(Array.from(data));
    const faceQuaternion = new THREE.Quaternion();
    const facePosition = new THREE.Vector3();
    const faceScale = new THREE.Vector3();

    faceMatrix.decompose(facePosition, faceQuaternion, faceScale);
    let positionInfo = document.getElementById("facePositionInfo");

if (!positionInfo) {
  positionInfo = document.createElement("div");
  positionInfo.id = "facePositionInfo";

  positionInfo.style.cssText =
    "position:fixed;top:10px;left:10px;color:white;background:black;padding:8px;z-index:99999;font-size:14px;";

  document.body.appendChild(positionInfo);
}

positionInfo.textContent =
  "X: " + facePosition.x.toFixed(2) +
  " | Y: " + facePosition.y.toFixed(2) +
  " | Z: " + facePosition.z.toFixed(2);

    const sliderRotation = new THREE.Euler(
      THREE.MathUtils.degToRad(Number($("rotateXSlider").value)),
      THREE.MathUtils.degToRad(Number($("rotateYSlider").value)),
      THREE.MathUtils.degToRad(Number($("rotateZSlider").value)),
      "XYZ"
    );

    const sliderQuaternion = new THREE.Quaternion()
      .setFromEuler(sliderRotation);

    const targetQuaternion = faceQuaternion.clone();
targetQuaternion.y *= -1;

currentModel.quaternion.slerp(targetQuaternion.multiply(sliderQuaternion), 0.5);
  }
      }
      const faces = result.faceLandmarks || [];
      if (currentModel && faces.length > 0) {
  const nose = faces[0][1];

if (!facePositionBaseline) {
  facePositionBaseline = {
    x: nose.x,
    y: nose.y,
    modelX: currentModel.position.x,
    modelY: currentModel.position.y
  };
}

  const stageWidth = stage.clientWidth;
const stageHeight = stage.clientHeight;

const videoAspect = video.videoWidth / video.videoHeight;
const stageAspect = stageWidth / stageHeight;

let displayWidth, displayHeight, offsetX, offsetY;

if (videoAspect > stageAspect) {
  displayWidth = stageWidth;
  displayHeight = stageWidth / videoAspect;
  offsetX = 0;
  offsetY = (stageHeight - displayHeight) / 2;
} else {
  displayHeight = stageHeight;
  displayWidth = stageHeight * videoAspect;
  offsetX = (stageWidth - displayWidth) / 2;
  offsetY = 0;
}

const screenX = offsetX +
  (mirrored ? 1 - nose.x : nose.x) * displayWidth;
const screenY = offsetY + nose.y * displayHeight;

const normalizedX = screenX / stageWidth;
const normalizedY = screenY / stageHeight;

const depth = Number($("depthSlider").value);
const distance = Math.max(0.1, arCamera.position.z - depth);

const visibleHeight = 2 * distance *
  Math.tan(THREE.MathUtils.degToRad(arCamera.fov / 2));

const visibleWidth = visibleHeight * arCamera.aspect;

const targetX = (normalizedX - 0.5) * visibleWidth;
const targetY = (0.5 - normalizedY) * visibleHeight + 0.25;

currentModel.position.x +=
  (targetX - currentModel.position.x) * 0.2;

currentModel.position.y +=
  (targetY - currentModel.position.y) * 0.2;
      }
      lastLandmarks = faces;
      drawFaceDots(faces);
      updateFaceCrops(faces);
    } catch (error) {
      console.error("Face detection error:", error);
    }
  }

  requestAnimationFrame(trackLoop);
}

function fitLandmark(point) {
  const width = dotsCanvas.width;
  const height = dotsCanvas.height;
  const videoAspect = video.videoWidth / Math.max(1, video.videoHeight);
  const canvasAspect = width / Math.max(1, height);

  let drawWidth, drawHeight, offsetX, offsetY;
  if (videoAspect > canvasAspect) {
    drawWidth = width;
    drawHeight = width / videoAspect;
    offsetX = 0;
    offsetY = (height - drawHeight) / 2;
  } else {
    drawHeight = height;
    drawWidth = height * videoAspect;
    offsetX = (width - drawWidth) / 2;
    offsetY = 0;
  }

  let x = offsetX + point.x * drawWidth;
  if (mirrored) x = width - x;
  const y = offsetY + point.y * drawHeight;

  return {x, y};
}

function drawFaceDots(faces) {
  dotsCtx.clearRect(0, 0, dotsCanvas.width, dotsCanvas.height);
  if (!showDots || !faces.length) return;

  dotsCtx.fillStyle = "#00ff80";
  for (const face of faces) {
    for (let i = 0; i < face.length; i++) {
      const point = fitLandmark(face[i]);
      dotsCtx.beginPath();
      dotsCtx.arc(point.x, point.y, i % 4 === 0 ? 2.5 : 1.5, 0, Math.PI * 2);
      dotsCtx.fill();
    }
  }
}

function updateFaceCrops(faces) {
  if (!faces.length || video.readyState < 2) return;

  const face = faces[0];
  // Approximate face-relative regions; refined placement comes in later parts.
  const eyePoints = face.filter((p, i) => [33, 133, 159, 145, 362, 263, 386, 374].includes(i));
  const mouthPoints = face.filter((p, i) => [61, 291, 13, 14, 78, 308].includes(i));

  if (eyeCanvas.dataset.enabled === "true" && eyePoints.length) {
    drawCrop(eyeCanvas, eyeCtx, eyePoints, 2.3);
  }
  if (mouthCanvas.dataset.enabled === "true" && mouthPoints.length) {
    drawCrop(mouthCanvas, mouthCtx, mouthPoints, 3.0);
  }
}

function drawCrop(canvas, ctx, points, paddingFactor) {
  const minX = Math.min(...points.map(p => p.x));
  const maxX = Math.max(...points.map(p => p.x));
  const minY = Math.min(...points.map(p => p.y));
  const maxY = Math.max(...points.map(p => p.y));

  const padX = (maxX - minX) * paddingFactor;
  const padY = (maxY - minY) * paddingFactor;

  const sx = Math.max(0, (minX - padX) * video.videoWidth);
  const sy = Math.max(0, (minY - padY) * video.videoHeight);
  const sw = Math.min(video.videoWidth - sx, (maxX - minX + 2 * padX) * video.videoWidth);
  const sh = Math.min(video.videoHeight - sy, (maxY - minY + 2 * padY) * video.videoHeight);

  if (sw <= 0 || sh <= 0) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
}
/* PART 3: Controls, imports, sliders and settings */

function togglePanel() {
  $("controlPanel").classList.toggle("hidden");
}

function toggleDots() {
  showDots = !showDots;
  $("dotsBtn").textContent = showDots ? "GREEN DOTS ON" : "GREEN DOTS OFF";
  if (!showDots) {
    dotsCtx.clearRect(0, 0, dotsCanvas.width, dotsCanvas.height);
  }
}

function toggleTracking() {
  if (trackingOn) stopTracking();
  else startTracking();
}

function toggleMainButtons() {
  $("topControls").classList.toggle("hidden");
  $("bottomControls").classList.toggle("hidden");
}

function toggleSliders() {
  $("sliderArea").classList.toggle("hidden");
}

function bindSlider(id, valueId, callback) {
  const input = $(id);
  const output = $(valueId);

  input.addEventListener("input", () => {
    output.textContent = input.value;
    if (callback) callback(Number(input.value));
  });
}

function setModelTransform() {
  if (!currentModel) return;

  currentModel.scale.setScalar(Number($("scaleSlider").value));
  currentModel.position.x = Number($("horizontalSlider").value);
  currentModel.position.y = Number($("verticalSlider").value);
  currentModel.position.z = Number($("depthSlider").value);

  currentModel.rotation.x = THREE.MathUtils.degToRad(
    Number($("rotateXSlider").value)
  );
  currentModel.rotation.y = THREE.MathUtils.degToRad(
    Number($("rotateYSlider").value)
  );
  currentModel.rotation.z = THREE.MathUtils.degToRad(
    Number($("rotateZSlider").value)
  );
}

function resetSliders() {
  const defaults = {
    scaleSlider: 1,
    depthSlider: 0,
    verticalSlider: 0,
    horizontalSlider: 0,
    rotateXSlider: 0,
    rotateYSlider: 0,
    rotateZSlider: 0,
    eyeSizeSlider: 100,
    mouthSizeSlider: 100
  };

  for (const [id, value] of Object.entries(defaults)) {
    $(id).value = value;
    $(id).dispatchEvent(new Event("input"));
  }

  setModelTransform();
}

function clearCurrentModel() {
  if (currentModel && scene) {
    scene.remove(currentModel);
    currentModel.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const materials = Array.isArray(obj.material)
          ? obj.material : [obj.material];
        materials.forEach(mat => {
          for (const key of ["map", "normalMap", "roughnessMap", "metalnessMap"]) {
            if (mat[key]) mat[key].dispose();
          }
          mat.dispose();
        });
      }
    });
  }

  currentModel = null;
  importedImage = null;

  if (importedVideo) {
    importedVideo.pause();
    importedVideo = null;
  }

  if (currentAssetURL) {
    URL.revokeObjectURL(currentAssetURL);
    currentAssetURL = null;
  }
}

function fitModel(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);

  const largest = Math.max(size.x, size.y, size.z);
  if (largest > 0) {
    model.scale.setScalar(2 / largest);
  }

  scene.add(model);
  currentModel = model;
  transformControls.attach(model);
  transformControls.getHelper().visible = true;
  showModel = true;
  setModelTransform();
  setNotice("3D model loaded");
}

async function loadModel(file) {
  if (!file) return;

  try {
    initThree();
    clearCurrentModel();
    currentAssetURL = URL.createObjectURL(file);

    const ext = file.name.split(".").pop().toLowerCase();
    let loader;

    if (ext === "glb" || ext === "gltf") {
      loader = new GLTFLoader();
    } else if (ext === "obj") {
      loader = new OBJLoader();
    } else if (ext === "fbx") {
      loader = new FBXLoader();
    } else {
      throw new Error("Unsupported 3D model format");
    }

    setNotice("Loading model...");

    if (ext === "glb" || ext === "gltf") {
      loader.load(
        currentAssetURL,
        result => fitModel(result.scene),
        undefined,
        error => {
          console.error(error);
          setNotice("Model could not load. GLTF may need external files.");
        }
      );
    } else {
      loader.load(
        currentAssetURL,
        model => fitModel(model),
        undefined,
        error => {
          console.error(error);
          setNotice("Could not load model");
        }
      );
    }
  } catch (error) {
    console.error("Model import error:", error);
    setNotice(error.message || "Model import failed");
  }
}

function loadImage(file) {
  if (!file) return;

  clearCurrentModel();
  currentAssetURL = URL.createObjectURL(file);
  importedImage = new Image();

  importedImage.onload = () => {
    setNotice("Image imported");
    // Image preview placement will be connected in Part 4.
  };

  importedImage.onerror = () => setNotice("Image could not load");
  importedImage.src = currentAssetURL;
}

function loadVideo(file) {
  if (!file) return;

  clearCurrentModel();
  currentAssetURL = URL.createObjectURL(file);
  importedVideo = document.createElement("video");
  importedVideo.src = currentAssetURL;
  importedVideo.loop = true;
  importedVideo.muted = true;
  importedVideo.playsInline = true;

  importedVideo.addEventListener("loadeddata", () => {
    setNotice("Video imported");
  }, { once: true });

  importedVideo.addEventListener("error", () => {
    setNotice("Video could not load");
  }, { once: true });

  importedVideo.load();
}

function toggleModelVisibility() {
  showModel = !showModel;
  if (currentModel) currentModel.visible = showModel;
  $("hideModelBtn").textContent = showModel ? "HIDE MODEL" : "SHOW MODEL";
}

function toggleCrop(canvas, button, name) {
  const enabled = canvas.dataset.enabled !== "true";
  canvas.dataset.enabled = String(enabled);
  canvas.style.display = enabled ? "block" : "none";
  button.textContent = enabled ? name + " ON" : name;
}

function updateCropSizes() {
  const eyeSize = Number($("eyeSizeSlider").value);
  const mouthSize = Number($("mouthSizeSlider").value);

  eyeCanvas.style.width = eyeSize + "px";
  eyeCanvas.style.height = Math.round(eyeSize * 0.65) + "px";

  mouthCanvas.style.width = mouthSize + "px";
  mouthCanvas.style.height = Math.round(mouthSize * 0.65) + "px";
}

function exportSettings() {
  const settings = {};

  document.querySelectorAll("#sliderArea input").forEach(input => {
    settings[input.id] = input.value;
  });

  settings.mirrored = mirrored;
  settings.showDots = showDots;

  const blob = new Blob(
    [JSON.stringify(settings, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "azeez-ar-settings.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importSettings(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const settings = JSON.parse(reader.result);

      for (const [id, value] of Object.entries(settings)) {
        const input = $(id);
        if (input && input.matches("input[type=range]")) {
          input.value = value;
          input.dispatchEvent(new Event("input"));
        }
      }

      if (typeof settings.mirrored === "boolean" && settings.mirrored !== mirrored) {
        toggleMirror();
      }

      if (typeof settings.showDots === "boolean" && settings.showDots !== showDots) {
        toggleDots();
      }

      setModelTransform();
      setNotice("Settings imported");
    } catch (error) {
      console.error(error);
      setNotice("Invalid settings file");
    }
  };

  reader.readAsText(file);
}

/* Main buttons */
$("startCameraBtn").addEventListener("click", startCamera);
$("switchCameraBtn").addEventListener("click", switchCamera);
$("mirrorBtn").addEventListener("click", toggleMirror);
$("fullscreenBtn").addEventListener("click", toggleFullscreen);

});

/* Sliders */
bindSlider("scaleSlider", "scaleValue", setModelTransform);
bindSlider("depthSlider", "depthValue", setModelTransform);
bindSlider("verticalSlider", "verticalValue", setModelTransform);
bindSlider("horizontalSlider", "horizontalValue", setModelTransform);
bindSlider("rotateXSlider", "rotateXValue", setModelTransform);

bindSlider("rotateZSlider", "rotateZValue", setModelTransform);

/* Asset imports */

$("imageInput").addEventListener("change", event => {

/* Live crops */
$("eyeCropBtn").addEventListener("click", () => {

});
$("mouthCropBtn").addEventListener("click", () => {

/* Settings */
$("exportSettingsBtn").addEventListener("click", exportSettings);
$("importSettingsBtn").addEventListener("click", () => {
  $("settingsInput").click();
});
$("settingsInput").addEventListener("change", event => {
  importSettings(event.target.files[0]);
});

/* Asset slots: save current selection reference */
document.querySelectorAll("[data-slot]").forEach(button => {
  button.addEventListener("click", () => {
    activeSlot = Number(button.dataset.slot);
    slotAssets[activeSlot] = {
      model: currentModel,
      image: importedImage,
      video: importedVideo
    };

    document.querySelectorAll("[data-slot]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    setNotice("Selected slot " + activeSlot);
  });
});

window.addEventListener("resize", resizeCanvases);
document.addEventListener("fullscreenchange", resizeCanvases);

updateCropSizes();
  
/* PART 4: Recording, cleanup and final initialization */


let recordingCanvas = null;
let recordingContext = null;
let recordingFrame = null;
let recordingStream = null;

function startRecording() {
  if (!cameraStream || !video.videoWidth) {
    setNotice("Start camera before recording");
    return;
  }

  if (!window.MediaRecorder || !renderer) {
    setNotice("Recording is not supported");
    return;
  }

  try {
    recordedChunks = [];

    const width = video.videoWidth;
    const height = video.videoHeight;

    recordingCanvas = document.createElement("canvas");
    recordingCanvas.width = width;
    recordingCanvas.height = height;
    recordingContext = recordingCanvas.getContext("2d");

    const drawFrame = () => {
      if (!recordingContext || !recordingCanvas) return;

      recordingContext.drawImage(video, 0, 0, width, height);

      const arCanvas = $("arCanvas");
      recordingContext.drawImage(arCanvas, 0, 0, width, height);

      const dots = $("dotsCanvas");
      recordingContext.drawImage(dots, 0, 0, width, height);

      if (recording) {
        recordingFrame = requestAnimationFrame(drawFrame);
      }
    };

    recording = true;
    drawFrame();

    recordingStream = recordingCanvas.captureStream(30);

    const options = {};
    if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
      options.mimeType = "video/webm;codecs=vp9";
    } else if (MediaRecorder.isTypeSupported("video/webm")) {
      options.mimeType = "video/webm";
    }

    mediaRecorder = new MediaRecorder(recordingStream, options);

    mediaRecorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = () => {
      if (recordingFrame) cancelAnimationFrame(recordingFrame);
      recordingFrame = null;

      if (recordingStream) {
        recordingStream.getTracks().forEach(track => track.stop());
      }
      recordingStream = null;
      recordingCanvas = null;
      recordingContext = null;

      if (!recordedChunks.length) {
        setNotice("No recording data was captured");
        return;
      }

      const blob = new Blob(recordedChunks, {
        type: mediaRecorder.mimeType || "video/webm"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "azeez-ar-recording.webm";
      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 3000);
      setNotice("AR recording downloaded");
    };

    mediaRecorder.start();
    $("recordBtn").textContent = "STOP RECORDING";
    $("recordBtn").classList.add("active");
    setStatus("RECORDING");
    setNotice("Recording camera and AR");
  } catch (error) {
    recording = false;
    console.error("Recording error:", error);
    setNotice("Recording could not start");
  }
}

function stopRecording() {
  recording = false;

  if (recordingFrame) {
    cancelAnimationFrame(recordingFrame);
    recordingFrame = null;
  }

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  $("recordBtn").textContent = "RECORD";
  $("recordBtn").classList.remove("active");
  setStatus(cameraStream ? "CAMERA ON" : "READY");
}

$("recordBtn").addEventListener("click", () => {
  if (recording) stopRecording();
  else startRecording();
});
  

// Stop the camera and tracking cleanly when leaving the page.
window.addEventListener("pagehide", () => {
  trackingOn = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  if (importedVideo) importedVideo.pause();
});

// Initialize the transparent 3D layer.
try {
  initThree();
  setStatus("READY");
  setNotice("Tap START CAMERA to begin");
} catch (error) {
  console.error("AR initialization error:", error);
  setStatus("AR ERROR");
  setNotice("AR layer failed to initialize. Reload and check internet.");
}
function setGizmoMode(mode) {
  if (!transformControls) return;

  transformControls.setMode(mode);

  if (transformControls.object) {
    transformControls.getHelper().visible = true;
  }

  const toggle = document.getElementById("gizmoBtn");
  if (toggle) toggle.textContent = "HIDE GIZMOS";
}

const gizmoToggleButton = document.getElementById("gizmoBtn");
const moveGizmoButton = document.getElementById("moveGizmoBtn");
const rotateGizmoButton = document.getElementById("rotateGizmoBtn");
const scaleGizmoButton = document.getElementById("scaleGizmoBtn");

if (gizmoToggleButton) {
  gizmoToggleButton.addEventListener("click", () => {
    if (!transformControls) return;

    const helper = transformControls.getHelper();
    helper.visible = !helper.visible;

    gizmoToggleButton.textContent =
      helper.visible ? "HIDE GIZMOS" : "SHOW GIZMOS";
  });
}

if (moveGizmoButton) {
  moveGizmoButton.addEventListener("click", () => {
    setGizmoMode("translate");
  });
}

if (rotateGizmoButton) {
  rotateGizmoButton.addEventListener("click", () => {
    setGizmoMode("rotate");
  });
}

if (scaleGizmoButton) {
  scaleGizmoButton.addEventListener("click", () => {
    setGizmoMode("scale");
  });
}
