<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Head Tracking 3D Model</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* मिरर इफ़ेक्ट */
            z-index: 1;
        }
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 10;
            font-size: 16px;
        }
    </style>

    <!-- Three.js, GLTFLoader और MediaPipe की लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">3D मॉडल और कैमरा लोड हो रहा है...</div>
    
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas3d"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas3d');
        const loadingElement = document.getElementById('loading');

        let scene, camera, renderer, headModel;

        function initThreeJS() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            const loader = new THREE.GLTFLoader();
            loader.load(
                'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.gltf', 
                function (gltf) {
                    headModel = gltf.scene;
                    headModel.scale.set(0.8, 0.8, 0.8);
                    scene.add(headModel);
                    headModel.visible = false;
                    loadingElement.style.display = 'none';
                },
                undefined,
                function (error) {
                    console.error('मॉडल लोड एरर:', error);
                    loadingElement.innerText = "3D मॉडल लोड करने में विफल!";
                }
            );

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function initFaceMesh() {
            const faceMesh = new FaceMesh({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                }
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults(onFaceResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });

            cameraUtils.start().catch(err => {
                loadingElement.innerText = "कैमरा एरर: " + err.message;
            });
        }

        // फिक्स किया गया 360-डिग्री हेड ट्रैकिंग और पोजीशन बाइंडिंग लॉजिक
        function onFaceResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // चेहरे का सही सेंटर निकालने के लिए नाक (1), बायां गाल (234) और दायां गाल (454) का औसत लें
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                const centerX = (leftCheek.x + rightCheek.x) / 2;
                const centerY = (nose.y + leftCheek.y + rightCheek.y) / 3;

                // थ्री.जे.एस कोऑर्डिनेट्स में बदलना (मिरर वीडियो के हिसाब से X को एडजस्ट किया गया है)
                const x = -(centerX - 0.5) * 4.2;
                const y = -(centerY - 0.5) * 4.2;
                const z = -nose.z * 2.0;

                if (headModel) {
                    headModel.visible = true;
                    // मॉडल की पोजीशन को चेहरे की लाइव पोजीशन पर सेट करें ताकि वह साथ चले
                    headModel.position.set(x, y - 0.1, z);

                    // सिर के एंगल्स (Yaw, Pitch, Roll) कैलकुलेट करना
                    const dx = rightCheek.x - leftCheek.x;
                    const dy = rightCheek.y - leftCheek.y;
                    const dz = rightCheek.z - leftCheek.z;

                    const topPoint = landmarks[10];
                    const chinPoint = landmarks[152];

                    const yaw = Math.atan2(dz, dx);
                    const pitch = Math.atan2(chinPoint.y - topPoint.y, chinPoint.z - topPoint.z);
                    const roll = Math.atan2(dy, dx);

                    // सिर के रोटेशन को मॉडल पर अप्लाई करें
                    headModel.rotation.y = -yaw + Math.PI / 2;
                    headModel.rotation.x = pitch;
                    headModel.rotation.z = roll;
                }
            } else {
                if (headModel) {
                    headModel.visible = false;
                }
            }

            renderer.render(scene, camera);
        }

        initThreeJS();
        initFaceMesh();
    </script>
</body>
</html>
