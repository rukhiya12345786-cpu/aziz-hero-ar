<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZEEZ AI AR STUDIO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:Arial,sans-serif}
#view{position:fixed;inset:0;background:#080b12;overflow:hidden}
#cameraVideo,#dotsCanvas,#arCanvas{position:absolute;inset:0;width:100%;height:100%;border:0}
#cameraVideo{object-fit:contain;background:#080b12}
#dotsCanvas,#arCanvas{pointer-events:none}
#cameraVideo{z-index:1}
#arCanvas{z-index:2}
#dotsCanvas{z-index:3}
#topbar,#controls{position:absolute;z-index:5;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#topbar{top:env(safe-area-inset-top,10px);padding-top:8px;justify-content:space-between}
#controls{bottom:env(safe-area-inset-bottom,10px);padding-bottom:8px;justify-content:center;max-height:45%;overflow:auto}
.panel{position:absolute;z-index:6;top:70px;left:10px;right:10px;max-height:55%;overflow:auto;padding:12px;border:1px solid #34445f;border-radius:14px;background:rgba(8,13,25,.94)}
button,.file-label{background:#17233a;color:white;border:1px solid #405578;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}
button:active{transform:scale(.98)}
.primary{background:#145de0;border-color:#4b8cff}
.danger{background:#7e2633}
.hidden{display:none!important}
h1{font-size:16px;margin:0}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:14px;margin:12px 0 6px}
p{font-size:12px;line-height:1.5;color:#c4d0e5}
.control-row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
.control-row label{font-size:12px;flex:1}
.control-row input[type=range]{width:55%}
#status{font-size:11px;color:#b8c9e8}
#toast{position:absolute;z-index:10;left:50%;bottom:90px;transform:translateX(-50%);background:#111d31;border:1px solid #405578;border-radius:10px;padding:10px 14px;font-size:12px;max-width:90%;text-align:center;display:none}
#toast.show{display:block}
a{color:#83b5ff}
input[type=file]{max-width:100%;font-size:12px}
@media(orientation:landscape){
 #controls{max-height:38%;justify-content:flex-start}
 #topbar{left:14px;right:14px}
}
</style>
</head>
<body>
<div id="view">
  <video id="cameraVideo" autoplay muted playsinline></video>
  <canvas id="arCanvas"></canvas>
  <canvas id="dotsCanvas"></canvas>

  <div id="topbar">
    <h1>AZEEZ AI AR STUDIO</h1>
    <button id="panelBtn">SETTINGS</button>
  </div>

  <section id="settingsPanel" class="panel hidden">
    <h2>AR Controls</h2>
    <p id="status">Ready. Start the camera first.</p>

    <h3>Face tracking</h3>
    <button id="startTrackingBtn">START TRACKING</button>
    <button id="stopTrackingBtn" disabled>STOP TRACKING</button>
    <button id="greenDotsBtn">GREEN DOTS ON</button>

    <h3>Model file</h3>
    <input id="modelFileInput" type="file" accept=".glb,.gltf,.obj,.fbx">
    <p id="selectedModelName">No model selected. 3D rendering needs a separate setup.</p>

    <h3>Position controls</h3>
    <div class="control-row"><label>Scale</label><input id="scaleSlider" type="range" min="0.2" max="3" step="0.1" value="1"></div>
    <div class="control-row"><label>Left / Right</label><input id="xSlider" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="control-row"><label>Up / Down</label><input id="ySlider" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="control-row"><label>Front / Back</label><input id="zSlider" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="control-row"><label>Rotation</label><input id="rotationSlider" type="range" min="-180" max="180" step="1" value="0"></div>
    <button id="resetSlidersBtn">RESET SLIDERS</button>

    <h3>Settings backup</h3>
    <button id="exportSettingsBtn">EXPORT SETTINGS</button>
    <label class="file-label">IMPORT SETTINGS
      <input id="importSettingsInput" type="file" accept=".json">
    </label>

    <h3>Lens Studio</h3>
    <p>Lens Studio projects do not automatically run inside this web app.</p>
    <a href="https://ar.snap.com/lens-studio" target="_blank" rel="noopener">OPEN OFFICIAL LENS STUDIO SITE</a>
    <br><br>
    <button id="closePanelBtn">CLOSE SETTINGS</button>
  </section>

  <div id="controls">
    <button id="startCameraBtn" class="primary">START CAMERA</button>
    <button id="stopCameraBtn" class="danger" disabled>STOP CAMERA</button>
    <button id="switchCameraBtn">SWITCH CAMERA</button>
    <button id="mirrorBtn">MIRROR OFF</button>
    <button id="fullscreenBtn">FULL SCREEN</button>
    <button id="recordBtn">START RECORDING</button>
  </div>
  <div id="toast"></div>
</div>

</body>
</html>

<script type="module">
const $ = id => document.getElementById(id);

const video = $("cameraVideo");
const dotsCanvas = $("dotsCanvas");
const arCanvas = $("arCanvas");
const dotsCtx = dotsCanvas.getContext("2d");
const arCtx = arCanvas.getContext("2d");

let stream = null;
let tracker = null;
let facingMode = "user";
let mirrored = false;
let tracking = false;
let showDots = true;
let lastVideoTime = -1;
let animationFrame = null;
let recorder = null;
let chunks = [];

function status(message) {
  $("status").textContent = message;
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2500);
}

function resizeCanvases() {
  const width = Math.max(1, dotsCanvas.clientWidth || innerWidth);
  const height = Math.max(1, dotsCanvas.clientHeight || innerHeight);

  [dotsCanvas, arCanvas].forEach(canvas => {
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  });
}

function clearDots() {
  dotsCtx.clearRect(0, 0, dotsCanvas.width, dotsCanvas.height);
}

function updateMirror() {
  video.style.transform = mirrored ? "scaleX(-1)" : "scaleX(1)";
  $("mirrorBtn").textContent = mirrored ? "MIRROR ON" : "MIRROR OFF";
}

function getVideoRect() {
  const cw = dotsCanvas.width;
  const ch = dotsCanvas.height;
  const vw = video.videoWidth || cw;
  const vh = video.videoHeight || ch;
  const scale = Math.min(cw / vw, ch / vh);
  const width = vw * scale;
  const height = vh * scale;

  return {
    x: (cw - width) / 2,
    y: (ch - height) / 2,
    width,
    height
  };
}

async function startCamera() {
  try {
    if (stream) return;

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera needs HTTPS and browser permission.");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    video.muted = true;
    video.playsInline = true;
    await video.play();

    resizeCanvases();
    updateMirror();

    $("startCameraBtn").disabled = true;
    $("stopCameraBtn").disabled = false;
    status("Camera is running.");
    toast("Camera started.");
  } catch (error) {
    console.error(error);
    status("Camera failed: " + error.message);
    toast("Allow camera permission and try again.");
  }
}

function stopTracking() {
  tracking = false;

  if (animationFrame !== null) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  clearDots();
  $("startTrackingBtn").disabled = false;
  $("stopTrackingBtn").disabled = true;
  status("Face tracking stopped.");
}

function stopCamera() {
  stopTracking();

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  $("startCameraBtn").disabled = false;
  $("stopCameraBtn").disabled = true;
  clearDots();

  status("Camera stopped.");
  toast("Camera stopped.");
}

async function switchCamera() {
  const wasRunning = !!stream;

  if (wasRunning) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    $("startCameraBtn").disabled = false;
    $("stopCameraBtn").disabled = true;
  }

  facingMode = facingMode === "user" ? "environment" : "user";

  if (wasRunning) {
    await startCamera();
  } else {
    toast(facingMode === "user" ? "Front camera selected." : "Back camera selected.");
  }
}

async function loadTracker() {
  if (tracker) return tracker;

  status("Loading face tracking model...");

  const mp = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
  );

  const vision = await mp.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  tracker = await mp.FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });

  return tracker;
}

async function startTracking() {
  if (!stream) {
    toast("Start camera first.");
    return;
  }

  try {
    await loadTracker();
    tracking = true;
    lastVideoTime = -1;

    $("startTrackingBtn").disabled = true;
    $("stopTrackingBtn").disabled = false;
    status("Face tracking is running.");
    trackFrame();
  } catch (error) {
    console.error(error);
    stopTracking();
    status("Tracking failed: " + error.message);
    toast("Tracking could not start. Check internet connection.");
  }
}

function trackFrame() {
  if (!tracking || !stream || !tracker) return;

  animationFrame = requestAnimationFrame(trackFrame);

  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  try {
    const result = tracker.detectForVideo(video, performance.now());
    clearDots();

    if (!showDots || !result.faceLandmarks?.length) return;

    const points = result.faceLandmarks[0];
    const rect = getVideoRect();

    dotsCtx.fillStyle = "#00ff66";

    for (const point of points) {
      const px = mirrored ? 1 - point.x : point.x;
      const x = rect.x + px * rect.width;
      const y = rect.y + point.y * rect.height;

      dotsCtx.beginPath();
      dotsCtx.arc(x, y, 2, 0, Math.PI * 2);
      dotsCtx.fill();
    }
  } catch (error) {
    console.error("Tracking frame failed:", error);
  }
}

function toggleDots() {
  showDots = !showDots;
  $("greenDotsBtn").textContent = showDots ? "GREEN DOTS ON" : "GREEN DOTS OFF";
  if (!showDots) clearDots();
}

async function toggleFullscreen() {
  try {
    const target = $("view");

    if (!document.fullscreenElement) {
      await target.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

    setTimeout(resizeCanvases, 150);
  } catch (error) {
    console.error(error);
    toast("Fullscreen is not supported here.");
  }
}

function handleModelFile(file) {
  if (!file) return;

  const extension = file.name.split(".").pop().toLowerCase();
  if (!["glb", "gltf", "obj", "fbx"].includes(extension)) {
    toast("Choose GLB, GLTF, OBJ, or FBX.");
    return;
  }

  $("selectedModelName").textContent = file.name;
  toast("Model selected. 3D rendering is not connected yet.");
}

function exportSettings() {
  const settings = {
    mirrored,
    showDots,
    scale: $("scaleSlider").value,
    x: $("xSlider").value,
    y: $("ySlider").value,
    z: $("zSlider").value,
    rotation: $("rotationSlider").value
  };

  const blob = new Blob([JSON.stringify(settings, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "azeez-ar-settings.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importSettings(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const settings = JSON.parse(reader.result);

      if (typeof settings.mirrored === "boolean") {
        mirrored = settings.mirrored;
        updateMirror();
      }

      if (typeof settings.showDots === "boolean") {
        showDots = settings.showDots;
        $("greenDotsBtn").textContent = showDots
          ? "GREEN DOTS ON"
          : "GREEN DOTS OFF";
        if (!showDots) clearDots();
      }

      ["scale", "x", "y", "z", "rotation"].forEach(key => {
        const ids = {
          scale: "scaleSlider",
          x: "xSlider",
          y: "ySlider",
          z: "zSlider",
          rotation: "rotationSlider"
        };

        if (settings[key] !== undefined) {
          $(ids[key]).value = settings[key];
        }
      });

      toast("Settings imported.");
    } catch (error) {
      toast("Invalid settings file.");
    }
  };

  reader.readAsText(file);
}

function resetSliders() {
  $("scaleSlider").value = 1;
  $("xSlider").value = 0;
  $("ySlider").value = 0;
  $("zSlider").value = 0;
  $("rotationSlider").value = 0;
  toast("Sliders reset.");
}

function toggleRecording() {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
    $("recordBtn").textContent = "START RECORDING";
    return;
  }

  if (!stream) {
    toast("Start camera before recording.");
    return;
  }

  if (!window.MediaRecorder) {
    toast("Recording is not supported by this browser.");
    return;
  }

  try {
    chunks = [];
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "azeez-ar-recording.webm";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Recording downloaded.");
    };

    recorder.start();
    $("recordBtn").textContent = "STOP RECORDING";
    toast("Recording started.");
  } catch (error) {
    console.error(error);
    toast("Recording failed.");
  }
}

// Button listeners
$("startCameraBtn").addEventListener("click", startCamera);
$("stopCameraBtn").addEventListener("click", stopCamera);
$("switchCameraBtn").addEventListener("click", switchCamera);

$("mirrorBtn").addEventListener("click", () => {
  mirrored = !mirrored;
  updateMirror();
});

$("fullscreenBtn").addEventListener("click", toggleFullscreen);
$("startTrackingBtn").addEventListener("click", startTracking);
$("stopTrackingBtn").addEventListener("click", stopTracking);
$("greenDotsBtn").addEventListener("click", toggleDots);
$("modelFileInput").addEventListener("change", event => {
  handleModelFile(event.target.files?.[0]);
});

$("exportSettingsBtn").addEventListener("click", exportSettings);
$("importSettingsInput").addEventListener("change", event => {
  importSettings(event.target.files?.[0]);
});

$("resetSlidersBtn").addEventListener("click", resetSliders);
$("recordBtn").addEventListener("click", toggleRecording);

$("panelBtn").addEventListener("click", () => {
  $("settingsPanel").classList.toggle("hidden");
});

$("closePanelBtn").addEventListener("click", () => {
  $("settingsPanel").classList.add("hidden");
});

video.addEventListener("loadedmetadata", resizeCanvases);

window.addEventListener("resize", () => {
  resizeCanvases();
  clearDots();
});

document.addEventListener("fullscreenchange", () => {
  setTimeout(resizeCanvases, 150);
});

// Initial state
resizeCanvases();
updateMirror();
$("stopCameraBtn").disabled = true;
$("stopTrackingBtn").disabled = true;
status("Ready. Start the camera first.");
</script>
</body>
</html>
