<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Mask & Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1);
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            outline: none;
        }
        .btn.recording {
            background: rgba(255, 0, 0, 0.8);
            border-color: #ff0000;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(18, 18, 18, 0.9);
            padding: 14px 16px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            z-index: 100;
            color: #fff;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        .slider-group {
            margin-bottom: 8px;
        }
        .slider-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 2px;
            color: #ccc;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
        }
    </style>

    <!-- Three.js and Loaders CDN -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/libs/fflate.min.js"></script>

    <!-- MediaPipe Face Mesh CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="top-bar">
        <button class="btn" id="import-btn">Import Model</button>
        <button class="btn" id="record-btn">Record</button>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label>Mask Scale (Size)</label>
            <input type="range" id="scale-slider" min="0.2" max="5" step="0.05" value="1.2">
        </div>
        <div class="slider-group">
            <label>Offset X</label>
            <input type="range" id="pos-x-slider" min="-1" max="1" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>Offset Y</label>
            <input type="range" id="pos-y-slider" min="-1" max="1" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>Offset Z (Depth)</label>
            <input type="range" id="pos-z-slider" min="-2" max="2" step="0.01" value="0">
        </div>
    </div>

    <input type="file" id="file-input" accept=".glb, .gltf, .obj, .fbx, .vrm" style="display: none;">

    <script>
        const videoElement = document.getElementById('webcam-video');
        let currentModel = null;
        let manualScale = 1.2;
        let manualOffsetX = 0;
        let manualOffsetY = 0;
        let manualOffsetZ = 0;

        // Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 0, 2.5);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(0, 1, 2).normalize();
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Robust File Loading using ArrayBuffer to prevent parsing issues
        const importBtn = document.getElementById('import-btn');
        const fileInput = document.getElementById('file-input');

        importBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            if (fileName.endsWith('.glb') || fileName.endsWith('.gltf') || fileName.endsWith('.vrm')) {
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    const contents = e.target.result;
                    const loader = new THREE.GLTFLoader();
                    loader.parse(contents, '', (gltf) => {
                        currentModel = gltf.scene;
                        scene.add(currentModel);
                        alert("Model loaded successfully: " + file.name);
                    }, (err) => {
                        console.error("GLTF Parse Error:", err);
                        alert("Failed to parse GLB/VRM file.");
                    });
                };
            } 
            else if (fileName.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = function (e) {
                    const text = e.target.result;
                    const loader = new THREE.OBJLoader();
                    currentModel = loader.parse(text);
                    scene.add(currentModel);
                    alert("Model loaded successfully: " + file.name);
                };
            } 
            else if (fileName.endsWith('.fbx')) {
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    const contents = e.target.result;
                    const loader = new THREE.FBXLoader();
                    try {
                        currentModel = loader.parse(contents, '');
                        currentModel.scale.set(0.01, 0.01, 0.01); // FBX scale adjustment
                        scene.add(currentModel);
                        alert("Model loaded successfully: " + file.name);
                    } catch (err) {
                        console.error("FBX Parse Error:", err);
                        alert("Failed to parse FBX file.");
                    }
                };
            } else {
                alert("Unsupported format!");
            }
        });

        // Sliders Listeners
        document.getElementById('scale-slider').addEventListener('input', (e) => { manualScale = parseFloat(e.target.value); });
        document.getElementById('pos-x-slider').addEventListener('input', (e) => { manualOffsetX = parseFloat(e.target.value); });
        document.getElementById('pos-y-slider').addEventListener('input', (e) => { manualOffsetY = parseFloat(e.target.value); });
        document.getElementById('pos-z-slider').addEventListener('input', (e) => { manualOffsetZ = parseFloat(e.target.value); });

        // MediaPipe Face Mesh Tracking
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && currentModel) {
                const landmarks = results.multiFaceLandmarks[0];
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                const targetX = (nose.x - 0.5) * -3.0 + manualOffsetX;
                const targetY = (nose.y - 0.5) * -3.0 + manualOffsetY;
                const targetZ = -nose.z * 1.5 + manualOffsetZ;

                currentModel.position.x += (targetX - currentModel.position.x) * 0.3;
                currentModel.position.y += (targetY - currentModel.position.y) * 0.3;
                currentModel.position.z += (targetZ - currentModel.position.z) * 0.3;

                currentModel.scale.set(manualScale, manualScale, manualScale);

                if (leftCheek && rightCheek) {
                    const dx = rightCheek.x - leftCheek.x;
                    const dy = rightCheek.y - leftCheek.y;
                    const dz = rightCheek.z - leftCheek.z;

                    const rotZ = Math.atan2(dy, dx);
                    const rotY = Math.atan2(dz, dx);

                    currentModel.rotation.z = -rotZ;
                    currentModel.rotation.y = rotY + Math.PI;
                }
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        cameraUtils.start().catch(err => {
            console.error("Camera start error:", err);
        });

        // Video Recording Logic implementation
        let mediaRecorder;
        let recordedChunks = [];
        const recordBtn = document.getElementById('record-btn');

        recordBtn.addEventListener('click', () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            recordedChunks = [];
            // Combine webcam video stream and three.js canvas stream
            const canvasStream = renderer.domElement.captureStream(30);
            const videoStream = videoElement.captureStream ? videoElement.captureStream(30) : null;
            
            // If captureStream is supported on video, we can merge or just record canvas over video background
            const stream = canvasStream; 

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
                } catch (err) {
                    mediaRecorder = new MediaRecorder(stream);
                }
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'ar-face-video.webm';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start();
            recordBtn.textContent = "Stop Rec";
            recordBtn.classList.add("recording");
        }

        function stopRecording() {
            mediaRecorder.stop();
            recordBtn.textContent = "Record";
            recordBtn.classList.remove("recording");
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
