<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz Pro Helmet Studio - 360 Head Cover</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; flex-wrap: wrap; gap: 6px; }
        
        .btn {
            background: rgba(0, 0, 0, 0.75); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 12px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(6px);
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }

        .bottom-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(8px);
        }
        .filter-switcher { display: flex; gap: 12px; align-items: center; }
        .filter-thumb {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            background-size: cover; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; background-color: rgba(34,34,34,0.7);
        }
        .filter-thumb.active { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #111, #222); z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
    </style>

    <!-- Reliable Libraries for 3D & Face Tracking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px;">Aziz Pro Helmet Studio</h1>
        <p style="color: #aaa; max-width: 320px;">True 360° Head Enclosure & Custom 3D Model Import</p>
        <button id="launch-btn">START HELMET STUDIO</button>
        <div id="error-log" style="color: #ff4444; font-size: 13px; margin-top: 15px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="import-btn" class="btn interactive">📥 Import 3D Helmet</button>
            <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf">
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb active" id="btn-helmet" onclick="switchAnimoji('helmet')">🪖</div>
                <div class="filter-thumb" id="btn-panda" onclick="switchAnimoji('panda')">🐼</div>
                <div class="filter-thumb" id="btn-skull" onclick="switchAnimoji('skull')">💀</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let helmetGroup = null;
        let currentType = 'helmet';
        let useFront = true;
        let jawPart = null;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Starting Camera...";
            btn.disabled = true;

            try {
                if (typeof THREE === 'undefined') throw new Error("Three.js failed to load.");
                if (typeof FaceMesh === 'undefined') throw new Error("MediaPipe failed to load.");

                await startCamera();
                document.getElementById('start-screen').style.display = 'none';

                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START HELMET STUDIO";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            const fileURL = URL.createObjectURL(file);

            if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (object) => {
                    if (helmetGroup) scene.remove(helmetGroup);
                    helmetGroup = new THREE.Group();
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2, metalness: 0.5 });
                        }
                    });
                    // Scale and center custom imported 3D helmet model to fit head
                    object.scale.set(0.015, 0.015, 0.015);
                    object.position.set(0, 0.1, 0);
                    helmetGroup.add(object);
                    scene.add(helmetGroup);
                    alert("Custom 3D Helmet Loaded Successfully!");
                }, undefined, () => { alert("Error loading .obj file."); });
            } else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    if (helmetGroup) scene.remove(helmetGroup);
                    helmetGroup = new THREE.Group();
                    const model = gltf.scene;
                    model.scale.set(1.2, 1.2, 1.2);
                    model.position.set(0, 0.05, 0);
                    helmetGroup.add(model);
                    scene.add(helmetGroup);
                    alert("Custom 3D Helmet Loaded Successfully!");
                }, undefined, () => { alert("Error loading .glb file."); });
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            buildHelmet('helmet');
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
                const link = document.createElement('a');
                link.download = 'helmet_snap.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            animateLoop();
        }

        function switchAnimoji(type) {
            currentType = type;
            document.querySelectorAll('.filter-thumb').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            buildHelmet(type);
        }

        function buildHelmet(type) {
            if (helmetGroup) scene.remove(helmetGroup);
            helmetGroup = new THREE.Group();

            if (type === 'helmet') {
                // Full 360 Degree Motorcycle Helmet Design
                const shellGeo = new THREE.SphereGeometry(1.05, 32, 32);
                const shellMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 });
                const shell = new THREE.Mesh(shellGeo, shellMat);
                shell.position.set(0, 0.1, 0);
                helmetGroup.add(shell);

                // Visor (Shield)
                const visorGeo = new THREE.CylinderGeometry(1.02, 1.02, 0.6, 32, 1, true, 0, Math.PI);
                const visorMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5, roughness: 0.1, metalness: 0.9, side: THREE.DoubleSide });
                const visor = new THREE.Mesh(visorGeo, visorMat);
                visor.rotation.y = Math.PI / 2;
                visor.position.set(0, 0.15, 0);
                helmetGroup.add(visor);

                jawPart = shell; // Full head moves together

            } else if (type === 'panda') {
                const headGeo = new THREE.SphereGeometry(1.0, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                helmetGroup.add(new THREE.Mesh(headGeo, headMat));

                const earMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const lEar = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), earMat); lEar.position.set(-0.8, 0.8, -0.1);
                const rEar = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), earMat); rEar.position.set(0.8, 0.8, -0.1);
                helmetGroup.add(lEar); helmetGroup.add(rEar);

                jawPart = headGroupMatch();

            } else if (type === 'skull') {
                const headGeo = new THREE.SphereGeometry(1.0, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
                helmetGroup.add(new THREE.Mesh(headGeo, headMat));

                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); lEye.position.set(-0.35, 0.2, 0.9);
                const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); rEye.position.set(0.35, 0.2, 0.9);
                helmetGroup.add(lEye); helmetGroup.add(rEye);
            }

            scene.add(helmetGroup);
        }

        function headGroupMatch() {
            return helmetGroup;
        }

        function initTracking() {
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && helmetGroup) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1], lEdge = lm[234], rEdge = lm[454], forehead = lm[10], chin = lm[152];

                    // 360 Head Center Calculation (Covers entire head depth, not just front face)
                    const cx = (lEdge.x + rEdge.x) / 2;
                    const cy = (forehead.y + chin.y) / 2;
                    const cz = (lEdge.z + rEdge.z + nose.z) / 3;

                    const targetX = -(cx - 0.5) * 3.8;
                    const targetY = -(cy - 0.5) * 3.8 + 0.2; // Adjusted higher to cover full skull/helmet top
                    const targetZ = cz * 1.5;

                    // Smooth interpolation for heavy helmet feel
                    helmetGroup.position.x += (targetX - helmetGroup.position.x) * 0.4;
                    helmetGroup.position.y += (targetY - helmetGroup.position.y) * 0.4;
                    helmetGroup.position.z += (targetZ - helmetGroup.position.z) * 0.4;

                    // Accurate 3D Rotation for complete head coverage (Yaw, Pitch, Roll)
                    const dx = rEdge.x - lEdge.x, dy = rEdge.y - lEdge.y;
                    const roll = Math.atan2(dy, dx);
                    const dz = rEdge.z - lEdge.z;
                    const yaw = Math.asin(Math.max(-1, Math.min(1, dz * 2.0)));
                    const pitch = ((chin.y - forehead.y) - 0.4) * -1.5;

                    helmetGroup.rotation.set(pitch, yaw, roll);
                    helmetGroup.visible = true;
                } else if (helmetGroup) {
                    helmetGroup.visible = false;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => { if (videoEl && videoEl.readyState >= 2) await faceMesh.send({ image: videoEl }); },
                width: 1280, height: 720
            });
            mpCamera.start();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
