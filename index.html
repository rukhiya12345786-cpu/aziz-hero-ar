<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AI AR</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 1;
}

#threeCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#landmarkCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
}

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.75),
        rgba(0,0,0,0)
    );
}

#appTitle {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

#status {
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 12px;
    background: rgba(0,0,0,0.65);
    color: #fff;
}

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    max-height: 48%;
    overflow-y: auto;
    padding: 10px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.94),
        rgba(0,0,0,0.70),
        rgba(0,0,0,0)
    );
}

.controlRow {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

button,
.fileButton {
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    background: rgba(25,25,25,0.92);
    color: #fff;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-height: 42px;
}

button:active,
.fileButton:active {
    transform: scale(0.98);
}

.primary {
    background: #1b6cff;
    border-color: #4d8cff;
}

.danger {
    background: #b51f2a;
    border-color: #e04b55;
}

.fileInput {
    display: none;
}

.section {
    margin-top: 8px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(15,15,15,0.88);
    border: 1px solid rgba(255,255,255,0.12);
}

.sectionTitle {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
}

.personGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.personCard {
    min-width: 0;
    padding: 9px;
    border-radius: 10px;
    background: rgba(35,35,35,0.95);
    border: 1px solid rgba(255,255,255,0.14);
}

.personTitle {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.personStatus {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: #bbb;
    word-break: break-word;
}

.smallButton {
    width: 100%;
    padding: 8px;
    min-height: 38px;
    font-size: 12px;
}

.rangeRow {
    display: grid;
    grid-template-columns: 55px 1fr 42px;
    align-items: center;
    gap: 7px;
    margin: 7px 0;
}

.rangeRow label {
    font-size: 12px;
}

.rangeRow output {
    font-size: 11px;
    text-align: right;
}

input[type="range"] {
    width: 100%;
    accent-color: #1b6cff;
}

.hidden {
    display: none !important;
}

@media (max-width: 420px) {
    .personGrid {
        grid-template-columns: 1fr;
    }

    button,
    .fileButton {
        font-size: 12px;
        padding: 9px 10px;
    }
}
</style>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>

    <canvas id="threeCanvas"></canvas>
    <canvas id="landmarkCanvas"></canvas>

    <div id="topBar">
        <div id="appTitle">Azeez AI AR</div>
        <div id="status">Camera Off</div>
    </div>

    <div id="controls">

        <div class="controlRow">
            <button id="startCameraBtn" class="primary">
                START CAMERA
            </button>

            <button id="switchCameraBtn">
                SWITCH CAMERA
            </button>

            <button id="mirrorBtn">
                MIRROR: OFF
            </button>
        </div>

        <div class="controlRow">
            <button id="recordBtn">
                START RECORDING
            </button>

            <button id="resetBtn">
                RESET
            </button>

            <button id="hideUiBtn">
                HIDE UI
            </button>
        </div>

        <div class="section">
            <div class="sectionTitle">
                4-Person AR Filters
            </div>

            <div class="personGrid">

                <div class="personCard" id="personCard1">
                    <div class="personTitle">PERSON 1</div>

                    <label class="fileButton smallButton">
                        IMPORT MODEL
                        <input
                            id="person1Model"
                            class="fileInput"
                            type="file"
                            accept=".glb,.gltf,.obj,.fbx">
                    </label>

                    <button
                        id="person1Clear"
                        class="smallButton">
                        CLEAR FILTER
                    </button>

                    <span
                        id="person1Status"
                        class="personStatus">
                        No filter selected
                    </span>
                </div>

                <div class="personCard" id="personCard2">
                    <div class="personTitle">PERSON 2</div>

                    <label class="fileButton smallButton">
                        IMPORT MODEL
                        <input
                            id="person2Model"
                            class="fileInput"
                            type="file"
                            accept=".glb,.gltf,.obj,.fbx">
                    </label>

                    <button
                        id="person2Clear"
                        class="smallButton">
                        CLEAR FILTER
                    </button>

                    <span
                        id="person2Status"
                        class="personStatus">
                        No filter selected
                    </span>
                </div>

                <div class="personCard" id="personCard3">
                    <div class="personTitle">PERSON 3</div>

                    <label class="fileButton smallButton">
                        IMPORT MODEL
                        <input
                            id="person3Model"
                            class="fileInput"
                            type="file"
                            accept=".glb,.gltf,.obj,.fbx">
                    </label>

                    <button
                        id="person3Clear"
                        class="smallButton">
                        CLEAR FILTER
                    </button>

                    <span
                        id="person3Status"
                        class="personStatus">
                        No filter selected
                    </span>
                </div>

                <div class="personCard" id="personCard4">
                    <div class="personTitle">PERSON 4</div>

                    <label class="fileButton smallButton">
                        IMPORT MODEL
                        <input
                            id="person4Model"
                            class="fileInput"
                            type="file"
                            accept=".glb,.gltf,.obj,.fbx">
                    </label>

                    <button
                        id="person4Clear"
                        class="smallButton">
                        CLEAR FILTER
                    </button>

                    <span
                        id="person4Status"
                        class="personStatus">
                        No filter selected
                    </span>
                </div>

            </div>
        </div>        <div class="section">
            <div class="sectionTitle">
                Model / Head Controls
            </div>

            <div class="controlRow">
                <button id="showLandmarksBtn">
                    LANDMARKS: OFF
                </button>

                <button id="hideControlsBtn">
                    HIDE CONTROLS
                </button>

                <button id="headFitBtn">
                    HEAD FIT: ON
                </button>
            </div>

            <div class="rangeRow">
                <label for="posX">X</label>
                <input
                    id="posX"
                    type="range"
                    min="-2"
                    max="2"
                    step="0.01"
                    value="0">
                <output id="posXValue">0</output>
            </div>

            <div class="rangeRow">
                <label for="posY">Y</label>
                <input
                    id="posY"
                    type="range"
                    min="-2"
                    max="2"
                    step="0.01"
                    value="0">
                <output id="posYValue">0</output>
            </div>

            <div class="rangeRow">
                <label for="posZ">Depth</label>
                <input
                    id="posZ"
                    type="range"
                    min="-3"
                    max="3"
                    step="0.01"
                    value="0">
                <output id="posZValue">0</output>
            </div>

            <div class="rangeRow">
                <label for="scale">Scale</label>
                <input
                    id="scale"
                    type="range"
                    min="0.05"
                    max="5"
                    step="0.01"
                    value="1">
                <output id="scaleValue">1</output>
            </div>

            <div class="rangeRow">
                <label for="rotX">Rot X</label>
                <input
                    id="rotX"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">
                <output id="rotXValue">0°</output>
            </div>

            <div class="rangeRow">
                <label for="rotY">Rot Y</label>
                <input
                    id="rotY"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">
                <output id="rotYValue">0°</output>
            </div>

            <div class="rangeRow">
                <label for="rotZ">Rot Z</label>
                <input
                    id="rotZ"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">
                <output id="rotZValue">0°</output>
            </div>
        </div>

        <div class="section">
            <div class="sectionTitle">
                Settings
            </div>

            <div class="controlRow">

                <button id="exportSettingsBtn">
                    EXPORT SETTINGS
                </button>

                <label class="fileButton">
                    IMPORT SETTINGS
                    <input
                        id="importSettingsInput"
                        class="fileInput"
                        type="file"
                        accept=".json">
                </label>

            </div>
        </div>

        <div class="section">
            <div class="sectionTitle">
                Filter Assignment
            </div>

            <div class="controlRow">

                <button
                    id="assignPerson1Btn"
                    class="primary">
                    USE FILTER 1
                </button>

                <button
                    id="assignPerson2Btn">
                    USE FILTER 2
                </button>

                <button
                    id="assignPerson3Btn">
                    USE FILTER 3
                </button>

                <button
                    id="assignPerson4Btn">
                    USE FILTER 4
                </button>

            </div>

            <div id="assignmentStatus">
                Active assignment: Person 1
            </div>
        </div>

    </div>

    <div id="recordingIndicator" class="hidden">
        ● RECORDING
    </div>

    <div id="loadingOverlay" class="hidden">
        <div id="loadingText">
            Loading...
        </div>
    </div>

</div><script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module" src="js/app.js"></script>

<style>
#recordingIndicator {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(180, 0, 0, 0.9);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}

#loadingOverlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.65);
}

#loadingOverlay.hidden {
    display: none;
}

#loadingText {
    padding: 14px 20px;
    border-radius: 12px;
    background: rgba(25, 25, 25, 0.95);
    font-size: 14px;
    font-weight: 600;
}

#assignmentStatus {
    margin-top: 6px;
    padding: 8px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    color: #bbb;
    font-size: 12px;
}

#controls.ui-hidden {
    display: none;
}

#topBar.ui-hidden {
    display: none;
}
</style>

</body>
</html>
