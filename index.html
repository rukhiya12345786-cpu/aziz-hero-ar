<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AZEEZ AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#panel {
  position: fixed;
  z-index: 10000;
  top: 10px;
  left: 10px;
  width: min(310px, calc(100vw - 20px));
  max-height: calc(100dvh - 75px);
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 12px;
  background: rgba(10, 10, 10, 0.88);
  backdrop-filter: blur(10px);
}

#panel h3 {
  margin: 0 0 10px;
  font-size: 17px;
  text-align: center;
}

.section {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid #555;
}

.section-title {
  margin-bottom: 7px;
  color: #67e8f9;
  font-size: 12px;
  font-weight: bold;
}

button, .file-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 9px;
  border: 1px solid #777;
  border-radius: 7px;
  background: #202020;
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active, .file-label:active {
  background: #075985;
}

button {
  width: 100%;
}

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 7px;
}

.file-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.file-label {
  width: 100%;
  text-align: center;
}

.file-label input {
  display: none;
}

#sizeSlider {
  width: 100%;
  height: 35px;
  accent-color: #22d3ee;
}

#sizeValue {
  display: block;
  margin-top: 3px;
  text-align: center;
  font-size: 12px;
}

#status {
  margin-top: 9px;
  color: #a5f3fc;
  font-size: 12px;
  overflow-wrap: anywhere;
}

#panelToggle {
  position: fixed;
  z-index: 10002;
  right: 10px;
  top: 10px;
  width: auto;
  min-width: 105px;
  background: rgba(0, 0, 0, 0.8);
}

#panel.gone {
  display: none;
}

#panelToggle {
  display: block;
}

.active-mode {
  border-color: #22d3ee;
  background: #075985;
}

@media (orientation: landscape) {
  #panel {
    width: 280px;
    max-height: calc(100dvh - 20px);
  }
}
</style>
</head>

<body>

<div id="container"></div>

<button id="panelToggle">HIDE PANEL</button>

<div id="panel">

  <h3>AZEEZ AR STUDIO</h3>

  <div class="section">
    <div class="section-title">CAMERA</div>
    <button id="startCamera">START CAMERA</button>
    <div class="button-row">
      <button id="frontCamera">FRONT CAMERA</button>
      <button id="backCamera">BACK CAMERA</button>
    </div>
    <div class="button-row">
      <button id="fullscreenButton">FULL SCREEN</button>
      <button id="stopCamera">STOP CAMERA</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">IMPORT 3D MODEL</div>
    <div class="file-grid">
      <label class="file-label">
        GLTF / GLB
        <input id="gltfInput" type="file"
          accept=".gltf,.glb,model/gltf+json,model/gltf-binary">
      </label>

      <label class="file-label">
        OBJ
        <input id="objInput" type="file" accept=".obj">
      </label>

      <label class="file-label">
        FBX
        <input id="fbxInput" type="file" accept=".fbx">
      </label>

      <label class="file-label">
        IMAGE
        <input id="imageInput" type="file" accept="image/*">
      </label>

      <label class="file-label">
        VIDEO
        <input id="videoInput" type="file" accept="video/*">
      </label>
    </div>

    <button id="removeModel" style="margin-top:7px">
      REMOVE / CLOSE SELECTED MODEL
    </button>
  </div>

  <div class="section">
    <div class="section-title">TRANSFORM GIZMOS</div>

    <div class="button-row">
      <button id="moveMode">MOVE</button>
      <button id="rotateMode">ROTATE</button>
    </div>

    <button id="scaleMode" style="margin-top:7px">
      SCALE GIZMO
    </button>

    <button id="gizmoToggle" style="margin-top:7px">
      HIDE GIZMO
    </button>
  </div>

  <div class="section">
    <div class="section-title">MODEL SIZE — SINGLE SLIDER</div>
    <input id="sizeSlider" type="range"
      min="1" max="10000" step="1" value="1000">
    <span id="sizeValue">100%</span>
  </div>

  <div id="status">Ready. Press START CAMERA.</div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

import { MindARThree } from "mindar-face-three";


let mindarThree = null;
let avatar = null;
let anchor = null;
let renderer = null;
let scene = null;
let camera = null;
let transformControls = null;

let activeObject = null;
let importedObjects = [];
let currentCamera = "user";
let cameraRunning = false;
let cameraBusy = false;
let currentMode = "translate";
let gizmoVisible = true;

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");

function status(message) {
  statusBox.textContent = message;
}

/* ORIGINAL RACCOON AVATAR */

class Avatar {
  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {
    const url = "https://assets.codepen.io/9177687/raccoon_head.glb";

    const loader = new GLTFLoader();

    this.gltf = await loader.loadAsync(url);

    this.gltf.scene.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }
    });
  }

  updateBlendshapes(blendshapes) {
    if (!blendshapes) return;

    const categories = blendshapes.categories || [];
    const values = new Map();

    for (const item of categories) {
      values.set(item.categoryName, item.score);
    }

    for (const mesh of this.morphTargetMeshes) {
      const dictionary = mesh.morphTargetDictionary;

      for (const [name, value] of values) {
        const index = dictionary[name];

        if (index !== undefined) {
          mesh.morphTargetInfluences[index] = value;
        }
      }
    }
  }
}

/* INITIALIZE MINDAR */

async function setupAR() {
  if (mindarThree) return;

  status("Loading face tracking...");

  mindarThree = new MindARThree({
    container: container,
    maxTrack: 1
  });

  renderer = mindarThree.renderer;
  scene = mindarThree.scene;
  camera = mindarThree.camera;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  scene.add(
    new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5)
  );

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(0, 1, 2);
  scene.add(light);

  anchor = mindarThree.addAnchor(1);

  /* FIX: CREATE AVATAR BEFORE INIT */

  avatar = new Avatar();
  await avatar.init();

  avatar.gltf.scene.scale.set(2, 2, 2);
  anchor.group.add(avatar.gltf.scene);

  /* TRANSFORM CONTROLS */

  transformControls = new TransformControls(
    camera,
    renderer.domElement
  );

  transformControls.setMode("translate");
  transformControls.setSpace("local");
  transformControls.setSize(0.8);

  const helper = transformControls.getHelper();
  scene.add(helper);
  helper.visible = false;

  transformControls.addEventListener("dragging-changed", event => {
    if (event.value) {
      renderer.domElement.style.touchAction = "none";
    } else {
      renderer.domElement.style.touchAction = "pan-y";
    }
  });

  status("Face tracking ready.");
}

/* START CAMERA */

async function startCamera() {
  if (cameraBusy || cameraRunning) return;

  cameraBusy = true;

  try {
    status("Starting camera...");

    await setupAR();

    await mindarThree.start();

    renderer.setAnimationLoop(() => {
      const estimate = mindarThree.getLatestEstimate();

      if (estimate && estimate.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);
    });

    cameraRunning = true;
    status("Camera ON. Face tracking active.");

  } catch (error) {
    console.error(error);
    status("Camera error: " + (error.message || error));

  } finally {
    cameraBusy = false;
  }
}

document.querySelector("#startCamera").addEventListener(
  "click",
  startCamera
);

/* CAMERA SWITCH */

async function switchCamera(mode) {
  if (!mindarThree || !cameraRunning) {
    status("Start camera first.");
    return;
  }

  if (cameraBusy) return;

  cameraBusy = true;

  try {
    status("Switching camera...");

    if (mode === "user" && currentCamera !== "user") {
      await mindarThree.switchCamera();
      currentCamera = "user";

    } else if (mode === "environment" && currentCamera !== "environment") {
      await mindarThree.switchCamera();
      currentCamera = "environment";
    }

    status(
      currentCamera === "user"
        ? "Front camera selected."
        : "Back camera selected."
    );

  } catch (error) {
    console.error(error);
    status("Camera switch failed: " + error.message);

  } finally {
    cameraBusy = false;
  }
}

document.querySelector("#frontCamera").onclick = () =>
  switchCamera("user");

document.querySelector("#backCamera").onclick = () =>
  switchCamera("environment");

/* STOP CAMERA */

document.querySelector("#stopCamera").onclick = async () => {
  if (!mindarThree || !cameraRunning) return;

  try {
    renderer.setAnimationLoop(null);
    await mindarThree.stop();
    cameraRunning = false;
    status("Camera stopped.");
  } catch (error) {
    status("Stop error: " + error.message);
  }
};

/* FULL SCREEN */

document.querySelector("#fullscreenButton").onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    status("Fullscreen unavailable: " + error.message);
  }
};

/* PANEL HIDE / SHOW */

const panel = document.querySelector("#panel");
const panelToggle = document.querySelector("#panelToggle");

panelToggle.onclick = () => {
  panel.classList.toggle("gone");

  panelToggle.textContent = panel.classList.contains("gone")
    ? "SHOW PANEL"
    : "HIDE PANEL";
};

/* GIZMO MODES */

function setGizmoMode(mode) {
  currentMode = mode;

  if (transformControls) {
    transformControls.setMode(mode);
  }

  document.querySelector("#moveMode").classList.toggle(
    "active-mode", mode === "translate"
  );

  document.querySelector("#rotateMode").classList.toggle(
    "active-mode", mode === "rotate"
  );

  document.querySelector("#scaleMode").classList.toggle(
    "active-mode", mode === "scale"
  );
}

document.querySelector("#moveMode").onclick = () =>
  setGizmoMode("translate");

document.querySelector("#rotateMode").onclick = () =>
  setGizmoMode("rotate");

document.querySelector("#scaleMode").onclick = () =>
  setGizmoMode("scale");

/* HIDE / SHOW GIZMO */

document.querySelector("#gizmoToggle").onclick = () => {
  gizmoVisible = !gizmoVisible;

  if (transformControls) {
    transformControls.getHelper().visible =
      gizmoVisible && !!activeObject;
  }

  document.querySelector("#gizmoToggle").textContent =
    gizmoVisible ? "HIDE GIZMO" : "SHOW GIZMO";
};

/* MODEL CENTERING AND SELECTION */

function prepareModel(object, name, sourceURL = null) {
  object.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error("Model has invalid dimensions.");
  }

  object.position.sub(center);

  const wrapper = new THREE.Group();
  wrapper.add(object);

  wrapper.scale.setScalar(1 / maxDimension);

  wrapper.userData.modelName = name;
  wrapper.userData.sourceURL = sourceURL;
  wrapper.userData.sizeMultiplier = 1;

  anchor.group.add(wrapper);
  importedObjects.push(wrapper);

  selectObject(wrapper);

  status("Imported: " + name);
}

function selectObject(object) {
  activeObject = object;

  if (transformControls) {
    transformControls.detach();
    transformControls.attach(object);
    transformControls.setMode(currentMode);
    transformControls.getHelper().visible = gizmoVisible;
  }

  const multiplier = object.userData.sizeMultiplier || 1;

  document.querySelector("#sizeSlider").value =
    Math.max(1, Math.min(10000, Math.round(multiplier * 1000)));

  updateSizeLabel();
}

/* SINGLE LARGE-RANGE SIZE SLIDER */

const sizeSlider = document.querySelector("#sizeSlider");

function updateSizeLabel() {
  const multiplier = Number(sizeSlider.value) / 1000;

  document.querySelector("#sizeValue").textContent =
    Math.round(multiplier * 100) + "%";
}

sizeSlider.addEventListener("input", () => {
  if (!activeObject) {
    updateSizeLabel();
    return;
  }

  const multiplier = Number(sizeSlider.value) / 1000;

  activeObject.userData.sizeMultiplier = multiplier;
  activeObject.scale.setScalar(
    (activeObject.userData.baseScale || 1) * multiplier
  );

  updateSizeLabel();
});

/* SAVE BASE SCALE WHEN SELECTING */


function selectObject(object) {
  if (!object || !transformControls) {
    status("Gizmo is not initialized.");
    return;
  }

  activeObject = object;

  transformControls.detach();
  transformControls.attach(activeObject);
  transformControls.setMode(currentMode);
  transformControls.setSpace("world");
  transformControls.setSize(1.5);

  const helper = transformControls.getHelper();
  helper.visible = gizmoVisible;
  helper.updateMatrixWorld(true);

  activeObject.updateMatrixWorld(true);

  sizeSlider.value = Math.max(
    1,
    Math.min(
      10000,
      Math.round(
        (activeObject.userData.sizeMultiplier || 1) * 1000
      )
    )
  );

  updateSizeLabel();
  renderer.render(scene, camera);

  status("Model selected. Gizmo attached.");
           }
  

/* REMOVE SELECTED IMPORTED MODEL */

function disposeObject(object) {
  object.traverse(child => {
    if (child.geometry) {
      child.geometry.dispose();
    }

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      for (const material of materials) {
        for (const key of Object.keys(material)) {
          const value = material[key];

          if (value && value.isTexture) {
            value.dispose();
          }
        }

        material.dispose();
      }
    }
  });
}

document.querySelector("#removeModel").onclick = () => {
  if (!activeObject) {
    status("No imported model selected.");
    return;
  }

  if (transformControls) {
    transformControls.detach();
  }

  const object = activeObject;

  if (object.userData.videoElement) {
    object.userData.videoElement.pause();
    object.userData.videoElement.src = "";
    object.userData.videoElement.load();
  }

  if (object.userData.sourceURL) {
    URL.revokeObjectURL(object.userData.sourceURL);
  }

  anchor.group.remove(object);

  importedObjects = importedObjects.filter(item => item !== object);

  disposeObject(object);

  activeObject = null;

  if (transformControls) {
    transformControls.getHelper().visible = false;
  }

  sizeSlider.value = 1000;
  updateSizeLabel();

  status("Selected imported model removed.");
};

/* GLTF AND GLB IMPORT */

document.querySelector("#gltfInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const url = URL.createObjectURL(file);
    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(url);

    prepareModel(gltf.scene, file.name, url);

  } catch (error) {
    console.error(error);
    status("GLTF / GLB import error: " + error.message);
  }

  event.target.value = "";
};

/* OBJ IMPORT */

document.querySelector("#objInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const loader = new OBJLoader();
    const object = loader.parse(text);

    prepareModel(object, file.name);

  } catch (error) {
    console.error(error);
    status("OBJ import error: " + error.message);
  }

  event.target.value = "";
};

/* FBX IMPORT */

document.querySelector("#fbxInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const buffer = await file.arrayBuffer();
    const loader = new FBXLoader();
    const object = loader.parse(buffer, "");

    prepareModel(object, file.name);

  } catch (error) {
    console.error(error);
    status("FBX import error: " + error.message);
  }

  event.target.value = "";
};

/* IMAGE IMPORT */

document.querySelector("#imageInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);

  try {
    const texture = await new THREE.TextureLoader().loadAsync(url);

    const aspect = texture.image.width / texture.image.height;
    const geometry = new THREE.PlaneGeometry(aspect, 1);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);

    prepareModel(mesh, file.name, url);

  } catch (error) {
    URL.revokeObjectURL(url);
    status("Image import error: " + error.message);
  }

  event.target.value = "";
};

/* VIDEO IMPORT */

document.querySelector("#videoInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const video = document.createElement("video");

  video.src = url;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.crossOrigin = "anonymous";

  try {
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = () => reject(new Error("Video could not load."));
    });

    await video.play();

    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;

    const aspect = video.videoWidth / video.videoHeight;
    const geometry = new THREE.PlaneGeometry(aspect, 1);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);

    prepareModel(mesh, file.name, url);

    activeObject.userData.videoElement = video;

  } catch (error) {
    video.pause();
    URL.revokeObjectURL(url);
    status("Video import error: " + error.message);
  }

  event.target.value = "";
};

/* TOUCH SELECTION OF IMPORTED OBJECTS */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let pointerStart = null;

rendererSelectionSetup();

function rendererSelectionSetup() {
  const startSelection = event => {
    if (!renderer || !camera || !transformControls) return;

    if (transformControls.axis !== null) return;

    pointerStart = {
      x: event.clientX,
      y: event.clientY
    };
  };

  const endSelection = event => {
    if (!pointerStart || !renderer || !camera) return;

    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;

    pointerStart = null;

    if (Math.hypot(dx, dy) > 8) return;
    if (transformControls && transformControls.axis !== null) return;

    const rect = renderer.domElement.getBoundingClientRect();

    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(importedObjects, true);

    if (!hits.length) return;

    let selected = hits[0].object;

    while (selected.parent && !importedObjects.includes(selected)) {
      selected = selected.parent;
    }

    if (importedObjects.includes(selected)) {
      selectObject(selected);
    }
  };

  container.addEventListener("pointerdown", startSelection);
  container.addEventListener("pointerup", endSelection);
}

updateSizeLabel();

status("Ready. Press START CAMERA.");
  
</script>
</body>
</html>
