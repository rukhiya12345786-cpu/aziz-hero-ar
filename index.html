<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Test</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:15px 25px;
    font-size:18px;
}
</style>
</head>

<body>

<video id="camera"
autoplay
playsinline
muted></video>

<button id="open">
OPEN CAMERA
</button>

<script>

document.getElementById("open").onclick =
async function(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        document.getElementById("camera").srcObject =
        stream;

        this.style.display="none";

    }catch(error){

        alert(
            "Camera Error:\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};

</script>

</body>
</html>
