<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Azeez AR Face Test</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;

    padding: 14px 20px;

    border: 0;
    border-radius: 10px;

    background: rgba(0,0,0,0.75);
    color: white;

    font-size: 14px;
    font-weight: bold;
}

#status {
    position: fixed;
    top: 75px;
    left: 20px;
    z-index: 9999;

    padding: 8px 12px;

    border-radius: 8px;

    background: rgba(0,0,0,0.65);
    color: #00ff66;

    font-family: Arial, sans-serif;
    font-size: 12px;
}

</style>

<script type="importmap">
{
    "imports": {
        "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

        "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/",

        "mindar-face-three":
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
}
</script>

</head>

<body>

<div id="container"></div>

<button id="startButton">
START CAMERA
</button>

<div id="status">
Loading...
</div>

<script type="module">

import * as THREE from "three";

import {
    MindARThree
} from "mindar-face-three";


const container =
    document.querySelector("#container");

const startButton =
    document.querySelector("#startButton");

const status =
    document.querySelector("#status");


let mindarThree = null;

let faceMesh = null;


function setStatus(text) {

    status.textContent = text;

}


async function setup() {

    try {

        setStatus(
            "Creating Face Tracker..."
        );


        mindarThree =
            new MindARThree({

                container:
                    container,

                uiLoading:
                    "no",

                uiScanning:
                    "no",

                uiError:
                    "no"

            });


        const renderer =
            mindarThree.renderer;

        const scene =
            mindarThree.scene;

        const camera =
            mindarThree.camera;


        const light =
            new THREE.HemisphereLight(
                0xffffff,
                0xbbbbff,
                1
            );

        scene.add(light);


        faceMesh =
            mindarThree.addFaceMesh();


        faceMesh.material.transparent =
            true;

        faceMesh.material.opacity =
            0.35;

        faceMesh.material.color.set(
            0x00ff66
        );


        scene.add(faceMesh);


        startButton.addEventListener(
            "click",
            async () => {

                try {

                    startButton.disabled =
                        true;

                    startButton.textContent =
                        "STARTING...";


                    setStatus(
                        "Requesting camera..."
                    );


                    await mindarThree.start();


                    setStatus(
                        "CAMERA ON - LOOK AT CAMERA"
                    );


                    startButton.textContent =
                        "CAMERA ON";


                    renderer.setAnimationLoop(
                        () => {

                            renderer.render(
                                scene,
                                camera
                            );

                        }
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    setStatus(
                        "CAMERA ERROR"
                    );

                    startButton.disabled =
                        false;

                    startButton.textContent =
                        "START CAMERA";

                    alert(
                        "Camera could not start. Allow camera permission in Chrome and reload the page."
                    );

                }

            }
        );


        setStatus(
            "Ready - press START CAMERA"
        );


    } catch (error) {

        console.error(
            error
        );

        setStatus(
            "MINDAR LOAD ERROR"
        );

        alert(
            "MindAR failed to load. Check internet connection."
        );

    }

}


setup();

</script>

</body>

</html>
