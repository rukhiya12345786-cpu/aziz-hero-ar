<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR Head Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
}

#ui {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
}

button,
input {
    pointer-events: auto;
}

.topBar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
}

button {
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    padding: 9px 11px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}

button:active {
    transform: scale(0.97);
}

.statusBox {
    width: min(520px, 96%);
    margin: 0 auto 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.68);
    color: #00ff66;
    text-align: center;
    font-size: 12px;
    line-height: 1.4;
}

.expressionBox {
    width: min(520px, 96%);
    margin: 0 auto 8px;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.62);
    color: #fff;
    text-align: center;
    font-size: 11px;
}

.controls {
    width: min(520px, 96%);
    margin: 0 auto;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.66);
}

.controlRow {
    display: grid;
    grid-template-columns: 58px 1fr 70px;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
}

.controlRow label {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
}

.controlRow input[type="range"] {
    width: 100%;
    accent-color: #00ff66;
}

.value {
    color: #00ff66;
    text-align: right;
    font-size: 10px;
    font-weight: 700;
}

.sectionTitle {
    color: #00ff66;
    font-size: 12px;
    font-weight: 800;
    margin: 3px 0 8px;
    text-align: center;
}

.bottomBar {
    width: min(520px, 96%);
    margin: 8px auto 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
}

.hiddenInput {
    display: none;
}

#resetButton {
    width: 100%;
    margin-top: 3px;
}

#cameraVideo {
    display: none;
}

@media (max-width: 480px) {
    button {
        font-size: 11px;
        padding: 8px 9px;
    }

    .controlRow {
        grid-template-columns: 54px 1fr 62px;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
}
</script>
</head>

<body>

<div id="app">

    <div id="arContainer"></div>

    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted
    ></video>

    <div id="ui">

        <div class="topBar">
            <button id="startCameraButton">START CAMERA</button>
            <button id="switchCameraButton">SWITCH CAMERA</button>
            <button id="mirrorButton">MIRROR: OFF</button>
            <button id="trackingButton">TRACKING: ON</button>
        </div>

        <div class="statusBox">
            <div id="statusText">Ready</div>
        </div>

        <div class="expressionBox">
            <span id="expressionText">Expression: Waiting</span>
        </div>

        <div class="controls">

            <div class="sectionTitle">
                MODEL POSITION
            </div>

            <div class="controlRow">
                <label for="xSlider">X</label>
                <input
                    id="xSlider"
                    type="range"
                    min="-10"
                    max="10"
                    step="0.01"
                    value="0"
                >
                <span class="value" id="xValue">0</span>
            </div>

            <div class="controlRow">
                <label for="ySlider">Y</label>
                <input
                    id="ySlider"
                    type="range"
                    min="-10"
                    max="10"
                    step="0.01"
                    value="0"
                >
                <span class="value" id="yValue">0</span>
            </div>

            <div class="controlRow">
                <label for="zSlider">Z</label>
                <input
                    id="zSlider"
                    type="range"
                    min="-20"
                    max="20"
                    step="0.01"
                    value="0"
                >
                <span class="value" id="zValue">0</span>
            </div>

            <div class="sectionTitle">
                MODEL SIZE
            </div>

            <div class="controlRow">
                <label for="scaleSlider">Scale</label>
                <input
                    id="scaleSlider"
                    type="range"
                    min="0.01"
                    max="50"
                    step="0.01"
                    value="1"
                >
                <span class="value" id="scaleValue">1</span>
            </div>

            <div class="sectionTitle">
                MODEL ROTATION
            </div>

            <div class="controlRow">
                <label for="rotXSlider">Rot X</label>
                <input
                    id="rotXSlider"
                    type="range"
                    min="-1440"
                    max="1440"
                    step="1"
                    value="0"
                >
                <span class="value" id="rotXValue">0°</span>
            </div>

            <div class="controlRow">
                <label for="rotYSlider">Rot Y</label>
                <input
                    id="rotYSlider"
                    type="range"
                    min="-1440"
                    max="1440"
                    step="1"
                    value="0"
                >
                <span class="value" id="rotYValue">0°</span>
            </div>

            <div class="controlRow">
                <label for="rotZSlider">Rot Z</label>
                <input
                    id="rotZSlider"
                    type="range"
                    min="-1440"
                    max="1440"
                    step="1"
                    value="0"
                >
                <span class="value" id="rotZValue">0°</span>
            </div>

            <div class="sectionTitle">
                HEAD FIT
            </div>

            <div class="controlRow">
                <label for="fitSlider">Fit</label>
                <input
                    id="fitSlider"
                    type="range"
                    min="0.10"
                    max="10"
                    step="0.01"
                    value="1"
                >
                <span class="value" id="fitValue">1</span>
            </div>

            <button id="resetButton">
                RESET MODEL
            </button>

        </div>

        <div class="bottomBar">

            <button id="importGLBButton">
                IMPORT GLB / GLTF
            </button>

            <button id="importOBJButton">
                IMPORT OBJ
            </button>

            <button id="importFBXButton">
                IMPORT FBX
            </button>

            <button id="recordButton">
                START RECORDING
            </button>

            <button id="importSettingsButton">
                IMPORT SETTINGS
            </button>

            <button id="exportSettingsButton">
                EXPORT SETTINGS
            </button>

        </div>

        <input
            id="glbInput"
            class="hiddenInput"
            type="file"
            accept=".glb,.gltf"
        >

        <input
            id="objInput"
            class="hiddenInput"
            type="file"
            accept=".obj"
        >

        <input
            id="fbxInput"
            class="hiddenInput"
            type="file"
            accept=".fbx"
        >

        <input
            id="settingsInput"
            class="hiddenInput"
            type="file"
            accept=".json"
        >

    </div>

</div>

<script type="module">
import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

import { MindARThree } from "mindar-face-three";

const arContainer = document.getElementById("arContainer");
const cameraVideo = document.getElementById("cameraVideo");

const startCameraButton =
    document.getElementById("startCameraButton");

const switchCameraButton =
    document.getElementById("switchCameraButton");

const mirrorButton =
    document.getElementById("mirrorButton");

const trackingButton =
    document.getElementById("trackingButton");

const recordButton =
    document.getElementById("recordButton");

const importGLBButton =
    document.getElementById("importGLBButton");

const importOBJButton =
    document.getElementById("importOBJButton");

const importFBXButton =
    document.getElementById("importFBXButton");

const importSettingsButton =
    document.getElementById("importSettingsButton");

const exportSettingsButton =
    document.getElementById("exportSettingsButton");

const glbInput =
    document.getElementById("glbInput");

const objInput =
    document.getElementById("objInput");

const fbxInput =
    document.getElementById("fbxInput");

const settingsInput =
    document.getElementById("settingsInput");

const resetButton =
    document.getElementById("resetButton");

const statusText =
    document.getElementById("statusText");

const expressionText =
    document.getElementById("expressionText");

const xSlider =
    document.getElementById("xSlider");

const ySlider =
    document.getElementById("ySlider");

const zSlider =
    document.getElementById("zSlider");

const scaleSlider =
    document.getElementById("scaleSlider");

const rotXSlider =
    document.getElementById("rotXSlider");

const rotYSlider =
    document.getElementById("rotYSlider");

const rotZSlider =
    document.getElementById("rotZSlider");

const fitSlider =
    document.getElementById("fitSlider");

const xValue =
    document.getElementById("xValue");

const yValue =
    document.getElementById("yValue");

const zValue =
    document.getElementById("zValue");

const scaleValue =
    document.getElementById("scaleValue");

const rotXValue =
    document.getElementById("rotXValue");

const rotYValue =
    document.getElementById("rotYValue");

const rotZValue =
    document.getElementById("rotZValue");

const fitValue =
    document.getElementById("fitValue");

let mindarThree = null;
let renderer = null;
let scene = null;
let camera = null;

let faceMesh = null;
let modelRoot = null;
let loadedModel = null;

let cameraStarted = false;
let trackingEnabled = true;
let mirrorEnabled = false;
let animationStarted = false;

let currentCameraMode = "environment";

let recording = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordingCanvas = null;
let recordingContext = null;

const modelState = {
    x: 0,
    y: 0,
    z: 0,
    scale: 1,
    rotX: 0,
    rotY: 0,
    rotZ: 0,
    fit: 1
};

function setStatus(message) {
    statusText.textContent = message;
}

function setExpression(message) {
    expressionText.textContent = message;
}

function degreesToRadians(value) {
    return value * Math.PI / 180;
}

function updateValueLabels() {
    xValue.textContent = Number(xSlider.value).toFixed(2);
    yValue.textContent = Number(ySlider.value).toFixed(2);
    zValue.textContent = Number(zSlider.value).toFixed(2);

    scaleValue.textContent =
        Number(scaleSlider.value).toFixed(2);

    rotXValue.textContent =
        `${Number(rotXSlider.value).toFixed(0)}°`;

    rotYValue.textContent =
        `${Number(rotYSlider.value).toFixed(0)}°`;

    rotZValue.textContent =
        `${Number(rotZSlider.value).toFixed(0)}°`;

    fitValue.textContent =
        Number(fitSlider.value).toFixed(2);
}

function readModelControls() {
    modelState.x = Number(xSlider.value);
    modelState.y = Number(ySlider.value);
    modelState.z = Number(zSlider.value);

    modelState.scale =
        Number(scaleSlider.value);

    modelState.rotX =
        Number(rotXSlider.value);

    modelState.rotY =
        Number(rotYSlider.value);

    modelState.rotZ =
        Number(rotZSlider.value);

    modelState.fit =
        Number(fitSlider.value);

    updateValueLabels();

    applyModelTransform();
}

function resetModelControls() {
    modelState.x = 0;
    modelState.y = 0;
    modelState.z = 0;
    modelState.scale = 1;
    modelState.rotX = 0;
    modelState.rotY = 0;
    modelState.rotZ = 0;
    modelState.fit = 1;

    xSlider.value = "0";
    ySlider.value = "0";
    zSlider.value = "0";

    scaleSlider.value = "1";

    rotXSlider.value = "0";
    rotYSlider.value = "0";
    rotZSlider.value = "0";

    fitSlider.value = "1";

    updateValueLabels();
    applyModelTransform();
}

function createARScene() {
    mindarThree = new MindARThree({
        container: arContainer,
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
    });

    renderer = mindarThree.renderer;
    scene = mindarThree.scene;
    camera = mindarThree.camera;

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setClearColor(0x000000, 0);

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            1.8
        )
    );

    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );

    directionalLight.position.set(
        0,
        2,
        3
    );

    scene.add(directionalLight);

    faceMesh = mindarThree.addFaceMesh();

    faceMesh.material.transparent = true;
    faceMesh.material.opacity = 0.18;
    faceMesh.material.color.set(0x00ff66);

    scene.add(faceMesh);

    modelRoot =
        new THREE.Group();

    faceMesh.add(modelRoot);
}

async function startCamera() {
    if (cameraStarted) {
        setStatus("Camera already running");
        return;
    }

    try {
        setStatus("Starting camera...");

        await mindarThree.start();

        cameraStarted = true;

        if (!animationStarted) {
            animationStarted = true;

            renderer.setAnimationLoop(() => {
                if (trackingEnabled) {
                    updateFaceInfo();
                }

                renderer.render(
                    scene,
                    camera
                );
            });
        }

        prepareMindARVideo();

        setStatus("Camera started - face tracking ready");

    } catch (error) {
        console.error(error);

        setStatus(
            "Camera error: " +
            (error?.message || "Unable to start camera")
        );
    }
}

function prepareMindARVideo() {
    const video =
        arContainer.querySelector("video");

    const canvas =
        arContainer.querySelector("canvas");

    if (video) {
        video.setAttribute(
            "playsinline",
            ""
        );

        video.setAttribute(
            "autoplay",
            ""
        );

        video.muted = true;

        video.style.position = "absolute";
        video.style.left = "0";
        video.style.top = "0";
        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "cover";
        video.style.zIndex = "0";
        video.style.opacity = "1";
        video.style.visibility = "visible";
    }

    if (canvas) {
        canvas.style.position = "absolute";
        canvas.style.left = "0";
        canvas.style.top = "0";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.zIndex = "1";
        canvas.style.pointerEvents = "none";
    }
}

async function switchCamera() {
    if (!cameraStarted) {
        setStatus("Start camera first");
        return;
    }

    try {
        setStatus("Switching camera...");

        await mindarThree.switchCamera();

        currentCameraMode =
            currentCameraMode === "environment"
                ? "user"
                : "environment";

        prepareMindARVideo();

        setStatus(
            currentCameraMode === "user"
                ? "Front camera"
                : "Back camera"
        );

    } catch (error) {
        console.error(error);

        setStatus(
            "Camera switch error: " +
            (error?.message || "Unable to switch camera")
        );
    }
}

function toggleMirror() {
    mirrorEnabled =
        !mirrorEnabled;

    mirrorButton.textContent =
        mirrorEnabled
            ? "MIRROR: ON"
            : "MIRROR: OFF";

    const video =
        arContainer.querySelector("video");

    const canvas =
        arContainer.querySelector("canvas");

    if (video) {
        video.style.transform =
            mirrorEnabled
                ? "scaleX(-1)"
                : "none";
    }

    if (canvas) {
        canvas.style.transform =
            mirrorEnabled
                ? "scaleX(-1)"
                : "none";
    }

    setStatus(
        mirrorEnabled
            ? "Mirror enabled"
            : "Mirror disabled"
    );
}function updateFaceInfo() {
    if (!mindarThree || !cameraStarted) {
        return;
    }

    try {
        const estimate =
            mindarThree.getLatestEstimate();

        if (!estimate) {
            setExpression("Expression: Waiting");
            return;
        }

        const blendshapes =
            estimate.blendshapes;

        if (
            blendshapes &&
            Array.isArray(blendshapes.categories) &&
            blendshapes.categories.length > 0
        ) {
            let strongest =
                blendshapes.categories[0];

            for (
                const category
                of blendshapes.categories
            ) {
                if (
                    category.score >
                    strongest.score
                ) {
                    strongest = category;
                }
            }

            const name =
                strongest.displayName ||
                strongest.categoryName ||
                "Unknown";

            const score =
                Number(strongest.score || 0);

            setExpression(
                `Expression: ${name} ${score.toFixed(2)}`
            );
        } else {
            setExpression(
                "Expression: Face detected"
            );
        }

    } catch (error) {
        console.warn(
            "Face information error:",
            error
        );
    }
}

function normalizeModel(object) {
    const box =
        new THREE.Box3().setFromObject(object);

    const size =
        new THREE.Vector3();

    const center =
        new THREE.Vector3();

    box.getSize(size);
    box.getCenter(center);

    object.position.sub(center);

    const largestDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        Number.isFinite(largestDimension) &&
        largestDimension > 0
    ) {
        const normalization =
            1 / largestDimension;

        object.scale.setScalar(
            normalization
        );
    }
}

function removeCurrentModel() {
    if (!loadedModel) {
        return;
    }

    modelRoot.remove(
        loadedModel
    );

    loadedModel.traverse(
        object => {
            if (object.geometry) {
                object.geometry.dispose();
            }

            if (object.material) {
                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                for (
                    const material
                    of materials
                ) {
                    if (material.map) {
                        material.map.dispose();
                    }

                    if (material.normalMap) {
                        material.normalMap.dispose();
                    }

                    if (material.roughnessMap) {
                        material.roughnessMap.dispose();
                    }

                    if (material.metalnessMap) {
                        material.metalnessMap.dispose();
                    }

                    material.dispose();
                }
            }
        }
    );

    loadedModel = null;
}

function attachModel(object) {
    if (!modelRoot) {
        setStatus(
            "Tracking scene is not ready"
        );
        return;
    }

    removeCurrentModel();

    normalizeModel(object);

    loadedModel = object;

    modelRoot.add(
        loadedModel
    );

    applyModelTransform();

    setStatus(
        "3D model attached to head"
    );
}

function applyModelTransform() {
    if (!loadedModel) {
        return;
    }

    const fit =
        modelState.fit;

    const finalScale =
        modelState.scale * fit;

    loadedModel.position.set(
        modelState.x,
        modelState.y,
        modelState.z
    );

    loadedModel.scale.setScalar(
        finalScale
    );

    loadedModel.rotation.set(
        degreesToRadians(
            modelState.rotX
        ),
        degreesToRadians(
            modelState.rotY
        ),
        degreesToRadians(
            modelState.rotZ
        )
    );
}

function parseGLTFBuffer(
    arrayBuffer,
    fileName
) {
    const loader =
        new GLTFLoader();

    loader.parse(
        arrayBuffer,
        "",
        gltf => {
            const object =
                gltf.scene;

            if (!object) {
                setStatus(
                    "GLTF model is empty"
                );
                return;
            }

            object.name =
                fileName || "Imported GLTF";

            attachModel(object);
        },
        error => {
            console.error(
                "GLTF parse error:",
                error
            );

            setStatus(
                "GLB / GLTF import failed"
            );
        }
    );
}

function importGLBFile(file) {
    if (!file) {
        return;
    }

    setStatus(
        "Loading GLB / GLTF..."
    );

    const reader =
        new FileReader();

    reader.onload = event => {
        parseGLTFBuffer(
            event.target.result,
            file.name
        );
    };

    reader.onerror = () => {
        setStatus(
            "Unable to read GLB / GLTF file"
        );
    };

    reader.readAsArrayBuffer(file);
}

function importOBJFile(file) {
    if (!file) {
        return;
    }

    setStatus(
        "Loading OBJ..."
    );

    const reader =
        new FileReader();

    reader.onload = event => {
        try {
            const loader =
                new OBJLoader();

            const object =
                loader.parse(
                    event.target.result
                );

            object.name =
                file.name || "Imported OBJ";

            attachModel(object);

        } catch (error) {
            console.error(
                "OBJ parse error:",
                error
            );

            setStatus(
                "OBJ import failed"
            );
        }
    };

    reader.onerror = () => {
        setStatus(
            "Unable to read OBJ file"
        );
    };

    reader.readAsText(file);
}

function importFBXFile(file) {
    if (!file) {
        return;
    }

    setStatus(
        "Loading FBX..."
    );

    const reader =
        new FileReader();

    reader.onload = event => {
        try {
            const loader =
                new FBXLoader();

            const object =
                loader.parse(
                    event.target.result,
                    ""
                );

            object.name =
                file.name || "Imported FBX";

            attachModel(object);

        } catch (error) {
            console.error(
                "FBX parse error:",
                error
            );

            setStatus(
                "FBX import failed"
            );
        }
    };

    reader.onerror = () => {
        setStatus(
            "Unable to read FBX file"
        );
    };

    reader.readAsArrayBuffer(file);
}

function downloadTextFile(
    fileName,
    textContent
) {
    const blob =
        new Blob(
            [textContent],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
}

function getSettingsObject() {
    return {
        version: 1,

        model: {
            x: modelState.x,
            y: modelState.y,
            z: modelState.z,
            scale: modelState.scale,
            rotX: modelState.rotX,
            rotY: modelState.rotY,
            rotZ: modelState.rotZ,
            fit: modelState.fit
        },

        camera: {
            mode: currentCameraMode,
            mirror: mirrorEnabled,
            tracking: trackingEnabled
        }
    };
}

function exportSettings() {
    const settings =
        getSettingsObject();

    const textContent =
        JSON.stringify(
            settings,
            null,
            2
        );

    downloadTextFile(
        "azeez-ar-settings.json",

    );

    setStatus(

    );
}

function applyImportedSettings(settings) {
    if (!settings) {
        return;
    }

    const model =
        settings.model || {};

    if (
        Number.isFinite(
            Number(model.x)
        )
    ) {
        xSlider.value =
            String(model.x);
    }

    if (
        Number.isFinite(
            Number(model.y)
        )
    ) {
        ySlider.value =
            String(model.y);
    }

    if (
        Number.isFinite(
            Number(model.z)
        )
    ) {
        zSlider.value =
            String(model.z);
    }

    if (
        Number.isFinite(
            Number(model.scale)
        )
    ) {
        scaleSlider.value =
            String(model.scale);
    }

    if (
        Number.isFinite(
            Number(model.rotX)
        )
    ) {
        rotXSlider.value =
            String(model.rotX);
    }

    if (
        Number.isFinite(
            Number(model.rotY)
        )
    ) {
        rotYSlider.value =
            String(model.rotY);
    }

    if (
        Number.isFinite(
            Number(model.rotZ)
        )
    ) {
        rotZSlider.value =
            String(model.rotZ);
    }

    if (
        Number.isFinite(
            Number(model.fit)
        )
    ) {
        fitSlider.value =
            String(model.fit);
    }

    readModelControls();

    if (
        typeof settings.camera?.tracking ===
        "boolean"
    ) {
        trackingEnabled =
            settings.camera.tracking;

        trackingButton.textContent =
            trackingEnabled
                ? "TRACKING: ON"
                : "TRACKING: OFF";
    }

    if (
        typeof settings.camera?.mirror ===
        "boolean"
    ) {
        const desiredMirror =
            settings.camera.mirror;

        if (
            desiredMirror !==
            mirrorEnabled
        ) {
            toggleMirror();
        }
    }

    setStatus(
        "Settings imported"
    );
}

function importSettingsFile(file) {
    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = event => {
        try {
            const settings =
                JSON.parse(
                    event.target.result
                );

            applyImportedSettings(
                settings
            );

        } catch (error) {
            console.error(
                "Settings error:",
                error
            );

            setStatus(
                "Invalid settings file"
            );
        }
    };

    reader.onerror = () => {
        setStatus(
            "Unable to read settings file"
        );
    };

    reader.readAsText(file);
}

function getMindARVideo() {
    return (
        arContainer.querySelector(
            "video"
        ) || null
    );
}

function getARCanvas() {
    if (renderer) {
        return renderer.domElement;
    }

    return (
        arContainer.querySelector(
            "canvas"
        ) || null
    );
}

function createRecordingCanvas() {
    if (recordingCanvas) {
        return recordingCanvas;
    }

    recordingCanvas =
        document.createElement("canvas");

    recordingCanvas.width =
        Math.max(
            720,
            Math.floor(
                window.innerWidth *
                Math.min(
                    window.devicePixelRatio || 1,
                    1.5
                )
            )
        );

    recordingCanvas.height =
        Math.max(
            1280,
            Math.floor(
                window.innerHeight *
                Math.min(
                    window.devicePixelRatio || 1,
                    1.5
                )
            )
        );

    recordingContext =
        recordingCanvas.getContext(
            "2d"
        );

    return recordingCanvas;
}

function drawRecordingFrame() {
    if (
        !recordingCanvas ||
        !recordingContext
    ) {
        return;
    }

    const video =
        getMindARVideo();

    const arCanvas =
        getARCanvas();

    const ctx =
        recordingContext;

    const width =
        recordingCanvas.width;

    const height =
        recordingCanvas.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    if (video && video.readyState >= 2) {
        try {
            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );
        } catch (error) {
            console.warn(
                "Video draw error:",
                error
            );
        }
    }

    if (arCanvas) {
        try {
            ctx.drawImage(
                arCanvas,
                0,
                0,
                width,
                height
            );
        } catch (error) {
            console.warn(
                "AR draw error:",
                error
            );
        }
    }

    if (recording) {
        requestAnimationFrame(
            drawRecordingFrame
        );
    }
    }function startRecording() {
    if (recording) {
        return;
    }

    if (!cameraStarted) {
        setStatus(
            "Start camera before recording"
        );
        return;
    }

    try {
        const canvas =
            createRecordingCanvas();

        const stream =
            canvas.captureStream(30);

        recordedChunks = [];

        let options = {
            mimeType: "video/webm"
        };

        if (
            !MediaRecorder.isTypeSupported(
                "video/webm"
            )
        ) {
            options = {};
        }

        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );

        mediaRecorder.ondataavailable =
            event => {
                if (
                    event.data &&
                    event.data.size > 0
                ) {
                    recordedChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            saveRecording;

        mediaRecorder.onerror =
            event => {
                console.error(
                    "Recorder error:",
                    event
                );

                recording = false;

                recordButton.textContent =
                    "START RECORDING";

                setStatus(
                    "Recording error"
                );
            };

        mediaRecorder.start();

        recording = true;

        recordButton.textContent =
            "STOP RECORDING";

        setStatus(
            "Recording started"
        );

        drawRecordingFrame();

    } catch (error) {
        console.error(
            "Recording start error:",
            error
        );

        setStatus(
            "Recording is not supported"
        );
    }
}

function stopRecording() {
    if (
        !recording ||
        !mediaRecorder
    ) {
        return;
    }

    recording = false;

    recordButton.textContent =
        "START RECORDING";

    try {
        if (
            mediaRecorder.state !==
            "inactive"
        ) {
            mediaRecorder.stop();
        }
    } catch (error) {
        console.error(
            "Recording stop error:",
            error
        );

        setStatus(
            "Unable to stop recording"
        );
    }
}

function saveRecording() {
    if (
        !recordedChunks ||
        recordedChunks.length === 0
    ) {
        setStatus(
            "No recording data"
        );
        return;
    }

    const blob =
        new Blob(
            recordedChunks,
            {
                type: "video/webm"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download =
        `azeez-ar-${Date.now()}.webm`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    recordedChunks = [];

    setStatus(
        "Recording saved"
    );
}

function toggleRecording() {
    if (recording) {
        stopRecording();
    } else {
        startRecording();
    }
}

function toggleTracking() {
    trackingEnabled =
        !trackingEnabled;

    trackingButton.textContent =
        trackingEnabled
            ? "TRACKING: ON"
            : "TRACKING: OFF";

    if (trackingEnabled) {
        setStatus(
            "Face tracking enabled"
        );
    } else {
        setStatus(
            "Face tracking paused"
        );
    }
}

function handleResize() {
    if (

        camera

            renderer.setPixelRatio(

        } catch (error) {
            console.warn(
                "Resize renderer error:",

    if (recordingCanvas) {
        recordingCanvas.width =
            Math.max(
                720,
                Math.floor(
                    window.innerWidth *
                    Math.min(
                        window.devicePixelRatio || 1,
                        1.5
                    )
                )
            );

        recordingCanvas.height =
            Math.max(
                1280,
                Math.floor(
                    window.innerHeight *
                    Math.min(
                        window.devicePixelRatio || 1,
                        1.5
                    )
                )
            );
    }

    prepareMindARVideo();
}

);window.addEventListener(
    "beforeunload",
    () => {
        try {
            if (
                mediaRecorder &&
                mediaRecorder.state !==
                "inactive"
            ) {
                mediaRecorder.stop();
            }
        } catch (error) {
            console.warn(
                "Recorder cleanup error:",
                error
            );
        }

        try {
            if (mindarThree) {
                mindarThree.stop();
            }
        } catch (error) {
            console.warn(
                "Camera cleanup error:",
                error
            );
        }

        if (loadedModel) {
            loadedModel.traverse(
                object => {
                    if (object.geometry) {
                        object.geometry.dispose();
                    }

                    if (object.material) {
                        const materials =
                            Array.isArray(
                                object.material
                            )
                                ? object.material
                                : [object.material];

                        for (
                            const material
                            of materials
                        ) {
                            if (material.map) {
                                material.map.dispose();
                            }

                            if (
                                material.normalMap
                            ) {
                                material.normalMap.dispose();
                            }

                            material.dispose();
                        }
                    }
                }
            );
        }

        if (renderer) {
            try {
                renderer.dispose();
            } catch (error) {
                console.warn(
                    "Renderer cleanup error:",
                    error
                );
            }
        }
    }
);
