
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azeez AR Camera Face Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h3 { margin: 12px 4px; }
    #stage {
      position: relative;
      width: 100%;
      height: 65vh;
      background: #222;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }
    button {
      padding: 12px;
      margin: 6px 3px;
      font-size: 15px;
    }
    #status {
      padding: 10px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h3>AZEEZ AR — CAMERA + FACE TEST</h3>

  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Press START TEST</div>
  <button id="start">START CAMERA + TRACKING</button>
  <button id="stop">STOP CAMERA</button>

  <script type="module">
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let stream;
    let landmarker;
    let running = false;
    let busy = false;

    async function startTest() {
      if (running || busy) return;
      busy = true;

      try {
        status.textContent = "1/3 Requesting camera permission...";

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera API unavailable. Open the HTTPS GitHub Pages URL in Chrome."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "2/3 Camera opened. Loading face tracker...";

        const mp = await import(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
        );

        const vision = await mp.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        const modelUrl =
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

        try {
          landmarker = await mp.FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: modelUrl,
              delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          });
        } catch (gpuError) {
          landmarker = await mp.FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: modelUrl,
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          });
        }

        running = true;
        status.textContent = "3/3 Tracker loaded. Looking for face...";
        requestAnimationFrame(trackFace);

      } catch (error) {
        status.textContent = "ERROR: " + (error.message || String(error));
        console.error(error);
      } finally {
        busy = false;
      }
    }

    function trackFace() {
      if (!running) return;

      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth ||
            canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
          const result = landmarker.detectForVideo(
            video, performance.now()
          );

          const faces = result.faceLandmarks || [];

          if (faces.length > 0) {
            status.textContent = "FACE DETECTED ✓ — Green dots visible";
            ctx.fillStyle = "#00ff66";

            for (const point of faces[0]) {
              ctx.beginPath();
              ctx.arc(
                point.x * canvas.width,
                point.y * canvas.height,
                2,
                0,
                Math.PI * 2
              );
              ctx.fill();
            }
          } else {
            status.textContent = "Tracker running — Move face into view";
          }
        } catch (error) {
          running = false;
          status.textContent = "TRACKING ERROR: " + error.message;
          return;
        }
      }

      requestAnimationFrame(trackFace);
    }

    document.getElementById("start").addEventListener("click", startTest);

    document.getElementById("stop").addEventListener("click", () => {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (landmarker) {
        landmarker.close();
        landmarker = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      status.textContent = "Camera stopped.";
    });
  </script>
</body>
</html>
