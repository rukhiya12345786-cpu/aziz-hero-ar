<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR MindAR Face Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 1;
}

#threeCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#statusBar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    min-height: 42px;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 13px;
    z-index: 20;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

#status {
    color: #66ff88;
    font-weight: 700;
}

#faceInfo {
    margin-top: 3px;
    color: #ddd;
    font-size: 11px;
}

#bottomPanel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    max-height: 62vh;
    overflow-y: auto;
    padding: 14px 14px 22px;
    border-radius: 24px 24px 0 0;
    background: rgba(12, 12, 12, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transform: translateY(0);
    transition: transform 0.25s ease;
}

#panelHandle {
    width: 52px;
    height: 5px;
    margin: 0 auto 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.55);
    cursor: pointer;
}

.panelTitle {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
}

.buttonGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

button {
    min-height: 42px;
    border: 0;
    border-radius: 12px;
    background: #242424;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.primary {
    background: #1fa94c;
}

.danger {
    background: #a83232;
}

.controlGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    margin-top: 14px;
}

.control {
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
}

.control label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
}

.control label span {
    color: #66ff88;
}

input[type="range"] {
    width: 100%;
    height: 20px;
    margin: 0;
    padding: 0;
    accent-color: #35e66a;
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 10px;
    background: #555;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -8px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: #35e66a;
}

input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 10px;
    background: #555;
}

input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: #35e66a;
}

.sectionTitle {
    margin-top: 15px;
    margin-bottom: 7px;
    color: #aaa;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}

.hidden {
    display: none !important;
}

@media (orientation: landscape) {
    #bottomPanel {
        left: auto;
        width: 360px;
        max-height: 100%;
        border-radius: 20px 0 0 20px;
    }
}

@media (max-width: 380px) {
    .buttonGrid {
        grid-template-columns: repeat(2, 1fr);
    }

    #bottomPanel {
        max-height: 68vh;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

}

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="threeCanvas"></canvas>

    <div id="statusBar">
        <div id="status">READY</div>
        <div id="faceInfo">MindAR FaceMesh waiting</div>
    </div>

    <div id="bottomPanel">

        <div id="panelHandle"></div>

        <div class="panelTitle">
            Azeez AR Head Tracker
        </div>

        <div class="buttonGrid">

            <button
                id="cameraButton"
                class="primary">
                START CAMERA
            </button>

            <button
                id="switchCameraButton">
                SWITCH CAMERA
            </button>

            <button
                id="mirrorButton">
                MIRROR: ON
            </button>

            <button
                id="trackingButton">
                TRACKING: ON
            </button>

            <button
                id="importButton">

            </button>

            <button

            </button>

        </div>

        <div class="controlGrid">

            <div class="control">

                <label>

                    <span id="yValue">0</span>
                </label>
                <input
                    id="ySlider"
                    type="range"
                    min="-300"
                    max="300"
                    value="0"
                    step="1">
            </div>

            <div class="control">
                <label>
                    DEPTH
                    <span id="zValue">0</span>
                </label>
                <input
                    id="zSlider"
                    type="range"
                    min="-500"
                    max="500"
                    value="0"
                    step="1">
            </div>

            <div class="control">
                <label>
                    SCALE
                    <span id="scaleValue">1.00</span>
                </label>
                <input
                    id="scaleSlider"
                    type="range"
                    min="0.10"
                    max="3.00"

            <div class="control">
                <label>
                    ROT X
                    <span id="rotXValue">0</span>
                </label>
                <input
                    id="rotXSlider"
                    type="range"
                    min="-180"
                    max="180"
                    value="0"
                    step="1">
            </div>

            <div class="control">
                <label>
                    ROT Y
                    <span id="rotYValue">0</span>
                </label>
                <input
                    id="rotYSlider"
                    type="range"
                    min="-180"
                    max="180"
                    value="0"
                    step="1">
            </div>

            <div class="control">
                <label>
                    ROT Z
                    <span id="rotZValue">0</span>
                </label>
                <input
                    id="rotZSlider"
                    type="range"
                    min="-180"
                    max="180"
                    value="0"
                    step="1">
            </div>

            <div class="control">
                <label>
                    HEAD FIT
                    <span id="fitValue">1.00</span>
                </label>
                <input
                    id="fitSlider"
                    type="range"
                    min="0.50"
                    max="2.00"
                    value="1"
                    step="0.01">
            </div>

        </div>

    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

import {
    MindARThree
} from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js";


const video =
    document.getElementById("camera");

const threeCanvas =
    document.getElementById("threeCanvas");

const statusElement =
    document.getElementById("status");

const faceInfoElement =
    document.getElementById("faceInfo");

const cameraButton =
    document.getElementById("cameraButton");

const switchCameraButton =
    document.getElementById("switchCameraButton");

const mirrorButton =
    document.getElementById("mirrorButton");

const trackingButton =
    document.getElementById("trackingButton");

const importButton =
    document.getElementById("importButton");

const resetButton =
    document.getElementById("resetButton");

const glbInput =
    document.getElementById("glbInput");

const panelHandle =
    document.getElementById("panelHandle");


const xSlider =
    document.getElementById("xSlider");

const ySlider =
    document.getElementById("ySlider");

const zSlider =
    document.getElementById("zSlider");

const scaleSlider =
    document.getElementById("scaleSlider");

const rotXSlider =
    document.getElementById("rotXSlider");

const rotYSlider =
    document.getElementById("rotYSlider");

const rotZSlider =
    document.getElementById("rotZSlider");

const fitSlider =
    document.getElementById("fitSlider");


const xValue =
    document.getElementById("xValue");

const yValue =
    document.getElementById("yValue");

const zValue =
    document.getElementById("zValue");

const scaleValue =
    document.getElementById("scaleValue");

const rotXValue =
    document.getElementById("rotXValue");

const rotYValue =
    document.getElementById("rotYValue");

const rotZValue =
    document.getElementById("rotZValue");

const fitValue =
    document.getElementById("fitValue");


let mindar = null;

let scene = null;

let camera3D = null;

let renderer = null;

let faceAnchor = null;

let faceMesh = null;

let modelRoot = null;

let modelScene = null;

let glbLoader = null;

let mindarStarted = false;

let trackingEnabled = true;

let mirrorEnabled = true;

let panelHidden = false;


const settings = {

    x: 0,

    y: 0,

    z: 0,

    scale: 1,

    rotX: 0,

    rotY: 0,

    rotZ: 0,

    fit: 1

};


function setStatus(message) {

    statusElement.textContent =
        message;

}


function setFaceInfo(message) {

    faceInfoElement.textContent =
        message;

}


function createRenderer() {

    renderer =
        new THREE.WebGLRenderer({
            canvas: threeCanvas,
            alpha: true,
            antialias: true,
            powerPreference: "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}


function createScene() {

    scene =
        new THREE.Scene();

    camera3D =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );

    camera3D.position.set(
        0,
        0,
        2
    );

    scene.add(camera3D);

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.5
        );

    scene.add(ambient);

    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    directional.position.set(
        0,
        1,
        2
    );

    scene.add(directional);

    glbLoader =
        new GLTFLoader();

}


function createMindAR() {

    mindar =
        new MindARThree({
            container: document.getElementById("app"),
            uiLoading: "no",
            uiScanning: "no",
            uiError: "no"
        });

    scene =
        mindar.scene;

    camera3D =
        mindar.camera;

    renderer =
        mindar.renderer;

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    faceAnchor =
        mindar.addAnchor(1);

}


function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(ambient);

    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    keyLight.position.set(
        0,
        1,
        2
    );

    scene.add(keyLight);

}


createMindAR();

createLights();

setStatus("MINDAR READY");

setFaceInfo(
    "FaceMesh anchor ready"
);const faceMeshMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00ff66,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide,
        depthWrite: false
    });


function createFaceMesh() {

    if (!faceAnchor) {
        return;
    }

    faceMesh =
        mindar.createFaceMesh(
            faceAnchor
        );

    if (!faceMesh) {
        setStatus("FACE MESH ERROR");
        return;
    }

    faceMesh.material =
        faceMeshMaterial;

    faceMesh.renderOrder = 1;

    faceAnchor.group.add(
        faceMesh
    );

    setStatus("FACE MESH READY");

    setFaceInfo(
        "Face mesh attached"
    );

}


function updateExpressionData(
    blendshapes
) {

    if (!blendshapes) {
        return;
    }

    let jawOpen = 0;

    let eyeBlinkLeft = 0;

    let eyeBlinkRight = 0;

    let mouthSmileLeft = 0;

    let mouthSmileRight = 0;


    if (
        blendshapes.jawOpen !== undefined
    ) {
        jawOpen =
            blendshapes.jawOpen;
    }

    if (
        blendshapes.eyeBlinkLeft !== undefined
    ) {
        eyeBlinkLeft =
            blendshapes.eyeBlinkLeft;
    }

    if (
        blendshapes.eyeBlinkRight !== undefined
    ) {
        eyeBlinkRight =
            blendshapes.eyeBlinkRight;
    }

    if (
        blendshapes.mouthSmileLeft !== undefined
    ) {
        mouthSmileLeft =
            blendshapes.mouthSmileLeft;
    }

    if (
        blendshapes.mouthSmileRight !== undefined
    ) {
        mouthSmileRight =
            blendshapes.mouthSmileRight;
    }


    setFaceInfo(
        "Face tracked | " +
        "Jaw " +
        jawOpen.toFixed(2) +
        " | Eye L " +
        eyeBlinkLeft.toFixed(2) +
        " | Eye R " +
        eyeBlinkRight.toFixed(2)
    );


    if (modelScene) {

        applyBlendshapes(
            modelScene,
            blendshapes
        );

    }

}


function applyBlendshapes(
    root,
    blendshapes
) {

    if (!root) {
        return;
    }

    root.traverse(
        function(object) {

            if (
                !object.isMesh ||
                !object.morphTargetDictionary ||
                !object.morphTargetInfluences
            ) {
                return;
            }


            const dictionary =
                object.morphTargetDictionary;

            const influences =
                object.morphTargetInfluences;


            for (
                const name in dictionary
            ) {

                const index =
                    dictionary[name];

                if (
                    blendshapes[name] !==
                    undefined
                ) {

                    influences[index] =
                        THREE.MathUtils.clamp(
                            blendshapes[name],
                            0,
                            1
                        );

                    continue;

                }


                const normalizedName =
                    name
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9]/g,
                            ""
                        );


                let value = null;


                if (
                    normalizedName.includes(
                        "jawopen"
                    )
                ) {

                    value =
                        blendshapes.jawOpen;

                } else if (
                    normalizedName.includes(
                        "eyeblinkleft"
                    )
                ) {

                    value =
                        blendshapes.eyeBlinkLeft;

                } else if (
                    normalizedName.includes(
                        "eyeblinkright"
                    )
                ) {

                    value =
                        blendshapes.eyeBlinkRight;

                } else if (
                    normalizedName.includes(
                        "mouthsmileleft"
                    )
                ) {

                    value =
                        blendshapes.mouthSmileLeft;

                } else if (
                    normalizedName.includes(
                        "mouthsmileright"
                    )
                ) {

                    value =
                        blendshapes.mouthSmileRight;

                }


                if (
                    value !== null
                ) {

                    influences[index] =
                        THREE.MathUtils.clamp(
                            value,
                            0,
                            1
                        );

                }

            }

        }
    );

}


function setupMindAREvents() {

    if (!mindar) {
        return;
    }


    faceAnchor.onTargetFound =
        function() {

            setStatus(
                "FACE DETECTED"
            );

            setFaceInfo(
                "Head tracking active"
            );

        };


    faceAnchor.onTargetLost =
        function() {

            setStatus(
                "FACE LOST"
            );

            setFaceInfo(
                "Move face into camera view"
            );

        };

}


function applyModelTransform() {

    if (!modelRoot) {
        return;
    }


    modelRoot.position.set(
        settings.x,
        settings.y,
        settings.z
    );


    modelRoot.rotation.set(
        THREE.MathUtils.degToRad(
            settings.rotX
        ),
        THREE.MathUtils.degToRad(
            settings.rotY
        ),
        THREE.MathUtils.degToRad(
            settings.rotZ
        )
    );


    const finalScale =
        settings.scale *
        settings.fit;


    modelRoot.scale.setScalar(
        finalScale
    );

}


function updateSliderValues() {

    xValue.textContent =
        settings.x;

    yValue.textContent =
        settings.y;

    zValue.textContent =
        settings.z;

    scaleValue.textContent =
        settings.scale.toFixed(2);

    rotXValue.textContent =
        settings.rotX;

    rotYValue.textContent =
        settings.rotY;

    rotZValue.textContent =
        settings.rotZ;

    fitValue.textContent =
        settings.fit.toFixed(2);

}


function connectSlider(
    slider,
    valueName,
    formatter
) {

    slider.addEventListener(
        "input",
        function() {

            settings[valueName] =
                Number(
                    slider.value
                );


            if (
                formatter
            ) {

                formatter();

            }


            updateSliderValues();

            applyModelTransform();

        }
    );

}


connectSlider(
    xSlider,
    "x"
);

connectSlider(
    ySlider,
    "y"
);

connectSlider(
    zSlider,
    "z"
);

connectSlider(
    scaleSlider,
    "scale"
);

connectSlider(
    rotXSlider,
    "rotX"
);

connectSlider(
    rotYSlider,
    "rotY"
);

connectSlider(
    rotZSlider,
    "rotZ"
);

connectSlider(
    fitSlider,
    "fit"
);


function resetSettings() {

    settings.x = 0;

    settings.y = 0;

    settings.z = 0;

    settings.scale = 1;

    settings.rotX = 0;

    settings.rotY = 0;

    settings.rotZ = 0;

    settings.fit = 1;


    xSlider.value =
        settings.x;

    ySlider.value =
        settings.y;

    zSlider.value =
        settings.z;

    scaleSlider.value =
        settings.scale;

    rotXSlider.value =
        settings.rotX;

    rotYSlider.value =
        settings.rotY;

    rotZSlider.value =
        settings.rotZ;

    fitSlider.value =
        settings.fit;


    updateSliderValues();

    applyModelTransform();

}


function updateMirror() {

    if (mirrorEnabled) {

        video.style.transform =
            "scaleX(-1)";

        threeCanvas.style.transform =
            "scaleX(-1)";

        mirrorButton.textContent =
            "MIRROR: ON";

    } else {

        video.style.transform =
            "scaleX(1)";

        threeCanvas.style.transform =
            "scaleX(1)";

        mirrorButton.textContent =
            "MIRROR: OFF";

    }

}


function setTrackingEnabled(
    enabled
) {

    trackingEnabled =
        enabled;

    trackingButton.textContent =
        trackingEnabled
            ? "TRACKING: ON"
            : "TRACKING: OFF";

}


function togglePanel() {

    panelHidden =
        !panelHidden;


    if (panelHidden) {

        document
            .getElementById(
                "bottomPanel"
            )
            .style.transform =
            "translateY(calc(100% - 48px))";

    } else {

        document
            .getElementById(
                "bottomPanel"
            )
            .style.transform =
            "translateY(0)";

    }

}


function startMindAR() {

    if (mindarStarted) {
        return;
    }


    setStatus(
        "STARTING CAMERA..."
    );


    createFaceMesh();

    setupMindAREvents();


    mindar.start()
        .then(
            function() {

                mindarStarted =
                    true;

                setStatus(
                    "CAMERA + MINDAR ON"
                );

                setFaceInfo(
                    "Looking for face..."
                );

                cameraButton.textContent =
                    "CAMERA ON";


                renderLoop();

            }
        )
        .catch(
            function(error) {

                console.error(
                    error
                );

                setStatus(
                    "CAMERA ERROR"
                );

                setFaceInfo(
                    error.message ||
                    "Unable to start MindAR"
                );

            }
        );

}


function renderLoop() {

    if (!mindarStarted) {
        return;
    }


    requestAnimationFrame(
        renderLoop
    );


    if (
        !trackingEnabled
    ) {

        renderer.render(
            scene,
            camera3D
        );

        return;

    }


    renderer.render(
        scene,
        camera3D
    );

}


cameraButton.addEventListener(
    "click",
    function() {

        startMindAR();

    }
);


mirrorButton.addEventListener(
    "click",
    function() {

        mirrorEnabled =
            !mirrorEnabled;

        updateMirror();

    }
);


trackingButton.addEventListener(
    "click",
    function() {

        setTrackingEnabled(
            !trackingEnabled
        );

    }
);


resetButton.addEventListener(
    "click",
    function() {

        resetSettings();

    }
);


panelHandle.addEventListener(
    "click",
    function() {

        togglePanel();

    }
);


updateSliderValues();

updateMirror();

setStatus(
    "READY"
);

setFaceInfo(
    "Press START CAMERA"
);function prepareModel(root) {

    if (!root) {
        return;
    }

    const box =
        new THREE.Box3().setFromObject(
            root
        );

    const center =
        new THREE.Vector3();

    const size =
        new THREE.Vector3();

    box.getCenter(center);

    box.getSize(size);

    root.position.sub(center);

    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        maxDimension > 0
    ) {

        const normalization =
            1 / maxDimension;

        root.scale.setScalar(
            normalization
        );

    }


    root.traverse(
        function(object) {

            if (
                object.isMesh
            ) {

                object.frustumCulled =
                    false;

                object.castShadow =
                    false;

                object.receiveShadow =
                    false;

                if (
                    object.material
                ) {

                    object.material
                        .side =
                        THREE.DoubleSide;

                }

            }

        }
    );

}


function importGLB(file) {

    if (!file) {
        return;
    }


    setStatus(
        "LOADING 3D MODEL..."
    );


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const arrayBuffer =
                event.target.result;


            glbLoader.parse(
                arrayBuffer,
                "",
                function(gltf) {

                    if (
                        modelRoot
                    ) {

                        if (
                            modelRoot.parent
                        ) {

                            modelRoot.parent
                                .remove(
                                    modelRoot
                                );

                        }

                    }


                    modelScene =
                        gltf.scene;


                    modelRoot =
                        new THREE.Group();


                    prepareModel(
                        modelScene
                    );


                    modelRoot.add(
                        modelScene
                    );


                    faceAnchor.group.add(
                        modelRoot
                    );


                    applyModelTransform();


                    setStatus(
                        "3D MODEL READY"
                    );

                    setFaceInfo(
                        "Model attached to face"
                    );

                },
                function(error) {

                    console.error(
                        error
                    );

                    setStatus(
                        "MODEL ERROR"
                    );

                    setFaceInfo(
                        "Could not load GLB"
                    );

                }
            );

        };


    reader.onerror =
        function() {

            setStatus(
                "FILE ERROR"
            );

            setFaceInfo(
                "Could not read model file"
            );

        };


    reader.readAsArrayBuffer(
        file
    );

}

switchCameraButton.addEventListener(
    "click",
    async function() {

        if (!mindarStarted) {

            setStatus(
                "START CAMERA FIRST"
            );

            return;

        }


        setStatus(
            "SWITCHING CAMERA..."
        );


        try {

            await mindar.stop();

            mindarStarted =
                false;


            if (
                faceAnchor
            ) {

                faceAnchor.group
                    .visible =
                    false;

            }


            const oldCamera =
                mindar;

            if (
                oldCamera
            ) {

                try {

                    await oldCamera.stop();

                } catch (error) {

                    console.log(
                        error
                    );

                }

            }


            setStatus(
                "RESTARTING CAMERA"
            );


            await startMindAR();

        } catch (error) {

            console.error(
                error
            );

            setStatus(
                "CAMERA SWITCH ERROR"
            );

            setFaceInfo(
                error.message ||
                "Could not switch camera"
            );

        }

    }
);


window.addEventListener(
    "resize",
    function() {

        if (
            renderer
        ) {

            renderer.setSize(
                window.innerWidth,
                window.innerHeight,
                false
            );

            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                )
            );

        }

    }
);


document.addEventListener(

        if (

        ) {

        }

        if (

    }
);
