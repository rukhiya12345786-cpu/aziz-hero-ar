<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera 3D Test</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

#camera{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
z-index:1;
}

#three{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

button{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
z-index:10;
padding:18px 30px;
font-size:20px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="three"></canvas>

<button id="open">OPEN CAMERA</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const video =
document.getElementById("camera");

const button =
document.getElementById("open");

const canvas =
document.getElementById("three");


const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
100
);

camera3D.position.z = 3;


const renderer =
new THREE.WebGLRenderer({
canvas:canvas,
alpha:true,
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);


const geometry =
new THREE.BoxGeometry(
1,
1,
1
);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(
geometry,
material
);

cube.position.set(
0,
0,
0
);

scene.add(cube);


function animate(){

requestAnimationFrame(animate);

cube.rotation.x += 0.01;
cube.rotation.y += 0.01;

renderer.render(
scene,
camera3D
);

}

animate();


button.onclick =
async function(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user"
},
audio:false
});

video.srcObject = stream;

button.style.display = "none";

}catch(error){

alert(
"CAMERA ERROR\n\n" +
error.name +
"\n" +
error.message
);

}

};


window.addEventListener(
"resize",
function(){

camera3D.aspect =
window.innerWidth /
window.innerHeight;

camera3D.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
