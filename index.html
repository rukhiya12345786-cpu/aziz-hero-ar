<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz AR Studio - Perfect Importer</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 12px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; gap: 6px; }
        
        /* Ultra Transparent Glass Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 7px 12px; font-size: 11px; border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(8px); text-shadow: 0 1px 2px rgba(0,0,0,0.8); transition: all 0.2s ease;
        }
        .btn:active { background: rgba(0, 255, 136, 0.4); border-color: #00ff88; }
        .btn.recording { background: rgba(255, 51, 51, 0.7); border-color: #ff3333; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
        }

        /* Fully Transparent Floating Control Panel */
        .control-panel {
            position: absolute; top: 65px; right: 12px; background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px);
            width: 145px;
        }
        .control-panel label { color: #00ff88; font-size: 9px; font-weight: bold; display: flex; justify-content: space-between; text-shadow: 0 1px 2px #000; }
        .control-panel input[type=range] { width: 100%; cursor: pointer; accent-color: #00ff88; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 25px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 16px; font-weight: bold;
            padding: 14px 40px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 0 25px rgba(0,255,136,0.5);
        }
    </style>

    <!-- Required Libraries & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- MediaPipe & Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00ff88; margin-bottom: 5px; font-size: 24px;">Aziz AR Studio</h1>
        <p style="color: #aaa; font-size: 12px; max-width: 280px;">Stable AR Importer & Tracking</p>
        <button id="launch-btn">START STUDIO</button>
        <div id="error-log" style="color: #ff4444; font-size: 11px; margin-top: 10px;"></div>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="import-btn" class="btn interactive">📥 Import</button>
            <input type="file" id="import-file" style="display: none;" accept=".obj,.glb,.gltf,.fbx">
            <button id="record-btn" class="btn interactive">🔴 Rec</button>
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div class="control-panel interactive">
            <label>Scale <span id="val-scale">1.0</span></label>
            <input type="range" id="range-scale" min="0.05" max="3.0" step="0.05" value="1.0">
            
            <label>Offset X <span id="val-x">0.0</span></label>
            <input type="range" id="range-x" min="-1.0" max="1.0" step="0.05" value="0.0">

            <label>Offset Y <span id="val-y">0.0</span></label>
            <input type="range" id="range-y" min="-1.0" max="1.0" step="0.05" value="0.0">

            <label>Rotation Y <span id="val-rot">0°</span></label>
            <input type="range" id="range-rot" min="-180" max="180" step="5" value="0">
        </div>
    </div>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh = null, mpCamera = null;
        let activeModelGroup = null;
        let useFront = true;
        
        let manualScale = 1.0;
        let manualOffsetX = 0.0;
        let manualOffsetY = 0.0;
        let manualRotateY = 0.0;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                await startCamera();
                document.getElementById('start-screen').style.display = 'none';
                initThreeJS();
                createDefaultMemojiHead();
                initTracking();
                initControls();
                initVisibilityHandler();
            } catch (err) {
                console.error(err);
                document.getElementById('error-log').innerText = err.message;
                btn.innerText = "START STUDIO";
                btn.disabled = false;
            }
        });

        async function startCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        function initVisibilityHandler() {
            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'visible') {
                    if (!mediaStream || mediaStream.active === false || videoEl.paused) {
                        try {
                            await startCamera();
                            if (mpCamera) {
                                mpCamera.stop();
                                await mpCamera.start();
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }
                }
            });
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            if (mpCamera) mpCamera.stop();
            await startCamera();
            if (mpCamera) mpCamera.start();
        });

        function createDefaultMemojiHead() {
            if (activeModelGroup) scene.remove(activeModelGroup);
            activeModelGroup = new THREE.Group();

            const headGeo = new THREE.SphereGeometry(0.45, 32, 32);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2, metalness: 0.5 });
            const head = new THREE.Mesh(headGeo, headMat);
            activeModelGroup.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.5, 0.12, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 0.08, 0.38);
            activeModelGroup.add(eyes);

            scene.add(activeModelGroup);
        }

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            const fileName = file.name.toLowerCase();

            if (activeModelGroup) scene.remove(activeModelGroup);
            activeModelGroup = new THREE.Group();

            const finalizeImport = (object) => {
                // Precise centering to ensure model stays visible on screen
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                object.position.x -= center.x;
                object.position.y -= center.y;
                object.position.z -= center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scaleFactor = 0.8 / maxDim;
                    object.scale.multiplyScalar(scaleFactor);
                }

                activeModelGroup.add(object);
                scene.add(activeModelGroup);
                alert("Model Loaded Successfully!");
            };

            if (fileName.endsWith('.obj')) {
                const loader = new THREE.OBJLoader();
                loader.load(fileURL, (object) => {
                    object.traverse(child => {
                        if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3, metalness: 0.4 });
                    });
                    finalizeImport(object);
                }, undefined, (error) => {
                    console.error(error);
                    alert("Error loading OBJ file!");
                    createDefaultMemojiHead();
                });
            } else if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                const loader = new THREE.GLTFLoader();
                loader.load(fileURL, (gltf) => {
                    finalizeImport(gltf.scene);
                }, undefined, (error) => {
                    console.error(error);
                    alert("Error loading GLB/GLTF file!");
                    createDefaultMemojiHead();
                });
            } else if (fileName.endsWith('.fbx')) {
                const loader = new THREE.FBXLoader();
                loader.load(fileURL, (object) => {
                    object.traverse(child => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.4, metalness: 0.3 });
                        }
                    });
                    finalizeImport(object);
                }, undefined, (error) => {
                    console.error(error);
                    alert("Error loading FBX file!");
                    createDefaultMemojiHead();
                });
            }
        });

        function initControls() {
            document.getElementById('range-scale').addEventListener('input', (e) => {
                manualScale = parseFloat(e.target.value);
                document.getElementById('val-scale').innerText = manualScale.toFixed(2);
            });
            document.getElementById('range-x').addEventListener('input', (e) => {
                manualOffsetX = parseFloat(e.target.value);
                document.getElementById('val-x').innerText = manualOffsetX.toFixed(2);
            });
            document.getElementById('range-y').addEventListener('input', (e) => {
                manualOffsetY = parseFloat(e.target.value);
                document.getElementById('val-y').innerText = manualOffsetY.toFixed(2);
            });
            document.getElementById('range-rot').addEventListener('input', (e) => {
                manualRotateY = THREE.MathUtils.degToRad(parseFloat(e.target.value));
                document.getElementById('val-rot').innerText = e.target.value + '°';
            });
        }

        const recordBtn = document.getElementById('record-btn');
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                recordedChunks = [];
                const canvasStream = renderer.domElement.captureStream(30);
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);

                try {
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm; codecs=vp9' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(canvasStream);
                }

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'aziz_ar_recording.webm';
                    document.body.appendChild(a); a.click(); a.remove();
                };
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "⏹ Stop";
                recordBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Rec";
                recordBtn.classList.remove('recording');
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.8));
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(0, 10, 10);
            scene.add(light);

            camera.position.z = 2.8;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('take-snap').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
                const link = document.createElement('a');
                link.download = 'aziz_ar_snap.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            animateLoop();
        }

        function initTracking() {
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            
            let smoothPos = new THREE.Vector3(0, 0, 0);
            let smoothRot = new THREE.Quaternion();

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && activeModelGroup) {
                    const landmarks = results.multiFaceLandmarks[0];
                    const riggedFace = Kalidokit.Face.solve(landmarks, { runtime: "mediapipe", video: videoEl });

                    if (riggedFace) {
                        const nose = landmarks[1], lEdge = landmarks[234], rEdge = landmarks[454];
                        const cx = (lEdge.x + rEdge.x) / 2;
                        const cy = (landmarks[10].y + landmarks[152].y) / 2;
                        const cz = (lEdge.z + rEdge.z + nose.z) / 3;

                        const targetX = -(cx - 0.5) * 3.2 + manualOffsetX;
                        const targetY = -(cy - 0.5) * 3.2 + 0.18 + manualOffsetY;
                        const targetZ = cz * 1.1;

                        smoothPos.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.6);
                        activeModelGroup.position.copy(smoothPos);

                        const euler = riggedFace.head;
                        let targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(euler.x, euler.y + manualRotateY, euler.z, 'YXZ'));
                        smoothRot.slerp(targetQuat, 0.6);
                        activeModelGroup.quaternion.copy(targetQuat);

                        activeModelGroup.scale.set(manualScale, manualScale, manualScale);
                    }

                    activeModelGroup.visible = true;
                } else if (activeModelGroup) {
                    activeModelGroup.visible = false;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => { if (videoEl && videoEl.readyState >= 2) await faceMesh.send({ image: videoEl }); },
                width: 640, height: 480
            });
            mpCamera.start();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
