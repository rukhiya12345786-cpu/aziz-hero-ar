<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azeez AR Face Tracking Test</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #07101c;
  color: white;
  font-family: Arial, sans-serif;
}

body { padding: 10px; }

h2 {
  text-align: center;
  font-size: 20px;
  margin: 5px 0 10px;
}

#view {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: auto;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: #000;
  border-radius: 10px;
}

#cameraVideo, #dotsCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#cameraVideo {
  object-fit: fill;
  background: #000;
}

#dotsCanvas {
  pointer-events: none;
}

#status {
  max-width: 900px;
  margin: 10px auto;
  padding: 10px;
  background: #15253b;
  border-radius: 8px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.controls {
  max-width: 900px;
  margin: 10px auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

button {
  min-height: 44px;
  padding: 9px 5px;
  border: 0;
  border-radius: 8px;
  background: #1769db;
  color: white;
  font-weight: bold;
  font-size: 13px;
}

button:disabled { opacity: 0.5; }
#stopBtn { background: #b92d3b; }
#mirrorBtn { background: #7044b8; }
#fullscreenBtn { background: #087f70; }
#dotsBtn { background: #168347; }

.note {
  max-width: 900px;
  margin: 12px auto;
  font-size: 13px;
  line-height: 1.5;
  color: #bdcce0;
}

body.fullscreen-active {
  padding: 0;
  overflow: hidden;
}

body.fullscreen-active h2,
body.fullscreen-active #status,
body.fullscreen-active .note {
  display: none;
}

body.fullscreen-active #view {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  max-width: none;
  aspect-ratio: auto;
  margin: 0;
  border-radius: 0;
}

body.fullscreen-active .controls {
  position: fixed;
  z-index: 10000;
  left: 8px;
  right: 8px;
  bottom: max(8px, env(safe-area-inset-bottom));
  width: calc(100% - 16px);
  margin: auto;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

body.fullscreen-active button {
  min-height: 38px;
  padding: 6px 3px;
  background: rgba(20, 50, 80, 0.92);
  font-size: 11px;
}

body.fullscreen-active #stopBtn {
  background: rgba(185, 45, 59, 0.95);
}

body.fullscreen-active #mirrorBtn {
  background: rgba(112, 68, 184, 0.95);
}

body.fullscreen-active #dotsBtn {
  background: rgba(22, 131, 71, 0.95);
}

@media (orientation: landscape) {
  body { padding: 6px; }

  h2 { font-size: 16px; margin: 2px 0 5px; }

  #view {
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16 / 9;
  }

  .controls {
    max-width: 1200px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 6px auto;
  }

  .controls button {
    min-height: 38px;
  }

  body.fullscreen-active .controls {
    left: 10px;
    right: 10px;
    bottom: max(8px, env(safe-area-inset-bottom));
    width: min(760px, calc(100% - 20px));
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<h2>Azeez AR — Green Dot Tracking</h2>

<div id="view">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <canvas id="dotsCanvas"></canvas>
</div>

<div id="status">Press START CAMERA.</div>

<div class="controls">
  <button id="startBtn">START CAMERA</button>
  <button id="switchBtn">SWITCH CAMERA</button>
  <button id="mirrorBtn">MIRROR FLIP: OFF</button>
  <button id="fullscreenBtn">FULL SCREEN</button>
  <button id="trackingBtn">START TRACKING</button>
  <button id="stopTrackingBtn">STOP TRACKING</button>
  <button id="dotsBtn">GREEN DOTS: ON</button>
  <button id="stopBtn">STOP CAMERA</button>
</div>

<div class="note">
  The cube has been removed. Green dots show the detected face landmarks.
  Test the camera in portrait and landscape. Use the mirror button to compare
  left and right. Fullscreen availability depends on browser support.
</div>

<script type="module">
const video = document.getElementById("cameraVideo");
const view = document.getElementById("view");
const canvas = document.getElementById("dotsCanvas");
const ctx = canvas.getContext("2d");
const statusBox = document.getElementById("status");

const startBtn = document.getElementById("startBtn");
const switchBtn = document.getElementById("switchBtn");
const mirrorBtn = document.getElementById("mirrorBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const trackingBtn = document.getElementById("trackingBtn");
const stopTrackingBtn = document.getElementById("stopTrackingBtn");
const dotsBtn = document.getElementById("dotsBtn");
const stopBtn = document.getElementById("stopBtn");

let stream = null;
let facingMode = "user";
let mirrorOn = false;
let dotsOn = true;
let tracking = false;
let landmarker = null;
let frameId = 0;
let cameraStarting = false;
let lastVideoTime = -1;
let lastLandmarks = null;
let loadingModel = false;

function setStatus(message) {
  statusBox.textContent = message;
}

/* Resize the canvas to the visible camera stage. */
function resizeCanvas() {
  const rect = view.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawDots(lastLandmarks);
}

function clearDots() {
  const rect = view.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
}

function drawDots(landmarks) {
  clearDots();

  if (!dotsOn || !landmarks) return;

  const rect = view.getBoundingClientRect();
  const radius = Math.max(1.4, Math.min(rect.width, rect.height) / 260);

  ctx.fillStyle = "#00ff55";
  ctx.strokeStyle = "rgba(0, 40, 10, 0.8)";
  ctx.lineWidth = 0.7;

  for (const point of landmarks) {
    const x = point.x * rect.width;
    const y = point.y * rect.height;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 250);
});

/* Mirror video and landmark canvas together. */
function updateMirror() {
  const transform = mirrorOn ? "scaleX(-1)" : "none";
  video.style.transform = transform;
  canvas.style.transform = transform;
  mirrorBtn.textContent =
    "MIRROR FLIP: " + (mirrorOn ? "ON" : "OFF");
}

mirrorBtn.addEventListener("click", () => {
  mirrorOn = !mirrorOn;
  updateMirror();
});

dotsBtn.addEventListener("click", () => {
  dotsOn = !dotsOn;
  dotsBtn.textContent = "GREEN DOTS: " + (dotsOn ? "ON" : "OFF");
  drawDots(lastLandmarks);
});

/* Camera */
async function startCamera() {
  if (cameraStarting) return;
  cameraStarting = true;

  try {
    stopCamera(false);

    setStatus("Opening camera...");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    view.style.aspectRatio =
      `${video.videoWidth || 640} / ${video.videoHeight || 480}`;

    resizeCanvas();
    setStatus("Camera working. Press START TRACKING.");

  } catch (error) {
    setStatus("Camera error: " + error.message);
  } finally {
    cameraStarting = false;
  }
}

function stopCamera(showMessage = true) {
  stopTracking(false);

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  lastLandmarks = null;
  clearDots();

  if (showMessage) setStatus("Camera stopped.");
}

startBtn.addEventListener("click", startCamera);

switchBtn.addEventListener("click", async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  await startCamera();
});

/* Fullscreen: request browser fullscreen first, then use a CSS fallback. */
async function enterFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
      return;
    }

    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else {
      document.body.classList.add("fullscreen-active");
    }
  } catch (error) {
    document.body.classList.add("fullscreen-active");
    setStatus("Using camera full-screen layout. Browser bars may remain visible.");
  }

  setTimeout(resizeCanvas, 200);
}

fullscreenBtn.addEventListener("click", enterFullscreen);

document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle(
    "fullscreen-active",
    Boolean(document.fullscreenElement)
  );

  fullscreenBtn.textContent = document.fullscreenElement
    ? "EXIT FULL SCREEN"
    : "FULL SCREEN";

  setTimeout(resizeCanvas, 200);
});

/* MediaPipe */
async function loadFaceLandmarker() {
  if (landmarker) return landmarker;
  if (loadingModel) {
    throw new Error("Model is still loading. Please try again.");
  }

  loadingModel = true;

  try {
    setStatus("Loading face model...");

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
    );

    const files = await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );

    landmarker = await vision.FaceLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: true
    });

    return landmarker;
  } finally {
    loadingModel = false;
  }
}

async function startTracking() {
  if (!stream) {
    setStatus("First press START CAMERA.");
    return;
  }

  try {
    await loadFaceLandmarker();

    tracking = true;
    lastVideoTime = -1;
    setStatus("Tracking started. Looking for face...");
    detectFrame();

  } catch (error) {
    setStatus("Tracking error: " + error.message);
  }
}

function stopTracking(showMessage = true) {
  tracking = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = 0;
  }

  lastLandmarks = null;
  clearDots();

  if (showMessage) setStatus("Tracking stopped.");
}

function detectFrame() {
  if (!tracking) return;

  if (video.readyState >= 2 && landmarker) {
    try {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const result = landmarker.detectForVideo(
          video,
          performance.now()
        );

        lastLandmarks = result.faceLandmarks?.[0] || null;
      }

      drawDots(lastLandmarks);

      if (lastLandmarks) {
        setStatus("FACE DETECTED — GREEN DOTS ACTIVE");
      } else {
        setStatus("Looking for face...");
      }

    } catch (error) {
      setStatus("Detection error: " + error.message);
    }
  }

  frameId = requestAnimationFrame(detectFrame);
}

trackingBtn.addEventListener("click", startTracking);
stopTrackingBtn.addEventListener("click", () => stopTracking(true));
stopBtn.addEventListener("click", () => stopCamera(true));

updateMirror();
resizeCanvas();
</script>
</body>
</html>
