<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeez AR - Camera & Recorder</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #fff;
            font-family: sans-serif;
            padding: 10px;
        }
        h2 {
            margin: 10px 0;
            font-size: 18px;
        }
        video {
            width: 100%;
            max-width: 400px;
            height: 60vh;
            object-fit: cover;
            border-radius: 10px;
            background: #222;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #flipBtn { background: #007bff; }
        #recordBtn { background: #28a745; }
        #stopBtn { background: #dc3545; display: none; }
        #downloadLink {
            margin-top: 15px;
            padding: 10px 15px;
            background: #ffc107;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Azeez AR - Camera & Recorder</h2>
    <video id="cameraStream" autoplay playsinline muted></video>

    <div class="controls">
        <button id="flipBtn">Flip Camera</button>
        <button id="recordBtn">Start Recording</button>
        <button id="stopBtn">Stop Recording</button>
    </div>

    <a id="downloadLink" download="azeez-ar-video.webm">Download Video</a>

    <script>
        const videoElement = document.getElementById('cameraStream');
        const flipBtn = document.getElementById('flipBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');

        let useFrontCamera = true;
        let mediaRecorder;
        let recordedChunks = [];
        let currentStream;

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (error) {
                alert("Camera or Microphone error: " + error);
            }
        }

        flipBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        recordBtn.addEventListener('click', () => {
            recordedChunks = [];
            try {
                let options = { mimeType: 'video/webm;codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = {};
                }

                mediaRecorder = new MediaRecorder(currentStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const videoURL = URL.createObjectURL(blob);
                    downloadLink.href = videoURL;
                    downloadLink.style.display = 'block';
                };

                mediaRecorder.start();
                recordBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                downloadLink.style.display = 'none';
            } catch (err) {
                alert("Recording failed to start: " + err);
            }
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            stopBtn.style.display = 'none';
            recordBtn.style.display = 'inline-block';
        });

        startCamera();
    </script>

</body>
</html>
