<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AR Face Mask Studio</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            outline: none;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }
        .btn.recording {
            background: rgba(220, 20, 60, 0.9);
            border-color: #ff4d4d;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            background: rgba(15, 15, 15, 0.85);
            padding: 12px 16px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            z-index: 100;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .slider-group {
            margin-bottom: 6px;
        }
        .slider-group:last-child {
            margin-bottom: 0;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 2px;
            color: #bbb;
        }
        .slider-group input {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
            height: 4px;
        }
        #status-msg {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #00ff88;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/libs/fflate.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="status-msg">Initializing AR Camera...</div>
    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="top-bar">
        <button class="btn" id="import-btn">Import 3D</button>
        <button class="btn" id="flip-cam-btn">Flip Cam</button>
        <button class="btn" id="record-btn">Record Video</button>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label><span>Mask Scale</span></label>
            <input type="range" id="scale-slider" min="0.2" max="4" step="0.05" value="1.0">
        </div>
        <div class="slider-group">
            <label><span>Offset X</span></label>
            <input type="range" id="pos-x-slider" min="-1.5" max="1.5" step="0.01" value="0">
        </div>
