<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz 3D Face Filter Studio - Fixed Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #video-element { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .btn {
            background: rgba(0, 0, 0, 0.8); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 16px; font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        input[type="file"] { display: none; }

        /* Control Panel for 3D Position & Rotation */
        #control-panel {
            position: absolute; right: 12px; top: 70px;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3); padding: 10px;
            border-radius: 12px; display: flex; flex-direction: column; gap: 8px; width: 180px;
            max-height: 75vh; overflow-y: auto;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 3px; color: #00ff88; font-size: 10px; font-weight: bold; }
        .ctrl-group .btn-row { display: flex; gap: 4px; }
        .ctrl-group button { flex: 1; background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .ctrl-group button:active { background: #ff0055; }

        /* Bottom Filter/Model Switcher Dock */
        .bottom-dock {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 35px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .filter-switcher { display: flex; gap: 8px; align-items: center; }
        .filter-thumb {
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5);
            background-size: cover; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: bold; background-color: #222; transition: 0.2s;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }
        #launch-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 15px 35px; border-radius: 30px; margin-top: 20px; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>Aziz 3D Face Studio (Fixed)</h2>
        <p>Tap below to start AR Experience safely</p>
        <button id="launch-btn">START AR APP</button>
        <p id="error-box" style="color: #ff4444; font-size: 12px; margin-top: 15px;"></p>
    </div>

    <video id="video-element" autoplay playsinline muted></video>
    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <div class="top-nav">
            <button id="flip-cam" class="btn interactive">🔄 Flip</button>
            <button id="take-snap" class="btn interactive">📸 Snap</button>
        </div>

        <div id="control-panel" class="interactive">
            <div class="ctrl-group" style="background: rgba(0,255,136,0.1); padding: 4px; border-radius: 4px; border: 1px solid #00ff88;">
                <span>DEPTH (BACK / FRONT)</span>
                <div class="btn-row">
                    <button onclick="adjust('posZ', -0.05)" style="background:#ff0055;">◀ BACK</button>
                    <button onclick="adjust('posZ', 0.05)" style="background:#00ff88; color:#000;">FRONT ▶</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>SCALE / SIZE</span>
                <div class="btn-row">
                    <button onclick="adjust('scale', -0.05)">-</button>
                    <button onclick="adjust('scale', 0.05)">+</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>MOVE (X / Y)</span>
                <div class="btn-row">
                    <button onclick="adjust('posX', -0.02)">L</button>
                    <button onclick="adjust('posX', 0.02)">R</button>
                    <button onclick="adjust('posY', -0.02)">D</button>
                    <button onclick="adjust('posY', 0.02)">U</button>
                </div>
            </div>

            <div class="ctrl-group" style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px;">
                <span>ROTATE Y (LEFT/RIGHT)</span>
                <div class="btn-row">
                    <button onclick="adjust('rotY', -0.2)">↺</button>
                    <button onclick="adjust('rotY', 0.2)">↻</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>ROTATE X (TILT)</span>
                <div class="btn-row">
                    <button onclick="adjust('rotX', -0.2)">▲</button>
                    <button onclick="adjust('rotX', 0.2)">▼</button>
                </div>
            </div>

            <div class="ctrl-group">
                <span>ROTATE Z (ROLL)</span>
                <div class="btn-row">
                    <button onclick="adjust('rotZ', -0.2)">◄</button>
                    <button onclick="adjust('rotZ', 0.2)">►</button>
                </div>
            </div>
        </div>

        <div class="bottom-dock interactive">
            <div class="filter-switcher">
                <div class="filter-thumb" onclick="setPresetModel('sphere')" title="Sphere">🟢</div>
                <div class="filter-thumb" onclick="setPresetModel('cube')" title="Cube">🧊</div>
                <div class="filter-thumb" onclick="setPresetModel('pyramid')" title="Pyramid">🔺</div>
            </div>
            <label class="btn" for="import-file" style="background:#333; cursor:pointer; padding: 8px 12px; font-size: 12px;">📁 Custom 3D</label>
            <input type="file" id="import-file" accept=".obj,.gltf,.glb">
            <button class="btn" onclick="resetModel()" style="background:#444; padding: 8px 12px; font-size: 12px;">🎯 Reset</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        let scene, camera, renderer, videoEl, mediaStream;
        let faceMesh, mpCamera;
        let currentModel = null;
        let useFront = true;
        let isTrackingActive = false;

        let modelParams = {
            scale: 1.2,
            posX: 0.0,
            posY: 0.1,
            posZ: 0.0,
            rotX: 0.0,
            rotY: 0.0,
            rotZ: 0.0
        };

        document.getElementById('launch-btn').addEventListener('click', async () => {
            const errBox = document.getElementById('error-box');
            errBox.innerText = "Starting Camera and Modules...";
            try {
                await startCamera();
                document.getElementById('start-screen').style.display = 'none';
                initThreeJS();
                initTracking();
            } catch (err) {
                console.error(err);
                errBox.innerText = "Error: " + err.message + ". Please use HTTPS or Localhost.";
            }
        });

        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            videoEl = document.getElementById('video-element');
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        }

        document.getElementById('flip-cam').addEventListener('click', async () => {
            useFront = !useFront;
            try { 
                if(mpCamera) { await mpCamera.stop(); }
                await startCamera(); 
                if(mpCamera) { mpCamera.start(); }
            } catch(e) { 
                alert("Camera flip error: " + e.message); 
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            // Safe & Bright Studio Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 2.5));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight1.position.set(0, 10, 10);
            scene.add(dirLight1);
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight2.position.set(0, -10, -10);
            scene.add(dirLight2);

            // Load default preset safely
            setPresetModel('sphere');
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('import-file').addEventListener('change', loadImportedModel);
            document.getElementById('take-snap').addEventListener('click', takeSnapshot);

            animateLoop();
        }

        function setPresetModel(type) {
            if (currentModel) scene.remove(currentModel);
            let geo, mat;
            if (type === 'sphere') {
                geo = new THREE.SphereGeometry(0.6, 32, 32);
                mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });
            } else if (type === 'cube') {
                geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                mat = new THREE.MeshStandardMaterial({ color: 0x00aaff, roughness: 0.2, metalness: 0.5 });
            } else if (type === 'pyramid') {
                geo = new THREE.ConeGeometry(0.7, 1.0, 4);
                mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.2, metalness: 0.8 });
            }
            currentModel = new THREE.Mesh(geo, mat);
            scene.add(currentModel);
            resetModel();
        }

        function initTracking() {
            if (typeof FaceMesh === 'undefined') {
                alert("MediaPipe FaceMesh failed to load from CDN.");
                return;
            }

            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && currentModel) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1];
                    const leftEye = lm[234];
                    const rightEye = lm[454];

                    const targetX = -(nose.x - 0.5) * 3.5 + modelParams.posX;
                    const targetY = -(nose.y - 0.5) * 3.5 + modelParams.posY;
                    const targetZ = nose.z * 1.2 + modelParams.posZ;

                    currentModel.position.x += (targetX - currentModel.position.x) * 0.4;
                    currentModel.position.y += (targetY - currentModel.position.y) * 0.4;
                    currentModel.position.z += (targetZ - currentModel.position.z) * 0.4;

                    const dx = rightEye.x - leftEye.x;
                    const dy = rightEye.y - leftEye.y;
                    const faceRotZ = Math.atan2(dy, dx);
                    const dz = rightEye.z - leftEye.z;
                    const faceRotY = Math.asin(Math.max(-1, Math.min(1, dz * 2.0)));

                    currentModel.rotation.set(
                        modelParams.rotX, 
                        faceRotY + modelParams.rotY, 
                        faceRotZ + modelParams.rotZ
                    );
                    currentModel.scale.set(modelParams.scale, modelParams.scale, modelParams.scale);
                    currentModel.visible = true;
                }
            });

            mpCamera = new Camera(videoEl, {
                onFrame: async () => {
                    if (videoEl && videoEl.readyState >= 2) {
                        try {
                            await faceMesh.send({ image: videoEl });
                        } catch (err) {
                            console.warn("Frame skip warning:", err);
                        }
                    }
                },
                width: 1280,
                height: 720
            });
            mpCamera.start();
        }

        function adjust(type, val) {
            modelParams[type] += val;
        }

        function resetModel() {
            modelParams.scale = 1.2;
            modelParams.posX = 0.0;
            modelParams.posY = 0.1;
            modelParams.posZ = 0.0;
            modelParams.rotX = 0.0;
            modelParams.rotY = 0.0;
            modelParams.rotZ = 0.0;
        }

        function loadImportedModel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = (evt) => {
                    const loader = new THREE.OBJLoader();
                    try {
                        const obj = loader.parse(evt.target.result);
                        fixTexturesAndColors(obj);
                        replaceModelInScene(obj);
                    } catch(err) { alert("Failed to parse OBJ file."); }
                };
            } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = (evt) => {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(evt.target.result, '', (gltf) => {
                        fixTexturesAndColors(gltf.scene);
                        replaceModelInScene(gltf.scene);
                    }, (err) => { alert("Failed to parse GLTF/GLB file."); });
                };
            } else {
                alert("Please select a valid .obj, .gltf or .glb file.");
            }
        }

        function fixTexturesAndColors(obj) {
            obj.traverse((child) => {
                if (child.isMesh) {
                    child.material.side = THREE.DoubleSide;
                    if (child.material.map) {
                        child.material.map.encoding = THREE.sRGBEncoding;
                    }
                    child.material.needsUpdate = true;
                }
            });
        }

        function replaceModelInScene(newObj) {
            if (currentModel) scene.remove(currentModel);
            currentModel = newObj;
            resetModel();
            scene.add(currentModel);
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'aziz-fixed-snapshot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
                        </html>
