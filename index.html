<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px;
      background: rgba(0,0,0,0.78);
      border: 1px solid #777;
      border-radius: 12px;
    }

    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 7px;
      background: #252525;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    button:active {
      background: #555;
    }

    #togglePanel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10001;
      background: #d6a900;
      color: black;
    }

    #status {
      color: white;
      font-size: 12px;
      max-width: 220px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="container"></div>

  <button id="togglePanel">HIDE CONTROLS</button>

  <div id="controls">
    <button id="startCamera">START CAMERA</button>
    <button id="frontCamera">FRONT CAMERA</button>
    <button id="backCamera">BACK CAMERA</button>
    <button id="stopCamera">STOP CAMERA</button>
    <div id="status">Camera stopped</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { MindARThree } from "mindar-face-three";

    let mindarThree = null;
    let isRunning = false;
    let facingMode = "user";
    let starting = false;

    const container = document.querySelector("#container");
    const statusText = document.querySelector("#status");

    async function setupCamera() {
      if (mindarThree) return;

      mindarThree = new MindARThree({
        container: container
      });

      const scene = mindarThree.scene;

      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        1
      );

      scene.add(light);

      mindarThree.addAnchor(1);
    }

    async function startCamera() {
      if (starting || isRunning) return;

      starting = true;
      statusText.textContent = "Starting camera...";

      try {
        await setupCamera();

        await mindarThree.start({
          facingMode: facingMode
        });

        const { renderer, scene, camera } = mindarThree;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        isRunning = true;
        statusText.textContent =
          facingMode === "user"
          ? "Front camera running"
          : "Back camera running";

      } catch (error) {
        console.error(error);
        statusText.textContent =
          "Camera error: " + error.message;
      } finally {
        starting = false;
      }
    }

    async function stopCamera() {
      if (!mindarThree || !isRunning) return;

      try {
        mindarThree.renderer.setAnimationLoop(null);
        await mindarThree.stop();

        isRunning = false;
        statusText.textContent = "Camera stopped";

      } catch (error) {
        console.error(error);
        statusText.textContent =
          "Stop error: " + error.message;
      }
    }

    async function changeCamera(mode) {
      const wasRunning = isRunning;

      if (wasRunning) {
        await stopCamera();
      }

      facingMode = mode;

      if (wasRunning) {
        await startCamera();
      } else {
        statusText.textContent =
          mode === "user"
          ? "Front camera selected"
          : "Back camera selected";
      }
    }

    document.querySelector("#startCamera")
      .addEventListener("click", startCamera);

    document.querySelector("#stopCamera")
      .addEventListener("click", stopCamera);

    document.querySelector("#frontCamera")
      .addEventListener("click", () => {
        changeCamera("user");
      });

    document.querySelector("#backCamera")
      .addEventListener("click", () => {
        changeCamera("environment");
      });

    document.querySelector("#togglePanel")
      .addEventListener("click", () => {
        const panel = document.querySelector("#controls");

        panel.classList.toggle("hidden");

        document.querySelector("#togglePanel").textContent =
          panel.classList.contains("hidden")
          ? "SHOW CONTROLS"
          : "HIDE CONTROLS";
      });

  </script>

</body>
</html>
