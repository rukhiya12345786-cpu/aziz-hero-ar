<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Head Tracker</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(1);
  z-index: 1;
  background: #000;
}

#threeCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  transform: scaleX(1);
}

#status {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 20;
  max-width: calc(100% - 20px);
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 12px;
  line-height: 1.3;
}

#appControls {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.topControls {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  pointer-events: auto;
}

button,
select,
input {
  font: inherit;
}

button,
select {
  min-height: 38px;
  border: 0;
  border-radius: 8px;
  padding: 7px 10px;
  background: rgba(20,20,20,0.86);
  color: #fff;
  font-size: 12px;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.5;
}

.sideControls {
  position: absolute;
  top: 115px;
  right: 8px;
  width: 150px;
  max-width: calc(100% - 16px);
  padding: 9px;
  border-radius: 10px;
  background: rgba(0,0,0,0.68);
  pointer-events: auto;
}

.sideControls h3 {
  margin: 0 0 7px;
  font-size: 12px;
}

.controlRow {
  margin-bottom: 7px;
}

.controlRow label {
  display: block;
  margin-bottom: 2px;
  font-size: 10px;
}

.controlRow input[type="range"] {
  width: 100%;
  height: 20px;
  accent-color: #fff;
}

#showControlsButton {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 30;
  display: none;
  min-height: 36px;
  padding: 7px 11px;
  border-radius: 9px;
  background: rgba(0,0,0,0.8);
  color: #fff;
}

#import3DInput {
  display: none;
}

#modelFileInput {
  display: none;
}

.hiddenControls {
  display: none !important;
}

.fullscreenTracking #status {
  display: none;
}

@media (max-width: 600px) {

  .topControls {
    right: 90px;
  }

  button,
  select {
    min-height: 34px;
    padding: 6px 8px;
    font-size: 11px;
  }

  .sideControls {
    top: 105px;
    width: 132px;
  }

  #status {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div id="app">

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="threeCanvas"></canvas>

  <div id="status">Ready</div>

  <div id="appControls">

    <div class="topControls">

      <button id="cameraButton" type="button">
        Open Camera
      </button>

      <button id="switchCameraButton" type="button">
        Camera
      </button>

      <button id="flipCameraButton" type="button">
        Flip
      </button>

      <button id="photoButton" type="button">
        Photo
      </button>

      <button id="recordButton" type="button">
        Record
      </button>

      <button id="audioButton" type="button">
        Audio Off
      </button>

      <button id="trackingButton" type="button">
        Tracking
      </button>

      <button id="modelButton" type="button">
        3D Model
      </button>

      <button id="import3DButton" type="button">
        Import 3D
      </button>

      <button id="export3DButton" type="button">
        Export 3D
      </button>

      <select id="exportFormat">
        <option value="glb">GLB</option>
        <option value="gltf">GLTF</option>
        <option value="obj">OBJ</option>
      </select>

      <button id="resetButton" type="button">
        Reset
      </button>

      <button id="hideControlsButton" type="button">
        Hide Controls
      </button>

    </div>

    <div id="sideControls" class="sideControls">

      <h3>3D Controls</h3>

      <div class="controlRow">
        <label for="scaleSlider">Scale</label>
        <input
          id="scaleSlider"
          type="range"
          min="0.1"
          max="5"
          step="0.01"
          value="1">
      </div>

      <div class="controlRow">
        <label for="xSlider">Position X</label>
        <input
          id="xSlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0">
      </div>

      <div class="controlRow">
        <label for="ySlider">Position Y</label>
        <input
          id="ySlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0">
      </div>

      <div class="controlRow">
        <label for="zSlider">Position Z</label>
        <input
          id="zSlider"
          type="range"
          min="-5"
          max="5"
          step="0.01"
          value="0">
      </div>      <div class="controlRow">
        <label for="rotateXSlider">Rotation X</label>
        <input
          id="rotateXSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0">
      </div>

      <div class="controlRow">
        <label for="rotateYSlider">Rotation Y</label>
        <input
          id="rotateYSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0">
      </div>

      <div class="controlRow">
        <label for="rotateZSlider">Rotation Z</label>
        <input
          id="rotateZSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0">
      </div>

    </div>

  </div>

  <button
    id="showControlsButton"
    type="button">
    Show Controls
  </button>

  <input
    id="import3DInput"
    type="file"
    accept=".glb,.gltf,.obj,.stl,.fbx"
    style="display:none;">

</div>

<script
  type="module"
  src="./js/app.js?v=20260927">
</script>

</body>
</html>
