<script>

/* GLOBAL VARIABLES */

const video =
document.getElementById("cameraStream");

const canvas =
document.getElementById("threeCanvas");

const statusBox =
document.getElementById("status");

let scene;
let camera;
let renderer;

let faceMesh;
let mpCamera;

let headGroup;
let faceOccluder;

let importedModel = null;

let sizeValue = 1;
let upValue = 0;
let depthValue = 0;


/* SMOOTHING */

const smoothPosition =
new THREE.Vector3();

const smoothQuaternion =
new THREE.Quaternion();

let smoothScale = 1;

let poseStarted = false;


/* THREE.JS INIT */

function initThree(){

    scene =
    new THREE.Scene();

    camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
    );

    camera.position.set(
        0,
        0,
        3
    );

    renderer =
    new THREE.WebGLRenderer({

        canvas:canvas,

        alpha:true,

        antialias:true,

        preserveDrawingBuffer:true

    });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setClearColor(
        0x000000,
        0
    );


    /* HEAD GROUP */

    headGroup =
    new THREE.Group();

    scene.add(
        headGroup
    );


    /* LIGHT */

    const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.8
    );

    scene.add(
        ambient
    );


    const light =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    light.position.set(
        2,
        3,
        5
    );

    scene.add(
        light
    );


    const fill =
    new THREE.DirectionalLight(
        0xffffff,
        .8
    );

    fill.position.set(
        -3,
        1,
        3
    );

    scene.add(
        fill
    );


    createOccluder();


    window.addEventListener(
        "resize",
        resize
    );


    renderLoop();
}


/* RESIZE */

function resize(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* FACE OCCLUDER */

function createOccluder(){

    const geometry =
    new THREE.SphereGeometry(
        1,
        32,
        24
    );

    const material =
    new THREE.MeshBasicMaterial({

        color:0x000000,

        transparent:true,

        opacity:0,

        colorWrite:false,

        depthWrite:true,

        depthTest:true,

        side:THREE.DoubleSide

    });

    faceOccluder =
    new THREE.Mesh(
        geometry,
        material
    );

    faceOccluder.visible =
    false;

    faceOccluder.renderOrder =
    0;

    scene.add(
        faceOccluder
    );
}<script>

/* ==========================================
   MEDIAPIPE FACE TRACKING
========================================== */

function initFaceMesh(){

    faceMesh = new FaceMesh({

        locateFile:function(file){

            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

        }

    });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.55,

        minTrackingConfidence:0.55

    });


    faceMesh.onResults(
        processFace
    );


    mpCamera = new Camera(

        video,

        {

            onFrame:async function(){

                if(faceMesh){

                    await faceMesh.send({
                        image:video
                    });

                }

            },

            width:1280,

            height:720

        }

    );


    mpCamera.start();

}


/* ==========================================
   MEDIAPIPE POINT CONVERSION

   Camera is mirrored.
   X is corrected here.
========================================== */

function point(lm){

    return new THREE.Vector3(

        0.5 - lm.x,

        0.5 - lm.y,

        -lm.z

    );

}


/* ==========================================
   FACE TRACKING
========================================== */

function processFace(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        statusBox.innerText =
        "Face not detected";

        faceOccluder.visible =
        false;

        return;
    }


    const lm =
    results.multiFaceLandmarks[0];


    /* FACE LANDMARKS */

    const left =
    point(lm[234]);

    const right =
    point(lm[454]);

    const forehead =
    point(lm[10]);

    const chin =
    point(lm[152]);

    const nose =
    point(lm[1]);


    /* ======================================
       FACE CENTER
    ====================================== */

    const horizontalCenter =
    left.clone()
    .add(right)
    .multiplyScalar(0.5);


    const verticalCenter =
    forehead.clone()
    .add(chin)
    .multiplyScalar(0.5);


    /*
       TRUE HEAD CENTER
    */

    const headCenter =
    horizontalCenter.clone()
    .add(verticalCenter)
    .multiplyScalar(0.5);


    /* ======================================
       HEAD X AXIS
    ====================================== */

    let xAxis =
    right.clone()
    .sub(left)
    .normalize();


    /* ======================================
       HEAD Y AXIS
    ====================================== */

    let yAxis =
    forehead.clone()
    .sub(chin)
    .normalize();


    /* ======================================
       HEAD Z AXIS
    ====================================== */

    let zAxis =
    xAxis.clone()
    .cross(yAxis)
    .normalize();


    /*
       Make Z point toward camera/nose.
    */

    const noseVector =
    nose.clone()
    .sub(headCenter);


    if(
        zAxis.dot(noseVector) < 0
    ){

        zAxis.negate();

        xAxis.negate();

    }


    /*
       Rebuild Y axis.
    */

    yAxis =
    zAxis.clone()
    .cross(xAxis)
    .normalize();


    /* ======================================
       ROTATION MATRIX
    ====================================== */

    const matrix =
    new THREE.Matrix4();


    matrix.makeBasis(

        xAxis,

        yAxis,

        zAxis

    );


    const targetQuaternion =
    new THREE.Quaternion();


    targetQuaternion.setFromRotationMatrix(
        matrix
    );


    /* ======================================
       FACE SIZE
    ====================================== */

    const faceWidth =
    left.distanceTo(
        right
    );


    const faceHeight =
    forehead.distanceTo(
        chin
    );


    /* ======================================
       HEAD POSITION
    ====================================== */

    const worldX =
    headCenter.x * 3.3;


    const worldY =
    headCenter.y * 2.6;


    const worldZ =
    depthValue * 0.35;


    const targetPosition =
    new THREE.Vector3(

        worldX,

        worldY +
        upValue * 0.35,

        worldZ

    );


    /* ======================================
       MODEL SCALE
    ====================================== */

    let targetScale =
    faceWidth * 3.0;


    targetScale *=
    sizeValue;


    targetScale =
    THREE.MathUtils.clamp(

        targetScale,

        0.15,

        4

    );


    /* ======================================
       SMOOTH POSITION
    ====================================== */

    smoothPosition.lerp(

        targetPosition,

        0.32

    );


    /* ======================================
       SMOOTH ROTATION
    ====================================== */

    if(!poseStarted){

        smoothQuaternion.copy(
            targetQuaternion
        );

        poseStarted = true;

    }
    else{

        smoothQuaternion.slerp(

            targetQuaternion,

            0.25

        );

    }


    /* ======================================
       SMOOTH SCALE
    ====================================== */

    smoothScale +=
    (
        targetScale -
        smoothScale
    ) * 0.25;


    /* ======================================
       APPLY HEAD POSITION
    ====================================== */

    headGroup.position.copy(
        smoothPosition
    );


    headGroup.quaternion.copy(
        smoothQuaternion
    );


    headGroup.scale.setScalar(
        smoothScale
    );


    /* ======================================
       UPDATE FACE OCCLUDER
    ====================================== */

    updateOccluder(

        faceWidth,

        faceHeight,

        smoothQuaternion

    );


    statusBox.innerText =
    "HEAD TRACKING ON";

}


/* ==========================================
   FACE OCCLUDER UPDATE
========================================== */

function updateOccluder(

    faceWidth,

    faceHeight,

    quaternion

){

    faceOccluder.visible =
    true;


    faceOccluder.position.copy(
        smoothPosition
    );


    faceOccluder.quaternion.copy(
        quaternion
    );


    /*
       Face/head depth volume.
    */

    faceOccluder.scale.set(

        faceWidth * 2.1,

        faceHeight * 1.55,

        faceWidth * 1.35

    );


    /*
       Small camera-side offset.
    */

    const offset =
    new THREE.Vector3(

        0,

        0,

        0.015

    );


    offset.applyQuaternion(
        quaternion
    );


    faceOccluder.position.add(
        offset
    );

}


/* ==========================================
   RENDER LOOP
========================================== */

function renderLoop(){

    requestAnimationFrame(
        renderLoop
    );


    if(renderer){

        renderer.render(
            scene,
            camera
        );

    }

/* ==========================================
   MATERIAL SETUP
========================================== */

function setupMaterial(material){

    if(!material) return;

    material.side =
        THREE.DoubleSide;

    material.depthTest =
        true;

    material.depthWrite =
        true;

    material.needsUpdate =
        true;

}


/* ==========================================
   PREPARE 3D MODEL
========================================== */

function prepareModel(object){

    if(!object) return;


    /* REMOVE OLD MODEL */

    if(importedModel){

        headGroup.remove(
            importedModel
        );

        importedModel = null;

    }


    importedModel =
        object;


    /* ======================================
       SET MODEL MATERIALS
    ====================================== */

    importedModel.traverse(

        function(child){

            if(!child.isMesh){

                return;

            }


            if(child.material){

                if(
                    Array.isArray(
                        child.material
                    )
                ){

                    child.material.forEach(
                        setupMaterial
                    );

                }
                else{

                    setupMaterial(
                        child.material
                    );

                }

            }


            /*
               Occluder renders first.
               Character renders after it.
            */

            child.renderOrder =
                1;

        }

    );


    /* ======================================
       FIND MODEL BOUNDING BOX
    ====================================== */

    let box =
        new THREE.Box3()
        .setFromObject(
            importedModel
        );


    let size =
        box.getSize(
            new THREE.Vector3()
        );


    let center =
        box.getCenter(
            new THREE.Vector3()
        );


    const maxDimension =
        Math.max(

            size.x,

            size.y,

            size.z

        );


    /* ======================================
       NORMALIZE MODEL SIZE
    ====================================== */

    if(maxDimension > 0){

        importedModel.scale.setScalar(

            1.8 /
            maxDimension

        );

    }


    /* ======================================
       RECALCULATE CENTER
    ====================================== */

    box =
        new THREE.Box3()
        .setFromObject(
            importedModel
        );


    center =
        box.getCenter(
            new THREE.Vector3()
        );


    /*
       IMPORTANT:

       Model center is placed exactly
       at headGroup origin.

       headGroup = user's head.
    */

    importedModel.position.x -=
        center.x;


    importedModel.position.y -=
        center.y;


    importedModel.position.z -=
        center.z;


    /*
       Tiny vertical correction.
    */

    importedModel.position.y +=
        0.02;


    /*
       NO forward offset.
    */

    importedModel.position.z +=
        0;


    /* ======================================
       ADD MODEL TO HEAD
    ====================================== */

    headGroup.add(
        importedModel
    );


    /* ======================================
       RESET POSE
    ====================================== */

    poseStarted =
        false;


    smoothPosition.set(
        0,
        0,
        0
    );


    smoothQuaternion.identity();


    smoothScale =
        1;


    statusBox.innerText =
        "3D MODEL READY";

}


/* ==========================================
   GLB / GLTF LOADER
========================================== */

function loadGLTF(file){

    const loader =
        new THREE.GLTFLoader();


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        try{

            loader.parse(

                event.target.result,

                "",

                function(gltf){

                    prepareModel(
                        gltf.scene
                    );

                },

                function(error){

                    console.error(
                        error
                    );

                    statusBox.innerText =
                        "GLB / GLTF ERROR";

                }

            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
                "MODEL ERROR";

        }

    };


    reader.readAsArrayBuffer(
        file
    );

}


/* ==========================================
   OBJ LOADER
========================================== */

function loadOBJ(file){

    const loader =
        new THREE.OBJLoader();


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        try{

            const object =
                loader.parse(
                    event.target.result
                );


            prepareModel(
                object
            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
                "OBJ ERROR";

        }

    };


    reader.readAsText(
        file
    );

}


/* ==========================================
   FBX LOADER
========================================== */

function loadFBX(file){

    const loader =
        new THREE.FBXLoader();


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        try{

            const object =
                loader.parse(

                    event.target.result,

                    ""

                );


            prepareModel(
                object
            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
                "FBX ERROR";

        }

    };


    reader.readAsArrayBuffer(
        file
    );

}


/* ==========================================
   FILE IMPORT
========================================== */

document
.getElementById("fileInput")
.addEventListener(

    "change",

    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        const filename =
            file.name.toLowerCase();


        statusBox.innerText =
            "Loading 3D model...";


        /* GLB / GLTF */

        if(

            filename.endsWith(".glb") ||

            filename.endsWith(".gltf")

        ){

            loadGLTF(
                file
            );

            return;

        }


        /* OBJ */

        if(
            filename.endsWith(".obj")
        ){

            loadOBJ(
                file
            );

            return;

        }


        /* FBX */

        if(
            filename.endsWith(".fbx")
        ){

            loadFBX(
                file
            );

            return;

        }


        statusBox.innerText =
            "Unsupported 3D format";

    }

);

            statusBox.innerText =
            "FBX ERROR";

        }

    };


    reader.readAsArrayBuffer(
        file
    );

}


/* ==========================================
   IMPORT FILE
========================================== */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(event){

        const file =
        event.target.files[0];


        if(!file)
            return;


        const filename =
        file.name.toLowerCase();


        statusBox.innerText =
        "Loading 3D model...";


        if(
            filename.endsWith(".glb") ||
            filename.endsWith(".gltf")
        ){

            loadGLTF(
                file
            );

            return;

        }


        if(
            filename.endsWith(".obj")
        ){

            loadOBJ(
                file
            );

            return;

        }


        if(
            filename.endsWith(".fbx")
        ){

            loadFBX(
                file
            );

            return;

        }


        statusBox.innerText =
        "Unsupported 3D format";

    }
);

/* ==========================================
   SNAPSHOT
========================================== */

function takeSnapshot(){

    if(!renderer)
        return;


    const image =
    canvas.toDataURL(
        "image/png"
    );


    const link =
    document.createElement("a");


    link.href =
    image;


    link.download =
    "azeez-ar.png";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}


/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    try{

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        /*
           Selfie camera mirror.
        */

        video.style.transform =
        "scaleX(-1)";


        await video.play();


        statusBox.innerText =
        "Camera ready";

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "Camera permission required";

    }

}


/* ==========================================
   CAMERA FLIP
========================================== */

async function flipCamera(){

    if(video.srcObject){

        const tracks =
        video.srcObject.getTracks();


        tracks.forEach(
            function(track){

                track.stop();

            }
        );

    }


    window.cameraMode =
    window.cameraMode === "environment"
    ? "user"
    : "environment";


    const facing =
    window.cameraMode ||
    "user";


    try{

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        if(facing === "user"){

            video.style.transform =
            "scaleX(-1)";

        }
        else{

            video.style.transform =
            "scaleX(1)";

        }


        await video.play();


        statusBox.innerText =
        "Camera switched";

    }
    catch(error){

        console.error(
            error
        );

        statusBox.innerText =
        "Camera switch failed";

    }

}
