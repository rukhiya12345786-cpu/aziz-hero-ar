<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera and 3D Face Tracking</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;

    padding:16px 28px;

    font-size:20px;
    font-weight:bold;

    border:0;
    border-radius:10px;

    background:white;
    color:black;
}

#info{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);

    z-index:10;

    padding:10px 16px;

    background:rgba(0,0,0,0.7);
    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:16px;

    text-align:center;
}

</style>

</head>


<body>


<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<canvas id="three"></canvas>


<div id="info">
CAMERA READY
</div>


<button id="open">
OPEN CAMERA
</button>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


const video =
document.getElementById("camera");

const canvas =
document.getElementById("three");

const button =
document.getElementById("open");

const info =
document.getElementById("info");


/* =========================
   THREE
========================= */

const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
);

camera3D.position.z = 4;


const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    alpha:true,

    antialias:true

});


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =========================
   LIGHT
========================= */

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


/* =========================
   3D OBJECT
========================= */

const geometry =
new THREE.BoxGeometry(
    1.2,
    1.2,
    1.2
);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(
    geometry,
    material
);


scene.add(cube);


cube.visible = false;


/* =========================
   FACE TRACKER
========================= */

let faceLandmarker = null;

let tracking = false;


/* =========================
   CREATE FACE TRACKER
========================= */

async function createFaceTracker(){

    info.innerText =
    "LOADING FACE TRACKER";


    const vision =
    await FilesetResolver.forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(

        vision,

        {

            baseOptions:{

                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"

            },


            runningMode:"VIDEO",


            numFaces:1,


            minFaceDetectionConfidence:0.5,


            minFacePresenceConfidence:0.5,


            minTrackingConfidence:0.5,


            outputFaceBlendshapes:false,


            outputFacialTransformationMatrixes:true

        }

    );


    tracking = true;

    info.innerText =
    "FACE TRACKING ON";


    trackFace();

}


/* =========================
   FACE TRACKING
========================= */

function trackFace(){

    if(!tracking){

        return;

    }


    if(
        video.readyState >= 2 &&
        faceLandmarker
    ){

        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );


        if(
            result.faceLandmarks &&
            result.faceLandmarks.length > 0
        ){

            const landmarks =
            result.faceLandmarks[0];


            let minX = 1;
            let maxX = 0;

            let minY = 1;
            let maxY = 0;


            for(
                const point of landmarks
            ){

                minX =
                Math.min(
                    minX,
                    point.x
                );


                maxX =
                Math.max(
                    maxX,
                    point.x
                );


                minY =
                Math.min(
                    minY,
                    point.y
                );


                maxY =
                Math.max(
                    maxY,
                    point.y
                );

            }


            const centerX =
            (minX + maxX) / 2;


            const centerY =
            (minY + maxY) / 2;


            /* FACE POSITION */

            cube.position.x =
            (centerX - 0.5) * 5;


            cube.position.y =
            -(centerY - 0.5) * 3.5;


            /* FACE SIZE */

            const faceWidth =
            maxX - minX;


            const size =
            Math.max(
                0.45,
                faceWidth * 4
            );


            cube.scale.set(
                size,
                size,
                size
            );


            /* REAL FACE ROTATION */

            if(
                result.facialTransformationMatrixes &&
                result.facialTransformationMatrixes.length > 0
            ){

                const matrixData =
                result
                .facialTransformationMatrixes[0]
                .data;


                const matrix =
                new THREE.Matrix4();


                matrix.fromArray(
                    matrixData
                );


                const position =
                new THREE.Vector3();


                const quaternion =
                new THREE.Quaternion();


                const scale =
                new THREE.Vector3();


                matrix.decompose(
                    position,
                    quaternion,
                    scale
                );


                cube.quaternion.copy(
                    quaternion
                );

            }


            cube.visible = true;


            info.innerText =
            "FACE TRACKING ON";


        }
        else{

            cube.visible = false;


            info.innerText =
            "NO FACE";

        }

    }


    renderer.render(
        scene,
        camera3D
    );


    requestAnimationFrame(
        trackFace
    );

}


/* =========================
   CAMERA
========================= */

button.onclick =
async function(){

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        info.innerText =
        "STARTING TRACKER";


        await createFaceTracker();


    }
    catch(error){

        info.innerText =
        "ERROR";


        alert(
            "ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        camera3D.aspect =
        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
