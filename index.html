<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AZEEZ AI AR STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c16;color:#fff;font:14px Arial,sans-serif}
header{padding:14px;text-align:center;background:#14213a;color:#70c5ff;font-size:20px;font-weight:bold}
#studio{max-width:1100px;margin:auto;padding:10px}
#cameraStage{position:relative;height:55vh;min-height:270px;background:#000;overflow:hidden;border:1px solid #30435f;border-radius:10px}
#cameraVideo,#faceCanvas,#threeCanvas{position:absolute;inset:0;width:100%;height:100%}
#cameraVideo{object-fit:contain;z-index:1}
#faceCanvas{z-index:2;pointer-events:none}
#threeCanvas{z-index:3}
#stagePlaceholder{position:absolute;inset:0;display:grid;place-items:center;color:#9db4d5;z-index:0}
#statusText{padding:10px;color:#65ffc1}
.panel{background:#111a2b;border:1px solid #2b3b54;border-radius:9px;margin:9px 0;padding:10px}
h3{color:#79bdff;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:4px}
button,select,input{max-width:100%;padding:9px;border-radius:6px;border:1px solid #405371;background:#1c2a41;color:white;margin:2px}
button{cursor:pointer}
label{display:inline-flex;align-items:center;gap:4px;margin:4px}
.hidden{display:none!important}
#studio:fullscreen{height:100vh;max-width:none;overflow:auto;background:#080c16}
#studio:fullscreen #cameraStage{height:72vh}
small{color:#b8c8df}
</style>
</head>
<body>
<header>AZEEZ AI AR STUDIO</header>
<div id="studio">

<div id="cameraStage">
<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="faceCanvas"></canvas>
<canvas id="threeCanvas"></canvas>
<div id="stagePlaceholder">AZEEZ AR STUDIO — START CAMERA</div>
</div>
<div id="statusText">Ready</div>

<div id="controls">

<section class="panel">
<h3>Camera Controls</h3>
<div class="row">
<button id="startCameraButton">START CAMERA</button>
<button id="stopCameraButton">STOP CAMERA</button>
<button id="switchCameraButton">FRONT / BACK</button>
<button id="mirrorButton">MIRROR / FLIP</button>
<button id="fullscreenButton">FULL SCREEN</button>
<button id="landscapeButton">LANDSCAPE</button>
</div>
</section>

<section class="panel">
<h3>Face Tracking</h3>
<div class="row">
<button id="startTrackingButton">START TRACKING</button>
<button id="stopTrackingButton">STOP TRACKING</button>
<button id="dotsButton">GREEN DOTS ON/OFF</button>
<button id="hideDotsButton">HIDE DOTS</button>
<label>Faces
<select id="maxFacesButton">
<option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4" selected>4</option>
</select>
</label>
</div>
<div class="row">
<button id="leftEyeButton">LEFT EYE ANCHOR</button>
<button id="rightEyeButton">RIGHT EYE ANCHOR</button>
<button id="mouthButton">MOUTH ANCHOR</button>
<button id="headButton">HEAD ANCHOR</button>
<button id="overlayToggleButton">OVERLAYS ON/OFF</button>
</div>
<div id="person1Status">Person 1: Waiting</div>
<div id="person2Status">Person 2: Waiting</div>
<div id="person3Status">Person 3: Waiting</div>
<div id="person4Status">Person 4: Waiting</div>
</section>

<section class="panel">
<h3>Import Assets</h3>
<div class="row">
<label>3D Model
<input id="modelFileInput" type="file" accept=".glb,.gltf,.obj,.fbx">
</label>
<label>Image
<input id="imageFileInput" type="file" accept="image/*">
</label>
<label>Video
<input id="videoFileInput" type="file" accept="video/*">
</label>
</div>
<small>Supported 3D formats: GLB, GLTF, OBJ and FBX.</small>
</section>

<section class="panel">
<h3>3D Gizmos</h3>
<div class="row">
<button id="moveGizmoButton">MOVE</button>
<button id="rotateGizmoButton">ROTATE</button>
<button id="scaleGizmoButton">SCALE</button>
<button id="hideGizmoButton">HIDE GIZMO</button>
<button id="resetTransformButton">RESET TRANSFORM</button>
<button id="removeAssetButton">REMOVE SELECTED</button>
</div>
</section>

<section class="panel">
<h3>Person Filters</h3>
<div class="row">
<label>Person 1
<select id="person1Filter"><option value="none">None</option><option value="mask">Mask</option><option value="helmet">Helmet</option><option value="animal">Animal</option><option value="imported">Imported Model</option></select>
</label>
<label>Person 2
<select id="person2Filter"><option value="none">None</option><option value="mask">Mask</option><option value="helmet">Helmet</option><option value="animal">Animal</option><option value="imported">Imported Model</option></select>
</label>
<label>Person 3
<select id="person3Filter"><option value="none">None</option><option value="mask">Mask</option><option value="helmet">Helmet</option><option value="animal">Animal</option><option value="imported">Imported Model</option></select>
</label>
<label>Person 4
<select id="person4Filter"><option value="none">None</option><option value="mask">Mask</option><option value="helmet">Helmet</option><option value="animal">Animal</option><option value="imported">Imported Model</option></select>
</label>
</div>
<div class="row">
<button id="sameFilterButton">SAME FILTER</button>
<button id="differentFilterButton">DIFFERENT FILTERS</button>
</div>
</section>

<section class="panel">
<h3>Recording</h3>
<div class="row">
<button id="recordButton">RECORD</button>
<button id="stopRecordButton">STOP RECORDING</button>
<button id="downloadVideoButton">DOWNLOAD VIDEO</button>
<label>Resolution
<select id="recordResolution"><option value="720">720p</option><option value="1080">1080p</option></select>
</label>
<label>Bitrate
<select id="recordBitrate"><option value="2500000">Standard</option><option value="5000000">High</option></select>
</label>
<label><input id="recordAudio" type="checkbox">Audio if available</label>
</div>
<video id="recordingPreview" class="hidden" controls playsinline style="width:100%;max-height:250px"></video>
</section>

<section class="panel">
<h3>Interface & Export</h3>
<div class="row">
<button id="hideControlsButton">HIDE CONTROLS</button>
<button id="showControlsButton" class="hidden">SHOW CONTROLS</button>
<button id="exportSettingsButton">EXPORT SETTINGS</button>
<button id="exportProjectButton">EXPORT PROJECT INFO</button>
<button id="exportModelButton">EXPORT MODEL INFO</button>
<button id="resetAllButton">RESET ALL</button>
</div>
</section>

</div>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import {GLTFLoader} from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import {OBJLoader} from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
import {FBXLoader} from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FBXLoader.js";
import {TransformControls} from "https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js";
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const $=id=>document.getElementById(id);
const studio=$("studio"),stage=$("cameraStage");
const video=$("cameraVideo"),faceCanvas=$("faceCanvas");
const ctx=faceCanvas.getContext("2d"),status=$("statusText");
const placeholder=$("stagePlaceholder");
let stream=null,facing="user",mirrored=true;
let tracking=false,dots=true,overlayVisible=true;
let landmarker=null,raf=0,lastTime=-1,faceResults=null;
let currentAnchor="head",recorder=null,recordedChunks=[],recordingURL=null;
let recordCanvas=null,recordContext=null,recordAnimation=0,recordStream=null;
let assets=[],selected=null,gizmoVisible=true,gizmoMode="translate";
let sharedFilter=false;

const setStatus=t=>status.textContent=t;

function fitCanvases(){
 const w=stage.clientWidth,h=stage.clientHeight;
 const d=Math.min(window.devicePixelRatio||1,2);
 faceCanvas.width=Math.max(1,Math.round(w*d));
 faceCanvas.height=Math.max(1,Math.round(h*d));
 faceCanvas.style.width=w+"px";
 faceCanvas.style.height=h+"px";
 ctx.setTransform(d,0,0,d,0,0);
 if(renderer){
  renderer.setPixelRatio(d);
  renderer.setSize(w,h,false);
  camera3D.aspect=w/Math.max(h,1);
  camera3D.updateProjectionMatrix();
 }
}
window.addEventListener("resize",fitCanvases);

async function startCamera(){
 stopCamera();
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},
   audio:$("recordAudio").checked
  });
  video.srcObject=stream;
  await video.play();
  placeholder.classList.add("hidden");
  fitCanvases();
  setStatus("Camera running");
 }catch(e){
  stream=null;
  setStatus("Camera error: "+e.message);
 }
}

function stopCamera(){
 tracking=false;
 cancelAnimationFrame(raf);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 ctx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
 placeholder.classList.remove("hidden");
 setStatus("Camera stopped");
}

async function switchCamera(){
 facing=facing==="user"?"environment":"user";
 await startCamera();
}

async function setupTracker(){
 if(landmarker)return;
 setStatus("Loading face tracking model...");
 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
 );
 landmarker=await FaceLandmarker.createFromOptions(vision,{
  baseOptions:{
   modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
   delegate:"GPU"
  },
  runningMode:"VIDEO",
  numFaces:Number($("maxFacesButton").value),
  outputFaceBlendshapes:true,
  outputFacialTransformationMatrixes:true
 });
 setStatus("Face tracking ready");
}

async function startTracking(){
 if(!stream){setStatus("Start camera first");return;}
 try{
  await setupTracker();
  tracking=true;
  lastTime=-1;
  trackLoop();
 }catch(e){
  setStatus("Tracking error: "+e.message);
 }
}

function trackLoop(){
 if(!tracking||!stream)return;
 if(video.readyState>=2&&video.currentTime!==lastTime){
  lastTime=video.currentTime;
  try{
   faceResults=landmarker.detectForVideo(video,performance.now());
   drawFaces(faceResults);
   updatePeople(faceResults);
  }catch(e){
   tracking=false;
   setStatus("Tracking failed: "+e.message);
  }
 }
 if(tracking)raf=requestAnimationFrame(trackLoop);
}

function drawFaces(results){
 const w=stage.clientWidth,h=stage.clientHeight;
 ctx.clearRect(0,0,w,h);
 if(!dots||!overlayVisible||!results?.faceLandmarks)return;

 const vw=video.videoWidth||1,vh=video.videoHeight||1;
 const scale=Math.min(w/vw,h/vh);
 const dw=vw*scale,dh=vh*scale;
 const ox=(w-dw)/2,oy=(h-dh)/2;
 ctx.fillStyle="#00ff68";

 for(const face of results.faceLandmarks){
  for(const p of face){
   let x=ox+p.x*dw,y=oy+p.y*dh;
   if(mirrored)x=w-x;
   ctx.beginPath();
   ctx.arc(x,y,2,0,Math.PI*2);
   ctx.fill();
  }
 }
}

function updatePeople(results){
 const count=results?.faceLandmarks?.length||0;
 for(let i=1;i<=4;i++){
  $("person"+i+"Status").textContent=
   "Person "+i+": "+(i<=count?"Face detected":"Waiting");
 }
}

$("startCameraButton").onclick=startCamera;
$("stopCameraButton").onclick=stopCamera;
$("switchCameraButton").onclick=switchCamera;
$("mirrorButton").onclick=()=>{
 mirrored=!mirrored;
 video.style.transform=mirrored?"scaleX(-1)":"none";
 drawFaces(faceResults);
};
$("startTrackingButton").onclick=startTracking;
$("stopTrackingButton").onclick=()=>{
 tracking=false;
 cancelAnimationFrame(raf);
 ctx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
 setStatus("Tracking stopped");
};
$("dotsButton").onclick=()=>{
 dots=!dots;
 drawFaces(faceResults);
 setStatus("Green dots "+(dots?"on":"off"));
};
$("hideDotsButton").onclick=()=>{
 dots=false;
 ctx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
};
$("maxFacesButton").onchange=async()=>{
 if(landmarker){
  landmarker.close();
  landmarker=null;
 }
 if(tracking){
  tracking=false;
  cancelAnimationFrame(raf);
  await startTracking();
 }
};
$("fullscreenButton").onclick=async()=>{
 try{
  if(!document.fullscreenElement)await studio.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){setStatus("Fullscreen unavailable: "+e.message);}
};
$("landscapeButton").onclick=async()=>{
 try{
  if(screen.orientation?.lock)await screen.orientation.lock("landscape");
  else setStatus("Rotate your phone to landscape");
 }catch(e){setStatus("Rotate your phone to landscape manually");}
};
$("leftEyeButton").onclick=()=>{currentAnchor="leftEye";setStatus("Left eye anchor selected");};
$("rightEyeButton").onclick=()=>{currentAnchor="rightEye";setStatus("Right eye anchor selected");};
$("mouthButton").onclick=()=>{currentAnchor="mouth";setStatus("Mouth anchor selected");};
$("headButton").onclick=()=>{currentAnchor="head";setStatus("Head anchor selected");};
$("overlayToggleButton").onclick=()=>{
 overlayVisible=!overlayVisible;
 faceCanvas.style.visibility=overlayVisible?"visible":"hidden";
};

/* 3D scene */
const threeCanvas=$("threeCanvas");
const renderer=new THREE.WebGLRenderer({
 canvas:threeCanvas,alpha:true,antialias:true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(stage.clientWidth,stage.clientHeight,false);
renderer.setClearColor(0x000000,0);

const scene=new THREE.Scene();
const camera3D=new THREE.PerspectiveCamera(
 45,stage.clientWidth/Math.max(stage.clientHeight,1),0.01,1000
);
camera3D.position.set(0,0,5);
scene.add(new THREE.HemisphereLight(0xffffff,0x526080,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(2,4,5);
scene.add(light);

const root=new THREE.Group();
scene.add(root);

const gltfLoader=new GLTFLoader();
const objLoader=new OBJLoader();
const fbxLoader=new FBXLoader();
const transform=new TransformControls(camera3D,renderer.domElement);
scene.add(transform.getHelper());

transform.addEventListener("dragging-changed",e=>{
 if(e.value)renderer.domElement.style.cursor="grabbing";
 else renderer.domElement.style.cursor="default";
});

function render3D(){
 requestAnimationFrame(render3D);
 renderer.render(scene,camera3D);
}
render3D();

function selectAsset(obj){
 selected=obj;
 transform.detach();
 if(selected&&gizmoVisible)transform.attach(selected);
}

function fitObject(object){
 const box=new THREE.Box3().setFromObject(object);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 object.position.sub(center);
 const max=Math.max(size.x,size.y,size.z);
 if(Number.isFinite(max)&&max>0){
  object.scale.multiplyScalar(2/max);
 }
 object.position.z=0;
}

async function loadModel(file){
 const url=URL.createObjectURL(file);
 try{
  const name=file.name.toLowerCase();
  let object;
  if(name.endsWith(".glb")||name.endsWith(".gltf")){
   object=await new Promise((resolve,reject)=>{
    gltfLoader.load(url,g=>resolve(g.scene),undefined,reject);
   });
  }else if(name.endsWith(".obj")){
   object=await new Promise((resolve,reject)=>{
    objLoader.load(url,resolve,undefined,reject);
   });
  }else if(name.endsWith(".fbx")){
   object=await new Promise((resolve,reject)=>{
    fbxLoader.load(url,resolve,undefined,reject);
   });
  }else{
   throw new Error("Use GLB, GLTF, OBJ or FBX");
  }
  object.name=file.name;
  fitObject(object);
  root.add(object);
  assets.push(object);
  selectAsset(object);
  setStatus("Imported "+file.name);
 }catch(e){
  setStatus("Model import error: "+e.message);
 }finally{
  URL.revokeObjectURL(url);
 }
}

$("modelFileInput").onchange=e=>{
 const file=e.target.files[0];
 if(file)loadModel(file);
 e.target.value="";
};

$("imageFileInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  const tex=new THREE.Texture(img);
  tex.needsUpdate=true;
  const material=new THREE.MeshBasicMaterial({
   map:tex,transparent:true,side:THREE.DoubleSide
  });
  const obj=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);
  obj.name=file.name;
  root.add(obj);
  assets.push(obj);
  selectAsset(obj);
  URL.revokeObjectURL(url);
 };
 img.onerror=()=>{
  URL.revokeObjectURL(url);
  setStatus("Could not load image");
 };
 img.src=url;
 e.target.value="";
};

$("videoFileInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const v=document.createElement("video");
 v.src=url;v.loop=true;v.muted=true;v.playsInline=true;
 v.onloadeddata=()=>{
  const tex=new THREE.VideoTexture(v);
  const obj=new THREE.Mesh(
   new THREE.PlaneGeometry(2,2),
   new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})
  );
  obj.name=file.name;
  root.add(obj);
  assets.push(obj);
  selectAsset(obj);
  v.play().catch(()=>{});
  setStatus("Imported video "+file.name);
 };
 v.onerror=()=>{
  URL.revokeObjectURL(url);
  setStatus("Could not load video");
 };
 e.target.value="";
};
 $("moveGizmoButton").onclick=()=>{
 gizmoMode="translate";
 transform.setMode("translate");
};
$("rotateGizmoButton").onclick=()=>{
 gizmoMode="rotate";
 transform.setMode("rotate");
};
$("scaleGizmoButton").onclick=()=>{
 gizmoMode="scale";
 transform.setMode("scale");
};
$("hideGizmoButton").onclick=()=>{
 gizmoVisible=!gizmoVisible;
 if(!gizmoVisible)transform.detach();
 else if(selected)transform.attach(selected);
};
$("resetTransformButton").onclick=()=>{
 if(!selected)return;
 selected.position.set(0,0,0);
 selected.rotation.set(0,0,0);
 selected.scale.set(1,1,1);
};
$("removeAssetButton").onclick=()=>{
 if(!selected)return;
 transform.detach();
 root.remove(selected);
 selected=null;
 assets=assets.filter(a=>a!==selected);
 setStatus("Selected object removed");
};

/* Filter selectors */
$("sameFilterButton").onclick=()=>{
 sharedFilter=true;
 const value=$("person1Filter").value;
 for(let i=2;i<=4;i++)$("person"+i+"Filter").value=value;
 setStatus("Same filter selected");
};
$("differentFilterButton").onclick=()=>{
 sharedFilter=false;
 setStatus("Choose each person's filter separately");
};
for(let i=1;i<=4;i++){
 $("person"+i+"Filter").onchange=()=>{
  if(sharedFilter&&i===1){
   for(let j=2;j<=4;j++)$("person"+j+"Filter").value=$("person1Filter").value;
  }
 };
}

/* Hide and show the controls */
$("hideControlsButton").onclick=()=>{
 $("controls").classList.add("hidden");
 $("showControlsButton").classList.remove("hidden");
};
$("showControlsButton").onclick=()=>{
 $("controls").classList.remove("hidden");
 $("showControlsButton").classList.add("hidden");
};

/* Record a composite of camera, landmarks and 3D canvas */
function drawRecordingFrame(){
 if(!recorder||recorder.state!=="recording")return;
 const w=recordCanvas.width,h=recordCanvas.height;
 recordContext.fillStyle="#000";
 recordContext.fillRect(0,0,w,h);

 if(video.readyState>=2){
  const vw=video.videoWidth||w,vh=video.videoHeight||h;
  const scale=Math.min(w/vw,h/vh);
  const dw=vw*scale,dh=vh*scale;
  const x=(w-dw)/2,y=(h-dh)/2;
  if(mirrored){
   recordContext.save();
   recordContext.translate(w,0);
   recordContext.scale(-1,1);
   recordContext.drawImage(video,x,y,dw,dh);
   recordContext.restore();
  }else{
   recordContext.drawImage(video,x,y,dw,dh);
  }
 }
 if(overlayVisible){
  recordContext.drawImage(faceCanvas,0,0,w,h);
 }
 recordContext.drawImage(threeCanvas,0,0,w,h);
 recordAnimation=requestAnimationFrame(drawRecordingFrame);
}

$("recordButton").onclick=()=>{
 if(!stream){setStatus("Start camera before recording");return;}
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
  setStatus("Recording is not supported by this browser");
  return;
 }
 try{
  recordedChunks=[];
  const height=Number($("recordResolution").value);
  const width=Math.round(height*16/9);
  recordCanvas=document.createElement("canvas");
  recordCanvas.width=width;
  recordCanvas.height=height;
  recordContext=recordCanvas.getContext("2d");
  recordStream=recordCanvas.captureStream(30);

  const options={videoBitsPerSecond:Number($("recordBitrate").value)};
  if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")){
   options.mimeType="video/webm;codecs=vp9";
  }else if(MediaRecorder.isTypeSupported("video/webm")){
   options.mimeType="video/webm";
  }

  recorder=new MediaRecorder(recordStream,options);
  recorder.ondataavailable=e=>{
   if(e.data&&e.data.size)recordedChunks.push(e.data);
  };
  recorder.onerror=e=>{
   setStatus("Recording error: "+(e.error?.message||"unknown error"));
  };
  recorder.onstop=()=>{
   cancelAnimationFrame(recordAnimation);
   const blob=new Blob(recordedChunks,{type:recorder.mimeType||"video/webm"});
   if(recordingURL)URL.revokeObjectURL(recordingURL);
   recordingURL=URL.createObjectURL(blob);
   const preview=$("recordingPreview");
   preview.src=recordingURL;
   preview.classList.remove("hidden");
   if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
   setStatus("Recording ready to download");
  };
  recorder.start(250);
  drawRecordingFrame();
  setStatus("Recording...");
 }catch(e){
  setStatus("Recording error: "+e.message);
 }
};

$("stopRecordButton").onclick=()=>{
 if(recorder&&recorder.state!=="inactive")recorder.stop();
};
$("downloadVideoButton").onclick=()=>{
 if(!recordingURL){setStatus("Record a video first");return;}
 const a=document.createElement("a");
 a.href=recordingURL;
 a.download="azeez-ar-recording.webm";
 document.body.appendChild(a);
 a.click();
 a.remove();
};

/* Export */
function downloadJSON(name,data){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;
 document.body.appendChild(a);
 a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("exportSettingsButton").onclick=()=>{
 downloadJSON("azeez-settings.json",{
  facing,mirrored,dots,tracking,
  maxFaces:$("maxFacesButton").value,
  filters:[1,2,3,4].map(i=>$("person"+i+"Filter").value),
  anchor:currentAnchor,gizmoMode
 });
};
$("exportProjectButton").onclick=()=>{
 downloadJSON("azeez-project-info.json",{
  app:"AZEEZ AI AR STUDIO",
  assets:assets.map(a=>a.name||"Imported asset"),
  filters:[1,2,3,4].map(i=>$("person"+i+"Filter").value)
 });
};
$("exportModelButton").onclick=()=>{
 downloadJSON("azeez-model-info.json",{
  models:assets.map(a=>({
   name:a.name,
   position:a.position.toArray(),
   rotation:a.rotation.toArray(),
   scale:a.scale.toArray()
  }))
 });
};

/* Reset */
$("resetAllButton").onclick=()=>{
 stopCamera();
 if(landmarker){landmarker.close();landmarker=null;}
 transform.detach();
 for(const asset of assets)root.remove(asset);
 assets=[];
 selected=null;
 for(let i=1;i<=4;i++)$("person"+i+"Filter").value="none";
 dots=true;mirrored=true;facing="user";
 overlayVisible=true;sharedFilter=false;
 faceCanvas.style.visibility="visible";
 video.style.transform="scaleX(-1)";
 ctx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
 setStatus("Studio reset");
};

window.addEventListener("beforeunload",()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());
 if(landmarker)landmarker.close();
 if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
 if(recordingURL)URL.revokeObjectURL(recordingURL);
});
fitCanvases();
setStatus("Studio loaded — start camera");


</script>
</body>
</html>
