<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aziz AR Ultimate Studio</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; transform: scaleX(-1); }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        /* UI Layer - Ensures everything stays on top and clickable */
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 10px;
        }

        .clickable { pointer-events: auto; }

        .top-panel { display: flex; justify-content: space-between; width: 100%; gap: 5px; }
        .control-box { background: rgba(0, 0, 0, 0.85); padding: 8px; border-radius: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border: 1px solid #444; }

        button, label.btn-custom {
            background: #ff0055; color: white; border: none; padding: 8px 12px;
            font-size: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center;
        }
        button:active, label.btn-custom:active { background: #cc0044; }
        input[type="file"] { display: none; }

        /* Head Adjustment Control Panel */
        #adjust-panel {
            background: rgba(0, 0, 0, 0.9); border: 1px solid #00ff88; padding: 8px;
            border-radius: 10px; width: 100%; max-width: 300px; align-self: center;
            display: flex; flex-direction: column; gap: 5px;
        }
        .adj-row { display: flex; justify-content: space-between; align-items: center; color: white; font-size: 11px; }
        .adj-row div { display: flex; gap: 4px; }
        .adj-row button { background: #222; border: 1px solid #666; padding: 4px 10px; font-size: 14px; }

        /* Bottom Recording Bar */
        .bottom-panel { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 5px; }
        #record-btn {
            background: #ff3333; width: 65px; height: 65px; border-radius: 50%;
            border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.7); cursor: pointer;
        }
        #record-btn.recording { background: #111; animation: pulse 1s infinite; border-color: #ff3333; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Permission Start Screen */
        #permission-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0b0b; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }
        #start-app-btn {
            background: #00ff88; color: #000; font-size: 18px; font-weight: bold;
            padding: 15px 30px; border-radius: 10px; margin-top: 20px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
        #error-msg { margin-top: 15px; font-size: 13px; color: #ff4444; max-width: 90%; word-break: break-all; }
    </style>
</head>
<body>

    <!-- Start Screen to bypass mobile auto-play and camera blocks -->
    <div id="permission-screen">
        <h1 style="margin: 0 0 10px 0; font-size: 22px;">Aziz AR Ultimate Studio</h1>
        <p style="margin: 0; color: #aaa; font-size: 14px;">Tap below to allow camera & mic permissions</p>
        <button id="start-app-btn">START APP NOW</button>
        <div id="error-msg"></div>
    </div>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <!-- UI Buttons Layer -->
    <div id="ui-layer">
        <!-- Top Bar: Import, Snapshot, Flip Camera -->
        <div class="top-panel">
            <div class="control-box clickable">
                <label class="btn-custom" for="file-input">Import 3D</label>
                <input type="file" id="file-input" accept=".obj,.gltf,.glb">
                <button id="snapshot-btn">Snapshot</button>
            </div>
            <div class="control-box clickable">
                <button id="cam-switch-btn">Flip Cam</button>
            </div>
        </div>

        <!-- Middle Bar: Head Size & Position Adjustments -->
        <div id="adjust-panel" class="clickable">
            <div style="color:#00ff88; font-size:11px; font-weight:bold; text-align:center;">HEAD MODEL ADJUSTMENT</div>
            <div class="adj-row">
                <span>Size (Scale):</span>
                <div>
                    <button onclick="adjustVal('scale', -0.1)">-</button>
                    <button onclick="adjustVal('scale', 0.1)">+</button>
                </div>
            </div>
            <div class="adj-row">
                <span>Position Up/Down:</span>
                <div>
                    <button onclick="adjustVal('posY', -0.05)">▼</button>
                    <button onclick="adjustVal('posY', 0.05)">▲</button>
                </div>
            </div>
            <div class="adj-row">
                <span>Position Left/Right:</span>
                <div>
                    <button onclick="adjustVal('posX', -0.05)">◀</button>
                    <button onclick="adjustVal('posX', 0.05)">▶</button>
                </div>
            </div>
        </div>

        <!-- Bottom Bar: Video Recording Button with Audio -->
        <div class="bottom-panel">
            <div class="clickable" style="background: transparent;">
                <button id="record-btn" title="Record Video"></button>
            </div>
        </div>
    </div>

    <!-- Required Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        let scene, camera, renderer, currentModel;
        let videoElement, mediaStream;
        let useFrontCamera = true;
        let mediaRecorder, recordedChunks = [], isRecording = false;
        let faceMesh, mpCamera;

        // Model adjustments variables
        let modelScale = 1.0;
        let modelOffsetX = 0.0;
        let modelOffsetY = 0.2;
        let modelOffsetZ = 0.0;

        document.getElementById('start-app-btn').addEventListener('click', async () => {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = "Starting camera and AI tracking...";
            try {
                await initCamera();
                document.getElementById('permission-screen').style.display = 'none';
                initThree();
                initFaceTracking();
            } catch (err) {
                console.error(err);
                errDiv.innerText = "Error: " + err.message + ". Please allow camera permissions and use HTTPS.";
            }
        });

        async function initCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 1280, height: 720 },
                    audio: true
                });
            } catch (e) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
            videoElement = document.getElementById('video-bg');
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try {
                await initCamera();
            } catch (e) {
                alert("Camera switch failed: " + e.message);
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.4));
            const dLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dLight.position.set(5, 10, 7);
            scene.add(dLight);

            loadDefaultCube();
            camera.position.z = 3;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Event Listeners for UI
            document.getElementById('file-input').addEventListener('change', handleModelImport);
            document.getElementById('snapshot-btn').addEventListener('click', takeSnapshot);
            document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);
            document.getElementById('record-btn').addEventListener('click', toggleVideoRecording);

            animate();
        }

        function loadDefaultCube() {
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
            currentModel = new THREE.Mesh(geo, mat);
            scene.add(currentModel);
        }

        function initFaceTracking() {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            faceMesh.onResults((results) => {
                if (!currentModel) return;
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const nose = results.multiFaceLandmarks[0][1];
                    const x = -(nose.x - 0.5) * 4.5 + modelOffsetX;
                    const y = -(nose.y - 0.5) * 4.5 + modelOffsetY;
                    currentModel.position.set(x, y, modelOffsetZ);
                    currentModel.visible = true;
                }
            });

            mpCamera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });
            mpCamera.start();
        }

        function adjustVal(type, val) {
            if (type === 'scale') {
                modelScale = Math.max(0.1, modelScale + val);
                if (currentModel) currentModel.scale.set(modelScale, modelScale, modelScale);
            } else if (type === 'posY') {
                modelOffsetY += val;
            } else if (type === 'posX') {
                modelOffsetX += val;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function handleModelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const name = file.name.toLowerCase();

            if (name.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = (evt) => {
                    const loader = new THREE.OBJLoader();
                    replaceModel(loader.parse(evt.target.result));
                };
            } else if (name.endsWith('.gltf') || name.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = (evt) => {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(evt.target.result, '', (gltf) => replaceModel(gltf.scene));
                };
            } else {
                alert("Please select .obj, .gltf or .glb format.");
            }
        }

        function replaceModel(newObj) {
            if (currentModel) scene.remove(currentModel);
            currentModel = newObj;
            modelScale = 1.0; modelOffsetX = 0.0; modelOffsetY = 0.2;
            currentModel.scale.set(modelScale, modelScale, modelScale);
            scene.add(currentModel);
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);

            const a = document.createElement('a');
            a.download = 'aziz-ar-snapshot.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        function toggleVideoRecording() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                if (!mediaStream) { alert("Camera not ready"); return; }
                const combined = new MediaStream([...mediaStream.getVideoTracks(), ...mediaStream.getAudioTracks()]);
                
                try {
                    mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9,opus' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(combined);
                }

                recordedChunks = [];
                mediaRecorder.ondataavailable = (evt) => { if (evt.data.size > 0) recordedChunks.push(evt.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'aziz-ar-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { window.URL.revokeObjectURL(url); a.remove(); }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>
            </html>
