<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Azeez AR Head Tracker V3</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
}

#camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    transform: scaleX(-1);
}

#threeCanvas,
#landmarkCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#landmarkCanvas {
    transform: scaleX(-1);
}

#ui {
    position: absolute;
    z-index: 20;
    left: 10px;
    right: 10px;
    top: 10px;
    max-height: calc(100vh - 20px);
    overflow-y: auto;
    padding: 10px;
    border-radius: 14px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    backdrop-filter: blur(8px);
}

#title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

#version {
    font-size: 11px;
    color: #00ff66;
    margin-bottom: 8px;
}

button,
input[type="file"] {
    width: 100%;
    margin: 4px 0;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px;
    background: #222;
    color: #fff;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

.control {
    margin-top: 7px;
}

.control label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 3px;
}

.control input[type="range"] {
    width: 100%;
}

#status {
    margin-top: 8px;
    padding: 8px;
    border-radius: 8px;
    background: #111;
    color: #00ff66;
    font-size: 12px;
    line-height: 1.4;
}

#fileInput {
    display: none;
}

.small {
    font-size: 10px;
    color: #aaa;
    margin-top: 5px;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="app">

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>
<canvas id="landmarkCanvas"></canvas>

<div id="ui">

    <div id="title">Azeez AR Head Tracker</div>
    <div id="version">NEW BUILD V3 - HEAD TRACK + DEPTH</div>

    <button id="startCamera">START CAMERA</button>
    <button id="switchCamera">SWITCH CAMERA</button>
    <button id="mirrorButton">MIRROR: ON</button>
    <button id="trackingButton">TRACKING: ON</button>

    <button id="importButton">IMPORT GLB MODEL</button>
    <input id="fileInput" type="file" accept=".glb">

    <button id="resetButton">RESET</button>

    <div class="control">
        <label>
            <span>X POSITION</span>
            <span id="xValue">0</span>
        </label>
        <input id="xSlider" type="range" min="-250" max="250" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>Y POSITION</span>
            <span id="yValue">0</span>
        </label>
        <input id="ySlider" type="range" min="-250" max="250" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>Z DEPTH</span>
            <span id="zValue">0</span>
        </label>
        <input id="zSlider" type="range" min="-300" max="300" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>SCALE</span>
            <span id="scaleValue">1.00</span>
        </label>
        <input id="scaleSlider" type="range" min="0.2" max="3" value="1" step="0.01">
    </div>

    <div class="control">
        <label>
            <span>ROTATION X</span>
            <span id="rotXValue">0</span>
        </label>
        <input id="rotXSlider" type="range" min="-180" max="180" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>ROTATION Y</span>
            <span id="rotYValue">0</span>
        </label>
        <input id="rotYSlider" type="range" min="-180" max="180" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>ROTATION Z</span>
            <span id="rotZValue">0</span>
        </label>
        <input id="rotZSlider" type="range" min="-180" max="180" value="0" step="1">
    </div>

    <div class="control">
        <label>
            <span>HEAD FIT</span>
            <span id="fitValue">1.00</span>
        </label>
        <input id="fitSlider" type="range" min="0.5" max="2" value="1" step="0.01">
    </div>

    <div id="status">READY - V3 BUILD</div>

    <div class="small">
        Use a GLB file. GLB is recommended because it keeps the model and textures together.
    </div>

</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const video = document.getElementById("camera");
const threeCanvas = document.getElementById("threeCanvas");
const landmarkCanvas = document.getElementById("landmarkCanvas");

const landmarkCtx = landmarkCanvas.getContext("2d");

const startCameraButton = document.getElementById("startCamera");
const switchCameraButton = document.getElementById("switchCamera");
const mirrorButton = document.getElementById("mirrorButton");
const trackingButton = document.getElementById("trackingButton");
const importButton = document.getElementById("importButton");
const fileInput = document.getElementById("fileInput");
const resetButton = document.getElementById("resetButton");
const statusBox = document.getElementById("status");

const xSlider = document.getElementById("xSlider");
const ySlider = document.getElementById("ySlider");
const zSlider = document.getElementById("zSlider");
const scaleSlider = document.getElementById("scaleSlider");
const rotXSlider = document.getElementById("rotXSlider");
const rotYSlider = document.getElementById("rotYSlider");
const rotZSlider = document.getElementById("rotZSlider");
const fitSlider = document.getElementById("fitSlider");

const xValue = document.getElementById("xValue");
const yValue = document.getElementById("yValue");
const zValue = document.getElementById("zValue");
const scaleValue = document.getElementById("scaleValue");
const rotXValue = document.getElementById("rotXValue");
const rotYValue = document.getElementById("rotYValue");
const rotZValue = document.getElementById("rotZValue");
const fitValue = document.getElementById("fitValue");

let renderer;
let scene;
let screenCamera;

let headAnchor;
let modelRoot = null;
let dummyHead = null;
let occlusionHead = null;

let faceLandmarker = null;
let lastVideoTime = -1;

let stream = null;
let currentFacing = "user";

let trackingEnabled = true;
let mirrorEnabled = true;

let faceDetected = false;

const settings = {
    x: 0,
    y: 0,
    z: 0,
    scale: 1,
    rotX: 0,
    rotY: 0,
    rotZ: 0,
    fit: 1
};

const loader = new GLTFLoader();

function setStatus(message) {
    statusBox.textContent = message;
}

function createThreeScene() {

    renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene = new THREE.Scene();

    screenCamera = new THREE.OrthographicCamera(
        0,
        window.innerWidth,
        0,
        window.innerHeight,
        -5000,
        5000
    );

    screenCamera.position.set(0, 0, 1000);

    const ambient = new THREE.AmbientLight(0xffffff, 2.5);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xffffff, 3);
    directional.position.set(0, 300, 500);
    scene.add(directional);

    headAnchor = new THREE.Group();
    scene.add(headAnchor);

    createDummyHead();
    createOcclusionHead();

    resizeAll();
}

function createDummyHead() {

    if (dummyHead) {
        headAnchor.remove(dummyHead);
    }

    dummyHead = new THREE.Group();

    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0x55aaff,
        transparent: true,
        opacity: 0.28,
        depthWrite: false
    });

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(105, 48, 48),
        headMaterial
    );

    head.scale.set(1, 1.18, 0.9);
    head.position.set(0, 0, 0);

    dummyHead.add(head);

    const eyeMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

    const pupilMaterial = new THREE.MeshBasicMaterial({
        color: 0x000000
    });

    const leftEye = new THREE.Mesh(
        new THREE.SphereGeometry(14, 24, 24),
        eyeMaterial
    );

    leftEye.position.set(-35, -25, 88);

    const rightEye = new THREE.Mesh(
        new THREE.SphereGeometry(14, 24, 24),
        eyeMaterial
    );

    rightEye.position.set(35, -25, 88);

    const leftPupil = new THREE.Mesh(
        new THREE.SphereGeometry(6, 20, 20),
        pupilMaterial
    );

    leftPupil.position.set(-35, -25, 100);

    const rightPupil = new THREE.Mesh(
        new THREE.SphereGeometry(6, 20, 20),
        pupilMaterial
    );

    rightPupil.position.set(35, -25, 100);

    dummyHead.add(
        leftEye,
        rightEye,
        leftPupil,
        rightPupil
    );

    const nose = new THREE.Mesh(
        new THREE.ConeGeometry(12, 38, 24),
        new THREE.MeshBasicMaterial({
            color: 0xffaa66
        })
    );

    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 5, 105);

    dummyHead.add(nose);

    const mouth = new THREE.Mesh(
        new THREE.TorusGeometry(22, 4, 12, 32, Math.PI),
        new THREE.MeshBasicMaterial({
            color: 0xff4466
        })
    );

    mouth.rotation.x = Math.PI;
    mouth.position.set(0, 42, 95);

    dummyHead.add(mouth);

    headAnchor.add(dummyHead);

    dummyHead.visible = modelRoot === null;
}

function createOcclusionHead() {

    if (occlusionHead) {
        headAnchor.remove(occlusionHead);
    }

    occlusionHead = new THREE.Mesh(
        new THREE.SphereGeometry(105, 48, 48),
        new THREE.MeshBasicMaterial({
            color: 0xffffff,
            colorWrite: false,
            depthWrite: true,
            depthTest: true
        })
    );

    occlusionHead.scale.set(1, 1.18, 0.9);
    occlusionHead.renderOrder = 1;

    headAnchor.add(occlusionHead);
}

function resizeAll() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.setSize(width, height);

    screenCamera.left = 0;
    screenCamera.right = width;
    screenCamera.top = 0;
    screenCamera.bottom = height;

    screenCamera.updateProjectionMatrix();

    threeCanvas.width = width;
    threeCanvas.height = height;

    landmarkCanvas.width = width;
    landmarkCanvas.height = height;
}

async function setupFaceTracking() {

    try {

        setStatus("LOADING FACE TRACKER...");

        const vision = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        );

        const {
            FaceLandmarker,
            FilesetResolver
        } = vision;

        const fileset = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        faceLandmarker = await FaceLandmarker.createFromOptions(
            fileset,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numFaces: 1,

                minFaceDetectionConfidence: 0.5,
                minFacePresenceConfidence: 0.5,
                minTrackingConfidence: 0.5,

                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: true
            }
        );

        setStatus("FACE TRACKER READY");

        requestAnimationFrame(trackFace);

    } catch (error) {

        console.error(error);

        setStatus(
            "FACE TRACKER ERROR: " +
            (error.message || error)
        );
    }
}

async function startCamera() {

    try {

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        setStatus("STARTING CAMERA...");

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: currentFacing
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        resizeAll();

        setStatus("CAMERA ON - LOADING TRACKER");

        if (!faceLandmarker) {
            await setupFaceTracking();
        }

    } catch (error) {

        console.error(error);

        setStatus(
            "CAMERA ERROR: " +
            (error.message || error)
        );
    }
}

async function switchCamera() {

    currentFacing =
        currentFacing === "user"
            ? "environment"
            : "user";

    await startCamera();
}

function applyMirror() {

    const value = mirrorEnabled ? "scaleX(-1)" : "scaleX(1)";

    video.style.transform = value;
    landmarkCanvas.style.transform = value;
}

function updateHeadFromFace(landmarks, result) {

    if (!landmarks || landmarks.length < 264) {
        return;
    }

    const leftEye = landmarks[33];
    const rightEye = landmarks[263];

    const forehead = landmarks[10];
    const chin = landmarks[152];

    const centerX =
        ((leftEye.x + rightEye.x) * 0.5) *
        window.innerWidth;

    const centerY =
        ((forehead.y + chin.y) * 0.5) *
        window.innerHeight;

    const faceHeight =
        Math.sqrt(
            Math.pow(forehead.x - chin.x, 2) +
            Math.pow(forehead.y - chin.y, 2)
        ) *
        window.innerHeight;

    const safeFaceHeight =
        Math.max(80, Math.min(faceHeight, 800));

    headAnchor.position.x = centerX;
    headAnchor.position.y = centerY;

    const baseSize = 220;

    const automaticScale =
        (safeFaceHeight / baseSize) *
        settings.fit;

    headAnchor.scale.set(
        automaticScale,
        automaticScale,
        automaticScale
    );

    headAnchor.position.z = 0;

    if (
        result.facialTransformationMatrixes &&
        result.facialTransformationMatrixes.length > 0
    ) {

        const matrixData =
            result.facialTransformationMatrixes[0].data;

        if (matrixData && matrixData.length === 16) {

            const matrix = new THREE.Matrix4();

            matrix.fromArray(matrixData);

            const quaternion = new THREE.Quaternion();

            const position = new THREE.Vector3();

            const scale = new THREE.Vector3();

            matrix.decompose(
                position,
                quaternion,
                scale
            );

            headAnchor.quaternion.copy(quaternion);
        }
    }

    faceDetected = true;

    updateModelTransform();
}

function drawLandmarks(landmarks) {

    landmarkCtx.clearRect(
        0,
        0,
        landmarkCanvas.width,
        landmarkCanvas.height
    );

    if (!landmarks) {
        return;
    }

    const points = [
        10,
        151,
        9,
        8,

        70,
        63,
        105,
        107,

        33,
        133,
        159,
        145,

        263,
        362,
        386,
        374,

        1,
        2,
        4,

        61,
        291,

        13,
        14,

        199,
        152
    ];

    landmarkCtx.fillStyle = "#00ff55";

    for (const index of points) {

        const point = landmarks[index];

        if (!point) {
            continue;
        }

        const x =
            point.x *
            landmarkCanvas.width;

        const y =
            point.y *
            landmarkCanvas.height;

        landmarkCtx.beginPath();

        landmarkCtx.arc(
            x,
            y,
            6,
            0,
            Math.PI * 2
        );

        landmarkCtx.fill();
    }
}

function trackFace() {

    requestAnimationFrame(trackFace);

    if (
        !trackingEnabled ||
        !faceLandmarker ||
        video.readyState < 2
    ) {

        if (!trackingEnabled) {
            landmarkCtx.clearRect(
                0,
                0,
                landmarkCanvas.width,
                landmarkCanvas.height
            );
        }

        return;
    }

    if (video.currentTime === lastVideoTime) {
        return;
    }

    lastVideoTime = video.currentTime;

    try {

        const result =
            faceLandmarker.detectForVideo(
                video,
                performance.now()
            );

        if (
            result.faceLandmarks &&
            result.faceLandmarks.length > 0
        ) {

            const landmarks =
                result.faceLandmarks[0];

            updateHeadFromFace(
                landmarks,
                result
            );

            drawLandmarks(landmarks);

            setStatus(
                "FACE DETECTED - HEAD TRACKING ON"
            );

        } else {

            faceDetected = false;

            landmarkCtx.clearRect(
                0,
                0,
                landmarkCanvas.width,
                landmarkCanvas.height
            );

            setStatus(
                "CAMERA ON - FACE NOT FOUND"
            );
        }

    } catch (error) {

        console.error(error);

        setStatus(
            "TRACKING ERROR: " +
            (error.message || error)
        );
    }
}function prepareImportedModel(root) {

    root.updateMatrixWorld(true);

    const box = new THREE.Box3();

    box.setFromObject(root);

    if (box.isEmpty()) {
        throw new Error("GLB MODEL HAS NO VISIBLE MESH");
    }

    const center = new THREE.Vector3();

    const size = new THREE.Vector3();

    box.getCenter(center);

    box.getSize(size);

    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (!isFinite(maxDimension) || maxDimension <= 0) {
        throw new Error("INVALID GLB MODEL SIZE");
    }

    root.position.x -= center.x;
    root.position.y -= center.y;
    root.position.z -= center.z;

    const targetSize = 220;

    const normalization =
        targetSize / maxDimension;

    root.scale.multiplyScalar(
        normalization
    );

    root.traverse(object => {

        if (!object.isMesh) {
            return;
        }

        object.frustumCulled = false;

        if (object.material) {

            const materials =
                Array.isArray(object.material)
                    ? object.material
                    : [object.material];

            for (const material of materials) {

                material.depthTest = true;
                material.depthWrite = true;

                if (
                    material.transparent &&
                    material.opacity === 0
                ) {
                    material.transparent = false;
                    material.opacity = 1;
                }

                material.needsUpdate = true;
            }
        }
    });

    return root;
}

function importGLB(file) {

    if (!file) {
        return;
    }

    if (!file.name.toLowerCase().endsWith(".glb")) {

        setStatus(
            "PLEASE SELECT A GLB FILE"
        );

        return;
    }

    setStatus("LOADING GLB MODEL...");

    const reader = new FileReader();

    reader.onload = function(event) {

        const arrayBuffer =
            event.target.result;

        loader.parse(
            arrayBuffer,
            "",
            function(gltf) {

                try {

                    if (modelRoot) {

                        headAnchor.remove(
                            modelRoot
                        );

                        modelRoot.traverse(
                            object => {

                                if (object.geometry) {
                                    object.geometry.dispose();
                                }

                                if (object.material) {

                                    const materials =
                                        Array.isArray(
                                            object.material
                                        )
                                            ? object.material
                                            : [object.material];

                                    for (
                                        const material
                                        of materials
                                    ) {

                                        if (
                                            material.map
                                        ) {
                                            material.map.dispose();
                                        }

                                        material.dispose();
                                    }
                                }
                            }
                        );

                        modelRoot = null;
                    }

                    modelRoot =
                        prepareImportedModel(
                            gltf.scene
                        );

                    headAnchor.add(
                        modelRoot
                    );

                    modelRoot.position.set(
                        settings.x,
                        settings.y,
                        settings.z
                    );

                    modelRoot.rotation.set(
                        THREE.MathUtils.degToRad(
                            settings.rotX
                        ),
                        THREE.MathUtils.degToRad(
                            settings.rotY
                        ),
                        THREE.MathUtils.degToRad(
                            settings.rotZ
                        )
                    );

                    modelRoot.scale.setScalar(
                        settings.scale
                    );

                    modelRoot.renderOrder = 2;

                    if (dummyHead) {
                        dummyHead.visible = false;
                    }

                    setStatus(
                        "GLB LOADED - TRACKING READY"
                    );

                    updateModelTransform();

                } catch (error) {

                    console.error(error);

                    modelRoot = null;

                    if (dummyHead) {
                        dummyHead.visible = true;
                    }

                    setStatus(
                        "MODEL ERROR: " +
                        (error.message || error)
                    );
                }
            },

            function(error) {

                console.error(error);

                setStatus(
                    "GLB LOAD ERROR"
                );
            }
        );
    };

    reader.onerror = function() {

        setStatus(
            "FILE READ ERROR"
        );
    };

    reader.readAsArrayBuffer(file);
}

function updateModelTransform() {

    if (!modelRoot) {
        return;
    }

    modelRoot.position.x =
        settings.x;

    modelRoot.position.y =
        settings.y;

    modelRoot.position.z =
        settings.z;

    modelRoot.rotation.x =
        THREE.MathUtils.degToRad(
            settings.rotX
        );

    modelRoot.rotation.y =
        THREE.MathUtils.degToRad(
            settings.rotY
        );

    modelRoot.rotation.z =
        THREE.MathUtils.degToRad(
            settings.rotZ
        );

    modelRoot.scale.setScalar(
        settings.scale
    );

    modelRoot.updateMatrixWorld(
        true
    );
}

function updateUIValues() {

    xValue.textContent =
        settings.x;

    yValue.textContent =
        settings.y;

    zValue.textContent =
        settings.z;

    scaleValue.textContent =
        settings.scale.toFixed(2);

    rotXValue.textContent =
        settings.rotX;

    rotYValue.textContent =
        settings.rotY;

    rotZValue.textContent =
        settings.rotZ;

    fitValue.textContent =
        settings.fit.toFixed(2);
}

function resetSettings() {

    settings.x = 0;
    settings.y = 0;
    settings.z = 0;
    settings.scale = 1;

    settings.rotX = 0;
    settings.rotY = 0;
    settings.rotZ = 0;

    settings.fit = 1;

    xSlider.value = 0;
    ySlider.value = 0;
    zSlider.value = 0;

    scaleSlider.value = 1;

    rotXSlider.value = 0;
    rotYSlider.value = 0;
    rotZSlider.value = 0;

    fitSlider.value = 1;

    updateUIValues();

    updateModelTransform();

    if (dummyHead) {
        dummyHead.visible =
            modelRoot === null;
    }

    setStatus(
        modelRoot
            ? "MODEL RESET"
            : "RESET - DUMMY HEAD ACTIVE"
    );
}

function bindSlider(
    slider,
    property,
    valueElement,
    decimals = false
) {

    slider.addEventListener(
        "input",
        function() {

            settings[property] =
                Number(slider.value);

            if (decimals) {

                valueElement.textContent =
                    settings[property]
                        .toFixed(2);

            } else {

                valueElement.textContent =
                    settings[property];
            }

            if (property === "fit") {
                return;
            }

            updateModelTransform();
        }
    );
}

bindSlider(
    xSlider,
    "x",
    xValue
);

bindSlider(
    ySlider,
    "y",
    yValue
);

bindSlider(
    zSlider,
    "z",
    zValue
);

bindSlider(
    scaleSlider,
    "scale",
    scaleValue,
    true
);

bindSlider(
    rotXSlider,
    "rotX",
    rotXValue
);

bindSlider(
    rotYSlider,
    "rotY",
    rotYValue
);

bindSlider(
    rotZSlider,
    "rotZ",
    rotZValue
);

bindSlider(
    fitSlider,
    "fit",
    fitValue,
    true
);

startCameraButton.addEventListener(
    "click",
    async function() {

        await startCamera();
    }
);

switchCameraButton.addEventListener(
    "click",
    async function() {

        await switchCamera();
    }
);

mirrorButton.addEventListener(
    "click",
    function() {

        mirrorEnabled =
            !mirrorEnabled;

        applyMirror();

        mirrorButton.textContent =
            mirrorEnabled
                ? "MIRROR: ON"
                : "MIRROR: OFF";
    }
);

trackingButton.addEventListener(
    "click",
    function() {

        trackingEnabled =
            !trackingEnabled;

        trackingButton.textContent =
            trackingEnabled
                ? "TRACKING: ON"
                : "TRACKING: OFF";

        if (!trackingEnabled) {

            landmarkCtx.clearRect(
                0,
                0,
                landmarkCanvas.width,
                landmarkCanvas.height
            );

            setStatus(
                "TRACKING PAUSED"
            );

        } else {

            setStatus(
                faceDetected
                    ? "TRACKING ON"
                    : "TRACKING ON - FINDING FACE"
            );
        }
    }
);

importButton.addEventListener(
    "click",
    function() {

        fileInput.value = "";
        fileInput.click();
    }
);

fileInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (file) {
            importGLB(file);
        }
    }
);

resetButton.addEventListener(
    "click",
    function() {

        resetSettings();
    }
);

applyMirror();

updateUIValues();

createThreeScene();

setStatus(
    "READY - TAP START CAMERA"
);

window.addEventListener(
    "resize",
    resizeAll
);function render() {

    requestAnimationFrame(render);

    if (!renderer || !scene || !screenCamera) {
        return;
    }

    renderer.render(
        scene,
        screenCamera
    );
}

render();

</script>

</div>

</body>
</html>
