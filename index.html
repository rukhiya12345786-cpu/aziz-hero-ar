
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aziz AI AR Studio</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b11;
  color: white;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b11;
}

#studioUI {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

.panel {
  position: absolute;
  left: 8px;
  right: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  padding: 9px;
  border: 1px solid #35445b;
  border-radius: 12px;
  background: rgba(14, 22, 35, 0.94);
  pointer-events: auto;
}

#topbar {
  top: max(8px, env(safe-area-inset-top));
}

#toolbar {
  bottom: 55px;
  max-height: 42vh;
  overflow-y: auto;
  align-content: flex-start;
}

#status {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: max(8px, env(safe-area-inset-bottom));
  padding: 10px;
  border-radius: 8px;
  background: rgba(14, 22, 35, 0.94);
  font-size: 12px;
  pointer-events: auto;
}

button, label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 9px 11px;
  border: 1px solid #536781;
  border-radius: 8px;
  background: #26364d;
  color: white;
  font-size: 12px;
  cursor: pointer;
  user-select: none;
}

button:active, label:active {
  background: #087e8b;
}

button.active {
  background: #087e8b;
  border-color: #25c4d0;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

input[type="file"] {
  display: none;
}

#importModelLabel {
  background: #176776;
}

#recordButton {
  background: #8c2534;
}

#hideControlsButton,
#hideGizmoButton,
#hideUIButton {
  background: #51416f;
}

#showUIButton {
  position: fixed;
  z-index: 1000;
  top: max(10px, env(safe-area-inset-top));
  right: 10px;
  display: none;
  background: #087e8b;
  pointer-events: auto;
}

body.ui-hidden #studioUI {
  display: none;
}

body.ui-hidden #showUIButton {
  display: inline-flex;
}

#toolbar.controls-hidden {
  display: none;
}

#status.status-hidden {
  display: none;
}

#video-feed {
  display: none;
}

#overlayVideo {
  display: none;
}

@media (orientation: landscape) {
  #toolbar {
    left: 8px;
    right: auto;
    bottom: 48px;
    width: min(68vw, 620px);
    max-height: 55vh;
  }

  #topbar {
    max-width: 100%;
  }
}

@media (max-width: 420px) {
  button, label {
    min-height: 36px;
    padding: 8px;
    font-size: 11px;
  }

  #toolbar {
    max-height: 40vh;
  }
}
</style>
</head>

<body>
<div id="container"></div>

<div id="studioUI">

  <div id="topbar" class="panel">
    <button id="startButton">START CAMERA</button>
    <button id="stopButton">STOP CAMERA</button>
    <button id="switchButton">SWITCH CAMERA</button>
    <button id="mirrorButton">MIRROR: OFF</button>
    <button id="fullscreenButton">FULL SCREEN</button>
    <button id="hideUIButton">HIDE UI</button>
    <button id="hideControlsButton">HIDE CONTROLS</button>
  </div>

  <div id="toolbar" class="panel">

    <label id="importModelLabel" for="modelFile">
      IMPORT 3D MODEL
    </label>
    <input
      id="modelFile"
      type="file"
      accept=".glb,.gltf,.obj,.fbx"
    >

    <button data-gizmo-mode="translate" class="active">
      MOVE
    </button>
    <button data-gizmo-mode="rotate">
      ROTATE
    </button>
    <button data-gizmo-mode="scale">
      SCALE
    </button>

    <button id="hideGizmoButton">HIDE GIZMOS</button>
    <button id="resetButton">RESET MODEL</button>
    <button id="removeButton">REMOVE MODEL</button>

    <button id="trackingButton">FACE TRACKING: ON</button>
    <button id="faceDotsButton">FACE DOTS: ON</button>

    <label for="overlayFile">
      IMPORT EYE/MOUTH IMAGE
    </label>
    <input
      id="overlayFile"
      type="file"
      accept="image/*,video/*"
    >

    <button id="leftEyeButton">LEFT EYE</button>
    <button id="rightEyeButton">RIGHT EYE</button>
    <button id="mouthButton">MOUTH</button>
    <button id="overlayToggleButton">OVERLAYS: OFF</button>

    <button id="recordButton">START RECORDING</button>
    <button id="stopRecordButton" disabled>
      STOP RECORDING
    </button>

    <button id="exportSettingsButton">EXPORT SETTINGS</button>
    <button id="exportModelButton">EXPORT MODEL</button>

  </div>

  <div id="status">
    Ready. Start camera or import a 3D model.
  </div>

</div>

<button id="showUIButton">SHOW UI</button>

<video id="video-feed" playsinline muted></video>
<video id="overlayVideo" playsinline muted loop></video>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-face-three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const $ = id => document.getElementById(id);

const container = $('container');
const status = $('status');

let mindar = null;
let anchor = null;
let transform = null;
let model = null;
let modelURL = null;

let cameraStarted = false;
let cameraFacing = 'user';
let mirrorOn = false;
let trackingOn = true;
let dotsOn = true;
let gizmosOn = true;

let recorder = null;
let recording = false;
let chunks = [];
let recordStream = null;
let micStream = null;
let recordTimer = null;

let currentOverlayURL = null;
let overlayImage = null;
let overlayTarget = 'leftEye';
let overlayEnabled = false;

let faceDots = [];
let lastEstimate = null;
let generation = 0;

function say(message) {
  status.textContent = message;
}

function disposeObject(object) {
  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        for (const value of Object.values(material)) {
          if (value?.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });
}

function clearDots() {
  if (!anchor) return;

  for (const dot of faceDots) {
    anchor.group.remove(dot);
    dot.geometry.dispose();
    dot.material.dispose();
  }

  faceDots = [];
}

async function setupCamera() {
  if (mindar) return;

  mindar = new MindARThree({
    container,
    maxTrack: 1,
    videoSettings: {
      facingMode: cameraFacing
    }
  });

  const scene = mindar.scene;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.8));

  const light = new THREE.DirectionalLight(0xffffff, 1.5);
  light.position.set(0, 2, 3);
  scene.add(light);

  anchor = mindar.addAnchor(1);

  mindar.renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  mindar.renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  transform = new TransformControls(
    mindar.camera,
    mindar.renderer.domElement
  );

  transform.setMode('translate');
  transform.setSpace('local');

  transform.addEventListener('dragging-changed', event => {
    // TransformControls handles the actual 3D gizmo interaction.
  });

  scene.add(transform.getHelper());

  transform.enabled = false;

  mindar.renderer.setAnimationLoop(() => {
    if (!mindar) return;

    if (trackingOn) {
      try {
        lastEstimate = mindar.getLatestEstimate();
      } catch (error) {
        lastEstimate = null;
      }
    }

    mindar.renderer.render(scene, mindar.camera);
  });
}

async function startCamera() {
  try {
    await setupCamera();

    if (cameraStarted) {
      say('Camera is already running.');
      return;
    }

    await mindar.start();
    cameraStarted = true;

    say('Camera started. Face the camera.');
  } catch (error) {
    console.error(error);
    say('Camera failed. Check HTTPS, camera permission and browser support.');
  }
}

async function stopCamera() {
  if (!mindar || !cameraStarted) {
    say('Camera is not running.');
    return;
  }

  try {
    await mindar.stop();
  } catch (error) {
    console.error(error);
  }

  cameraStarted = false;
  say('Camera stopped.');
}

async function switchCamera() {
  const wasRunning = cameraStarted;

  try {
    if (wasRunning) {
      await mindar.stop();
      cameraStarted = false;
    }

    // Recreate MindAR with the requested camera source.
    if (mindar) {
      mindar.renderer.setAnimationLoop(null);

      if (transform) {
        transform.detach();
        mindar.scene.remove(transform.getHelper());
        transform.dispose();
      }

      clearDots();

      if (model && anchor) {
        anchor.group.remove(model);
      }

      mindar = null;
      anchor = null;
      transform = null;
    }

    cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';

    await setupCamera();

    if (model) {
      anchor.group.add(model);
      transform.attach(model);
      transform.enabled = gizmosOn;
    }

    if (wasRunning) {
      await mindar.start();
      cameraStarted = true;
    }

    say('Requested camera: ' + cameraFacing +
      '. If it does not switch, this MindAR build may not support changing camera source.');
  } catch (error) {
    console.error(error);
    say('Camera switch failed. The browser or MindAR version may not support this camera source.');
  }
}

function removeModel() {
  generation++;

  if (model && anchor) {
    anchor.group.remove(model);

    if (transform) transform.detach();

    disposeObject(model);
  }

  model = null;

  if (modelURL) {
    URL.revokeObjectURL(modelURL);
    modelURL = null;
  }

  say('Model removed.');
}

function centerAndScale(object) {
  const bounds = new THREE.Box3().setFromObject(object);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error('Model has invalid dimensions.');
  }

  object.position.sub(center);
  object.scale.setScalar(1 / maxDimension);
}

async function importModel(file) {
  if (!file) return;

  const extension = file.name.split('.').pop().toLowerCase();

  if (!['glb', 'gltf', 'obj', 'fbx'].includes(extension)) {
    say('Use GLB, GLTF, OBJ or FBX.');
    return;
  }

  const thisGeneration = ++generation;

  try {
    await setupCamera();

    say('Loading ' + file.name + '...');

    const url = URL.createObjectURL(file);
    const oldURL = modelURL;
    modelURL = url;

    if (model && anchor) {
      anchor.group.remove(model);
      if (transform) transform.detach();
      disposeObject(model);
      model = null;
    }

    let loadedModel;

    if (extension === 'glb' || extension === 'gltf') {
      const result = await new GLTFLoader().loadAsync(url);
      loadedModel = result.scene;
    } else if (extension === 'fbx') {
      loadedModel = await new FBXLoader().loadAsync(url);
    } else {
      loadedModel = await new OBJLoader().loadAsync(url);
    }

    if (thisGeneration !== generation) {
      disposeObject(loadedModel);
      URL.revokeObjectURL(url);
      return;
    }

    loadedModel.traverse(child => {
      if (child.isMesh && child.material) {
        const materials = Array.isArray(child.material)
          ? child.material
          : [child.material];

        materials.forEach(material => {
          material.side = THREE.DoubleSide;
          material.needsUpdate = true;
        });
      }
    });

    centerAndScale(loadedModel);
    model = loadedModel;

    anchor.group.add(model);
    transform.attach(model);
    transform.enabled = gizmosOn;

    if (oldURL && oldURL !== url) URL.revokeObjectURL(oldURL);

    say('Model loaded. Select MOVE, ROTATE or SCALE and drag a gizmo.');
  } catch (error) {
    console.error(error);
    say('Import failed. GLTF and OBJ may need separate texture files; try a self-contained GLB.');
  }
}

function resetModel() {
  if (!model) {
    say('Import a model first.');
    return;
  }

  model.position.set(0, 0, 0);
  model.rotation.set(0, 0, 0);
  centerAndScale(model);

  say('Model reset.');
}

function setGizmoMode(mode) {
  if (!transform) {
    say('Start the camera or import a model first.');
    return;
  }

  transform.setMode(mode);

  document.querySelectorAll('[data-gizmo-mode]').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.gizmoMode === mode
    );
  });

  say(mode.toUpperCase() + ' gizmo selected.');
}

function toggleGizmos() {
  gizmosOn = !gizmosOn;

  if (transform) {
    transform.enabled = gizmosOn && !!model;
  }

  $('hideGizmoButton').textContent =
    gizmosOn ? 'HIDE GIZMOS' : 'SHOW GIZMOS';

  say(gizmosOn ? 'Gizmos enabled.' : 'Gizmos hidden.');
}

function toggleTracking() {
  trackingOn = !trackingOn;

  $('trackingButton').textContent =
    'FACE TRACKING: ' + (trackingOn ? 'ON' : 'OFF');

  say(
    trackingOn
      ? 'Tracking display enabled.'
      : 'Tracking updates paused in this app. MindAR may still run internally.'
  );
}

function toggleDots() {
  dotsOn = !dotsOn;

  $('faceDotsButton').textContent =
    'FACE DOTS: ' + (dotsOn ? 'ON' : 'OFF');

  faceDots.forEach(dot => {
    dot.visible = dotsOn;
  });

  say('Face dots display: ' + (dotsOn ? 'ON' : 'OFF'));
}

function toggleMirror() {
  mirrorOn = !mirrorOn;

  // Mirror the rendered canvas visually.
  const canvas = mindar?.renderer?.domElement;

  if (canvas) {
    canvas.style.transform = mirrorOn ? 'scaleX(-1)' : 'none';
  }

  $('mirrorButton').textContent =
    'MIRROR: ' + (mirrorOn ? 'ON' : 'OFF');

  say('Preview mirror: ' + (mirrorOn ? 'ON' : 'OFF'));
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    say('Fullscreen unavailable. Use your browser fullscreen option.');
  }
}

function hideControls() {
  const toolbar = $('toolbar');
  const hidden = toolbar.classList.toggle('controls-hidden');

  $('hideControlsButton').textContent =
    hidden ? 'SHOW CONTROLS' : 'HIDE CONTROLS';
}

function hideUI() {
  document.body.classList.add('ui-hidden');
  $('showUIButton').style.display = 'inline-flex';
}

function showUI() {
  document.body.classList.remove('ui-hidden');
  $('showUIButton').style.display = 'none';
}

async function startRecording() {
  if (recording) return;

  try {
    await setupCamera();

    if (!cameraStarted) {
      say('Start the camera before recording.');
      return;
    }

    const canvas = mindar.renderer.domElement;

    // This records the WebGL canvas. Camera video compositing may
    // require a separate canvas integration for your MindAR build.
    recordStream = canvas.captureStream(24);

    const tracks = [...recordStream.getVideoTracks()];

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });

      tracks.push(...micStream.getAudioTracks());
    } catch (error) {
      say('Microphone unavailable; continuing without audio.');
    }

    const stream = new MediaStream(tracks);

    const mimeTypes = [
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];

    const mimeType = mimeTypes.find(type =>
      MediaRecorder.isTypeSupported(type)
    );

    recorder = new MediaRecorder(stream, {
      ...(mimeType ? { mimeType } : {}),
      videoBitsPerSecond: 2500000,
      audioBitsPerSecond: 96000
    });

    chunks = [];

    recorder.ondataavailable = event => {
      if (event.data && event.data.size) {
        chunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, {
        type: recorder.mimeType || 'video/webm'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = 'aziz-ar-recording.webm';
      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 30000);

      if (recordStream) {
        recordStream.getTracks().forEach(track => track.stop());
      }

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }

      recordStream = null;
      micStream = null;
      say('Recording downloaded. Check that the video contains the expected camera view and audio.');
    };

    recorder.start(1000);
    recording = true;

    $('recordButton').disabled = true;
    $('stopRecordButton').disabled = false;

    // Leave UI visible until the user chooses to hide it.
    say('Recording started. Use HIDE UI to show only the preview.');
  } catch (error) {
    console.error(error);
    say('Recording failed. Check browser support and HTTPS permissions.');
  }
}

function stopRecording() {
  if (recorder && recording) {
    recorder.stop();
  }

  recording = false;
  $('recordButton').disabled = false;
  $('stopRecordButton').disabled = true;
}

function exportSettings() {
  const settings = {
    position: model ? model.position.toArray() : null,
    rotation: model ? model.rotation.toArray() : null,
    scale: model ? model.scale.toArray() : null,
    gizmoMode: transform ? transform.getMode() : 'translate',
    cameraFacing,
    mirrorOn
  };

  const blob = new Blob(
    [JSON.stringify(settings, null, 2)],
    { type: 'application/json' }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'aziz-ar-settings.json';
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 30000);
  say('Settings exported.');
}

function exportModel() {
  say('Model export is not implemented yet. Export Settings saves the current transform settings.');
}

function selectOverlay(file) {
  if (!file) return;

  if (currentOverlayURL) {
    URL.revokeObjectURL(currentOverlayURL);
  }

  currentOverlayURL = URL.createObjectURL(file);
  overlayImage = null;

  if (file.type.startsWith('image/')) {
    const image = new Image();

    image.onload = () => {
      overlayImage = image;
      say('Overlay image loaded. Landmark-based eye/mouth placement is not implemented in this Part 2.');
    };

    image.onerror = () => say('Unable to load this image.');
    image.src = currentOverlayURL;
  } else if (file.type.startsWith('video/')) {
    const video = $('overlayVideo');
    video.src = currentOverlayURL;

    video.play().catch(() => {});
    say('Overlay video loaded. Eye/mouth placement still needs landmark mapping.');
  } else {
    say('Select an image or video.');
  }
}

function selectOverlayTarget(target) {
  overlayTarget = target;

  $('leftEyeButton').classList.toggle('active', target === 'leftEye');
  $('rightEyeButton').classList.toggle('active', target === 'rightEye');
  $('mouthButton').classList.toggle('active', target === 'mouth');

  say('Selected overlay target: ' + target + '. Actual placement requires face-landmark mapping.');
}

function toggleOverlay() {
  overlayEnabled = !overlayEnabled;

  $('overlayToggleButton').textContent =
    'OVERLAYS: ' + (overlayEnabled ? 'ON' : 'OFF');

  say('Overlay toggle changed. This prototype does not yet place overlays on tracked landmarks.');
}

$('startButton').addEventListener('click', startCamera);
$('stopButton').addEventListener('click', stopCamera);
$('switchButton').addEventListener('click', switchCamera);
$('mirrorButton').addEventListener('click', toggleMirror);
$('fullscreenButton').addEventListener('click', toggleFullscreen);
$('hideUIButton').addEventListener('click', hideUI);
$('showUIButton').addEventListener('click', showUI);
$('hideControlsButton').addEventListener('click', hideControls);

$('modelFile').addEventListener('change', event => {
  const file = event.target.files?.[0];
  if (file) importModel(file);
  event.target.value = '';
});

$('resetButton').addEventListener('click', resetModel);
$('removeButton').addEventListener('click', removeModel);
$('hideGizmoButton').addEventListener('click', toggleGizmos);
$('trackingButton').addEventListener('click', toggleTracking);
$('faceDotsButton').addEventListener('click', toggleDots);

document.querySelectorAll('[data-gizmo-mode]').forEach(button => {
  button.addEventListener('click', () => {
    setGizmoMode(button.dataset.gizmoMode);
  });
});

$('recordButton').addEventListener('click', startRecording);
$('stopRecordButton').addEventListener('click', stopRecording);
$('exportSettingsButton').addEventListener('click', exportSettings);
$('exportModelButton').addEventListener('click', exportModel);

$('overlayFile').addEventListener('change', event => {
  const file = event.target.files?.[0];
  if (file) selectOverlay(file);
  event.target.value = '';
});

$('leftEyeButton').addEventListener('click', () => {
  selectOverlayTarget('leftEye');
});

$('rightEyeButton').addEventListener('click', () => {
  selectOverlayTarget('rightEye');
});

$('mouthButton').addEventListener('click', () => {
  selectOverlayTarget('mouth');
});

$('overlayToggleButton').addEventListener('click', toggleOverlay);

window.addEventListener('resize', () => {
  if (!mindar) return;

  mindar.renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  mindar.renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );
});

window.addEventListener('beforeunload', () => {
  if (model) disposeObject(model);
  if (modelURL) URL.revokeObjectURL(modelURL);
  if (currentOverlayURL) URL.revokeObjectURL(currentOverlayURL);
});

say('Studio ready. Start the camera or import a model.');
</script>
</body>
</html>
