<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Aziz Hero AR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      z-index: 1;
    }

    #threeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 2;
    }

    #topBar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      pointer-events: none;
    }

    #appTitle {
      margin: 0;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 14px;
      font-weight: 700;
      pointer-events: auto;
    }

    #status {
      max-width: 65%;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      line-height: 1.3;
      text-align: right;
      pointer-events: auto;
    }

    #status[data-state="error"] {
      background: rgba(120, 0, 0, 0.85);
    }

    #controls {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 20;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    button {
      min-height: 42px;
      padding: 8px 11px;
      border: 0;
      border-radius: 10px;
      background: rgba(20, 20, 20, 0.82);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    #recordButton {
      background: rgba(150, 20, 20, 0.9);
    }

    #sideControls {
      position: absolute;
      top: 78px;
      right: 8px;
      z-index: 25;

      width: 145px;
      max-height: calc(100% - 160px);
      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 7px;

      padding: 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(5px);
    }

    .controlGroup {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .controlGroup label {
      font-size: 10px;
      color: #ddd;
    }

    .controlGroup input[type="range"] {
      width: 100%;
      margin: 0;
    }

    #import3DInput {
      display: none;
    }

    #exportFormat {
      width: 100%;
      min-height: 34px;
      padding: 5px;
      border: 0;
      border-radius: 7px;
      background: #222;
      color: #fff;
      font-size: 11px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <video
      id="camera"
      autoplay
      muted
      playsinline
      webkit-playsinline
    ></video>

    <canvas id="threeCanvas"></canvas>

    <div id="topBar">
      <h1 id="appTitle">Aziz Hero AR</h1>
      <div id="status">Loading...</div>
    </div>

    <div id="controls">

      <button
        id="cameraButton"
        type="button"
      >
        Open Camera
      </button>

      <button
        id="switchCameraButton"
        type="button"
      >
        Switch Camera
      </button>

      <button
        id="photoButton"
        type="button"
      >
        Photo
      </button>

      <button
        id="recordButton"
        type="button"
      >
        Record
      </button>

      <button
        id="audioButton"
        type="button"
      >
        Audio
      </button>

      <button
        id="trackingButton"
        type="button"
      >
        Face Tracking
      </button>

      <button
        id="modelButton"
        type="button"
      >
        Model Controls
      </button>

      <button
        id="import3DButton"
        type="button"
      >
        Import 3D
      </button>

      <input
        id="import3DInput"
        type="file"
        accept=".glb,.gltf,.obj,.stl"
      >

      <button
        id="export3DButton"
        type="button"
      >
        Export 3D
      </button>

      <button
        id="resetButton"
        type="button"
      >
        Reset
      </button>

    </div>    <aside id="sideControls">

      <div class="controlGroup">
        <label for="scaleSlider">Scale</label>
        <input
          id="scaleSlider"
          type="range"
          min="0.1"
          max="3"
          step="0.01"
          value="1"
        >
      </div>

      <div class="controlGroup">
        <label for="xSlider">Position X</label>
        <input
          id="xSlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="ySlider">Position Y</label>
        <input
          id="ySlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="zSlider">Position Z</label>
        <input
          id="zSlider"
          type="range"
          min="-3"
          max="3"
          step="0.01"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="rotateXSlider">Rotation X</label>
        <input
          id="rotateXSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="rotateYSlider">Rotation Y</label>
        <input
          id="rotateYSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="rotateZSlider">Rotation Z</label>
        <input
          id="rotateZSlider"
          type="range"
          min="-180"
          max="180"
          step="1"
          value="0"
        >
      </div>

      <div class="controlGroup">
        <label for="exportFormat">Export Format</label>

        <select id="exportFormat">
          <option value="glb">GLB</option>
          <option value="obj">OBJ</option>
        </select>
      </div>

    </aside>

  </main>

  <script
    type="module"
    src="./js/app.js?v=1"
  ></script>

</body>
</html>
