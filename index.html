<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera + Real Face Tracking</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    display:none;
}

#cameraCanvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;

    padding:16px 28px;
    font-size:20px;
    font-weight:bold;

    border:0;
    border-radius:10px;

    background:white;
    color:black;
}

#info{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:10;

    padding:10px 16px;

    background:rgba(0,0,0,.75);
    color:white;

    border-radius:10px;

    font-family:Arial,sans-serif;
    font-size:16px;

    text-align:center;
}

</style>

<!--
====================================================
FIXED MEDIAPIPE FACE MESH
====================================================
-->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"
crossorigin="anonymous">
</script>

</head>

<body>

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<canvas id="cameraCanvas"></canvas>

<canvas id="three"></canvas>

<div id="info">
    CAMERA READY
</div>

<button id="open">
    OPEN CAMERA
</button>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById("camera");

const cameraCanvas =
    document.getElementById("cameraCanvas");

const cameraCtx =
    cameraCanvas.getContext("2d");

const threeCanvas =
    document.getElementById("three");

const button =
    document.getElementById("open");

const info =
    document.getElementById("info");


/* ==================================================
   THREE.JS
================================================== */

const scene =
    new THREE.Scene();


const camera3D =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera3D.position.z = 5;


const renderer =
    new THREE.WebGLRenderer({

        canvas:threeCanvas,

        alpha:true,

        antialias:true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* ==================================================
   LIGHT
================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    2,
    3,
    5
);

scene.add(light);


/* ==================================================
   SMALL CUBE
================================================== */

const geometry =
    new THREE.BoxGeometry(
        0.45,
        0.45,
        0.45
    );


const material =
    new THREE.MeshNormalMaterial();


const cube =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(cube);


/* ==================================================
   FACE TARGET VALUES
================================================== */

let targetX = 0;
let targetY = 0;

let targetRotX = 0;
let targetRotY = 0;
let targetRotZ = 0;

let faceFound = false;


/* ==================================================
   MEDIAPIPE FACE MESH
================================================== */

const faceMesh =
    new window.FaceMesh({

        locateFile:function(file){

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/" +
            file;

        }

    });


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


/* ==================================================
   FACE RESULTS
================================================== */

faceMesh.onResults(function(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        faceFound = false;

        info.innerText =
            "FACE NOT FOUND";

        return;
    }


    faceFound = true;


    const landmarks =
        results.multiFaceLandmarks[0];


    /* ==============================================
       NOSE POSITION
    ============================================== */

    const nose =
        landmarks[1];


    /*
    Camera display is mirrored.

    Therefore X is reversed.
    */

    const x =
        1 - nose.x;

    const y =
        nose.y;


    /*
    Position.
    Smaller movement than before.
    */

    targetX =
        (x - 0.5) * 2.8;

    targetY =
        -(y - 0.5) * 2.2;


    /* ==============================================
       EYE LINE
    ============================================== */

    const leftEye =
        landmarks[33];

    const rightEye =
        landmarks[263];


    const eyeCenterX =
        (leftEye.x + rightEye.x) / 2;

    const eyeCenterY =
        (leftEye.y + rightEye.y) / 2;


    const eyeWidth =
        Math.max(
            Math.abs(
                rightEye.x - leftEye.x
            ),
            0.001
        );


    /* ==============================================
       HEAD YAW
    ============================================== */

    let yaw =
        (nose.x - eyeCenterX) /
        eyeWidth;


    yaw =
        THREE.MathUtils.clamp(
            yaw,
            -0.7,
            0.7
        );


    /* ==============================================
       HEAD ROLL
    ============================================== */

    const dx =
        rightEye.x - leftEye.x;

    const dy =
        rightEye.y - leftEye.y;


    let roll =
        Math.atan2(
            dy,
            dx
        );


    /* ==============================================
       HEAD PITCH
    ============================================== */

    const chin =
        landmarks[152];


    const faceHeight =
        Math.max(
            Math.abs(
                chin.y - eyeCenterY
            ),
            0.001
        );


    let pitch =
        (nose.y - eyeCenterY) /
        faceHeight;


    pitch =
        THREE.MathUtils.clamp(
            pitch,
            -0.7,
            0.7
        );


    /* ==============================================
       ROTATION
    ============================================== */

    targetRotY =
        -yaw * 2.0;

    targetRotX =
        pitch * 1.2;

    targetRotZ =
        -roll * 1.5;


    info.innerText =
        "FACE TRACKING ✓";

});


/* ==================================================
   OPEN CAMERA
================================================== */

button.onclick =
async function(){

    try{

        info.innerText =
            "OPENING CAMERA...";


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        button.style.display =
            "none";


        info.innerText =
            "LOADING FACE TRACKER...";


        drawCamera();

        processFace();


    }
    catch(error){

        info.innerText =
            "CAMERA ERROR";

        alert(
            "CAMERA ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};


/* ==================================================
   WORKING CAMERA DISPLAY
================================================== */

function drawCamera(){

    if(
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        const vw =
            video.videoWidth;

        const vh =
            video.videoHeight;


        const cw =
            window.innerWidth;

        const ch =
            window.innerHeight;


        if(
            cameraCanvas.width !== cw ||
            cameraCanvas.height !== ch
        ){

            cameraCanvas.width =
                cw;

            cameraCanvas.height =
                ch;

        }


        const scale =
            Math.max(
                cw / vw,
                ch / vh
            );


        const drawW =
            vw * scale;

        const drawH =
            vh * scale;


        const x =
            (cw - drawW) / 2;

        const y =
            (ch - drawH) / 2;


        cameraCtx.clearRect(
            0,
            0,
            cw,
            ch
        );


        /*
        =============================================
        THIS IS THE CAMERA VERSION THAT WAS WORKING
        =============================================
        */

        cameraCtx.save();

        cameraCtx.translate(
            cw,
            0
        );

        cameraCtx.scale(
            -1,
            1
        );


        cameraCtx.drawImage(
            video,

            0,
            0,
            vw,
            vh,

            x,
            y,
            drawW,
            drawH
        );


        cameraCtx.restore();

    }


    requestAnimationFrame(
        drawCamera
    );

}


/* ==================================================
   FACE PROCESS LOOP
================================================== */

let lastTime = -1;


async function processFace(){

    if(
        video.readyState >= 2 &&
        video.currentTime !== lastTime
    ){

        lastTime =
            video.currentTime;


        try{

            await faceMesh.send({
                image:video
            });

        }
        catch(error){

            console.error(
                "FACE MESH ERROR:",
                error
            );

            info.innerText =
                "FACE TRACKER ERROR";

        }

    }


    requestAnimationFrame(
        processFace
    );

}


/* ==================================================
   THREE ANIMATION
================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    /*
    =============================================
    FACE POSITION
    =============================================
    */

    cube.position.x +=
        (
            targetX -
            cube.position.x
        ) * 0.20;


    cube.position.y +=
        (
            targetY -
            cube.position.y
        ) * 0.20;


    /*
    =============================================
    FACE ROTATION
    =============================================
    */

    cube.rotation.x +=
        (
            targetRotX -
            cube.rotation.x
        ) * 0.20;


    cube.rotation.y +=
        (
            targetRotY -
            cube.rotation.y
        ) * 0.20;


    cube.rotation.z +=
        (
            targetRotZ -
            cube.rotation.z
        ) * 0.20;


    renderer.render(
        scene,
        camera3D
    );

}


animate();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    function(){

        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        cameraCanvas.width =
            window.innerWidth;

        cameraCanvas.height =
            window.innerHeight;

    }
);

</script>

</body>
</html>
