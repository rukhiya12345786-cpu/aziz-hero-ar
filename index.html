<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AZEEZ AR STUDIO</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

#container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

#panel {
  position: fixed;
  z-index: 10000;
  top: 12px;
  left: 12px;
  width: min(290px, calc(100vw - 24px));
  max-height: calc(100dvh - 75px);
  overflow-y: auto;
  padding: 14px;
  border: 1px solid #415675;
  border-radius: 14px;
  background: rgba(9, 17, 31, .94);
  box-shadow: 0 5px 25px #0009;
}

#panel.hidden {
  display: none;
}

#panel h2 {
  text-align: center;
  font-size: 19px;
  color: #55ceff;
  margin: 2px 0 14px;
  letter-spacing: 1px;
}

.section-title {
  color: #69d9ff;
  font-size: 12px;
  font-weight: bold;
  margin: 15px 0 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.grid.three {
  grid-template-columns: repeat(3, 1fr);
}

button, .file-button {
  min-height: 40px;
  padding: 9px 7px;
  border: 1px solid #496181;
  border-radius: 8px;
  background: #243a58;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  cursor: pointer;
}

button.active {
  background: #087ed1;
  border-color: #55ceff;
}

button:active, .file-button:active {
  opacity: .7;
}

.file-button {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #29496c;
}

input[type="file"] {
  display: none;
}

#sizeSlider {
  width: 100%;
  height: 38px;
  accent-color: #00c8ff;
}

#sizeValue {
  color: #a9eaff;
  font-size: 12px;
  text-align: center;
}

#panelToggle {
  position: fixed;
  z-index: 10002;
  top: 12px;
  right: 12px;
  min-width: 105px;
  background: #087ed1;
  border-color: #55ceff;
}

#status {
  margin-top: 12px;
  padding: 9px;
  border-radius: 7px;
  background: #101e32;
  color: #b9eaff;
  font-size: 11px;
  text-align: center;
  overflow-wrap: anywhere;
}

@media (orientation: landscape) {
  #panel {
    width: 265px;
    max-height: calc(100dvh - 20px);
  }
}
</style>
</head>

<body>

<div id="container"></div>

<button id="panelToggle">HIDE PANEL</button>

<div id="panel">

  <h2>AZEEZ AR STUDIO</h2>

  <div class="section-title">CAMERA</div>
  <div class="grid">
    <button id="switchCamera">SWITCH CAMERA</button>
    <button id="fullscreenBtn">FULL SCREEN</button>
  </div>

  <div class="section-title">IMPORT 3D MODEL</div>
  <div class="grid">
    <label class="file-button" for="gltfFile">GLTF / GLB</label>
    <label class="file-button" for="objFile">OBJ</label>
    <label class="file-button" for="fbxFile">FBX</label>
    <button id="removeModel">REMOVE SELECTED</button>
  </div>

  <input id="gltfFile" type="file" accept=".gltf,.glb">
  <input id="objFile" type="file" accept=".obj">
  <input id="fbxFile" type="file" accept=".fbx">

  <div class="section-title">IMPORT IMAGE / VIDEO</div>
  <div class="grid">
    <label class="file-button" for="imageFile">IMAGE</label>
    <label class="file-button" for="videoFile">VIDEO</label>
  </div>

  <input id="imageFile" type="file" accept="image/*">
  <input id="videoFile" type="file" accept="video/*">

  <div class="section-title">3D TRANSFORM GIZMO</div>
  <div class="grid three">
    <button id="moveBtn" class="active">MOVE</button>
    <button id="rotateBtn">ROTATE</button>
    <button id="scaleBtn">SCALE</button>
  </div>

  <div class="section-title">MODEL SIZE</div>
  <input id="sizeSlider" type="range" min="1" max="5000" value="1000">
  <div id="sizeValue">SIZE: 100%</div>

  <div class="section-title">GIZMO DISPLAY</div>
  <button id="gizmoToggle" style="width:100%">HIDE GIZMO</button>

  <div id="status">Preparing AR...</div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";

import { OBJLoader } from
  "three/addons/loaders/OBJLoader.js";

import { FBXLoader } from
  "three/addons/loaders/FBXLoader.js";

import { TransformControls } from
  "three/addons/controls/TransformControls.js";

import { MindARThree } from "mindar-face-three";


/* =====================================
   GLOBAL VARIABLES
===================================== */

let mindarThree = null;
let avatar = null;
let anchor = null;

let renderer = null;
let scene = null;
let camera = null;

let transformControls = null;
let gizmoHelper = null;

let activeObject = null;
let importedObjects = [];

let currentMode = "translate";
let gizmosVisible = true;
let cameraStarted = false;
let cameraSwitching = false;

const container = document.querySelector("#container");
const statusBox = document.querySelector("#status");
const panel = document.querySelector("#panel");

const sizeSlider = document.querySelector("#sizeSlider");
const sizeValue = document.querySelector("#sizeValue");

function setStatus(message) {
  statusBox.textContent = message;
}


/* =====================================
   RACOON FACE AVATAR
===================================== */

class Avatar {

  constructor() {
    this.gltf = null;
    this.morphTargetMeshes = [];
  }

  async init() {

    const loader = new GLTFLoader();

    this.gltf = await loader.loadAsync(
      "https://assets.codepen.io/9177687/raccoon_head.glb"
    );

    this.gltf.scene.traverse((object) => {

      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        this.morphTargetMeshes.push(object);
      }

    });
  }

  updateBlendshapes(blendshapes) {

    if (!blendshapes?.categories) return;

    const values = new Map();

    for (const category of blendshapes.categories) {
      values.set(category.categoryName, category.score);
    }

    for (const mesh of this.morphTargetMeshes) {

      const dictionary = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      if (!dictionary || !influences) continue;

      for (const [name, value] of values) {

        const index = dictionary[name];

        if (index !== undefined) {
          influences[index] = value;
        }

      }
    }
  }
}


/* =====================================
   INITIALIZE MINDAR SCENE
===================================== */

async function setupAR() {

  mindarThree = new MindARThree({
    container: container
  });

  renderer = mindarThree.renderer;
  scene = mindarThree.scene;
  camera = mindarThree.camera;

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      1.4
    )
  );

  const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    1
  );

  directionalLight.position.set(0, 1, 2);
  scene.add(directionalLight);

  anchor = mindarThree.addAnchor(1);

  avatar = new Avatar();
  await avatar.init();

  avatar.gltf.scene.scale.set(2, 2, 2);
  anchor.group.add(avatar.gltf.scene);


  /* TransformControls */

  transformControls = new TransformControls(
    camera,
    renderer.domElement
  );

  gizmoHelper = transformControls.getHelper();

  scene.add(gizmoHelper);

  transformControls.setMode(currentMode);
  transformControls.setSize(1.5);

  gizmoHelper.visible = false;

  transformControls.addEventListener(
    "objectChange",
    updateSizeLabel
  );

  setStatus("AR scene ready");
}


/* =====================================
   AUTOMATIC FRONT CAMERA START
===================================== */

async function startCamera() {

  try {

    setStatus("Starting camera...");

    await setupAR();

    await mindarThree.start();

    cameraStarted = true;

    renderer.setAnimationLoop(() => {

      const estimate = mindarThree.getLatestEstimate();

      if (estimate?.blendshapes && avatar) {
        avatar.updateBlendshapes(estimate.blendshapes);
      }

      renderer.render(scene, camera);

    });

    setStatus("Camera running");

  } catch (error) {

    console.error("AR startup error:", error);

    setStatus("CAMERA ERROR: " + error.message);

  }
}


/* =====================================
   SWITCH FRONT / BACK CAMERA
===================================== */

document
  .querySelector("#switchCamera")
  .addEventListener("click", async () => {

    if (!cameraStarted || cameraSwitching) return;

    try {

      cameraSwitching = true;

      setStatus("Switching camera...");

      await mindarThree.switchCamera();

      setStatus("Camera switched");

    } catch (error) {

      console.error(error);

      setStatus("SWITCH ERROR: " + error.message);

    } finally {

      cameraSwitching = false;

    }

  });


/* =====================================
   FULLSCREEN
===================================== */

document
  .querySelector("#fullscreenBtn")
  .addEventListener("click", async () => {

    try {

      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }

    } catch (error) {

      setStatus("Fullscreen unavailable");

    }

  });


/* =====================================
   HIDE / SHOW ALL CONTROLS
===================================== */

document
  .querySelector("#panelToggle")
  .addEventListener("click", () => {

    panel.classList.toggle("hidden");

    document.querySelector("#panelToggle").textContent =
      panel.classList.contains("hidden")
        ? "SHOW PANEL"
        : "HIDE PANEL";

  });


/* =====================================
   GIZMO MODE BUTTONS
===================================== */

function setGizmoMode(mode, buttonId) {

  currentMode = mode;

  if (transformControls) {
    transformControls.setMode(mode);
  }

  document
    .querySelectorAll("#moveBtn, #rotateBtn, #scaleBtn")
    .forEach(button => button.classList.remove("active"));

  document.querySelector("#" + buttonId).classList.add("active");

}

document.querySelector("#moveBtn").addEventListener(
  "click",
  () => setGizmoMode("translate", "moveBtn")
);

document.querySelector("#rotateBtn").addEventListener(
  "click",
  () => setGizmoMode("rotate", "rotateBtn")
);

document.querySelector("#scaleBtn").addEventListener(
  "click",
  () => setGizmoMode("scale", "scaleBtn")
);


/* =====================================
   GIZMO VISIBILITY
===================================== */

document
  .querySelector("#gizmoToggle")
  .addEventListener("click", () => {

    gizmosVisible = !gizmosVisible;

    if (gizmoHelper) {
      gizmoHelper.visible =
        gizmosVisible && !!activeObject;
    }

    document.querySelector("#gizmoToggle").textContent =
      gizmosVisible ? "HIDE GIZMO" : "SHOW GIZMO";

  });


/* =====================================
   SIZE LABEL
===================================== */

function updateSizeLabel() {

  if (!activeObject) return;

  sizeValue.textContent =
    "SIZE: " + Math.round(Number(sizeSlider.value) / 10) + "%";

}
/* =====================================
   IMPORTED MODEL HELPERS
===================================== */

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const fbxLoader = new FBXLoader();

function getObjectCenterAndSize(object) {

  object.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(object);

  if (box.isEmpty()) {
    throw new Error("Model contains no visible geometry");
  }

  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error("Invalid model dimensions");
  }

  return { box, center, maxDimension };
}


/* =====================================
   PREPARE AND ADD IMPORTED OBJECT
===================================== */

function prepareModel(object, name, sourceURL = null) {

  if (!anchor) {
    throw new Error("AR camera is not ready");
  }

  const { center, maxDimension } =
    getObjectCenterAndSize(object);

  const wrapper = new THREE.Group();

  wrapper.name = name;

  // Center imported geometry inside its wrapper.
  object.position.sub(center);

  // Normalize different model sizes.
  object.scale.multiplyScalar(1 / maxDimension);

  wrapper.add(object);
  anchor.group.add(wrapper);

  wrapper.userData.sourceURL = sourceURL;
  wrapper.userData.baseScale = new THREE.Vector3(1, 1, 1);

  importedObjects.push(wrapper);

  selectObject(wrapper);

  setStatus(name + " imported successfully");

  return wrapper;
}


/* =====================================
   SELECT IMPORTED OBJECT
===================================== */

function selectObject(object) {

  if (!object || !transformControls) return;

  transformControls.detach();

  activeObject = object;

  const base = object.userData.baseScale;

  if (base) {
    object.scale.copy(base);
  }

  sizeSlider.value = 1000;

  transformControls.attach(object);
  transformControls.setMode(currentMode);

  gizmoHelper.visible = gizmosVisible;

  updateSizeLabel();
}


/* =====================================
   SIZE SLIDER
===================================== */

sizeSlider.addEventListener("input", () => {

  if (!activeObject) {
    setStatus("Import a model first");
    return;
  }

  const base = activeObject.userData.baseScale;

  if (!base) return;

  // 1000 = 100%, 1 = 0.1%, 5000 = 500%.
  const multiplier = Number(sizeSlider.value) / 1000;

  activeObject.scale.set(
    base.x * multiplier,
    base.y * multiplier,
    base.z * multiplier
  );

  sizeValue.textContent =
    "SIZE: " + Math.round(multiplier * 100) + "%";

});


/* =====================================
   REMOVE SELECTED MODEL
===================================== */

document
  .querySelector("#removeModel")
  .addEventListener("click", () => {

    if (!activeObject) {
      setStatus("No imported model selected");
      return;
    }

    const removedObject = activeObject;

    transformControls.detach();

    anchor.group.remove(removedObject);

    importedObjects = importedObjects.filter(
      item => item !== removedObject
    );

    const sourceURL = removedObject.userData.sourceURL;

    if (sourceURL) {
      URL.revokeObjectURL(sourceURL);
    }

    removedObject.traverse((child) => {

      if (child.geometry) {
        child.geometry.dispose();
      }

      if (child.material) {

        const materials = Array.isArray(child.material)
          ? child.material
          : [child.material];

        materials.forEach(material => {

          for (const key in material) {

            const value = material[key];

            if (value && value.isTexture) {
              value.dispose();
            }

          }

          material.dispose();

        });

      }

    });

    activeObject = null;

    gizmoHelper.visible = false;

    sizeSlider.value = 1000;
    sizeValue.textContent = "SIZE: 100%";

    setStatus("Selected imported model removed");

  });


/* =====================================
   GLTF / GLB IMPORT
===================================== */

document
  .querySelector("#gltfFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    let objectURL = null;

    try {

      setStatus("Loading GLTF / GLB...");

      objectURL = URL.createObjectURL(file);

      const gltf = await gltfLoader.loadAsync(objectURL);

      prepareModel(
        gltf.scene,
        file.name,
        objectURL
      );

      objectURL = null;

    } catch (error) {

      console.error(error);

      setStatus("GLTF / GLB ERROR: " + error.message);

    } finally {

      if (objectURL) {
        URL.revokeObjectURL(objectURL);
      }

      event.target.value = "";

    }

  });


/* =====================================
   OBJ IMPORT
===================================== */

document
  .querySelector("#objFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    try {

      setStatus("Loading OBJ...");

      const text = await file.text();

      const object = objLoader.parse(text);

      prepareModel(object, file.name);

    } catch (error) {

      console.error(error);

      setStatus("OBJ ERROR: " + error.message);

    } finally {

      event.target.value = "";

    }

  });


/* =====================================
   FBX IMPORT
===================================== */

document
  .querySelector("#fbxFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    try {

      setStatus("Loading FBX...");

      const buffer = await file.arrayBuffer();

      const object = fbxLoader.parse(buffer, "");

      prepareModel(object, file.name);

    } catch (error) {

      console.error(error);

      setStatus("FBX ERROR: " + error.message);

    } finally {

      event.target.value = "";

    }

  });


/* =====================================
   IMAGE IMPORT
===================================== */

document
  .querySelector("#imageFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    let objectURL = null;

    try {

      setStatus("Loading image...");

      objectURL = URL.createObjectURL(file);

      const texture = await new THREE.TextureLoader()
        .loadAsync(objectURL);

      texture.colorSpace = THREE.SRGBColorSpace;

      const width = texture.image.width || 1;
      const height = texture.image.height || 1;

      const aspect = width / height;

      const geometry = new THREE.PlaneGeometry(
        aspect,
        1
      );

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide
      });

      const image = new THREE.Mesh(geometry, material);

      prepareModel(image, file.name, objectURL);

      objectURL = null;

    } catch (error) {

      console.error(error);

      setStatus("IMAGE ERROR: " + error.message);

    } finally {

      if (objectURL) {
        URL.revokeObjectURL(objectURL);
      }

      event.target.value = "";

    }

  });


/* =====================================
   VIDEO IMPORT
===================================== */

document
  .querySelector("#videoFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    let objectURL = null;
    let video = null;

    try {

      setStatus("Loading video...");

      objectURL = URL.createObjectURL(file);

      video = document.createElement("video");

      video.src = objectURL;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.autoplay = true;

      await new Promise((resolve, reject) => {

        video.onloadedmetadata = resolve;

        video.onerror = () => {
          reject(new Error("Video could not be loaded"));
        };

      });

      await video.play();

      const texture = new THREE.VideoTexture(video);

      texture.colorSpace = THREE.SRGBColorSpace;

      const aspect =
        (video.videoWidth || 1) /
        (video.videoHeight || 1);

      const geometry = new THREE.PlaneGeometry(aspect, 1);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      const videoPlane = new THREE.Mesh(
        geometry,
        material
      );

      videoPlane.userData.videoElement = video;

      const wrapper = prepareModel(
        videoPlane,
        file.name,
        objectURL
      );

      wrapper.userData.videoElement = video;

      objectURL = null;
      video = null;

    } catch (error) {

      console.error(error);

      if (video) {
        video.pause();
        video.src = "";
      }

      setStatus("VIDEO ERROR: " + error.message);

    } finally {

      if (objectURL) {
        URL.revokeObjectURL(objectURL);
      }

      event.target.value = "";

    }

  });


/* =====================================
   CLEAN VIDEO WHEN MODEL REMOVED
===================================== */

const originalRemoveHandler =
  document.querySelector("#removeModel");

originalRemoveHandler.addEventListener("click", () => {

  // The main remove handler removes the selected model.
  // Video cleanup is handled by the selected object's resources.

});


/* =====================================
   SELECT IMPORTED MODEL BY TOUCH
===================================== */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown", (event) => {

  if (!cameraStarted || importedObjects.length === 0) return;

  if (transformControls && transformControls.dragging) return;

  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x =
    ((event.clientX - rect.left) / rect.width) * 2 - 1;

  pointer.y =
    -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(
    importedObjects,
    true
  );

  if (!hits.length) return;

  let selected = hits[0].object;

  while (
    selected.parent &&
    !importedObjects.includes(selected)
  ) {
    selected = selected.parent;
  }

  if (importedObjects.includes(selected)) {
    selectObject(selected);
  }

});


/* =====================================
   START CAMERA AUTOMATICALLY
===================================== */

startCamera();

</script>
</body>
</html>
