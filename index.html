<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera and 3D Head Tracking</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#camera{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#three{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#open{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:10;
    padding:16px 28px;
    font-size:20px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    background:white;
    color:black;
}

#info{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:10;
    padding:10px 16px;
    background:rgba(0,0,0,0.7);
    color:white;
    border-radius:10px;
    font-family:Arial,sans-serif;
    font-size:15px;
    text-align:center;
}

</style>

</head>

<body>

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<canvas id="three"></canvas>

<div id="info">
    READY
</div>

<button id="open">
    OPEN CAMERA
</button>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    FaceLandmarker,
    FilesetResolver
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


const video =
document.getElementById("camera");

const canvas =
document.getElementById("three");

const button =
document.getElementById("open");

const info =
document.getElementById("info");


/* THREE */

const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera3D.position.set(
    0,
    0,
    4
);


const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    alpha:true,
    antialias:true
});


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* LIGHT */

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


const ambient =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambient);


/* HEAD ANCHOR */

const headAnchor =
new THREE.Group();

scene.add(headAnchor);


/* CUBE */

const geometry =
new THREE.BoxGeometry(
    1,
    1,
    1
);


const material =
new THREE.MeshNormalMaterial();


const cube =
new THREE.Mesh(
    geometry,
    material
);


/*
    Cube is a child of the head.
    There is NO independent cube rotation.
*/

cube.position.set(
    0,
    0,
    0
);


headAnchor.add(cube);


/* FACE LANDMARKER */

let faceLandmarker = null;

let lastVideoTime = -1;


async function setupFaceTracking(){

    info.innerText =
    "LOADING FACE TRACKING...";


    const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    faceLandmarker =
    await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"
            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:0.5,

            minFacePresenceConfidence:0.5,

            minTrackingConfidence:0.5,

            outputFaceBlendshapes:false,

            outputFacialTransformationMatrixes:true
        }
    );


    info.innerText =
    "FACE TRACKING READY";
}


/* TRACK FACE */

function trackFace(){

    if(
        !faceLandmarker ||
        video.readyState < 2
    ){

        requestAnimationFrame(
            trackFace
        );

        return;
    }


    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        const result =
        faceLandmarker.detectForVideo(
            video,
            performance.now()
        );


        if(
            result.facialTransformationMatrixes &&
            result.facialTransformationMatrixes.length > 0
        ){

            const data =
            result.facialTransformationMatrixes[0].data;


            const faceMatrix =
            new THREE.Matrix4();


            faceMatrix.fromArray(
                data
            );


            const facePosition =
            new THREE.Vector3();


            const faceQuaternion =
            new THREE.Quaternion();


            const faceScale =
            new THREE.Vector3();


            faceMatrix.decompose(
                facePosition,
                faceQuaternion,
                faceScale
            );


            /*
                MediaPipe face coordinates
                are converted into the
                Three.js coordinate system.
            */

            headAnchor.position.set(
                facePosition.x * 0.035,
                -facePosition.y * 0.035,
                -facePosition.z * 0.035
            );


            /*
                Head rotation comes ONLY
                from the detected face.
            */

            const correction =
            new THREE.Quaternion().setFromEuler(
                new THREE.Euler(
                    0,
                    Math.PI,
                    0
                )
            );


            headAnchor.quaternion
                .copy(faceQuaternion)
                .multiply(correction);


            /*
                Keep the cube size stable.
            */

            headAnchor.scale.set(
                1,
                1,
                1
            );


            info.innerText =
            "FACE TRACKING ON";

        }

        else{

            info.innerText =
            "NO FACE";

        }

    }


    renderer.render(
        scene,
        camera3D
    );


    requestAnimationFrame(
        trackFace
    );
}


/* CAMERA */

button.onclick =
async function(){

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        button.style.display =
        "none";


        info.innerText =
        "STARTING...";


        await setupFaceTracking();


        trackFace();

    }

    catch(error){

        info.innerText =
        "ERROR";


        alert(
            "ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

};


/* RESIZE */

window.addEventListener(
    "resize",
    function(){

        camera3D.aspect =
        window.innerWidth /
        window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
