<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Face Detector - Step 2</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial;
}

#video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

#overlay{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#status{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  padding:10px 16px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:16px;
  font-weight:bold;
}

#start{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:15px 25px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="overlay"></canvas>

<div id="status">READY</div>

<button id="start">START CAMERA</button>

<script type="module">

import {
  FaceDetector,
  FilesetResolver
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("overlay");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const start =
  document.getElementById("start");

let detector = null;
let stream = null;
let lastTime = -1;


/* =========================
   SIZE
========================= */

function resize(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =========================
   START
========================= */

start.onclick = async function(){

  try{

    status.textContent =
      "Loading tracker...";


    /* LOAD WASM */

    const vision =
      await FilesetResolver.forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

      );


    status.textContent =
      "Loading face detector...";


    /* CREATE DETECTOR */

    detector =
      await FaceDetector.createFromOptions(

        vision,

        {

          baseOptions:{

            modelAssetPath:

            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

          },

          runningMode:"VIDEO",

          minDetectionConfidence:0.5

        }

      );


    /* CAMERA */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });


    video.srcObject =
      stream;

    await video.play();


    status.textContent =
      "Camera ON — searching face...";


    start.style.display =
      "none";


    requestAnimationFrame(
      detect
    );

  }

  catch(error){

    console.error(error);

    status.textContent =
      "ERROR";

    alert(
      "ERROR:\n\n" +
      error.message
    );

  }

};


/* =========================
   FACE DETECTION
========================= */

function detect(){

  requestAnimationFrame(
    detect
  );


  if(
    !detector ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;

  }


  if(
    video.currentTime ===
    lastTime
  ){

    return;

  }

  lastTime =
    video.currentTime;


  try{

    const result =
      detector.detectForVideo(

        video,

        performance.now()

      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if(
      result.detections &&
      result.detections.length > 0
    ){

      status.textContent =
        "🟢 FACE DETECTED";


      const box =
        result.detections[0].boundingBox;


      const scaleX =
        canvas.width /
        video.videoWidth;

      const scaleY =
        canvas.height /
        video.videoHeight;


      /*
        क्योंकि camera mirror है,
        box को horizontal mirror करेंगे.
      */

      const x =
        canvas.width -
        (box.originX + box.width) *
        scaleX;

      const y =
        box.originY *
        scaleY;

      const w =
        box.width *
        scaleX;

      const h =
        box.height *
        scaleY;


      ctx.strokeStyle =
        "#00ff66";

      ctx.lineWidth =
        5;

      ctx.strokeRect(
        x,
        y,
        w,
        h
      );

    }

    else{

      status.textContent =
        "🔴 FACE NOT DETECTED";

    }

  }

  catch(error){

    console.error(
      "Detection error:",
      error
    );

  }

}

</script>

</body>
</html>
