<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Azeez AR Head Tracker</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    touch-action: manipulation;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 1;
    transform-origin: center center;
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    transform-origin: center center;
}

#faceLandmarkCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
    transform-origin: center center;
    display: none;
}

#status {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 20px);
    max-width: 620px;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
    z-index: 100;
    pointer-events: none;
}

#topBar {
    position: absolute;
    top: 48px;
    left: 8px;
    right: 8px;
    z-index: 90;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

button {
    border: 0;
    outline: 0;
    border-radius: 8px;
    padding: 8px 10px;
    min-height: 34px;
    background: rgba(20, 20, 20, 0.9);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

.primary {
    background: #1769aa;
}

.greenButton {
    background: #168a45;
}

.redButton {
    background: #a52b2b;
}

.orangeButton {
    background: #a96a18;
}

.blueButton {
    background: #245f9e;
}

#controlPanel {
    position: absolute;
    left: 7px;
    right: 7px;
    bottom: 7px;
    z-index: 80;
    max-height: 48vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 10px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

#controlPanel.hidden {
    display: none;
}

.panelTitle {
    margin: 0 0 8px;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
}

.sectionTitle {
    margin: 9px 0 6px;
    padding: 6px 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.11);
    font-size: 11px;
    font-weight: 800;
    text-align: center;
}

.controlGroup {
    width: 100%;
}

.sliderRow {
    display: grid;
    grid-template-columns: 82px minmax(80px, 1fr) 48px 46px;
    align-items: center;
    gap: 5px;
    width: 100%;
    min-height: 38px;
    margin: 3px 0;
    padding: 3px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.035);
}

.sliderRow.hiddenRow {
    display: none;
}

.sliderRow label {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 10px;
    font-weight: 700;
}

.sliderRow input[type="range"] {
    width: 100%;
    min-width: 0;
    height: 28px;
    margin: 0;
    accent-color: #35a7ff;
}

.sliderValue {
    min-width: 44px;
    text-align: center;
    color: #7fcaff;
    font-size: 10px;
    font-weight: 700;
}

.hideRowButton {
    min-width: 44px;
    min-height: 28px;
    padding: 4px;
    border-radius: 6px;
    background: #333;
    font-size: 9px;
}

#modelFileInput {
    width: 100%;
    max-width: 100%;
    padding: 7px;
    border-radius: 8px;
    background: rgba(30, 30, 30, 0.95);
    color: #fff;
    font-size: 10px;
}

#bottomActions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
}

#bottomActions button {
    flex: 1 1 105px;
}

#showControlsButton {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 110;
    display: none;
}

#showControlsButton.visible {
    display: block;
}

@media (max-width: 520px) {

    #topBar {
        top: 47px;
    }

    button {
        min-height: 32px;
        padding: 7px 8px;
        font-size: 10px;
    }

    #controlPanel {
        max-height: 53vh;
    }

    .sliderRow {
        grid-template-columns: 72px minmax(65px, 1fr) 43px 43px;
    }

    .sliderRow label {
        font-size: 9px;
    }

    .sliderValue {
        font-size: 9px;
    }

    .hideRowButton {
        font-size: 8px;
    }
}

</style>

</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

    <canvas id="faceLandmarkCanvas"></canvas>

    <div id="status">
        Azeez AR ready. Open camera to begin.
    </div>

    <div id="topBar">

        <button
            id="openCameraButton"
            class="primary">
            OPEN CAMERA
        </button>

        <button
            id="frontCameraButton">
            FRONT CAMERA
        </button>

        <button
            id="backCameraButton">
            BACK CAMERA
        </button>

        <button
            id="flipCameraButton">
            FLIP CAMERA
        </button>

        <button
            id="startTrackingButton"
            class="greenButton">
            START TRACKING
        </button>

        <button
            id="stopTrackingButton">
            STOP TRACKING
        </button>

        <button
            id="greenDotsButton"
            class="greenButton">
            GREEN DOTS: OFF
        </button>

        <button
            id="faceMeshButton">
            FACE MESH: OFF
        </button>

        <button
            id="recordButton"
            class="redButton">
            RECORD
        </button>

        <button
            id="captureButton">
            CAPTURE
        </button>

    </div>

    <div id="controlPanel">

        <div class="panelTitle">
            3D MODEL AND HEAD CONTROLS
        </div>

        <div class="sectionTitle">
            MODEL POSITION
        </div>

        <div class="controlGroup">

            <div
                class="sliderRow"
                id="modelScaleRow">

                <label for="scaleSlider">
                    MODEL SCALE
                </label>

                <input
                    id="scaleSlider"
                    type="range"
                    min="0.05"
                    max="10"
                    step="0.01"
                    value="1">

                <span
                    id="scaleValue"
                    class="sliderValue">
                    1.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelScaleRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelXRow">

                <label for="xSlider">
                    MODEL X
                </label>

                <input
                    id="xSlider"
                    type="range"
                    min="-5"
                    max="5"
                    step="0.01"
                    value="0">

                <span
                    id="xValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelXRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelYRow">

                <label for="ySlider">
                    MODEL Y
                </label>

                <input
                    id="ySlider"
                    type="range"
                    min="-5"
                    max="5"
                    step="0.01"
                    value="0">

                <span
                    id="yValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelYRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelZRow">

                <label for="zSlider">
                    MODEL Z
                </label>

                <input
                    id="zSlider"
                    type="range"
                    min="-8"
                    max="8"
                    step="0.01"
                    value="0">

                <span
                    id="zValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelZRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelRXRow">

                <label for="rotateXSlider">
                    ROTATE X
                </label>

                <input
                    id="rotateXSlider"
                    type="range"
                    min="-360"
                    max="360"
                    step="1"
                    value="0">

                <span
                    id="rotateXValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelRXRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelRYRow">

                <label for="rotateYSlider">
                    ROTATE Y
                </label>

                <input
                    id="rotateYSlider"
                    type="range"
                    min="-360"
                    max="360"
                    step="1"
                    value="0">

                <span
                    id="rotateYValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelRYRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="modelRZRow">

                <label for="rotateZSlider">
                    ROTATE Z
                </label>

                <input
                    id="rotateZSlider"
                    type="range"
                    min="-360"
                    max="360"
                    step="1"
                    value="0">

                <span
                    id="rotateZValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="modelRZRow">
                    HIDE
                </button>

            </div>

        </div>

        <div class="sectionTitle">
            HEAD TRACKING
        </div>

        <div class="controlGroup">

            <div
                class="sliderRow"
                id="headXRow">

                <label for="headXSlider">
                    HEAD X
                </label>

                <input
                    id="headXSlider"
                    type="range"
                    min="-5"
                    max="5"
                    step="0.01"
                    value="0">

                <span
                    id="headXValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headXRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="headYRow">

                <label for="headYSlider">
                    HEAD Y
                </label>

                <input
                    id="headYSlider"
                    type="range"
                    min="-5"
                    max="5"
                    step="0.01"
                    value="0">

                <span
                    id="headYValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headYRow">
                    HIDE
                </button>

            </div>            <div
                class="sliderRow"
                id="headZRow">

                <label for="headZSlider">
                    HEAD Z
                </label>

                <input
                    id="headZSlider"
                    type="range"
                    min="-8"
                    max="8"
                    step="0.01"
                    value="0">

                <span
                    id="headZValue"
                    class="sliderValue">
                    0.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headZRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="headDepthRow">

                <label for="headDepthSlider">
                    HEAD DEPTH
                </label>

                <input
                    id="headDepthSlider"
                    type="range"
                    min="0.1"
                    max="8"
                    step="0.01"
                    value="1">

                <span
                    id="headDepthValue"
                    class="sliderValue">
                    1.00
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headDepthRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="headPitchRow">

                <label for="headPitchSlider">
                    HEAD PITCH
                </label>

                <input
                    id="headPitchSlider"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">

                <span
                    id="headPitchValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headPitchRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="headYawRow">

                <label for="headYawSlider">
                    HEAD YAW
                </label>

                <input
                    id="headYawSlider"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">

                <span
                    id="headYawValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headYawRow">
                    HIDE
                </button>

            </div>

            <div
                class="sliderRow"
                id="headRollRow">

                <label for="headRollSlider">
                    HEAD ROLL
                </label>

                <input
                    id="headRollSlider"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0">

                <span
                    id="headRollValue"
                    class="sliderValue">
                    0°
                </span>

                <button
                    class="hideRowButton"
                    data-hide="headRollRow">
                    HIDE
                </button>

            </div>

        </div>

        <div class="sectionTitle">
            3D MODEL FILE
        </div>

        <div id="bottomActions">

            <input
                id="modelFileInput"
                type="file"
                accept=".glb,.gltf,.obj,.stl">

            <button
                id="exportButton"
                class="primary">
                EXPORT GLB
            </button>

            <button
                id="resetControlsButton">
                RESET MODEL
            </button>

            <button
                id="hideAllButton"
                class="orangeButton">
                HIDE ALL CONTROLS
            </button>

            <button
                id="showAllButton"
                class="greenButton">
                SHOW ALL CONTROLS
            </button>

        </div>

    </div>

    <button
        id="showControlsButton"
        class="greenButton">
        SHOW CONTROLS
    </button>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script
    type="module"
    src="./js/app.js">
</script>

</body>
</html>
