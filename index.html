
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR Studio</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #080d18;
}

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #080d18;
}

#threeCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#panel {
  position: absolute;
  z-index: 10;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 14px;
  border: 1px solid #35445e;
  border-radius: 14px;
  background: rgba(5, 12, 25, 0.88);
}

h2 {
  margin: 0 0 10px;
  font-size: 18px;
  letter-spacing: 1px;
}

#status {
  font-size: 13px;
  line-height: 1.6;
  color: #80ffb0;
  margin-bottom: 12px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 12px;
  color: white;
  background: #1767d2;
  font-size: 12px;
  font-weight: bold;
}

button:active {
  opacity: 0.7;
}

button:disabled {
  opacity: 0.5;
}

#bottomInfo {
  position: absolute;
  z-index: 10;
  bottom: 12px;
  left: 12px;
  right: 12px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(5, 12, 25, 0.88);
  font-size: 12px;
  line-height: 1.6;
}

#modelLabel {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #80ffb0;
  font-size: 12px;
  pointer-events: none;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <div id="modelLabel">3D DUMMY HEAD</div>
</div>

<div id="panel">
  <h2>AZEEZ AR STUDIO</h2>

  <div id="status">Model: Loading
Camera: Not started
Tracking: Waiting</div>

  <div class="controls">
    <button id="startButton">START CAMERA</button>
    <button id="switchButton">SWITCH CAMERA</button>
    <button id="trackingButton">TRACKING ON</button>
    <button id="headButton">HEAD ON</button>
    <button id="resetButton">RESET HEAD</button>
  </div>
</div>

<div id="bottomInfo">
  The 3D Dummy Head remains visible before face detection.
  Start the camera and move your head slowly.
</div>

<script type="module">

import * as THREE from "three";

// =====================================
// ELEMENTS
// =====================================

const video = document.getElementById("camera");
const canvas = document.getElementById("threeCanvas");
const statusBox = document.getElementById("status");
const modelLabel = document.getElementById("modelLabel");

const startButton = document.getElementById("startButton");
const switchButton = document.getElementById("switchButton");
const trackingButton = document.getElementById("trackingButton");
const headButton = document.getElementById("headButton");
const resetButton = document.getElementById("resetButton");

let stream = null;
let faceLandmarker = null;

let cameraFacing = "user";
let trackingEnabled = true;
let headVisible = true;
let cameraStarted = false;
let modelReady = false;

let trackingStatus = "Waiting";
let lastVideoTime = -1;
let cameraRequest = 0;

// =====================================
// STATUS
// =====================================

function updateStatus() {
  statusBox.textContent =
    "Model: " + (modelReady ? "3D Head Ready" : "Loading") +
    "\nCamera: " + (cameraStarted ? "Running" : "Not started") +
    "\nTracking: " + trackingStatus;
}

// =====================================
// THREE.JS SCENE
// =====================================

const scene = new THREE.Scene();

const camera3D = new THREE.OrthographicCamera(
  0,
  window.innerWidth,
  0,
  window.innerHeight,
  0.1,
  2000
);

camera3D.position.z = 1000;

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setClearColor(0x000000, 0);

// =====================================
// LIGHTING
// =====================================

scene.add(
  new THREE.AmbientLight(0xffffff, 2)
);

const keyLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(-200, -300, 800);
scene.add(keyLight);

// =====================================
// DUMMY HEAD
// =====================================

const headGroup = new THREE.Group();
scene.add(headGroup);

const skinMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9a17e,
  roughness: 0.72
});

const earMaterial = new THREE.MeshStandardMaterial({
  color: 0xc68e70,
  roughness: 0.8
});

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x24212a,
  roughness: 0.4
});

const mouthMaterial = new THREE.MeshStandardMaterial({
  color: 0x743d3d
});

// Main head

const headMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 48),
  skinMaterial
);

headMesh.scale.set(0.78, 1.0, 0.68);
headGroup.add(headMesh);

// Ears

function createEar(x) {
  const ear = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 24, 24),
    earMaterial
  );

  ear.position.set(x, 0.02, 0);
  ear.scale.set(0.55, 1.0, 0.45);

  headGroup.add(ear);
}

createEar(-0.78);
createEar(0.78);

// Eyes

function createEye(x) {
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 24, 24),
    eyeMaterial
  );

  eye.position.set(x, 0.18, 0.62);
  eye.scale.set(1.0, 0.65, 0.45);

  headGroup.add(eye);
}

createEye(-0.29);
createEye(0.29);

// Nose

const nose = new THREE.Mesh(
  new THREE.ConeGeometry(0.13, 0.38, 24),
  skinMaterial
);

nose.position.set(0, -0.03, 0.73);
nose.rotation.x = Math.PI / 2;
headGroup.add(nose);

// Mouth

const mouth = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 24, 12),
  mouthMaterial
);

mouth.position.set(0, -0.43, 0.58);
mouth.scale.set(1, 0.18, 0.25);
headGroup.add(mouth);

// =====================================
// INITIAL DUMMY HEAD POSITION
// =====================================

function resetHead() {
  headGroup.position.set(
    window.innerWidth / 2,
    window.innerHeight / 2,
    0
  );

  headGroup.rotation.set(0, 0, 0);
  headGroup.scale.set(120, 120, 120);
  headGroup.visible = headVisible;
}

resetHead();

modelReady = true;
updateStatus();

// =====================================
// RESIZE
// =====================================

function resizeScene() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  renderer.setSize(width, height);

  camera3D.left = 0;
  camera3D.right = width;
  camera3D.top = 0;
  camera3D.bottom = height;

  camera3D.updateProjectionMatrix();

  if (!cameraStarted) {
    resetHead();
  }
}

window.addEventListener("resize", resizeScene);

window.addEventListener("orientationchange", () => {
  setTimeout(resizeScene, 300);
});

// =====================================
// CAMERA MIRROR
// =====================================

function updateMirror() {
  const mirror = cameraFacing === "user"
    ? "scaleX(-1)"
    : "none";

  video.style.transform = mirror;
  canvas.style.transform = mirror;
}

// =====================================
// START CAMERA
// =====================================

async function startCamera() {
  const requestId = ++cameraRequest;

  startButton.disabled = true;

  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    cameraStarted = false;
    lastVideoTime = -1;

    updateStatus();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: cameraFacing,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    if (requestId !== cameraRequest) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    video.srcObject = stream;
    await video.play();

    cameraStarted = true;
    updateMirror();

    trackingStatus = "Loading face model";
    updateStatus();

    await initializeFaceTracking();

  } catch (error) {
    console.error("Camera error:", error);

    cameraStarted = false;
    trackingStatus = "Camera error: " + error.message;

    updateStatus();

  } finally {
    if (requestId === cameraRequest) {
      startButton.disabled = false;
    }
  }
}

// =====================================
// MEDIAPIPE INITIALIZATION
// =====================================

async function initializeFaceTracking() {
  try {
    if (faceLandmarker) {
      trackingStatus = "Looking for face";
      updateStatus();
      return;
    }

    trackingStatus = "Downloading MediaPipe";
    updateStatus();

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    );

    const fileset =
      await vision.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

    trackingStatus = "Loading face model";
    updateStatus();

    faceLandmarker =
      await vision.FaceLandmarker.createFromOptions(
        fileset,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "CPU"
          },

          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: true
        }
      );

    trackingStatus = "Looking for face";
    updateStatus();

  } catch (error) {
    console.error("Face model error:", error);

    trackingStatus = "Model error: " + error.message;
    updateStatus();
  }
}

// =====================================
// VIDEO COORDINATES
// =====================================

function getVideoCoordinates(point) {
  const width = window.innerWidth;
  const height = window.innerHeight;

  const videoWidth = video.videoWidth || width;
  const videoHeight = video.videoHeight || height;

  const scale = Math.max(
    width / videoWidth,
    height / videoHeight
  );

  const renderedWidth = videoWidth * scale;
  const renderedHeight = videoHeight * scale;

  const offsetX = (width - renderedWidth) / 2;
  const offsetY = (height - renderedHeight) / 2;

  return {
    x: point.x * renderedWidth + offsetX,
    y: point.y * renderedHeight + offsetY
  };
}

// =====================================
// FACE TRACKING UPDATE
// =====================================

function updateHead(landmarks) {
  if (!headVisible) {
    headGroup.visible = false;
    return;
  }

  headGroup.visible = true;

  if (!trackingEnabled) {
    trackingStatus = "Paused - Dummy Head visible";
    updateStatus();
    return;
  }

  if (!landmarks || landmarks.length < 264) {
    trackingStatus = "No face - Dummy Head visible";
    updateStatus();
    return;
  }

  const nosePoint = landmarks[1];
  const leftEye = landmarks[33];
  const rightEye = landmarks[263];

  const nosePosition = getVideoCoordinates(nosePoint);
  const leftPosition = getVideoCoordinates(leftEye);
  const rightPosition = getVideoCoordinates(rightEye);

  const eyeDistance = Math.hypot(
    rightPosition.x - leftPosition.x,
    rightPosition.y - leftPosition.y
  );

  const eyeCenterX =
    (leftPosition.x + rightPosition.x) / 2;

  const eyeCenterY =
    (leftPosition.y + rightPosition.y) / 2;

  const yawAmount =
    (nosePosition.x - eyeCenterX) /
    Math.max(eyeDistance, 1);

  const pitchAmount =
    (nosePosition.y - eyeCenterY) /
    Math.max(eyeDistance, 1);

  const rollAmount = Math.atan2(
    rightPosition.y - leftPosition.y,
    rightPosition.x - leftPosition.x
  );

  // Smooth position

  headGroup.position.x +=
    (nosePosition.x - headGroup.position.x) * 0.35;

  headGroup.position.y +=
    (nosePosition.y - headGroup.position.y) * 0.35;

  // Smooth scale

  const targetScale = THREE.MathUtils.clamp(
    eyeDistance * 2.5,
    70,
    350
  );

  const smoothScale =
    headGroup.scale.x +
    (targetScale - headGroup.scale.x) * 0.25;

  headGroup.scale.set(
    smoothScale,
    smoothScale,
    smoothScale
  );

  // Approximate rotation from face landmarks

  const targetYaw = THREE.MathUtils.clamp(
    yawAmount * 1.8,
    -0.9,
    0.9
  );

  const targetPitch = THREE.MathUtils.clamp(
    pitchAmount * 1.2,
    -0.7,
    0.7
  );

  headGroup.rotation.y +=
    (targetYaw - headGroup.rotation.y) * 0.25;

  headGroup.rotation.x +=
    (targetPitch - headGroup.rotation.x) * 0.25;

  headGroup.rotation.z +=
    (-rollAmount - headGroup.rotation.z) * 0.25;

  trackingStatus = "FACE DETECTED - Tracking active";
  updateStatus();
}

// =====================================
// TRACKING LOOP
// =====================================

function trackingLoop() {
  requestAnimationFrame(trackingLoop);

  if (
    cameraStarted &&
    faceLandmarker &&
    trackingEnabled &&
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {
    lastVideoTime = video.currentTime;

    try {
      const result = faceLandmarker.detectForVideo(
        video,
        performance.now()
      );

      if (
        result.faceLandmarks &&
        result.faceLandmarks.length > 0
      ) {
        updateHead(result.faceLandmarks[0]);
      } else {
        headGroup.visible = headVisible;

        trackingStatus =
          "Looking for face - Dummy Head visible";

        updateStatus();
      }

    } catch (error) {
      console.error("Tracking error:", error);

      trackingStatus = "Tracking error";
      updateStatus();
    }
  }

  renderer.render(scene, camera3D);
}

// =====================================
// BUTTON CONTROLS
// =====================================

startButton.addEventListener("click", async () => {
  await startCamera();
});

switchButton.addEventListener("click", async () => {
  cameraFacing =
    cameraFacing === "user"
      ? "environment"
      : "user";

  await startCamera();
});

trackingButton.addEventListener("click", () => {
  trackingEnabled = !trackingEnabled;

  trackingButton.textContent = trackingEnabled
    ? "TRACKING ON"
    : "TRACKING OFF";

  trackingStatus = trackingEnabled
    ? "Looking for face"
    : "Tracking paused - Dummy Head visible";

  updateStatus();
});

headButton.addEventListener("click", () => {
  headVisible = !headVisible;

  headGroup.visible = headVisible;

  headButton.textContent = headVisible
    ? "HEAD ON"
    : "HEAD OFF";

  modelLabel.classList.toggle(
    "hidden",
    !headVisible
  );
});

resetButton.addEventListener("click", () => {
  resetHead();

  trackingStatus = "Head position reset";
  updateStatus();
});

// =====================================
// START APPLICATION
// =====================================

resizeScene();
trackingLoop();
updateStatus();

</script>
</body>
</html>
