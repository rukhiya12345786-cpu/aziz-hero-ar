<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azeez AR - Face Tracking</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#cameraStream {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
    transform: scaleX(-1);
}

#webgl-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
}

#webgl-container canvas {
    width: 100% !important;
    height: 100% !important;
}

#status {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 20;

    padding: 7px 10px;

    border-radius: 6px;

    background: rgba(0,0,0,0.75);

    color: #00ff88;

    font-size: 12px;

    font-weight: bold;
}

.sliders-panel {
    position: fixed;
    top: 42px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    width: 92%;
    max-width: 370px;

    padding: 10px;

    background: rgba(0,0,0,0.85);

    border-radius: 10px;

    display: flex;
    flex-direction: column;

    gap: 7px;

    color: white;

    font-size: 11px;

    backdrop-filter: blur(6px);
}

.slider-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.slider-row span {
    width: 90px;
}

.slider-row input {
    width: 65%;
}

.ui-layer {
    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    width: 95%;
    max-width: 650px;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;
}

button,
.upload-btn {
    padding: 10px 14px;

    border: none;

    border-radius: 8px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    background: #007bff;

    color: white;

    box-shadow:
        0 4px 7px rgba(0,0,0,0.4);
}

.upload-btn {
    background: #ffc107;
    color: #000;
}

input[type="file"] {
    display: none;
}

#exportBtn {
    background: #17a2b8;
}

#recordBtn {
    background: #28a745;
}

#stopBtn {
    background: #dc3545;
    display: none;
}

#downloadLink {
    display: none;

    padding: 10px 12px;

    background: #6c757d;

    color: white;

    border-radius: 8px;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}

</style>


<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- GLTF LOADER -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- MEDIAPIPE CAMERA -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- MEDIAPIPE FACE MESH -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

</head>

<body>

<video
    id="cameraStream"
    autoplay
    playsinline
    muted>
</video>

<div id="webgl-container"></div>

<div id="status">
    Starting Face Tracking...
</div>


<div class="sliders-panel">

    <div class="slider-row">
        <span>Model Scale</span>

        <input
            id="scaleSlider"
            type="range"
            min="0.1"
            max="5"
            step="0.05"
            value="1.5">
    </div>

    <div class="slider-row">
        <span>Offset X</span>

        <input
            id="offsetX"
            type="range"
            min="-2"
            max="2"
            step="0.05"
            value="0">
    </div>

    <div class="slider-row">
        <span>Offset Y</span>

        <input
            id="offsetY"
            type="range"
            min="-2"
            max="2"
            step="0.05"
            value="0.2">
    </div>

    <div class="slider-row">
        <span>Offset Z</span>

        <input
            id="offsetZ"
            type="range"
            min="-3"
            max="3"
            step="0.05"
            value="0">
    </div>

</div>


<div class="ui-layer">

    <button id="flipBtn">
        Flip
    </button>

    <label class="upload-btn">

        Import 3D

        <input
            type="file"
            id="fileInput"
            accept=".glb,.gltf">

    </label>

    <button id="exportBtn">
        Snapshot
    </button>

    <button id="recordBtn">
        Rec
    </button>

    <button id="stopBtn">
        Stop
    </button>

    <a
        id="downloadLink"
        download="azeez-ar-video.webm">

        Download Video

    </a>

</div>


<script>

"use strict";


/* ELEMENTS */

const videoElement =
    document.getElementById("cameraStream");

const status =
    document.getElementById("status");

const flipBtn =
    document.getElementById("flipBtn");

const fileInput =
    document.getElementById("fileInput");

const exportBtn =
    document.getElementById("exportBtn");

const recordBtn =
    document.getElementById("recordBtn");

const stopBtn =
    document.getElementById("stopBtn");

const downloadLink =
    document.getElementById("downloadLink");

const scaleSlider =
    document.getElementById("scaleSlider");

const offsetXSlider =
    document.getElementById("offsetX");

const offsetYSlider =
    document.getElementById("offsetY");

const offsetZSlider =
    document.getElementById("offsetZ");


/* CAMERA */

let useFrontCamera = true;

let currentStream = null;

let cameraUtils = null;

let cameraStarting = false;


/* THREE */

let scene;

let camera;

let renderer;

let currentModel = null;


/* TRACKING */

let targetPosition =
    new THREE.Vector3();

let smoothPosition =
    new THREE.Vector3();

let targetRotation =
    new THREE.Euler();

let smoothRotation =
    new THREE.Euler();


/* RECORDING */

let mediaRecorder = null;

let recordedChunks = [];


/* STATUS */

function setStatus(message) {

    status.innerText = message;

}


/* THREE INIT */

function init3D() {

    const container =
        document.getElementById(
            "webgl-container"
        );


    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    camera.position.set(
        0,
        0,
        3
    );


    renderer =
        new THREE.WebGLRenderer({

            alpha: true,

            antialias: true,

            preserveDrawingBuffer: true

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    container.appendChild(
        renderer.domElement
    );


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.8
        );

    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

    directional.position.set(
        0,
        5,
        5
    );

    scene.add(
        directional
    );


    animate();

}


/* ANIMATION */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (currentModel) {

        const scale =
            parseFloat(
                scaleSlider.value
            );


        currentModel.scale.set(
            scale,
            scale,
            scale
        );


        const xOff =
            parseFloat(
                offsetXSlider.value
            );


        const yOff =
            parseFloat(
                offsetYSlider.value
            );


        const zOff =
            parseFloat(
                offsetZSlider.value
            );


        const desiredPosition =
            new THREE.Vector3(

                smoothPosition.x + xOff,

                smoothPosition.y + yOff,

                smoothPosition.z + zOff

            );


        currentModel.position.lerp(
            desiredPosition,
            0.35
        );


        currentModel.rotation.x =
            THREE.MathUtils.lerp(
                currentModel.rotation.x,
                smoothRotation.x,
                0.25
            );


        currentModel.rotation.y =
            THREE.MathUtils.lerp(
                currentModel.rotation.y,
                smoothRotation.y,
                0.25
            );


        currentModel.rotation.z =
            THREE.MathUtils.lerp(
                currentModel.rotation.z,
                smoothRotation.z,
                0.25
            );

    }


    renderer.render(
        scene,
        camera
    );

}


/* FACE MESH */

const faceMesh =
    new FaceMesh({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/face_mesh/" +
                file
            );

        }

    });


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/* FACE RESULTS */

faceMesh.onResults(
    function(results) {

        if (
            !results.multiFaceLandmarks ||
            results.multiFaceLandmarks.length === 0
        ) {

            setStatus(
                "Searching for face..."
            );

            return;

        }


        setStatus(
            "Face Tracking: ON"
        );


        const landmarks =
            results.multiFaceLandmarks[0];


        const nose =
            landmarks[1];

        const forehead =
            landmarks[10];

        const chin =
            landmarks[152];

        const leftSide =
            landmarks[234];

        const rightSide =
            landmarks[454];

        const leftEye =
            landmarks[33];

        const rightEye =
            landmarks[263];


        /* POSITION */

        const faceX =
            1 - nose.x;

        const faceY =
            nose.y;


        const x =
            (faceX - 0.5) * 3.2;


        const y =
            (0.5 - faceY) * 2.6;


        const depth =
            -nose.z * 1.2;


        targetPosition.set(
            x,
            y,
            depth
        );


        /* YAW */

        const eyeCenterX =
            (
                leftEye.x +
                rightEye.x
            ) / 2;


        const sideWidth =
            Math.abs(
                rightSide.x -
                leftSide.x
            );


        let yaw =
            (
                nose.x -
                eyeCenterX
            ) /
            Math.max(
                sideWidth,
                0.01
            );


        yaw =
            THREE.MathUtils.clamp(
                yaw * 2.0,
                -1,
                1
            );


        targetRotation.y =
            yaw;


        /* ROLL */

        const dx =
            rightEye.x -
            leftEye.x;

        const dy =
            rightEye.y -
            leftEye.y;


        const roll =
            Math.atan2(
                dy,
                dx
            );


        targetRotation.z =
            -roll;


        /* PITCH */

        const faceHeight =
            Math.abs(
                chin.y -
                forehead.y
            );


        let pitch =
            (
                nose.y -
                forehead.y
            ) /
            Math.max(
                faceHeight,
                0.01
            );


        pitch =
            (pitch - 0.5) * 1.5;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -0.8,
                0.8
            );


        targetRotation.x =
            pitch;


        /* SMOOTH */

        smoothPosition.lerp(
            targetPosition,
            0.30
        );


        smoothRotation.x =
            THREE.MathUtils.lerp(
                smoothRotation.x,
                targetRotation.x,
                0.30
            );


        smoothRotation.y =
            THREE.MathUtils.lerp(
                smoothRotation.y,
                targetRotation.y,
                0.30
            );


        smoothRotation.z =
            THREE.MathUtils.lerp(
                smoothRotation.z,
                targetRotation.z,
                0.30
            );

    }
);


/* START CAMERA */

async function startCamera() {

    if (cameraStarting) {
        return;
    }


    cameraStarting = true;


    try {

        setStatus(
            "Requesting camera..."
        );


        if (currentStream) {

            currentStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        currentStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            useFrontCamera
                                ? "user"
                                : "environment",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: true

                });


        videoElement.srcObject =
            currentStream;


        await videoElement.play();


        setStatus(
            "Camera OK - Starting Face Mesh..."
        );


        if (cameraUtils) {

            cameraUtils.stop();

        }


        cameraUtils =
            new Camera(
                videoElement,
                {

                    onFrame:
                    async function() {

                        try {

                            await faceMesh.send({
                                image:
                                    videoElement
                            });

                        } catch(error) {

                            console.error(
                                "FaceMesh error:",
                                error
                            );

                        }

                    },

                    width: 640,

                    height: 480

                }
            );


        await cameraUtils.start();


        setStatus(
            "Face Tracking: Searching..."
        );


    } catch(error) {

        console.error(
            "Camera error:",
            error
        );


        setStatus(
            "Camera ERROR"
        );


        alert(
            "Camera error:\n" +
            error.message
        );


    } finally {

        cameraStarting = false;

    }

}


/* FLIP */

flipBtn.addEventListener(
    "click",
    async function() {

        useFrontCamera =
            !useFrontCamera;

        await startCamera();

    }
);


/* IMPORT MODEL */

fileInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        setStatus(
            "Loading 3D model..."
        );


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                const loader =
                    new THREE.GLTFLoader();


                loader.parse(

                    e.target.result,

                    "",

                    function(gltf) {

                        if (currentModel) {

                            scene.remove(
                                currentModel
                            );

                        }


                        currentModel =
                            gltf.scene;


                        currentModel.position.set(
                            0,
                            0,
                            0
                        );


                        scene.add(
                            currentModel
                        );


                        setStatus(
                            "3D model loaded - Face Tracking..."
                        );

                    },

                    function(error) {

                        console.error(
                            error
                        );


                        alert(
                            "3D model load error."
                        );

                    }

                );

            };


        reader.readAsArrayBuffer(
            file
        );

    }
);
/* SNAPSHOT */

exportBtn.addEventListener(
    "click",
    function() {

        if (!renderer) {
            return;
        }


        renderer.render(
            scene,
            camera
        );


        const dataURL =
            renderer.domElement.toDataURL(
                "image/png"
            );


        const link =
            document.createElement("a");


        link.download =
            "azeez-ar-snapshot.png";


        link.href =
            dataURL;


        link.click();

    }
);


/* RECORDING */

recordBtn.addEventListener(
    "click",
    function() {

        if (!currentStream) {

            alert(
                "Camera is not ready."
            );

            return;
        }


        if (!window.MediaRecorder) {

            alert(
                "Video recording is not supported."
            );

            return;
        }


        recordedChunks = [];


        let mimeType =
            "video/webm;codecs=vp8,opus";


        if (
            !MediaRecorder.isTypeSupported(
                mimeType
            )
        ) {

            mimeType =
                "video/webm";

        }


        try {

            mediaRecorder =
                new MediaRecorder(
                    currentStream,
                    {
                        mimeType:
                            mimeType
                    }
                );


            mediaRecorder.ondataavailable =
                function(event) {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        recordedChunks.push(
                            event.data
                        );

                    }

                };


            mediaRecorder.onstop =
                function() {

                    const blob =
                        new Blob(
                            recordedChunks,
                            {
                                type:
                                    "video/webm"
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    downloadLink.href =
                        url;


                    downloadLink.style.display =
                        "inline-block";


                    setStatus(
                        "Recording finished"
                    );

                };


            mediaRecorder.start(
                1000
            );


            recordBtn.style.display =
                "none";


            stopBtn.style.display =
                "inline-block";


            downloadLink.style.display =
                "none";


            setStatus(
                "Recording..."
            );


        } catch(error) {

            console.error(
                error
            );


            alert(
                "Recording error:\n" +
                error.message
            );

        }

    }
);


/* STOP RECORDING */

stopBtn.addEventListener(
    "click",
    function() {

        if (
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ) {

            mediaRecorder.stop();

        }


        stopBtn.style.display =
            "none";


        recordBtn.style.display =
            "inline-block";

    }
);


/* SCALE */

scaleSlider.addEventListener(
    "input",
    function() {

        if (!currentModel) {
            return;
        }


        const value =
            parseFloat(
                scaleSlider.value
            );


        currentModel.scale.set(
            value,
            value,
            value
        );

    }
);


/* RESIZE */

window.addEventListener(
    "resize",
    function() {

        if (!camera || !renderer) {
            return;
        }


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }
);


/* CHECK MEDIAPIPE */

window.addEventListener(
    "load",
    function() {

        if (
            typeof FaceMesh ===
            "undefined"
        ) {

            setStatus(
                "ERROR: MediaPipe not loaded"
            );


            alert(
                "MediaPipe Face Mesh load नहीं हुआ.\n" +
                "Internet ON करके page reload करें."
            );


            return;

        }


        if (
            typeof Camera ===
            "undefined"
        ) {

            setStatus(
                "ERROR: Camera library not loaded"
            );


            alert(
                "MediaPipe Camera library load नहीं हुई."
            );


            return;

        }


        setStatus(
            "MediaPipe ready - Starting camera..."
        );


        startCamera();

    }
);


/* START APP */

init3D();

</script>

</body>
</html>
