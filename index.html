<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziz Hero AR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            white-space: nowrap;
        }

        #startButton {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: #000;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <video id="camera" autoplay muted playsinline></video>

    <div id="status">Camera Ready</div>

    <button id="startButton">Start Camera</button>

    <script type="module" src="./js/app.js"></script>

    <script>
        const video = document.getElementById("camera");
        const status = document.getElementById("status");
        const startButton = document.getElementById("startButton");

        startButton.addEventListener("click", async () => {
            try {
                status.textContent = "Starting Camera...";

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user"
                        },
                        audio: false
                    });

                video.srcObject = stream;

                await video.play();

                status.textContent = "Camera Working";
                startButton.style.display = "none";

            } catch (error) {
                status.textContent =
                    "Camera Error: " + error.message;
            }
        });
    </script>

</body>
</html>
