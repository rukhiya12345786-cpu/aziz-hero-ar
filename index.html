<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Azeez AR - 3D Head Tracking</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#cameraStream{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

    transform:scaleX(-1);
}

#threeCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

#ui{
    position:fixed;

    left:10px;
    right:10px;
    bottom:10px;

    z-index:10;

    padding:12px;

    border-radius:16px;

    background:rgba(0,0,0,.70);

    color:white;

    backdrop-filter:blur(10px);
}

#status{
    text-align:center;

    font-size:14px;

    margin-bottom:10px;

    color:#00ff9d;
}

.row{
    display:flex;

    gap:7px;

    margin-top:7px;
}

button,
label{
    flex:1;

    border:0;

    border-radius:10px;

    padding:11px 7px;

    background:#222;

    color:white;

    text-align:center;

    font-size:13px;
}

button:active,
label:active{
    transform:scale(.97);
}

input[type=file]{
    display:none;
}

.control{
    margin-top:8px;
}

.control span{
    display:block;

    font-size:12px;

    margin-bottom:3px;
}

input[type=range]{
    width:100%;
}

</style>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>


<body>


<!-- CAMERA -->

<video
    id="cameraStream"
    autoplay
    playsinline
    muted>
</video>


<!-- THREE CANVAS -->

<canvas id="threeCanvas"></canvas>


<!-- UI -->

<div id="ui">

    <div id="status">
        Starting camera...
    </div>


    <div class="row">

        <label for="modelInput">
            Import 3D
        </label>

        <button
            id="resetBtn">
            Reset
        </button>

        <button
            id="flipBtn">
            Flip
        </button>

        <button
            id="snapshotBtn">
            Photo
        </button>

    </div>


    <input
        id="modelInput"
        type="file"
        accept=".glb,.gltf,.obj,.fbx">


    <div class="control">

        <span>
            Character Size
        </span>

        <input
            id="sizeSlider"
            type="range"
            min="0.3"
            max="2"
            step="0.01"
            value="1">

    </div>


    <div class="control">

        <span>
            Head Up / Down
        </span>

        <input
            id="upSlider"
            type="range"
            min="-1"
            max="1"
            step="0.01"
            value="0">

    </div>


    <div class="control">

        <span>
            Head Forward / Back
        </span>

        <input
            id="depthSlider"
            type="range"
            min="-1"
            max="1"
            step="0.01"
            value="0">

    </div>

</div>


<script>


/* ==================================================
   GLOBAL VARIABLES
================================================== */

const video =
document.getElementById(
    "cameraStream"
);

const canvas =
document.getElementById(
    "threeCanvas"
);

const statusBox =
document.getElementById(
    "status"
);


let scene;

let camera3D;

let renderer;


let faceMesh;

let mpCamera;


let headGroup;

let faceOccluder;

let importedModel =
null;


let sizeValue =
1;

let upValue =
0;

let depthValue =
0;


let smoothPosition =
new THREE.Vector3(
    0,
    0,
    0
);


let smoothQuaternion =
new THREE.Quaternion();


let smoothScale =
1;


let poseStarted =
false;


let cameraFacing =
"user";


/* ==================================================
   THREE INITIALIZATION
================================================== */

function initThree(){

    scene =
    new THREE.Scene();


    camera3D =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.01,

        100

    );


    /*
       Camera is in front of the
       3D head space.
    */

    camera3D.position.set(
        0,
        0,
        3
    );


    renderer =
    new THREE.WebGLRenderer({

        canvas:canvas,

        alpha:true,

        antialias:true,

        preserveDrawingBuffer:true

    });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight,

        false

    );


    renderer.outputEncoding =
    THREE.sRGBEncoding;


    /*
       HEAD GROUP

       Everything imported will be
       attached here.
    */

    headGroup =
    new THREE.Group();


    scene.add(
        headGroup
    );


    /* ==================================================
       LIGHTING
    ================================================== */

    const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.2
    );


    scene.add(
        ambient
    );


    const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );


    keyLight.position.set(
        2,
        3,
        4
    );


    scene.add(
        keyLight
    );


    const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        .7
    );


    fillLight.position.set(
        -3,
        1,
        2
    );


    scene.add(
        fillLight
    );


    /*
       Invisible face depth object.
    */

    createFaceOccluder();


    window.addEventListener(
        "resize",
        resizeThree
    );


    resizeThree();


    renderLoop();

}


/* ==================================================
   RESIZE
================================================== */

function resizeThree(){

    if(!renderer)
        return;


    const w =
    window.innerWidth;


    const h =
    window.innerHeight;


    camera3D.aspect =
    w / h;


    camera3D.updateProjectionMatrix();


    renderer.setSize(
        w,
        h,
        false
    );

}


/* ==================================================
   FACE OCCLUDER
================================================== */

function createFaceOccluder(){

    const geometry =
    new THREE.SphereGeometry(
        1,
        32,
        24
    );


    const material =
    new THREE.MeshBasicMaterial({

        color:0x000000,

        transparent:true,

        opacity:0,

        colorWrite:false,

        depthWrite:true,

        depthTest:true,

        side:THREE.DoubleSide

    });


    faceOccluder =
    new THREE.Mesh(

        geometry,

        material

    );


    faceOccluder.visible =
    false;


    faceOccluder.renderOrder =
    0;


    scene.add(
        faceOccluder
    );

}


/* ==================================================
   MEDIAPIPE
================================================== */

function initFaceTracking(){

    faceMesh =
    new FaceMesh({

        locateFile:
        function(file){

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
            + file;

        }

    });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    faceMesh.onResults(
        onFaceResults
    );


    mpCamera =
    new Camera(

        video,

        {

            onFrame:
            async function(){

                if(faceMesh){

                    await faceMesh.send({

                        image:video

                    });

                }

            },

            width:1280,

            height:720

        }

    );


    mpCamera.start();

}


/* ==================================================
   LANDMARK CONVERSION
================================================== */

function landmarkPoint(lm){

    /*
       IMPORTANT:

       Front camera is mirrored.

       Therefore X is intentionally
       reversed here.

       This fixes the previous
       left/right inversion.
    */

    let x;


    if(cameraFacing === "user"){

        x =
        0.5 - lm.x;

    }
    else{

        x =
        lm.x - 0.5;

    }


    return new THREE.Vector3(

        x,

        0.5 - lm.y,

        -lm.z

    );

}


/* ==================================================
   FACE RESULTS
================================================== */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        statusBox.innerText =
        "FACE NOT DETECTED";


        faceOccluder.visible =
        false;


        return;

    }


    const lm =
    results.multiFaceLandmarks[0];


    /*
       IMPORTANT FACE POINTS
    */

    const leftCheek =
    landmarkPoint(
        lm[234]
    );


    const rightCheek =
    landmarkPoint(
        lm[454]
    );


    const forehead =
    landmarkPoint(
        lm[10]
    );


    const chin =
    landmarkPoint(
        lm[152]
    );


    const nose =
    landmarkPoint(
        lm[1]
    );


    /* ==================================================
       HEAD CENTER
    ================================================== */

    const horizontalCenter =
    leftCheek.clone()
    .add(rightCheek)
    .multiplyScalar(.5);


    const verticalCenter =
    forehead.clone()
    .add(chin)
    .multiplyScalar(.5);


    const headCenter =
    horizontalCenter.clone()
    .add(verticalCenter)
    .multiplyScalar(.5);


    /* ==================================================
       HEAD AXES
    ================================================== */

    /*
       X = left → right
    */

    let xAxis =
    rightCheek.clone()
    .sub(leftCheek)
    .normalize();


    /*
       Y = chin → forehead
    */

    let yAxis =
    forehead.clone()
    .sub(chin)
    .normalize();


    /*
       Z = face normal
    */

    let zAxis =
    xAxis.clone()
    .cross(yAxis)
    .normalize();


    /*
       Make Z point toward nose.
    */

    const noseDirection =
    nose.clone()
    .sub(headCenter);


    if(
        zAxis.dot(
            noseDirection
        ) < 0
    ){

        zAxis.negate();

    }


    /*
       Rebuild X so the three axes
       stay perpendicular.
    */

    xAxis =
    yAxis.clone()
    .cross(zAxis)
    .normalize();


    /*
       Restore correct left/right
       direction.
    */

    if(
        xAxis.dot(
            rightCheek.clone()
            .sub(leftCheek)
        ) < 0
    ){

        xAxis.negate();

    }


    yAxis =
    zAxis.clone()
    .cross(xAxis)
    .normalize();


    /* ==================================================
       ROTATION
    ================================================== */

    const rotationMatrix =
    new THREE.Matrix4();


    rotationMatrix.makeBasis(

        xAxis,

        yAxis,

        zAxis

    );


    const targetQuaternion =
    new THREE.Quaternion();


    targetQuaternion.setFromRotationMatrix(
        rotationMatrix
    );


    /* ==================================================
       FACE SIZE
    ================================================== */

    const faceWidth =
    leftCheek.distanceTo(
        rightCheek
    );


    const faceHeight =
    forehead.distanceTo(
        chin
    );


    /* ==================================================
       POSITION
    ================================================== */

    const targetX =
    headCenter.x * 3.2;


    const targetY =
    headCenter.y * 2.6;


    const targetZ =
    depthValue * .35;


    const targetPosition =
    new THREE.Vector3(

        targetX,

        targetY +
        upValue * .35,

        targetZ

    );


    /* ==================================================
       MODEL SCALE
    ================================================== */

    let targetScale =
    faceWidth * 3.0;


    targetScale *=
    sizeValue;


    targetScale =
    THREE.MathUtils.clamp(

        targetScale,

        .15,

        4

    );


    /* ==================================================
       SMOOTHING
    ================================================== */

    smoothPosition.lerp(

        targetPosition,

        .30

    );


    if(!poseStarted){

        smoothQuaternion.copy(
            targetQuaternion
        );

        poseStarted =
        true;

    }
    else{

        smoothQuaternion.slerp(

            targetQuaternion,

            .28

        );

    }


    smoothScale +=
    (
        targetScale -
        smoothScale
    ) * .25;


    /* ==================================================
       APPLY HEAD TRANSFORM
    ================================================== */

    headGroup.position.copy(
        smoothPosition
    );


    headGroup.quaternion.copy(
        smoothQuaternion
    );


    headGroup.scale.setScalar(
        smoothScale
    );


    /* ==================================================
       FACE OCCLUSION
    ================================================== */

    updateFaceOccluder(

        faceWidth,

        faceHeight,

        smoothQuaternion

    );


    statusBox.innerText =
    "FACE TRACKING ON";

}


/* ==================================================
   OCCLUDER UPDATE
================================================== */

function updateFaceOccluder(

    faceWidth,

    faceHeight,

    quaternion

){

    faceOccluder.visible =
    true;


    faceOccluder.position.copy(
        smoothPosition
    );


    faceOccluder.quaternion.copy(
        quaternion
    );


    faceOccluder.scale.set(

        faceWidth * 2.0,

        faceHeight * 1.45,

        faceWidth * 1.25

    );

}


/* ==================================================
   RENDER LOOP
================================================== */

function renderLoop(){

    requestAnimationFrame(
        renderLoop
    );


    if(renderer){

        renderer.render(

            scene,

            camera3D

        );

    }

}<script>

/* ==================================================
   MODEL MATERIAL
================================================== */

function prepareMaterial(material){

    if(!material)
        return;

    material.side =
    THREE.DoubleSide;

    material.depthTest =
    true;

    material.depthWrite =
    true;

    material.needsUpdate =
    true;

}


/* ==================================================
   PREPARE MODEL
================================================== */

function prepareModel(object){

    if(!object)
        return;


    /* REMOVE PREVIOUS MODEL */

    if(importedModel){

        headGroup.remove(
            importedModel
        );

        importedModel =
        null;

    }


    importedModel =
    object;


    /* ==================================================
       PREPARE ALL MESHES
    ================================================== */

    importedModel.traverse(

        function(child){

            if(!child.isMesh)
                return;


            if(child.material){

                if(
                    Array.isArray(
                        child.material
                    )
                ){

                    child.material.forEach(
                        prepareMaterial
                    );

                }
                else{

                    prepareMaterial(
                        child.material
                    );

                }

            }


            /*
               Model renders after
               invisible face occluder.
            */

            child.renderOrder =
            1;

        }

    );


    /* ==================================================
       GET MODEL BOUNDING BOX
    ================================================== */

    let box =
    new THREE.Box3()
    .setFromObject(
        importedModel
    );


    const modelSize =
    box.getSize(
        new THREE.Vector3()
    );


    const maxSize =
    Math.max(

        modelSize.x,

        modelSize.y,

        modelSize.z

    );


    /* ==================================================
       NORMALIZE MODEL
    ================================================== */

    if(maxSize > 0){

        importedModel.scale.setScalar(

            1.8 /
            maxSize

        );

    }


    /* ==================================================
       CENTER MODEL
    ================================================== */

    box =
    new THREE.Box3()
    .setFromObject(
        importedModel
    );


    const center =
    box.getCenter(
        new THREE.Vector3()
    );


    /*
       Put the geometric center of
       the imported 3D mesh at the
       head tracking origin.
    */

    importedModel.position.x -=
    center.x;


    importedModel.position.y -=
    center.y;


    importedModel.position.z -=
    center.z;


    /*
       Small correction so the
       model does not sit too low.
    */

    importedModel.position.y +=
    .02;


    /* ==================================================
       ADD MODEL TO HEAD
    ================================================== */

    headGroup.add(
        importedModel
    );


    /* RESET TRACKING */

    poseStarted =
    false;


    smoothPosition.set(
        0,
        0,
        0
    );


    smoothQuaternion.identity();


    smoothScale =
    1;


    statusBox.innerText =
    "3D MODEL READY";

}


/* ==================================================
   GLB / GLTF
================================================== */

function loadGLTF(file){

    statusBox.innerText =
    "LOADING GLB / GLTF...";


    const loader =
    new THREE.GLTFLoader();


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        try{

            loader.parse(

                event.target.result,

                "",

                function(gltf){

                    if(
                        gltf &&
                        gltf.scene
                    ){

                        prepareModel(
                            gltf.scene
                        );

                    }
                    else{

                        statusBox.innerText =
                        "INVALID GLTF MODEL";

                    }

                },

                function(error){

                    console.error(
                        error
                    );

                    statusBox.innerText =
                    "GLTF LOAD ERROR";

                }

            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
            "MODEL ERROR";

        }

    };


    reader.readAsArrayBuffer(
        file
    );

}


/* ==================================================
   OBJ
================================================== */

function loadOBJ(file){

    statusBox.innerText =
    "LOADING OBJ...";


    const loader =
    new THREE.OBJLoader();


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        try{

            const object =
            loader.parse(
                event.target.result
            );


            prepareModel(
                object
            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
            "OBJ LOAD ERROR";

        }

    };


    reader.readAsText(
        file
    );

}


/* ==================================================
   FBX
================================================== */

function loadFBX(file){

    statusBox.innerText =
    "LOADING FBX...";


    const loader =
    new THREE.FBXLoader();


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        try{

            const object =
            loader.parse(

                event.target.result,

                ""

            );


            prepareModel(
                object
            );

        }
        catch(error){

            console.error(
                error
            );

            statusBox.innerText =
            "FBX LOAD ERROR";

        }

    };


    reader.readAsArrayBuffer(
        file
    );

}


/* ==================================================
   MODEL FILE INPUT
================================================== */

document
.getElementById(
    "modelInput"
)
.addEventListener(

    "change",

    function(event){

        const file =
        event.target.files[0];


        if(!file)
            return;


        const name =
        file.name.toLowerCase();


        if(
            name.endsWith(".glb") ||
            name.endsWith(".gltf")
        ){

            loadGLTF(
                file
            );

            return;

        }


        if(
            name.endsWith(".obj")
        ){

            loadOBJ(
                file
            );

            return;

        }


        if(
            name.endsWith(".fbx")
        ){

            loadFBX(
                file
            );

            return;

        }


        statusBox.innerText =
        "UNSUPPORTED 3D FORMAT";

    }

);


/* ==================================================
   SIZE CONTROL
================================================== */

document
.getElementById(
    "sizeSlider"
)
.addEventListener(

    "input",

    function(){

        sizeValue =
        parseFloat(
            this.value
        );

    }

);


/* ==================================================
   UP / DOWN
================================================== */

document
.getElementById(
    "upSlider"
)
.addEventListener(

    "input",

    function(){

        upValue =
        parseFloat(
            this.value
        );

    }

);


/* ==================================================
   DEPTH
================================================== */

document
.getElementById(
    "depthSlider"
)
.addEventListener(

    "input",

    function(){

        depthValue =
        parseFloat(
            this.value
        );

    }

);


/* ==================================================
   RESET
================================================== */

function resetAR(){

    sizeValue =
    1;

    upValue =
    0;

    depthValue =
    0;


    document.getElementById(
        "sizeSlider"
    ).value =
    "1";


    document.getElementById(
        "upSlider"
    ).value =
    "0";


    document.getElementById(
        "depthSlider"
    ).value =
    "0";


    poseStarted =
    false;


    smoothPosition.set(
        0,
        0,
        0
    );


    smoothQuaternion.identity();


    smoothScale =
    1;


    headGroup.position.set(
        0,
        0,
        0
    );


    headGroup.quaternion.identity();


    headGroup.scale.set(
        1,
        1,
        1
    );


    statusBox.innerText =
    "RESET";

}


/* ==================================================
   CAMERA FLIP
================================================== */

async function flipCamera(){

    try{

        if(video.srcObject){

            const tracks =
            video.srcObject
            .getTracks();


            tracks.forEach(
                function(track){

                    track.stop();

                }
            );

        }


        cameraFacing =
        cameraFacing === "user"
        ? "environment"
        : "user";


        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:
                    cameraFacing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        /*
           Selfie camera is mirrored.
           Rear camera is not.
        */

        if(
            cameraFacing === "user"
        ){

            video.style.transform =
            "scaleX(-1)";

        }
        else{

            video.style.transform =
            "scaleX(1)";

        }


        await video.play();


        statusBox.innerText =
        "CAMERA SWITCHED";

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "CAMERA SWITCH ERROR";

    }

}


/* ==================================================
   SNAPSHOT
================================================== */

function takeSnapshot(){

    if(!renderer)
        return;


    try{

        const image =
        canvas.toDataURL(
            "image/png"
        );


        const link =
        document.createElement(
            "a"
        );


        link.href =
        image;


        link.download =
        "azeez-ar.png";


        link.click();

    }
    catch(error){

        console.error(
            error
        );

    }

}


/* ==================================================
   CAMERA START
================================================== */

async function startCamera(){

    try{

        cameraFacing =
        "user";


        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        video.style.transform =
        "scaleX(-1)";


        await video.play();


        statusBox.innerText =
        "CAMERA READY";

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "CAMERA PERMISSION ERROR";

    }

}


/* ==================================================
   BUTTONS
================================================== */

document
.getElementById(
    "resetBtn"
)
.addEventListener(
    "click",
    resetAR
);


document
.getElementById(
    "flipBtn"
)
.addEventListener(
    "click",
    flipCamera
);


document
.getElementById(
    "snapshotBtn"
)
.addEventListener(
    "click",
    takeSnapshot
);


/* ==================================================
   START APPLICATION
================================================== */

async function startApp(){

    /*
       FIRST:
       initialize Three.js
    */

    initThree();


    /*
       SECOND:
       start camera
    */

    await startCamera();


    /*
       THIRD:
       start MediaPipe
    */

    initFaceTracking();


    statusBox.innerText =
    "FACE TRACKING STARTING...";

}


/* ==================================================
   RUN
================================================== */

startApp();


</script>
