<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Azeez AR - Universal 3D Head Tracking</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#cameraStream{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;
    background:#000;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#ui{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:10;

    display:flex;
    flex-wrap:wrap;
    gap:7px;

    padding:10px;
    border-radius:16px;

    background:rgba(0,0,0,.68);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

button,
input[type=file]{
    border:0;
    border-radius:10px;
    padding:10px 12px;
    background:#fff;
    color:#111;
    font-weight:bold;
}

button:active{
    transform:scale(.96);
}

.control{
    width:100%;
    color:#fff;
    font-size:13px;
}

.control input{
    width:100%;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;

    padding:9px 12px;
    border-radius:12px;

    color:#fff;
    background:rgba(0,0,0,.55);

    font-size:13px;
    text-align:center;
}

#fileInput{
    display:none;
}

.small{
    font-size:11px;
    opacity:.8;
}
</style>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<!-- LOADERS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

</head>

<body>

<video id="cameraStream"
       autoplay
       playsinline
       muted></video>

<canvas id="threeCanvas"></canvas>

<div id="status">
    Starting camera...
</div>

<div id="ui">

    <button onclick="document.getElementById('fileInput').click()">
        📦 Import 3D
    </button>

    <input id="fileInput"
           type="file"
           accept=".glb,.gltf,.obj,.fbx">

    <button onclick="flipCamera()">
        🔄 Flip
    </button>

    <button onclick="resetModel()">
        ♻ Reset
    </button>

    <button onclick="takeSnapshot()">
        📸 Snapshot
    </button>

    <div class="control">
        Character Size
        <input id="sizeSlider"
               type="range"
               min="0.5"
               max="2.0"
               step="0.01"
               value="1">
    </div>

    <div class="control">
        Head Up / Down
        <input id="verticalSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
    </div>

    <div class="control">
        Head Forward / Back
        <input id="depthSlider"
               type="range"
               min="-1"
               max="1"
               step="0.01"
               value="0">
    </div>

    <div class="small">
        Full 3D head tracking • Yaw • Pitch • Roll • Depth Occlusion
    </div>

</div>


<script>

/* =========================================================
   GLOBALS
========================================================= */

const video = document.getElementById("cameraStream");
const canvas = document.getElementById("threeCanvas");
const statusBox = document.getElementById("status");

let scene;
let arCamera;
let renderer;

let modelContainer;
let currentModel = null;

let faceOccluder = null;

let faceMesh = null;
let mpCamera = null;

let cameraFacing = "user";

let modelScale = 1;
let verticalOffset = 0;
let depthOffset = 0;

let trackingReady = false;


/* =========================================================
   SMOOTHING
========================================================= */

let smoothPosition = new THREE.Vector3(0,0,0);

let smoothQuaternion = new THREE.Quaternion();

let smoothScale = 1;

let initializedPose = false;


/* =========================================================
   TRACKING SETTINGS
========================================================= */

const POSITION_SMOOTH = 0.35;
const ROTATION_SMOOTH = 0.28;
const SCALE_SMOOTH = 0.25;


/* =========================================================
   START THREE.JS
========================================================= */

function init3D(){

    scene = new THREE.Scene();

    arCamera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    arCamera.position.set(0,0,3);

    renderer = new THREE.WebGLRenderer({
        canvas:canvas,
        alpha:true,
        antialias:true,
        preserveDrawingBuffer:true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setClearColor(0x000000,0);

    renderer.autoClear = true;

    /*
       Main head container.
       Everything attached to the head goes here.
    */
    modelContainer = new THREE.Group();

    scene.add(modelContainer);


    /* =====================================================
       LIGHTS
    ===================================================== */

    const ambient = new THREE.AmbientLight(
        0xffffff,
        1.7
    );

    scene.add(ambient);


    const keyLight = new THREE.DirectionalLight(
        0xffffff,
        1.4
    );

    keyLight.position.set(
        2,
        3,
        5
    );

    scene.add(keyLight);


    const fillLight = new THREE.DirectionalLight(
        0xffffff,
        0.7
    );

    fillLight.position.set(
        -3,
        1,
        2
    );

    scene.add(fillLight);


    /* =====================================================
       FACE OCCLUDER
    ===================================================== */

    createFaceOccluder();


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(
        "resize",
        onResize
    );


    animate();
}


/* =========================================================
   FACE OCCLUDER
========================================================= */

function createFaceOccluder(){

    /*
       This invisible 3D ellipsoid represents the user's
       real head/face in the depth buffer.

       It does NOT display a black object.

       colorWrite:false means:
       invisible to the user.

       depthWrite:true means:
       it can hide parts of the 3D character that should
       visually go behind the face.
    */

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            24
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:0x000000,

            transparent:true,

            opacity:0,

            colorWrite:false,

            depthWrite:true,

            depthTest:true,

            side:THREE.DoubleSide

        });


    faceOccluder =
        new THREE.Mesh(
            geometry,
            material
        );


    faceOccluder.renderOrder = 0;

    faceOccluder.visible = false;

    scene.add(faceOccluder);
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

function onResize(){

    if(!arCamera || !renderer) return;

    arCamera.aspect =
        window.innerWidth /
        window.innerHeight;

    arCamera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

function initFaceTracking(){

    faceMesh = new FaceMesh({

        locateFile: function(file){

            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

        }

    });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.55,

        minTrackingConfidence:0.55

    });


    faceMesh.onResults(
        onFaceResults
    );


    mpCamera = new Camera(
        video,
        {

            onFrame: async function(){

                if(faceMesh){

                    await faceMesh.send({
                        image:video
                    });

                }

            },

            width:1280,
            height:720

        }
    );


    mpCamera.start();


    statusBox.innerText =
        "Camera ON • Looking for face...";
}


/* =========================================================
   HELPER
========================================================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =========================================================
   CONVERT MEDIAPIPE POINT
========================================================= */

function mpPoint(lm){

    /*
       Camera image is mirrored on screen.

       Therefore X is flipped here too.

       This is important for correct left/right movement.
    */

    return new THREE.Vector3(

        0.5 - lm.x,

        0.5 - lm.y,

        -lm.z

    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distance3D(a,b){

    return a.distanceTo(b);

}


/* =========================================================
   FACE RESULTS
========================================================= */

function onFaceResults(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        trackingReady = false;

        if(faceOccluder){
            faceOccluder.visible = false;
        }

        statusBox.innerText =
            "No face detected";

        return;
    }


    trackingReady = true;


    const lm =
        results.multiFaceLandmarks[0];


    /*
       Important landmarks
    */

    const leftCheek =
        mpPoint(lm[234]);

    const rightCheek =
        mpPoint(lm[454]);

    const forehead =
        mpPoint(lm[10]);

    const chin =
        mpPoint(lm[152]);

    const nose =
        mpPoint(lm[1]);

    const leftEye =
        mpPoint(lm[33]);

    const rightEye =
        mpPoint(lm[263]);


    /* =====================================================
       FACE CENTER
    ===================================================== */

    const horizontalCenter =
        leftCheek.clone()
        .add(rightCheek)
        .multiplyScalar(0.5);


    const verticalCenter =
        forehead.clone()
        .add(chin)
        .multiplyScalar(0.5);


    const faceCenter =
        horizontalCenter.clone()
        .add(verticalCenter)
        .multiplyScalar(0.5);


    /* =====================================================
       HEAD AXES
    ===================================================== */

    /*
       X = left -> right
    */

    let xAxis =
        rightCheek.clone()
        .sub(leftCheek)
        .normalize();


    /*
       Y = chin -> forehead
    */

    let yAxis =
        forehead.clone()
        .sub(chin)
        .normalize();


    /*
       Z = face depth direction
    */

    let zAxis =
        xAxis.clone()
        .cross(yAxis)
        .normalize();


    /*
       Make sure Z points toward the nose/camera.
    */

    const noseDirection =
        nose.clone()
        .sub(faceCenter);


    if(
        zAxis.dot(noseDirection) < 0
    ){

        zAxis.negate();

        xAxis.negate();

    }


    /*
       Rebuild Y so all 3 axes are orthogonal.
    */

    yAxis =
        zAxis.clone()
        .cross(xAxis)
        .normalize();


    /*
       Three.js rotation matrix
    */

    const rotationMatrix =
        new THREE.Matrix4();


    rotationMatrix.makeBasis(
        xAxis,
        yAxis,
        zAxis
    );


    const targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromRotationMatrix(
        rotationMatrix
    );


    /* =====================================================
       FACE SIZE
    ===================================================== */

    const faceWidth =
        distance3D(
            leftCheek,
            rightCheek
        );


    const faceHeight =
        distance3D(
            forehead,
            chin
        );


    /* =====================================================
       SCREEN -> THREE POSITION
    ===================================================== */

    /*
       faceCenter is already mirrored.

       Convert it into Three.js screen/world coordinates.
    */

    const targetX =
        faceCenter.x * 3.4;


    const targetY =
        faceCenter.y * 2.7;


    /*
       Small depth correction.

       The model sits around the head,
       not far in front of it.
    */

    const targetZ =
        depthOffset * 0.45;


    const targetPosition =
        new THREE.Vector3(
            targetX,
            targetY + verticalOffset * 0.5,
            targetZ
        );


    /* =====================================================
       MODEL SCALE
    ===================================================== */

    /*
       Automatically scale model according to face width.
    */

    let targetScale =
        faceWidth * 3.0;


    targetScale *= modelScale;


    targetScale =
        clamp(
            targetScale,
            0.18,
            4.0
        );


    /* =====================================================
       SMOOTH POSITION
    ===================================================== */

    smoothPosition.lerp(
        targetPosition,
        POSITION_SMOOTH
    );


    /* =====================================================
       SMOOTH ROTATION
    ===================================================== */

    if(!initializedPose){

        smoothQuaternion.copy(
            targetQuaternion
        );

        initializedPose = true;

    }else{

        smoothQuaternion.slerp(
            targetQuaternion,
            ROTATION_SMOOTH
        );

    }


    /* =====================================================
       SMOOTH SCALE
    ===================================================== */

    smoothScale +=
        (
            targetScale -
            smoothScale
        ) * SCALE_SMOOTH;


    /* =====================================================
       APPLY TO MODEL
    ===================================================== */

    modelContainer.position.copy(
        smoothPosition
    );

    modelContainer.quaternion.copy(
        smoothQuaternion
    );

    modelContainer.scale.setScalar(
        smoothScale
    );


    /* =====================================================
       FACE OCCLUDER UPDATE
    ===================================================== */

    updateFaceOccluder(
        faceCenter,
        faceWidth,
        faceHeight,
        smoothQuaternion
    );


    statusBox.innerText =
        "3D Head Tracking ON";
}


/* =========================================================
   FACE OCCLUDER UPDATE
========================================================= */

function updateFaceOccluder(
    faceCenter,
    faceWidth,
    faceHeight,
    quaternion
){

    if(!faceOccluder) return;


    faceOccluder.visible = true;


    /*
       Same position as head.
    */

    faceOccluder.position.copy(
        smoothPosition
    );


    faceOccluder.quaternion.copy(
        quaternion
    );


    /*
       Convert face dimensions into world scale.
    */

    const widthWorld =
        faceWidth * 3.4;


    const heightWorld =
        faceHeight * 2.7;


    /*
       Ellipsoid dimensions.

       X = face width
       Y = face height
       Z = head depth
    */

    faceOccluder.scale.set(

        widthWorld * 0.62,

        heightWorld * 0.62,

        widthWorld * 0.48

    );


    /*
       Move occluder slightly toward camera
       so the face gets priority over the model.
    */

    faceOccluder.position
        .add(
            new THREE.Vector3(0,0,0.015)
                .applyQuaternion(quaternion)
        );
}


/* =========================================================
   RENDER LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(renderer && scene && arCamera){

        renderer.render(
            scene,
            arCamera
        );

    }
}

</script><script>

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(object){

    if(!object) return;


    /*
       Remove previous model
    */

    if(currentModel){

        modelContainer.remove(
            currentModel
        );

        currentModel = null;
    }


    currentModel = object;


    /* =====================================================
       MATERIAL SETTINGS
    ===================================================== */

    currentModel.traverse(function(child){

        if(child.isMesh){

            if(child.material){

                if(Array.isArray(child.material)){

                    child.material.forEach(
                        setupMaterial
                    );

                }else{

                    setupMaterial(
                        child.material
                    );

                }

            }

            /*
               Make sure model can render both sides.
            */

            child.material &&
            (
                Array.isArray(child.material)
                ?
                child.material.forEach(
                    m => m.side = THREE.DoubleSide
                )
                :
                child.material.side =
                    THREE.DoubleSide
            );

        }

    });


    /* =====================================================
       NORMALIZE MODEL
    ===================================================== */

    const box =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(maxSize > 0){

        const normalizeScale =
            1.8 / maxSize;


        currentModel.scale.setScalar(
            normalizeScale
        );

    }


    /*
       Recalculate bounding box after scaling.
    */

    const box2 =
        new THREE.Box3()
        .setFromObject(
            currentModel
        );


    const center2 =
        box2.getCenter(
            new THREE.Vector3()
        );


    /*
       Put model origin near its geometric center.

       This works best for head/helmet/mask meshes.
    */

    currentModel.position.sub(
        center2
    );


    /*
       Keep model centered.
    */

    currentModel.position.y += 0.02;


    /*
       Add to head container.
    */

    modelContainer.add(
        currentModel
    );


    /*
       Character renders after face occluder.
    */

    currentModel.traverse(function(child){

        if(child.isMesh){

            child.renderOrder = 1;

            if(child.material){

                if(Array.isArray(child.material)){

                    child.material.forEach(function(mat){

                        mat.depthTest = true;

                        mat.depthWrite = true;

                        mat.transparent =
                            mat.transparent || false;

                    });

                }else{

                    child.material.depthTest = true;

                    child.material.depthWrite = true;

                }

            }

        }

    });


    /*
       Reset pose smoothing.
    */

    initializedPose = false;

    smoothPosition.set(
        0,
        0,
        0
    );

    smoothQuaternion.identity();

    smoothScale = 1;


    statusBox.innerText =
        "3D Model Loaded • Move your head";


    console.log(
        "3D model loaded:",
        currentModel
    );
}


/* =========================================================
   MATERIAL
========================================================= */

function setupMaterial(material){

    if(!material) return;

    material.side =
        THREE.DoubleSide;

    material.needsUpdate = true;
}


/* =========================================================
   GLB / GLTF
========================================================= */

function loadGLTF(file){

    const loader =
        new THREE.GLTFLoader();


    const reader =
        new FileReader();


    reader.onload = function(event){

        const arrayBuffer =
            event.target.result;


        loader.parse(

            arrayBuffer,

            "",

            function(gltf){

                prepareModel(
                    gltf.scene
                );

            },

            function(error){

                console.error(
                    error
                );

                statusBox.innerText =
                    "GLTF loading error";

            }

        );

    };


    reader.readAsArrayBuffer(
        file
    );
}


/* =========================================================
   OBJ
========================================================= */

function loadOBJ(file){

    const loader =
        new THREE.OBJLoader();


    const reader =
        new FileReader();


    reader.onload = function(event){

        try{

            const object =
                loader.parse(
                    event.target.result
                );


            prepareModel(
                object
            );


        }catch(error){

            console.error(
                error
            );

            statusBox.innerText =
                "OBJ loading error";

        }

    };


    reader.readAsText(
        file
    );
}


/* =========================================================
   FBX
========================================================= */

function loadFBX(file){

    const loader =
        new THREE.FBXLoader();


    const reader =
        new FileReader();


    reader.onload = function(event){

        try{

            const object =
                loader.parse(
                    event.target.result,
                    ""
                );


            prepareModel(
                object
            );


        }catch(error){

            console.error(
                error
            );

            statusBox.innerText =
                "FBX loading error";

        }

    };


    reader.readAsArrayBuffer(
        file
    );
}


/* =========================================================
   FILE IMPORT
========================================================= */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file) return;


        const name =
            file.name.toLowerCase();


        statusBox.innerText =
            "Loading 3D model...";


        if(name.endsWith(".glb") ||
           name.endsWith(".gltf")){

            loadGLTF(
                file
            );

        }

        else if(
            name.endsWith(".obj")
        ){

            loadOBJ(
                file
            );

        }

        else if(
            name.endsWith(".fbx")
        ){

            loadFBX(
                file
            );

        }

        else{

            statusBox.innerText =
                "Unsupported 3D format";

        }

    }
);


/* =========================================================
   SIZE SLIDER
========================================================= */

document
.getElementById("sizeSlider")
.addEventListener(
    "input",
    function(){

        modelScale =
            parseFloat(
                this.value
            );

    }
);


/* =========================================================
   VERTICAL SLIDER
========================================================= */

document
.getElementById("verticalSlider")
.addEventListener(
    "input",
    function(){

        verticalOffset =
            parseFloat(
                this.value
            );

    }
);


/* =========================================================
   DEPTH SLIDER
========================================================= */

document
.getElementById("depthSlider")
.addEventListener(
    "input",
    function(){

        depthOffset =
            parseFloat(
                this.value
            );

    }
);


/* =========================================================
   RESET
========================================================= */

function resetModel(){

    modelScale = 1;

    verticalOffset = 0;

    depthOffset = 0;


    document.getElementById(
        "sizeSlider"
    ).value = 1;


    document.getElementById(
        "verticalSlider"
    ).value = 0;


    document.getElementById(
        "depthSlider"
    ).value = 0;


    initializedPose = false;


    smoothPosition.set(
        0,
        0,
        0
    );


    smoothQuaternion.identity();


    if(currentModel){

        currentModel.rotation.set(
            0,
            0,
            0
        );

    }


    statusBox.innerText =
        "Reset complete";

}


/* =========================================================
   CAMERA FLIP
========================================================= */

function flipCamera(){

    cameraFacing =
        cameraFacing === "user"
        ? "environment"
        : "user";


    startCamera();

}


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

    try{

        if(mpCamera){

            try{

                mpCamera.stop();

            }catch(e){}

        }


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:cameraFacing
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        /*
           Front camera is mirrored.

           Rear camera is not mirrored.
        */

        if(cameraFacing === "user"){

            video.style.transform =
                "scaleX(-1)";

        }else{

            video.style.transform =
                "scaleX(1)";

        }


        statusBox.innerText =
            "Camera ready • Face tracking starting";


        /*
           Restart MediaPipe camera wrapper.
        */

        if(mpCamera){

            try{
                mpCamera.stop();
            }catch(e){}

        }


        mpCamera =
            new Camera(
                video,
                {

                    onFrame:async function(){

                        if(faceMesh){

                            await faceMesh.send({
                                image:video
                            });

                        }

                    },

                    width:1280,
                    height:720

                }
            );


        mpCamera.start();


    }catch(error){

        console.error(
            error
        );


        statusBox.innerText =
            "Camera permission/error";

    }
}


/* =========================================================
   SNAPSHOT
========================================================= */

function takeSnapshot(){

    if(!renderer){

        return;
    }


    /*
       The Three.js canvas is transparent.
       This captures the AR layer itself.
    */

    const image =
        canvas.toDataURL(
            "image/png"
        );


    const link =
        document.createElement("a");


    link.href =
        image;


    link.download =
        "azeez-ar.png";


    link.click();

}


/* =========================================================
   INITIALIZE APP
========================================================= */

async function startApp(){

    init3D();

    initFaceTracking();

    await startCamera();

}


/* =========================================================
   START
========================================================= */

startApp();

</script>
