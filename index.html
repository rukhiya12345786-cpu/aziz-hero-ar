<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>3D Face Capture Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#cameraCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#status{
    position:fixed;
    top:15px;
    left:10px;
    right:10px;
    z-index:20;

    padding:12px;

    background:rgba(0,0,0,.75);
    color:white;

    border-radius:10px;

    font-family:Arial;
    font-size:15px;
    text-align:center;
}

#start{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    z-index:30;

    padding:16px 25px;
    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline
       muted
       style="display:none">
</video>

<canvas id="cameraCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div id="status">READY</div>

<button id="start">START 3D FACE</button>


<!-- =====================================================
     TENSORFLOW.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>


<!-- =====================================================
     FACE LANDMARKS DETECTION
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js"></script>


<!-- =====================================================
     MEDIAPIPE FACE MESH RUNTIME
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const cameraCanvas =
document.getElementById("cameraCanvas");

const threeCanvas =
document.getElementById("threeCanvas");

const status =
document.getElementById("status");

const start =
document.getElementById("start");

const ctx =
cameraCanvas.getContext("2d");


/* =====================================================
   THREE
===================================================== */

const scene =
new THREE.Scene();

const camera3D =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera3D.position.z = 5;


const renderer =
new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


/* =====================================================
   HEAD ANCHOR
===================================================== */

const head =
new THREE.Group();

scene.add(head);


/* =====================================================
   3D TEST MASK
===================================================== */

const mask =
new THREE.Mesh(
    new THREE.BoxGeometry(
        0.65,
        0.65,
        0.65
    ),
    new THREE.MeshNormalMaterial()
);

head.add(mask);


/* =====================================================
   FACE DETECTOR
===================================================== */

let detector = null;

let running = false;

let detecting = false;


/* =====================================================
   LOAD
===================================================== */

async function loadFace(){

    status.innerText =
    "LOADING 3D FACE TRACKER...";


    await tf.ready();


    /*
       WebGL GPU
    */

    try{
        await tf.setBackend("webgl");
    }catch(e){
        console.log(e);
    }


    await tf.ready();


    const model =
    faceLandmarksDetection.SupportedModels
    .MediaPipeFaceMesh;


    detector =
    await faceLandmarksDetection.createDetector(
        model,
        {
            runtime:"mediapipe",

            solutionPath:
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619",

            maxFaces:1,

            refineLandmarks:true
        }
    );


    status.innerText =
    "3D FACE TRACKER READY ✓";
}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    const stream =
    await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:"user",

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            }
        },

        audio:false
    });


    video.srcObject =
    stream;

    await video.play();


    status.innerText =
    "CAMERA ON ✓\n\nLOOK AT CAMERA";
}


/* =====================================================
   CAMERA DRAW
===================================================== */

function drawCamera(){

    requestAnimationFrame(
        drawCamera
    );


    if(
        video.readyState < 2 ||
        !video.videoWidth
    ){
        return;
    }


    const cw =
    cameraCanvas.width;

    const ch =
    cameraCanvas.height;

    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    const scale =
    Math.max(
        cw/vw,
        ch/vh
    );


    const drawW =
    vw*scale;

    const drawH =
    vh*scale;

    const x =
    (cw-drawW)/2;

    const y =
    (ch-drawH)/2;


    /*
       KEEP THE WORKING
       MIRRORED CAMERA.
    */

    ctx.save();

    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );

    ctx.translate(
        cw,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        video,
        0,
        0,
        vw,
        vh,
        x,
        y,
        drawW,
        drawH
    );

    ctx.restore();
}


/* =====================================================
   FACE TRACKING
===================================================== */

async function trackFace(){

    if(
        !running ||
        !detector ||
        detecting
    ){
        requestAnimationFrame(
            trackFace
        );
        return;
    }


    detecting = true;


    try{

        const faces =
        await detector.estimateFaces(
            video,
            {
                flipHorizontal:false
            }
        );


        if(
            !faces ||
            faces.length === 0
        ){

            mask.visible = false;

            status.innerText =
            "FACE NOT FOUND";

            detecting = false;

            requestAnimationFrame(
                trackFace
            );

            return;
        }


        mask.visible = true;


        const face =
        faces[0];


        const points =
        face.keypoints;


        /*
           NOSE TIP
           approximate central point
        */

        const nose =
        points[1];


        /*
           FACE CENTER
        */

        const centerX =
        (face.box.xMin +
         face.box.xMax) / 2;

        const centerY =
        (face.box.yMin +
         face.box.yMax) / 2;


        /*
           FACE SIZE
        */

        const faceWidth =
        face.box.width;

        const faceHeight =
        face.box.height;


        /*
           CAMERA PIXELS
           -> THREE POSITION
        */

        const nx =
        centerX /
        video.videoWidth;

        const ny =
        centerY /
        video.videoHeight;


        const worldX =
        (0.5 - nx) * 5.0;


        const worldY =
        (0.5 - ny) * 4.0;


        /*
           Distance / size.
        */

        const size =
        Math.max(
            faceWidth,
            faceHeight
        );


        const worldZ =
        -size /
        180;


        head.position.x =
        THREE.MathUtils.lerp(
            head.position.x,
            worldX,
            0.35
        );

        head.position.y =
        THREE.MathUtils.lerp(
            head.position.y,
            worldY,
            0.35
        );

        head.position.z =
        THREE.MathUtils.lerp(
            head.position.z,
            worldZ,
            0.35
        );


        /* =================================================
           REAL 3D ROTATION FROM FACE LANDMARK GEOMETRY
        ================================================= */


        /*
           LEFT EYE
           RIGHT EYE
        */

        const leftEye =
        points.find(
            p => p.name === "leftEye"
        );

        const rightEye =
        points.find(
            p => p.name === "rightEye"
        );


        /*
           Use known indices if names
           are unavailable.
        */

        const L =
        points[33];

        const R =
        points[263];

        const forehead =
        points[10];

        const chin =
        points[152];


        /*
           ROLL

           Eye line angle.
        */

        const dx =
        R.x - L.x;

        const dy =
        R.y - L.y;


        const roll =
        Math.atan2(
            dy,
            dx
        );


        /*
           YAW

           Nose depth relative to eyes.
        */

        const eyeCenterZ =
        (L.z + R.z) / 2;


        const yawValue =
        (nose.z -
         eyeCenterZ) /
        Math.max(
            Math.abs(faceWidth),
            1
        );


        const yaw =
        THREE.MathUtils.clamp(
            yawValue * 3.0,
            -1.2,
            1.2
        );


        /*
           PITCH

           Nose/forehead/chin geometry.
        */

        const faceVertical =
        chin.y -
        forehead.y;


        const noseRelative =
        (nose.y -
         forehead.y) /
        Math.max(
            faceVertical,
            1
        );


        const pitch =
        THREE.MathUtils.clamp(
            (noseRelative - 0.5) * 2.0,
            -1.0,
            1.0
        );


        /*
           SMOOTH 3D ROTATION
        */

        const targetEuler =
        new THREE.Euler(
            pitch,
            yaw,
            roll,
            "YXZ"
        );


        const targetQuat =
        new THREE.Quaternion()
        .setFromEuler(
            targetEuler
        );


        head.quaternion.slerp(
            targetQuat,
            0.35
        );


        /*
           FACE SIZE
           makes the test object stay
           attached to face scale.
        */

        const targetScale =
        THREE.MathUtils.clamp(
            faceWidth / 260,
            0.45,
            2.0
        );


        const smoothScale =
        THREE.MathUtils.lerp(
            head.scale.x,
            targetScale,
            0.3
        );


        head.scale.set(
            smoothScale,
            smoothScale,
            smoothScale
        );


        status.innerText =
        "3D FACE TRACKING ✓\n\n" +
        "478 LANDMARKS ✓\n" +
        "POSITION ✓\n" +
        "DEPTH ✓\n" +
        "ROTATION ✓";


    }catch(error){

        console.error(
            "TRACK ERROR",
            error
        );

        status.innerText =
        "TRACK ERROR\n\n" +
        error.message;
    }


    detecting = false;


    requestAnimationFrame(
        trackFace
    );
}


/* =====================================================
   START
===================================================== */

start.onclick =
async function(){

    start.disabled =
    true;

    try{

        await loadFace();

        await openCamera();

        running =
        true;

        start.style.display =
        "none";

        drawCamera();

        trackFace();

    }catch(error){

        console.error(error);

        status.innerText =
        "START ERROR\n\n" +
        error.name +
        "\n\n" +
        error.message;

        start.disabled =
        false;
    }
};


/* =====================================================
   RENDER
===================================================== */

function render(){

    requestAnimationFrame(
        render
    );

    renderer.render(
        scene,
        camera3D
    );
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const w =
    window.innerWidth;

    const h =
    window.innerHeight;


    cameraCanvas.width =
    w;

    cameraCanvas.height =
    h;


    renderer.setSize(
        w,
        h
    );


    camera3D.aspect =
    w/h;

    camera3D.updateProjectionMatrix();
}


window.addEventListener(
    "resize",
    resize
);

resize();

render();

</script>

</body>
</html>
